  load_order_contracts: [the lowered cuRobo support cuboid remains only a fixed-mount seam accommodation, it cannot authorize moving holder clearance, the real profile floor_z_m and manifest clearance remain authoritative, recovery prefixes are rechecked, common executor repeats validation, no planner fallback or direct motor path]
