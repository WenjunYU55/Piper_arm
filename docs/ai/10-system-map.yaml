  staged_home_profile: {path: piper_home_pose.json, schema: 4, current_hash: 9cd1f62264699e86f047c1bfe0010d10084d3b6b239df17de7386b5b2f18fb66, current_rough_ready_rad: [0.0, 0.0, 0.0, 0.0, 0.399345492, 0.0], current_pre_home_rad: [0.0, 0.400357244, -0.498793736, 0.0, 0.600614364, 0.0], current_storage_j6_rad: -3.139536232, startup_wrist_direction: increasing, storage_wrist_direction: decreasing, current_status: hash/limits and software regression valid, physical_status: supervised five-percent startup retry remains required after the earlier J6 fault and the later stale-transaction reset, authority: operator direction requirement plus exact profile/request/trajectory hash and control-feedback proof}
