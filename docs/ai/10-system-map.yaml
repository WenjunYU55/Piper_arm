schema_version: 1
document: system_map
curobo_fixed_rate_transport_path_2026_09_02:
  load_order: [cuRobo collision-qualified interpolated native path, canonical joint reorder and raw-limit validation, independent per-native-segment tick allocation, exact on-segment 20 Hz position targets, generic MotionPlan hash and validation, common PlanAuthorizer and runtime gates, unchanged TrajectoryRunner, unchanged PiPER MoveJ JointCtrl adapter]
  load_order_contracts: [every native vertex remains ordered, no segment corner is shortcut, native segment duration is not accelerated, speed-scaled MoveJ finite difference and 0.05 rad ceiling both hold, timestamps differ by exactly 0.05 seconds, output above 60000 points fails closed, planner never commands PiPER]
curobo_runtime_parity_path_2026_09_02:
  load_order: [fresh reachability batch admission snapshot, capability-supported bounded target rays, backend-neutral motion request, cuRobo exact-aim then fallback semantic goal construction, fixed 54-pose goal-set padding, persistent MotionGen solve, generic MotionPlan validation, generic shortlist-exhaustion handling, common authorization execution and capture]
  home_compatibility_path: [legacy generic RETURN_HOME request, manifest-authorized direct-home stage, exact measured start and raw-limit checks, two-point direct segment, dense cuRobo link6 FK holder/L515 floor proof, generic response validation]
  load_order_contracts: [stale input at batch admission remains rejected, batch CPU duration does not invalidate admitted evidence, semantic ray endpoints stay inside declared supported intervals, goal-set padding cannot add a new semantic endpoint, planner exhaustion never becomes an accepted or permanent ray cull, production automatic home continues through ExecuteHomeStage, no backend commands the robot and no automatic planner fallback exists]
curobo_target_visible_plan_path_2026_09_01:
  load_order: [generic MULTIVIEW_SCAN request with frozen target and session count, cuRobo collision-safe MotionGen result, common 20 Hz joint-path normalization, batch camera_optical_frame FK, dense target-distance and boresight qualification, retry remaining roll fallback look or candidate on rejection, generic MotionPlan publication, independent bridge and executor validation, authorization and runtime execution]
  load_order_contracts: [accepted_views zero selects the one-time non-worsening first-alignment rule ending within the candidate-bound capture aim, later views remain inside the ordinary cone, backend rejection cannot retire or accept a ray as an executed capture, executor validation remains mandatory, no planner fallback or robot command exists in the worker]
target_observation_range_path_2026_09_01:
  load_order: [active L515 640x480 depth and colour, GroundingDINO target detection, SAM2 exact mask, coherent confidence-qualified target depth within 0.24 through 3.00 m, timestamped base_link tracking, first-ray framing and 0.28-through-3.00 m ray request, capability-map active interval narrowing, exact selected-planner feasibility, common authorization and execution, settled capture, measured-surface and NBV update, offline reconstruction with 3.00 m depth truncation]
  independent_local_scene: Obstacle-instance projection and target_cloud coarse scene accumulation remain capped at 1.20 m; neither is the target visibility owner.
  load_order_contracts: [semantic mask and coherent target depth precede Target3D, observation inside 3.00 m does not bypass quality, capability support does not bypass exact planning, accepted target depth alone updates measured coverage, no automatic base reposition or planner fallback]
planner_benchmark_load_order_2026_09_01:
  sequence: [frozen backend-neutral fixture, backend-specific volatile selector, isolated worker, common response validation, exact Tesseract path revalidation, portable evidence report, Chapter 5 analysis]
  load_order_contracts: [no planner worker receives motion authority, cuRobo success remains a proposal until exact validation, private worker cleanup precedes report completion, mission phase diagnostics are written only at the existing result boundary]
bounded_wall_hole_repair_path_2026_09_01:
  load_order: [immutable capture admission, selected depth geometry replay, registration and TSDF integration, measured-support-aware connected-target fragment cleanup, optional mesh_repair measured_wall triangulation, atomic source-and-repair-specific output, quality and interpolation report, GUI viewer]
  source_of_truth: reconstruction/mesh_repair.py
  boundary: The repair consumes only the cleaned offline TSDF mesh. Raw TSDF registration evidence, measured and consensus clouds, texture geometry, captures, mission state and robot processes are unchanged.
rough_acquisition_partial_target_load_order_2026_08_27:
  sequence: [executor publishes correlated rough_acquisition_viewpoint request, bridge snapshots a fresh post-settle RGB-D frame, ROS-free worker binds request_reason to that immutable job, GroundingDINO validates semantic confidence and green appearance without clean-view box proportions, SAM2 refines the visible support, aligned depth creates measured target evidence, tracker reaches LOCKED, executor cancels remaining rough looks]
  load_order_contracts: [request reason is job-local, relaxation applies only to rough acquisition, strict validation remains default, measured mask and depth still precede LOCKED]
capture_one_occlusion_load_order_2026_08_27:
  sequence: [MissionEngine starts workflow after ACQUIRED, workflow exposes measured-lock SCAN_READY without a heavy probe, planner creates bootstrap rays, first path safely aligns from the acquired pose to within 5 degrees, executor verifies achieved aim and framing, capture recorder persists a pending model seed, workflow requests one correlated heavy occlusion scene, clear or qualified labelled-occluded evidence advances accepted_views, executor promotes visible target-mask evidence and publishes capture-one history, planner revolves the model and creates the qualified population]
  load_order_contracts: [bounded first alignment precedes achieved 5-degree gate, capture persistence precedes semantic probe, capture one may persist fresh classified partial or heavy depth occlusion but remains unaccepted, UNKNOWN LOST missing or stale occlusion still rejects, classified semantic probe acceptance precedes history promotion, history promotion precedes revolution and qualified rays, occlusion labels persist into capture history]
  fail_closed: Probe timeout target re-detection failure malformed correlation unsafe geometry and unqualified evidence abort while the arm holds. Qualified meaningful occlusion is labelled and continues without automatic occluder manipulation.
executor_callback_load_order_2026_08_27:
  scheduler_groups: [200 Hz timer, state-mutating subscriptions and services, high-rate telemetry subscriptions, outbound service-client responses]
  serialization: Timer and state-mutating callbacks enter one control_state_lock even though their scheduler groups differ. Telemetry writes immutable TelemetryStore snapshots and does not mutate the state machine. Client responses only complete futures consumed by the locked timer.
  load_order_contracts: [proposal validation completes before approval can authorize motion, approval and cancel cannot race a motion tick, capture service responses cannot wait behind the 200 Hz timer, no callback group other than the executor state machine may publish joint commands]
acquisition_workflow_ownership_2026_08_27:
  flow: [scan_target_acquisition prepares and requests ROUGH_ACQUISITION plan, executor reports ACQUIRED and holds, MissionEngine observes acquisition completion, target_scan_mission_node calls /supervised_cube_workflow/start once, coordinator polls diagnostic state, SCAN_READY plus measured_lock_ready authorizes continued mission planning]
  exclusion: scan_target_acquisition does not consume scan execution/workflow status and cannot start the supervised workflow.
  transient_rule: SCAN_READY without current measured-lock authority remains inside bounded assessment polling; it never authorizes planning or motion.
responsibility_package_load_order_2026_08_27:
  sequence: [ROS nodes import mission infrastructure and execution owners, mission engine imports mission core and infrastructure failure model, execution authorization imports execution motion, mission spool imports mission core, compatibility facades import one-way from owners, pure owners never import facades or ROS nodes]
  load_order_contracts: [facade imports are one-way only, package owners remain ROS-free, mission engine remains the only mission progression authority, process supervisor owns mechanics but not mission policy, no facade may dynamically call back into its legacy module]
  compatibility: Existing import paths remain installed and resolve to the identical class function enum and constant objects exported by the new owners.
execution_owner_load_order_2026_08_27:
  sequence: [executor receives normalized ROS plan, execution authorization validates identity stage and policy, execution motion and validation prove path and schedule, execution trajectory monitors the authorized command sequence, execution capture coordinates settled persistence, execution recovery selects the existing retry or abort result]
  load_order_contracts: [the executor node remains the only autonomous joint-command publisher, authorization precedes command, live motion gates remain in force, capture follows settled achieved pose, compatibility facades are never imported by owners]
planning_owner_load_order_2026_08_27:
  sequence: [planner builds stable generation and bounded ray population, capability and reachability evidence cull candidates, permanent ray ledger prunes before rank, coverage owner scores surviving candidates from accepted evidence, planner publishes unchanged shortlist contract, the mission-selected Tesseract or cuRobo backend remains exact feasibility authority]
  load_order_contracts: [generation identity precedes culls, hard culls never resurrect within one population, accepted coverage precedes NBV rerank, planning owners remain ROS-free, compatibility facades import owners one-way]
perception_owner_load_order_2026_08_27:
  sequence: [ROS perception adapters produce correlated mask depth and transforms, perception owners validate and derive target obstacle landmark and occlusion evidence, capture persists the exact accepted seed, planning consumes validated envelope and centre, workflow consumes repeated occlusion policy result]
  load_order_contracts: [rough or cropped evidence cannot become qualified model geometry, capture-one seed remains authoritative, planning never owns perception measurement, contact policy retains repeated correlated evidence, facades import owners one-way]
tesseract_owner_load_order_2026_08_27:
  sequence: [bridge snapshots ROS evidence, candidate_selection validates and bounds the existing ordered handoff, protocol contract validates and hashes the request, protocol spool atomically transfers it, worker performs unchanged exact planning, protocol contract validates the response, bridge publishes the unchanged ROS proposal and status]
  load_order_contracts: [candidate_selection and protocol owners remain ROS-free, protocol spool depends on protocol contract constants and canonical bytes, the compatibility contract facade imports owners one-way, bridge remains command-free, worker never imports bridge or ROS, worker retains its exact old facade import because the committed capability artifact hashes worker.py]
  compatibility: Former bridge helper attributes and the installed piper_tesseract_foxy.contract path remain available as identical owner objects.
gui_adapter_load_order_2026_08_27:
  sequence: [piper_gui/app.py initializes the ROS runtime, piper_gui/ros_node.py creates the unchanged endpoints and converts events, piper_gui/ros_client.py manages action futures, piper_gui/native_app.py renders events and explicit commissioning state]
  load_order_contracts: [Tk presentation depends on the ROS adapter, the ROS adapter never imports piper_gui_native, MissionEngine remains the sole autonomous mission progression owner, piper_gui_native retains a one-way class compatibility export]
reconstruction_input_load_order_2026_08_27:
  sequence: [input_provenance validates immutable manifest artifacts calibration and capture schema, optional offline resegmentation produces hash-bound derived masks, tsdf_reconstruct resolves the frozen geometry_source, projected_color_depth follows the legacy rectified path or native_depth reverse-correlates accepted winners through native_depth.py, selected registration and one shared TSDF fusion run, quality report and source-specific outputs are written]
  load_order_contracts: [input admission precedes native replay and Open3D integration, native_depth depends only on NumPy and immutable metadata arrays, offline_resegment imports input_provenance rather than the orchestrator, tsdf_reconstruct depends one-way on input_provenance native_depth and texture_baking, direct script execution retains local import fallbacks]
native_l515_reconstruction_path_2026_09_01:
  sequence: [select native_depth in GUI or CLI, validate schema-2 native depth PNG/NPY confidence projected target depth and support plus exact hashes, project native samples through recorded T_color_depth and colour distortion, correlate exactly one confidence-qualified native winner to every accepted colour support pixel within 1 mm, retain those samples on the native pinhole grid, compose T_base_depth from recorded T_base_color and T_color_depth, run unchanged registration TSDF cleanup metrics and quality classification, write target_mesh.native_depth outputs separately]
  ownership: {reverse_correlation_and_transform: reconstruction/native_depth.py, orchestration_registration_and_TSDF: reconstruction/tsdf_reconstruct.py, bounded_GUI_arguments_and_separate_paths: reconstruction/gui_support.py, presentation: piper_gui/native_app.py}
  compatibility: projected_color_depth remains the default and keeps target_mesh.ply; native mode is command-free and cannot change capture NBV ROS motion or automatic reconstruction defaults.
driver_joint_policy_load_order_2026_08_27:
  sequence: [driver receives raw CAN or ROS command evidence, joint_state_policy deterministically decodes maps or validates it, PiperRosNode retains all SDK state timing watchdog publication and command side effects]
  load_order_contracts: [joint_state_policy imports only math, driver depends one-way on policy, no CAN SDK ROS threading or time source moved into policy, old driver exports remain compatible]
ray_diagnostics_storage_path_2026_08_27:
  runtime_load_order: [planner reachability filter bridge and coordinator resolve PIPER_ARM_ROOT, every writer constructs datasets/ray_diagnostics, unique mission or session directory is created, the existing per-directory lock selects or retains its report basename, GUI discovers canonical and legacy roots but historical replay writes only canonical]
  load_order_contracts: [deploy and restart all diagnostic-producing nodes together so one mission cannot split across old and new roots, preserve one root per new mission, canonical root is searched before the legacy root for unqualified historical selections, path containment is enforced independently for each root]
  current_root: datasets/ray_diagnostics/<mission_id-or-session_id>/
  legacy_read_root: datasets/active_scan/ray_diagnostics/<mission_id-or-session_id>/
  authority: {writer defaults: planner reachability filter bridge mission terminal adapter and offline simulator, GUI root selection and legacy read compatibility: piper_gui/ray_reports.py, artifact layout and locking: ray_mission_diagnostics.py}
ray_review_internal_filename_load_order_2026_08_27:
  sequence: [all diagnostic-producing nodes start from one updated installation, first writer enters the unique mission or session directory, writer acquires the unchanged hidden diagnostics lock, writer selects an existing new or legacy artifact or creates RayProcesses - HH:MM - DD-MM-YYYY from its earliest event, later writers acquire the same lock and append to the discovered stem, GUI discovers the canonical file after atomic replacement]
  load_order_contracts: [restart planner reachability filter bridge and mission coordinator together after deployment so no old fixed-basename writer overlaps an updated dynamic-basename writer, keep unique mission or session directory creation before report selection, acquire the fixed lock before basename discovery, create JSON before the compatibility HTML atomic replacement, open only after canonical JSON discovery]
  failure_behavior: More than one JSON report inside a single unique session directory is ambiguous and is rejected from append or GUI discovery rather than guessed. Same-minute names in different unique directories are valid.
  authority: {internal basename and append lock: ray_mission_diagnostics.py, discovery and unique-directory selection: piper_gui/ray_reports.py, presentation: piper_gui/native_app.py and ray_review_viewer.py}
capture_one_model_seed_load_order_2026_08_26:
  sequence: [executor reaches and settles first scan ray, executor proves target aim and uses fresh live silhouette only for border admission, recorder collects and qualifies the exact capture-one RGB mask and settled depth burst, recorder looks up base-from-camera at capture depth time, recorder builds and persists a hash-bound shape-plus-transform model seed, private Trigger response returns the same seed, executor validates it before workflow acceptance, accepted history promotes shape and seed atomically, planner validates history and builds the revolution directly from the recorded matrix, planner replaces bootstrap rays with the qualified population]
  load_order_contracts: [capture files and metadata exist before Trigger success, model seed exists before workflow capture request, workflow acceptance precedes history promotion, history promotion precedes generation-one readiness, planner never queries live TF when qualified_target_model_seed exists]
  failure_behavior: Missing malformed mismatched unsynchronized or digest-invalid seed aborts capture one before accepted history. A legacy shape-only command-free replay may retain the old lookup compatibility path, but production capture results must carry the bound seed.
  data_owners: {persisted mask depth CameraInfo and transform: scan_capture_node.py, seed schema and digest: target_envelope.py, admission and accepted promotion: scan_viewpoint_executor_node.py, history validation: scan_session_memory.py, envelope and ray freeze: scan_viewpoint_planner_node.py}
  physical_evidence: Task codex-e2e-model-seed-20260827-0123 followed this order, promoted capture one only after persistence, made generation one ready with 353 rays, accepted captures two and three and then completed guarded operator cancellation and safe shutdown.
object_sized_nbv_and_monotonic_ray_load_order_2026_08_26:
  load_order_contracts: [planner creates temporary bootstrap rays around the visible-surface lock, executor accepts the first complete settled aimed capture seed, planner builds the qualified revolution and takes axis_origin_m as the object and permanent-ray centre, planner replaces the bootstrap population exactly once, population-key mismatch resets bootstrap hard-cull evidence, target_envelope derives an object-sized coverage sphere at the same centre, nbv_coverage rebuilds accepted-only evidence there, matching qualified hard-cull ledgers prune before accepted-neighbour retirement, only qualified survivors receive fresh NBV rank, bridge shortlists survivors and classifies typed endpoint-static response evidence]
  stable_identity: Bootstrap and qualified populations intentionally have different digests because their centres differ. The qualified digest binds ray IDs normalized directions qualified object centre and frame; later representative positions and active standoff bounds are generation geometry rather than identity.
  coverage_geometry: The grey review volume is an NBV voxel sphere whose diameter equals max visible_axial_span_m visible_transverse_span_m and whose centre is the revolved axis origin. It is not the 0.250 m camera-surface clearance sphere.
  failure_lifetime: {session_static: workspace no-intersection capability no-support worker permanent endpoint flags and typed exhaustive RAY_IK_FAILURE, accepted_direction: inclusive 15-degree neighbourhood, retryable: framing collision path visibility timeout transport and generic planning failure}
first_scan_ray_framing_boundary_2026_08_26:
  path: rough ACQUIRED tracking lock -> planner creates temporary un-enveloped bootstrap rays around the visible-surface anchor -> Tesseract selects and moves to the first scan ray -> executor proves settle and <=5-degree achieved aim -> executor requires a post-settle silhouette for border classification only -> recorder persists the exact capture-one mask/depth and synchronized base-from-camera matrix -> executor validates the returned bound seed -> capture acceptance promotes and publishes the seed while capture rejection discards it -> planner revolves directly from the recorded matrix -> axis_origin_m becomes the qualified object centre -> planner replaces bootstrap rays once with the permanent 360-ray population around that centre -> later rays and grey coverage share the qualified centre
  load_order_contracts: [depth_to_3d publishes live shape with BEST_EFFORT/VOLATILE sensor-data QoS to the executor only, rough masks and pre-settle shapes cannot seed the model, generation-zero rays cannot depend on live shape timestamp ordering, recorder capture artifacts are the model-seed authority, executor admits the returned seed before workflow acceptance and promotes it only on accepted capture one, planner reads qualified_target_model_seed only from validated history and does not use delayed TF for it, scan history publishes framing_retry_ray_id and framing_retry_min_standoff_m before a retry generation, planner preserves the frozen ray ID and direction, Tesseract remains exact feasibility authority]
  authority: {application result mapping: mission_engine.py, settled evidence final endpoint aim and seed promotion: scan_viewpoint_executor_node.py, provisional pool qualified envelope and same-ray retry geometry: scan_viewpoint_planner_node.py, crop classification and revolution geometry: target_envelope.py, exact feasibility and motion: reachability bridge worker and executor}
  public_interface_change: none; qualified shape and retry evidence are additive private scan-session JSON. Superseded coordinator and acquisition framing paths were removed.
ray_review_target_layer_path_2026_08_26:
  runtime_evidence: [qualified mask/depth contour, build_revolution_envelope transforms and hash-binds visible_silhouette_points_m, planner freezes envelope, schema-v2 diagnostic event records exact envelope, ROS-free model derives presentation vertices only while loading, VTK viewer independently toggles smooth estimate boxes and source outline]
  backward_compatibility: Historical envelopes without visible_silhouette_points_m retain profile and collision-box rendering; source-outline rendering is absent rather than invented.
  authority_boundary: Viewer geometry never returns to planner, bridge, worker, executor, capture, safety, home or shutdown.
proposed_direction_dependent_fov_path_2026_08_26:
  status: proposed_not_implemented
  proposed_sequence: [frozen conservative target envelope, per-ray virtual camera aimed at anchor, calibrated projection through a roll-independent narrow aperture, nearest complete-fit standoff search, maximum with direction-specific surface clearance, configured request clipping, unchanged capability and Tesseract checks]
  fallback: Invalid projection evidence retains the current enclosing-sphere minimum; it must never create a closer ray bound.
  later_coordination: Rectangular roll-aware framing requires the same roll evidence to cross the private bridge boundary and be revalidated by the worker after IK.
  research_context: docs/ai/65-research-context.yaml
trusted_target_envelope_flow_2026_08_25:
  sequence: [qualified mask and depth, selected-component image-border completeness gate, private exact-stamp valid silhouette or clipped rejection, tracked base_link target, conservative frozen envelope, FOV and surface-clearance ray bound, capability-map bound, unchanged NBV rank, existing Tesseract box collision feasibility]
  failure_behavior: Missing or malformed shape withholds ray planning. A validated border crop may bootstrap only generation-zero provisional rays and becomes authoritative only after the first settled aimed endpoint. An unsupported valid-envelope ray remains in the immutable review population and is permanently culled once.
  unchanged: [public interfaces, target tracking, accepted coverage, Tesseract feasibility authority, motion, capture, home and shutdown]
target_relative_capability_bound_path_2026_08_25:
  ownership_chain: [viewpoint_rays.py creates the finite target-relative 0.28 through 3.00 m camera/perception request, capability_map.py returns sampled arm-workspace support and contiguous standoff runs, viewpoint_reachability_filter_node.py preserves requested bounds and replaces active min/max with the outer supported envelope in enforce mode, bridge_node.py validates and carries run evidence while seeding across the complete supported interval, worker.py proves exact endpoint feasibility]
  data_contract: [ray_requested_min_standoff_m, ray_requested_max_standoff_m, ray_min_standoff_m, ray_max_standoff_m, ray_capability_intervals_m, ray_capability_bounded, desired_camera_position, ray_scoring_standoff_m]
  load_order_contract: The immutable capability artifact and selected floor must be validated before enforce-mode filtering. A valid enforcing artifact replaces fixed base_link radius and height gates. A missing or invalid artifact leaves the configured request under the conservative coarse fallback; it must not fabricate supported runs or narrow the request.
  authority_boundary: Capability support is sparse prequalification. The active envelope may span gaps between recorded supported runs, so every candidate still requires worker IK, joint-limit, collision, path, aim and dense-visibility validation.
mission_ray_evidence_and_static_cull_path_2026_08_25:
  runtime_load_order: [planner publishes the temporary bootstrap population and journal, reachability filter prequalifies it for capture one, accepted capture qualifies the object centre, planner publishes an explicit qualified-population replacement event and new identity, old-population culls fail identity matching and are reset, reachability filter and bridge create new centre-dependent evidence for the qualified population, planner merges only matching qualified source ledgers before accepted-neighbour retirement and later NBV ranking, accepted captures persist centred object-sized coverage, mission terminal result closes the journal]
  ownership: {population_identity_and_protocol: ray_hard_culls.py, complete_pool accepted-neighbour retirement and survivor ranking: scan_viewpoint_planner_node.py, qualified coverage size: target_envelope.py, coverage_persistence: nbv_coverage.py, workspace_and_capability_source: viewpoint_reachability_filter_node.py, endpoint_response_classification: piper_tesseract_foxy/bridge_node.py from worker typed diagnostics, journal_merge_and_html: ray_mission_diagnostics.py, GUI_discovery_and_child_lifecycle: piper_gui/ray_reports.py, offline_model_and_rendering: piper_gui/ray_review_model.py plus piper_gui/ray_review_viewer.py}
  load_order_contracts:
    - /piper/ray_hard_culls is private std_msgs/String with reliable transient-local QoS and depth sufficient to retain one complete snapshot from each of the two publishers.
    - A source snapshot is useful only after the planner has generated the matching mission/session/frame/count/SHA-256 population. Startup ordering cannot substitute for identity validation.
    - Source revisions bind the workspace/capability configuration or Tesseract model/calibration/limits. A changed revision replaces only that source's accumulated entries.
    - Diagnostics propagate planner -> reachability filter -> bridge only as additive private JSON; write/render/viewer failure is isolated from every planning, motion, capture and shutdown result.
  unchanged_authorities: [accepted-only coverage, NBV scoring and rank among survivors, six-ray shortlist, exact Tesseract feasibility, executor approval and motion, capture acceptance, mission outcome, home and shutdown]
generation_zero_ray_seed_order_2026_08_25:
  sequence: [receive prequalified ray_nbv_seed pool, compute current-FK travel to each bounded ray interval, shortlist the six nearest rays, let Tesseract choose the first exactly feasible target-facing endpoint]
  authority: {seed_order: bridge_node.py, current_physical_pose: latest achieved FK, exact_feasibility: Tesseract worker, post_capture_information_order: accepted-only NBV coverage path}
  invariant: Nearest-ray ordering applies only before the first accepted capture; it never replaces measured marginal information gain afterward.
startup_wrist_terminal_prerequisite_2026_08_24:
  sequence: [coherent disabled feedback, mission enable, explicit STARTUP_WRIST re-arms from the latest valid negative branch if the first sample was ambiguous, positive-only J6 normalization is proved, rough startup home may execute, mission work begins]
  terminal_sequence_before_startup_complete: [fresh motor authority, prove positive-only STARTUP_WRIST, PRE_HOME, ROUGH_HOME, STORAGE_WRIST, all-six disable, authorization revoke, owned-process cleanup]
  authority: {mission_order: mission_engine.py, terminal service adapter: target_scan_mission_node.py, direct stage execution: scan_viewpoint_executor_node.py, positive-only controller mapping and re-arm: piper_ctrl_single_node.py}
  invariant: PRE_HOME is never an alternative to unfinished STARTUP_WRIST. Direct home still bypasses Tesseract, so stage ordering is the safety boundary for the folded camera posture.
camera_capability_prequalification_2026_08_24:
  offline_load_order: [build hash-locked combined planning URDF, deterministic Halton joint sampling within conservative limits plus 0.03 rad margin, full endpoint collision and clearance query, camera and link6 FK, 20 mm XYZ plus 10 degree optical-direction quantization, checkpoint convergence validation, commit selected compressed artifact]
  runtime_load_order: [load artifact once, verify schema and every source hash, query sparse atlas over the complete finite camera/perception standoff request and selected floor, preserve per-sample support and contiguous runs, reject an entirely unsupported ray or narrow a supported ray to its outer support envelope in enforce mode, preserve unsupported rays in diagnostics, forward only prequalified information-ranked rays to the unchanged six-ray bridge shortlist, selected planner proves exact feasibility; use analytic reach and height only if the map is unavailable]
  data_shape: {stored: [sorted packed uint64 5D keys, maximum attached-tool minimum Z per key, immutable metadata and hashes], not_stored: [raw joint samples, IK seeds, solid workspace volume, trajectories]}
  authority: {capability_map: cheap endpoint prequalification, tesseract_worker: exact IK collision path aim and visibility, nbv: information score and ordering}
tracked_robot_description_boundary_2026_08_24:
  tracked_master: {root: robot_bottom, localization_edge: odom -> base_link, arm_mount: "base_link -> arm_base_link xyz [0.39, 0, 0.016] rpy [0, 0, 0]"}
  gateway_alias: {edge: arm_base_link -> piper_base_link, transform: identity, geometry: none}
  arm_private_frame: base_link
  handoff: target_scan_gateway snapshots odom -> piper_base_link before writing the local mission target; the tracked robot must be stationary before arm dispatch.
  generated_bundle: integration/track_robot_description/drop_in
bunker_collision_profile_path_2026_08_24:
  sequence: [GUI atomically saves floor_profile while no mission is active, persistent coordinator snapshots saved choice before creating a process generation, mission exports PIPER_FLOOR_PROFILE to owned children, supervised launch chooses the matching floor manifest and executor floor, both choices load piper_bunker.srdf and identical combined geometry, worker heartbeat publishes model hashes, bridge blocks readiness on mismatch]
  profiles:
    tabletop: {manifest: collision_model.yaml, srdf: piper_bunker.srdf, floor_z_m: 0.005, hardware_qualified: false}
    ground: {manifest: collision_model_ground.yaml, srdf: piper_bunker.srdf, floor_z_m: -0.466, hardware_qualified: false}
  frame_contract: Platform triangles are pretransformed into the existing arm planning base_link. No tracked-base TF semantics are introduced.
  visual_contract: piper_description.xacro always exposes visual-only fixed platform links; model_builder replaces their empty collision sets with the authoritative decomposed collision pieces.
  load_order_contract: The floor choice is immutable within one mission process generation. GUI changes affect only a later mission and never mutate a running worker, bridge or executor.
deadline_terminal_recovery_2026_08_24:
  sequence: [mission deadline rejects further scan work, MissionEngine enters its existing shutdown path, executor stop/hold is acknowledged, ROS adapter renews the same task and digest for one bounded direct-home stage, executor revalidates current motor and stage evidence, PRE_HOME then ROUGH_HOME then STORAGE_WRIST execute, all-six disable is proved, authorization is revoked, owned processes stop]
  authority: {shutdown_order: mission_engine.py, bounded_authorization_renewal: target_scan_mission_node.py, direct_stage_validation_and_execution: scan_viewpoint_executor_node.py}
  invariant: Deadline expiry is a scan terminal condition, not a reason to skip home. Only freshly confirmed motor-control loss suppresses automatic commands.
ray_endpoint_feasibility_cache_2026_08_23:
  sequence: [accepted capture updates immutable coverage, planner globally rescores the frozen surviving ray pool, inclusive fifteen-degree accepted-direction neighbours are removed, bridge removes current-generation path-dependent failures, six ranked rays bind to six bounded standoff intervals, worker jointly solves joints plus continuous standoff with exact aim first, worker performs exact IK and bounded endpoint validation before OMPL, first feasible informative endpoint plans and executes]
