  camera_holder_mesh: {runtime_copy: piper_ros_foxy/src/piper_description/meshes/camera_holder.STL, source_provenance: originally supplied as cameraHolder.STL but absent from the current CAD directory, owner: piper_description, units: millimetres with URDF scale 0.001}
