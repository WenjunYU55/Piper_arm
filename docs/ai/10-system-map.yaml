ui_boundaries:
  piper_gui_native: Hardware-capable. Manual mode publishes /joint_ctrl_single and calls /enable_srv. Acquire & Scan destroys that publisher, owns the worker/scan child processes, and uses executor approval/cancel services; it never calls enable automatically.
  rviz_and_debug_viewers: Read-only visualizers for camera, masks, point clouds, markers, and scan overlays.
  ros2_cli: Services under /supervised_cube_workflow are operator approvals but remain dry-run.
  scan_executor_cli: /scan_viewpoint_executor/approve can start real low-speed motion only when the executor was launched with motion opt-in and the exact plan ID and confirmation phrase are supplied; Tesseract also requires the exact trajectory_sha256 and qualified model. Cancel requests a current-position hold.
autonomous_target_scan:
  external_api: /piper/run_target_scan (RunTargetScan action)
  network_gateway: target_scan_gateway_node.py owns tracked-network action/TF, snapshots every admitted odom target to piper_base_link immediately, and maintains at most eight independently heartbeating action admissions.
  isolation_boundary: The gateway writes atomic 0600 records beneath a 0700 mission spool; no arbitrary command or TF topics enter the loopback motion domain.
  local_owner: run_target_scan_mission.sh owns the lifetime singleton lock; target_scan_mission_node.py owns a bounded closest-first pending queue but exactly one active physical task, process generation, mission authorization, enable/hold/disable, signal-to-cancel handling, and durable results.
  queue_order: A one-second admission window groups near-simultaneous requests, then Euclidean rough-target distance in the snapshotted local base frame selects the next task with arrival order as the stable tie-break. An executing task is never pre-empted; each task completes capture validation, direct home, disable, child cleanup and durable result before another task may start.
  lifecycle: [QUEUED, GOAL_LATCHED, STARTING, PREFLIGHT, ENABLE_AND_HOLD, ROUGH_ACQUISITION, TARGET_LOCK, OCCLUSION_PROBE, OCCLUSION_CLEARANCE, VIEW_PLANNING, CAPTURING, RETURNING_HOME, HOLDING, DISABLING, STOPPING, SUCCEEDED]
  terminal_failures: [FAILED, NEEDS_OPERATOR]
  heartbeat: 2 Hz gateway heartbeat; five seconds stale triggers safe shutdown in two-host mode.
  reconstruction: reconstruction/tsdf_reconstruct.py consumes successful adaptive 8-to-24-view manifests after shutdown and rejects a manifest count that differs from the immutable frame-metadata count.
implementation_map_2026_08_04:
  mission_context:
    path: tracked robot or GUI -> RunTargetScan -> target_scan_gateway_node -> target_scan_mission_node -> managed worker/scan environment -> heavy_model_worker -> temporal_heavy_refresh -> scan_capture metadata/result
    contract: task_id, mission_sha256, target_label, resolved target_profile and sanitized target_prompt remain correlated end to end.
  centered_acquisition:
    path: scan_target_acquisition_node -> target_acquisition -> viewpoint_reachability_filter -> tesseract bridge/worker -> executor -> correlated heavy refresh
    order: centered pose first; 15-degree left/right/up/down next; diagonal and compact-position candidates retained as reserves.
    reach_authority: Static base-radius, height and rectangular workspace boxes are disabled. Tesseract IK/joint/collision validation plus executor live revalidation remain mandatory.
  quality_capture_and_replacement:
    path: scan quality and occlusion -> scan_capture service gate -> immutable dataset record or explicit rejection -> executor accepted/rejected history -> mission remaining-count replan
    invariant: Only fresh finite GOOD score at least 0.65, target_valid true, CLEAR occlusion and synchronized RGB-D can increase accepted count. Automatic success requires 8-24 accepted records and permits at most eight rejected-pose replacements. Eight is a model-seed floor, not a fixed terminal count. It stops as soon as achieved FK history in the session-frozen coverage_target_center frame proves two views on each Y side, 120 degrees of azimuth, 25 degrees of elevation and three consecutive measured novel-surface gains at or below 0.02. Strict no-safe-view completion requires the same seed and floors; reaching 24 without them is retryable INSUFFICIENT_CAPTURE_QUALITY. Manual batch success remains exactly thirteen.
  between_view_visual_reacquisition:
    path: command-free MULTIVIEW_SCAN snapshot rejection or exact proposal approval rejection on transient tracking -> current achieved hold -> existing SAM2/GroundingDINO recovery -> fresh snapshot or full approval revalidation -> target-drift replan when needed
    contract: No command or capture is emitted while tracking is unsettled, prediction-only, stale, LOW_CONFIDENCE, LOST, or SEARCHING. The visual wait is bounded to 30 seconds and never relaxes collision, path, scene, camera, control, hash, measured-target, or worker authority.
  branch_removal_proposal:
    path: GroundingDINO/SAM2 obstacle instances plus target_cloud_node coarse base_link scene cloud -> supervised_workflow choose_removal_plan -> /piper/removal_plan -> mission readiness check
    behavior: leaf/branch selects support-verified pick/place when graspable and an observed drop patch exists, otherwise a clear outward push when possible.
    authority: Proposal remains command-free. manipulation_model_qualified=false keeps the mission at NEEDS_OPERATOR until a separate qualified contact planner/executor exists.
  shutdown:
    home_source: hash-verified piper_home_pose.json only
    normal_or_controllable_failure: one fresh direct current-state-to-configured-home target with stage/hash robot-self-collision-exemption evidence plus mandatory CAD-holder support-plane/external clearance, then stable hold, feedback-confirmed disable and child shutdown. Camera/tracking/obstacle freshness and robot self-collision evaluation are intentionally absent; external attached-tool clearance is not.
    untrustworthy_control_failure: emergency stop, nonfinite feedback, feedback beyond the direct-home-only 0.3-rad start band, an out-of-limit goal, controller/command fault, waypoint failure or no progress forbids the target; hold if possible, remain enabled and return NEEDS_OPERATOR.
  deployment_scope: Bench-only with externally stationary/clear base. Tracked-chassis collision TF and brake authority are deferred and required before mounted acceptance.
  powered_start_home:
    path: mission enable -> /scan_viewpoint_executor/hold -> /tesseract_plan_bridge/request_startup_home_plan -> isolated worker -> exact hash approval -> executor -> configured-home feedback proof
    authority: Every direct home stage permits an empty target-obstacle scene and ignores camera health. configured_home_direct_joint_move, collision_validation_bypassed, validation marker, exact home_stage and exact configured_home_goal_positions_rad are trajectory-digest bound through worker/bridge evidence; STARTUP_WRIST and STORAGE_WRIST retain their own endpoints instead of being compared with rough home. /cancel is not used for a normal hold.
    live_proof: The final 2026-08-04 GUI run completed startup normalization before rough acquisition, and the later semantic-occlusion failure returned through a normal scene-gated home transaction, disabled all motors, and stopped all mission children.
  gui_failure_path_validation:
    evidence: The real Tk GUI submitted one mission through RunTargetScan with the L515 disconnected and displayed the durable retryable SENSOR_UNAVAILABLE result after bounded recovery and safe cleanup. A second GUI mission was cancelled with the on-screen Cancel and Home control during camera startup and returned retryable CANCELLED in about eight seconds.
    process_state: Both managed driver and vision process groups exited with return code zero; no perception, planning, capture or scan child remained. The persistent mission coordinator and RViz stayed running and no automatic motor enable occurred.
    remaining_limit: This validates orchestration failure and cancellation paths only. It is not a successful camera, contact-removal, motion or 13-capture physical mission.
  coordinator_singleton_and_signal_shutdown_2026_08_06:
    path: run_target_scan_mission.sh nonblocking flock -> one launch/node/action server -> SIGINT shutdown request -> mission guard CANCELLED -> configured home -> hold -> feedback disable -> owned-child stop -> delayed ROS shutdown
    load_order_contract: The singleton lock is acquired before ros2 launch and inherited across exec. A second supported launch exits 73 and cannot create another action server or mission child generation.
    launch_escalation: target_scan_mission.launch.py waits 180 seconds before SIGTERM and 10 more before SIGKILL so ordinary bounded recovery is not truncated by the default five-second process timeout.
    live_evidence: The pre-fix duplicate action acceptance enabled the arm and orphaned two child generations when both coordinators were interrupted. Recovery reached saved home within 0.00145 rad, proved one-second motion below 0.00178 rad, disabled all six motors and removed all children.
staged_shutdown_and_reconstruction_2026_08_10:
  startup_load_order: [coordinator remains resident, mission starts driver and scan/perception workers, feedback hold, STARTUP_WRIST J6-only plan, ROUGH_HOME plan, acquisition]
  terminal_load_order: [stop and measured hold, fresh ROUGH_HOME plan, STORAGE_WRIST J6-only plan, settled hold, feedback-confirmed disable, stop mission-owned nodes, preserve coordinator and RViz]
  home_authority: piper_home_pose.json schema 2 plus RequestTesseractPlan home_stage and six-joint joint_goal_positions_rad; the response/evidence repeats that exact goal as configured_home_goal_positions_rad. Tesseract and executor retain exact request/start/stage-specific-goal/limit/hash authority. Dedicated zero-capture home stages deliberately bypass collision planning/recheck; all other motion retains normal collision authority.
  acquisition_runtime_refresh_authority: The first ROUGH_ACQUISITION segment remains bootstrap_static across a transient telemetry hold/resume. WAITING_FOR_RUNTIME_REFRESH cannot introduce an obstacle-stream dependency that the exact approved segment never had; later acquisition and multiview motion keep their normal scene authority.
  live_empty_obstacle_path: SAM2 target-only object_ids frame -> obstacle_instance_3d immediate timestamped empty clear array without TF -> executor fresh obstacle authority. Any ID greater than one follows object metadata plus aligned depth plus exact-time camera-to-base TF before publication.
  exact_multiview_scene_lifetime: A fresh valid obstacle scene is mandatory at pre-motion runtime refresh and is frozen only while the resulting exact collision-qualified MULTIVIEW_SCAN endpoint is in MOVING. SAM2 target-loss/WAITING_FOR_SEED may age that snapshot until the endpoint. New blocked/invalid arrays remain active stop signals, and every later endpoint requires another fresh settled scene.
  camera_clock_runtime_recovery: Any unhealthy typed camera timestamp during non-home execution commands a current-feedback hold. The executor permits the watchdog-owned full-stack restart up to 30 seconds and resumes the unchanged state only after fresh healthy camera, joints, arm, limits and scene authority recover. It never captures against the unhealthy clock. Dedicated direct home remains camera-independent.
  feedback_boundary_allowance: Ordinary measured feedback may exceed an inclusive configured boundary by at most 0.005 rad for encoder quantization/noise. Only the exact first measured point of a dedicated hash-bound direct RETURN_HOME stage may use the operator-qualified 0.3-rad post-disable relaxation allowance; its endpoint and every non-home target remain strictly in-limit. Neither allowance alters URDF/controller/Tesseract command limits, exact target hashes or normal collision validation.
  occlusion_evidence_path: synchronized heavy RGB-D/intrinsics archive -> GroundingDINO/SAM response masks -> exact-stamp archived-depth 3D projection -> two-observation pen/marker/stick evidence -> support-aware pick/place or incremental outward-push proposal -> manipulation readiness gate -> fresh heavy verification.
  measured_nbv_path: synchronized capture persistence -> base_link masked 10 mm voxel union -> per-view novel fraction -> achieved-FK side/span plus surface convergence -> base_link-only target-centre candidate refresh -> one next bounded Tesseract view or completion. Raw camera_color_optical_frame /piper/target_3d is never a coordinate fallback; it must first become a measured base_link TrackedTarget.
  mesh_path: mission SUCCEEDED and safe shutdown -> durable WAITING_FOR_BASE_HOME job -> correlated ReportTrackedRobotHomed -> QUEUED/RUNNING isolated reconstruction -> target_mesh.ply plus hashes/quality -> transient-local status and GetMeshJobResult.
runtime_race_and_home_refresh_update_2026_08_10:
  heavy_response_load_order: [worker atomically publishes complete responses/job, bridge publishes correlated status, bridge atomically renames responses/job to consumed/job, obstacle projection reads the exact mask from either immutable root]
  invariant: Subscriber scheduling may occur on either side of the rename; read-time dual-root resolution preserves the same exact job authority.
  direct_home_refresh_order: [detect transient motion-limit freshness gap, publish current-feedback hold, enter bounded runtime refresh, accept fresh matching limit/control evidence, resume unchanged home endpoint]
  paused_runtime_state: Coordinator and every driver/camera/perception/planning mission child are stopped. GUI and RViz are display-only and have no mission or motion authority without those processes.
joint5_contact_safety_update_2026_08_11:
  incident: GUI task gui-sim-d30410e05b9c405cb48e969fa818c173 persisted ten GOOD/CLEAR diverse captures, then its terminal direct-home start placed the full installed camera-holder/L515 envelope about 0.001245 m above the support plane, below the required 0.005 m margin. Physical contact disabled J5. Viewpoint planning is accepted; terminal home geometry and motor fault containment are the affected subsystems.
  shutdown_state: All six motor FOC enable flags were proved false with explicit all-axis disable. Driver, camera, perception, coordinator, GUI and scan/planning processes were stopped; only RViz remained. This was the immediate incident state. Mechanical inspection, read-only fault clearance and explicit operator reauthorization later completed; the subsequent five-percent ten-capture mission completed external-floor-guarded rough/storage home and six-axis disable without contact.
  driver_flow: /enable_srv, the deprecated enable topic and optional auto-enable serialize through one bounded transition. Success requires all six low-speed FOC driver_enable_status flags. Any per-motor FOC fault aborts enable; a failed partial enable remains lock-held until rollback proves all six disabled. Outside a fault-free bounded transition, partial enable or any fault while powered makes the 200 Hz feedback watchdog call DisableArm(7), clear command state and report the joint/fault fields.
  home_flow: worker.py and scan_viewpoint_executor_node.py both transform the exact CAD-derived link6-fixed holder/L515 box through dense path samples. Every mode requires at least 0.005 m support-plane/external-obstacle clearance. Dedicated RETURN_HOME retains only its intentional robot self-collision exemption and camera/tracking freshness independence; it cannot move from an already externally unqualified pose.
powered_j5_dropout_update_2026_08_11:
  incident: Task gui-sim-be1e6cd0d5e1419e9b4397261a530fd7 saved 12 views. J5's low-speed driver-enable flag dropped first while J1-J4/J6 remained powered; the 200 Hz driver watchdog then disabled the other axes. The dropout preceded the one-view planning timeout by about 93 seconds. Aggregate arm err_code stayed zero and carried no useful per-axis authority.
  typed_status_flow: The driver caches the exact low-speed watchdog sample and publishes motor_feedback_valid, six motor_N_driver_enabled booleans, motor_faults and motor_watchdog_reason in PiperStatusMsg. scan_motion.py owns shared interpretation. Reachability allows six-disabled command-free preflight but rejects invalid/partial/faulted state; executor motion and the active mission require fresh all-six-enabled proof.
  terminal_untrusted_control: If powered motor proof is lost, the mission revokes authorization immediately and sends no further arm command, including hold, home, storage or disable. It waits read-only for the driver watchdog to prove all six axes false, stops its owned process generation, preserves coordinator/RViz, and returns NEEDS_OPERATOR with safe_shutdown=false. Manual recovery cannot be reported as automatic configured-home proof.
  planning_budget: Automatic closed-loop one-view MULTIVIEW_SCAN uses a 45-second worker budget and three-second OMPL attempts so every observation/replan remains bounded. Manual batch and non-one-view requests retain 150 seconds and five-second OMPL attempts.
  load_order_contract: Load collision_model.yaml and scan_execution_params.yaml envelope values before accepting any planning/execution readiness. The worker's dense external-floor result and executor's independent check must agree before a direct-home command can be approved.
