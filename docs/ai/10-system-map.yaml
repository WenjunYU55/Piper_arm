passive_results_campaign_path_2026_09_02:
  live_observation_path: operator opens campaign -> GUI prepares but does not apply declared XYZ/backend
    -> normal GUI mission submit succeeds -> passive post-submit hook records task ID and wall/monotonic
    clocks -> low-priority file-only sidecar snapshots existing mission/perception/capture/ray outputs
    -> normal mission result is recorded after production terminal handling
  offline_analysis_path: immutable evidence snapshots plus schema-2 dataset -> normalized acquisition
    timing planning coverage and point-cloud tables -> optional five-mode native-depth reconstruction
    in new output tree -> CSV plus dependency-free XLSX plus 300-dpi PNG and vector PDF
  dependency_direction: piper_gui/native_app.py -> piper_gui/results_campaign.py -> results_campaign;
    results_campaign never imports piper_gui ROS packages mission planner executor capture safety driver
    or cuRobo runtime
  runtime_authority: none; the campaign observer cannot submit cancel approve retry replan publish call
    a ROS service enable a motor or write a raw dataset
  generated_storage:
    campaign_evidence: datasets/experiment_campaigns/<campaign>
    reports: datasets/experiment_results/<campaign>[_timestamp]
  active_schedule: piper-paired-20cm-20260908 uses X 0.30 to 1.10 m at 0.20 m steps, Y 0, Z 0/0.12/0.30
    m, traversing X at each height. Each position runs both planners; first planner alternates continuously
    across height boundaries, starting cuRobo. Existing blocked and original Tesseract-first alternating
    definitions are preserved. Additional schema-2 cuRobo sweeps are defined by results_campaign/modes.py;
    the paired schedule remains schema 1.
  load_order_contracts:
  - campaign opening is optional
  - a task is recorded only after the existing action client accepts local submission
  - terminal collection happens after the existing result path
  - recorder failure is display-only and fail-open
  - report generation is offline and independent of any active mission
  order_update_2026_09_08: New campaign IDs use adjacent planner pairs with alternating first planner.
    Existing campaign.json trial order and attempts are never migrated.
  skip_update_2026_09_08: Skip Trial persists a schema-1 trials/<trial>/skip.json receipt and prepares
    the next pending trial without applying settings or starting a mission. Resume excludes explicitly
    skipped trials; completed and skipped counts remain separate.
  operator_skip_path: Idle GUI -> controller -> CampaignStore skip receipt -> next pending fields; bookmarks
    and reports expose SKIPPED without a task or measured result.
  campaign_modes_2026_09_08:
    owner_module: results_campaign/modes.py
    gui: Results Campaign mode selector; new IDs per mode, existing IDs resume their frozen design
    camera_profiles: cuRobo only; eight admitted RGB profiles, four resolutions each at 15 then 30 FPS;
      XYZ (0.30,0,0.30) m; aim 5 degrees; depth profile unchanged
    aim_tolerance: cuRobo only; at each X 0.30/0.50/0.70/0.90/1.10 m, sweep 1/5/10/15/20/25 degrees; Y
      0, Z 0.30 m; freeze saved RGB profile at creation
    objects: cuRobo only; cube, cup, stick, flower at XYZ (0.30,0,0) m; aim 5 degrees; freeze saved RGB
      profile at creation
    coordinate_basis: base_link Z convention; no table offset inferred from calibration
    preparation: Populate target label, RGB/FPS and aim controls; normal explicit Apply controls are still
      required. No runtime write or mission start from Prepare.
    evidence: PHYSICAL_PARAMETER_SWEEP, one attempt per condition; requested RGB FPS is not measured FPS.
      Non-cube reference coverage and dimensional errors remain unavailable.
