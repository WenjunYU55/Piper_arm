schema_version: 1
saved_camera_recovery_2026_09_07:
  reference: docs/ai/88-automatic-scan-recording.yaml
  flow: Default GUI archive path is extract_video.py -> isolated segment_video.py -> raw native session -> calibrated converter -> BundleSDF -> viewer. import_bag.py retains legacy filtered-recorder recovery for diagnostics.
automatic_scan_recording_2026_09_07:
  reference: docs/ai/88-automatic-scan-recording.yaml
  owner_module: piper_mobile_manipulation/mission_archive.py
  behavior: Every normal supervised scan defaults to a movement-window RGB-D/mask rosbag with one-second pre/post-roll, retained calibration/TF/events and accepted capture pins, plus the existing accepted-frame reconstruction dataset. Archive starts with the scan stack and closes on its shutdown; capture counts, median output and safety are unchanged.
  defaults: {mission_archive_enabled: true, reconstruction_recording_enabled: true, mission_archive_minimum_free_bytes: 2147483648}
  boundary: Archive is never launch-critical; best-effort sensor subscriptions and eight-message DDS histories isolate slow storage; Foxy write cache is disabled to preserve shutdown tail messages. Only tf_static is reliable/transient-local. Low disk stops the archive and retains incomplete evidence.
  lifecycle: Unique inprogress folder becomes closed or incomplete. Closed describes the archive, not mission success; mission outcome remains in recorded events. SIGKILL may leave inspectable inprogress data.
  replay: replay_bag.sh inherits recorded task identity, frozen angle and available quality/recorder YAML snapshots; checks recorder startup and keeps explicit override support.
  must_retest_if_changed: [production launch flag combinations, recorder and GUI regressions, actual rosbag record/SIGINT/playback, offline session validation and conversion, package build and tests]
bundlesdf_gui_results_2026_09_07:
  selector_contract: Readable input/view-only/unavailable labels retain literal paths; recordings show recorded start time, target when matched by task ID, and frame count. Known zero-keyframe or zero-frame inputs disable reconstruction; eligibility still requires pipeline validation. No files are renamed or deleted.
  owner_module: piper_gui/bundlesdf_results.py
  reference: docs/architecture/bundlesdf_native_runtime.md
  allowed_edit_paths: [piper_gui/bundlesdf_results.py, piper_gui/native_app.py, reconstruction/view_bundlesdf.py, tests/gui/test_bundlesdf_results.py]
  behavior: Reconstruction Validation selects recorded datasets or results, runs dense offline extraction/SAM2/BundleSDF through Reconstruct, validates or cancels jobs, and opens an interactive textured viewer with explicit evidence origin.
  boundaries: No capture, robot command, planner or source-data mutation. Offline GPU jobs use isolated child processes and cannot start through this panel during an active mission. Unknown origin remains unverified; synthetic inputs are labelled.
  runtime: GUI stays in Foxy Python; read-only extraction, temporal SAM2, BundleSDF and viewing run in child processes with explicit interpreter boundaries. Atomic job progress and failures return through bounded Tk polling.
  manual_smoke_checks: [select retained synthetic output and verify origin label, invoke actual GUI button and inspect titled textured viewer, close viewer and reopen, browse invalid folder and verify readable error, scroll Reconstruction Validation on a short display]
  must_retest_if_changed: [all GUI tests, reconstruction GUI-support tests, isolated-domain GUI launch and close, actual native mesh viewer launch, Python compile and changed-file lint]
bundlesdf_native_runtime_2026_09_07:
  implementation_record: docs/ai/87-bundlesdf-native-runtime.yaml
  evidence: docs/experiments/bundlesdf_native_validation.md
  reference: docs/architecture/bundlesdf_native_runtime.md
  owner_module: reconstruction_recording
  scope: Optional offline BundleSDF native environment following explicit cuRobo Python/CUDA boundary; no ROS or
    planner selection changes.
  allowed_edit_paths:
  - tools/bundlesdf/
  - tests/reconstruction/
  runtime_contract: Native is the wrapper default; Docker requires --runtime docker. Replace ROS Python/native search
    paths; pin upstream, source archive hashes, LoFTR weight hash and matching Torch/Kaolin ABI. Preserve per-run
    local patch and dependency provenance.
  must_retest_if_changed:
  - isolated launcher environment test
  - synthetic native RGB-D geometry and recorder gates
  - actual GPU imports and tracking-to-mesh smoke
  - dataset conversion and wrapper mesh validation
reconstruction_active_planner: curobo  # Preserved saved mission selection; Tesseract checks are compatibility only.
reconstruction_recording_2026_09_06:
  reference: docs/ai/86-reconstruction-recording.yaml
  flow:
  - existing stationary median capture persists
  - raw tuple pin and executor accepted history rendezvous
  - existing frozen coverage target and image-stamped TF
  - passive bounded admission worker
  - bounded PNG/NPY writer
  - native manifest
  - offline validator and pinned BundleSDF adapter
  load_order_contracts:
  - visibility.py stays ROS-free and is importable in both external worker environments
  - ReconstructionKeyframe and additive MotionPlan field require rebuilding all ROS interfaces before launch
  - default-enabled passive recorder starts at 3.25 seconds after stationary capture at 3.0; existing motion roles and
    critical exit handling unchanged
  - BundleSDF Python CUDA and weights stay outside Foxy workspace
stream_smoothness_boundary_2026_09_06:
  timing: Native cuRobo result -> adapter applies one time scale in experimental modes -> same hashed position schedule -> common validation and sole executor command publisher.
  following: Executor owns held setpoint and fresh-sample counter; pure TrajectoryRunner owns recovery decision; TelemetryStore supplies independent joint source stamps. No new controller or shared store.
approval_transaction_boundary_2026_09_06:
  flow: Coordinator creates deadline-bound mission confirmation -> executor verifies authorization and unexpired request -> unchanged complete path validation -> expiry recheck -> runtime freshness barrier -> motion.
stream_rate_selection_2026_09_06:
  flow: GUI next-mission selector and atomic Apply -> authoritative execution YAML rates -> frozen shared launch values -> generic bridge request -> selected backend normalizer -> hash-bound generic response -> common validation authorization and executor.
  default: Code defaults remain 20 Hz commands and 200 Hz timer; saved next-mission experiment is 100 Hz commands and 200 Hz timer. Experimental commands require at least twice-rate timer.
early_capability_retention_path_2026_09_06:
  sequence:
  - canonical population identity
  - restore prefilter-owned capability exclusions
  - prune carried hard culls
  - history retirement
  - query remaining rays with exact-input cache
  - retain new capability exclusions
  - information and NBV ranking
  - downstream admission and exact planner
  current_contract: docs/ai/94-nbv-scoring-and-retries.yaml
planning_latency_boundaries_2026_09_06:
  capability: GUI scan_execution_params.yaml aim value -> one frozen mission-launch float -> both capability lookup consumers plus bridge and executor -> existing exact planner and common execution checks. Lookup slack follows selected aim; first-capture admission remains capped at five degrees.
  diagnostics: Generic bridge callback -> bounded FIFO of private snapshots -> daemon writer -> unchanged locked atomic JSON and HTML merge. Bridge destruction drains for up to two seconds and warns if incomplete.
  unchanged: [ROS interfaces, worker selection, NBV scoring, IK retry budgets, collision checks, freshness, capture aim, robot command path]
bounded_curobo_aim_search_2026_09_06:
  flow: Bridge binds bounded cone alternatives into the hashed cuRobo target-ray request; worker attempts exact aim then one balanced fallback goal set; unchanged response validation requires the selected direction to be explicitly requested.
  unchanged: [Tesseract goals, ROS interfaces, mission progression, camera positions on supported intervals, execution authorization]
early_capability_path_2026_09_06:
  sequence:
  - history and existing hard-cull pruning
  - enforcing static capability prefilter
  - information projection
  - information rejection
  - useful-candidate ranking
  - downstream runtime prequalification and standoff bounding
  - bridge persistent-exclusion and reserve shortlist
  - exact planner
  fallback: Non-ray policies are unchanged. Disabled shadow missing or unqualified atlas retains downstream legacy
    workspace filtering; early capability optimization is absent.
  current_contract: docs/ai/94-nbv-scoring-and-retries.yaml
world_upload_reuse_path_2026_09_06:
  sequence: [ordinary request validation and freshness, convert current obstacles plus fixed geometry and floor, exact geometry identity comparison, upload only changed world, restore collision constraints on hits and misses, current-start planning and full path validation]
planner_endpoint_and_exhaustion_path_2026_09_06:
  sequence: [loaded-model camera and link6 FK, fixed camera-to-link transform, requested endpoint distance aim and holder clearance precheck, unchanged MotionGen goalset, full achieved-path validation, generic response, population-scoped exhausted-ray exclusion, common authorization and execution]
  ownership: Endpoint filtering belongs only to cuRobo; shared bridge owns population-lifetime exclusions and still promotes untouched reserves. No new ray population is generated by retries.
four_box_fixed_world_2026_09_05:
  flow: [prepare_model.sh selects representation, generate_robot_config binds source geometry and qualification, worker validates source and canonical mesh hashes, MotionGen starts with selected representation, unchanged common planning and execution]
  active_default: Four cuboids covering chassis, sensor housing, raised LiDAR and front camera, fixed arm base; existing moving spheres and request obstacles remain.
curobo_request_timing_2026_09_05:
  flow: [worker request validation, timed world recovery candidate MotionGen normalization and path checks, generic response validation, existing spool response, bridge observational ray diagnostics, passive campaign collector, Planning CSV and XLSX]
  all_plan_kinds: Post-publication CUROBO_REQUEST_TIMING records in the existing supervised worker log retain acquisition and failures absent from multiview ray reports.
single_capture_transaction_path_2026_09_03:
  load_order: [settled executor requests one capture, recorder opens one absolute capture deadline, fresh execution quality and occlusion evidence becomes available, recorder collects 20 new native depth confidence and intrinsics samples, recorder intersects its bounded mask and RGB-D caches with the settled native burst, newest fresh exact mask/RGB-D pair is frozen, bounded future-TF catch-up reuses the same evidence, final quality and occlusion snapshot is atomically admitted, files metadata and response bind that snapshot]
  load_order_contracts: [transient evidence gaps do not become successful admissions, the absolute deadline cannot reset, one transaction does not recollect multiple depth bursts, an unmatched newest mask is skipped rather than frozen, exact mask/RGB identity and native-burst overlap remain mandatory, CAPTURE_EVIDENCE_TIMEOUT does not feed the legacy external retry loop, malformed geometry depth or persistence still fails closed]
visual_rejection_and_request_quiescence_path_2026_09_03:
  retry_order: [executor records achieved rejected ray plus ray_population_phase, history validates and republishes additive rejection evidence, planner removes that ray for the complete current population, unchanged NBV ranking orders survivors, existing bridge excludes its contextual planner failures and promotes the next reserve shortlist, exact selected backend plans normally]
  load_order_contracts: [first-capture framing retry preserves the same ray with a larger minimum standoff, accepted capture does not expire qualified-population visual quarantine, bootstrap-to-qualified replacement or a new session releases old-population visual culls, accepted directions and permanent population-bound culls remain monotonic, MotionPlanStatus PLANNING pauses only redundant multiview generation and reachability, terminal planner status releases processing on the next fresh tracked-target callback]
