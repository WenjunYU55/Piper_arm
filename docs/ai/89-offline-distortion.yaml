schema_version: 1
date: '2026-09-07'
title: Calibrated offline lens rectification and depth-plane diagnostics
owner_module: reconstruction_recording
allowed_edit_paths: [tools/bundlesdf/dataset.py, tools/bundlesdf/distortion.py, tests/reconstruction/test_distortion.py, tests/reconstruction/test_recording.py]
reference: docs/experiments/offline_distortion_validation.md
previous_behavior: Raw Brown-Conrady calibration retention and offline rectification already existed in the pending saved-camera recovery changes; the real-data mesh still had major artifacts.
reason: Verify lens correction against independent geometry, quantify its effect on the actual target and avoid misdiagnosing tracking drift as lens distortion.
architecture:
  - Shared offline rectification_maps maps pinhole output pixels to recorded Brown-Conrady pixels using unchanged K.
  - RGB uses linear remapping; colour-aligned depth and masks use nearest neighbour. Native recordings remain byte-identical.
  - Converter validates target depth support after remapping and records input/output calibration and axial-Z convention in validation.json.
  - Read-only diagnostic emits raw/rectified/comparison PNG and distortion.json, with optional user-selected planar-patch residuals.
parameters: No ROS or mission parameters introduced. Diagnostic CLI accepts --frame (default 0), --output (required new directory) and optional --plane-roi X0 Y0 X1 Y1.
contracts:
  - Never apply colour distortion coefficients to a native depth-camera grid.
  - Zero distortion is identity; unsupported camera models fail existing validation.
  - Camera depth is axial Z, not radial range; rectification does not rescale Z.
  - Planar residuals are diagnostics, never a correction estimated from an arbitrary object or mesh.
  - No changed motion, captures, frame-selection policy, camera settings or target estimate.
manual_smoke_checks: [convert retained 141-frame session, load every output through pinned upstream reader, inspect before/after image, compare all RGB depth mask and K artifacts against prior GPU input]
must_retest_if_changed: [independent Brown-Conrady projection test, zero-distortion identity, tilted and bowed plane diagnostics, raw preservation and output overwrite rejection, all reconstruction and GUI suites, pinned reader]
evidence:
  maximum_remap_pixels: 7.84623520894885
  first_frame_target_maximum_remap_pixels: 0.07739725309385795
  first_frame_target_p95_remap_pixels: 0.047625405176783604
  selected_board_patch_rms_mm: 0.40578654338838244
  selected_board_patch_uncorrected_rms_mm: 0.4109697400353331
  plane_caveat: Visually selected wooden board patch in one recorded frame, not a certified planar reference or physical calibration test.
  gpu_input_comparison: All 424 image and K artifacts match the previous actual completed GPU run byte-for-byte; its visual quality failure remains and is not promoted by these diagnostics.
remaining: Multi-view tracking and hand-eye consistency need separate investigation; lens rectification alone does not repair the existing bad mesh. No physical camera calibration or new GPU reconstruction performed in this follow-up.
