execute_home_stage_contract_2026_08_15:
  name: /scan_viewpoint_executor/execute_home_stage
  type: piper_mobile_manipulation/srv/ExecuteHomeStage
  request: {task_id: active mission identity, mission_sha256: exact active digest, home_stage: [STARTUP_WRIST, PRE_HOME, ROUGH_HOME, STORAGE_WRIST], joint_goal_positions_rad: exactly six finite radians matching the configured stage}
  response: {accepted: whether the transaction was admitted, execution_id: unique direct-home transaction ID, message: human-readable diagnostic}
  gates: [executor idle, real-motion authority, unexpired matching mission authorization including bounded same-identity terminal renewal after deadline, fresh finite current joints, configured-stage endpoint match, stage-specific direction and changed-joint policy, fresh fault-free motor proof, dense holder/L515 external-clearance proof]
  execution: One or two native MoveJ endpoints. Only STARTUP_WRIST may contain the qualified raw wrap bridge before the exact ready endpoint. Authenticated STARTUP_WRIST owns J6 only; the executor refreshes J1-J5 from the same fresh measured command-boundary sample, evaluates waypoint progress/convergence and stage settling from J6 only, and emits no redundant hold before the following ROUGH_HOME transaction. PRE_HOME is terminal-only by mission ordering. All non-STARTUP_WRIST stages retain ordinary six-joint convergence and settle proof.
  driver_tags: {STARTUP_WRIST: piper_scan_executor_startup_wrist, energized_hold: piper_scan_executor_hold, all_other_endpoints: piper_scan_executor_sdk_movej}
  compatibility: Additive service. Existing RunTargetScan action, legacy planning services and all message fields remain unchanged.

failed_dataset_cleanup_contract_2026_08_15:
  trigger: Terminal failed or cancelled mission after owned scan writers have stopped and accepted capture count is zero.
  deletion_scope: One resolved direct child of the configured active-scan root whose metadata exactly matches task_id and mission_sha256.
  refusal_conditions: [symlink or escaping path, missing or mismatched identity, any completed capture metadata, any positive manifest count, unknown artifacts]

confidence_capture_schema2_contract_2026_08_16:
  additive_inputs: [/camera/depth/image_rect_raw, /camera/depth/camera_info, /camera/confidence/image_rect_raw]
  camera_startup: Both L515 launchers enable synchronized streams, require a real color CameraInfo sample before applying visual-preset/global-time controls, externally bound every parameter transaction, and fail closed unless preset 5 plus both global-time controls are verified.
  immutable_identity: The SAM mask must have the exact RGB stamp; the reference native depth/confidence/camera-info use the configured bounded synchronizer and reference native depth must remain within the unchanged RGB-D slop.
  temporal_depth_burst: After a settled capture request, the command-free recorder collects exactly 20 new synchronized native L515 depth/confidence/camera-info observations while the achieved pose remains held. It consumes the existing 20-second capture_timeout_sec with a mandatory two-second service-response margin rather than an independent five-second deadline. Per-pixel median uses only nonzero grade-8-or-better samples and retains pixels supported by at least 0.50 of the burst. The exact mask-correlated RGB remains one representative frame so temporal depth filtering cannot blur semantic identity.
  confidence: L515 mono8 accepts only logical grades 0..15 or exact high-nibble RAW8 values 0,16,...,240. The default minimum grade is 8, temporal support fraction 0.50, minimum target points 50, and minimum confident target fraction 0.50.
  outputs: [RGB PNG, aligned depth NPY and millimetre PNG, exact mask PNG, native depth NPY and PNG, normalized confidence PNG, projected target-depth PNG, target-support mask PNG, frame metadata YAML, hash manifest]
  transaction: Temporary files are renamed only after every artifact and metadata write succeeds; any error removes partial and already-committed files for that frame.
  retry_routing: Fewer than 20 new frames within capture_timeout_sec minus the two-second response margin, or a correlation/synchronization gap, rejects the same capture through the existing bounded caller policy. The timeout diagnostic includes received count, elapsed collection time and synchronized rate. DEPTH_QUALITY_REJECTED is fresh visual evidence and requests a different view. Malformed encoding/intrinsics/TF/provenance and persistence errors abort.
  compatibility: Existing Trigger service, status/summary topics, QoS, synchronization_slop_sec=0.08, require_valid_target=true default and motion/NBV behavior are unchanged.

one_millimetre_target_geometry_contract_2026_08_21:
  capture: Persisted confidence-qualified target depth remains at native projected pixel resolution; the 20-frame temporal median changes depth estimates but adds no spatial downsample.
  live_target_model: Accepted full-resolution refinements use pixel_stride=1 and voxel_size_m=0.001 on /piper/target_cloud. max_voxels remains 250000. The separate scene cloud retains stride 12, 0.015 m cells and 120000-cell bound.
  reconstruction: Offline TSDF and its registration clouds default to voxel_length_m=0.003 and sdf_trunc_m=0.015. GUI reconstruction defaults to the same 3.0 mm voxel value. The restored fusion defaults do not change raw evidence, registration limits, dimensional checks, component rules or terminal quality gates.
  planning: nbv_voxel_size_m remains 0.005. Target-cloud density cannot alter accepted capture coverage, NBV information ranking or Tesseract feasibility.
  compatibility: Existing parameter names, topics, QoS, capture schema, GUI controls, motion and shutdown behavior are unchanged.

live_voxel_nbv_contract_2026_08_17:
  existing_inputs: [/piper/scan_session_history TRANSIENT_LOCAL reliable, /piper/scan_capture_status volatile reliable, schema-2 manifest files]
  additive_parameters: [view_selection_policy, ray_sampling_region, ray_count, ray_min_standoff_m, preferred_scan_radius_m, nbv_voxel_size_m, nbv_minimum_radius_m, nbv_maximum_radius_m, nbv_radius_scale, nbv_padding_voxels, nbv_surface_tolerance_m, nbv_render_width, nbv_render_height, nbv_maximum_scoring_voxels]
  additive_JSON: [/piper/scan_viewpoints nbv_* candidate fields and view_selection_policy, /piper/scan_coverage NBV model generation/readiness/count diagnostics]
  policy_default: ray_nbv
  generation_rule: A model generation is usable only when the accepted history count, persisted capture count, manifest records, session ID and frozen target center agree.
  authoritative_rule: voxel_nbv publishes only positive-information candidates and replaces only internal candidate ordering. ROS message types, QoS, plan IDs, authorization, motion limits, timing, capture thresholds and shutdown contracts are unchanged.
  capture_race_compatibility: Existing Trigger rejection strings remain human-readable; delayed missing/mode/settled execution status maps to the typed bounded CAPTURE_RETRY_SAME_VIEW decision.

capture_diagnostic_delivery_contract_2026_08_21:
  boundary: scan_capture service-mode validation
  inputs: [/piper/scan_quality, /piper/occlusion_status]
  scheduling: >-
    Both low-rate diagnostic subscriptions share a dedicated mutually-exclusive
    callback group, independent of the recorder's high-rate RGB-D callback
    group, on a two-thread executor.
  unchanged: [topic names, std_msgs/String payloads, QoS depth 10, one-second receipt freshness, minimum score 0.65, target_valid true, occlusion CLEAR]

post_enable_startup_proof_contract_2026_08_25:
  boundary: enable completion -> first STARTUP_WRIST command
  required_evidence: [joint and arm-status samples received after enable, six finite positions, maximum 0.005-rad drift across two seconds, err_code zero, no angle-limit or communication flags, valid all-six-enabled motor feedback, no motor faults or watchdog reason]
  failure: With intact authority disable before reporting retryable CONTROL_UNTRUSTWORTHY; with motor-authority loss issue no command and use watchdog six-disabled proof.
  non_effects: [direct-home relaxation allowance, command limits, J6 winding map, endpoint tolerances, STARTUP_WRIST-before-ROUGH_HOME order]
