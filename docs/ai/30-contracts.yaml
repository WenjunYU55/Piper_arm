  attached_holder_clearance_m: 0.005
  invariant: Tesseract planning and executor dense approval use identical values and the complete CAD-derived holder/L515 link6 envelope. A path must keep every envelope corner at or above z 0.010 m.
  home: Direct configured stages continue bypassing only robot self-collision; the raised external support plane remains authoritative.
partial_reconstruction_contract_2026_08_21:
  default_cli: 1-24 immutable captures; zero and 25-plus reject.
  deferred_gateway: Job creation still requires SUCCEEDED plus safe_shutdown and reconstruction start requires exact tracked-base-home correlation. View count does not add a separate eight-view admission or PASS cap.
  manual_gui: Explicit operator selection may run the same 1-24 path without changing durable mission/job state. Captured trusted masks are the default; offline_resegment is optional and may fail without invalidating saved outputs. Build Raw + Cleaned writes both meshes, dataset selection loads an existing target_mesh.ply.quality.json, surfaces measured FAIL as inspectable quality rather than a process crash, and remains command-free.
  classification: Counts 1-24 are VIEW_COUNT_ELIGIBLE and geometry/provenance gates determine quality. Missing calibration identity is independently DIAGNOSTIC_ONLY and requires explicit admission; malformed, missing, or conflicting identities still fail.
  terminal_mapping: overall PASS or WARN produces durable mesh-job SUCCEEDED; overall FAIL produces durable FAILED while retaining the generated mesh hash/path and complete quality report; missing or unknown quality fails closed.
  environment: The canonical isolated interpreter is reconstruction/.venv/bin/python, matching setup_environment.sh and GUI helpers.
adaptive_safe_frontier_terminal_contract_2026_08_21:
  ordinary_completion: The existing 8-through-24 achieved-feature and measured-convergence decision remains authoritative while another safe informative view exists.
  exhausted_completion: A typed RAY_FRONTIER_EXHAUSTED result may finish after at least one accepted capture only when scan history proves accepted_achieved_views is at least the persisted accepted count. It does not waive capture acceptance; it states that no additional prequalified ray survived all bounded Tesseract attempts.
  prohibited_equivalence: [RAY_SHORTLIST_EXHAUSTED, generic PLANNING_FAILED, timeout before attempting a ray, worker crash, malformed response, zero accepted captures]
  downstream: Successful arm shutdown queues the existing reconstruction job. Reconstruction retains its independent dataset validation and later tracked-base-home trigger.
ray_shortlist_exhaustion_contract_2026_08_21:
  scope: Private ray_nbv bridge-to-worker planning transaction; no public ROS definition changes.
  worker_failure: A validated TESSERACT_EXHAUSTED response may carry planning_diagnostics.attempted_ray_ids.
  bridge_state: Cache only attempted IDs that occur in the matching pending request and only while request scan_session session_id and accepted_views match the current cache generation.
  retry_result: Publish RAY_SHORTLIST_EXHAUSTED while retaining TESSERACT_EXHAUSTED in rejection_codes, then let MissionEngine request the next untried bounded shortlist.
  terminal_result: When no prequalified untried ray remains, emit RAY_FRONTIER_EXHAUSTED and use the existing accepted-coverage completion or insufficient-quality terminal route.
ray_workspace_prequalification_contract_2026_08_21:
  applies_to: candidate_geometry target_ray only
  bounds: {min_base_link_camera_radius_m: 0.20, max_base_link_camera_radius_m: 0.75, min_camera_target_distance_m: 0.25, max_camera_target_distance_m: 0.80, max_target_relative_height_change_m: 0.40}
  acceptance: Keep the ray when the intersection of its continuous ray_min_standoff_m through ray_max_standoff_m interval and every configured bound is nonempty. A representative desired_camera_position outside the workspace cannot reject a ray whose remaining interval enters it.
  rejection: Set prequalified reachable and safe compatibility fields false with bounded ray does not intersect configured camera workspace. The bridge omits that ray before shortlist and Tesseract.
  authority: Prequalified means only cheap finite geometric screening. Tesseract remains sole IK collision path and visibility feasibility owner.
exchangeable_nbv_policy_contract_2026_08_21:
  policy_geometry: {legacy: exact_point, voxel_nbv_shadow: exact_point, voxel_nbv_seed: exact_point, voxel_nbv: exact_point, ray_nbv_seed: target_ray, ray_nbv: target_ray}
  mission_binding: The planner validates and freezes view_selection_policy when its process starts. GUI changes affect the next stack start and cannot change an active mission's candidate contract.
  minimum_useful_information: {authoritative_policies: [voxel_nbv, ray_nbv], normalized_predicted_marginal_fraction_min: 0.02, raw_pixel_override: forbidden, excluded_policies: [legacy, voxel_nbv_shadow, voxel_nbv_seed, ray_nbv_seed], ray_seed_geometry: ray_nbv_seed still uses the bounded ray expansion contract without claiming accepted-coverage gain}
  handoff_bounds: {voxel_nbv_exact_candidate_max: 12, ray_nbv_direction_max: 6, ray_interval_candidate_max: 6, ray_ik_multistart_seed_count: 9, ray_ik_max_function_evaluations_per_seed: 120, ray_search_order: continuous exact-aim solve then continuous bounded-fallback solve before the next ray}
  private_validation: A MULTIVIEW_SCAN batch contains one known policy and its matching candidate geometry. Each target-ray candidate binds a normalized direction, bounded standoff interval and representative point; metadata counts bind the six-direction limit. A successful selected point must remain on that ray inside its interval. Mixed or malformed batches fail before worker planning.
  public_compatibility: No ROS action, topic, service, message or field changed.
frozen_viewpoint_ray_contract_2026_08_21:
  policy_scope: ray_nbv only. legacy remains heuristic exact points; voxel_nbv again means measured-information ranking over the regenerated exact-point radius lattice.
  planner_candidate: {candidate_geometry: target_ray, ray_id: stable mission-local integer, ray_direction: unit vector from frozen target to camera, ray_min_standoff_m: configured target-relative 0.28, ray_preferred_max_standoff_m: configured 0.50, ray_max_standoff_m: configured target-relative 0.80 and never capped by target base-link range, ray_scoring_standoff_m: representative point used only for cheap gain and prequalification; enforce-mode capability evidence may move it into a supported run}
  generation: {bootstrap_center: tracked visible-surface base_link target, bootstrap_lifetime: generation zero through accepted capture one, qualified_center: mask-revolution axis_origin_m, population_replacement: exactly once after accepted capture one qualifies the model, qualified_lifetime: remainder of the same session, ray_count_parameter: 1 through 1000, default_count: 175, regions: [target_sector, upper_hemisphere, full_sphere], target_sector_175: 25 azimuth by 7 elevation historical grid, hemisphere_and_sphere: deterministic equal-area sampling, tracker_updates: do not translate either active population}
  bridge_handoff: {shortlist_max_rays: 6, interval_candidates_max: 6, search_order: continuous exact-aim joint-plus-standoff solve then continuous bounded-fallback solve before the next ray, feasibility_owner: Tesseract worker, voxel_nbv_exact_candidate_max: 12}
  history: Accepted and rejected achieved records may carry additive ray_id. Accepted records alone modify coverage and retire their inclusive configured angular neighbourhood. Rejected directions do not become accepted-neighbour culls. latest_achieved_camera remains the physical start after rejection. Centre-dependent bootstrap culls reset at the qualified population boundary; culls in the qualified population never reactivate.
  public_compatibility: No message definition changes. Existing viewpoint_indices carry an encoded ray/probe identity; additive private JSON and provenance carry explicit ray fields.
target_range_terminal_contract_2026_08_21:
  proof: The exact heavy-refresh job must contain a fresh semantic target mask with existing minimum valid pixel and ratio support, and every positive finite masked depth sample must exceed 1.20 m.
  result: {outcome: REPOSITION_REQUIRED, failure_code: TARGET_TOO_FAR, retryable: true, reason: includes masked depth and rough base_link x/y/z, shutdown: normal mission failure route}
  absence: Five ordinary not-found acquisition looks retain TARGET_NOT_FOUND and retryable true; reason and action_summary_json include rough base_link x/y/z.
  fail_closed: Missing correlated depth, shape mismatch, insufficient support, mixed in-range depth or background-only depth cannot produce TARGET_TOO_FAR.
target_tracking_measurement_contract_2026_08_20:
  public_interface_change: none
  measurement_validity: Target3D correction input requires a fresh, same-frame, decodable, correctly sized, nonempty semantic target mask plus sufficient finite qualified target depth. Absence of any requirement publishes valid false with a depth_source rejection reason; it never substitutes rectangular ROI depth.
  correction: The timestamped finite measurement is transformed to base_link, predicted to its timestamp and accepted only when normalized innovation d2, calculated with base measurement noise 0.02, is finite and no greater than innovation_gate_threshold. Perception confidence scales correction R but cannot enlarge or bypass the gate.
  prediction_only: Missing or rejected input advances the existing filter without correction. A mature track publishes valid true, stable false and LOW_CONFIDENCE with decaying confidence for less than lost_timeout_s 5.0; expiry publishes invalid LOST and resets the filter.
  near_static_defaults: {process_noise: 0.01, measurement_noise: 0.02, lost_timeout_s: 5.0}
  model: The six-state wire-compatible filter uses zero velocity retention for the stationary scan target; no parallel NBV-specific target estimate exists.
  compatibility_parameters: max_3d_jump_m and max_target_speed_mps remain declared for launch/parameter compatibility but no longer authorize corrections; innovation_gate_threshold defaults to 5.0.
tesseract_worker_model_readiness_contract_2026_08_20:
  worker_ready: A ready worker heartbeat is published only after the qualified URDF/SRDF Robot scene has been constructed successfully. A scene with no successfully added request-local obstacle remains clean and may serve repeated requests; any successful obstacle addition marks it dirty and forces reconstruction before the next request so geometry cannot leak.
  budget_boundary: Robot model initialization and request-local scene setup are excluded from the unchanged 45-second automatic one-view planning budget and remain bounded by the unchanged 180-second bridge response timeout. Candidate IK, collision, path and dense validation remain inside the worker budget.
between_view_reacquisition_contract_2026_08_20:
  behavior: After VIEW_COMPLETE, VIEW_REJECTED or target-drift rejection, the arm remains held and MissionEngine re-enters command-free view generation/request. A typed LOST, LOW_CONFIDENCE, prediction-only or stale tracking refusal is handled by the existing bounded request/approval reacquisition path. No proposal can move until the normal authorization, target, obstacle, camera, controller, collision, path and visibility gates approve it.
  initial_gate: The stable multiview readiness proof after occlusion assessment is unchanged and remains mandatory before the first scan plan.
  unchanged: [scan_visual_reacquisition_timeout_sec 30.0, replan budget, capture count, public interfaces, motion and shutdown]
global_nbv_target_aim_contract_2026_08_20:
  public_interface_change: none
  additive_private_json: {scan_viewpoints: [selection_failure_code, nbv_marginal_information_pixels, nbv_marginal_information_fraction], scan_coverage: [generated_candidates, duplicate_rejected_candidates, information_scored_candidates, positive_information_candidates], reachability: [prequalified, reachable compatibility alias, reachable_field_semantics], tesseract_scene: [exact look direction, optional fallback_look_directions, maximum_final_aim_offset_deg, nbv_marginal_information_pixels, nbv_marginal_information_fraction], plan_provenance: [nominal_look_direction, fallback look direction when used, aim_fallback_used, aim_offset_deg, worker-owned aim attempt diagnostics, shortlisted candidate failures with typed stages, selected marginal information, direction novelty and travel], scan_history: [latest_achieved_camera, achieved timestamps, proposed versus actual camera/look, target_estimate_used]}
  candidate_meanings: {generated: sampled inside configured target-centric region, prequalified: passed cheap geometry/status checks but has not passed IK or collision, useful: authoritative normalized predicted marginal information is at least 0.02, shortlisted: one of at most twelve voxel exact points or six ray directions sent to Tesseract, feasible: finite bounded IK plus collision/path/visibility validation, accepted: synchronized durable GOOD/CLEAR capture}
  ranking: Positive information is unknown projected target evidence plus direction-novel known surface evidence. Compare its fraction of projected target support first, then minimum angular separation from all accepted achieved views, then absolute marginal pixels and only then camera travel. Raw projected unknown count is diagnostic and must not dominate the ranking.
  aim: Every shortlisted automatic candidate carries exact normalized target-minus-camera aim. Worker exhausts roll/IK/path alternatives for exact aim before the single optional fallback; any fallback and selected result must be hash-bound and no more than five degrees from exact aim. The independent dense-path visibility cone remains twenty degrees.
  failures: NO_POSITIVE_INFORMATION_CANDIDATE means cumulative coverage predicts no useful candidate before Tesseract. TESSERACT_EXHAUSTED means informative shortlisted candidates existed but none passed worker feasibility.
  shortlist_handoff: "Exact-point voxel_nbv retains the bounded twelve-candidate diversity handoff: six global information leaders, five mid-elevation alternatives and one nearby continuity candidate, restored to NBV rank. ray_nbv instead retains at most six ranked directions and expands each direction into a contiguous preferred-then-reserve probe group. Worker feasibility remains authoritative for both."
  state_history: Settled achieved FK is persisted even when capture is rejected and becomes the next motion-cost start. Only accepted durable captures increment coverage/reconstruction generation.
  capture_recovery: A fresh transient visual rejection receives exactly one correlated heavy refresh at the held achieved pose. If the single-flight worker is busy, the bridge retains that request, publishes waiting_for_worker and queues it exactly once after idle when a qualifying fresh frame exists. The executor waits within the original capture timeout; timeout fails the mission, while persistent visual rejection returns VIEW_REJECTED. WAITING_FOR_CAPTURE_REFRESH is stationary and may retain the approval-time scene while perception rebuilds obstacle geometry, but no subsequent plan approval or motion may bypass the normal fresh valid obstacle gate. Existing ten-attempt missing/stale transport readiness retries remain separate.
  capture_boundary: The capture status remains an observation boundary carrying state and reason. It does not publish a recovery recommendation; the existing capture coordinator and executor map a typed visual rejection to the one-refresh policy.
  diagnostic_landmark_boundary: Production target_landmark may publish landmark/projection/status diagnostics but is launched with request_refresh_on_new_view and request_refresh_on_mask_disagreement false. It cannot inject an asynchronous semantic result or obstacle session while scan motion is active.
  unchanged: [RunTargetScan action and schemas, ROS topics services messages and QoS, parameter names and defaults, speeds, joint and collision limits, freshness and target drift thresholds, capture quality and occlusion thresholds, home enable disable shutdown and process ownership]
post_startup_joint6_range_contract_2026_08_20:
