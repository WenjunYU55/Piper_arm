phase4_process_supervisor_contract_2026_08_14:
  internal_source_of_truth: piper_mobile_manipulation/infrastructure/process_supervisor.py
  process_spec: {name: immutable owned identity, command: immutable exact argv, environment: immutable copied mapping}
