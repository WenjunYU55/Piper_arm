  accepted_scan_evidence: {task_id: gui-sim-d30410e05b9c405cb48e969fa818c173, dataset: datasets/active_scan/scan_20260811_124232, good_clear_captures: 10, viewpoint_planning_status: accepted}
  exact_regression_pose_rad: [-1.38924016, 2.151002196, -0.657167812, 1.080463916, 1.23006366, -2.97428922]
  attached_envelope_link6: {center_m: [-0.029750002, 0.0, 0.0375], size_m: [0.1395, 0.10572671, 0.053], minimum_external_clearance_m: 0.005, incident_pose_floor_clearance_m: 0.001245441}
