schema_version: 1
document: runtime_contracts
responsibility_package_contract_2026_08_27:
  internal_owners: {mission core: piper_mobile_manipulation/mission/core.py, mission progression and engine construction: piper_mobile_manipulation/mission/engine.py, mission-bound guarded resources: piper_mobile_manipulation/mission/resources.py, mission spool: piper_mobile_manipulation/mission/spool.py, typed failures: piper_mobile_manipulation/infrastructure/failure_model.py, telemetry: piper_mobile_manipulation/infrastructure/telemetry_store.py, child processes: piper_mobile_manipulation/infrastructure/process_supervisor.py}
  compatibility: The six former root-level modules remain installed one-way facades with explicit __all__ exports referring to the identical owner objects. ROS messages services actions topics parameters spool bytes hashes and process escalation are unchanged.
  forbidden: [duplicate implementation in a facade, owner import from facade, facade-specific mutable state, silent symbol fallback]
execution_package_contract_2026_08_27:
  internal_owners: [execution/authorization.py, execution/capture.py, execution/modes.py, execution/motion.py, execution/recovery.py, execution/trajectory.py, execution/validation.py]
  compatibility: Former module paths retain explicit __all__ exports pointing to identical owner objects. Constants arrays functions dataclasses enums exception behavior and return shapes are unchanged.
  external_change: none
ray_review_operator_name_contract_2026_08_27:
  internal_basename: RayProcesses - HH:MM - DD-MM-YYYY
  files: [RayProcesses - HH:MM - DD-MM-YYYY.json, RayProcesses - HH:MM - DD-MM-YYYY.html]
  time_basis: earliest positive event timestamp in the first locked snapshot converted to the writer machine local timezone and truncated to the minute; current local time only when that snapshot has no usable event
  identity_boundary: The filename may duplicate across missions. Unique mission_id or session_id parent directories remain artifact identity, and the fixed legacy-compatible .ray_mission_diagnostics.lock makes the first basename authoritative for every later updated writer and generation in that directory.
  consumers: [RayMissionDiagnosticsStore JSON and HTML writer, piper_gui_native.py Diagnostics report selector, piper_gui/ray_review_viewer.py window title]
  compatibility: [legacy ray_mission_diagnostics.json and HTML discovery and continued append, existing report ordering, live atomic replacement, path containment, historical replay, same-minute reports in separate parent directories, command-free ownership]
capture_one_model_seed_contract_2026_08_26:
  private_capture_result: {transport: std_srvs/Trigger response.message JSON, capture_result_schema_version: 1, required_field: qualified_target_model_seed, public_api: false}
  model_seed: {schema_version: 1, shape: digest-valid silhouette reconstructed from the exact persisted capture mask and confidence-qualified target depth, base_from_camera: base_link header plus matching camera child frame and finite homogeneous matrix recorded by scan capture, maximum_shape_transform_delta_sec: 0.100, digest: model_seed_sha256}
  capture_metadata: view_000_metadata.yaml carries the same qualified_target_model_seed before files are atomically committed and before Trigger success.
  executor_admission: Capture one success without a valid bound seed aborts before /supervised_cube_workflow/capture_view. On workflow acceptance, executor promotes qualified_target_shape and qualified_target_model_seed atomically into scan history; rejection clears both pending fields.
  planner_consumption: For production history containing qualified_target_model_seed, build_revolution_envelope consumes its immutable matrix directly. No TF lookup is allowed. Shape-only live production history is invalid; a compatibility lookup remains only for older command-free replay payloads.
  failure_boundary: Missing malformed unsynchronized child-frame-mismatched nonhomogeneous or digest-invalid evidence cannot create a qualified ray population.
object_sized_coverage_and_ray_lifecycle_contract_2026_08_26:
  target_centres: {bootstrap_anchor_m: accepted visible-surface tracking lock retained as provenance, planning_anchor_m: qualified mask-revolution axis_origin_m, permanent_ray_center: planning_anchor_m, coverage_model_center: planning_anchor_m, executor_upgrade: exactly once after accepted capture one and first envelope-bound plan}
  coverage_model: {source: qualified revolved target envelope, center: planning_anchor_m equals axis_origin_m in base_link, diameter: maximum of uninflated visible_axial_span_m and visible_transverse_span_m, representation: spherical NBV voxel grid, review_color: grey, distinct_from: 0.250 m camera-to-surface clearance}
  population_identity: {bootstrap: temporary population bound to visible-surface lock, qualified: permanent population bound to mask-derived object centre, transition: different digest and mandatory hard-cull ledger reset, qualified_stable_fields: [ray_id, generated_order, normalized direction quantized to 1e-9 components, qualified target center, frame], mutable_generation_fields_excluded: [representative camera position, scoring standoff, requested and envelope-adjusted standoff bounds, envelope hash]}
  retirement: {accepted_capture: retire selected direction and every direction at or below 15 degrees, permanent_evidence: retain for matching session population and source revision, retryable_evidence: framing collision path visibility timeout transport and generic planning failure}
  endpoint_static_evidence: The bridge may treat typed candidate stage RAY_IK_FAILURE as permanent only because the worker emits it after exhausting bounded standoff roll exact-aim and fallback-aim variants. Human-readable matching is prohibited.
  event_journal_lifecycle: Generation zero records phase bootstrap. Accepted capture one is followed by upgrade_population with population_reset true phase qualified a different population SHA and all 360 qualified rays centred at the envelope planning anchor. Later cull events restate carried qualified hard-cull IDs with permanent disposition, but store normalization includes an ID in newly_culled_ray_ids only on an actual active-to-culled edge within that population. Past culls remain stored and visible by default.
first_ray_provisional_pool_stability_contract_2026_08_26:
  authorization: A nonempty zero-capture scan session may bootstrap one generation-zero pool from its tracked target centre without constructing an envelope or consuming live target-shape evidence.
  retained_state: [session_id, visible-surface bootstrap anchor, temporary configured ray IDs and directions until accepted capture one]
  retention_bounds: [same nonempty session, accepted_views equals zero, frozen pool exists, qualified_target_shape absent, qualified_target_model_seed absent]
  forbidden: [classifying crop before the endpoint, using rough or pre-settle shape as model evidence, making pool availability depend on cross-topic timestamp ordering, revolving a clipped contour, carrying the pool into another session]
  endpoint_authority: The executor independently requires a fresh post-settle source-stamped silhouette and achieved aim within five degrees before clear retry-too-close or too-large classification. That live silhouette authorizes capture only. The recorder rebuilds the pending model seed from the exact persisted capture mask/depth and synchronized transform; capture acceptance is required for promotion. Promotion authorizes one planner population replacement around the mask-derived object centre, not reuse of bootstrap culls.
  unchanged: [public ROS schemas, capability prequalification, Tesseract IK collision path aim and visibility, plan hash approval, motion speed, capture, terminal home disable and cleanup]
first_scan_ray_framing_contract_2026_08_26:
  public_ros_interface_change: none
  private_scan_history_fields: {framing_retry_ray_id: nonnegative frozen ray ID, framing_retry_min_standoff_m: next strictly farther bounded minimum}
  sequence: MissionEngine begins ordinary MULTIVIEW_SCAN after ACQUIRED. The planner creates a provisional generation-zero pool from tracking only. The first selected ray is planned approved moved and settled; the executor proves final target aim and checks a fresh source-stamped shape before capture. A complete shape authorizes capture but does not seed geometry. The recorder returns the exact persisted shape plus synchronized transform; that seed remains pending until workflow acceptance. A middle-band crop records one same-ray farther request and rejects without capture.
  evidence: [zero accepted captures, current MULTIVIEW_SCAN ray ID, shape receipt and source stamp both after settle begins over sensor-data QoS, achieved FK camera pose, frozen plan target centre, optical-axis error no more than five degrees, achieved camera-to-target-centre distance, validated shape digest]
  classification: {complete silhouette: capture may proceed, clipped distance <=0.250 m: TARGET_TOO_LARGE_OR_CLOSE, clipped distance between bounds: same ray with next 0.10 m minimum, clipped distance >=0.800 m: TARGET_SCAN_IMPOSSIBLE, no farther feasible or aimed endpoint: TARGET_TOO_LARGE_OR_CLOSE}
  motion_contract: Retry constrains only the endpoint ray direction minimum distance and target-facing look vector. Tesseract may use any safe joint-space trajectory and retains IK collision path aim and visibility authority. Exact plan hash approval runtime gates and 0.250 m clearance remain unchanged.
target_shape_and_envelope_contract_2026_08_25:
  topic: {name: /piper/target_shape_measurement, type: std_msgs/String JSON, qos: BEST_EFFORT/VOLATILE sensor-data profile, publisher: depth_to_3d_node.py, sole_consumer: scan_viewpoint_executor_node.py, public_api: false}
  qualified_history_handoff: {fields: [qualified_target_shape, qualified_target_model_seed], producer: scan capture constructs exact seed and executor promotes after accepted capture one, pending_behavior: discard on rejection, consumer: planner through validate_history_payload, publication: accepted capture transaction, transform_authority: immutable base_from_camera matrix recorded with capture one, forbidden_new_session_behavior: delayed live TF lookup, bootstrap_provenance: frozen history visible-surface centre, permanent_revolution_and_ray_anchor: computed axis_origin_m}
  shape_validity: Canonical hash, finite bounded contour, qualified mask/depth source, exact timestamp correlation and a selected semantic component touching no image border are required.
  clipped_rejection: {schema_version: 1, valid: false, rejection_code: TARGET_SILHOUETTE_CLIPPED, required_fields: [exact source header, near_depth_m, measurement_sha256], publication_order: before same-stamp Target3D}
  planner_classification: The planner never consumes the live shape topic or infers size or closeness from near_depth_m. It creates the first bounded target-ray generation without an envelope and later builds geometry only from executor-qualified scan history; size classification remains executor-owned.
  coordinator_contract: The private planner selection_failure_code is preserved by the Tesseract bridge; failure_model is the sole legacy text boundary and maps explicit framing tags into existing RunTargetScan result fields without changing the action schema. An unrelated NO_REACHABLE_PLAN must never be relabelled as a framing exhaustion.
  envelope: {frame: base_link, inflation_m: 0.010, camera_surface_clearance_m: 0.250, maximum_profile_sections: 24, optional_visible_silhouette_points_m: 3 through 256 finite base_link points in original contour order, lifecycle: frozen with mission ray pool}
  ray_evidence: Every one of the 360 generated IDs remains journaled; no-safe-standoff rays are permanent first-cycle culls and never re-enter ranking.
  tesseract_binding: Candidate envelope hashes and planning anchor must match; collision boxes count toward MAX_OBSTACLES=256. The private worker scene receives the additive optional outline inside its validated target_envelope for hash provenance, but only collision_boxes enters scene.obstacles and collision planning.
target_relative_capability_bounded_ray_contract_2026_08_25:
  public_ros_interface_change: none
  configured_request: {ray_min_standoff_m: 0.28, ray_preferred_max_standoff_m: 0.50, ray_max_standoff_m: 0.80, coordinate_meaning: target-to-camera distance along the frozen target ray, forbidden_clip: target center distance from base_link}
  enforcing_prequalification: A valid capability map samples the complete configured request at its spatial resolution, reports the support boolean for each sample and derives ordered contiguous supported intervals. A ray with no support is culled; a surviving ray preserves requested bounds and uses the first supported lower bound through the last supported upper bound as its active search envelope.
  additive_private_fields: [ray_requested_min_standoff_m, ray_requested_max_standoff_m, ray_capability_intervals_m, ray_capability_min_standoff_m, ray_capability_max_standoff_m, ray_capability_bounded, capability_map_prequalification.sampled_standoffs, capability_map_prequalification.supported_standoff_samples, capability_map_prequalification.supported_intervals_m]
  seed_rule: The representative/scoring point and generation-zero travel seed are selected from a supported run when run evidence exists. Disjoint runs remain explicit even though the worker's coarse active min/max envelope can span an unsupported gap.
  fail_closed: Malformed support intervals are not accepted as capability bounds. Missing, corrupt, stale or unqualified capability artifacts retain the existing coarse fallback and configured request; they do not invent support.
  exact_authority: Capability occupancy and its active envelope are not IK, collision, path, aim or visibility proof. The worker validates the actual selected endpoint and every existing executor gate remains unchanged.
mission_ray_diagnostic_artifacts_2026_08_25:
  kind: local_command_free_artifact
  default_directory: datasets/ray_diagnostics/<mission_id-or-session_id>/
  legacy_read_directory: datasets/active_scan/ray_diagnostics/<mission_id-or-session_id>/
  files: [RayProcesses - HH:MM - DD-MM-YYYY.json schema-v2 with v1 and legacy-basename loading, same-stem HTML compatibility export, coverage/capture_NNN.npz exact CoverageSnapshot]
  identity: The mission task ID groups reacquisition sessions when PIPER_MISSION_TASK_ID is present; otherwise the scan session ID owns the report. Each generation key is session_id plus accepted_views.
  content: [target center and frame, immutable hash-indexed complete ray population for every recorded generation, every generated ray direction and representative position, azimuth and elevation, standoff interval, deterministic-seed or NBV rank, event-time input eliminated and surviving counts, information metrics, planner cull reason, workspace and capability-map prequalification, bridge shortlist state, Tesseract attempt failure and selection evidence, selected endpoint joint positions, achieved historical joint and camera pose]
  rendering: One reusable ROS-free PyQt5/VTK Ray Review child with Mission Process and Capability Map tabs. It parses all checked-in URDF visuals, draws rays before culling without a misleading shell of virtual cameras, and GPU-instances the full L515 mesh only at current survivor representative positions after that population has cull evidence. Past culls remain visible as dashed audit rays without camera meshes. It scrubs only append-only event-time evidence and loads the committed capability map read-only. The top of the right-hand inspector keeps a dedicated Target layers group with independent default-on Estimated revolved model, Conservative planning boxes and Original mask/depth outline controls so resizing cannot bury them below ray filters; the smooth mesh is derived presentation, boxes remain exact planning evidence, and the optional outline is recorded source evidence. Self-contained HTML remains a compatibility export whose old kinematic drawing is labelled schematic.
  write_policy: Enabled by default, root follows PIPER_ARM_ROOT/datasets/ray_diagnostics unless explicitly configured, file locking plus atomic replacement, diagnostic exceptions are logged and never change planner/filter/bridge output. All runtime writers and offline replay tools must share the same root for a new mission.
  gui_access: The native GUI Diagnostics tab exposes Open Ray Review, discovers the canonical root plus the former root for historical reads, validates containment within the selected root, reuses one child through newline-delimited stdin JSON, and shuts down only that child with the GUI. It creates new command-free reports from immutable completed scan metadata only in the canonical root.
  historical_replay: Archived accepted rays, achieved joints, measured camera transforms, ranks and planning summaries are replayed exactly when present. Archives predating complete ray diagnostics are explicitly marked partial; missing rejected-ray identities and reasons are never reconstructed or invented.
  invariants: [observational only, viewer contains no ROS import entity or command owner, no capability-map generation or write, no external scripts or network assets, no public ROS action service topic message QoS or Tesseract schema-version change, the separately documented private ray-hard-cull topic is not diagnostic authority, no recomputed rank or inferred feasibility, optional outline is additive private evidence and never enters scene.obstacles]
persistent_ray_hard_cull_contract_2026_08_25:
  interface: {topic: /piper/ray_hard_culls, type: std_msgs/String containing canonical JSON, qos: reliable transient_local, publishers: [viewpoint_reachability_filter_node.py, piper_tesseract_foxy/bridge_node.py], subscriber: scan_viewpoint_planner_node.py}
  population_identity: {schema_version: 1, fields: [mission_id, session_id, sha256, ray_count, target_center_m, frame_id], hash_input: canonical ray_id-sorted generated order and normalized directions; target centre and frame are digest-bound separately, excluded_generation_geometry: [representative points, angles, standoff bounds, envelope hash]}
  snapshot: {fields: [schema_version, population, source, source_revision, generation_observed, complete_snapshot, culls], allowed_sources: [prequalification, tesseract_endpoint], complete_snapshot: required_true}
  prequalification_source: Only the unchanged continuous workspace no-intersection and hash-qualified CAPABILITY_MAP_NO_SUPPORT decisions are cumulative hard evidence. Its source revision binds all coarse bounds, floor, effective map mode and exact map artifact hash.
  endpoint_source: Worker planning_diagnostics.permanent_infeasible_ray_ids and bridge-classified typed RAY_IK_FAILURE candidate evidence are intersected with exact request ray IDs. RAY_IK_FAILURE is eligible only after the worker's complete configured continuous endpoint search. Its source revision binds the planning model, hand-eye calibration hash and joint-position limits.
  merge: The planner accepts only the exact current population key. It maintains one ledger per source; the same revision merges monotonically, a changed revision replaces that source, a population change resets all sources, and malformed or mismatched input adds no cull.
  planner_effect: Matching hard-cull IDs are removed before accepted-history redundancy and information scoring. The generated population and diagnostics retain them as culled_hard. Accepted captures alone update coverage and surviving rays retain their ordinary NBV ordering.
  prohibited_promotions: [endpoint collision, path failure, visibility failure, timeout, transport rejection, generic PLANNING_FAILED, generation-scoped TESSERACT_EXHAUSTED, partial candidate failure, human-readable reason matching]
  compatibility: Private additive topic and JSON fields only; public actions services messages and exact schema-v5 Tesseract request and response hashes remain unchanged.
generation_zero_ray_seed_contract_2026_08_25:
  applies_when: policy ray_nbv_seed and accepted_views equals zero
  ordering: Ascending Euclidean travel from the actual current FK camera position to the closest permitted point on each bounded target-ray interval; stable existing tie-breakers remain private.
  transition: The first accepted capture ends seed ordering. Later ray_nbv generations use cumulative accepted-only marginal information ranking.
  compatibility: No public ROS schema, topic, service, action, parameter, timing or motion contract changes.
startup_wrist_terminal_prerequisite_contract_2026_08_24:
  public_surface_change: none
  startup_rearm: Only an explicitly tagged STARTUP_WRIST command may re-arm an unfinished inactive transaction, and only from finite coherent nonpositive logical J6 feedback toward a finite nondecreasing target no greater than ready zero.
  direction_authority: Existing controller-coordinate mapping, positive high-water watchdog, controller limit proof and J6-only J1-J5 preservation remain unchanged.
  terminal_order: If an enabled mission has proved neither startup_wrist_completed nor startup_home_completed, terminal recovery must prove STARTUP_WRIST before issuing PRE_HOME. A proved rough startup home is backward-compatible proof that its wrist prerequisite occurred.
  failure: Unproved terminal STARTUP_WRIST retains the enabled command owner and emits no later home or disable stage. Fresh motor-control loss continues to suppress all automatic motion and wait for six-disabled feedback.
  compatibility: [ExecuteHomeStage schema unchanged, action result schema unchanged, topics services QoS parameters targets tolerances speeds and J6 limits unchanged]
camera_capability_map_contract_2026_08_24:
  public_ros_interface_change: none
  private_parameters: {capability_map_mode: {values: [off, shadow, enforce], default: enforce}, capability_map_project_root: {default: PIPER_ARM_ROOT or /home/prl/Piper_arm}, capability_map_path: {default: config/piper_camera_capability_map.npz beneath project root}, floor_z_m: {startup_override: selected tabletop 0.005 or ground -0.466}}
  artifact_schema: {version: 1, position_voxel_m: 0.02, direction_bin_deg: 10.0, direction_tolerance_deg: 15.0, spatial_dilation_cells: 1, stores_joint_positions: false}
  acceptance: One ray is retained when any sampled point over its complete configured target-relative request intersects a nearby occupied pose-direction bin whose stored best attached-tool minimum Z clears the selected floor by the unchanged 0.005 m. Enforce mode records contiguous supported runs, preserves requested bounds and narrows active min/max only to the outer support envelope.
  invalid_artifact_behavior: Fall back to the existing coarse bounded-ray intersection and never bypass Tesseract.
  diagnostics: Existing private JSON adds map status, per-ray support, checked and matched key counts, sampled and supported-standoff counts, supported intervals, requested and active bounds, query time and CAPABILITY_MAP_NO_SUPPORT without changing a public message definition.
tracked_robot_description_contract_2026_08_24:
  tree: {external_dynamic_edge: odom -> base_link, tracked_root: robot_bottom, tracked_base: base_link, arm_model_root: arm_base_link, gateway_arm_frame: piper_base_link, gateway_alias_transform: identity}
  mount: {parent: base_link, child: arm_base_link, xyz_m: [0.39, 0.0, 0.016], rpy_rad: [0.0, 0.0, 0.0]}
  target_goal: {frame: odom, stamp: source observation time, transform_at_admission: odom -> piper_base_link, private_output_frame: base_link}
  geometry: The tracked description owns the chassis and sensor station exactly once. The exported arm Xacro excludes the arm-planning description's embedded Bunker visual links; piper_base_link is geometry-free.
  replacement_unit: [drop_in/src/piper_description/urdf/piper_description.xacro, drop_in/src/bunker_pro2/urdf/bunker_pro2.urdf]
  public_ros_change: none
bunker_collision_profile_contract_2026_08_24:
  public_ros_interface_change: none
  coordinator_parameters: {floor_profile: {values: [saved, tabletop, ground], default: saved}, floor_profile_path: {default: empty_means_project_config}}
  environment: {name: PIPER_FLOOR_PROFILE, values: [tabletop, ground], producer: coordinator mission-generation snapshot}
  gui_config: {path: piper_mobile_manipulation/config/collision_environment.yaml, key: floor_profile, values: [tabletop, ground], mutation: atomic and idle-only}
  model_binding: The bridge-selected SRDF and collision-manifest SHA-256 values must equal the worker heartbeat values before readiness. Unknown, missing legacy hash, or mixed profile fails closed.
  frame: Existing arm base_link remains the planning frame. Bunker source geometry is transformed into that frame before model construction.
  geometry: {chassis_cells: 46, station_cells: 16, xy_cell_m: 0.15, triangle_policy: retain every source triangle}
  floors: {tabletop_m: 0.005, ground_m: -0.466}
  invariant: Both floor profiles use the same piper_bunker.srdf and the same PiPER/L515/Bunker collision decompositions; only external_floor_clearance.floor_z_m differs.
  compatibility: [no topic service action or message changes, no speed or limit changes, no hand-eye or TF semantic changes, no home-policy changes]
deadline_terminal_home_authorization_contract_2026_08_24:
  public_surface_change: none
  trigger: A deadline-expired mission has entered the existing non-interruptible terminal recovery path and has either acknowledged scan stop/hold or refreshed static-startup joint feedback.
  authorization: Reuse the same task ID and mission SHA-256 with a fresh expiry of plan_request_queue_timeout_sec plus plan_result_timeout_sec plus 10 seconds for each direct-home stage. This does not restart scan phases.
  unchanged_sequence_after_startup_ready: [PRE_HOME, ROUGH_HOME, STORAGE_WRIST, feedback-confirmed all-six disable, authorization revoke, owned-process cleanup]
  startup_exception: Before startup readiness is proved, STARTUP_WRIST is a mandatory prerequisite to that unchanged terminal sequence.
  exception: Freshly confirmed motor-control loss remains the sole no-command route and never receives terminal-home renewal.
  compatibility: [AuthorizeMission service schema unchanged, ExecuteHomeStage service schema unchanged, action result unchanged, home targets tolerances speeds and motion validation unchanged]
ray_endpoint_failure_contract_2026_08_23:
  public_interface_change: none
  private_worker_diagnostics: [NO_RAW_IK, JOINT_LIMIT_FAILURE, ENDPOINT_COLLISION, IK_VALIDATION_FAILURE, PATH_FAILURE, permanent_endpoint_failure, permanent_infeasible_ray_ids]
  private_ray_request: One candidate represents one bounded target ray with target center, normalized direction, minimum and maximum standoff, and representative standoff. The worker jointly solves six joints plus continuous standoff. A successful response may select a different endpoint only if it lies on that exact ray inside the transmitted interval.
  permanence_rule: A bounded local nonlinear solve cannot prove global complete-ray infeasibility. RAY_IK_FAILURE, endpoint collision, path failure, visibility failure and timeout remain contextual to the current accepted-coverage generation and never become session-static from human-readable text.
  cache_lifetime: Session-static failure survives accepted_views changes and resets on session_id change. Existing contextual exhaustion remains scoped to session_id plus accepted_views.
  diversity_rule: minimum_useful_direction_separation_deg is ten degrees for accepted target-to-camera directions and is never a maximum movement rule.
target_local_occluder_classification_2026_08_23:
  input: A fresh target mask, aligned depth, target depth layer and optional GroundingDINO obstacle semantics from the same heavy-refresh image.
  relevance: A target-local depth component is retained only when at least the existing minimum support crosses the one-pixel-eroded filled target silhouette; exterior depth-discontinuity halos, support surfaces and shadows are not target-relevant merely because they occupy the target bounding rectangle.
  classifications:
    UNSAFE: Reserved for explicit hand, finger, person or human semantics.
    MOVABLE: Reserved for the existing qualified pen, marker or stick whitelist.
    BLOCKED: Unknown, unqualified or contradictory metadata remains fail-closed without being reported as a human hazard.
    ignored: Obstacles failing target-relevance qualification are removed from published obstacle evidence.
  defaults: Missing unsafe metadata is false at heavy-worker, live-worker and 3D-projection boundaries; missing object metadata remains invalid and BLOCKED.
  unchanged: [public ROS messages, topic names, request correlation, depth thresholds, movable whitelist, collision behavior, contact authorization]
startup_limit_role_contract_2026_08_23:
  behavior: Before the disabled-arm readiness query requests controller speed and acceleration limits, the PiPER driver restores the documented motion-output role only when fresh complete feedback proves all six motors disabled and fault-free. The enable transition repeats the same fail-closed proof.
  safety: No controller-role command or limit query is sent by this recovery path while any motor is enabled, feedback is stale/incomplete, or a motor fault is present. Public services, limits, speeds and startup ordering are unchanged.
capture_refresh_retry_epoch_contract_2026_08_23:
  behavior: A successful request-correlated heavy refresh begins a new bounded capture-readiness evidence epoch at the same achieved pose. Pre-refresh missing/stale evidence attempts do not consume the refreshed evidence retries.
  bound: The original heavy-refresh request ID remains authoritative, so the viewpoint can never start a second heavy refresh. Existing ten-attempt readiness, capture timeout, persistent visual rejection, worker failure and mission shutdown semantics remain unchanged.
connected_target_mesh_contract_2026_08_23:
  assumption: One reconstruction target is physically connected.
  classification: Cluster extracted TSDF triangles by edge connectivity and compare each component surface area with the dominant component. Below 0.05 is a removable tiny fragment; at or above 0.05 is substantial and must remain visible.
  failure: More than one substantial component produces MULTIPLE_SUBSTANTIAL_COMPONENTS and structural FAIL. The implementation never silently selects one of multiple substantial surfaces.
  outputs: The existing mesh_path is the cleaned mesh. raw_mesh_path is its adjacent untouched extracted TSDF. measured_cloud_path is an adjacent PLY containing every accepted temporally averaged target-depth point transformed into base_link by the selected refined camera pose without display downsampling. All three paths have SHA-256 identities in the same quality report; measured_point_count and measured_cloud_views make the capture-colored diagnostic cloud auditable.
  quality: Registration selection and terminal pass/fail use raw_mesh_metrics, preserving the pre-cleanup dimension residual component and manifold evidence. mesh_metrics describes the cleaned deliverable for comparison.
  compatibility: Quality JSON gains additive raw mesh, component-filter and measured-cloud provenance. Existing cleaned mesh path, CLI options, immutable inputs and every ROS interface remain unchanged; the command-free GUI adds only build/open/overlay presentation controls. Measured-cloud colors never enter registration, TSDF, quality or motion logic.
hand_eye_accuracy_contract_2026_08_22:
  sample: A sample requires the complete 5x5 board, CameraInfo-aware ChArUco interpolation, the unchanged 0.75-second/0.001-rad six-joint stability proof, and joint feedback whose source header is nearest the image source header by no more than 0.100 seconds. Persist both source stamps and their delta.
  fk: Firmware S-V1.5-8 uses piper_sdk_modified_dh_mode_0. Controller end-pose feedback is diagnostic only and does not replace joint-derived capture-time FK.
  solve: PARK remains the default candidate method. Pose geometry and TSAI/PARK/HORAUD/ANDREFF/DANIILIDIS comparison are diagnostics; method choice cannot bypass held-out limits or activate the result.
  validate: Stationary-only collection reports within-pose translation, rotation and reprojection noise without commanding motion. Deployment still requires distinct fitting and held-out stations plus exact image-time base-to-camera validation.
  compatibility: No topic, service, action, message, QoS, parameter, TF frame, motion, calibration path, home, shutdown, NBV, perception, or reconstruction interface changed.
offline_resegmentation_contract_2026_08_22:
  selectable_mask_sources: [captured, offline_resegment]
  default_boundaries: {CLI_and_automatic_gateway: captured, command_free_GUI: captured, optional_explicit_GUI_mode: offline_resegment}
  offline_input: Immutable manifest-listed RGB and aligned depth plus manifest target label, profile and prompt. The captured detection mask is not copied into the model workspace and cannot serve as GroundingDINO fallback.
  derived_identity: Canonical hash of pipeline version, immutable manifest SHA-256, target label/profile/prompt and exact GroundingDINO config/checkpoint plus SAM2 checkpoint hashes.
  acceptance: Exactly one target mask with prompt_source groundingdino, finite positive detector and SAM2 confidence, correct RGB dimensions, nonempty binary support and at least 100 pixels after GroundingDINO-box clipping.
  fusion: The derived mask is intersected with captured confidence-qualified target support. It may remove pixels but cannot add target depth outside captured support. Every frame must retain the manifest minimum target-point count.
  outputs: Derived mask, red-removed/green-retained comparison overlay, generation index and additive mesh-quality provenance; no source artifact or public ROS message changes.
  failure: Missing assets/detection, fallback source, invalid hash/path/mask, insufficient retained support or GPU failure fails offline_resegment without silently using captured mode.
static_scene_pose_graph_registration_contract_2026_08_22:
  selectable_mode: scene_pose_graph
  inputs: Immutable aligned RGB/depth, segmentation mask, camera intrinsics and capture-time T_base_camera already present in each accepted frame.
  registration_only: Target mask dilated by six pixels is removed from full-scene support. RGB-D odometry and 5 mm static-scene GICP use robot relative pose as their seed; an odometry failure falls back to the same robot seed rather than inventing a pose.
  fusion_only: TSDF continues to consume only confidence-qualified target depth/support. Static-scene pixels can never enter target reconstruction.
  bounds: {maximum_translation_correction_m: 0.020, maximum_rotation_correction_deg: 5.0, maximum_correspondence_m: 0.015}
  outputs: Existing mesh and quality JSON with backward-compatible registration-source, RGB-D odometry, edge and pose-correction provenance. No public ROS schema changes.
  GUI: scene_pose_graph and robot_pose are directly selectable; existing modes and the 0.5-through-3.0 mm voxel control remain available.
bounded_multiway_registration_contract_2026_08_21:
  inputs: Immutable confidence-qualified target geometry plus the recorded capture-time T_base_camera for each accepted view.
  pair_policy: Consecutive views plus at most three prior views with closest optical directions inside 75 degrees are cheap overlap candidates; pairwise GICP uses a 0.015 m correspondence distance and the existing fitness, residual, 0.020 m translation and 5 degree rotation rejection contract.
  optimization_policy: Accepted edges must form a connected graph. After pose-graph optimization, every final camera pose is rechecked relative to its own robot pose. Any disconnected graph, malformed transform or excessive correction fails the candidate closed.
  auto_policy: robot_pose is always evaluated. bounded_gicp, multiway_gicp and scene_pose_graph are optional candidates; only a candidate with nonworse dimensions/quality and material component-coherence or residual improvement is eligible.
  outputs: Existing quality JSON plus backward-compatible multiway pair, correction, assessment and selection provenance. No public ROS schema changes.
fixed_board_measurement_time_contract_2026_08_21:
  input: One complete detected board image with its original ROS header timestamp.
  transform: Resolve base_frame from camera_frame at that exact image timestamp. Latest-TF lookup is forbidden for accepted validation poses.
