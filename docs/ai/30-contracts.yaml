  parameter: {name: startup_joint6_controller_max_deg, unit: degrees, corrected_default: 545.0, minimum_qualified_feedback: 540.0}
  coordinate_contract: A completed positive-only startup retains a +2pi raw controller offset. Ordinary logical J6 remains bounded to [-pi,+pi] and therefore maps to raw [pi,3pi]; the positive controller limit must cover 3pi, or 540 degrees.
  fail_closed: A normal mapped J6 target above the configured qualified positive controller coordinate is rejected before JointCtrl is transmitted.
  unchanged: [JointState schema and topic, logical joint bounds, feedback wrapping, startup and storage targets, startup and storage directions, speed and timing, Tesseract contracts, TF and calibration]
previous_generation_process_contract_2026_08_20:
