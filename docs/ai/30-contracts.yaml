telemetry_snapshot_contract_2026_08_14:
  implementation: piper_mobile_manipulation/telemetry_store.py
  structure: {snapshot: [captured_at, revision, arm, perception, mission], observation: [value, received_at, source_stamp_ns, frame_id, revision]}
  arm_channels: [joints, status, motion_limits]
  perception_channels: [camera, target, tracking, target_status, obstacles]
  mission_channels: [readiness, plan, execution, capture, scan_history, reachable_scan, workflow]
  timestamp_semantics: received_at remains the existing process-monotonic callback receipt time; source_stamp_ns and frame_id preserve optional ROS header provenance and never replace receipt freshness.
  freshness_semantics: TelemetryObservation is stale only when age is strictly greater than the unchanged caller-supplied maximum. No timeout or threshold is centralized or modified.
  immutability: Frozen snapshots contain defensive copies; mutating an input or one returned nested value cannot mutate the store or a later snapshot.
  external_compatibility: No ROS subscription, topic, type, QoS, action, service, parameter, TF frame, payload, process, environment, or file contract changes.
ros_environment:
  domain_id: 42
  localhost_only: Must be identical in every participating terminal; recommended 1 for single-machine tests.
  middleware_porting_note: DDS discovery replaces fixed application ports; no project-specific TCP/HTTP ports exist.
core_topics:
  camera_color: {name: /camera/color/image_raw, type: sensor_msgs/Image, frame: camera_color_optical_frame, timestamp: RealSense host-corrected global time; rgb_camera.global_time_enabled must be true, next_start_profile_source: L515_camera/rgb_profile.conf, admitted_profiles: [640x480, 960x540, 1280x720, 1920x1080 at 15 or 30 FPS], default: 640x480 at 30 FPS, runtime_rule: saved GUI selection is read only by a newly started camera process and never mutates a live stream}
  aligned_depth: {name: /camera/aligned_depth_to_color/image_raw, type: sensor_msgs/Image, units: uint16 millimetres or float metres as handled by nodes, timestamp: RealSense host-corrected global time; depth_module.global_time_enabled must be true}
  camera_info: {name: /camera/color/camera_info, type: sensor_msgs/CameraInfo, timestamp: Same host-corrected per-frame color measurement time as camera_color; authoritative lightweight clock sample for camera_timestamp_watchdog}
  arm_feedback: {name: /joint_states_single, type: sensor_msgs/JointState, publisher_timing: executor-owned Node timer at 200 Hz; former unmanaged loop removed, invariant: first six positions are arm radians and provide authoritative sustained-motion/stationarity detection; instantaneous PiPER velocity may be noisy at rest and is not the watchdog's sole gate; watchdog and hand-eye TF request reliable depth-1 latest-sample QoS to avoid replaying a 200 Hz backlog}
  arm_status: {name: /arm_status, type: piper_msgs/PiperStatusMsg, publisher_timing: same monotonic driver loop as arm feedback, motor_fields: [motor_feedback_valid, motor_1_driver_enabled, motor_2_driver_enabled, motor_3_driver_enabled, motor_4_driver_enabled, motor_5_driver_enabled, motor_6_driver_enabled, motor_faults, motor_watchdog_reason], invariant: command-free reachability may accept a fresh six-disabled fault-free sample but rejects invalid or partial motor state; powered execution and the active mission require a fresh all-six-enabled fault-free sample continuously; missing/stale/invalid/partial/faulted powered status revokes motion authority even when aggregate err_code is zero; the filter owns one reliable depth-1 subscription for its lifetime and never recreates it at runtime}
  arm_motion_limits: {name: /piper/motion_limits, type: piper_msgs/PiperMotionLimits, publisher_timing: 1 Hz with SDK controller queries every 5 seconds, fields: ["joint1..joint6 order", "max_velocity_rad_s[6]", "max_acceleration_rad_s2[6]", valid, "canonical limits_sha256", source, reason], invariant: values must be fresh, finite, positive, no greater than PiPER protocol caps 3 rad/s and 5 rad/s2, and hash-bound into schema-v5 planning plus exact approval; missing/stale/invalid/malformed feedback rejects planning or execution, while a later fresh valid generation may replace the hash because tesseract_stream_v3 sends positions plus a bounded aggregate percentage and never sends Tesseract derivatives; these queried values are health evidence and are not multiplied into the v3 MoveJ-model schedule}
  arm_joint_command: {name: /joint_ctrl_single, type: sensor_msgs/JointState, effect: real motion when arm enabled, invariant: positions 0..5 are arm radians and are clipped by driver bounds; position 6 is gripper metres; velocity 6 is global SDK speed percent 0..100}
  arm_pose_command: {name: /pos_cmd, type: piper_msgs/PosCmd, effect: real Cartesian motion when enabled}
  enable_service: {name: /enable_srv, type: piper_msgs/srv/Enable, effect: real motor enable or software disable, behavior: serializes the transition; retries the SDK command every 10 ms; success requires all six low-speed FOC driver_enable_status flags at the requested state; any motor fault aborts enable; a failed/partial enable rolls back under the same lock until all six flags are false; gripper enable/disable is sent once only after success}
  motor_fault_watchdog: {owner: piper_ctrl_single_node.py 200 Hz feedback timer, input: all six low-speed FOC enable flags plus voltage_too_low/motor_overheating/driver_overcurrent/driver_overheating/collision_status/driver_error_status/stall_status for every motor, output: cached typed motor state and watchdog reason on /arm_status, invariant: any powered per-motor fault or persistent partial enable outside a serialized fault-free transition calls DisableArm(7), clears driver command state and never trusts aggregate arm err_code alone; coordinator loss handling must issue no later arm command and may only observe the six-false result before cleanup}
  tesseract_worker_budget: {automatic_one_view_multiview_scan: {total_sec: 45, ompl_attempt_sec: 3}, manual_batch_and_other_requests: {total_sec: 150, ompl_attempt_sec: 5}, invariant: budget selection is derived from the exact request kind/count/include_return_home contract and checked before every attempt plus adaptive validation}
  driver_launch_parameters: {supported: [can_port, auto_enable, joint_ctrl_topic, gripper_exist, enable_timeout, joint_bounds_path], invariant: auto_enable defaults false; removed aliases girpper_exist and rviz_ctrl_flag are rejected as unsupported rather than silently changing gripper units}
  live_manual_motion_validation: On 2026-07-20 one exclusive GUI-equivalent publisher commanded a supervised J6-only +0.02 rad round trip at 5 percent. Feedback measured +0.02029 rad outward and a 0.00210 rad final return error with err_code zero. On 2026-07-30 the production J2 lower limit was aligned to exact enabled compact-pose feedback -0.044796192 rad after OMPL demonstrably clamped the live start to the previous bound. The compact start is covered by a qualified acquisition-only recovery; snapshots still must not be clipped and collision pairs remain enabled.
gui_3d_joint_preview:
  set_topic: {name: /piper_gui/preview_set, type: sensor_msgs/JointState, effect: preview only, writer: piper_gui_native.py}
  state_topic: {name: /piper_gui/preview_joint_states, type: sensor_msgs/JointState, effect: preview only, writer: piper_joint_preview_node.py, invariant: first six values are clamped URDF joint angles}
  tf: {root: preview_world, frames: preview_base_link through preview_link8, source: namespaced robot_state_publisher using an in-memory preview_-prefixed copy of the source URDF}
  interaction: {server: /piper_gui_joint_editor, update: /piper_gui_joint_editor/update, controls: six ROTATE_AXIS markers located from URDF joint origins}
  mirror: {topic: /joint_ctrl_single, writer: piper_gui_native.py only after confirmation, speed_percent: 1 to 10, preserves: current gripper position, gates: [feedback age at most 1 second, arm err_code zero, conservative joint and robot/floor path valid with 60 mm nonadjacent-link proxy clearance]}
  limitation: The mirror path check has no live obstacle boxes; clear-workspace supervision remains mandatory.
tf_contracts:
  robot_chain: {path: "world -> base_link -> link1 -> link2 -> link3 -> link4 -> link5 -> link6", source: piper_description/display_live_robot.launch.py, joint_input: /joint_states_single, invariant: URDF origins match piper_sdk modified-DH mode 0 and visualization publishes no command topic}
  physical_gripper_installation: {joint: joint6_to_gripper_base, parent: link6, child: gripper_base, origin_xyz_m: [0.0, 0.0, 0.0], origin_rpy_rad: [0.0, 0.0, 3.141592653589793], invariant: permanent mechanical flange offset only; never add this angle to joint6 feedback or commands and never alter mode-0 link6 FK}
  camera_holder_visual_branch: {path: "link6 -> gripper_base -> camera_holder", joint: gripper_base_to_camera_holder, source_provenance: originally supplied cameraHolder.STL; original absent from current CAD directory, runtime_mesh: package://piper_description/meshes/camera_holder.STL, mesh_units: millimetres, urdf_scale: [0.001, 0.001, 0.001], close_arm_anchor_axes_on_mating_face_mm: [[50.5314679146, 65.2789535522, 176.5], [62.5314679146, 65.2789535522, 176.5]], close_arm_anchor_spacing_mm: 12.0, transformed_close_arm_anchors_in_holder_m: [[0.0, -0.006, -0.004], [0.0, 0.006, -0.004]], transformed_close_arm_anchors_in_gripper_m: [[-0.036, -0.006, 0.040], [-0.036, 0.006, 0.040]], l515_fastener_axis_midpoints_mm: [[56.5314679146, 91.1539535522, 56.5], [56.5314679146, 91.1539535522, 96.5]], l515_fastener_spacing_mm: 40.0, transformed_l515_fastener_axes_in_holder_m: [[0.12, 0.0, -0.029875], [0.08, 0.0, -0.029875]], excluded_lateral_tab_pair_spacing_mm: 87.763214, nominal_holder_frame_basis: midpoint of the close small-lug arm-anchor pair on its mating face, user_locked_visual_trim_z_m: -0.004, joint_origin_xyz_m: [-0.036, 0.0, 0.044], joint_origin_rpy_rad: [0.0, 0.0, 0.0], correction_about_holder_origin: [rotate 180 degrees about X, then rotate 180 degrees about Z], visual_origin_xyz_m: [0.1765, -0.0565314679146, 0.0612789535522], visual_origin_rpy_rad: [-1.5707963267948966, 0.0, 1.5707963267948966], invariant: holder location is user-locked; visual-only branch with no camera TF or planning-collision authority}
  l515_visual_branch: {path: "camera_holder -> l515_visual", joint: camera_holder_to_l515_visual, runtime_mesh: package://piper_description/meshes/Intel_RealSense_L515_CAD_external.STL, mesh_units: millimetres, urdf_scale: [0.001, 0.001, 0.001], holder_joint_origin_xyz_m: [0.1, 0.0, 0.0], holder_joint_origin_rpy_rad: [-3.141592653589793, 3.141592653589793, 1.5707963267948966], frame_basis: operator-confirmed physical L515 placement in the installed upper holder ring, l515_fastener_axis_midpoints_in_mesh_mm: [[30.503129, 10.503409, 2.253556], [30.503129, 50.503409, 2.253556]], installed_fastener_axes_in_holder_m: [[0.08, 0.0, -0.027374998], [0.12, 0.0, -0.027374998]], holder_fastener_axis_midpoints_m: [[0.08, 0.0, -0.029875], [0.12, 0.0, -0.029875]], installed_axial_seating_trim_m: 0.002500002, main_housing_diameter_mm: 61.0, main_housing_depth_mm: 26.0, mesh_center_offset_m: [-0.030503129, -0.030503409, -0.029628554], outer_front_cover_glass_mesh_z_mm: 25.903557, intel_depth_offset_from_front_glass_m: 0.0045, depth_optical_reference_in_l515_visual_m: [0.0, 0.0, -0.008224997], depth_optical_quaternion_in_l515_visual_xyzw: [0.0, 0.0, 1.0, 0.0], factory_device_serial: f1120648, factory_color_to_depth_translation_m: [0.00020008129649795592, -0.014131228439509869, 0.004224836826324463], factory_color_to_depth_rotation_deg: 1.322465865409006, rgb_optical_reference_in_l515_visual_m: [-0.00020008129649795418, 0.014131228439509869, -0.004000160173675537], rgb_optical_quaternion_in_l515_visual_xyzw: [-0.0027835818950340385, 0.011199364304190152, 0.9999334069555269, 0.00008697889557034292], rviz_material_rgba: [0.55, 0.58, 0.62, 1.0], invariant: fixed and operator-confirmed visual placement with no collision or inertial authority; the datasheet depth datum plus serial-bound factory extrinsic constrain but do not publish the separately owned operational optical TF}
  l515_collision_assembly: {planning_only_path: "gripper_base -> l515_attached_assembly", live_urdf_link: absent, source_visual_links: [camera_holder, l515_visual], generated_mesh: package://piper_description/meshes/l515_attached_assembly.STL, base_frame: gripper_base, units: metres, triangle_count: 198122, bounds_min_m: [-0.04, -0.05286335, 0.011], bounds_max_m: [0.0995, 0.05286335, 0.064], decomposition: seventeen overlapping 30 mm XY cells, source_sha256: ea4e84574cd10ec8d21e021863b34d897470c35a57e4305eca3d906dbbf1f062, invariant: generated only from the locked visual meshes and exact URDF fixed-joint/visual-origin/scale transforms; model_builder injects it only into the isolated planning URDF; live TF, accepted geometry, operational camera TF and hand-eye calibration are not modified}
  camera_chain: {path: "base_link -> camera_link -> camera optical frames", source: L515_camera/publish_hand_eye_tf.py plus RealSense static TF, startup_contract: hand-eye loads and freezes camera_link to camera_color_optical_frame before subscribing to reliable depth-1 joint feedback; missing static TF fails closed}
perception_topics:
  camera_timestamp_health: {name: /piper/camera_timestamp_health, type: piper_mobile_manipulation/CameraTimestampHealth, invariant: healthy only after consecutive current monotonic image stamps; dry_run true and real_arm_motion false}
  target_mask: {name: /piper/sam2_target_mask, type: sensor_msgs/Image, encoding: mono8, invariant: nonzero pixels are target}
  object_ids: {name: /piper/sam2_object_ids, type: sensor_msgs/Image, invariant: integer ID image aligned to color}
  detection_2d: {name: /piper/sam2_detection_2d, type: piper_mobile_manipulation/Detection2D}
  target_3d: {name: /piper/target_3d, type: piper_mobile_manipulation/Target3D, frame: camera optical frame}
  tracked_target: {name: /piper/tracked_target, type: piper_mobile_manipulation/TrackedTarget, frame: base_link when use_tf_transform=true}
  tracking_health: {name: /piper/tracking_health, type: piper_mobile_manipulation/TrackingHealth}
  target_status: {name: /piper/target_status, type: std_msgs/String, values: [SEARCHING, TRACKING, LOCKED, LOW_CONFIDENCE, LOST]}
  obstacle_instances: {name: /piper/obstacle_instances_3d, type: piper_mobile_manipulation/ObstacleInstance3DArray, invariant: scene_blocked remains true for unsafe/non-movable objects for the supervised manipulation workflow; the Tesseract bridge forwards every valid instance as a collision box and blocks only missing/invalid geometry}
custom_message_invariants:
  CameraTimestampHealth: "header; state; healthy; wall/ROS-to-image offset_sec; consecutive healthy count; monotonicity; fresh-feedback stationary proof; recovery request latch; reason; dry_run; real_arm_motion"
  Detection2D: "header; center u,v; width,height; confidence; valid"
  Target3D: "header; point; depth statistics; source pixel and detection box; depth_source; measurement_confidence; valid"
  TrackedTarget: "header; position; velocity; predicted_position; speed; confidence; stable; valid"
  TrackingHealth: "header; lifecycle_state; arm_moving; camera_settled; prediction_only; measurement_age_sec; measurement_quality; heavy_attempt_count; recommended_speed_scale; reason; dry_run; real_arm_motion"
  ObstacleInstance3D: "IDs and semantic label; BLOCKED=0 MOVABLE=1 UNSAFE=2; camera/base centroids and AABBs; depth and TF validity"
  ScanExecutionPlan: "Typed base_link proposal; plan_id; plan_kind; source_request_id; planner_backend; trajectory_sha256; collision_model_qualified; valid/dry_run/real_arm_motion; candidate/planned counts; target_center bound to the proposal; viewpoint indices; flattened six-joint targets and trajectory points; camera positions and look directions. ROUGH_ACQUISITION source_request_id must equal the initiating PrepareAcquisition session. Proposals are always dry_run=true and real_arm_motion=false."
  ScanExecutionStatus: "plan_id; state and reason; dry_run/real_arm_motion; approval_required; current/total views; capped speed, tracking scale, and joint error"
  TesseractPlan: "Validated command-free worker result on reliable transient-local depth-1 QoS; exact J1-J6 segments, hashes, clearances/bypass evidence and limiting pairs. Kinds are ROUGH_ACQUISITION, MULTIVIEW_SCAN and zero-capture RETURN_HOME. Only acquisition carries source_request_id. Recovery metadata is optional and narrowly scoped; direct RETURN_HOME instead requires exact stage/collision-bypass evidence and exactly two points. J6 remains free."
  TesseractPlanStatus: "request ID; IDLE/PLANNING/PROPOSAL_READY/REJECTED state; reason; dry_run=true; real_arm_motion=false; pending queue counts"
  TesseractReadiness: "Header plus worker generation_id; worker_ready; acquisition_ready; multiview_ready; and separate acquisition/multiview blocker lists. Consumers require a fresh sample; worker readiness requires a valid atomic heartbeat no older than 1.5 seconds."
tracking_invariants:
  lifecycle_states: [TRACKING, DEGRADED, WAITING_TO_REACQUIRE, REACQUIRING, ABSENT, CAMERA_CLOCK_INVALID]
  no_measurement_age: 1000000.0
  speed_scale: 1.0 only for current tracking while settled; degraded scale while DEGRADED or moving; 0.0 while waiting/absent.
  timestamp_order: GPU results retain camera image stamps; tracker rejects out-of-order measurements when configured.
  camera_clock_gate: SAM2 TrackingHealth reports CAMERA_CLOCK_INVALID with speed scale 0 unless fresh CameraTimestampHealth is healthy; the executor independently requires the same typed health.
  camera_motion: Camera-space pixel/area/depth gates are disabled by default; transformed base-frame observation is authoritative.
  motion_correction: Fresh TrackingHealth with arm_moving true or camera_settled false suppresses target_tracker correction and publishes the bounded existing prediction. The one-second health age only limits this local correction suppression; stale TrackingHealth remains an independent mission safety failure.
  semantic_conditioning: The latest depth-qualified successful GroundingDINO/SAM target seed is the SAM2 conditioning authority. Frame-history compaction retains conditioning plus recent non-conditioning memory and never promotes a propagated mask or motion-compensated projection into a semantic seed.
  heavy_target_seed_depth: Existing correlated aligned-depth qualification remains intentionally permissive at 25 valid target-mask pixels and 0.05 valid ratio. Area, IoU, colour, known object size and appearance are not hard seed gates.
  heavy_recovery: A loss episode gets max_reacquisition_attempts burst attempts, then remains ABSENT while requesting at most one serialized motion-gated heavy refresh per absent_retry_sec until valid tracking recovers; defaults are 2 attempts and 30 seconds.
  low_confidence_heavy_refresh:
    source: /piper/tracked_target confidence on a valid TrackedTarget.
    trigger: Confidence below low_confidence_refresh_threshold, default 0.60, continuously for low_confidence_refresh_duration_sec, default 1.0 second.
    behavior: sam2_live_bridge begins a loss episode without using the motion-prompt shortcut, then requests one serialized heavy refresh only when the camera is settled. Existing cooldown, attempt limits, and single-flight rules apply.
    rearm: Confidence must reach threshold plus low_confidence_refresh_hysteresis, default 0.10, before another low-confidence episode can trigger.
json_string_topics:
  heavy_refresh_request:
    name: /piper/heavy_refresh_request
    required_fields: [request_id, reason]
    acquisition_fields: [min_image_stamp.sec, min_image_stamp.nanosec]
    behavior: Normal recovery may snapshot the newest frame. Correlated acquisition and capture requests wait for a frame at or after min_image_stamp. If the single-flight worker is busy, one pending request is retained and reported as waiting_for_worker, then queued exactly once when worker and frame gates pass. Duplicate/in-flight work remains suppressed.
  heavy_refresh_status:
    name: /piper/heavy_refresh_status
    common_fields: [state, dry_run, real_arm_motion]
    acquisition_states: [waiting_for_fresh_image, waiting_for_worker, request_ignored_busy compatibility, queued, published, worker_result_rejected, sam2_target_seed_skipped, request_failed, request_rejected, idle]
    optional_fields: [job_id, request_id, image_stamp, min_image_stamp, worker_status, target_confidence, mask_px, object_count, obstacle_count, obstacle_labels, target_depth_status, target_mask_pixels, target_depth_valid_pixels, target_depth_valid_ratio, error]
    acquisition_invariant: Only the exact request_id may affect an acquisition look; queued/published image_stamp must be at or after min_image_stamp. target_mask_missing enters WAITING_FOR_OBSTACLE_SCENE, and a later move is allowed only after a typed scene whose header stamp is at or after that semantic result. Other worker/correlation errors abort.
  sam2_tracking_status:
    name: /piper/sam2_tracking_status
    common_fields: [state, dry_run, real_arm_motion]
    optional_fields: [frame_key, source, mask_area_px, object_count, session_frames, retained_session_frames, conditioning_source, prediction_promoted_to_conditioning, arm_moving, camera_settled, error]
  scan_quality:
    name: /piper/scan_quality
    fields_used_by_supervisor: [quality_label, quality_score]
  occlusion_status:
    name: /piper/occlusion_status
    status_values: [CLEAR, PARTIALLY_OCCLUDED, HEAVILY_OCCLUDED, LOST]
  workflow_status:
    name: /piper/supervised_workflow_status
    fields: [state, reason, dry_run, real_arm_motion, accepted_views, min_views, max_views]
  removal_plan:
    name: /piper/removal_plan
    invariants: [valid and dry_run and execute=false, object_id and label, action is pick_and_place or push when valid, reason always explains decision]
  target_model:
    name: /piper/target_model
    fields_when_valid: [valid, frame_id, point_count, center, bounds_min, bounds_max, accepted_views, center_delta_m, confidence]
  scan_viewpoints:
    names: [/piper/scan_viewpoints, /piper/reachable_scan_viewpoints]
    executor_required_fields: [header.frame_id=base_link, dry_run=true, target_object_center, viewpoints]
    viewpoint_required_fields: [index, desired_camera_position, desired_look_at_direction, reachable=true, safe=true]
    target_center_authority: scan_viewpoint_planner accepts a source target only when its header.frame_id exactly equals planning_frame_id=base_link. /piper/target_3d is camera-optical-frame measurement data and cannot replace the NBV centre directly; only its transformed measured /piper/tracked_target result may do so.
  acquisition_viewpoints:
    names: [/piper/acquisition_viewpoints, /piper/reachable_acquisition_viewpoints]
    type: std_msgs/String canonical JSON
    required_fields: [header.frame_id=base_link, plan_kind=ROUGH_ACQUISITION, dry_run=true, source_request_id, rough_hint_stamp_ns, target_provenance, target_object_center, acquisition_pattern, viewpoints]
    pattern: [current optical view when available, center, left/right azimuth 45 degrees, camera-up/down pitch 45 degrees, four diagonal yaw 45/pitch 30 degree looks, collision-qualified compact fallback poses]
    geometry: The primary search preserves the live camera position when already within the configured 0.45 m maximum and changes only optical direction. Its diagonal candidates cover the known 0.30 m rough-coordinate error from compact camera distances, including the deliberate 0.25/0/0 hint for a cube near 0.25/-0.25/0. The mechanically registered optical model uses a 0.28 m compact fallback, preserving margin above the L515 minimum range while retaining collision-free centreline zero-start IK. At most twenty candidate poses are offered to Tesseract, which returns no more than five reachable collision-qualified acquisition looks; no candidate itself is a motion command.
    acquisition_pattern_fields: [order, sweep_angle_deg, maximum_standoff_m, effective_standoff_m]
    invariant: Only the dedicated acquisition topic may relax target_status LOST; arm-status, vector/view-geometry checks and downstream Tesseract IK/joint/collision checks remain mandatory. Static radial/height workspace bounds default disabled.
supervised_services:
  names: [/supervised_cube_workflow/start, /supervised_cube_workflow/approve_plan, /supervised_cube_workflow/confirm_action_complete, /supervised_cube_workflow/capture_view, /supervised_cube_workflow/finish_scan, /supervised_cube_workflow/abort, /supervised_cube_workflow/diagnostic_state]
  type: std_srvs/srv/Trigger
  invariant: Approval never commands motion in current implementation.
  diagnostic_state: Read-only JSON contains state, landmark/obstacle/quality presence, input ages, obstacle count, invalid-or-blocked count, and accepted/modeled view counters.
  target_cloud_qos: /piper/target_cloud is best-effort sensor QoS and the workflow subscriber must match it. A cloud received while WAIT_CAPTURE is retained until the full_resolution_refinement accumulating status increments accepted_views; the opposite arrival order is also valid.
scan_execution:
  proposal_runtime_inputs: {reachability_arm_status_timeout_sec: 1.0, tesseract_feedback_timeout_sec: 1.0, worker_heartbeat_timeout_sec: 1.5, acquisition_handoff_retry_sec: 0.5, acquisition_handoff_timeout_sec: 10.0, invariant: endpoint discovery alone is insufficient; only fresh callbacks and a fresh ready worker heartbeat satisfy their gates; scan bridge and reachability subscriptions are created once and stale data blocks without DDS graph mutation}
  readiness_topic: {name: /piper/tesseract_readiness, type: piper_mobile_manipulation/TesseractReadiness, behavior: acquisition_ready requires fresh worker heartbeat, joints, controller limits, and camera clock but deliberately not acquisition candidates; multiview_ready additionally requires the complete normal tracking/scene/candidate inputs}
  plan_topic: {name: /piper/scan_execution_plan, type: piper_mobile_manipulation/ScanExecutionPlan, discriminator: plan_kind, target_binding: ROUGH_ACQUISITION target_center and source_request_id must match the current GUI session; MULTIVIEW_SCAN must correlate to the explicit current-lock request}
  status_topic: {name: /piper/scan_execution_status, type: piper_mobile_manipulation/ScanExecutionStatus, discriminator: execution_mode}
  rough_acquisition_prepare:
    name: /scan_target_acquisition/prepare
    type: piper_mobile_manipulation/srv/PrepareAcquisition
    request: [session_id, rough_target PointStamped]
    response: [accepted, session_id, message]
    behavior: Atomically validates and binds a unique session ID to one fresh finite base_link target, freezes five command-free look candidates, and waits for matching reachable output. An exact duplicate ID and payload is idempotently accepted even after the original call times out; reusing an ID with different target data is rejected. The command-free payload is republished for at most 10 seconds; rejected bridge calls that queued no plan are retried no faster than 0.5 seconds with at most one call in flight. Once accepted, exactly one Tesseract request exists and republishing stops. source_request_id is preserved through candidate JSON, schema-v5 spool provenance, TesseractPlan, ScanExecutionPlan, and GUI acceptance. It never approves or executes motion.
  rough_acquisition_plan_request:
    name: /tesseract_plan_bridge/request_acquisition_plan
    type: piper_mobile_manipulation/srv/RequestTesseractPlan
    behavior: Builds a ROUGH_ACQUISITION request with min_viewpoints=1 and max_viewpoints=5; skips only measured-target tracking gates.
  rough_acquisition_detection:
    request: Each settled look publishes a unique "<plan>-acquire-<view>-attempt-<n>" request_id plus a ROS min_image_stamp taken after settle.
    timeouts: {fresh_frame_or_idle_worker_sec: 10, matching_groundingdino_job_sec: 60, post_detection_tracking_lock_sec: 10, correlated_obstacle_scene_sec: 15}
    first_look_scene: Schema-v5 observation_mode=bootstrap_static deliberately carries obstacles=[] and does not require a preexisting /piper/obstacle_instances_3d callback. Only the first ROUGH_ACQUISITION path may use this exception; normal scan and every later acquisition path remain perception-scene gated.
    target_absent_scene: A target_mask_missing result with no detected obstacles publishes one typed empty ObstacleInstance3DArray at the exact result stamp. If obstacles exist, target ID 1 remains reserved, GroundingDINO emits IDs 2+, and SAM2 propagates those masks for normal depth projection. No later move occurs until that correlated scene is fresh and its exact path passes obstacle-box validation.
    success: Requires post-result target/status/health callbacks, target_status exactly LOCKED, TrackingHealth TRACKING with camera_settled=true and prediction_only=false, a valid stable TrackedTarget in base_link whose measurement stamp is not older than the GroundingDINO image, and Euclidean distance from the rough hint no more than 0.30 m.
    handoff: ACQUIRED publishes a hold, cancels remaining acquisition poses, calls /supervised_cube_workflow/start once, and waits for SCAN_READY and fresh normal reachable viewpoints. MissionEngine owns the later closed-loop MULTIVIEW_SCAN transition; the GUI has no plan-request authority.
  normal_scan_plan_request:
    name: /tesseract_plan_bridge/request_plan
    type: piper_mobile_manipulation/srv/RequestTesseractPlan
    request: force_refresh=false
    response: [accepted, exact request_id, message]
    behavior: Production MissionEngine uses the fresh measured ACQUIRED handoff, waits for multiview readiness and queues bounded one-view closed-loop requests with exact request/plan correlation. The retired GUI manual batch request/confirmation path is no longer a production GUI interface; its exact-13 contract remains only in archived characterization and lower-level commissioning APIs.
  approve_service:
    name: /scan_viewpoint_executor/approve
    type: piper_mobile_manipulation/srv/ApproveScanExecution
    request: [exact current plan_id, exact trajectory_sha256, "confirmation exactly EXECUTE APPROVED SCAN"]
    invariant: MULTIVIEW_SCAN requires enable_real_arm_motion=true, fresh plan, target drift no more than 0.015 m, fresh healthy tracking, a valid perception scene, and SCAN_READY. ROUGH_ACQUISITION instead requires fresh base-link provenance plus joints/arm/camera-clock, exact hash approval, and collision_model_qualified=true for its first bootstrap-static segment; subsequent segments additionally require a fresh correlated valid obstacle scene. It never captures.
  cancel_service: {name: /scan_viewpoint_executor/cancel, type: std_srvs/srv/Trigger, behavior: Stops active executor work; the executor service may publish its local emergency/current-target hold, but MissionEngine does not treat that acknowledgement as home authority. It never calls reverse-to-plan-start configured home. For every controllable terminal path the mission requires fresh finite feedback, independently proves direct PRE_HOME then ROUGH_HOME then STORAGE_WRIST, verifies every configured-home joint inside the operator-authorized 0.2-rad endpoint band, retains the final controller target, then disables. Only current motor-control authority loss suppresses home.}
  refresh_service: {name: /scan_viewpoint_executor/refresh_plan, type: std_srvs/srv/Trigger, behavior: Replans only while motion is inactive.}
  command_contract:
    topic: /joint_ctrl_single
    publisher_presence: Absent in proposal-only mode; created only when real motion is explicitly enabled at launch.
    source_acceptance: Every Tesseract point record must contain finite six-element positions, velocities and accelerations plus a finite strictly increasing schedule timestamp. Normal segments contain at least start/final and may contain up to 60000 exact scheduled samples; adjacent timestamps are no faster than 20 Hz and adjacent joints remain within max_execution_joint_step_rad. qdot/qddot are exact-zero transport placeholders because PiPER JointCtrl consumes positions plus aggregate speed. Every collision-checked source vertex remains in order in the schedule; on-segment interpolation cannot shortcut a corner. Folded-start recovery knots must be internal, exact and metadata-bound. Dedicated configured home alone remains exactly measured start plus one configured target.
    timing_adapter: Policy tesseract_stream_v3 lives in the isolated worker. OMPL establishes collision-free geometry; ISP qdot/qddot and timestamps are finite planning metadata rather than PiPER commands. A bounded pass-through blend may replace internal corners only after dense validation of the actual blended geometry, with automatic fallback to the exact source polyline. If the complete start-to-goal chord independently passes dense collision and visibility validation, response evidence selects DIRECT_MOVEJ and the executor sends one final endpoint for native controller interpolation. Otherwise every validated detour sample remains TESSERACT_STREAM. The same percentage is sent as aggregate MoveJ speed. Dedicated configured-home stages bypass this adapter and use ExecuteHomeStage.
    execution_hash: TesseractPlan and ScanExecutionPlan carry the same exact worker trajectory_sha256. It covers every scheduled position/timestamp/zero-derivative placeholder and recovery index plus request/model/calibration/position limits, controller motion-limit values/hash, selected aggregate SDK speed, 20 Hz execution schedule and tesseract_stream_v3 policy. Exact approval binds this hash.
    runtime_stream: For ordinary acquisition/scan, the executor publishes each due arm-only scheduled position once with the frozen SDK speed in velocity index 6 and does not endpoint-settle at intermediate samples. Fresh feedback continuously limits command lead to 0.30 rad. If the current or next exact setpoint exhausts that corridor, the sender retains the last collision-qualified setpoint and freezes schedule time until feedback catches up; failure to recover within the unchanged one-second following grace aborts. After the last sample it applies the unchanged 0.025 rad endpoint tolerance and a 0.007 rad settle window, narrowly above the observed 0.006227508-rad powered J4 feedback step. If more than one sample becomes overdue, it aborts to hold rather than bursting stale goals or shortcutting collision-qualified corners. A bounded runtime-authority hold likewise freezes the schedule clock and reissues only the exact interrupted target after authority returns. Multiview capture additionally requires a healthy synchronized camera clock. Automatic mode holds after every persisted capture and delegates shutdown to dedicated two-point RETURN_HOME stages. PiPER velocity spikes remain diagnostic and per-joint qdot/qddot tracking is not claimed.
    speed: The production mission freezes one finite configured speed within the unchanged 1-through-100-percent executor contract; the Phase-8 GUI does not select or reinterpret it. ROUGH_ACQUISITION and MULTIVIEW_SCAN freeze that aggregate SDK speed. The adapter applies that percentage once to the qualified MoveJ model limits J1-J5=5 rad/s and J6=3 rad/s when constructing the 20 Hz position schedule and sends the same percentage as aggregate MoveJ speed. At 5 percent this is 0.25 rad/s for J1-J5 and 0.15 rad/s for J6. The 0.05-rad adjacent-step ceiling exactly preserves model speed through 20 percent; higher selections are capped and remain unqualified. Fresh queried motion limits remain required health/hash evidence, not a timing multiplier. Tracking recommended_speed_scale remains diagnostic. The 2026-08-11 50-percent mission belongs to v1 and does not physically qualify v3. Direct home remains a different single-endpoint controller transaction; explicitly characterize 1/5/10/20 percent before extending the qualified envelope.
    driver_mode: piper_ctrl_single_node sends every JointCtrl target in SDK MoveJ mode and caches unchanged MotionCtrl_2 mode/speed. Six-position commands are arm-only and never send GripperCtrl; only an explicit seventh position can update the gripper, with unchanged signatures cached. Enable/disable resets the caches so the next command reasserts state.
    enable: Executor never calls /enable_srv; the operator controls motor enable separately.
  qualified_runtime_parameters:
    normal_scan_candidates: {desired_scan_angle_deg: 180, target_facing_hemisphere_deg: [90, 270], viewpoint_step_deg: 7.5, azimuth_samples: 25, camera_pitch_deg: -50, camera_pitch_offsets_deg: [35, 25, 15, 5, -5, -15, -25], effective_pitch_bands_deg: [-15, -25, -35, -45, -55, -65, -75], ray_nbv_configured_directions_default: 360, ray_nbv_min_standoff_m: 0.28, ray_nbv_preferred_max_standoff_m: 0.50, ray_nbv_absolute_max_standoff_m: 0.80, legacy_and_voxel_radius_m: [0.30, 0.33, 0.36, 0.39, 0.42, 0.45], legacy_and_voxel_exact_candidates_max: 1050, automatic_movement_frontier: none, minimum_useful_direction_separation_deg: 10, predicted_marginal_information_fraction_min: 0.02, closed_loop_voxel_exact_candidate_limit: 12, closed_loop_ray_direction_limit: 6, closed_loop_ray_interval_candidate_limit: 6, closed_loop_ray_ik_seed_count: 9, closed_loop_ray_ik_max_evaluations_per_seed: 120, closed_loop_max_aim_offset_deg: 5, automatic_model_seed_views: 8, automatic_maximum_persisted_views: 24, minimum_views_per_y_side: 2, achieved_azimuth_span: diagnostic_only, minimum_elevation_span_deg: 25, measured_convergence_views: 3, measured_novel_fraction_max: 0.02, automatic_completion: first count from 8 through 24 whose achieved Y-side and elevation feature floors plus measured convergence pass or strict post-capture all-remaining-IK exhaustion after the same remaining floors, automatic_transaction_views: 1, worker_attempt_order: voxel_nbv attempts at most twelve exact points; ray_nbv attempts at most six information-ranked bounded intervals and solves continuous joints plus standoff before the next direction, automatic_aim_binding: exact frozen-target direction first across roll and IK alternatives then at most one hash-bound fallback no more than five degrees}
    command_schedule: {adapter_policy: tesseract_stream_v3, command_rate_hz: 20, scheduled_targets_per_viewpoint: adaptive_up_to_60000, maximum_joint_step_rad: 0.05, movej_nominal_velocity_rad_s: [5, 5, 5, 5, 5, 3], model_speed_exact_through_percent: 20, following_error_rad: 0.30, following_error_grace_sec: 1.0, following_corridor_policy: freeze_on_last_safe_setpoint_then_resume_or_abort, overdue_policy: abort_without_burst_or_shortcut, intermediate_endpoint_settle: false, final_target_reached_tolerance_rad: 0.025, normal_execution_modes: [DIRECT_MOVEJ after dense straight-chord proof, TESSERACT_STREAM for collision-avoidance detours], home_execution_policy: feedback_gated_direct_endpoint, home_derivation: hash-verified direction-bound schema-v4 profile and explicit ExecuteHomeStage stage, home_robot_self_collision_validation: intentionally_bypassed only for configured-home stages, home_attached_holder_external_clearance_validation: mandatory_dense_discrete_at_0.005_m, plan_start_tolerance_rad: 0.025, final_target_timeout_sec: 90.0, final_progress_timeout_sec: 20.0}
    settle_gate: {joint_goal_tolerance_rad: 0.025, endpoint_position_settled_rad: 0.007, measured_feedback_basis: observed powered J4 step 0.006227508 rad, joint_velocity_settled_rad_s: diagnostic compatibility only, proposal_approval: stationary position window anchored to current measured joints while command_target is intentionally absent, active_execution: target-bounded stationary position window, runtime_recovery: stationary window at the newly commanded current-position hold while the interrupted target remains stored for later reissue, multiview_capture: target-bounded stationary position window plus healthy synchronized camera clock, home_goal_tolerance_rad: 0.20 operator-authorized independently per J1-J6, home_motion_tolerance_rad: 0.20, home_feedback_timeout_sec: 1.0, home_stable_sec: 1.0, home_timeout_sec: 30.0, startup_and_final_hold_gate: successful hold publication plus fresh finite feedback and trusted all-six motor status; no separate scan-endpoint position-window mission blocker}
    tracking_measurement_stale_sec: 0.75
    depth_jump_reacquisition: {max_depth_jump_m: 0.20, consistent_samples: 3, consistency_tolerance_m: 0.03, disabled_when_max_jump_nonpositive: true}
  j6_planning_policy:
    operator_confirmation: J6 was confirmed fully safe on 2026-07-17.
    current_implementation: The legacy_fixed_j6 backend and solve_fixed_j6_viewpoint helper were removed on 2026-07-24. Tesseract is the only planning backend and the executor accepts and executes six-joint samples.
    tesseract_policy: Collision-aware Tesseract planning treats J1-J6 equally, applying the available controller/URDF limits and ordinary collision checks. There is no J6 lock or J6-specific soft cost; camera-cable clearance is scene geometry.
    historical_records: The pre-zero measured J6 bounds remain invalid historical data, and the rejected analytical hand-eye compensation remains historical and must not be reinstated. The operator's 2026-08-10 [-pi,+pi] correction is the current software fallback/model contract, not a newly measured bounds record and not proof of endpoint qualification. The reported approximately 0.04 rad neutral error was corrected by a guarded physical-neutral controller write at 18:18; independent read-only feedback then remained exactly 0.00000 rad for three seconds with J6 disabled and no faults.
gui_production_client:
  owner: [piper_gui_native.py, piper_gui/view_model.py, piper_gui/ros_client.py, piper_gui/app.py, piper_gui/scan_policy.py]
  mission_interface: {name: /piper/run_target_scan, type: piper_mobile_manipulation/action/RunTargetScan, role: submit/cancel and display feedback/result only}
  reconstruction_interface: {name: /piper/report_tracked_robot_homed, type: piper_mobile_manipulation/srv/ReportTrackedRobotHomed, role: explicit tracked-base home report after a successful safe-shutdown result}
  goal_compatibility: {task_id_prefix: gui-sim-, task_type: SCAN_3D, frame: base_link, target_confidence: 1.0, deadline_sec: 1200.0, position_covariance_diagonal: 0.01}
  process_ownership: The GUI owns no production mission, Tesseract, camera or perception process. The sole GUI Popen launches the preview-only RViz joint editor.
  decision_boundary: Mission phases, readiness, enable, acquisition, occlusion, planning, capture, retry, replan, home, hold, disable and mission-child cleanup are exclusively interpreted by MissionEngine and the mission ROS boundary. Human-readable result strings are display-only in the GUI.
  viewpoint_policy_selector: {choices: [legacy, voxel_nbv, ray_nbv], ray_regions: [target_sector, upper_hemisphere, full_sphere], ray_count_range: [1, 1000], persistence: atomic replacement of view_selection_policy plus ray_sampling_region and ray_count in source scan_planning_params.yaml, takes_effect: next fresh mission-owned supervised scan-stack launch, active_mission_change: prohibited, shadow_mode_exposed: false, public_ROS_change: none}
  commissioning_boundary: Direct manual joint commands, explicit enable, explicit Commissioning Disable (No Home), home-profile recording and confirmed 3D-preview mirroring remain separately labelled commissioning controls. Motion and enable start locked and require an empty /joint_ctrl_single writer set before the GUI creates its publisher. If STARTUP_WRIST is armed, piper_native_gui may hold measured J6 within 0.03 rad while moving J1-J5 or command J6 alone in the positive direction toward ready zero; negative movement and positive overshoot remain rejected. Commissioning Disable publishes no joint target, performs no homing and calls /enable_srv false directly; the driver remains responsible for all-six feedback proof. Production Cancel/Home behavior is unchanged.
  diagnostics: [/piper/heavy_refresh_status, /piper/tracking_health, /piper/supervised_workflow_status, /piper/scan_capture_status, /piper/tesseract_readiness]
  diagnostic_invariant: Diagnostic subscriptions retain depth-10 QoS and are display-only; they cannot advance or authorize a production mission.
filesystem_contracts:
  tesseract_spool:
    root: XDG_RUNTIME_DIR/piper_tesseract_plans, with /tmp/piper_tesseract_plans fallback
    queues: [requests, processing, responses, failed]
    permissions: Root and queue directories are owned by the current user and forced to mode 0700; entries are regular single-link files no larger than 8 MiB; symlink roots/queues/entries are rejected.
    write_protocol: Canonical finite JSON is written mode 0600 with O_EXCL and O_NOFOLLOW where available, fsynced, atomically renamed, then the directory is fsynced. Worker claims by atomic rename; bridge consumes each response after validation.
    request: Version 5 binds plan kind/provenance/scene, exact measured start, model/calibration/controller limits, selected speed, tesseract_stream_v3, seed 42, include_return_home, and no joint-specific costs. Manual MULTIVIEW_SCAN may request every remaining view with include_return_home=true; automatic closed_loop_one_view requires min=max=1 and include_return_home=false while scan_session still binds total accepted/max/remaining. A home-free MULTIVIEW_SCAN with any other count is invalid. Every automatic candidate canonical request contains exact target-centred look plus at most one fallback look no more than five degrees away; exact is attempted first and the response must identify and match the selected exact or fallback direction. ROUGH_ACQUISITION has include_return_home=false, uses bootstrap_static, one selected look from at most five compact alternatives, and immutable source_request_id. RETURN_HOME requires include_return_home=true, configured_home provenance, no camera/obstacle dependency, min=max=0, no capture candidates, exactly six configured joints and one allowed home_stage. Worker budget remains 150 seconds below the 180-second bridge timeout; automatic one-view remains 45 seconds with geometry-only validation cost.
    planning_seed: The canonical request requires deterministic_seed 42. The worker applies that seed to OMPL before any planner or sampler exists, records it in successful responses, and rejects a request/worker seed mismatch.
  capture_correlation:
    full_resolution_frame: target_cloud pins the RGB-D tuple selected by the exact correlated heavy-refresh queued/published image stamp until the matching mask is consumed or the request fails. The rolling cache is not the sole lifetime owner.
    synchronization: The pinned frame still must match the returned mask within 0.08 seconds; correlation extends frame lifetime and does not relax timestamp agreement.
    obstacle_refresh: The bounded pre-motion runtime refresh requires fresh valid geometry before every SDK target. That validated snapshot may age only while its exact collision-qualified MULTIVIEW_SCAN target is already MOVING because eye-in-hand SAM2 may pause under motion blur; newly received blocked/invalid geometry still stops immediately. Missing data is also tolerated during stationary multiview settle/capture phases, but another target cannot start until fresh authority returns. A successfully decoded live SAM2 ID image containing only target ID 1 is fresh valid empty geometry and must publish immediately without TF; IDs 2+ require aligned depth, metadata and exact-time TF before the scene can refresh.
    scan_session_memory: /piper/scan_session_history is a reliable transient-local JSON record owned by the executor. On the first valid MULTIVIEW_SCAN plan it freezes that measured target center as coverage_target_center for immutable accepted coverage and reconstruction; authoritative ray_nbv binds its already-configured angular directions to that same mission target for this static-target phase. latest_achieved_camera stores actual settled FK after every commanded view even if capture is rejected and owns the next travel start. accepted entries are added only after synchronized persistence/workflow acceptance and alone update voxel coverage and completion. Accepted-direction separation below fifteen degrees is redundant; accepted and rejected ray IDs retire their direction, while rejected observations never satisfy coverage. The planner compares cumulative marginal information across the configured directions, removes predicted fractions below 0.02 and the bridge sends at most six NBV-ranked rays before direction-contiguous exact standoff expansion. Complete-ray no-IK and joint-limit evidence persists for the frozen session; contextual exhaustion resets with accepted_views. Exact-point voxel_nbv retains twelve candidates. Exact frozen-target aim is attempted before one optional five-degree fallback. Eight is the automatic model-seed floor and twenty-four the hard maximum. Only after the seed, all side/span floors and three-view measured surface convergence may correlated all-remaining-IK exhaustion terminate successfully; timeout, worker error, malformed response, ordinary plan rejection, or maximum count with blockers still fails. New workflow identity or session finish clears both physical and accepted histories.
    direct_home_after_scene_failure: Invalid/missing/stale/blocked perception geometry immediately stops normal scan motion and holds, but does not suppress a separately requested direct configured-home target. Dedicated RETURN_HOME ignores camera/tracking/obstacle state and declares collision validation bypassed. Its exact measured start alone may use the 0.3-rad relaxation band. Waypoint and no-progress failures re-enter this fresh qualification instead of suppressing home. Emergency-stop, hardware/controller/CAN authority loss, missing/nonfinite/beyond-band feedback, an out-of-limit goal and unavailable command publication remain command blockers.
    scan_path_visibility: During automatic MULTIVIEW_SCAN request construction, the bridge recomputes exact normalized target-minus-camera aim and may attach one fallback no more than five degrees toward measured current optical-Z. The isolated worker exhausts exact-aim roll/IK/path alternatives before fallback, records aim provenance, and densely validates the actual SDK path. Before any capture-segment command, the executor independently repeats calibrated camera FK at every dense sample and rejects if the measured plan target leaves the 20-degree positive-optical-Z cone or camera distance falls below 0.22 m. After settling, it additionally requires final aim no more than five degrees from the fresh filtered target and replans on excessive target drift. These checks are additional to collision qualification and do not apply to terminal home.
    workflow_occlusion_probe: Starting/restarting the supervised workflow clears cached obstacle authority and publishes a unique workflow_occlusion_probe request with a post-start minimum image stamp. SCAN_READY requires a matching heavy status state=published and an ObstacleInstance3DArray with that exact image stamp. Unrelated acquisition results, target_mask_missing, stale geometry, invalid timestamps, timeout, and worker errors fail closed.
    target_local_depth_obstacle: A depth-only foreground component is eligible only when at least the existing 20-pixel support minimum lies inside the observed target-mask bounding envelope. Merely touching the six-pixel near-mask dilation is adjacency, not target occlusion. A retained crossing component keeps its complete connected geometry. Semantic GroundingDINO obstacle masks are unchanged.
    controller_limit_stability: Valid controller-limit hashes are accepted immediately at startup. A distinct valid hash must repeat for at least 7 seconds and three samples before replacing the accepted set; recovery of the accepted hash cancels the candidate. Invalid messages never refresh freshness. Planning and approval bind the accepted generation. If a valid command-free Tesseract plan carries the exact last accepted hash but is dequeued before a queued 1 Hz refresh, the executor enters WAITING_FOR_PLAN_LIMITS with no approval or motion authority and retries validation only after a new matching valid sample inside the existing three-second timeout. No sample, invalid data, expiry or hash mismatch rejects the plan. During position-only SDK MoveJ execution, a later stable generation is accepted only when it remains fresh, valid, finite, positive, six-joint and within protocol caps; stale, invalid or malformed limits still fail closed.
    response: Version 5 binds matching identity/model/limits/speed/seed/include_return_home, exact finite SDK targets with zero derivatives, collision evidence and hashes. An automatic one-view MULTIVIEW_SCAN contains exactly its single capture segment and no embedded home; the executor rejects any extra segment, holds after capture, and delegates every terminal path to a newly planned direct RETURN_HOME transaction. Manual batch MULTIVIEW_SCAN contains one capture segment per selected view plus its collision-checked contingency home. RETURN_HOME contains zero selected viewpoints and exactly one two-point is_return_home segment ending at configured joints with bypass evidence.
    worker_health: worker_health.json is a bounded canonical record atomically replaced at 0.5-second intervals. It contains schema_version, a UUID generation_id, timestamp, ready flag, backend/version, and error. The bridge rejects missing, malformed, stale, wrong-backend, or not-ready health; the record is liveness evidence, not authentication.
    isolation: Worker has no ROS, DDS, CAN, camera, GPU, motor-enable, or network access; it receives read-only model/calibration assets and bounded spool access.
    worker_exclusivity: run_worker.sh holds a nonblocking flock at XDG_RUNTIME_DIR/piper_tesseract_worker.lock, or the /tmp fallback, and exits with code 3 if another worker owns it.
    worker_supervision: In the Bubblewrap route, run_worker.sh remains as the direct parent and waits for the isolated worker. This preserves --die-with-parent across the GUI's short-lived Python startup thread and lets GUI process-group cleanup stop both wrapper and sandbox.
    current_qualification: On 2026-07-27 the exact production 30 mm decomposition manifest hash 237c06f03ef248c535b28fbf588e65160325a5f8f48632a9f0237e59c7a10956 passed core and compact suites with collision_model_qualified_for_hardware=true. The exact compact start for target [0.33,-0.14,0.0] produced J3 delta -0.05 rad, recovery endpoint 55, 352 points, and 5608 validation samples. The normal post-recovery clearance was 0.001006 m under its named policy. No collision pair is disabled. The nanobind continuous manager remains disabled; no response claims BulletCast or FCL.
  vision_recovery:
    root: /tmp/piper_vision_recovery
    request: request.yaml written atomically only after a sustained timestamp fault and latest-sample fresh joint positions remain within stationary_position_tolerance_rad, default 0.001, for stationary_duration_sec, default 0.75; consumed by run_gpu_vision_pipeline.sh. Velocity-only feedback is a fail-closed compatibility fallback; health reason distinguishes missing/stale feedback from position settling.
    behavior: The owned camera and complete perception stack restart with 2/5/10/30-second capped backoff; PIPER_REUSE_EXISTING_CAMERA disables automatic camera restart.
    process_manifest: process_groups.txt is atomically rewritten under /tmp/piper_vision_recovery after each owned setsid child starts; each line contains an allowlisted process name and numeric group leader.
    orphan_cleanup: stop_gpu_vision_pipeline.sh accepts only the validated manifest path, allowlisted names, live group leaders, and project/ROS command paths before sending INT then TERM. It never targets the driver, GUI, hand-eye TF, RViz, or separate scan executor.
  heavy_spool:
    root: /tmp/piper_heavy_refresh
    worker_readiness: Heavy-model worker ready is emitted only after the isolated worker has resolved all GroundingDINO/BERT assets from the repository-local Hugging Face cache with HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE enabled and loaded the CUDA model. Mission startup must not infer readiness merely from a live PID. The loaded model is reused for every request in that worker generation.
    queues: [requests, processing, responses]
    request_shape: "directory containing rgb.jpg, optional depth, request.yaml, then READY"
    response_shape: "result.yaml plus target/object mask PNGs and copied rgb.jpg, then READY"
  sam2_spool:
    root: /tmp/piper_sam2_live
    queues: [frames, seeds, results, consumed]
    frame_shape: "timestamp-keyed directory with rgb.jpg, frame.yaml{image_stamp,frame_id}, READY"
    seed_shape: "rgb.jpg, object_NNN.png files, seed.yaml{frame_key,source,image_stamp,frame_id,objects}, READY; objects is mandatory even for a target-only seed and objectless mask.png compatibility seeds are rejected"
    result_shape: "timestamp-keyed result manifest and object masks; bridge publishes ROS images with original image stamp"
  atomicity: Writers build .tmp directories, touch READY last, and os.replace into the final queue.
services:
  scan_executor_diagnostic: {name: /scan_viewpoint_executor/diagnostic_state, type: std_srvs/srv/Trigger, effect: read-only JSON summary of state/reason/plan identity/count/collision qualification/motion opt-in/camera-clock health for Foxy systems where topic echo is unreliable}
  supervised_workflow_diagnostic: {name: /supervised_cube_workflow/diagnostic_state, type: std_srvs/srv/Trigger, effect: read-only JSON summary of workflow state, measured_lock_ready/rejection from TrackedTarget plus TrackingHealth plus target status, diagnostic target-landmark state, fresh input ages, obstacles, and accepted/modeled capture counts}
  raw_rgbd_capture: {name: /scan_capture/capture_view, type: std_srvs/srv/Trigger, caller: scan_viewpoint_executor_node.py after settled CAPTURING_RGBD authority, behavior: service mode rejects acquisition/dry-run/noncapture states, stale or unsynchronized RGB/depth/camera-info, missing target/mask/TF, non-GOOD or nonfinite quality below 0.65, target_valid not exactly true, and non-CLEAR occlusion; success writes one RGB PNG, raw depth NPY, 16-bit millimetre depth PNG, mask PNG, and YAML metadata before workflow acceptance and execution advance; provenance: each frame copies dry_run, real_arm_motion and approval_required from the exact ScanExecutionStatus that authorized it, while capture_node_dry_run=true and capture_node_real_arm_motion=false separately preserve that the recorder itself has no command authority}
persisted_files:
  joint_bounds:
    path: piper_joint_bounds.json
    shape: "{joints:{joint1..joint7:{min,max,valid,...}}, ...}"
    invariant: Invalid records are ignored and driver/GUI fallback limits apply. J6 fallback, production robot model, scan kinematics and qualification requests are exactly [-pi,+pi] rad as corrected by the operator on 2026-08-10. Its pre-zero measured record remains invalid. Persistent physical-neutral discrepancies may be corrected only by the guarded physical-neutral JointConfig zero write, followed by near-zero disabled fault-free readback; the 2026-08-10 correction passed at exactly 0.00000 rad. Never encode such an error in TF, URDF joint origin, FK, or asymmetric command/feedback offsets. Re-record controlled bounds only after supervised endpoint qualification.
  hand_eye_calibration:
    path: L515_camera/calibration/hand_eye/session_20260808_straight_mount/calibration_result.yaml
    validation_path: L515_camera/calibration/hand_eye/session_20260808_straight_mount/fixed_board_validation_registered_20260810_corrected_board.yaml
    deployed_camera_to_link6: {translation_m: [-0.07813122843950987, -0.00020008129649795418, 0.03999983982632446], quaternion_xyzw: [0.009887436078438084, -0.0059508568105047475, -0.7071211961600986, 0.7069981894263427], derivation: "operator-confirmed l515_visual housing plus Intel Rev 003 depth origin [0,0,-0.008224997] m and device f1120648 factory colour-to-depth extrinsic"}
    invariant: Publisher and Tesseract model builder load only the same accepted calibration and bind its hash into planning. The physical board authority is 5x5 ChArUco with square_length_m 0.017 and marker_length_m 0.012, and capture plus validation must use and persist those same values. The file's preserved August 8 PARK solve, all fitting/held-out metrics, and every fixed-board report made through the first corrected stability retry used 0.018 m/0.013 m. They are wrong-scale provenance only and cannot authorize deployment or rollback; low reprojection error cannot prove metric scale. The active datasheet/factory-registered transform is board-scale-independent and serial-bound to L515 f1120648. Its 2026-08-10 read-only live overlay reproduced the deployed transforms exactly, and corrected-scale five-pose validation passed all poses with 12.22 mm and 1.25 degree worst drift. The board is the stationary metric target and its five base_link recoveries satisfy target repeatability, so physical_revalidation is passed. Semantic cube tracking remains a separate acquisition acceptance. scan_viewpoint_executor refuses enable_real_arm_motion while mechanical_registration.physical_revalidation.status is not passed; proposal-only planning and read-only TF remain available. session_20260701_local is rollback history only, and the rejected +67.875-degree analytical J6 compensation must not be reinstated.
autonomous_mission_contract:
  action: /piper/run_target_scan
  goal: [task_id, task_type=SCAN_3D, target_label, target_profile, fresh rough_target, target_confidence, deadline_sec]
  feedback: [phase, reason, elapsed_sec, remaining_sec, acquisition_attempt, occlusion_action, accepted_captures, process_health_json, shutdown_phase]
  result: [outcome, reason, failure_code, retryable, safe_shutdown, dataset_path, manifest_sha256, capture_count, mesh_job_id, action_summary_json]
  queue: The gateway admits at most eight outstanding missions, transforms each rough odom target at admission, and keeps an independent heartbeat/action result waiter. The local coordinator batches arrivals for one second and selects the smallest Euclidean base-frame distance with stable arrival-order ties. Only one mission may own arm resources; no new arrival pre-empts an active scan. Execution deadline starts at physical dispatch, and every predecessor must finish direct home, feedback disable, owned-child stop and durable result before the next starts.
  queued_cancel: Cancellation before dispatch writes a durable CANCELLED result with queue_cancelled_before_start=true and arm_resources_started=false; it never cancels or mutates a different active mission.
  mission_isolation: Every dispatched target clears transient readiness, plan, execution, capture, scan-history and frozen-coverage caches before starting a fresh process generation and dataset.
  admission: One active task; exact completed duplicates replay while changed task-ID reuse rejects.
  process_singleton: The supported run_target_scan_mission.sh acquires /tmp/piper_target_scan_mission.lock with nonblocking flock before ROS startup, inherits the lock descriptor across exec, and exits 73 if another coordinator owns it. Acceptance requires exactly one /piper/run_target_scan action server.
  authorization: /scan_viewpoint_executor/authorize_mission binds task ID, SHA-256 and expiry; MISSION_POLICY remains disabled in manual launches.
  result_lookup: /piper/get_target_scan_result returns the durable hashed result after reconnect.
  readiness_modes: acquisition_ready cannot substitute for multiview_ready or manipulation_ready; blocker strings remain exact.
  dataset: Every view stores RGB, depth, mask, intrinsics, joints, execution identity, exact base-to-camera matrix, calibration identity, and task/profile identity; manifest.json hashes all artifacts.
  target_context: A blank profile resolves to green_cube only for the exact normalized label green cube; all other labels resolve to generic_open_vocab. target_prompt contains at most 12 sanitized alphanumeric/hyphen words and 96 characters plus the GroundingDINO terminator. The normalized prompt is mission-hash bound and copied to GPU capture context and scan metadata.
  failure_codes: [CANCELLED, DEADLINE_EXPIRED, SENSOR_UNAVAILABLE, INSUFFICIENT_CAPTURE_QUALITY, OCCLUSION_NOT_CLEARED, TARGET_NOT_FOUND, TARGET_TOO_FAR, CONTROL_UNTRUSTWORTHY, NO_REACHABLE_PLAN, MISSION_FAILED]
  failure_code_routing: Scan-candidate, view-frontier, planning, reachable and IK failures route to NO_REACHABLE_PLAN. CAN routes to CONTROL_UNTRUSTWORTHY only as a standalone token, so the substring in "scan candidate" cannot misclassify a planning failure.
  capture_acceptance: Each accepted schema-2 save still requires fresh GOOD quality at least 0.65 with target_valid exactly true, fresh CLEAR occlusion, exact SAM-mask/RGB timestamp identity, synchronized aligned RGB-D, native L515 depth/camera-info/confidence, capture-time base-to-colour and depth-to-colour transforms, at least 50 grade-8-or-better target points, at least 0.50 confident support and one unambiguous depth component. Normal automatic feature completion uses 8-24 persisted records and stops when achieved feature floors and three-view convergence pass. The separate typed full-safe-frontier terminal may finish with fewer only after at least one persisted achieved capture and complete request-correlated Tesseract exhaustion. Manual batch mode remains exactly 13.
  achieved_history_fallback: Transient /piper/scan_session_history is preferred while current, but a manifest-valid immutable accepted-frame set with more metadata records is authoritative. Recover actual camera position and optical-Z from each capture-time base_link camera transform and recover the frozen target center from the first transformed target observation; manifest capture_count must equal metadata count before this fallback can affect completion or terminal reporting.
  capture_rejection_equivalence: During a settled RGB-D handoff, missing target_3d or missing detection mask is a bounded same-pose readiness retry. A present fresh Target3D with valid=false is visual evidence that the pose is unusable, equivalent to ScanQuality target_valid=false; it must append rejected history, hold, emit VIEW_REJECTED and request a distinct replacement without incrementing accepted capture count. Storage/I/O, malformed transform, service and safety errors remain terminal aborts.
  reconstruction_input: Offline TSDF admits 1-24 captures and applies no fixed eight-view quality cap; zero remains invalid. Every path requires manifest capture_count to equal immutable frame metadata, verifies every schema-2 artifact hash plus calibration/confidence/synchronization provenance, and fuses only projected confidence-qualified target-depth/support artifacts. Geometry and provenance gates remain authoritative. Missing calibration or schema-1 data requires explicit DIAGNOSTIC_ONLY mode.
  replacement_contract: Quality- or occlusion-rejected poses are recorded and excluded without incrementing accepted_views. In automatic closed-loop mode the arm holds at the measured current state and the mission may request at most eight one-view replacements. Accepted history uses achieved FK camera pose/look direction, not the ideal proposal.
  home_contract: Production missions load the hash-verified piper_home_pose.json; a missing/invalid file is terminal and no hard-coded production fallback is allowed. Home is commanded only through a fresh direct current-state RETURN_HOME target while control evidence remains trustworthy; collision evaluation is intentionally bypassed and automatic recovery never replays scan history.
  home_runtime_feedback_boundary: Ordinary runtime feedback may exceed a controller-coordinate bound by at most 0.005 rad, covering powered J3 +0.002460 encoder noise. Only a dedicated configured_home_direct_joint_move RETURN_HOME may bind its exact first measured point up to 0.3 rad outside a bound, covering disabled storage relaxation measured at J6 -3.173270 rad. The request field is RETURN_HOME-only, the manifest authorizes joints 1-6, the response must preserve the exact start, and the worker/executor reject leakage. Every goal and all non-home feedback remain strictly in-limit.
  home_result_wait: The mission records the execution observation boundary before approval, treats configured-home-reached ABORTED as success only after joint proof, treats every other ABORTED/INVALID/COMPLETE as immediate failure, polls cancellation during startup home, and recognizes managed critical names driver, scan_stack and tesseract_worker.
  startup_cancel_contract: Driver-service, joint-stream, vision, hand-eye and isolated-worker startup waits invoke the same mission guard on every poll. Cancellation, deadline, heartbeat loss or child exit therefore interrupts the active wait and enters bounded cleanup instead of waiting for that dependency's full startup timeout.
  process_signal_contract: Coordinator SIGINT sets the same guarded CANCELLED mission outcome as action cancellation. A client-requested cancel uses the ROS CANCELED goal-state transition; SIGINT or replay of a durable CANCELLED result uses ABORT because Foxy permits CANCELED only after the goal entered CANCELING. ROS remains alive until configured home, settled hold, feedback-confirmed disable and owned-child cleanup finish; the launch TERM timeout is 180 seconds and DDS shutdown is delayed one second after quiescence for result delivery.
  gui_submission: The Automatic Scan tab exposes editable base_link XYZ and target label fields, sends them through RunTargetScan, displays phase/capture feedback, and renders failure_code, retryable and safe_shutdown from the durable action result. Coordinator and RViz are not mission-owned children and remain available after terminal results.
scene_cloud_contract:
  topic: /piper/scene_cloud
  type: sensor_msgs/PointCloud2
  frame: base_link only
  owner: target_cloud_node.py
  consumer: supervised_cube_workflow_node.py
  behavior: Coarse unmasked synchronized L515 depth is transformed at its source stamp, voxelized, accumulated for one managed mission process, and published best effort. Pick placement requires a dense locally flat patch with four-sided edge support, no overhead points in the footprint, and configured target/obstacle clearance.
  authority_limit: Scene support selects a dry-run proposal only; it is not a robot-world collision map and cannot authorize contact motion.
startup_home_contract_2026_08_04:
  hold_service: {name: /scan_viewpoint_executor/hold, type: std_srvs/srv/Trigger, effect: publishes the measured energized hold without changing executor plan or terminal state}
  cancel_service: {name: /scan_viewpoint_executor/cancel, type: std_srvs/srv/Trigger, effect: terminal stop at a measured current-position hold before a separate fresh current-state RETURN_HOME transaction; it does not retrace prior endpoints and is never used as an ordinary startup hold}
  planning_service: {name: /tesseract_plan_bridge/request_startup_home_plan, type: piper_mobile_manipulation/srv/RequestTesseractPlan, plan_kind: RETURN_HOME}
  scene: {startup_home_static: true, observation_mode: perception_snapshot, candidate_views: [], obstacles: []}
  response_binding: The sole RETURN_HOME segment carries startup_home_static when applicable plus configured_home_direct_joint_move, configured_home_goal_positions_rad, collision_validation_bypassed, validation marker and exact home_stage inside trajectory_sha256 and bootstrap_recovery_evidence_json. The declared six-finite-joint goal must exactly equal the segment endpoint and the request goal. Request/response mismatch, a start/goal/stage mismatch, nonboolean data, multiple segments, more than two points, recovery targets, capture viewpoints, or a non-home kind is invalid.
  executor_scope: Camera/tracking/obstacle freshness and robot self-collision evaluation are bypassed at approval and runtime only when the parsed plan is exactly one zero-capture RETURN_HOME segment with configured_home_direct_joint_move=true, configured_home_goal_positions_rad exactly equal to its endpoint, collision_validation_bypassed=true, an allowed exact home_stage and the matching validation marker. The marker means robot self-collision exemption only. The CAD-derived holder/L515 envelope must independently retain configured support-plane/external-obstacle clearance for the measured start and path. CONFIGURED_HOME and ROUGH_HOME must also equal the executor rough-home parameter; STARTUP_WRIST and STORAGE_WRIST deliberately use their distinct stage goals. No normal motion may carry these fields.
multiview_candidate_freshness_contract_2026_08_06:
  owner: scan_viewpoint_planner_node.py
  source_authority: Each refresh is derived from a newly received, valid measured TrackedTarget; an old cached target alone cannot refresh authority.
  behavior: Meaningful candidate geometry replans occur after target displacement of at least 0.01 m or accepted/rejected history change. If neither changes, the deterministic candidate set is still rebuilt and republished every 0.5 seconds.
  downstream_boundary: The reachability filter republishes the refreshed safe set and the Tesseract bridge continues to reject scan data older than 1.0 second.
  invariant: The upstream refresh period must remain strictly below downstream data_timeout_sec. Never compensate for a silent planner by extending stale-data authority at the bridge.
capture_rejection_recovery_contract_2026_08_06:
  transient_evidence: Missing/stale scan-quality or occlusion evidence and future-TF publication lag are retried at the identical settled pose, without another command, for at most ten capture attempts.
  fresh_visual_rejection: Fresh below-threshold/invalid target quality or fresh non-CLEAR occlusion records the proposed pose in rejected history, publishes an energized hold, and ends that one-view transaction in VIEW_REJECTED rather than ABORTED.
  replacement: The mission counts VIEW_REJECTED against the eight-replacement budget, waits for fresh multiview readiness, and requests one new measured-coverage plan. It never increments accepted captures.
  approval_transient: Before worker spooling, a MULTIVIEW_SCAN snapshot rejected only for unsettled, prediction-only, or stale tracking may retry fresh command-free snapshots for at most 30 seconds while SAM2/GroundingDINO restores a measured lock. An unchanged exact plan/hash may retry approval for at most five seconds when rejection names unsettled joint feedback, unsettled/prediction-only/low-speed-scale tracking, or stale camera-clock health. A proposal-stage target_status LOW_CONFIDENCE/LOST/SEARCHING rejection uses the same bounded between-view visual-reacquisition principle. Every retry repeats exact live gates, target drift still forces a new plan, and collision/path/scene/camera/control/hash/worker failures are never admitted by the planning-snapshot exception.
  safety_boundary: Collision, path visibility, joint/control, hash, scene, worker, and every unnamed approval/capture error still abort fail-closed and enter guarded staged-home/disable cleanup.
target_drift_replan_contract_2026_08_06:
  approval_gate: Target drift above 0.015 m between the plan-bound center and latest measured center rejects approval before motion.
  closed_loop_response: The autonomous coordinator waits for fresh multiview readiness and requests a completely new one-view plan from current joints and the fresh measured center, at most eight consecutive times.
  invariant: No prior plan ID/hash is approved after drift, and drift refreshes do not consume accepted captures or visual-replacement budget.
current_state_home_contract_2026_08_06:
  sequence: [stop active execution, require fresh finite feedback, request direct ExecuteHomeStage from current joints without the Tesseract worker, bind exact home-stage robot-self-collision-exemption evidence, prove dense CAD-holder external clearance, independently execute and prove PRE_HOME then ROUGH_HOME then STORAGE_WRIST native MoveJ, accept each configured joint inside 0.2 rad for one second, retain the final controller target, feedback disable]
  prohibited: Autonomous cancel/failure must not invoke approved-path retrace or replay acquisition/scan endpoints.
  path_rule: Straight current-to-home SDK interpolation is used for the dedicated stage and only robot self-collision evaluation is intentionally skipped. The executor requires the exact fresh measured start, an in-limit configured goal, allowed home stage, exemption evidence, current all-six motor authority and at least 0.005 m CAD-holder support-plane/external clearance at every dense sample. Only that start may lie within the operator-qualified 0.3-rad post-disable relaxation band; larger/nonfinite feedback, an out-of-limit goal or an externally unqualified start/path rejects to NEEDS_OPERATOR. Current motor-control loss forbids commands and enters read-only disable proof.
runtime_refresh_scene_contract_2026_08_10:
  invariant: A transient telemetry hold/resume preserves the exact scene authority of the interrupted approved segment. ROUGH_ACQUISITION viewpoint zero remains bootstrap_static and obstacle-independent until its first settled observation; later acquisition looks and moving MULTIVIEW_SCAN segments still require their normal fresh/correlated obstacle authority.
  prohibited: WAITING_FOR_RUNTIME_REFRESH must not manufacture a new obstacle dependency for bootstrap_static or leak its missing-obstacle exception into any other moving segment.
live_target_only_obstacle_contract:
  source: /piper/sam2_object_ids synchronized with aligned depth and CameraInfo
  clear_case: A decoded ID image whose positive values contain only reserved target ID 1 emits a timestamp-preserving empty ObstacleInstance3DArray with scene_blocked=false before any TF lookup.
  projected_case: Any nonsuppressed ID greater than one requires object metadata, aligned depth support and exact-time camera-to-base TF; conversion, metadata, transform, classification or geometry failures remain blocked/fail-closed.
  prohibited: Missing, malformed or unreadable ID images must never be synthesized as clear, and the target-only clear path must never suppress an actual ID greater than one.
exact_multiview_obstacle_snapshot_contract:
  entry: MULTIVIEW_SCAN reaches MOVING only after fresh valid obstacle geometry, exact trajectory approval, collision qualification and runtime gates all pass.
  lifetime: That present snapshot may age until the one commanded endpoint finishes; it is not authority for another target or plan.
  live_override: Any newly received blocked, invalid, malformed, unsafe or unqualified scene remains an immediate stop signal even while the snapshot age is tolerated.
  reacquisition: Settled capture/replan may wait for SAM2 heavy reseeding, but the next pre-motion refresh requires a new fresh valid scene.
camera_clock_runtime_recovery_contract:
  fault_action: Any typed unhealthy camera timestamp during non-home execution publishes and proves a current-feedback hold; no RGB-D save or new target is authorized.
  deadline_sec: 30
  recovery_owner: run_gpu_vision_pipeline.sh may consume the watchdog request, stop only its owned process groups, use the configured bounded backoff and restart camera/watchdog/perception.
  resume: The unchanged executor state resumes only after fresh healthy camera clock and every other runtime gate pass. Expiry aborts to dedicated camera-independent direct home.
feedback_boundary_contract:
  maximum_readback_tolerance_rad: 0.005
  scope: measured feedback validation at inclusive joint boundaries only
  prohibited: The allowance cannot expand a planned target, command limit, collision path, trajectory hash, endpoint goal tolerance or controller limit.
startup_home_failure_contract_2026_08_06:
  state: MissionSession.startup_home_completed becomes true only after exact startup RETURN_HOME execution and configured feedback proof.
  transient_approval: The unchanged exact plan/hash may retry joint-feedback-not-settled approval for no more than five seconds; it must not replan or change authorization during that retry.
  cleanup: Every controllable failure holds and requests a perception-independent direct RETURN_HOME stage from current measured joints. Pre-acquisition and post-acquisition cleanup use the same robot-self-collision exemption; camera/tracking freshness cannot strand an otherwise controllable arm, but CAD-holder external clearance, fresh feedback and controller/motor health can and must return NEEDS_OPERATOR.
contracts_added_2026_08_10:
  staged_home_profile:
    schema_version: 4
    fields: [positions_rad, pre_home_positions_rad, pre_home_configured, mission_ready_joint6_rad, storage_joint6_rad, staged_home_configured, startup_wrist_direction, storage_wrist_direction, saved_at_sec, home_pose_sha256, optional observed_disabled_positions_rad]
    invariant: mission_ready_joint6_rad equals rough-home J6; startup_wrist_direction is increasing and storage_wrist_direction is decreasing; storage J6 is on the negative branch below ready; startup wrist preserves measured J1-J5 and changes only J6; storage wrist preserves rough-home J1-J5 and changes only J6. The mission validates the measured branch before enable and refuses a positive non-ready start. Schema-v2 staged profiles remain readable only for diagnostics and cannot authorize motion. Official rootless qualification consumes the exact persisted profile and proves direct endpoints and both directions. Each segment retains external-floor proof and no recovery targets.
    current_status: Hash 9cd1f62264699e86f047c1bfe0010d10084d3b6b239df17de7386b5b2f18fb66 binds ready J6 0, shutdown-only pre-home [0,0.400357244,-0.498793736,0,0.600614364,0], negative storage J6 -3.139536232, increasing startup and decreasing storage. Software regression/build passes; supervised physical retry remains required.
  powered_start_only_home_recovery:
    invariant: Every dedicated RETURN_HOME contains exactly measured start and one configured target. The response must declare configured_home_direct_joint_move, configured_home_goal_positions_rad equal to the request and endpoint, collision_validation_bypassed, configured_home_collision_validation_bypassed and the exact requested home_stage; these fields exempt robot self-collision only. The response must also report dense CAD-holder external-floor validation and at least two samples. Recovery targets, a third point, scan viewpoints, mismatched stages/goals, missing external-clearance evidence and non-RETURN_HOME use reject.
  request_tesseract_plan:
    added_request_fields: {home_stage: [CONFIGURED_HOME, STARTUP_WRIST, ROUGH_HOME, STORAGE_WRIST], joint_goal_positions_rad: exactly six finite radians for RETURN_HOME overrides}
    hash_binding: home_stage and the exact joint goal are part of request identity and worker planning payload.
  heavy_refresh_archive:
    added_manifest_fields: [depth_encoding, camera_matrix, rgbd_stamp_delta_sec]
    synchronization: color, aligned depth and color CameraInfo are selected by ApproximateTimeSynchronizer with 0.08 second slop before spooling.
  surface_coverage:
    voxel_size_m: 0.010
    convergence: three consecutive accepted observations with novel measured voxel fraction <= 0.02, after at least eight valid surface views and achieved-FK side/span floors.
  mesh_jobs:
    status_topic: {name: /piper/mesh_job_status, type: MeshJobStatus, qos: reliable transient-local}
    home_service: {name: /piper/report_tracked_robot_homed, type: ReportTrackedRobotHomed, binds: [task_id, mesh_job_id, manifest_sha256, homed_at_sec]}
    result_service: {name: /piper/get_mesh_job_result, type: GetMeshJobResult}
    states: [WAITING_FOR_BASE_HOME, QUEUED, RUNNING, SUCCEEDED, FAILED]
    output: reconstruction/target_mesh.ply cleaned mesh plus adjacent target_mesh.raw.ply under the immutable scan dataset, with both hashes in quality_json; the existing public mesh_path remains the cleaned path.
runtime_contract_repairs_2026_08_10:
  heavy_response_mask_resolution:
    input: exact correlated job_id plus a nonabsolute, nonescaping relative mask path
    roots_in_priority_order: [consumed/job_id, responses/job_id]
    behavior: Retry both roots twice so the atomic consume rename cannot yield a false unreadable-mask result.
    failure: No decodable image in either location remains fail-closed.
  direct_home_transient_refresh:
    behavior: A hold_for_refresh reason commands current measured hold and uses bounded WAITING_FOR_RUNTIME_REFRESH before resuming the exact unchanged home transaction.
    excluded_authority: Invalid limits, controller faults, emergency stop, nonfinite feedback and command failure are not made recoverable.
typed_failure_contract_2026_08_14:
  internal_source_of_truth: piper_mobile_manipulation/infrastructure/failure_model.py
  public_boundary: RunTargetScan.failure_code and all existing reason/message fields remain ordinary strings with unchanged names and values.
  model: {code: FailureCode, detail: human-readable string, tags: immutable FailureTag set, retryable: bool, needs_operator: bool, outcome: legacy action outcome, blocker: machine-readable legacy blocker token}
  compatibility_adapter: legacy_failure_adapter is the only migrated mission-path phrase classifier and may be used only where the upstream Foxy interface exposes no typed failure field.
  invariant: Control flow consumes code/tags/blocker from Failure. It must never search Failure.detail. Rewording detail on an existing typed Failure cannot change behavior.
joint5_contact_contract_2026_08_11:
