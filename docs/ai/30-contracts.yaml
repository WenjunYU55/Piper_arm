  terminal_recovery: A mission that cannot prove home or disable revokes authorization and stops exact non-command groups but does not claim complete cleanup or safe shutdown while driver or scan_stack is retained.
  readmission: Processing-only survivors are eligible for exact-handle cleanup. A live previous driver makes cleanup eligible only with fresh motor_feedback_valid and all six driver flags false. Failure to prove this remains CONTROL_UNTRUSTWORTHY and starts no child.
  preserved: [process commands, startup order, reverse shutdown order, SIGINT five-second and SIGTERM three-second policy, no autonomous SIGKILL, no process-name discovery, home hold disable behavior, ROS actions topics services QoS and results]
voxel_nbv_generation_contract_2026_08_17:
  planner_json: Existing /piper/scan_viewpoints and /piper/scan_coverage JSON gain additive view_generation schema 1 with session_id, accepted_views, policy, generation, ready, candidate_viewpoints and reason. Candidate entries also carry requested/effective policy, session and generation.
  propagation: viewpoint_reachability_filter_node preserves all top-level and candidate generation fields while adding its existing preliminary status fields.
  bridge_receipt: /piper/tesseract_view_generation is reliable transient-local String JSON. It is published only after bridge_node caches the corresponding /piper/reachable_scan_viewpoints payload.
  mission_match: A request is permitted only when the receipt arrived after clear_plan_cache, matches the current scan-history session, and has accepted_views=generation=current capture count with ready=true. Mismatch waits within the existing plan-result timeout; it never relaxes bridge data_timeout_sec.
  seed: Requested voxel_nbv generation zero uses voxel_nbv_seed and requested ray_nbv generation zero uses ray_nbv_seed. Generation one and later use their requested authoritative policy only after measured voxel evidence is ready.
  plan_provenance: /piper/tesseract_plan_provenance is reliable String JSON keyed by exact plan_id/request_id/request_sha256 and selected candidate identity, effective/requested policy, session, generation, NBV rank, predicted unknown pixels, novel surface pixels and score.
  capture_persistence: schema-2 frame metadata gains additive view_selection. It is available only when exact plan_id/current_view correlation succeeds; mismatched or absent provenance is stored as unavailable and never guessed.
  unchanged: [RunTargetScan action schema, RequestTesseractPlan service schema, TesseractPlan message schema, QoS of existing interfaces, motion speeds, joint limits, freshness thresholds, target drift, capture thresholds, home and disable behavior]
mission_shutdown_and_runtime_gate_contract_2026_08_17:
  public_surface_change: none
  mission_authority: MissionEngine alone owns admitted mission phases and terminal shutdown; target_scan_mission_node keeps ROS action/queue/result conversion and public compatibility delegates.
  failure_routing: Every exception or failure after process-generation ownership enters shutdown. An old failure code or human-readable reason never decides whether a fresh direct-home request may run.
  no_command_exception: Only session.motor_control_lost_reason, populated from current powered arm feedback and authority checks, forbids hold/home/storage/disable commands and enters read-only all-six-disabled proof plus owned-process cleanup.
  direct_home_required_evidence: [matching unexpired mission authorization including bounded same-identity terminal renewal after deadline, executor idle, fresh finite current joints, exact configured stage and target, stage direction and changed-joint policy, fresh fault-free all-six motor proof, dense holder/L515 external-clearance proof, progress, endpoint convergence, stage settling]
  direct_home_excluded_evidence: [camera health, tracking status, workflow state, obstacle-topic freshness, Tesseract controller-motion-limit freshness or hash]
  final_hold: No explicit autonomous hold-service request. The position controller retains the feedback-proved STORAGE_WRIST target until the immediately following all-six disable. HOLDING remains a status/phase boundary only.
  safe_shutdown: Requires ROUGH_HOME proof, STORAGE_WRIST proof, all-six disable proof and owned-process cleanup; no independent hold proof exists in the autonomous terminal route.
  runtime_policy: RuntimeGatePolicy names the complete evidence categories for each SafetyMode. Approval requires phase-appropriate visual/planning evidence; issued acquisition/scan motion keeps arm, limits and selected scene authority but does not use moving-camera perception as an asynchronous revocation signal; capture requires current camera evidence.
  unchanged: [ROS actions, topics, services and message fields, QoS, parameter names/defaults/units, numeric thresholds, scan trajectory geometry/timing/speeds, TF/calibration, perception, Tesseract planning, stage targets and motor-loss fail-closed behavior]
gripper_diagnostic_contract_2026_08_16:
  production_enable: After all six J1-J6 enable flags are proved, piper_ctrl_single_node sends GripperCtrl position 0 raw, effort 1000 raw, mode 0x01 and set_zero 0x00 exactly once per cache generation.
  production_disable: The service sends mode 0x02 only after all six J1-J6 disable flags are proved; the deprecated topic sends mode 0x00 at the same boundary. Failure of the main-joint transition sends no gripper command.
  direct_tool: tools/debug_piper_gripper.py status and monitor connect with piper_init=false and send no command. Command modes require no competing PiPER owner and an exact terminal confirmation; clear-enable and motion-test additionally require homing status true. No mode calls ResetPiper or sends set_zero 0xAE.
  can: {command_id: 0x159, feedback_id: 0x2A8, parameter_query_id: 0x477, parameter_feedback_id: 0x47E, position_unit: 0.001_mm, effort_unit: 0.001_Nm}
  current_feedback: {position_raw: 10220, effort_raw: 0, enabled: false, homed: false, faults: none, sdk_rate_hz: 200}
  verified_command_correlation: {command_bytes: ["00 00 00 00 03 E8 02 00", "00 00 00 00 03 E8 01 00", "00 00 00 00 03 E8 02 00"], enable_persisted_seconds: 5.0, feedback_followed: true, competing_owner: false, override_observed: false, final_disabled: true}
