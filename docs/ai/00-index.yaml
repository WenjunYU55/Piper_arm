native_l515_reconstruction_geometry_2026_09_01:
  status: implemented_command_free_replay_quality_fail_retained
  contract: Reconstruction now offers projected_color_depth (unchanged default and canonical target_mesh.ply) and native_depth (separate target_mesh.native_depth.ply). Native mode reverse-correlates exactly one immutable confidence-qualified native L515 sample to every accepted projected target-depth winner, integrates on the contiguous native depth grid with T_base_depth = T_base_color times T_color_depth, and never expands semantic support. RGB is sampled only for visualization/texturing. GUI selection plus an explicit 2-30 mm TSDF band control apply only to offline reconstruction.
