  quality: View count alone neither passes nor fails a model. Existing geometry, dimension, connectivity, residual, watertightness, provenance and visual-review gates remain authoritative, and the durable mesh job is SUCCEEDED only for measured PASS or WARN. A generated mesh with overall FAIL becomes a durable FAILED job while retaining mesh/hash/report diagnostics.
  environment: Gateway, GUI and reconstruction/setup_environment.sh now share reconstruction/.venv. System-Python fallback remains possible only when the isolated executable is absent.
  calibration: Mission startup hashes the exact PIPER_HAND_EYE_CALIBRATION file used by the hand-eye child and passes that identity into every future frame and manifest. Historical immutable datasets with no identity require the existing explicit diagnostic flag and remain DIAGNOSTIC_ONLY.
  replay: The historical scan_20260821_185143 report generated a 615-vertex 719-triangle diagnostic mesh from three views and failed because dominant-component support was 70.4 percent and the mesh was not watertight. Under the current contract the same count is VIEW_COUNT_ELIGIBLE, but those independent geometry failures remain authoritative.
supervised_ray_nbv_e2e_2026_08_21:
  result: Task codex-e2e-20260821-185113-adaptive completed SUCCEEDED with three accepted GOOD/CLEAR captures, safe_shutdown true, configured pre-home rough-home and storage-wrist proof, feedback disable, and exact mission-child cleanup.
  dataset: datasets/active_scan/scan_20260821_185143
  integration_repairs: [final-SAM-mask coherent target-depth selection, low-rate capture diagnostic callback isolation, full-pool exclusion before bounded ray shortlisting, typed attempted-ray planning-budget exhaustion, adaptive completion after a proved safe-view frontier is exhausted]
