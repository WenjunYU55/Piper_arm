project:
  name: Piper_arm
  purpose: Bounded closest-first multi-target eye-in-hand RGB-D rough-target acquisition, open-vocabulary tracking, occlusion assessment, adaptive feature-gated 8-to-24-view capture, and guarded sequential low-speed scan execution for an AgileX PiPER arm with Intel RealSense L515.
  runtime: Ubuntu 20.04; ROS 2 Foxy; ROS nodes on Python 3.8; isolated Grounded-SAM-2 workers on Python 3.10+.
  operator_home_acceptance_2026_08_16: >-
    Configured PRE_HOME, ROUGH_HOME and STORAGE_WRIST remain direct
    ExecuteHomeStage/native MoveJ operations; they never call the Tesseract
    worker. At the operator's direction, each J1-J6 configured-home endpoint
    and successive-sample check now uses a 0.3-rad allowance for one second.
    Startup and final current-position hold still publish and require an
    acknowledgement, fresh finite feedback and trusted all-six motor status,
    but their former 0.005-rad position-window proof is no longer a mission
    gate. The GUI now exposes a shutdown-only pre-home recorder, displays that
    pose, and preserves pre-home whenever rough/ready or storage J6 is edited;
    the prior buttons could silently erase it. No physical motion was run for
    this software change.
  startup_j6_transaction_reset_2026_08_16: >-
    Live task gui-sim-db1f2698f7c74951a83b9d229d875a49 exposed an
    incomplete STARTUP_WRIST lifecycle defect. After the explicit disable,
    disabled wrist relaxation fell from the retained 3.647663-rad high-water
    mark toward 3.006090 rad; the still-active direction watchdog repeatedly
    issued DisableArm(7) and defeated later Commissioning Enable attempts.
    A proved explicit disable or a direction-watchdog trip now clears the
    incomplete J6 target, raw/logical wrap state and direction high-water.
    Focused driver and mission tests plus the affected package build pass; no
    physical retest was run and the complete stack remains off.
  startup_wrist_executor_scope_reintegration_2026_08_16: >-
    E2E task gui-sim-904111b0d41b48a6bd16a10d3c29f538 exposed a partial
    reintegration regression after J6 reached its qualified startup wrap
    bridge: the executor still measured progress against stale pre-enable
    J1-J5 targets, declared no progress with a 0.056274344-rad J2 residual,
    and then requested PRE_HOME while the driver correctly retained
    STARTUP_WRIST authority. The current branch now restores the archived
    stage scope. Authenticated STARTUP_WRIST refreshes J1-J5 from one fresh
    measured sample at each command boundary, evaluates progress/convergence
    and settling from J6 only, and publishes no redundant hold between
    STARTUP_WRIST and ROUGH_HOME. Every other direct-home and scan transaction
    remains six-joint checked. The failed mission made zero captures and
    reported NEEDS_OPERATOR with safe_shutdown=false; supervised physical
    requalification remains required.
  gripper_diagnostic_boundary_2026_08_16: >-
    tools/debug_piper_gripper.py is the single-owner direct-SDK diagnostic for
    CAN IDs 0x159 command and 0x2A8 feedback. Single-owner testing measured fresh
    200 Hz feedback at the physically closed aperture (-0.210 mm), with no
    reported gripper faults. A raw-CAN-correlated closed-target pulse transmitted
    exactly disable 0x02, enable 0x01 and disable 0x02; feedback became enabled,
    remained enabled for a separate five-second observation, and returned to
    disabled/zero effort. No later overriding command was observed. Homing status
    remained false. The production arm-enable path still sends one
    ENABLE command at 0 mm and 1.0 N m after all six arm motors enable; no
    behavior was changed. A supervised production-path test enabled all six arm
    motors, opened J7 from 0.28 mm to 9.66 mm at 0.5 N m, then closed on a soft
    object at 4.48--4.76 mm and sustained about 1.04 N m for five seconds without
    faults. Final disable produced status disabled and zero effort. This proves
    powered position control and holding; the reported softness was the unloaded
    closed-target condition, not failed J7 torque. Homing status remains false,
    so automatic zeroing remains prohibited and the absolute aperture datum still
    needs separate manufacturer-procedure review.
  powered_j5_dropout_incident_2026_08_11: >-
    GUI task gui-sim-be1e6cd0d5e1419e9b4397261a530fd7 persisted 12
    GOOD/CLEAR captures in scan_20260811_144903, but remained one-sided
    (+Y 3, -Y 0; 61.48-degree azimuth; 22.60-degree elevation) and exhausted
    the former 150-second one-view worker budget. This did not cause the motor
    failure: at 1786456440.439, about 93 seconds before planning timed out, the
    low-speed J5 driver-enable flag independently became false while the other
    five axes remained enabled. The driver's existing 200 Hz fail-closed
    watchdog then disabled the remaining axes. Old coordinator code later
    attempted direct home despite the already-disabled arm, made no progress,
    and returned CONTROL_UNTRUSTWORTHY. The operator manually homed the arm and
    no further arm command was issued. PiperStatusMsg now exposes feedback
    validity, every motor enable flag, parsed per-motor faults and the watchdog
    reason. The mission and executor continuously require fresh all-six-enabled
    proof during powered motion. A partial state or any motor fault immediately
    revokes motion authority; terminal cleanup sends no hold, home, storage or
    disable command, waits read-only for the driver's all-six-disabled proof,
    stops owned processes and returns NEEDS_OPERATOR with safe_shutdown=false
    because configured home was not autonomously proved. Automatic one-view
    MULTIVIEW_SCAN requests now use a 90-second internal budget and three-second
    OMPL attempts; manual/batch requests retain 150/5 seconds. Four affected
    packages build, 218 focused tests pass, 452 broad functional tests pass
    with one skip, and both command-free rootless qualifications pass. The
    physical cause of the spontaneous J5 dropout remains unresolved and must
    be inspected before another supervised mission. After the operator's
    manual home, stale mission-owned scan, planning, perception, camera,
    hand-eye and driver groups were stopped without any ROS arm command. A
    direct piper_init=false read-only CAN sample then proved six false motor
    flags, no per-motor faults, arm err_code zero and live feedback. The stale
    pre-fix coordinator was then stopped while no mission was active and
    replaced by the rebuilt coordinator. /target_scan_mission and RViz are
    resident; driver, camera, perception, planning and command-publisher
    children remain absent and no camera device has an owner.
  startup_j6_direction_incident_2026_08_11: >-
    The authorized GUI mission gui-sim-ef30b4cc466f488ba1331d08b6432d34
    passed disabled preflight and a separate no-command enable/disable smoke
    produced 583 consecutive all-six-enabled, fault-free typed samples. During
    STARTUP_WRIST, the saved -3.139536232-rad storage branch commanded
    increasing J6 toward zero. After about +0.091 rad, J6 reported
    collision_status and driver_error_status. The continuous motor guard
    immediately revoked authority; no hold/home/storage/disable command was
    issued afterward, the driver watchdog proved all six axes disabled, every
    mission child stopped, and the result was NEEDS_OPERATOR with zero captures
    and safe_shutdown=false. Five later piper_init=false samples showed all six
    disabled, no faults, err_code zero and J6 -3.105395 rad. The operator later
    corrected the direction interpretation: increasing controller J6 from the
    negative storage branch toward zero is the intended startup motion, and
    terminal storage is its decreasing inverse. Schema-v3 therefore binds
    startup_wrist_direction=increasing, storage_wrist_direction=decreasing,
    and negative storage J6 -3.139536232 rad. The mission validates the
    measured signed J6 branch before enable and refuses a positive non-ready
    start. Schema-v2 profiles remain diagnostic-only. The earlier positive-
    branch/decreasing repair was based on the mistaken direction report and is
    superseded. The prior J6 collision/driver-error containment evidence
    remains valid, but it no longer proves that increasing direction was
    wrong. The rebuilt GUI and
    coordinator then ran task gui-sim-a19ebc603a124a12b37e73ee8527a8c9
    against the current negative branch under the now-superseded gate. It
    reached preflight, issued no enable request or motion command, rejected the
    branch with CONTROL_UNTRUSTWORTHY,
    stopped all children and reported safe_shutdown=true because the arm
    remained disabled. A final direct read showed six false flags, no faults
    and J6 -3.126426 rad. A later direct SDK diagnostic plus five raw 0x2A7 CAN
    frames independently reported J6 -2.860630 rad (-163.902 degrees), all
    motors disabled and no faults; RViz had zero live /joint_states_single
    publishers and was not feedback authority. The corrected negative-storage
    current schema-v4 profile hash is 9cd1f62264699e86f047c1bfe0010d10084d3b6b239df17de7386b5b2f18fb66.
    Two affected packages build, 145 focused tests and 428 complete
    mobile/Tesseract tests pass, and both command-free rootless suites prove
    startup delta +3.139536232 plus storage delta -3.139536232. Coordinator
    and RViz remain resident and idle.
  joint5_contact_incident_2026_08_11: >-
    During terminal homing after GUI scan task
    gui-sim-d30410e05b9c405cb48e969fa818c173, the installed camera-holder/L515
    assembly contacted the table/floor and joint 5 disabled with
    motor_overheating, driver_overcurrent, collision_status,
    driver_error_status and stall_status feedback. The ten persisted
    GOOD/CLEAR views in scan_20260811_124232 and their viewpoint planning are
    retained as valid scan evidence; this is a homing/execution safety incident,
    not a viewpoint-diversity defect. All six motors were subsequently proved
    disabled and every hardware/mission process was stopped except RViz. No
    fault clear, re-enable, home motion or other physical test is authorized
    until the mechanism/table contact and J5 are inspected and the operator
    explicitly reauthorizes motion. Exact CAD-derived link6 envelope center
    [-0.029750002,0,0.0375] m and size
    [0.1395,0.10572671,0.053] m now receive a mandatory 0.005 m support-plane
    and external-obstacle clearance check in both worker and executor, including
    direct home. The dedicated-home marker still exempts the intentionally
    folded robot from robot self-collision evaluation; it never exempts the
    attached camera assembly from external clearance. Driver enable/disable now
    proves all six FOC flags, rolls a failed partial enable back to all-disabled,
    and a 200 Hz watchdog disables every axis on persistent partial enable or
    any per-motor FOC fault. Software-only focused and rootless qualification
    regressions pass; physical acceptance is blocked by inspection. A fresh
    read-only five-sample CAN inspection on 2026-08-11 found can0 ERROR-ACTIVE,
    all six driver-enable flags false and arm err_code zero, but J5 still
    latched motor_overheating, driver_overcurrent, collision_status,
    driver_error_status and stall_status. This does not pass the powered-test
    gate and no enable or motion was attempted.
  joint6_limit_update_2026_08_10: >-
    The operator corrected the controller-coordinate J6 range to exactly
    [-pi,+pi]. Driver and GUI fallbacks, scan kinematics, production
    Xacro/generated URDF/CSV, Tesseract qualification fixtures and regressions
    now use that same range. The old measured J6 JSON record remains invalid,
    so it cannot override the new fallback. The observed approximately 0.04 rad
    neutral discrepancy was attributed to the controller's persistent J6 zero
    write, not TF or a software command offset. At 18:18 local time the operator
    completed the guarded physical-neutral write; a subsequent independent
    three-second read-only diagnostic reported J6 exactly 0.00000 rad in every
    sample, disabled, with no faults. One hundred fifty-seven focused tests,
    check_urdf, four affected package builds, and both command-free rootless
    Tesseract qualifications pass. The full-turn endpoints and new neutral still
    require supervised low-speed physical qualification before powered mission use.
  staged_home_profile_validation_2026_08_10: >-
    The operator recorded schema-v2 rough/ready [0,0,0,0,0.399345492,0]
    and storage J6 -3.139536232 rad. Hash, schema and hard limits pass. Dense
    diagnostics show the conservative L515/cable envelopes overlap the base and
    link envelopes during the intentional mechanically supported storage fold.
    The operator confirmed this resting contact corridor is intentional and
    directed that configured homing must reach the recorded joints without
    collision planning. Dedicated zero-capture RETURN_HOME requests now emit
    exactly the measured start plus one direct configured target for
    CONFIGURED_HOME, STARTUP_WRIST, ROUGH_HOME or STORAGE_WRIST and carry an
    explicit hash-bound collision_validation_bypassed marker (robot
    self-collision only) and the exact
    configured_home_goal_positions_rad through worker, response, bridge and
    executor. This original worker-routed form is historical; the current
    mission-authorized ExecuteHomeStage/native MoveJ path does not call the
    worker and does not require camera, tracking, workflow, obstacle-topic or
    controller-limit-hash health. Hard limits, fresh finite feedback, current
    all-six motor authority, exact configured endpoint and stage direction,
    aggregate speed, endpoint convergence/settling, feedback disable and
    owned-child cleanup remain mandatory. The controller retains the final
    proved endpoint until immediate disable; no separate hold service is called.
    CAD-derived camera-holder/L515
    support-plane and external-obstacle clearance is never bypassed. The
    exception cannot enter
    acquisition, scan, manipulation or an implicit multiview return. The exact
