implementation_update_2026_08_10:
  staged_home: A schema-v4 home profile binds rough-home/mission-ready J6, terminal-only PRE_HOME, negative storage J6, positive-only startup and decreasing storage direction. The measured signed branch is checked before enable. Startup executes direct J6-only STARTUP_WRIST then direct ROUGH_HOME through ExecuteHomeStage. Every controllable terminal path executes PRE_HOME, ROUGH_HOME and J6-only STORAGE_WRIST, retains the proved final controller target, then immediately performs feedback-confirmed disable and owned-child cleanup. Autonomous startup/shutdown does not call the redundant hold service. Tesseract is not used for configured-home stages. Robot self-collision planning is intentionally bypassed for these operator-recorded stages, while fresh feedback/motor evidence and dense installed-holder external clearance remain mandatory; Tesseract motion-limit telemetry is not direct-home authority. ROS JointState array sequences are accepted as six-joint inputs. Older profiles remain readable for diagnostics but cannot start an autonomous mission when require_staged_home_profile is true.
  occlusion: Heavy refresh now archives synchronized color, aligned depth and camera intrinsics. Exact response masks are projected with the capture-time TF; pen/marker/stick contact proposals require two associated settled observations, at least five-percent target support and closer-depth occlusion, predicted surface benefit and bounded uncertainty. Contact motion remains blocked by manipulation_model_qualified=false.
  scanning: Automatic completion combines achieved-FK Y-side and elevation floors with measured base_link target-surface voxels from persisted RGB-D masks. Achieved azimuth span is diagnostic only. Eight accepted views seed the model but do not force completion; twenty-four is the safety maximum, and three consecutive novel-surface fractions at or below 0.02 establish convergence.
  reconstruction: Successful safe shutdown allocates a durable mesh job. Only a task/job/manifest-correlated tracked-robot-homed report queues isolated TSDF reconstruction; status and final PLY/hash/quality are durable and queryable.
  validation: [162 defect-focused home/contract/worker/executor tests passed, 387 full mobile-manipulation/Tesseract tests passed, 282 focused ROS/GUI/driver/Tesseract tests passed, piper_mobile_manipulation and piper_tesseract_foxy rebuilt, both exact-profile rootless suites PASS with real_arm_motion false]
adaptive_nbv_and_geometry_crash_update_2026_08_10: >-
  The current controller is a bounded object-centric receding-horizon NBV loop,
  not a fixed orbit: it accepts one achieved RGB-D observation, refreshes the
  measured target/scene/history, selects another collision-qualified candidate,
  and repeats. Automatic capture count is now adaptive from an eight-view model
  seed to a hard safety maximum of twenty-four. Success additionally requires
  both Y-side floors, 25-degree elevation, and three
  consecutive measured masked-surface gains at or below 0.02. NextBestSense is
  retained as a later FisherRF/online-3DGS experiment, BundleSDF as a later rigid
  registration/reconstruction option, and the motion-uncertainty NBV paper's
  object-centric voxel/reachability/replan structure is the immediate design
  match; its GP motion predictor is unnecessary while the cube is stationary.
  GUI task gui-sim-cbb777414fc446298157bcc5a54b35e5 physically persisted eleven
  GOOD/CLEAR observations before obstacle_instance_3d_node crashed because its
  archived-mask path used cv2 without importing it. The import is repaired, a
  real archived-mask projection regression covers the path, and every critical
  gpu_geometry child now terminates its parent launch on exit so readiness fails
  promptly rather than degrading later as stale obstacle telemetry. The run's
  terminal direct rough/storage home, feedback disable and exact child cleanup
  succeeded; the updated adaptive scan still requires a rebuilt physical retry.
nbv_frame_contract_update_2026_08_11: >-
  Physical GUI task gui-sim-0d67e6fce8404547b93b68c11d900d1a
  acquired the cube, proved CLEAR occlusion evidence, persisted ten GOOD/CLEAR
  RGB-D/mask observations, exercised both same-pose evidence catch-up and a
  fresh visual-quality rejection/replacement, then safely completed direct
  ROUGH_HOME, STORAGE_WRIST, hold, six-axis disable and owned-child cleanup.
  The run did not satisfy feature coverage: it achieved three +Y floor views,
  zero -Y floor views, 59.7 degrees azimuth and 22.2 degrees elevation. The
  cause was a coordinate-frame fallback: during a short tracker gap the
  viewpoint planner accepted raw camera_color_optical_frame /piper/target_3d
  values as though they were base_link. The executor correctly rejected the
  resulting target-centre drift before motion. Multiview planning now accepts
  target centres only when header.frame_id exactly matches planning_frame_id
  (base_link); raw optical measurements must pass through target_tracker first.
  Failure classification also recognizes scan-candidate/view-frontier failures
  as NO_REACHABLE_PLAN and no longer mistakes the "can" inside "scan" for a
  CAN-control fault. The package rebuild, 327-test mobile suite, 92-test
  Tesseract suite and both command-free rootless qualifications pass; each
  rootless result explicitly reports real_arm_motion=false.
capture_rejection_equivalence_update_2026_08_11: >-
  The rebuilt frame-contract retry was exercised through the GUI as task
  gui-sim-79f9f909f91148dda1f74b4292a4b5b5. It physically proved the raw
  camera_color_optical_frame fallback is rejected while 1050 base_link
  TrackedTarget candidates continue, then persisted three GOOD/CLEAR views.
  A fourth view correctly produced VIEW_REJECTED and a different collision-
  qualified replacement. At that replacement the lower capture layer returned
  target_3d invalid after one evidence catch-up retry; old executor code treated
  this semantically equivalent fresh visual rejection as mission ABORTED. The
  mission nevertheless proved direct ROUGH_HOME, STORAGE_WRIST, hold, all six
  disabled and exact owned-child cleanup with safe_shutdown=true and no contact.
  Missing target/mask is now a bounded same-pose readiness retry, while fresh
  Target3D valid=false records/excludes the pose and emits VIEW_REJECTED for a
  different NBV. I/O, malformed TF, service and safety failures remain aborts.
  The rebuild, 114 focused scan-motion tests, full 327 mobile tests and 92
  Tesseract tests pass; both command-free rootless qualifications also pass
  with real_arm_motion=false. The next physical GUI retry is authorized only
  after the normal read-only CAN/all-six-motor gate.
paused_retry_repair_2026_08_10: >-
  GUI task gui-sim-f8ebc6a06e554d80be66f29756337945 persisted five
  GOOD/CLEAR views in scan_20260810_230940 before an archived heavy-mask read
  raced the bridge's atomic responses-to-consumed directory move. The masks and
  depth were all 480x640; this was not a perception-shape failure. Response-mask
  reads now validate the path and retry both immutable roots. Dedicated home now
  treats a transient fresh-motion-limit gap as the existing bounded hold/recovery
  even while homing; nontransient faults still abort. The 143 focused tests, 518
  broad software tests, eleven isolated AI tests and package rebuild pass.
  Physical authorization is paused and every hardware-capable child is off.
historical_v1_50_percent_scan_and_problem_ledger_update_2026_08_11: >-
  GUI task gui-sim-a130d7ad58a54815ab36341ed324be82 exercised the
  now-superseded tesseract_stream_v1 path at a configured 50 percent, persisted 24
  accepted captures in scan_20260811_190342, completed STARTUP_WRIST and the
  terminal ROUGH_HOME/STORAGE_WRIST sequence, and returned safe_shutdown=true
  with every mission-owned child stopped. It correctly failed quality rather
  than claiming completion: achieved coverage was +Y 9, -Y 3, 113.5148-degree
  azimuth and 37.4625-degree elevation, while measured novel-surface gain had
  not converged. Runtime logs contain no scheduled-stream overrun. At the same
  selected percentage, direct home took about 1.085/2.336 seconds while normal
  Tesseract moves commonly took 1.559-4.909 seconds and one detour took 8.811
  seconds. This is a policy/interface difference, not current evidence of host
  failure: the streamed path retains OMPL geometry, scales ISP time and may be
  lengthened by the fixed 0.025-rad-at-20-Hz ceiling (approximately 0.5 rad/s),
  then PiPER also receives the aggregate MoveJ percentage; configured home is
  one direct endpoint. Formal higher-speed qualification and a controller-side
  trajectory alternative remained open at that point. tesseract_stream_v3 now uses 20 Hz
  MoveJ-model-derived timing and awaits physical validation. docs/ai/80-problem-log.yaml indexes
  the full durable problem history and routes every entry to detailed evidence.
tesseract_stream_v2_controller_timing_2026_08_11: >-
  Historical tesseract_stream_v2 used ISP as an
  unscaled smooth robot-model path clock; its derivatives are finite planning metadata and are not
  PiPER commands. The worker samples the unchanged OMPL path at 100 Hz and lengthens it until the
  emitted position stream obeys the requested percentage of fresh hash-bound measured per-joint
  velocity limits or the 0.03-rad hard step ceiling, while sending the same aggregate MoveJ
  percentage. It intentionally does not infer acceleration from piecewise MoveJ setpoints because
  PiPER performs the controller interpolation. Recovery knots,
  collision geometry, exact hashes, zero derivative transport placeholders, no-burst behavior,
  the 0.30-rad following guard and final-only settle proof remain. Executor diagnostics and
  completion logs expose planned/actual duration, samples, achieved rate, maximum interval,
  dropped samples and following error. The first physical attempt
  gui-sim-50612c16547c4b14b6bcc498969a7eb4 failed before acquisition motion because the initial
  implementation incorrectly compared ISP derivatives with 5 percent of the measured 0.3-rad/s
  controller limit; safe direct home, disable and cleanup succeeded. The corrected unit/rootless
  regression bound the deployed 0.3-rad/s and 0.5-rad/s2 values. Its later physical task
  gui-sim-b945943e849f4e68ba587401b94e1c58 acquired the target and delivered 1,955 acquisition
  samples at 99.9 Hz with 0.0079 rad maximum following error, but exhausted the first automatic
  scan-view 45-second budget while collision-validating speed-derived transport samples. The
  mission failed NO_REACHABLE_PLAN yet completed direct home, all-six disable and exact cleanup
  with safe_shutdown=true. V2 is superseded and must not be restored.
tesseract_stream_v3_movej_timing_2026_08_11: >-
  The current normal acquisition/scan policy is tesseract_stream_v3. It retains every exact
  collision-checked OMPL/ISP source vertex, allocates whole 20 Hz ticks independently to each
  segment from J1-J5 5 rad/s and J6 3 rad/s multiplied once by effective_speed_percent, and adds
  only exact on-segment positions. A 0.05-rad hard adjacent-step ceiling preserves the model rate
  through 20 percent; higher selections remain capped and unqualified. Fresh queried controller
  limits remain mandatory hash-bound health evidence but are not a second schedule multiplier.
  ISP qdot/qddot and acceleration are not PiPER transport commands. Adaptive Bullet validation
  operates on source geometry independently of speed-derived transport density. The 200-test
  focused suite passes, 465 non-linter functional tests pass with one skip, and both command-free
  rootless suites pass with real_arm_motion=false. The rootless five-percent J6 regression emits
  0.15 rad/s over nine points in 0.4 seconds. Supervised task
  gui-sim-e9629c41e1224425b5adb0454b61ee3f physically exercised v3 at 20 percent:
  acquisition used 50 samples over 2.501 seconds at 19.6 Hz, later scan segments
  remained approximately 18.0-19.6 Hz with planned/actual durations aligned, and
  the operator judged speed consistent. Fifteen GOOD/CLEAR captures were persisted
  before the independent adaptive frontier returned NO_REACHABLE_PLAN at 65.30/120
  degrees azimuth without measured-surface convergence. Rough/storage home,
  all-six disable and child cleanup completed with safe_shutdown=true. The
  20-percent timing behavior is physically accepted; 1/5/10-percent staging,
  deliberate cancel-to-hold, NBV completion and settings above 20 percent remain pending.

