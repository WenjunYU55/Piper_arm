  incident: The initial repository import transposed the positive bound to 2.168 rad while retaining -2.618 rad, silently removing about 0.45 rad or 25.8 degrees from one side of the modeled workspace.
  derived_artifacts: [tracked-robot description bundle and hashes regenerated, cuRobo planning-URDF provenance rebound without geometry changes, two-million-sample camera capability atlas regenerated and requalified]
