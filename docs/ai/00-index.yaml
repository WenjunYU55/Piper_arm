historical_v1_50_percent_scan_and_problem_ledger_update_2026_08_11: >-
  GUI task gui-sim-a130d7ad58a54815ab36341ed324be82 exercised the
  now-superseded tesseract_stream_v1 path at a configured 50 percent, persisted 24
  accepted captures in scan_20260811_190342, completed STARTUP_WRIST and the
  terminal ROUGH_HOME/STORAGE_WRIST sequence, and returned safe_shutdown=true
  with every mission-owned child stopped. It correctly failed quality rather
  than claiming completion: achieved coverage was +Y 9, -Y 3, 113.5148-degree
  azimuth and 37.4625-degree elevation, while measured novel-surface gain had
  not converged. Runtime logs contain no scheduled-stream overrun. At the same
  selected percentage, direct home took about 1.085/2.336 seconds while normal
  Tesseract moves commonly took 1.559-4.909 seconds and one detour took 8.811
  seconds. This is a policy/interface difference, not current evidence of host
  failure: the streamed path retains OMPL geometry, scales ISP time and may be
  lengthened by the fixed 0.025-rad-at-20-Hz ceiling (approximately 0.5 rad/s),
  then PiPER also receives the aggregate MoveJ percentage; configured home is
  one direct endpoint. Formal higher-speed qualification and a controller-side
  trajectory alternative remained open at that point. tesseract_stream_v3 now uses 20 Hz
  MoveJ-model-derived timing and awaits physical validation. docs/ai/80-problem-log.yaml indexes
  the full durable problem history and routes every entry to detailed evidence.
tesseract_stream_v2_controller_timing_2026_08_11: >-
  Historical tesseract_stream_v2 used ISP as an
  unscaled smooth robot-model path clock; its derivatives are finite planning metadata and are not
  PiPER commands. The worker samples the unchanged OMPL path at 100 Hz and lengthens it until the
  emitted position stream obeys the requested percentage of fresh hash-bound measured per-joint
  velocity limits or the 0.03-rad hard step ceiling, while sending the same aggregate MoveJ
  percentage. It intentionally does not infer acceleration from piecewise MoveJ setpoints because
  PiPER performs the controller interpolation. Recovery knots,
  collision geometry, exact hashes, zero derivative transport placeholders, no-burst behavior,
  the 0.30-rad following guard and final-only settle proof remain. Executor diagnostics and
  completion logs expose planned/actual duration, samples, achieved rate, maximum interval,
  dropped samples and following error. The first physical attempt
  gui-sim-50612c16547c4b14b6bcc498969a7eb4 failed before acquisition motion because the initial
  implementation incorrectly compared ISP derivatives with 5 percent of the measured 0.3-rad/s
  controller limit; safe direct home, disable and cleanup succeeded. The corrected unit/rootless
  regression bound the deployed 0.3-rad/s and 0.5-rad/s2 values. Its later physical task
  gui-sim-b945943e849f4e68ba587401b94e1c58 acquired the target and delivered 1,955 acquisition
  samples at 99.9 Hz with 0.0079 rad maximum following error, but exhausted the first automatic
  scan-view 45-second budget while collision-validating speed-derived transport samples. The
  mission failed NO_REACHABLE_PLAN yet completed direct home, all-six disable and exact cleanup
  with safe_shutdown=true. V2 is superseded and must not be restored.
tesseract_stream_v3_movej_timing_2026_08_11: >-
  The current normal acquisition/scan policy is tesseract_stream_v3. It retains every exact
  collision-checked OMPL/ISP source vertex, allocates whole 20 Hz ticks independently to each
  segment from J1-J5 5 rad/s and J6 3 rad/s multiplied once by effective_speed_percent, and adds
  only exact on-segment positions. A 0.05-rad hard adjacent-step ceiling preserves the model rate
  through 20 percent; higher selections remain capped and unqualified. Fresh queried controller
  limits remain mandatory hash-bound health evidence but are not a second schedule multiplier.
  ISP qdot/qddot and acceleration are not PiPER transport commands. Adaptive Bullet validation
  operates on source geometry independently of speed-derived transport density. The 200-test
  focused suite passes, 465 non-linter functional tests pass with one skip, and both command-free
  rootless suites pass with real_arm_motion=false. The rootless five-percent J6 regression emits
  0.15 rad/s over nine points in 0.4 seconds. Supervised task
  gui-sim-e9629c41e1224425b5adb0454b61ee3f physically exercised v3 at 20 percent:
  acquisition used 50 samples over 2.501 seconds at 19.6 Hz, later scan segments
  remained approximately 18.0-19.6 Hz with planned/actual durations aligned, and
  the operator judged speed consistent. Fifteen GOOD/CLEAR captures were persisted
  before the independent adaptive frontier returned NO_REACHABLE_PLAN at 65.30/120
  degrees azimuth without measured-surface convergence. Rough/storage home,
