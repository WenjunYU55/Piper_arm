passive_results_campaign_2026_09_02:
  purpose: Record all cuRobo physical missions first, then one Tesseract mission at each identical fixed X/Z target position, and generate poster-result CSV, XLSX, PNG, PDF and optional controlled reconstruction replay without changing the production pipeline.
  owners: [results_campaign/campaign.py, results_campaign/bookmarks.py, results_campaign/collector.py, results_campaign/metrics.py, results_campaign/report.py, results_campaign/workbook.py, piper_gui/results_campaign.py]
