    and full 392-test suites, rebuild and both rootless qualifications pass; a
    new physical retry remains required.
  physical_capture_clock_recovery_2026_08_10: >-
    GUI mission gui-sim-2f877e11e30549c3a3ee26f918726864 reached the first
    scan endpoint and entered CAPTURING_RGBD. A transient L515 global-time
    remap then reported a camera stamp 0.554 seconds in the future against the
    0.500-second limit. This now commands a current-pose hold and permits up to
    30 seconds for the watchdog-owned full vision restart; capture and resume
    still require fresh healthy clock authority. During the old terminal
    recovery, powered J3 feedback briefly read +0.002460 rad at its inclusive
    zero boundary, beyond the former 0.002-rad readback allowance. Direct
    DisablePiper required 13 attempts and proved six false flags/no faults;
    exact task children were stopped. The feedback-only allowance is now
    hard-capped at 0.005 rad, still far below the operator-permitted 0.3-rad
    proof tolerance and the 0.025-rad plan-start window. Planned and commanded
    targets remain inside exact limits. Focused 145-test and full 392-test
    suites, rebuild and both rootless qualifications pass.
    A later disabled preflight measured J6 -3.173270 rad after the configured
    -3.139536232-rad storage target relaxed under power-off, 0.031677 rad past
    -pi with all six enable flags false and no faults. The operator's earlier
    0.3-rad proving allowance is now isolated to the exact first measured point
    of a hash-bound direct RETURN_HOME stage. Ordinary feedback remains capped
    at 0.005 rad and every planned/commanded goal remains strictly in-limit.
    The contract, worker, response validator and executor enforce that scope;
    191 focused and 438 complete tests, both package builds and both command-free
    rootless qualifications pass. A supervised physical retry remains required.
  camera_tf_datasheet_registration_2026_08_10: >-
    The operator confirmed that the current camera-holder and L515 rendering in
    RViz matches the physical assembly and is therefore the mechanical source of
    truth. The deployed session_20260808_straight_mount calibration_result.yaml
    retains the raw PARK solution under mechanical_registration but now deploys
    a datasheet- and device-factory-registered link6-to-camera_color_optical_frame
    transform. Intel Rev 003 defines the depth origin 4.5 mm behind the front
    cover glass and its X-Y origin at the IR transmitter. Device f1120648 reports
    colour-to-depth translation [0.0002000813,-0.0141312284,0.0042248368] m and
    a 1.322466-degree relative rotation. The earlier registration incorrectly
    combined the RGB X-Y centre with the recessed depth Z plane. The corrected
    l515_visual depth origin is [0,0,-0.008224997] m with straight housing-normal
    axes; composing the factory extrinsic places colour optical at
    [-0.0002000813,0.0141312284,-0.0040001602] m. This maps to link6 translation
    [-0.0781312284,-0.0002000813,0.0399998398] m and preserves the legitimate
    factory RGB/depth axis skew. On 2026-08-10 the operator measured the physical
    ChArUco board as 17 mm squares and 12 mm markers; every preserved August 8
    sample and board-derived report instead records 18 mm and 13 mm. Those PARK,
    held-out and fixed-board metric results are wrong-scale provenance only, not
    validation evidence and not a deployable rollback. The active mechanical
    registration does not depend on board scale. A new read-only TF overlay and
    corrected-scale five-pose stationary-board validation passed on 2026-08-10;
    mean/worst drift was 5.73/12.22 mm and 0.87/1.25 degrees against 15 mm and
    1.5 degree limits. The fixed board is the stationary metric target, so its
    five distinct stable base_link recoveries satisfy the remaining target
    repeatability check and physical_revalidation is passed. Semantic cube
    tracking repeatability remains an acquisition acceptance test.
    Offline validation passes: all architecture/calibration YAML parses, ten
    robot-description tests, four calibration-bound model-builder tests, ninety-nine
    scan-motion tests, check_urdf, all three affected ROS package builds, and both
    rootless core/compact Tesseract qualifications with real_arm_motion=false.
  camera_holder_model_update_2026_08_09: >-
    The physical gripper's permanent wrong-way-round installation is represented by
    a 180-degree Z rotation on the fixed link6-to-gripper_base joint; joint6 and its
    controller coordinates remain unchanged. The supplied millimetre camera-holder
    mesh remains a visual-only fixed gripper branch. Its nominal datum is the close
    12 mm arm-anchor pair, while the user-locked visual placement retains a -4 mm
    holder-frame Z trim and must not be moved. The holder's ordered 180-degree X then
    180-degree Z mesh correction is unchanged. The converted millimetre L515 STL is a
    second visual-only fixed branch. Its two 40 mm-spaced rear screw axes align
    transversely with the matching holder axes while retaining the operator-confirmed
    +2.5 mm axial seating trim; its child origin is camera_holder [0.1, 0, 0] m.
    The centred 61 mm camera body nests in the installed upper ring and uses a contrasting
    silver RViz material so it remains visible inside the black holder. Neither detailed mesh
    owns planning collision authority. The confirmed CAD housing placement plus
    the Intel depth datum and device factory extrinsic constrain the mechanically
    registered optical TF while RealSense still owns its internal
    camera_link-to-optical edges. The qualified conservative L515 housing/mount/cable
    envelopes remain unchanged. Ten
    robot-description tests, four model-builder tests, twenty-three acquisition
    tests, all three affected package builds, check_urdf, and both rootless
    core/compact qualifications pass with
    collision_model_qualified_for_hardware=true and real_arm_motion=false.
  hand_eye_calibration_update_2026_08_08: >-
    After the L515 was remounted straight, a new eye-in-hand solve used 12 fitting
    poses and three held-out poses with the board fixed near x=0.39 m in base_link.
    The saved samples model 18 mm squares and 13 mm markers, but the operator's
    2026-08-10 physical measurement is 17 mm and 12 mm. Consequently the PARK
    solution and all fitting, held-out and live five-pose metric results are
    retained only as wrong-scale provenance and must not be restored or deployed.
    The datasheet/factory-registered deployment in the same session file is
    independent of board scale. Its corrected-scale five-pose stationary-board
    validation passed on 2026-08-10 with 12.22 mm and 1.25 degree worst drift.
    Capture and validation now share exact 0.017 m/0.012 m defaults and persist
    those dimensions in new records.
    session_20260701_local remains rollback history,
    and the previously rejected analytical J6 compensation remains prohibited. The
    calibration-bound Tesseract model-builder tests passed 11/11 with the URDF mode-0
    regression, and both rootless core and compact suites requalified hardware collision
    planning with real_arm_motion=false.
  implementation_update_2026_08_04: >-
    The mission now binds an arbitrary sanitized target label/prompt through the action, gateway,
    GPU worker spool, heavy refresh, scan metadata, and durable result. Green cube retains its
    calibrated colour/aspect validation; other labels use the generic open-vocabulary profile with
    confidence and mask-support checks. Rough acquisition tries the centered look first, then the
    15-degree cardinal cone, and retains diagonal/compact candidates as reserves. Service-mode
    capture accepts only fresh GOOD quality at least 0.65 plus fresh CLEAR occlusion. A rejected
    pose is recorded but does not increment the accepted count; the autonomous mission holds and
    requests a replacement toward thirteen desired records, with at most eight replacements. It may
    finish below thirteen only after a correlated post-capture proof that no remaining distinct
    candidate has finite bounded collision-free IK. Fixed rectangular/radial/height workspace gates
    are disabled in the active path: Tesseract IK, joint limits, collision validation, current-state
    matching and executor runtime gates remain authoritative. Leaf/branch dry-run planning supports
    pick/place or outward push and pick placement requires a flat, dense, edge-supported, visibly
    clear patch from the accumulated base_link scene cloud. Real branch contact remains blocked by
    manipulation_model_qualified=false until gripper/TCP/contact/attached-object and pick/push
    hardware qualification is completed. The configured hash-verified home file is mandatory.
    The 2026-08-04 hardware preflight found the L515 disconnected, so no new physical mission or
    three-run end-to-end acceptance is claimed. Two real GUI-submitted failure-path missions were
    nevertheless completed: camera startup timed out as retryable SENSOR_UNAVAILABLE with zero
    captures and safe shutdown, and a second mission cancelled during that startup wait returned
    retryable CANCELLED in about eight seconds. Driver/vision children exited while the coordinator
    and RViz remained available; the arm was never enabled. This test exposed and fixed startup
    waits that did not previously observe action cancellation. The GUI now renders an editable
    target-label field, and its current-feedback home control no longer crashes on stale feedback
    because its math dependency is imported. The affected ROS packages rebuilt successfully;
    343 ROS/GUI/driver/Tesseract tests passed with one intentional skip, all 28 isolated GPU-worker
    tests passed, installation verification passed, and both core/compact rootless Tesseract
    qualifications returned PASS with real_arm_motion=false.
  live_recovery_update_2026_08_04: >-
    After the L515 was replugged, a GUI-submitted mission at rough target [0.4,0,0]
    acquired the green cube on its first settled look. The frame visibly contained
    red-stick occlusion, but the acquisition semantic result reported zero obstacles;
    the workflow reused that result and entered SCAN_READY. The first one-view scan
    then selected a large coverage-first move whose collision-free joint interpolation
    turned the camera off the target. Stale obstacle telemetry caused a safe hold before
    capture. The distinct RETURN_HOME recovery was repaired at the bridge, obstacle,
    speed-policy, runtime-refresh and tracking-gate boundaries, then physically reached
    the configured pose with maximum measured error 0.022172 rad and feedback-confirmed
    all six motors disabled. At that stage scan planning limited each automatic next direction to a
    20-degree target-centred frontier; the later distinctive-feature revision widened only
    the planning frontier to 45 degrees. The executor still densely rejects any scan path
    leaving the 20-degree optical cone or approaching within 0.22 m of the measured
    target. Workflow SCAN_READY now requires a new dedicated heavy request plus an exact
    request-ID/image-stamp-matched 3D obstacle scene; acquisition evidence cannot serve
    as the occlusion probe. Physical testing is paused until the operator explicitly
    authorizes it again.
  live_e2e_update_2026_08_04: >-
    After authorization resumed, four GUI-submitted [0.4,0,0] runs exercised the
    powered startup and failure teardown. Two startup defects were found and fixed:
    normal energized holds no longer call the terminal cancel service, and the
    zero-view startup RETURN_HOME transaction no longer requires acquisition or
    obstacle telemetry. Its startup_home_static authority is request/hash/evidence
    bound through worker, bridge and executor, and is accepted at both approval and
    runtime gates. The final physical run normalized to configured home, locked the
    green cube on acquisition look 1, ran a fresh correlated occlusion probe, then
    rejected one unsafe unknown-depth foreground occluder. It automatically returned
    home, proved hold, feedback-disabled all six motors, stopped driver/camera/GPU/
    hand-eye/Tesseract/scan children, and left coordinator, GUI and RViz ready.
    The real overlay shows multiple red sticks substantially covering the cube;
    contact removal remains intentionally unavailable until the gripper/contact model
    is qualified. A successful 13-capture clear-scene run is still outstanding.
  live_recovery_update_2026_08_06: >-
    A clear-scene GUI retry found two concurrently running target-scan coordinators.
    Both accepted the same action goal and started duplicate disabled driver and vision
    generations; their startup then crossed the enable boundary before the duplicate was
    stopped. Exact process-group cleanup, the documented motion-output 0xFC zero-offset
    role, one single 5-percent saved-home MoveJ, a 0.00145-rad home proof, and the
    feedback-confirmed disable handshake recovered the arm; direct CAN then reported six
    false enable flags and normal CAN-control status. The supported mission launcher now
    owns a lifetime OS singleton lock. Coordinator SIGINT is converted to mission cancel,
    and launch grants the bounded home/hold/disable/child-cleanup path 180 seconds before
    TERM escalation. The next single-owner run found a separate startup-home
    runtime defect: measured J3 was +0.001169 rad, only 0.000169 rad beyond the
    former feedback tolerance, and the mission ignored the executor's ABORTED
    state while waiting for success. Controlled recovery again reached home and
