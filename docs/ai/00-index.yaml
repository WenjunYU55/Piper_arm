ray_review_population_scoped_capture_fix_2026_09_02:
  behavior: Ray Review clears captured ray IDs when upgrade_population resets bootstrap geometry, because numeric ray IDs are scoped to one population. Candidate and highlighted L515 glyphs are restricted to active non-culled rays, while the capture event continues to display its recorded camera evidence.
  incident: In gui-sim-6793acc66c66452f95501bda64334b39 bootstrap ray 123 was captured near the target, then qualified ray 123 reused the number with a 1.64 m representative standoff. The viewer incorrectly carried captured ID 123 across the population reset and rendered the qualified representative as the old capture.
