schema_version: 1
document: ai_context_index
bounded_multiway_reconstruction_and_timestamped_board_validation_2026_08_21:
  behavior: Offline reconstruction may jointly refine overlapping capture poses with a bounded multi-view GICP pose graph. Every pair and every optimized camera pose remains subject to the existing 20 mm and 5 degree residual-correction limits; auto mode selects a refinement only when it materially improves measured structural evidence over robot-pose TSDF.
  replay: scan_20260821_220003 improved from 39.5 percent dominant-component support and 3.97 mm p90 plane residual under robot poses to 90.5 percent and 2.25 mm under bounded multiway refinement, but its 58.8 x 52.9 x 48.3 mm OBB still fails the 35 mm cube reference and remains diagnostic only.
  calibration: Fixed-board validation now looks up base-to-camera TF at the exact image timestamp. New 17 mm square and 12 mm marker samples are required before solving a replacement calibration; no existing calibration file is overwritten or deployed automatically.
  boundary: Offline reconstruction and read-only operator-triggered calibration validation only. No capture, NBV, Tesseract, motion, home, shutdown, ROS interface or physical command changed.
gui_mesh_detail_control_2026_08_21:
  behavior: The command-free Reconstruction Validation tab exposes a bounded 0.5-through-3.0 mm TSDF mesh-voxel slider. Default remains 1.0 mm; smaller voxels permit more extracted mesh polygons and the exact selected voxel is persisted in the existing quality report configuration.
  boundary: The control changes only the manual offline GUI reconstruction command. It does not change capture pixels, confidence qualification, input-cloud/GICP downsampling, registration policy, automatic deferred reconstruction, NBV, Tesseract, ROS interfaces or robot behavior.
  safety: The GUI does not expose 0.1 mm because surface polygon count grows approximately with inverse voxel area and cannot repair missing or misregistered geometry. The quality summary continues to show vertices, triangles, registration residual and component coherence.
  validation: GUI command and report tests cover the default, fine bound, invalid values and displayed voxel provenance; GUI and helper lint pass.
raised_virtual_support_plane_2026_08_21:
  incident: Supervised task gui-sim-d77550972be14f9ca55b27e206ccbfd0 made physical table contact during the generation-seven ray-NBV motion, then stopped when J5 feedback reached 1.225615 rad. The nominal zero-metre support plane plus five-millimetre holder margin was not conservative enough for the installed physical boundary.
  correction: Raise floor_z_m consistently from 0.000 to 0.005 m in both executor dense validation and the Tesseract collision manifest. Retain the independent 0.005 m holder/L515 clearance, producing a 0.010 m minimum model height above nominal base_link z zero.
  qualification: Software FK proves the exact configured PRE_HOME through ROUGH_HOME through STORAGE_WRIST route still clears the raised plane; its tightest modeled holder point is 0.040637 m, leaving 0.035637 m over the virtual plane and 0.030637 m beyond the required clearance.
  boundary: No NBV score, target estimate, capture, speed, joint limit, home endpoint, ROS interface or attached-tool envelope changed. Physical requalification is blocked until the operator has safely recovered and inspected the arm.
prospective_twenty_frame_capture_2026_08_21:
  behavior: After a settled capture request, scan_capture_node collects exactly 20 new synchronized native L515 depth/confidence/camera-info frames while the achieved pose is held, then applies the existing confidence-qualified per-pixel median. Pre-request frames cannot count. One exact SAM-mask/RGB pair remains the semantic reference.
  implementation: The capture service has its own callback group and waits on the native-frame condition while image and diagnostic callbacks continue. The internal collection limit is five seconds, below the unchanged executor capture timeout; fewer than 20 frames fails without writing or incrementing coverage.
  removed: The failed trailing-window implementation that forced 20 frames to precede one frozen mask timestamp, plus its added expired-mask/stale-quality recovery classifications.
  boundary: No NBV, Tesseract, motion, home, disable, public ROS interface or capture-quality threshold changed.
  status: software_qualified_no_further_physical_test_run_this_turn
one_millimetre_target_geometry_2026_08_21:
  behavior: Schema-2 capture retains native confidence-qualified target depth without spatial downsampling. The accepted refined /piper/target_cloud model now uses pixel_stride 1 and 0.001 m target voxels. Offline TSDF defaults to 0.001 m voxels with a 0.005 m truncation band. The scene cloud remains coarse and NBV coverage remains 0.005 m.
  boundary: Target-cloud display/model density and offline mesh resolution only. No capture count, mask/confidence threshold, NBV scoring, Tesseract, motion, home, disable, shutdown or public ROS interface changed.
  status: software_qualified_supervised_E2E_pending
partial_safe_frontier_reconstruction_2026_08_21:
  contract: Offline TSDF retains the ordinary 8-through-24 feature-complete input rule by default. The deferred gateway, which accepts only SUCCEEDED plus safe_shutdown and a matching tracked-base-home report, and the explicitly operator-selected command-free GUI diagnostic route admit immutable 1-through-7 capture datasets as PARTIAL_VIEW_SET; zero captures and more than 24 remain rejected.
  quality: Partial admission never implies a good model. A partial result cannot receive overall PASS, every report remains visual-review-required, and the durable mesh job is SUCCEEDED only for measured PASS or WARN. A generated mesh with overall FAIL becomes a durable FAILED job while retaining mesh/hash/report diagnostics.
  environment: Gateway, GUI and reconstruction/setup_environment.sh now share reconstruction/.venv. System-Python fallback remains possible only when the isolated executable is absent.
  calibration: Mission startup hashes the exact PIPER_HAND_EYE_CALIBRATION file used by the hand-eye child and passes that identity into every future frame and manifest. Historical immutable datasets with no identity require the existing explicit diagnostic flag and remain DIAGNOSTIC_ONLY.
  replay: scan_20260821_185143 generated a 615-vertex 719-triangle diagnostic mesh from three views. The actual GUI Build and Validate control regenerated and displayed it and opened the 3D viewer. It correctly reports PARTIAL_VIEW_SET, DIAGNOSTIC_ONLY and overall FAIL because dominant-component support is 70.4 percent and the mesh is not watertight.
supervised_ray_nbv_e2e_2026_08_21:
  result: Task codex-e2e-20260821-185113-adaptive completed SUCCEEDED with three accepted GOOD/CLEAR captures, safe_shutdown true, configured pre-home rough-home and storage-wrist proof, feedback disable, and exact mission-child cleanup.
  dataset: datasets/active_scan/scan_20260821_185143
  integration_repairs: [final-SAM-mask coherent target-depth selection, low-rate capture diagnostic callback isolation, full-pool exclusion before bounded ray shortlisting, typed attempted-ray planning-budget exhaustion, adaptive completion after a proved safe-view frontier is exhausted]
  completion_rule: Normal measured-feature completion still uses the existing 8-through-24 quality window and side/span/convergence diagnostics. A distinct terminal branch may complete after at least one persisted accepted achieved view only when typed RAY_FRONTIER_EXHAUSTED proves that every prequalified ray in the current generation has been attempted safely; ordinary timeout, generic planning failure, worker failure, or one failed shortlist cannot become success.
  unchanged: [ROS interfaces, motion speeds, capture thresholds, target confidence, Tesseract IK collision path and visibility checks, home stages, disable order, process ownership]
  reconstruction_note: The durable mesh job remains queued for the authentic tracked-base-home signal. A command-free replay generated a diagnostic mesh but correctly failed quality; the immutable missing calibration identity keeps this historical dataset DIAGNOSTIC_ONLY.
ray_shortlist_exhaustion_handoff_2026_08_21:
  behavior: A failed ray_nbv Tesseract batch retires only the ray IDs actually attempted for the current session and accepted-capture count, then MissionEngine requests the next bounded shortlist. A committed capture changes the generation and clears that feasibility cache.
  boundary: The bridge owns the temporary Tesseract-feasibility cache; accepted coverage remains planner-owned. Legacy and voxel policies retain terminal TESSERACT_EXHAUSTED behavior. No ROS schema, speed, motion, capture, home or shutdown rule changed.
  live_evidence: Task codex-e2e-20260821-175620-rayfix retained 160 of 175 rays and accepted three captures, then exposed the old one-shortlist terminal bug. It proved pre-home, rough home, storage wrist, disable and owned-process cleanup.
  software_validation: The final implementation passes 722 complete mobile tests and 131 complete Tesseract tests; both affected packages build. The supervised task codex-e2e-20260821-185113-adaptive physically proved successive shortlist retirement through genuine full-frontier exhaustion and safe mission completion.
ray_workspace_intersection_cull_2026_08_21:
  behavior: Every target_ray must have at least one permitted standoff point inside the configured coarse camera workspace before it may enter the bridge/Tesseract shortlist. The test uses the complete bounded interval, not only the representative scoring point.
  workspace: {base_link_camera_radius_m: [0.20, 0.75], camera_target_distance_m: [0.25, 0.80], maximum_target_relative_height_change_m: 0.40}
  boundary: This is a cheap ray-only prequalification. It does not affect legacy or voxel exact points, does not claim IK/collision feasibility, and does not change Tesseract, executor, motion, safety, capture, home, shutdown or public ROS interfaces.
  validation: 108 focused workspace/NBV/bridge tests, 716 complete mobile tests and 125 complete Tesseract tests pass; five ROS packages build and changed-file ament lint passes. Registered functional tests pass with only the unchanged historical 68 flake8 and 14 pep257 findings.
exchangeable_nbv_policy_boundary_2026_08_21:
  contract: legacy and voxel_nbv keep exact-point geometry; ray_nbv alone uses frozen target rays with bounded standoff expansion. The selected policy is validated and frozen when the mission stack starts, so a GUI edit applies only to the next mission.
  useful_gain_floor: Authoritative voxel_nbv and ray_nbv reject candidates below 0.02 normalized predicted marginal information after accepted-only coverage scoring. Seed, shadow and legacy paths are unchanged; raw pixel count cannot bypass the floor.
  ray_feasibility_bound: The bridge hands at most six information-ranked ray directions to Tesseract and keeps every preferred then reserve standoff probe for one ray contiguous before the next ray. Exact-point voxel_nbv retains its existing twelve-candidate bound.
  ownership: The planner owns policy validation, coverage scoring and the useful-gain floor; the bridge owns bounded handoff and ray expansion; the worker alone owns IK, collision, path and visibility feasibility.
  interfaces: No public ROS topic, service, action, message, speed, safety, capture, home or shutdown contract changed.
  validation: 117 focused boundary tests, 711 complete mobile tests, 125 complete Tesseract tests, 112 root GUI/reconstruction tests with one hardware skip, and 32 isolated AI-worker tests pass. Five ROS packages build. Registered functional tests pass; colcon test retains only the documented historical 68 flake8 and 14 pep257 findings, while every changed implementation file passes focused ament flake8 and pep257.
tesseract_stream_feedback_pacing_2026_08_21:
  incident: A collision/visibility detour at 15 percent accumulated 0.310360564 rad command lead because the wall-clock sender kept advancing endpoint-style MoveJ targets while feedback lagged.
  correction: Keep the exact Tesseract path, 20 Hz active schedule, 15 percent command speed, 0.05-rad step and 0.30-rad corridor. When the current or next target exhausts the corridor, freeze schedule time on the last safe setpoint; resume after feedback catches up or abort after the unchanged one-second grace.
  boundary: Direct MoveJ chords, planning, collision validation, NBV, capture, home, disable and public interfaces are unchanged.
target_local_depth_occlusion_repair_2026_08_21:
  incident: A settled workflow probe mislabeled a closer table/shadow crescent below the cube as unsafe because 81 pixels touched a six-pixel mask dilation despite zero target overlap or envelope intrusion.
  correction: Synthetic closer-depth components now require the existing 20-pixel support minimum inside the target-mask bounding envelope. Crossing components retain full geometry; semantic obstacle handling and downstream fail-closed safety are unchanged.
  status: Recorded-frame replay and focused/isolated perception tests pass. Supervised tasks after the repair passed the clear-scene probe and accepted multiple captures without recreating the adjacent-table false occluder.
selectable_camera_profile_restoration_2026_08_21:
  contract: GUI saves one validated RGB profile for the next L515 startup; no public ROS action field or live camera mutation is introduced.
  profiles: [640x480 at 15 or 30 FPS, 960x540 at 15 or 30 FPS, 1280x720 at 15 or 30 FPS, 1920x1080 at 15 or 30 FPS]
  default: 640x480 at 30 FPS; normal depth remains 640x480 at 30 FPS and low-bandwidth depth remains 320x240 at 30 FPS.
terminal_home_stage_proof_repair_2026_08_21:
  issue: A PRE_HOME shortcut inside the old 0.30-rad band incorrectly set the ROUGH_HOME proof flag, so cancellation could jump directly to STORAGE_WRIST.
  repair: Configured-home endpoint and settling acceptance is now 0.20 rad, while the separate exact-first-point post-disable limit allowance remains 0.30 rad. PRE_HOME, ROUGH_HOME and STORAGE_WRIST proofs are independent.
  validation: 114 focused mission/configuration tests pass; supervised staged-home requalification remains pending.
frozen_viewpoint_ray_pool_2026_08_21:
  goal: Keep frozen-ray NBV separately selectable from both legacy and exact-point voxel NBV so timing and physical behavior can be compared without parallel planning implementations.
  geometry: ray_nbv freezes the configured ray_count once from the first qualified base_link target lock. target_sector reproduces the former 180-degree 25-by-7 region at count 175, upper_hemisphere covers 360 degrees above the target, and full_sphere covers 360 degrees above and below using deterministic equal-area samples. Each ray has a 0.28 m minimum standoff, a preferred band through 0.50 m, and a maximum capped by both the target base-link radius and the existing 0.80 m scan maximum.
  handoff: The planner scores one representative point per ray against accepted-only cumulative coverage and removes normalized predicted gain below 0.02. The bridge shortlists at most six rays before expanding each ray into contiguous preferred then reserve exact standoff probes for unchanged exact-aim and Tesseract feasibility checks. Exact-point voxel_nbv retains twelve candidates.
  static_scope: Tracking does not translate or regenerate the ray pool during this phase. Accepted captures update coverage; a rejected achieved ray is retired without adding coverage; actual settled FK remains the next motion start.
  acquisition_failures: Five absent closed-loop looks return TARGET_NOT_FOUND with rough base_link XYZ. A fresh correlated semantic mask with sufficient masked depth entirely beyond 1.20 m returns retryable TARGET_TOO_FAR and REPOSITION_REQUIRED with rough base_link XYZ. Both use normal mission shutdown.
  selectable_policies: {legacy: original heuristic exact points, voxel_nbv: cumulative-information ranking over the regenerated exact-point lattice, ray_nbv: cumulative-information ranking over one frozen bounded-ray pool}
  gui: Atomically saves view_selection_policy, ray_sampling_region and ray_count only for the next mission. Current saved selection is ray_nbv full_sphere with 175 rays.
  interfaces: No ROS topic, service, action or message schema changed; ray identity and diagnostics are additive private JSON/provenance fields and encoded existing viewpoint IDs.
  physical_status: The ray policy completed task codex-e2e-20260821-185113-adaptive with three accepted views and safe shutdown. Comparative legacy/voxel timing and repeated-mission qualification remain separate.
normalized_marginal_nbv_diversity_repair_2026_08_20:
  incident: Task codex-e2e-nbv15-20260820-230803 committed six captures in scan_20260820_230845, but every post-seed accepted view remained at 65 degrees elevation, achieved only 53.6 degrees azimuth span, and satisfied neither Y-side floor.
  cause: The voxel scorer compared raw projected unknown-pixel count before novel surface and angular novelty. Recorded replay ranked every 75-degree direction before all lower elevation bands, so Tesseract received steep leaders and selected reachable neighboring 65-degree poses.
  correction: Candidate gain is now the fraction of projected target pixels that are either unknown or known surface not yet observed from that direction. Accepted-view angular novelty breaks equal fractions, then absolute marginal pixels and travel. No fixed movement schedule or Y/elevation sequence was added.
  boundary: Candidate generation, immutable accepted-only coverage, twelve-view bridge shortlist, Tesseract feasibility, capture acceptance, tracking, motion, home and shutdown remain separately owned and unchanged.
  evidence: Focused upstream/downstream tests pass 118 of 118; the complete mobile and Tesseract functional suites pass 685 and 117 tests; 60 driver functional tests, 101 repository tests with one hardware skip, and 30 isolated AI-worker tests pass. The five-package build and both command-free rootless Tesseract suites pass. Registered colcon functional tests pass; its only failures are the documented package-wide historical 68 flake8 and 14 pep257 findings, while every changed file passes focused lint. Offline replay of all six accepted frames changes the top twelve from the steep 75-degree band to ten 15-degree and two 25-degree candidates spanning both azimuth extremes. Physical qualification is pending.
supervised_e2e_tracking_and_shortlist_repair_2026_08_20:
  task: codex-e2e-tracking-20260820-2106
  result: Startup, target lock, exact-aim seed motion, one GOOD/CLEAR capture and staged home/storage/disable/cleanup succeeded. Generation-one planning failed TESSERACT_EXHAUSTED because all twelve shortlisted global/sector candidates failed IK.
  correction: Live valid-measurement gaps reached 3.8868 seconds, so the stationary tracker now retains prediction for five seconds with 0.01 process noise and uses base measurement noise for innovation gating. The twelve-view bridge shortlist preserves six global information leaders from broad direction sectors, five mid-elevation sector alternatives and one nearest informative continuity candidate while retaining NBV rank attempt order.
  proof: Focused 100 tests and wider 400 tests pass; five ROS packages build; all functional colcon tests pass. An offline replay includes nearby candidate 585 and rootless exact-aim Tesseract finds thirteen collision-qualified IK goals for it.
  physical_status: A second supervised mission proved startup again but correctly stopped before NBV because the saved probe frame contained an operator hand beside the cube. A third clear-scene task codex-e2e-clear-20260820-223207 committed three captures, exercised true voxel_nbv and safe staged shutdown, but achieved only 15.9 degrees azimuth before tracking failed. Candidate diagnostics proved the old shortlist spent nearly every attempt in 75/65-degree IK-infeasible bands; the mid-elevation shortlist correction is software-validated and remains physically unexercised.
target_tracking_measurement_repair_2026_08_20:
  scope: depth_to_3d_node.py plus target_tracker_node.py only; NBV, Tesseract, capture coverage and mission sequencing are unchanged.
  contract: A fresh, frame-correlated, nonempty semantic target mask is mandatory for Target3D. Missing, stale, malformed or empty masks publish an invalid measurement reason and never fall back to rectangular ROI depth.
  filter: The one authoritative base_link tracker uses a near-static Kalman model with process noise 0.01, confidence-scaled correction noise and a Mahalanobis innovation gate using base measurement noise 0.02. Rejected or unavailable measurements cause bounded prediction-only output; lost_timeout_s 5.0 expires and resets the track.
  deferred: Slowly evolving, internally consistent SAM2 mask drift may still pass the measurement contract and remains a separate perception investigation; do not hide it in NBV or add another estimator.
tesseract_model_readiness_repair_2026_08_20:
  symptom: A seed plan exhausted the automatic 45-second budget before candidate one because first-use Robot.from_files model construction occurred inside the post-enable request budget.
  correction: The isolated Tesseract backend constructs one clean unused robot scene before publishing worker-ready. Requests reuse that scene only while no request-local obstacles have been added; an obstacle-bearing request marks it dirty and forces reconstruction before the next request. Scene setup is bounded by the unchanged bridge timeout but no longer consumes the unchanged candidate-planning budget.
  unchanged: [45-second automatic plan budget, three-second segment budget, 180-second bridge timeout, collision model, candidates, motion and public interfaces]
  physical_evidence: GUI task gui-sim-3eb814caa9204bfd884343f02a94323e loaded the worker model before readiness, planned and executed seed view 412, and committed capture one. The earlier candidate-zero timeout did not recur.
post_view_reacquisition_routing_2026_08_20:
  symptom: A true generation-one voxel NBV was rejected by the strict final-aim gate, then the mission exhausted a duplicate generic readiness wait while tracking was LOST instead of reaching the existing command-free plan-request reacquisition path.
  correction: After accepted, visually rejected, or target-drifted views, MissionEngine directly re-enters the command-free planning loop. The existing request/approval adapters remain the sole bounded visual-reacquisition owners, and no motion occurs before normal approval safety gates.
  unchanged: [initial multiview readiness proof, visual reacquisition timeout, approval gates, target and obstacle safety, motion, shutdown]
  physical_evidence: After capture one in task gui-sim-3eb814caa9204bfd884343f02a94323e, tracking dipped and the mission entered the command-free typed reacquisition route. It failed only after that authoritative bound with TARGET_NOT_FOUND, then proved safe staged shutdown.
capture_refresh_single_flight_repair_2026_08_20:
  symptom: A settled capture revalidation request was discarded when an autonomous SAM2/GroundingDINO job already occupied the single-flight worker, causing capture timeout before any seed capture could commit.
  correction: heavy_refresh_bridge_node.py retains the one correlated pending request and queues it exactly once when the worker and a qualifying fresh frame are available. The executor treats waiting_for_worker as nonterminal and remains bounded by the existing capture timeout.
  unchanged: [public ROS interfaces, worker concurrency, capture retry count, capture timeout, motion, home, disable, perception algorithms]
post_implementation_scope_audit_2026_08_20:
  result: The global NBV repair retains the requested behavior without a new manager, state store, ROS interface, worker, estimator, coverage implementation or configuration system. The existing component owners remain authoritative.
  simplification: Removed capture-layer recovery recommendations, planner-wide counters copied through the Tesseract request, discarded PlanAuthorizer failure tags, duplicate heavy-refresh state, unused camera-planning state and unused rejected-view joint snapshots. Stage-local diagnostics and every observed-bug regression remain.
  boundaries: {target_estimate: target_tracker_node.py, accepted_coverage_and_gain: nbv_coverage.py plus scan_viewpoint_planner_node.py, motion_feasibility: piper_tesseract_foxy/worker.py, capture_acceptance: scan_capture_node.py, capture_recovery: capture_coordinator.py plus scan_viewpoint_executor_node.py, achieved_physical_pose: scan_viewpoint_executor_node.py}
  interface_change: none
global_nbv_target_aim_repair_2026_08_20:
  goal: Restore a genuinely global one-capture/one-coverage-update/one-NBV-decision loop without coupling target estimation, information gain, Tesseract feasibility or capture recovery.
  correction: The planner ranks the complete configured target-centric region against cumulative committed voxel coverage; the bridge shortlists twelve information-ranked candidates without the former 6-to-30/30-to-45-degree movement frontier; Tesseract tries exact target aim first and at most one hash-bound fallback within five degrees; the executor records settled FK even when capture is rejected and performs exactly one correlated heavy refresh for a transient visual rejection.
  target_estimation: Qualified component pixels now determine camera X/Y/Z together, camera-frame EMA across eye-in-hand motion is removed, and the existing timestamped base_link constant-velocity Kalman tracker remains the sole filtered target estimate with confidence, ordering and jump gates.
  reconstruction_boundary: Accepted capture geometry remains fixed at its capture-time base_link transform. A changing filtered target estimate affects only future candidate position, target-facing aim and drift validation.
  regression: Recorded scan_20260820_142919 proves the old arm achieved its requested orientation within 0.04 degrees but that request missed the capture-time qualified target by 13.424 degrees. The repaired five-degree final gate rejects that observation and replans from its actual achieved FK.
  software_validation: [660 mobile functional tests pass of which 622 are registered colcon targets including the recorded replay, 110 Tesseract tests pass, 101 repository GUI/reconstruction/calibration tests pass with one hardware-dependent skip, all five ROS packages build, command-free rootless Tesseract core PASS, command-free rootless Tesseract compact PASS, 16 changed Python files pass flake8, all changed production Python files pass pep257, 11 AI YAML files parse, git diff check passes]
  known_nonfunctional_test_debt: Full mobile colcon test remains red only in package-wide flake8 and pep257 targets with 68 and 14 historical findings outside this repair; all 622 registered functional tests pass.
  physical_status: Supervised runs prove startup, seed capture, generation-one voxel_nbv selection/execution, strict final-aim rejection, command-free post-view reacquisition routing, and safe terminal home/storage/disable/cleanup. Complete feature-diverse scan acceptance remains blocked by target-tracking instability and is not claimed.
post_startup_joint6_range_repair_2026_08_20:
  symptom: GUI mission gui-sim-a09aa6ae47f44c88a458d142a80c2289 completed STARTUP_WRIST, ROUGH_HOME and rough target acquisition, then the first multiview MoveJ made no measurable progress because J6 remained at logical 0.083090 rad while the accepted plan requested 2.483482 rad.
  cause: Positive-only startup correctly retained a raw +2pi controller turn, but controller qualification stopped at 365 degrees. Adding the retained turn to the valid logical scan target produced raw 502.293 degrees, above that limit; the driver test suite covered ready zero and negative storage but not a positive post-startup scan target.
  correction: Qualify and prove a 545-degree positive controller limit, which covers the retained 360-degree turn plus the complete ordinary logical +180-degree endpoint with five degrees margin. Logical J6 remains exactly [-pi,+pi], startup remains positive-only, storage remains decreasing, and commands above the qualified raw boundary now fail before CAN transmission.
  validation: [60 focused J6 tests pass, 62 full piper tests pass with one copyright skip, 643 mobile functional tests pass, 106 Tesseract tests pass, five-package Foxy build passes, rootless core PASS, rootless compact PASS, 11 AI YAML files parse]
  physical_status: Software-only correction; no arm, CAN or camera command was issued. A supervised low-speed positive-J6 waypoint and terminal storage/disable are still required before full E2E.
nbv_bridge_debug_crash_repair_2026_08_20:
  symptom: GUI mission gui-sim-6e0cbcd372594740a38c824a6301f43e reached a valid rough-acquisition proposal, then timed out approving it and reported CONTROL_UNTRUSTWORTHY after the home executor disappeared.
  cause: The NBV generation/provenance integration called an undefined TesseractPlanBridge.param_bool method from two debug-only paths. With debug true, the bridge crashed after publishing the valid plan; launch correctly treated that critical-child exit as authority loss and stopped the scan stack.
  correction: TesseractPlanBridge now implements the same ROS boolean-parameter adapter used by the other production nodes. A regression executes the generation receipt and debug log path that previously raised AttributeError.
  validation: [34 focused bridge tests pass, 106 complete Tesseract tests pass, 643 complete mobile-manipulation tests pass, 23 GUI policy/client tests pass, five-package Foxy build passes, rootless core PASS, rootless compact PASS]
  physical_status: Software-only repair; all nodes and all six motors remain off. A supervised E2E is still required.
previous_generation_reconciliation_2026_08_20:
  symptom: A later GUI goal failed CONTROL_UNTRUSTWORTHY because the in-process supervisor still had live handles owned by the preceding mission generation.
  cause: Terminal home or disable proof could return NEEDS_OPERATOR before non-command perception/planning groups were released; the next admission treated every survivor identically.
  correction: Terminal operator-recovery now revokes mission authorization and stops only exact mission-owned vision, hand_eye and tesseract_worker groups. A later admission may retry cleanup of exact stored prior-generation handles when no driver is live, or when fresh typed feedback proves all six motors disabled. A live driver without that proof remains a hard stop.
  physical_status: Software-only; no process was signalled and no arm command was issued during implementation.
voxel_nbv_generation_handoff_2026_08_17:
  goal: Prevent a closed-loop mission from requesting Tesseract against the previous accepted-capture generation and retain diverse feasible directions when top-ranked poses fail IK.
  incident: GUI mission gui-sim-25a675652af94bada5674f130c967d4a made two accepted captures, then failed NO_REACHABLE_PLAN because voxel rebuild/ranking took about 12 seconds while the bridge correctly expired its one-second old scan snapshot.
  solution: The planner labels every output with immutable session/policy/generation readiness; the reachability filter preserves it; the bridge publishes a receipt only after caching that exact generation; MissionEngine waits for a post-barrier matching receipt before requesting a plan. Tesseract freshness remains unchanged.
  diversity: The bounded authoritative-NBV shortlist reserves information leaders from distinct 30-degree azimuth/elevation sectors, retains mid-elevation sector alternatives plus one nearby continuity candidate, and remains sorted by NBV rank so the worker selects the highest-information feasible view.
  provenance: /piper/tesseract_plan_provenance binds the selected policy, accepted-view generation, candidate ID, NBV rank and predicted gain to plan_id; scan_capture_node persists that exact binding in each frame metadata file.
  physical_status: Software verified only after the incident; a new supervised E2E is required.
gui_viewpoint_policy_selector_2026_08_17:
  goal: Let the operator select the existing legacy or voxel-NBV viewpoint policy without duplicating planner logic in the GUI.
  boundary: piper_gui_native.py changes only view_selection_policy, ray_sampling_region and ray_count in the source scan_planning_params.yaml through piper_gui/scan_policy.py. MissionEngine still owns startup and starts a fresh scan stack which reads those parameters; the GUI does not change a running stack, action schema, planning, safety, retry, motion, or shutdown behavior.
  selectable_policies: [legacy, voxel_nbv, ray_nbv]
  ray_regions: [target_sector, upper_hemisphere, full_sphere]
  current_saved_policy: ray_nbv
  validation: [test_piper_gui_scan_policy.py, test_piper_gui_phase8.py]
current_change_2026_08_17:
  goal: Simplify mission shutdown and executor runtime gates without changing public ROS, numerical motion, perception, TF/calibration or scan-trajectory contracts.
  authoritative_files: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/mission_engine.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_viewpoint_executor_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/safety_evaluator.py]
  result: MissionEngine is the sole mission/shutdown state machine; all owned failures attempt freshly qualified staged home unless current motor authority is lost; autonomous startup and terminal shutdown no longer issue redundant hold-service commands; executor runtime gates use one immutable named policy instead of interacting boolean switches; obsolete frozen mission copies and duplicate shadow safety evaluator are removed.
  safety_boundary: Direct home still requires fresh finite joints, current all-six motor authority, exact configured stage/target, stage direction/change policy, holder/L515 external clearance, progress, convergence and settle proof. Confirmed motor authority loss remains the only automatic no-command route.
  requalification: Software-only until all tests/build/command-free planning qualifications pass, then supervised physical staged-home/failure shutdown testing is required.
