  invariants: [legacy behavior remains default, immutable artifacts and hashes remain unchanged, confidence and semantic support cannot expand, unavailable or uncorrelated native evidence fails closed, native and legacy outputs never overwrite each other, no ROS camera CAN or arm process starts, mesh density or appearance never overrides quality]
