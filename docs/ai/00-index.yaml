    stopped. The live obstacle projector previously performed a blocking
    exact-time TF lookup even when the SAM2 ID image contained no obstacle IDs.
    Target-only frames now publish their explicit empty clear scene before TF;
    actual obstacle IDs retain full timestamped TF/depth projection. The
    focused 142-test suite, full 390-test ROS/Tesseract suite, package rebuild
    and both command-free rootless qualifications pass. Another physical retry
