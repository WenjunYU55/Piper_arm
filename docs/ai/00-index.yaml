  outputs: Every reconstruction writes the untouched extracted TSDF as an adjacent raw mesh, the filtered copy at the existing mesh path, and an adjacent full-resolution measured-points PLY containing every accepted temporally averaged target-depth point transformed by the selected refined camera pose. Capture-index colors are diagnostic only. The command-free GUI exposes Open Raw, Open Cleaned and Open All Capture Overlays controls plus an optional measured-point mesh overlay. Current constrained explicit or auto-candidate reports additionally enable Open Superposition Overlay for every full capture after constrained transforms and Open Consensus Points for the reduced robust cross-view means. Selecting a dataset also loads any existing report and keeps FAIL-quality outputs inspectable; rebuild success is not required for visual diagnosis.
  quality_boundary: Registration selection and structural quality continue using pre-filter component coherence. Retained corroborated splits remain MULTIPLE_MEASURED_TARGET_COMPONENTS and structural FAIL. Cleanup cannot convert fragmented evidence into a false quality pass, and dimensions, residuals, watertightness and visual review remain authoritative.
  replay: On scan_20260821_220003, captured support was reduced from 197 components and 10764 triangles to one 9742-triangle component; offline-resegmented support was reduced from 176 components and 9862 triangles to one 8545-triangle component. Both outputs remain FAIL because the retained surface is still distorted or incomplete.
