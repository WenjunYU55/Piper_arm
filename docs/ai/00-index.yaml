  boundary: No NBV, Tesseract, motion, home, disable, public ROS interface or capture-quality threshold changed.
  status: timeout_repair_software_qualified_physical_retest_deferred
  latest_incident: Task gui-sim-8733327f74f3455eb8656f01a6ceb66d accepted its first 20-frame burst in 1.03 seconds, then a later burst received 18/20 before the former fixed five-second limit and caused DEADLINE_EXPIRED. Staged pre-home, rough home, storage, disable and cleanup passed. The operator deferred another physical E2E after the timeout repair.
one_millimetre_target_geometry_2026_08_21:
