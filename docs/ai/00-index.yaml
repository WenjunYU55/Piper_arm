    sources only Foxy plus the canonical PiPER workspace, verifies exact package prefixes, imports
    scan_capture, and checks the recovery schema before starting children. The canonical packages
    rebuilt; 79 focused tests and both core and compact-start rootless qualifications pass. A live
    proposal-only restart then queued a fresh [0.33,-0.14,0.0] rough hint and returned valid
    hardware-qualified plan 4f8fc210be5b17a9: three six-joint camera-facing viewpoints, 443 points,
    trajectory hash 50534f4fedae546b76f3690c524e8b9aa18e122c40186156b0f626c015020f35,
    and real_arm_motion=false. The executor reached PROPOSAL_READY, scan_capture stayed graph-live,
    and /joint_ctrl_single retained zero publishers. No approval was submitted, the disabled arm did
    not move, and every temporary validation process was stopped afterward. No planner, collision,
    limit, command, or J6 behavior changed.
    On 2026-07-27 the acquisition/scan handoff was split at the measured-lock and SCAN_READY
    boundary. scan_target_acquisition now starts the workflow only; the GUI owns the explicit fresh
    MULTIVIEW_SCAN request and the separate exact scan confirmation. A 2026-07-29 live 5-percent
    acquisition showed that timed_movej_v2 sent 7281 tiny targets even though PiPER MoveJ consumes
    only joint positions and one aggregate speed; its qdot/qddot fields were not controller inputs.
    That endpoint-only adapter later completed a 13-view physical run, but could not preserve an OMPL
    detour. On 2026-08-11 it was superseded first by tesseract_stream_v1, then v2 and
    tesseract_stream_v3. The current worker retains every collision-checked OMPL/ISP source vertex,
    samples each source segment at 20 Hz from J1-J5 5 rad/s and J6 3 rad/s multiplied once by the
    selected percentage, retains a 0.05-rad hard joint-step ceiling, and hashes
    every timestamped position. Foxy publishes intermediate arm-only targets without waiting at each
    one, guards measured following error at 0.30 rad, and feedback-gates only the final endpoint.
    Overdue multi-sample schedules abort rather than burst or shortcut. Configured home remains the
    exact two-point direct exception. qdot/qddot stay exact-zero transport placeholders.
    The driver caches unchanged MotionCtrl_2 mode/speed, never emits GripperCtrl for six-position
    automation commands, and continues sending every JointCtrl target. A historical v1 50-percent mission
    physically executed acquisition and 24 accepted scan views without a logged
    scheduled-stream overrun, then completed direct staged home and safe shutdown. It failed the
    independent feature-completion gates at 113.5 degrees azimuth and without measured convergence.
    The measured-lock handoff
    now uses the authoritative TrackedTarget/TrackingHealth/LOCKED tuple in both acquisition and
    workflow Step 4; target_landmark remains diagnostic. That physical execution result belongs to
    v1. V3 still lacks deliberate cancel and staged physical acceptance; 200 focused
    tests pass and both rootless collision qualifications pass with
    real_arm_motion=false, including the blocked-midpoint detour and 0.15-rad/s J6 five-percent timing regression. The
    2026-07-24 5-percent run remains historical evidence for the former stop-per-sample executor.
    No current evidence qualifies 100-percent following dynamics.
    A live 2026-07-27 100-percent ROUGH_ACQUISITION run then triggered the unchanged sustained
    following-error hold before ACQUIRED even though perception subsequently reported a valid
    settled measured lock; the workflow stayed IDLE and Step 4 remained disabled. The GUI now lets
    explicit Step 4 use direct fresh TrackingHealth to bootstrap its stopped GUI-owned worker/scan
    stack when necessary, wait for the workflow's authoritative measured-lock assessment, adopt that
    independently fresh lock, start the workflow, wait for SCAN_READY, and request a new separately
    approved scan plan. The 2026-07-27 targeted suite passes 104 tests. This recovery has
    build/unit validation only;
    it does not qualify 100-percent dynamics or convert the aborted acquisition into success.
    Later on 2026-07-27, two GUI starts on domain 42 exhausted approximately 125 GiB and the
    kernel OOM killer terminated the GUI, indirectly causing perception supervision to restart.
    GDB located the allocation in Foxy's rmw_dds_common ParticipantEntitiesInfo graph
    deserializer, not in Tesseract, perception, or an application topic. start_gui.sh and the
    supervised scan wrapper now load fastdds_gui_udp_only.xml, set
    RMW_FASTRTPS_USE_QOS_FROM_XML=0 to retain Foxy's native variable-size endpoint histories, force
    ROS_LOCALHOST_ONLY=0 so Foxy cannot re-enable shared memory, and restrict their UDP transport to
    127.0.0.1. A bounded live Step-1 regression held the GUI at 71.5 MiB peak,
    started all scan processes, preserved both GPU worker PIDs, produced no new OOM, issued no
    approval or motion, and cleaned up every temporary GUI-owned process.
    Later on 2026-07-27, scan_target_acquisition exited during startup and its service disappeared
    while the scan launch parent remained alive, producing GUI service timeouts before Step 3. The
    startup/acquisition boundary is now explicit: the ROS interface is one atomic
    PrepareAcquisition session request; schema-v5 and both typed plan messages carry
    source_request_id; the worker writes an atomic 0.5-second heartbeat; the bridge publishes fresh
    acquisition and multiview readiness with blockers; the bridge and reachability filter keep one
    stable subscription per input rather than mutating DDS entities on stale callbacks; and every
    critical scan child shuts down the launch parent on exit. Step 1 is successful only after both
    owned parents, required services/nodes, worker heartbeat, acquisition readiness, and sole
    executor publisher are proven. Step 2 remains disabled otherwise, retries only the exact same
    typed request once after timeout, and ignores a plan from another session. The three affected
    packages rebuilt, 58 focused stability tests and a 143-test wider suite passed, both rootless
    qualifications returned PASS, and a 12-second isolated proposal-only launch kept all critical
    nodes alive until intentional shutdown. This repair issued no approval or physical arm motion;
    repeated live restart and current tesseract_stream_v3 hardware acceptance remain pending.
live_bounded_scan_aim_update_2026_08_06: >-
  GUI mission scan_20260806_220358 physically proved the 7.5-degree grid and
  command-free plan-snapshot recovery by persisting seven hash-valid GOOD/CLEAR
  records, but it still terminated below the distinctive-feature floors: two
  +Y views, zero -Y views, 46.0 degrees azimuth and 10.7 degrees elevation.
  All 36 next exact target-centred wrist poses lacked finite bounded
  collision-free IK, predominantly at link2/link5. The mission then reached
  configured home directly from current feedback, feedback-disabled all six
  motors, stopped every owned child and reported safe_shutdown=true while the
  coordinator, GUI and RViz remained live. Replay from the exact final measured
  joints, camera FK and cube position showed the camera positions themselves
  are usable: preserving the achieved optical direction inside a 12-degree
  target cone made the previously rejected compact 195/202.5/210-degree
  candidates pass production OMPL, dense collision clearance, target
  visibility and trajectory conversion. Automatic closed-loop requests now
  keep each coverage-ranked camera position but spherically bias its exact
  request-bound look direction toward the measured current optical axis by at
  most 12 degrees. The executor's independent dense 20-degree boresight and
  0.22 m standoff gates, worker IK/collision/path checks, 36-candidate bound,
  achieved-FK coverage accounting and the then-current 13-24 feature-completion
  policy remained unchanged. Seventy focused tests and 440 broad functional regressions pass
  with one intentional skip; both affected ROS packages rebuilt successfully.
  Full physical feature-diversity validation remains pending.
live_obstacle_tf_runtime_recovery_update_2026_08_06: >-
  GUI mission scan_20260806_223343 passed startup, measured lock, a dedicated
  CLEAR probe and two GOOD/CLEAR captures, then one exact-stamp obstacle TF
  lookup miss produced an invalid instance while view three was moving. The
  executor treated that one transport sample as permanent geometry and aborted.
  Its terminal text was prefixed with ABORTED, so the coordinator's intended
  fresh-scene current-state-home exception did not match and left the arm enabled
  in hold with every child alive. The obstacle node now requires three seconds
  of continuous TF failure before recreating its listener, a transform/stale-data
  invalidity is held as bounded missing/stale telemetry rather than a physical
  obstacle, and terminal classification recognizes the complete wrapped reason.
  Persistent or semantic/unqualified geometry remains fail-closed. A GUI recovery
  validated the direct current-to-home path, reached home within 0.000384 rad,
  proved a current hold, received disable true, and stopped the exact stranded
  children while preserving coordinator and RViz. Full rebuilt E2E confirmation
  and distinctive-feature coverage remain pending.
