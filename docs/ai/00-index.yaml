single_transaction_capture_admission_2026_09_03:
  incident: Task gui-sim-8bcbf207e665452cb53fc55e9f9d2657 completed one capture and later failed after ten recorder service calls with QUALITY_REJECTED scan quality is stale. The quality publisher was configured at one second but commonly arrived every 1.198 through 1.201 seconds, creating unavoidable stale windows against the unchanged one-second admission age. Each transient failure consumed an executor retry and restarted capture preparation.
  physical_retest_finding: Task gui-sim-c3b12771f2904e53beee6b5b57ade26f saved three captures and proved the one-call deadline, but capture four exposed that freezing the newest mask before proving its exact RGB-D partner can select a raw colour frame dropped by the recorder synchronizer. That historical frame can never arrive later, so the transaction correctly timed out but could not select an older valid matched mask.
  correction: One capture service call owns one absolute deadline, waits internally for transient quality occlusion and execution evidence, collects one prospective 20-frame native-depth burst, then selects the newest cached SAM mask whose exact RGB-D partner is already present and whose timestamp overlaps that burst. Only that proven mask/RGB-D pair and burst are frozen for bounded future-TF preparation, followed by one final atomic diagnostic admission and commit. A terminal CAPTURE_EVIDENCE_TIMEOUT cannot enter the legacy ten-attempt caller loop.
  unchanged: [one-second quality and occlusion freshness, GOOD minimum score and target-valid gate, CLEAR or qualified labelled-occlusion policy, 20-frame confidence-qualified median, RGB-D and TF correlation, atomic file commit, executor authorization and safety, planner backends, robot commands, real-motion default]
  validation: [132 focused capture failure and executor tests pass after the correlated-pair correction, 946 complete mobile tests pass with one environment skip, 174 complete Tesseract tests pass, 67 ordinary cuRobo tests pass with 11 opt-in GPU skips, mobile package build and AI YAML parse pass, separately authorized physical E2E pending]
population_scoped_visual_ray_quarantine_2026_09_03:
  incident: After accepted capture five in task gui-sim-ba4d94fcc94543db833e9cad2bfe5792, cuRobo repeatedly selected ray 84. Motion completed, but achieved aim repeatedly missed the unchanged five-degree capture gate by 0.014 through 0.255 degrees. Rejected history recorded ray 84 while ray policy intentionally ignored all rejected poses, so the same ray immediately returned.
  correction: Every new visual rejection records whether it belongs to the bootstrap or qualified ray population. The ray planner quarantines that exact ray for the complete lifetime of that population, preserves the special first-capture same-ray farther retry, and lets the existing bridge shortlist promote untouched reserve rays. Accepted captures do not revive failed qualified rays; only the explicit bootstrap-to-qualified population replacement or a new session releases them. Permanent capability and endpoint culls plus accepted-direction retirement remain separate and monotonic. Planner and reachability adapters also pause redundant multiview work while the existing generic MotionPlanStatus is PLANNING, then resume from the same frozen survivor and reserve population.
  unchanged: [five-degree first-capture aim, selected later-view aim tolerance, NBV scores and ray population, six-ray shortlist and reserve ownership, permanent hard culls, capability and exact collision checks, authorization, runtime safety, capture admission, Tesseract and cuRobo worker behavior, PiPER command path, real-motion default]
  validation: [343 focused ray session executor mission bridge and hard-cull tests pass, 939 complete mobile tests pass with one environment skip, 174 complete Tesseract tests pass, 67 ordinary cuRobo tests pass with 11 opt-in GPU skips, piper_mobile_manipulation symlink build passes, command-free incident survivor replay removes ray 84 across later accepted counts and retains reserve rays 97 and 105, bootstrap-ID-reuse regression passes]
curobo_attached_tool_clearance_2026_09_03: Every cuRobo acquisition and multiview candidate is now checked against the same complete CAD-derived camera-holder/L515 floor and obstacle envelope used by the common executor; invalid goal-set winners are removed and planning continues.
current_gui_layout_2026_09_03: The Automatic Scan tab is hosted in a width-fitted vertical scroll area so every unchanged mission control remains reachable on displays shorter than the tab's requested content height.
curobo_start_reentry_and_runtime_snapshot_fix_2026_09_02:
  incident: Task gui-sim-dab21abe7e10480fa545076a47a82a5a completed its first capture, then cuRobo rejected measured Joint 6 at 3.136623084 rad because it was 0.000030430410 rad outside cuRobo's intentional 0.005-rad internal inset while remaining 0.004969569590 rad inside the authoritative raw limit. The same run retained a 7.5 MB ray report; full TelemetryStore snapshots took a 125.08 ms median inside a nominal 50 ms command interval.
  correction: The ROS-free cuRobo adapter admits only raw-limit-valid encoder-scale excursions no farther than the existing 0.005-rad boundary allowance, constructs a monotonic inward transition with at most 0.00025-rad steps, and requires dense current-world plus self-collision qualification before normal planning. The executor now takes one coherent runtime-only telemetry snapshot per control tick and excludes planner plans, scan history and ray diagnostics from that hot path.
  unchanged: [authoritative raw joint limits, cuRobo internal limit inset, world and self collision checks, plan identity and start correlation, 20 Hz point order and timestamps, common execution validation, PlanAuthorizer, runtime freshness drift following-error cancellation and shutdown gates, Tesseract, PiPER command path, real-motion default, no automatic fallback]
  validation: [39 focused pure cuRobo adapter tests pass, 154 focused telemetry and execution tests pass, 1100 complete mobile and Tesseract tests pass with 1 skip, 64 ordinary cuRobo tests pass with 11 opt-in skips, 11 of 11 pinned real-GPU tests pass command-free, both ROS packages build, runtime snapshot benchmark median 0.082 ms versus 125.08 ms full snapshot on the recorded 7.5 MB ray report, physical E2E confirmation pending]
capture_admission_and_stream_load_fix_2026_09_02:
  incident: Task gui-sim-b907776f874c4fce831228fd3b7a64aa persisted view 001 with GOOD 0.9606 quality and 0.9985 valid-depth ratio, but a transient stale-mask pulse changed live occlusion from CLEAR to LOST between the final recorder gate and metadata serialization. The executor correctly rejected the contradictory success response. During the preceding selected view, a 205-point 10.25-second cuRobo schedule took 69.10 seconds at 3.0 Hz while repeated accepted-generation NBV and reachability work continued in parallel.
  correction: Scan capture freezes quality and occlusion together under one lock at the final commit admission and carries that exact evidence into frame metadata and the Trigger result. The viewpoint planner and reachability filter now quiesce redundant MULTIVIEW_SCAN generation work only while an already-approved view or capture transaction is active; queued scan generations use depth one and next-view or replacement planning resumes from fresh target/history evidence.
  unchanged: [20 Hz planner timestamps, every approved trajectory point and order, no burst or shortcut, following-error and runtime gates, capture quality and occlusion thresholds, NBV ranking and candidate population, Tesseract and cuRobo adapters, PiPER command path, real-motion default]
  validation: [264 focused capture planner reachability executor and scheduling tests pass, 923 complete mobile tests pass with 1 skip, 174 complete Tesseract tests pass, 60 ordinary cuRobo tests pass with 10 opt-in GPU skips, mobile package build passes, physical 20 Hz multiview confirmation pending]
  subsequent_timing_finding: Generation quiescence removed avoidable concurrent planning, but a later recorded-payload profile isolated repeated complete TelemetryStore deep copies as the remaining primary command-loop bottleneck; the newer curobo_start_reentry_and_runtime_snapshot_fix entry supersedes the timing diagnosis without changing this capture fix.
