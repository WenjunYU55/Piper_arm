project:
  name: Piper_arm
  purpose: Bounded closest-first multi-target eye-in-hand RGB-D rough-target acquisition, open-vocabulary tracking, occlusion assessment, adaptive feature-gated 8-to-24-view capture, and guarded sequential low-speed scan execution for an AgileX PiPER arm with Intel RealSense L515.
  runtime: Ubuntu 20.04; ROS 2 Foxy; ROS nodes on Python 3.8; isolated Grounded-SAM-2 workers on Python 3.10+.
  operator_home_acceptance_2026_08_16: >-
    Configured PRE_HOME, ROUGH_HOME and STORAGE_WRIST remain direct
    ExecuteHomeStage/native MoveJ operations; they never call the Tesseract
    worker. At the operator's direction, each J1-J6 configured-home endpoint
    and successive-sample check now uses a 0.3-rad allowance for one second.
    Startup and final current-position hold still publish and require an
    acknowledgement, fresh finite feedback and trusted all-six motor status,
    but their former 0.005-rad position-window proof is no longer a mission
    gate. The GUI now exposes a shutdown-only pre-home recorder, displays that
    pose, and preserves pre-home whenever rough/ready or storage J6 is edited;
    the prior buttons could silently erase it. No physical motion was run for
    this software change.
  startup_j6_transaction_reset_2026_08_16: >-
    Live task gui-sim-db1f2698f7c74951a83b9d229d875a49 exposed an
    incomplete STARTUP_WRIST lifecycle defect. After the explicit disable,
    disabled wrist relaxation fell from the retained 3.647663-rad high-water
    mark toward 3.006090 rad; the still-active direction watchdog repeatedly
    issued DisableArm(7) and defeated later Commissioning Enable attempts.
    A proved explicit disable or a direction-watchdog trip now clears the
    incomplete J6 target, raw/logical wrap state and direction high-water.
    Focused driver and mission tests plus the affected package build pass; no
    physical retest was run and the complete stack remains off.
  startup_wrist_executor_scope_reintegration_2026_08_16: >-
    E2E task gui-sim-904111b0d41b48a6bd16a10d3c29f538 exposed a partial
    reintegration regression after J6 reached its qualified startup wrap
    bridge: the executor still measured progress against stale pre-enable
    J1-J5 targets, declared no progress with a 0.056274344-rad J2 residual,
    and then requested PRE_HOME while the driver correctly retained
    STARTUP_WRIST authority. The current branch now restores the archived
    stage scope. Authenticated STARTUP_WRIST refreshes J1-J5 from one fresh
    measured sample at each command boundary, evaluates progress/convergence
    and settling from J6 only, and publishes no redundant hold between
    STARTUP_WRIST and ROUGH_HOME. Every other direct-home and scan transaction
    remains six-joint checked. The failed mission made zero captures and
    reported NEEDS_OPERATOR with safe_shutdown=false; supervised physical
    requalification remains required.
  gripper_diagnostic_boundary_2026_08_16: >-
    tools/debug_piper_gripper.py is the single-owner direct-SDK diagnostic for
    CAN IDs 0x159 command and 0x2A8 feedback. Single-owner testing measured fresh
    200 Hz feedback at the physically closed aperture (-0.210 mm), with no
    reported gripper faults. A raw-CAN-correlated closed-target pulse transmitted
    exactly disable 0x02, enable 0x01 and disable 0x02; feedback became enabled,
    remained enabled for a separate five-second observation, and returned to
    disabled/zero effort. No later overriding command was observed. Homing status
    remained false. The production arm-enable path still sends one
    ENABLE command at 0 mm and 1.0 N m after all six arm motors enable; no
    behavior was changed. A supervised production-path test enabled all six arm
    motors, opened J7 from 0.28 mm to 9.66 mm at 0.5 N m, then closed on a soft
    object at 4.48--4.76 mm and sustained about 1.04 N m for five seconds without
    faults. Final disable produced status disabled and zero effort. This proves
    powered position control and holding; the reported softness was the unloaded
    closed-target condition, not failed J7 torque. Homing status remains false,
    so automatic zeroing remains prohibited and the absolute aperture datum still
    needs separate manufacturer-procedure review.
  powered_j5_dropout_incident_2026_08_11: >-
    GUI task gui-sim-be1e6cd0d5e1419e9b4397261a530fd7 persisted 12
    GOOD/CLEAR captures in scan_20260811_144903, but remained one-sided
    (+Y 3, -Y 0; 61.48-degree azimuth; 22.60-degree elevation) and exhausted
    the former 150-second one-view worker budget. This did not cause the motor
    failure: at 1786456440.439, about 93 seconds before planning timed out, the
    low-speed J5 driver-enable flag independently became false while the other
    five axes remained enabled. The driver's existing 200 Hz fail-closed
    watchdog then disabled the remaining axes. Old coordinator code later
    attempted direct home despite the already-disabled arm, made no progress,
    and returned CONTROL_UNTRUSTWORTHY. The operator manually homed the arm and
    no further arm command was issued. PiperStatusMsg now exposes feedback
    validity, every motor enable flag, parsed per-motor faults and the watchdog
    reason. The mission and executor continuously require fresh all-six-enabled
    proof during powered motion. A partial state or any motor fault immediately
    revokes motion authority; terminal cleanup sends no hold, home, storage or
    disable command, waits read-only for the driver's all-six-disabled proof,
    stops owned processes and returns NEEDS_OPERATOR with safe_shutdown=false
    because configured home was not autonomously proved. Automatic one-view
    MULTIVIEW_SCAN requests now use a 45-second internal budget and three-second
    OMPL attempts; manual/batch requests retain 150/5 seconds. Four affected
    packages build, 218 focused tests pass, 452 broad functional tests pass
    with one skip, and both command-free rootless qualifications pass. The
    physical cause of the spontaneous J5 dropout remains unresolved and must
    be inspected before another supervised mission. After the operator's
    manual home, stale mission-owned scan, planning, perception, camera,
    hand-eye and driver groups were stopped without any ROS arm command. A
    direct piper_init=false read-only CAN sample then proved six false motor
    flags, no per-motor faults, arm err_code zero and live feedback. The stale
    pre-fix coordinator was then stopped while no mission was active and
    replaced by the rebuilt coordinator. /target_scan_mission and RViz are
    resident; driver, camera, perception, planning and command-publisher
    children remain absent and no camera device has an owner.
  startup_j6_direction_incident_2026_08_11: >-
    The authorized GUI mission gui-sim-ef30b4cc466f488ba1331d08b6432d34
    passed disabled preflight and a separate no-command enable/disable smoke
    produced 583 consecutive all-six-enabled, fault-free typed samples. During
    STARTUP_WRIST, the saved -3.139536232-rad storage branch commanded
    increasing J6 toward zero. After about +0.091 rad, J6 reported
    collision_status and driver_error_status. The continuous motor guard
    immediately revoked authority; no hold/home/storage/disable command was
    issued afterward, the driver watchdog proved all six axes disabled, every
    mission child stopped, and the result was NEEDS_OPERATOR with zero captures
    and safe_shutdown=false. Five later piper_init=false samples showed all six
    disabled, no faults, err_code zero and J6 -3.105395 rad. The operator later
    corrected the direction interpretation: increasing controller J6 from the
    negative storage branch toward zero is the intended startup motion, and
    terminal storage is its decreasing inverse. Schema-v3 therefore binds
    startup_wrist_direction=increasing, storage_wrist_direction=decreasing,
    and negative storage J6 -3.139536232 rad. The mission validates the
    measured signed J6 branch before enable and refuses a positive non-ready
    start. Schema-v2 profiles remain diagnostic-only. The earlier positive-
    branch/decreasing repair was based on the mistaken direction report and is
    superseded. The prior J6 collision/driver-error containment evidence
    remains valid, but it no longer proves that increasing direction was
    wrong. The rebuilt GUI and
    coordinator then ran task gui-sim-a19ebc603a124a12b37e73ee8527a8c9
    against the current negative branch under the now-superseded gate. It
    reached preflight, issued no enable request or motion command, rejected the
    branch with CONTROL_UNTRUSTWORTHY,
    stopped all children and reported safe_shutdown=true because the arm
    remained disabled. A final direct read showed six false flags, no faults
    and J6 -3.126426 rad. A later direct SDK diagnostic plus five raw 0x2A7 CAN
    frames independently reported J6 -2.860630 rad (-163.902 degrees), all
    motors disabled and no faults; RViz had zero live /joint_states_single
    publishers and was not feedback authority. The corrected negative-storage
    current schema-v4 profile hash is 9cd1f62264699e86f047c1bfe0010d10084d3b6b239df17de7386b5b2f18fb66.
    Two affected packages build, 145 focused tests and 428 complete
    mobile/Tesseract tests pass, and both command-free rootless suites prove
    startup delta +3.139536232 plus storage delta -3.139536232. Coordinator
    and RViz remain resident and idle.
  joint5_contact_incident_2026_08_11: >-
    During terminal homing after GUI scan task
    gui-sim-d30410e05b9c405cb48e969fa818c173, the installed camera-holder/L515
    assembly contacted the table/floor and joint 5 disabled with
    motor_overheating, driver_overcurrent, collision_status,
    driver_error_status and stall_status feedback. The ten persisted
    GOOD/CLEAR views in scan_20260811_124232 and their viewpoint planning are
    retained as valid scan evidence; this is a homing/execution safety incident,
    not a viewpoint-diversity defect. All six motors were subsequently proved
    disabled and every hardware/mission process was stopped except RViz. No
    fault clear, re-enable, home motion or other physical test is authorized
    until the mechanism/table contact and J5 are inspected and the operator
    explicitly reauthorizes motion. Exact CAD-derived link6 envelope center
    [-0.029750002,0,0.0375] m and size
    [0.1395,0.10572671,0.053] m now receive a mandatory 0.005 m support-plane
    and external-obstacle clearance check in both worker and executor, including
    direct home. The dedicated-home marker still exempts the intentionally
    folded robot from robot self-collision evaluation; it never exempts the
    attached camera assembly from external clearance. Driver enable/disable now
    proves all six FOC flags, rolls a failed partial enable back to all-disabled,
    and a 200 Hz watchdog disables every axis on persistent partial enable or
    any per-motor FOC fault. Software-only focused and rootless qualification
    regressions pass; physical acceptance is blocked by inspection. A fresh
    read-only five-sample CAN inspection on 2026-08-11 found can0 ERROR-ACTIVE,
    all six driver-enable flags false and arm err_code zero, but J5 still
    latched motor_overheating, driver_overcurrent, collision_status,
    driver_error_status and stall_status. This does not pass the powered-test
    gate and no enable or motion was attempted.
  joint6_limit_update_2026_08_10: >-
    The operator corrected the controller-coordinate J6 range to exactly
    [-pi,+pi]. Driver and GUI fallbacks, scan kinematics, production
    Xacro/generated URDF/CSV, Tesseract qualification fixtures and regressions
    now use that same range. The old measured J6 JSON record remains invalid,
    so it cannot override the new fallback. The observed approximately 0.04 rad
    neutral discrepancy was attributed to the controller's persistent J6 zero
    write, not TF or a software command offset. At 18:18 local time the operator
    completed the guarded physical-neutral write; a subsequent independent
    three-second read-only diagnostic reported J6 exactly 0.00000 rad in every
    sample, disabled, with no faults. One hundred fifty-seven focused tests,
    check_urdf, four affected package builds, and both command-free rootless
    Tesseract qualifications pass. The full-turn endpoints and new neutral still
    require supervised low-speed physical qualification before powered mission use.
  staged_home_profile_validation_2026_08_10: >-
    The operator recorded schema-v2 rough/ready [0,0,0,0,0.399345492,0]
    and storage J6 -3.139536232 rad. Hash, schema and hard limits pass. Dense
    diagnostics show the conservative L515/cable envelopes overlap the base and
    link envelopes during the intentional mechanically supported storage fold.
    The operator confirmed this resting contact corridor is intentional and
    directed that configured homing must reach the recorded joints without
    collision planning. Dedicated zero-capture RETURN_HOME requests now emit
    exactly the measured start plus one direct configured target for
    CONFIGURED_HOME, STARTUP_WRIST, ROUGH_HOME or STORAGE_WRIST and carry an
    explicit hash-bound collision_validation_bypassed marker (robot
    self-collision only) and the exact
    configured_home_goal_positions_rad through worker, response, bridge and
    executor. This original worker-routed form is historical; the current
    mission-authorized ExecuteHomeStage/native MoveJ path does not call the
    worker and does not require camera, tracking, workflow, obstacle-topic or
    controller-limit-hash health. Hard limits, fresh finite feedback, current
    all-six motor authority, exact configured endpoint and stage direction,
    aggregate speed, endpoint convergence/settling, feedback disable and
    owned-child cleanup remain mandatory. The controller retains the final
    proved endpoint until immediate disable; no separate hold service is called.
    CAD-derived camera-holder/L515
    support-plane and external-obstacle clearance is never bypassed. The
    exception cannot enter
    acquisition, scan, manipulation or an implicit multiview return. The exact
    persisted profile now passes both command-free rootless suites. A first
    supervised run physically proved storage-to-ready J6 motion at five percent,
    then exposed and stopped on two validation defects before rough-home motion.
    The operator disabled the arm and paused physical testing; complete staged
    acceptance remains due after explicit reauthorization. After authorization
    resumed, GUI mission gui-sim-db30606e55a54e0a9711d9758a175342 proved
    STARTUP_WRIST, ROUGH_HOME, a controllable-failure direct ROUGH_HOME,
    STORAGE_WRIST, stable hold, six disabled flags and exact owned-child cleanup.
  automatic_one_view_contract_2026_08_10: >-
    GUI task gui-sim-c0bec4ab3ddd4550b666bb0d6889f3c2 proved relaxed disabled
    storage startup, STARTUP_WRIST, ROUGH_HOME, a look-two measured cube lock,
    correlated CLEAR evidence and complete direct terminal home/disable/cleanup.
    Its first automatic scan failed before capture because the worker planned an
    unused collision-checked contingency home through the intentional storage
    fold. Schema-v5 now hash-binds include_return_home: automatic min=max=1
    MULTIVIEW_SCAN requests require false and contain exactly one capture
    segment, while manual batch retains true and its contingency home. Dedicated
    RETURN_HOME remains a separate exact two-point robot-self-collision-exempt,
    externally-clearance-checked transaction.
    The correction passes 194 focused and 441 full tests, both affected builds
    and both command-free rootless qualifications; physical retry is pending.
    It then exposed an acquisition runtime-refresh state bug: a transient
    motion-limit hold discarded first-look bootstrap_static authority and waited
    for obstacle data that intentionally does not exist before observation. The
    recovery state now preserves the interrupted plan's exact scene authority.
    The following authorized retry, gui-sim-345df21ee3d14d959b15a006f38a758c,
    acquired the measured cube, passed the correlated clear occlusion probe and
    persisted three GOOD/CLEAR RGB-D/mask captures before the fourth moving
    multiview segment held on stale obstacle telemetry. SAM2 target masks and
    RGB-D projection remained live; only the target-only obstacle heartbeat
    stopped. The live obstacle projector previously performed a blocking
    exact-time TF lookup even when the SAM2 ID image contained no obstacle IDs.
    Target-only frames now publish their explicit empty clear scene before TF;
    actual obstacle IDs retain full timestamped TF/depth projection. The
    focused 142-test suite, full 390-test ROS/Tesseract suite, package rebuild
    and both command-free rootless qualifications pass. Another physical retry
    showed that this producer optimization was correct but not the complete
    cause: gui-sim-1d2081729e6d42e18e2fa5eb73da80a9 lost the target mask under
    motion blur, SAM2 deliberately entered WAITING_FOR_SEED and stopped all
    instance-ID output. The executor then held safely and completed direct
    rough/storage home, disable and cleanup. Because SAM2 is not a dynamic
    safety scanner, a fresh valid collision-qualified obstacle scene is now
    frozen only for the one exact approved MULTIVIEW_SCAN MOVING segment. A
    newly received blocked/invalid scene still stops immediately, and every
    next target still requires a fresh scene after settling. Focused 144-test
    and full 392-test suites, rebuild and both rootless qualifications pass; a
    new physical retry remains required.
  physical_capture_clock_recovery_2026_08_10: >-
    GUI mission gui-sim-2f877e11e30549c3a3ee26f918726864 reached the first
    scan endpoint and entered CAPTURING_RGBD. A transient L515 global-time
    remap then reported a camera stamp 0.554 seconds in the future against the
    0.500-second limit. This now commands a current-pose hold and permits up to
    30 seconds for the watchdog-owned full vision restart; capture and resume
    still require fresh healthy clock authority. During the old terminal
    recovery, powered J3 feedback briefly read +0.002460 rad at its inclusive
    zero boundary, beyond the former 0.002-rad readback allowance. Direct
    DisablePiper required 13 attempts and proved six false flags/no faults;
    exact task children were stopped. The feedback-only allowance is now
    hard-capped at 0.005 rad, still far below the operator-permitted 0.3-rad
    proof tolerance and the 0.025-rad plan-start window. Planned and commanded
    targets remain inside exact limits. Focused 145-test and full 392-test
    suites, rebuild and both rootless qualifications pass.
    A later disabled preflight measured J6 -3.173270 rad after the configured
    -3.139536232-rad storage target relaxed under power-off, 0.031677 rad past
    -pi with all six enable flags false and no faults. The operator's earlier
    0.3-rad proving allowance is now isolated to the exact first measured point
    of a hash-bound direct RETURN_HOME stage. Ordinary feedback remains capped
    at 0.005 rad and every planned/commanded goal remains strictly in-limit.
    The contract, worker, response validator and executor enforce that scope;
    191 focused and 438 complete tests, both package builds and both command-free
    rootless qualifications pass. A supervised physical retry remains required.
  camera_tf_datasheet_registration_2026_08_10: >-
    The operator confirmed that the current camera-holder and L515 rendering in
    RViz matches the physical assembly and is therefore the mechanical source of
    truth. The deployed session_20260808_straight_mount calibration_result.yaml
    retains the raw PARK solution under mechanical_registration but now deploys
    a datasheet- and device-factory-registered link6-to-camera_color_optical_frame
    transform. Intel Rev 003 defines the depth origin 4.5 mm behind the front
    cover glass and its X-Y origin at the IR transmitter. Device f1120648 reports
    colour-to-depth translation [0.0002000813,-0.0141312284,0.0042248368] m and
    a 1.322466-degree relative rotation. The earlier registration incorrectly
    combined the RGB X-Y centre with the recessed depth Z plane. The corrected
    l515_visual depth origin is [0,0,-0.008224997] m with straight housing-normal
    axes; composing the factory extrinsic places colour optical at
    [-0.0002000813,0.0141312284,-0.0040001602] m. This maps to link6 translation
    [-0.0781312284,-0.0002000813,0.0399998398] m and preserves the legitimate
    factory RGB/depth axis skew. On 2026-08-10 the operator measured the physical
    ChArUco board as 17 mm squares and 12 mm markers; every preserved August 8
    sample and board-derived report instead records 18 mm and 13 mm. Those PARK,
    held-out and fixed-board metric results are wrong-scale provenance only, not
    validation evidence and not a deployable rollback. The active mechanical
    registration does not depend on board scale. A new read-only TF overlay and
    corrected-scale five-pose stationary-board validation passed on 2026-08-10;
    mean/worst drift was 5.73/12.22 mm and 0.87/1.25 degrees against 15 mm and
    1.5 degree limits. The fixed board is the stationary metric target, so its
    five distinct stable base_link recoveries satisfy the remaining target
    repeatability check and physical_revalidation is passed. Semantic cube
    tracking repeatability remains an acquisition acceptance test.
    Offline validation passes: all architecture/calibration YAML parses, ten
    robot-description tests, four calibration-bound model-builder tests, ninety-nine
    scan-motion tests, check_urdf, all three affected ROS package builds, and both
    rootless core/compact Tesseract qualifications with real_arm_motion=false.
  camera_holder_model_update_2026_08_09: >-
    The physical gripper's permanent wrong-way-round installation is represented by
    a 180-degree Z rotation on the fixed link6-to-gripper_base joint; joint6 and its
    controller coordinates remain unchanged. The supplied millimetre camera-holder
    mesh remains a visual-only fixed gripper branch. Its nominal datum is the close
    12 mm arm-anchor pair, while the user-locked visual placement retains a -4 mm
    holder-frame Z trim and must not be moved. The holder's ordered 180-degree X then
    180-degree Z mesh correction is unchanged. The converted millimetre L515 STL is a
    second visual-only fixed branch. Its two 40 mm-spaced rear screw axes align
    transversely with the matching holder axes while retaining the operator-confirmed
    +2.5 mm axial seating trim; its child origin is camera_holder [0.1, 0, 0] m.
    The centred 61 mm camera body nests in the installed upper ring and uses a contrasting
    silver RViz material so it remains visible inside the black holder. Neither detailed mesh
    owns planning collision authority. The confirmed CAD housing placement plus
    the Intel depth datum and device factory extrinsic constrain the mechanically
    registered optical TF while RealSense still owns its internal
    camera_link-to-optical edges. The qualified conservative L515 housing/mount/cable
    envelopes remain unchanged. Ten
    robot-description tests, four model-builder tests, twenty-three acquisition
    tests, all three affected package builds, check_urdf, and both rootless
    core/compact qualifications pass with
    collision_model_qualified_for_hardware=true and real_arm_motion=false.
  hand_eye_calibration_update_2026_08_08: >-
    After the L515 was remounted straight, a new eye-in-hand solve used 12 fitting
    poses and three held-out poses with the board fixed near x=0.39 m in base_link.
    The saved samples model 18 mm squares and 13 mm markers, but the operator's
    2026-08-10 physical measurement is 17 mm and 12 mm. Consequently the PARK
    solution and all fitting, held-out and live five-pose metric results are
    retained only as wrong-scale provenance and must not be restored or deployed.
    The datasheet/factory-registered deployment in the same session file is
    independent of board scale. Its corrected-scale five-pose stationary-board
    validation passed on 2026-08-10 with 12.22 mm and 1.25 degree worst drift.
    Capture and validation now share exact 0.017 m/0.012 m defaults and persist
    those dimensions in new records.
    session_20260701_local remains rollback history,
    and the previously rejected analytical J6 compensation remains prohibited. The
    calibration-bound Tesseract model-builder tests passed 11/11 with the URDF mode-0
    regression, and both rootless core and compact suites requalified hardware collision
    planning with real_arm_motion=false.
  implementation_update_2026_08_04: >-
    The mission now binds an arbitrary sanitized target label/prompt through the action, gateway,
    GPU worker spool, heavy refresh, scan metadata, and durable result. Green cube retains its
    calibrated colour/aspect validation; other labels use the generic open-vocabulary profile with
    confidence and mask-support checks. Rough acquisition tries the centered look first, then the
    15-degree cardinal cone, and retains diagonal/compact candidates as reserves. Service-mode
    capture accepts only fresh GOOD quality at least 0.65 plus fresh CLEAR occlusion. A rejected
    pose is recorded but does not increment the accepted count; the autonomous mission holds and
    requests a replacement toward thirteen desired records, with at most eight replacements. It may
    finish below thirteen only after a correlated post-capture proof that no remaining distinct
    candidate has finite bounded collision-free IK. Fixed rectangular/radial/height workspace gates
    are disabled in the active path: Tesseract IK, joint limits, collision validation, current-state
    matching and executor runtime gates remain authoritative. Leaf/branch dry-run planning supports
    pick/place or outward push and pick placement requires a flat, dense, edge-supported, visibly
    clear patch from the accumulated base_link scene cloud. Real branch contact remains blocked by
    manipulation_model_qualified=false until gripper/TCP/contact/attached-object and pick/push
    hardware qualification is completed. The configured hash-verified home file is mandatory.
    The 2026-08-04 hardware preflight found the L515 disconnected, so no new physical mission or
    three-run end-to-end acceptance is claimed. Two real GUI-submitted failure-path missions were
    nevertheless completed: camera startup timed out as retryable SENSOR_UNAVAILABLE with zero
    captures and safe shutdown, and a second mission cancelled during that startup wait returned
    retryable CANCELLED in about eight seconds. Driver/vision children exited while the coordinator
    and RViz remained available; the arm was never enabled. This test exposed and fixed startup
    waits that did not previously observe action cancellation. The GUI now renders an editable
    target-label field, and its current-feedback home control no longer crashes on stale feedback
    because its math dependency is imported. The affected ROS packages rebuilt successfully;
    343 ROS/GUI/driver/Tesseract tests passed with one intentional skip, all 28 isolated GPU-worker
    tests passed, installation verification passed, and both core/compact rootless Tesseract
    qualifications returned PASS with real_arm_motion=false.
  live_recovery_update_2026_08_04: >-
    After the L515 was replugged, a GUI-submitted mission at rough target [0.4,0,0]
    acquired the green cube on its first settled look. The frame visibly contained
    red-stick occlusion, but the acquisition semantic result reported zero obstacles;
    the workflow reused that result and entered SCAN_READY. The first one-view scan
    then selected a large coverage-first move whose collision-free joint interpolation
    turned the camera off the target. Stale obstacle telemetry caused a safe hold before
    capture. The distinct RETURN_HOME recovery was repaired at the bridge, obstacle,
    speed-policy, runtime-refresh and tracking-gate boundaries, then physically reached
    the configured pose with maximum measured error 0.022172 rad and feedback-confirmed
