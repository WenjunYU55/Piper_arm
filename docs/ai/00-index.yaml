planner_backend_controlled_replay_2026_09_01:
  scope: Command-free same-request Tesseract 0.35.0.6 versus cuRobo 0.7.8 timing and feasibility replay plus additive future mission-phase efficiency diagnostics.
  artifacts: [benchmarks/planner_backends/recorded_reference_corpus.json, benchmarks/planner_backends/results/20260901_tabletop_controlled_replay/planner_benchmark.json, docs/experiments/planner_backend_benchmark.md, tools/create_planner_benchmark_corpus.py, tools/benchmark_motion_planners.py, tools/summarize_mission_efficiency.py]
  result: Both backends solved 15 of 15 recorded positive requests, rejected 3 of 3 blocked controls, and every successful path passed exact Tesseract revalidation. Median request wall time was 19.646 seconds Tesseract and 0.630 seconds cuRobo. The former 25.046 versus 25.048 second planning-plus-schedule proxy is retained only as historical pre-fixed-rate evidence and must be regenerated before current transport comparison.
