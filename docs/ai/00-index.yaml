curobo_fallback_aim_provenance_fix_2026_09_02:
  behavior: A selected cuRobo fallback look remains an allowed backend result, while MotionPlan now preserves the request candidate's original look_direction as nominal_look_direction and reports the selected fallback separately as look_direction with aim_fallback_used and aim_offset_deg.
  incident: gui-sim-6793acc66c66452f95501bda64334b39 reached three captures, then the worker selected an allowed fallback but built response provenance from a visibility-qualified copy whose look_direction had already been replaced. The generic validator correctly rejected the false nominal claim before motion.
  unchanged: [fallback eligibility and tolerance, ray and standoff selection, collision and visibility qualification, generic response validation, authorization, runtime gates, PiPER execution, real-motion default, no planner fallback]
  evidence: [new exact-first-fails fallback-selected regression, 32 complete ROS-free cuRobo adapter tests pass]
curobo_duration_diagnosis_2026_09_02:
  result: Controlled same-request replay proves slow cuRobo moves are candidate-path dependent rather than a universal command-rate fault. Two slow cases scheduled about 25.09 versus 5.40 seconds and 25.96 versus 2.35 seconds because cuRobo joint-space travel was roughly 4.6 and 9.1 times the Tesseract comparison; another case was 4.15 versus 4.05 seconds.
  decision: Do not accelerate a longer path beyond the shared five-percent MoveJ velocity contract. Future correction belongs in shortest qualified cuRobo IK and path selection, with exact collision visibility and generic execution validation retained.
curobo_fixed_rate_movej_transport_2026_09_02:
  behavior: cuRobo MotionGen vertices are now retained exactly and each native segment is resampled into whole 20 Hz PiPER MoveJ transport ticks. Tick count is the maximum required by native segment duration, the existing speed-scaled [5 5 5 5 5 3] rad/s MoveJ model, and the unchanged 0.05 rad adjacent-command ceiling.
  root_cause: The former adapter emitted only one to a few points per native segment and stretched each point timestamp to meet the velocity bound. Recorded 5-percent plans therefore claimed a 20 Hz contract while delivering about 4.2 to 4.4 Hz with 0.24 to 0.32 second target holds, producing visible stop-start motion.
  unchanged: [cuRobo collision-checked path geometry and source vertices, generic MotionPlan schema and hashes, common validation authorization runtime gates and TrajectoryRunner, PiPER JointCtrl and MotionCtrl mode, selected speed percentage, Tesseract output, real-motion default, no planner fallback]
  software_evidence: [1146 ordinary tests passed with 10 opt-in GPU skips, 10 of 10 pinned real-GPU tests passed command-free, recorded 5-percent acquisition emitted 384 points over 19.15 seconds at fixed 20 Hz with 0.007482 rad maximum adjacent change, recorded first multiview emitted 83 points over 4.10 seconds at fixed 20 Hz, both ROS packages built]
  required_followup: [repeat physical validation after any collision model execution transport mount calibration floor profile or safety-boundary change]
curobo_runtime_parity_qualification_2026_09_02:
  behavior: The selected-planner path now treats each prequalified target ray as a bounded set of capability-supported standoffs rather than only its representative point. cuRobo submits exact aim before fallback aim through one fixed 54-pose goal-set tensor, records the selected standoff and roll, applies a 90-second request and 3-second automatic-attempt budget, and returns generic PLANNER_EXHAUSTED with attempted ray IDs so the bridge advances to the next shortlist. Every camera-pose request uses the same fixed solver shape for the complete persistent worker generation.
  safety: >-
    The dedicated legacy RETURN_HOME planner request now uses the same
    manifest-authorized two-point direct-home exception as Tesseract: robot
    self-collision alone is bypassed, while raw joint limits, exact measured
    start binding and dense link6-mounted CAD-holder support-plane clearance
    remain mandatory. Production automatic missions continue to use the
    planner-independent ExecuteHomeStage path.
  reachability: One reachability batch freezes fresh arm-status admission evidence before processing its ray population. The one-second callback gate applies at admission and cannot expire merely because a 360-ray CPU loop takes longer than one second; a stale or invalid admission sample still rejects the entire batch and later planner/executor freshness gates are unchanged.
  command_free_evidence: [/tmp/piper_curobo_runtime_qualification_20260902_v3 completed acquisition four consecutive multiview transitions blocked control and return-home for both backends, cuRobo positive success 5 of 5, blocked rejection 1 of 1, generic return-home success, all 10 normal paths passed exact Tesseract revalidation, 1143 ordinary tests passed with 10 skips, 10 real GPU tests passed after adding the persistent acquisition-to-ray regression, no worker or CUDA process remained]
  unchanged: [mission and NBV ownership, generic ROS contracts, PlanAuthorizer, common execution validation and runtime gates, TrajectoryRunner, PiPER command path, real-motion default, no automatic planner fallback]
  remaining: [retain physical qualification evidence for the current supervised 5-percent scope, articulated sphere model remains non-conservative and is not collision-equivalent to Tesseract]
curobo_target_visibility_retry_2026_09_01:
  behavior: Every cuRobo MULTIVIEW_SCAN MotionGen success is now densely evaluated with the generated camera_optical_frame FK before it can become a generic MotionPlan. The worker applies the same 0.22 m target-centre minimum, ordinary 20-degree boresight cone, one-time non-worsening first-alignment rule and candidate-bound final aim used by Tesseract and independently repeated by the executor. A rejected path advances through the remaining roll, fallback-look and candidate attempts instead of terminating the mission with a proposal the executor must reject.
  incident: codex-curobo-limit-fix-e2e-20260901-232843 acquired the cube at 11.1 degrees, but cuRobo published its first collision-safe endpoint path even though sample 26 worsened to 20.1 degrees. The common executor correctly rejected it before motion and the arm completed staged home, all-six disable and owned-process cleanup.
  unchanged: [Tesseract worker behavior, generic planner request and MotionPlan contracts, executor visibility backstop, collision checking, joint limits, authorization, runtime monitoring, final achieved-FK capture gate, real-motion default, no automatic fallback]
  evidence: [exact 11.1-to-20.1 regression, roll and candidate retry regressions, 49 ROS-free cuRobo tests pass with 9 GPU tests skipped, 193 shared executor tests pass, 909 complete mobile tests pass with one environment skip, 173 complete Tesseract tests pass, pinned cuRobo 0.7.8 GPU MULTIVIEW_SCAN exercises real batch FK and path qualification, accepted-views-zero command-free GPU replay returns 31 qualified points in 3.212 seconds]
  remaining: [separately authorized physical E2E]
curobo_joint_limit_boundary_repair_2026_09_01:
  behavior: The generated cuRobo 0.7.8 model uses the per-joint MotionGen clip [0.005,0,0,0.005,0.005,0.005] rad, preserving the intentional joint2-lower and joint3-upper configured-home boundaries while protecting the other joints from float32 edge solutions. It binds the vector into schema-3 provenance, validates native and normalized trajectories against authoritative raw limits, and validates every successful response against the complete generic planner contract inside the ROS-free worker before publishing it.
  incident: gui-sim-7c8f061c9e37456190a9701aa1cafd36 failed before capture because a cuRobo float32 interpolated waypoint placed joint5 at 1.2200000286102295 rad against a 1.22 rad raw upper limit. The bridge correctly rejected it, but the previous model had position_limit_clip 0.0 and the worker had already labelled the proposal successful.
  unchanged: [raw PiPER joint limits, generic ROS planner contract, common execution validation tolerance, PlanAuthorizer, runtime monitoring, collision checks, target freshness and drift gates, trajectory streaming, real-motion default, Tesseract behavior, no automatic fallback]
  evidence: [exact archived failure diagnosis, 75 focused adapter model and contract regressions pass, 44 complete ROS-free cuRobo tests pass with 9 opt-in GPU tests skipped, 173 complete Tesseract tests pass, real model regeneration proves schema 3 and exact clip vector, real CUDA model accepts joint5 1.214 rad and rejects 1.217 rad as joint-limit invalid, real private CUDA worker MULTIVIEW_SCAN transaction succeeds with 31 generic points and 0.1203 rad joint5 upper headroom, 8 of 9 opt-in GPU tests pass]
  remaining: [the recorded RETURN_HOME GPU fixture remains an explicit pre-existing invalid-start self-collision rejection, separately authorized physical E2E]
rough_acquisition_observation_floor_2026_09_01:
  behavior: Rough acquisition keeps a 0.35 m observation-protection floor around the rough hint but has no acquisition-specific maximum. The floor combines the qualified 0.25 m L515 near-depth boundary with the GUI goal's declared 0.10 m rough-position uncertainty. A camera inside the floor moves radially away before aiming; a camera already farther away keeps its measured radius, and same-radius compact candidates never pull it inward. Capability, exact selected-planner feasibility, collision checks, the finite 3.00 m perception profile and mission deadlines retain the real bounds.
  incident: gui-sim-f0df72b4a04642a59387ed3c1f52eb2a reached a valid cuRobo rough-look pose, but the true measured target was about 66 mm closer than the hint and its visible depth sat at 0.244 through 0.251 m. Intermittent near-range depth caused prediction-only tracking and correctly prevented the one-second multiview readiness window.
  unchanged: [0.35 m rough minimum, selected-planner IK and collision authority, plan authorization, tracking and readiness gates, 0.24 through 3.00 m semantic admission, later size-aware rays and 0.250 m surface clearance, real-motion default]
  evidence: [incident geometry regression, all 27 rough-acquisition tests pass, 909 complete mobile tests pass with one environment skip, 172 complete Tesseract tests pass, 40 ROS-free cuRobo adapter tests pass, piper_mobile_manipulation symlink build passes, real command-free cuRobo planning selects the centered 0.35 m incident-geometry candidate in 3.825 seconds and returns 98 trajectory points, no node or hardware command]
  remaining: [separately authorized physical E2E]
target_observation_ceiling_2026_09_01:
  behavior: The hard camera-to-target observation ceiling is 3.00 m for semantic target depth, Target3D production, base-frame tracking, target-shape/cloud admission, scan quality, occlusion analysis, first-capture crop recovery, generated ray requests, measured-surface/NBV integration and offline reconstruction depth truncation. Existing minimums are unchanged. GroundingDINO detection, SAM2 support, coherent depth-component selection and capture-quality gates still decide whether an observation inside that ceiling is usable.
  separation: The obstacle-instance and coarse scene-cloud depth maximum remains 1.20 m because it owns local collision geometry, not target visibility. target_cloud_node therefore has separate 3.00 m target and 1.20 m scene bounds.
  planning: ray_nbv requests 0.28 through 3.00 m target-relative standoff. The qualified enforcing capability map normally narrows that broad perception interval to arm-supported runs before the selected planner performs exact IK collision path aim and visibility checks. No preferred-distance ceiling or automatic planner fallback is introduced.
  evidence: [239 focused target envelope framing configuration depth capability planner measured-surface NBV and reconstruction tests pass with one environment skip, 908 complete mobile tests pass, 172 complete and registered Tesseract tests pass, 45 GUI tests pass, 34 ROS-free AI tests pass, piper_mobile_manipulation symlink build passes, all 12 AI YAML files parse with unique keys, real 360-ray capability-map benchmark across 0.28 through 3.00 m completes in 1.295 seconds with 44 supported rays, no hardware command]
  validation_note: The registered mobile run passes 44 of 45 functional targets; its architecture target passes when the built install overlay is sourced. The aggregate remains red on existing package-wide flake8 and pep257 debt, while the three new range-diagnostic Python files pass flake8 and all changed Python compiles.
  remaining: [command-free lifecycle replay, measured physical range characterization by target pixel area semantic mask coherent depth and quality, separately authorized physical E2E]
capability_owned_ray_workspace_2026_09_01:
  behavior: A loaded hash-qualified enforcing capability map is now the sole cheap arm-workspace prequalification for target rays. The former fixed base_link camera-radius and target-relative height gates are bypassed in that normal path and remain only as conservative fallback when the map is unavailable.
  distance_policy: The target-to-camera interval remains finite because capability occupancy proves an arm pose, not camera observability. Its lower bound still combines sensor near range, complete-FOV fit and 0.250 m estimated-surface clearance; its hard observation ceiling is now 3.00 m while semantic depth and capture-quality evidence remain mandatory.
  endpoint_policy: The deprecated preferred_scan_radius_m override no longer caps endpoint selection. ray_preferred_max_standoff_m is retained only as a private compatibility field and equals the active maximum for newly generated rays, allowing current-pose projection across every capability-supported interval.
  unchanged: [capability artifact and hashes, NBV ranking, six-ray shortlist, exact selected-planner IK collision path aim and visibility validation, executor authorization and runtime gates, capture, home, shutdown, real-motion default]
  software_evidence: [51 focused capability reachability ray and planner tests pass, 908 complete mobile tests pass, 172 complete Tesseract tests pass, piper_mobile_manipulation symlink build passes, all 12 AI YAML files parse with unique keys, Python compile and diff whitespace checks pass]
  remaining: [command-free ray lifecycle replay, empirical 3.00 m perception qualification, separately authorized physical requalification]
