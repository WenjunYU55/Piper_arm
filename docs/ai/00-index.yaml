  generated_roots: [datasets/experiment_campaigns, datasets/experiment_results]
  invariants: [file-only passive observer, no ROS imports in collector/report package, no mission admission or control effect, no raw dataset mutation, atomic campaign bookmark updates only under the generated campaign root, schedule mismatches excluded not coerced, reconstruction is offline controlled replay, outputs never overwrite an existing report directory]
  design: {campaign_id: piper-poster-blocked-20260902, target_mm: [35, 35, 35], x_m: [0.30, 0.50, 0.70, 0.90, 1.10], y_m: 0.0, z_m: [0.0, 0.12, 0.30], planner_order: [all_curobo, all_tesseract], planners: [tesseract, curobo], missions: 30, repeats_per_backend_position: 1, timing_reference_sec: 120, evidence_class: MATCHED_RUNS}
