  - id: startup_j6_clockwise_branch_2026_08_11
    status: stale_transaction_reset_fixed_physical_retry_required
    issue: >-
      GUI task gui-sim-ef30b4cc466f488ba1331d08b6432d34 used the
      negative storage branch and moved J6 in the increasing direction during
      STARTUP_WRIST. J6 asserted collision_status and
      driver_error_status after about 0.091 rad. The new motor guard correctly
      issued no later command and the watchdog disabled all axes. Current
      disabled feedback is near J6 -3.105395 with no active faults.
    resolved_software: >-
      The operator corrected the earlier physical-direction interpretation:
      increasing negative J6 toward zero is intended. Schema-v3 now binds
      negative storage -3.139536232, increasing startup, decreasing storage
      and a pre-enable gate against positive non-ready feedback. Schema-v2
      profiles remain diagnostic-only. The prior positive/decreasing repair
      and its branch-rejection runs are superseded, while their no-enable and
      child-cleanup evidence remains valid.
      A 2026-08-16 retry exposed a separate lifecycle defect: after an
      incomplete STARTUP_WRIST was disabled, disabled-arm relaxation was still
      compared with the old 3.647663-rad high-water mark and repeatedly called
      DisableArm(7), defeating later commissioning enable attempts. A proved
      disable or direction-watchdog trip now clears the incomplete transaction,
      wrap target and direction history; fresh coherent feedback owns re-arm.
      E2E task gui-sim-904111b0d41b48a6bd16a10d3c29f538 then exposed a
      partial reintegration regression in the executor: the driver preserved
      fresh J1-J5 for the J6-only startup command, but executor progress still
      used stale six-joint targets and blocked at the wrap bridge. The archived
      command-boundary J1-J5 refresh, J6-only progress/settle proof and
      no-intermediate-hold behavior are restored with focused regressions.
      The same failed run exposed a commissioning integration gap: the GUI
      created its command publisher before proving sole ownership, and its
      strict current-hold settle gate could prevent /enable_srv false from
      being called. Commissioning now starts motion-locked, acquires its
      publisher only after an empty writer-set proof, and uses an explicitly
      labelled no-home/no-motion direct disable. An unfinished STARTUP_WRIST
      accepts only measured-J6 hold with J1-J5 movement or positive J6-only
      progress toward ready zero; autonomous shutdown behavior is unchanged.
    next_cut: >-
      Inspect the J6 cable/wrist; corrected-contract focused/build/rootless
      requalification now passes. Confirm the GUI shows startup increasing to
      zero. Only after explicit authorization run a startup-only five-percent test and
      verify J6 increases monotonically through any required wrap bridge to
      ready with no false J1-J5 no-progress result and no hold inserted before
      ROUGH_HOME; then cancel before acquisition and prove decreasing negative
      storage, six-axis disable and cleanup.
  - id: qualify_staged_home_and_contact_physical_models
    issue: >-
      The staged-home software contract and rigid pen/marker/stick evidence path
      are implemented. The old operator record used schema-v2 rough
      [0,0,0,0,0.399345492,0] and negative storage J6 -3.139536232. Schema-v3
      now binds that same rough/storage pose and the operator-corrected
      increasing startup plus decreasing storage directions. Conservative
      L515/cable collision envelopes overlap base/link envelopes during the
