      42 ms. Launch overrides reached realsense-ros but the late-declared live L515 controls still
      initialized false, so both startup scripts now set and verify RGB/depth global time after device
      open and fail closed otherwise. A 2026-08-10 read-only TF preflight exposed that Foxy's first
      pre-node `ros2 param --no-daemon` transaction could ignore its ROS spin bound and grow to about
      101 GB RSS; Linux killed the 65 GB camera process during the resulting global OOM. Both normal
      and low-bandwidth launchers now externally limit every direct parameter transaction to two
      seconds before retrying, while retaining mandatory live preset/global-time verification. The
      patched normal launcher then passed live with preset 5, both global-time controls true, 30/30
      CameraInfo samples at 76 ms median host offset, unchanged exact calibrated TF and about 156 MB
      camera RSS. Full
      RGB consumption first starved the watchdog; after switching
      to lightweight CameraInfo, live custom multi-thread callback groups still exposed endpoints
