      198 Hz on both reliable and sensor-data readers. The production watchdog now uses Foxy's
      standard serialized executor plus a bounded three-attempt startup gate. Clean-restart static
      acceptance passed on 2026-07-17: both global-time controls true; 76 health samples over 15
      seconds all HEALTHY with about 76 ms median offset, -0.000660 seconds/second short-window slope,
      8646 consecutive frames, stationary feedback, and no recovery request; a later three-second
      direct probe received 141 joint samples and 12 healthy clock samples; tracking was live rather
      than prediction-only at quality 1.0, the target was valid/stable at 0.795 confidence in
      base_link, tracked_object_frame resolved, and /joint_ctrl_single had zero publishers. The
      five-minute stationary run then passed with 1490 all-healthy clock samples, about 74 ms median
      and 165 ms maximum offset, +0.0000022 seconds/second slope, 26807 consecutive healthy frames,
      zero recovery requests, and exactly zero joint-position span across 59970 samples. A clearly
      marked dry-run supervisor-boundary request with the arm stationary replaced the owned camera
      and watchdog processes; post-restart global time remained true, clock health returned at about
      75 ms, live tracking returned at quality 1.0, the target returned valid/stable at 0.862
      confidence, tracked_object_frame resolved, and no joint-command publisher appeared. A later
      three-minute operator-controlled J1 sweep through about plus/minus 17.3 degrees produced zero
      clock faults or recovery requests, all 898 health samples remained TRACKING, target validity
      was 100 percent and stability 98 percent, and confidence remained at least 0.599. A raw
      in-motion base-position outlier reached 111.5 mm, but the held extreme pose settled near 12 mm
      drift and return to the baseline pose returned below 1 mm without target invalidation.
    next_cut: Repeat the supervised motion check on a small J2 sweep, characterize or bound transient in-motion base-position lag before automatic capture uses it, and verify /joint_ctrl_single returns to zero publishers after the GUI command source is stopped.
