  remaining_perception_debt:
    status: native_l515_stream_passed_target_capture_validation_open_2026-08-16
    issue: Shared ambiguity-aware depth-layer selection and confidence-qualified L515 capture schema 2 are active. The first live launch exposed eager preset/global-time writes racing the expanded confidence stream and producing RS2_USB_STATUS_BUSY. Both launchers now wait for a real CameraInfo sample before reconfiguration and enable stream synchronization. A motors-disabled normal-wrapper retest passed preset 5, both global-time controls true, 95 native depth/confidence/camera-info bundles in three seconds with zero timestamp delta, and valid left-justified 4-bit RAW8 confidence. Stationary semantic-target jitter and a complete persisted schema-2 target capture remain untested.
