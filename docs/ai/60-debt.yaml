  evidence: The temporary seven-view replay contained 36149 qualified target pixels and produced 20568 vertices at 1.0 mm, but robot-pose fusion still had 1784 connected components, 39.5-percent dominant support and approximately 73-by-58-by-47 mm extent for the 35 mm cube. At the finest GUI setting 0.5 mm it produced 166214 vertices and 225320 triangles, yet fragmentation worsened to 9200 components with only 46.1-percent dominant support and approximately 78-by-78-by-56 mm extent. Density is not the primary defect.
  remaining: [repair inter-view pose/registration consistency, acquire missing negative-Y and wider coverage safely, compare 1.0 and 0.5 mm only after alignment improves, never use polygon count as a quality substitute]
