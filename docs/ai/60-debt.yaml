settled_depth_burst_and_mesh_resolution_2026_08_21:
  status: burst_timeout_repaired_software_qualified_physical_retest_deferred
  implemented: Once an achieved viewpoint is settled and the capture service is requested, the command-free recorder collects exactly 20 new synchronized native L515 depth/confidence/camera-info frames while that pose is held. Nonzero grade-8-or-better samples are fused with a per-pixel median and 0.50 temporal-support floor before the existing component qualification and schema-2 transaction. One exact mask/RGB pair remains the semantic reference.
  evidence: The first physical burst in gui-sim-8733327f74f3455eb8656f01a6ceb66d collected 20 frames in 1.031 seconds, but a later burst received 18/20 before the independent five-second limit and caused DEADLINE_EXPIRED despite the executor's existing 20-second capture timeout. Safe staged shutdown passed. The recorder now shares that outer timeout and reserves two seconds for response delivery; focused regression proves a complete burst arriving beyond five seconds is accepted and 19-frame timeout diagnostics retain the actual count and rate.
  resolution_change: Accepted refined target clouds now retain every masked pixel into 1 mm cells, and TSDF defaults to 1 mm with a 5 mm truncation band. NBV remains 5 mm and the scene cloud remains 15 mm. No 0.1 mm mode was enabled.
  deferred: Adaptive mesh resolution remains deferred. A 0.1 mm default would increase cubic voxel density by 1000 times versus 1 mm while exceeding demonstrated L515 spatial evidence.
  next_cut: Physical E2E was explicitly deferred after the software repair. When newly authorized, inspect temporal support, reported synchronized rate and RealSense USB warnings before reconstructing the immutable output.
