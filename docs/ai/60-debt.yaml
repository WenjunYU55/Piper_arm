  - id: live_start_model_validation_blocker
    issue: Resolved in software on 2026-07-25 for the recorded rough-acquisition start. Complete-link convex hulls for link1/link2/link5 were replaced by deterministic overlapping 30 mm pieces with verified source, piece, and manifest hashes. A bounded acquisition-only recovery leaves remaining folded-start convex-piece overlap monotonically, reaches normal clearance, and is inside the exact approved trajectory. Foxy independently checks that prefix and resumes the ordinary 60 mm proxy threshold at the boundary. No collision pair is globally disabled.
    next_cut: Reconnect hardware and repeat Step 1/Step 2 proposal acceptance from the same compact start, then run one supervised 5-percent acquisition and cancel-to-hold. Preserve manifest hash 237c06f03ef248c535b28fbf588e65160325a5f8f48632a9f0237e59c7a10956 and the J3 -0.05/point-50 regression. Any geometry, allowlist, bound, search, timing, or proxy change requires both qualification suites again.
  - id: live_can_feedback_blocker
    issue: On 2026-07-20 GUI disable worked but GUI enable failed because the repository service used a hand-written 500 ms EnableArm retry loop and interleaved GripperCtrl on every attempt, unlike the installed official SDK example's 10 ms feedback-confirmed EnablePiper handshake. The service now uses EnablePiper/DisablePiper every 10 ms, returns success only after target feedback, and sends one gripper command after success. Three focused tests, the piper Foxy rebuild, and a supported live disable/re-enable cycle pass. On 2026-07-25 a separate feedback stall left CAN and graph endpoints active but stopped joint/status delivery. The unmanaged publisher was replaced by an executor-owned 200 Hz timer; after a disabled restart an application-level subscriber measured about 201.82 Hz. A later long-running graph again required a disabled driver restart before fresh subscribers received samples, so sustained delivery remains open debt.
    next_cut: Preserve the 10 ms SDK handshake and executor-owned 200 Hz timer. Add a driver-side delivered-sample watchdog or startup/soak health signal, repeat long GUI/camera/scan-stack churn, and fail planning on stale application-level samples; never treat endpoint visibility, CLI ros2 topic hz, or CAN counters alone as feedback. On the next intentional arm reboot, re-run the read-only feedback and one supported GUI enable/disable smoke.
  - id: target_tracker_tf_starvation_acceptance
    issue: Resolved on 2026-07-24. A live restart exposed target_tracker and target_landmark TF starvation under single-thread executors when timestamped callbacks waited for transforms. Both now retain two-thread executor capacity, and live acceptance produced stable measured base_link tracking plus a LOCKED landmark through physical arm motion.
    next_cut: Preserve concurrent TF callback capacity and repeat the stationary/moving TF regression after any executor, callback-group, or transform-timeout change.
  - id: gpu_pipeline_orphan_shutdown_acceptance
    issue: A live Ctrl+C stopped the camera but left watchdog, bridges, cloud, and geometry setsid groups re-parented to systemd. A validated atomic process-group manifest and dedicated orphan-safe stop script are implemented but need normal and forced-wrapper-loss live acceptance runs.
    next_cut: Start with motors disabled, verify all eight owned groups are recorded, test Ctrl+C, then force only the wrapper to exit and verify the stop script removes recorded children while driver, GUI, TF, and proposal executor remain.
  - id: camera_timestamp_recovery_acceptance
    issue: >-
      Typed fail-closed camera timestamp health, position-stability-based stationary-only full-stack
      recovery requests, capped periodic restart backoff, SAM2 health suppression, and independent
      scan-executor gating are implemented and unit-tested. A live 15-second probe measured the L515
