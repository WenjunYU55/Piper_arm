target_face_undersegmentation_false_occluder_2026_08_23:
  status: software_fixed_recorded_replay_passed_physical_retest_pending
  corrected_diagnosis: E2E task gui-sim-8b46fd14bf5d4d4184a1cc84a066d92f accepted four captures, then heavy result 1787496414_574036992_request_sam2_event_1787496415100 emitted a 4324-pixel U-shaped closer-depth halo predominantly around the exterior target boundary. The former rectangular target envelope admitted 909 halo pixels in empty bounding-box support and incorrectly retained the whole component. The selected SAM target mask itself covered 8360 pixels and the matching hand/finger mask was correctly rejected as a duplicate target mask.
  correction: Require target-local depth components to cross a one-pixel-eroded filled target silhouette rather than its rectangular bounding box. Depth-only foreground is not human-unsafe; only explicit hand/person semantics are UNSAFE, unknown remains BLOCKED, and the movable whitelist remains unchanged.
  evidence: Direct command-free replay of the archived target mask and depth reduces the false component from 4324 pixels to zero; synthetic exterior-halo and genuine crossing-occluder tests both pass.
  remaining: Run one supervised clear-scene E2E and verify the archived heavy result remains clear. Keep semantic target-mask drift as a separate issue and do not weaken unknown-object contact authorization.
connected_target_mesh_cleanup_followup_2026_08_23:
  status: fragment_cleanup_implemented_underlying_alignment_failure_remains
  implemented: Save both the untouched extracted TSDF and a separately filtered connected-target mesh from one run; remove only components below five percent of dominant surface area, retain and fail multiple substantial components, and preserve complete raw metrics for quality and registration selection. The GUI builds both and opens either one.
  evidence: On scan_20260821_220003, captured multiway output changed from 197 components and 10764 triangles to one 9742-triangle component; offline-resegmented output changed from 176 components and 9862 triangles to one 8545-triangle component. Both remain FAIL. Cleaned point-to-mesh p90 residuals increased because the immutable input cloud still contains evidence assigned to removed fragments.
  interpretation: The rule removes visual floaters but cannot repair cross-view registration, incomplete surfaces or calibration/pose disagreement. The larger residual tail is useful evidence that removed geometry was not merely cost-free display noise.
  next_cut: Use Open Raw and Open Cleaned to compare the new PLY files, then obtain calibration-qualified overlapping captures. Do not raise the five-percent threshold, discard substantial components, exclude input points from residuals or relax dimensional gates to force a pass.
hand_eye_accuracy_followup_2026_08_22:
  status: tooling_repaired_candidate_not_qualified
  evidence: The corrected-scale 12-pose session has strong image reprojection and useful rotational diversity, but approximately 8.69 mm translation and 1.30 degree fitting closure. PARK, TSAI, HORAUD and DANIILIDIS agree closely; same-session L515 RGB intrinsic refitting does not improve closure. Leave-one-out identifies the darkest/smallest-board first view as an 18.85 mm held-out outlier, but removing it still leaves 7.33 mm fitting RMS, so one bad frame is not the whole cause. Mode-0 FK agrees with controller end-pose diagnostics and matches firmware S-V1.5-8.
  interpretation: Remaining error is more consistent with physical/robot repeatability, absolute kinematic/model bias, or camera/board pose bias than with OpenCV solver choice. Current samples alone cannot separate these sources.
  next_cut: First collect stationary multi-frame noise with the complete rigid board visible; then prove return-to-pose repeatability and collect independent held-out stations. Only after those tests compare a new candidate against the unchanged deployed transform and command-free reconstruction. Do not add kinematic compensation or deploy from fitting residuals alone.
  blocker: The former unavailable J6 limit feedback was traced to the controller remaining in teaching mode, where it did not answer the existing 0x472 queries. The driver now restores the documented motion-output role only from fresh all-six-disabled, fault-free feedback before readiness queries and enable; command-free validation received 0x473 and 0x47C replies and valid hash-bound limits. Independent held-out calibration and reconstruction evidence remain the actual deployment blockers.
offline_resegmentation_followup_2026_08_22:
  status: contamination_reduced_reconstruction_still_quality_fail
  implemented: Fresh independent GroundingDINO plus SAM2 masks are selectable for offline reconstruction, hash-bound to immutable inputs and exact model assets, and intersected with captured confidence-qualified target support without changing live perception or capture behavior.
  evidence: All seven scan_20260821_220003 frames produced fresh masks. View 004 removed 4983 semantic pixels and 2366 captured-support pixels associated with the shadow/table region. Auto reconstruction improved from the captured multiway 58.79 x 52.88 x 48.29 mm OBB and 0.558 mm median residual to 51.48 x 49.00 x 45.77 mm and 0.530 mm, but remained FAIL versus the 35 mm cube and dominant-component coherence decreased from 90.5 to 86.65 percent.
  interpretation: Live-mask contamination was a real contributor but not the dominant remaining cross-view disagreement. Offline masks deliberately cannot recover target pixels that were absent from the captured confidence-qualified support.
  next_cut: Visually review the per-frame comparison overlays and the selected mesh, then collect a calibration-qualified stationary dataset with better overlapping views. Do not loosen mask, pose-correction or quality gates to force this dataset to pass. If missing target support is later material, design a separately qualified native-depth reprojection from fresh masks rather than expanding this intersection contract silently.
static_scene_pose_graph_followup_2026_08_22:
  status: selectable_software_path_implemented_current_dataset_still_failed
  implemented: Target-excluded aligned static-scene RGB-D odometry plus bounded GICP pose graph is selectable independently in the GUI and CLI; target-only confidence-qualified TSDF fusion, robot seeds, 20 mm and 5 degree limits and auto quality gates remain unchanged.
  evidence: On scan_20260821_220003 at 1 mm and 35 mm expected dimensions, scene_pose_graph reduced maximum OBB error from 37.98 mm to 27.65 mm and median point-to-mesh residual from 1.132 mm to 1.081 mm, but dominant-component coherence fell from 39.5 to 33.7 percent. Auto correctly rejected it and selected multiway_gicp.
  interpretation: Static scene context is available and the method runs, but this dataset does not establish that scene registration is superior. Its remaining oversized fragmented mesh confirms pose refinement alone is insufficient evidence of reconstruction quality.
  next_cut: Collect a calibration-qualified, stationary, diverse dataset with overlapping static context and compare robot_pose, multiway_gicp and scene_pose_graph visually and metrically. Do not tune correction bounds or quality gates from this single replay.
reconstruction_alignment_and_calibration_followup_2026_08_21:
  status: bounded_offline_registration_improved_but_dimensional_quality_still_failed
  evidence: scan_20260821_220003 has clean individual face support but robot-pose fusion yields 39.5 percent dominant component and 3.97 mm p90 plane residual. Bounded multiway refinement yields 90.5 percent and 2.25 mm, yet the 58.8 x 52.9 x 48.3 mm OBB remains too large for the measured 35 mm cube.
  interpretation: Residual view registration is real, but software alignment alone has not proved metric correctness. The current corrected-scale fixed-board authority passed manipulation-scale limits at 5.73 mm mean and 12.22 mm worst translation drift, which is not a one-millimetre reconstruction guarantee.
  next_cut: Collect a new immutable 17 mm square and 12 mm marker calibration session with diverse stable poses, exact image-time TF, and held-out validation. Compare reconstruction before deployment. Do not widen GICP bounds, rewrite historical captures or silently replace the deployed calibration.
  deferred: Geometry-derived target centre and nonrigid/outdoor reconstruction remain separate work and are not justified by this stationary-cube replay.
