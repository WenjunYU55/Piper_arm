    scan_20260806_174742 then exposed a shortlist-ordering bug: after one GOOD/CLEAR
    capture all 36 farthest-ranked candidates failed IK because nearby fallbacks had
    been truncated before Tesseract. The bridge retains maximum-coverage candidates
    plus nearest-current-camera fallbacks in the bounded shortlist. Automatic completion
    historically used an eight-view model seed and at most twenty-four achieved-FK views, two per Y side, 120-degree azimuth and 25-degree
    elevation. The fixed azimuth gate has since been removed. Any rejected proposal remains
    non-motion evidence and cannot suppress a separately collision-validated current-state
    home transaction.
  remaining_validation: Rebuild and repeat from the real GUI; require 8-24 accepted records with every achieved feature floor and three-view measured convergence, safe_shutdown=true, configured-home proof, six disabled flags, and no owned child process.
