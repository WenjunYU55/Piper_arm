  first_endpoint_clock_fault_result: >-
    GUI mission gui-sim-2f877e11e30549c3a3ee26f918726864 passed startup,
    measured acquisition and the exact moving-scene snapshot, reached its first
    scan endpoint and entered CAPTURING_RGBD. The camera clock then moved 0.554
