  observed_defect: The loaded coordinator interpreted the word collision in the planning diagnostic as an active motion-safety fault, skipped its independent home request, and left the arm enabled in a measured hold.
  recovery_evidence: A fresh correlated zero-capture RETURN_HOME plan started from that measured hold, reached configured home without revisiting scan endpoints, settled, and feedback-disabled. After exact child-group shutdown, direct CAN reported [false,false,false,false,false,false], CAN_CTRL, NORMAL, target reached and err_code 0.
  first_fix_and_audit: The next GUI run scan_20260806_172931 returned durable SUCCEEDED, seven GOOD/CLEAR hash-valid records, configured home, safe_shutdown=true, six false motor flags, NORMAL CAN and no owned child. Achieved-pose audit then showed that result was not distinctive enough because all views were on the +Y side, azimuth span was 36.7 degrees and elevation span 18.4 degrees. Treating raw planner exhaustion as useful coverage was therefore invalid.
  current_software_fix: >-
    Replace the fixed 120-175-degree sector with the target-facing 90-270-degree hemisphere,
    seven -15-through--75-degree pitch samples and six 0.30-through-0.45 m distances. Use a 6-to-30-degree one-replan direction
    frontier and at most 36 worker alternatives; retain the executor's 20-degree
