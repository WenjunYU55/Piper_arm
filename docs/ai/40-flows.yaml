  gui_action_client_startup: [Launch start_gui.sh in an isolated domain and confirm idle RSS remains bounded; verify no Tesseract, scan, camera or perception child starts; submit only to a deliberately unavailable command-free action server and confirm a bounded unavailable result with no process or command side effect; test_gui_transport_profile.py and test_piper_gui_phase8.py must pass.]
