  motion_blur_retry_result: >-
    GUI mission gui-sim-1d2081729e6d42e18e2fa5eb73da80a9 again passed staged
    startup, measured lock and a CLEAR workflow probe. During the first scan
    move, the target mask shrank then became empty; SAM2 entered
    WAITING_FOR_SEED and obstacle ID output stopped. The old continuous
