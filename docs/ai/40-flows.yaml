commissioning_control_flow_2026_08_16:
  ownership:
    - GUI starts with no /joint_ctrl_single publisher.
    - Resolve the ROS graph for 0.5 seconds and create the manual publisher only when no writer exists.
    - Destroy the GUI publisher before action submission and never enable or move while a production writer exists.
  unfinished_startup_j6:
    - A manual target within 0.03 rad of measured logical J6 holds the exact raw J6 coordinate and may move J1-J5.
    - A target more positive than measured and no greater than ready zero moves only J6 through the qualified controller branch.
    - A negative-direction or positive-overshoot target is rejected.
  explicit_disable:
    - It is available independently of motion-publisher ownership when no local action is active.
    - It publishes no JointState and commands no hold or home.
    - It warns the operator to support an arm that can fall, calls /enable_srv false, and reports success only from the driver's all-six feedback proof.
  autonomous_boundary: Production Cancel/Home still holds, executes PRE_HOME then ROUGH_HOME then STORAGE_WRIST, holds, disables and cleans up. Commissioning disable must never replace that normal mission route.
