ray_endpoint_feasibility_flow_2026_08_23:
  trigger: A ray_nbv shortlist reaches the private bridge/worker boundary.
  sequence: [bridge binds each shortlisted direction once with its prequalified active standoff envelope and retains any capability-supported run evidence, representative seed is chosen from a supported run when present, worker jointly optimizes six joints plus standoff using nine deterministic seeds, exact target aim is exhausted before one bounded fallback, geometry is accepted only within 0.1 mm ray position and 0.001 rad optical aim, existing exact IK collision OMPL and dense visibility checks remain authoritative, a successful response reports the actual selected endpoint, bridge validates the selected endpoint]
  temporary_failures: Collision, path, visibility, timeout, transport and generic planning failure continue through the generation-scoped shortlist exhaustion flow. Typed RAY_IK_FAILURE is distinct because the worker emits it only after exhausting the configured continuous ray endpoint search.
  manual_smoke_checks: [command-free prove an endpoint between the old sparse probes can be selected, prove a selected endpoint cannot leave the requested ray or standoff interval, confirm a successful plan can cache earlier no-IK rays, confirm accepted_views does not restore those rays, confirm a new session clears them, confirm path failures are not session-persistent, confirm every accepted capture still changes the NBV generation and score]
target_local_occluder_classification_2026_08_23:
