  physical_sequence: GUI task gui-sim-d30410e05b9c405cb48e969fa818c173 completed ten GOOD/CLEAR diverse captures in scan_20260811_124232. After GUI cancellation, a fresh direct ROUGH_HOME command was attempted from measured joints near [-1.38924016,2.151002196,-0.657167812,1.080463916,1.23006366,-2.97428922]. The camera-holder/L515 contacted the support plane and J5 disabled.
