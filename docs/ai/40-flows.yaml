  retry_behavior: [same-ray outward framing retry bypasses accepted-history retirement because it has no accepted capture, collision path visibility timeout transport and generic planning failures may return in a later generation, typed exhaustive RAY_IK_FAILURE and worker permanent endpoint failures do not return]
  manual_smoke_checks: [require bootstrap centre equals recorded surface lock, require upgrade_population after accepted capture one, require qualified ray centre grey centre planning_anchor_m and axis_origin_m exactly match, require bootstrap and qualified population SHA differ, require old-population hard culls are not reused, require qualified SHA remains stable thereafter, require no repeated-new-cull or culled-to-active transition within one population, require past culls visible by default as dashed rays, require no candidate camera shell before population culling and camera meshes only on current survivors afterward, require the Target layers controls stay visible at the top of the right-hand inspector, toggle each layer independently, accept one direction and require its inclusive 15-degree neighbourhood absent from every later rank, load offline-cube-qualified-centre-replay-20260826 and inspect all phases]
