obstacle_tf_gap_runtime_hold_2026_08_06:
  trigger: GUI scan scan_20260806_223343 accepted two GOOD/CLEAR captures, then one exact-stamp base-to-camera lookup miss created an invalid obstacle instance during view-three motion even though the semantic occlusion stream reported CLEAR with zero closer pixels.
  sequence:
    - Preserve the existing TF buffer and start a continuous-failure timer after the first failed exact-stamp lookup.
    - Clear that timer on any successful transform; recreate the listener only if failures remain uninterrupted for three seconds and the retry interval has elapsed.
