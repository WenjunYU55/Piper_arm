schema_version: 1
document: runtime_flows
flows:
  startup:
    sequence:
      - Start PiPER driver with auto_enable=false; verify /joint_states_single and /arm_status deliver actual samples, not merely graph-visible endpoints. The driver uses an executor-owned 200 Hz timer; the former unmanaged publication loop was removed after live delivery stalls.
      - Start piper_description/display_live_robot.launch.py when the arm link chain is needed in TF or RViz; it consumes feedback only.
      - Start hand-eye publisher after the camera static TF is live; it freezes camera_link to camera_color_optical_frame, then publishes base_link to camera_link from reliable depth-1 joint feedback. Missing static TF fails startup.
      - Start GPU pipeline in its defined process order; bridge requests initial semantic seed after subscribers exist.
      - Camera timestamp watchdog requires 15 consecutive image stamps within 0.5 seconds of ROS time before health becomes HEALTHY; SAM2 tracking and scan execution remain fail-closed before then.
      - Start optional dry-run scan or supervised workflow only after perception topics are healthy.
      - Start supervised viewpoint execution in proposal-only mode, validate its typed plan, and only then consider a separate motion-enabled restart.
    failure_modes: [mixed ROS_DOMAIN_ID or ROS_LOCALHOST_ONLY, stale processes, unsourced overlay, CAN owner conflict, camera USB bandwidth]
  camera_timestamp_recovery:
    sequence:
      - Camera startup waits for the live L515 sensor controls, sets and verifies librealsense global time for RGB and depth, and fails if either remains disabled; launch arguments alone are insufficient because the device initializes these late-declared controls false. Hardware timestamps are then continuously corrected into the host clock instead of relying on a one-time anchor.
      - Pipeline startup starts the timestamp watchdog next, requires both /camera_timestamp_watchdog and one /piper/camera_timestamp_health publisher before launching downstream perception, retries the isolated watchdog process up to three times, and otherwise tears down the owned stack fail-closed.
      - Watchdog compares each per-frame color CameraInfo stamp with current ROS time and the previous stamp, avoiding full RGB deserialization, and publishes /piper/camera_timestamp_health at 5 Hz.
      - Missing, invalid, backwards, future, or more-than-0.5-second-stale stamps force unhealthy typed status; SAM2 publishes CAMERA_CLOCK_INVALID with zero speed and the scan executor invalidates or aborts.
      - Watchdog services lightweight CameraInfo, reliable depth-1 latest-joint, and timer callbacks on Foxy's standard single-thread executor, avoiding the observed custom callback-group delivery failure while retaining current 200 Hz feedback. It then waits for fresh six-joint positions to remain within 0.001 rad for 0.75 seconds. This rejects real motion without camera-payload starvation, PiPER's noisy at-rest velocity telemetry, or an old reliable queue; velocity-only messages retain a fail-closed fallback.
      - With a pipeline-owned camera, an atomic /tmp/piper_vision_recovery/request.yaml makes the wrapper stop camera and every perception child, clear live queues, back off 2/5/10/30 seconds, and restart the complete stack.
      - After restart the gate remains closed until consecutive healthy frames and fresh tracking/3D target/obstacle inputs return. With a reused external camera, status stays blocked and the operator must restart that camera owner.
    failure_modes: [missing camera frames, large positive or negative offset, backwards timestamp, missing or moving joint feedback, external camera not owned by wrapper, repeated restart with capped backoff]
  gpu_pipeline_shutdown:
    sequence:
      - run_gpu_vision_pipeline atomically records every owned camera, watchdog, bridge, isolated worker, cloud, and geometry process-group leader.
      - Normal Ctrl+C runs in-process INT/TERM cleanup and removes the manifest.
      - If the wrapper dies before its trap completes, stop_gpu_vision_pipeline.sh validates the surviving manifest and stops only its owned groups.
      - Verify all vision processes are absent while driver, GUI, TF, and proposal executor remain untouched.
    failure_modes: [wrapper killed before trap, stale manifest, PID reuse, non-group-leader PID, unrelated command path]
  semantic_to_live_tracking:
    sequence:
      - sam2_live_bridge requests a heavy refresh for initialization, a two-attempt loss-recovery burst, a slow periodic ABSENT retry, or one sustained-low-confidence episode after valid TrackedTarget confidence stays below 0.60 for one second.
      - heavy_refresh_bridge snapshots a timestamped RGB/depth frame into heavy requests.
      - heavy_model_worker runs GroundingDINO plus SAM2 refinement and writes a response.
      - heavy_refresh_bridge publishes masks/status and writes a multi-object SAM2 seed.
      - sam2_live_worker consumes a labelled objects manifest with object_NNN masks and subsequent
        frame directories, maintaining object identities; an objectless mask.png seed is rejected.
      - sam2_live_bridge republishes target/obstacle/object-ID masks with camera timestamps.
    sync_behavior: Only one heavy refresh is in flight; additional reasons are deferred/coalesced; atomic READY directories prevent partial reads. Low-confidence refresh rearms only after confidence reaches 0.70 and remains motion-gated.
  mask_to_base_tracking:
    sequence:
      - mask_to_detection computes target 2D bounds.
      - depth_to_3d synchronizes detection, aligned depth, camera info, and recent mask; robust depth yields Target3D.
      - Isolated depth jumps are rejected, while three mutually consistent post-motion samples within 0.03 m re-anchor the projector and clear stale camera-frame smoothing. A nonpositive max_depth_jump_m disables this gate.
      - target_tracker transforms the timestamped measurement to base_link, applies gates, and updates a constant-velocity Kalman filter.
      - TrackedTarget publishes position, velocity, prediction horizon, confidence, validity, and stability.
      - object_frame_broadcaster publishes tracked_object_frame and predicted_object_frame.
    failure_behavior: Invalid/stale/out-of-order measurements do not update the filter; prediction is bounded by missed-frame/lost timers.
  camera_motion_recovery:
    sequence:
      - /joint_states_single updates arm moving/settled state in sam2_live_bridge.
      - hand-eye TF updates base_link to camera_link from reliable depth-1 latest-sample feedback after freezing the RealSense static camera-frame edge; its FK work must not replay stale high-rate joint samples.
      - motion_compensated_prompt reprojects the known base-frame target mask into the current camera view.
      - On a loss episode, a fresh nonempty motion prompt is tried once before heavy semantic refresh.
      - If two heavy attempts do not recover the target, lifecycle becomes ABSENT and one serialized retry is allowed every 30 seconds by default, only while the camera is settled.
      - TrackingHealth limits downstream speed and reports prediction-only/reacquisition state.
    pass_condition: A stationary cube remains stable in base_link while its pixels move due to small arm motion.
    current_calibration_state: The proposed 2026-07-14 J6 analytical compensation was rejected after a failed physical three-pose run on 2026-07-15. The original unadjusted camera_to_link6 transform fits the three captured snapshots within about 10.8 mm and 1.37 degrees and is restored, pending a fresh live multi-pose validation after TF restart.
  target_metric_tracking:
    sequence:
      - depth_to_3d publishes timestamped Target3D measurements in the camera optical frame.
      - target_tracker receives TF on a re-entrant callback group using a two-thread executor, so a bounded timestamped transform wait cannot starve the TF subscriptions.
      - Valid measurements are transformed into base_link, filtered, and published as TrackedTarget.
      - object_frame_broadcaster publishes tracked_object_frame for RViz only while TrackedTarget is valid.
    failure_modes: [missing base-to-camera TF, TF callback starvation, invalid depth, low confidence, out-of-order measurement, tracker gate rejection]
  supervised_dry_run:
    sequence:
      - start waits for locked landmark and fresh obstacle instances.
      - Clear scene enters SCAN_READY; whitelisted movable obstacle produces a conservative plan; unsafe/invalid geometry aborts.
      - approve_plan enters WAIT_OPERATOR_ACTION without publishing motion.
      - Human moves obstacle; confirm_action_complete verifies displacement and scene safety.
      - capture_view accepts only fresh GOOD/ACCEPTABLE quality and requests a full-resolution target cloud. The cloud subscription uses best-effort sensor QoS, and the coordinator retains the cloud/status pair across either arrival order before incrementing modeled_views.
      - After 5-8 accepted views and center convergence, finish_scan requests save and publishes the target model.
    state_values: [IDLE, INITIALIZING, PLAN_READY, WAIT_OPERATOR_ACTION, VERIFY_ACTION, SCAN_READY, WAIT_CAPTURE, COMPLETE, ABORTED]
  active_scan_capture:
    behavior: Planner emits pitched circular camera viewpoints around target; reachability filter performs conservative workspace/radius and typed arm-status checks. The standalone debug launch may capture synchronized color/depth/mask records on an interval. The supervised launch instead uses service mode, and the executor requires one fresh synchronized RGB/depth/camera-info plus mask record after workflow quality acceptance at every settled MULTIVIEW_SCAN viewpoint before it advances.
    limitation: The filter's reachable/safe flags remain workspace-only; Tesseract is the mandatory IK/collision-aware planning authority, and the Foxy executor independently rechecks each exact path with its conservative proxy. The Tesseract model was initially qualified on 2026-07-23, requalified with identical seed-42 output on 2026-07-24, requalified for exact all-zero acquisition egress with named positive compact-pair margins on 2026-07-25, and completed supervised five-view physical acceptance on 2026-07-24; this is not functional-safety certification.
  rough_target_acquisition:
    sequence:
      - An external source or the native GUI calls /scan_target_acquisition/prepare with one unique session_id and one fresh finite PointStamped in base_link. This typed request atomically binds identity and target; an exact duplicate is idempotent, while reusing an ID with changed target data is rejected. Receipt never approves or commands motion.
      - The prepare service obtains current camera TF and publishes five distinct dry-run orbit poses at the lesser of the live camera-target radius and the configured 0.45 m maximum: center, left, right, camera-up, and camera-down with 15-degree offsets. Every pose aims camera optical +Z at the rough coordinate.
      - Dedicated reachability output preserves ROUGH_ACQUISITION provenance and may ignore target_status LOST only; arm-status and workspace checks remain unchanged.
      - The coordinator republishes the command-free candidates and retries only rejected non-queued bridge calls for at most 10 seconds, with no more than one call in flight. Scan subscriptions remain stable for node lifetime; stale or missing callbacks block without DDS endpoint recreation. Once accepted, exactly one spool request exists. Schema-v5 hashes bind plan kind, source_request_id, base_link provenance, target stamp, candidates, scene observation mode, model, calibration, limits, and exact trajectory.
      - source_request_id is preserved through candidate JSON, the canonical spool, TesseractPlan, ScanExecutionPlan, and GUI. A plan or terminal status from another session cannot satisfy the current request.
      - Tesseract aligns camera optical +Z with each look vector, samples roll, solves all six joints, and returns one to five collision-validated looks. A valid all-zero start may egress through the reviewed positive base_link/link2 and link2/link4 compact-design pair margins while the 0.005 m global margin, penetration rejection, conservative pair motion bounds, and exact-path validation remain active. Proposal-only mode still has no command publisher.
      - Only for first-segment bootstrap_static acquisition, the worker may add a maximum-0.15-rad single-joint recovery. Every sample may contain only named bounded folded-start model contacts, must improve monotonically, and must reach ordinary clearance at the declared endpoint. Prefix, boundary, joint, delta, and evidence are inside the trajectory hash.
      - Foxy accepts that metadata only on ROUGH_ACQUISITION segment zero, independently checks monotonically improving capsule-proxy clearance, and requires the normal 60 mm proxy threshold at the boundary. Joint, floor, feedback, camera-clock, exact approval, and hold gates remain active.
      - Exact approval in motion-enabled mode executes at the GUI-selected finite 1-100 percent SDK speed. The first segment alone uses the hash-bound bootstrap_static scene and ignores DINO/SAM obstacle output, breaking the unseen-target startup cycle. Qualified robot/camera/cable self-collision geometry, floor proxy, limits, feedback, arm status, camera-clock health, exact approval, and hold-on-abort remain active.
      - At each settled pose the executor creates a unique request ID and a minimum camera stamp after settling. The heavy bridge waits up to 10 seconds for a matching new frame or idle worker, and the executor accepts only correlated status/image stamps.
      - The exact GroundingDINO job may run for up to 60 seconds. target_mask_missing does not move immediately: the executor waits up to 15 seconds for a typed scene stamped at or after that result. Zero obstacles emits an exact clear scene; obstacle-only detections reserve target ID 1, propagate IDs 2+ through SAM2, and use normal depth projection. Only then is the next exact Tesseract segment rechecked against fresh boxes. Infrastructure, malformed, stale-image, scene, or correlation failures abort and hold.
      - After a matching detection, the executor waits up to 10 seconds for callbacks newer than the result: target_status LOCKED, measured nonprediction TRACKING with a settled camera, and a valid stable base_link TrackedTarget stamped after the processed image and within 0.30 m of the hint.
      - Success causes a current-position hold, ACQUIRED, and cancellation of remaining poses. The acquisition coordinator starts the supervised workflow once and waits for SCAN_READY plus normal tracked-target viewpoints, but deliberately does not request the normal scan.
      - If acquisition terminates but perception subsequently has a fresh authoritative measured TRACKING/LOCKED target, explicit Prepare Scan from Current Lock may adopt that lock as a new scan phase, start/restart workflow assessment, and wait for SCAN_READY. It does not relabel the terminal acquisition or reuse its approval.
      - After the adopted/current measured lock and SCAN_READY, the GUI issues one /tesseract_plan_bridge/request_plan call, correlates the returned short plan ID to that exact request, and accepts only a collision-qualified plan containing exactly 13 views.
      - If all accepted looks fail to produce measured tracking, the executor holds and reports ACQUISITION_FAILED; a new hint or explicit retry is required.
    failure_modes: [invalid or reused-with-different-data session ID, stale/future/non-base-link target, stale or mismatched source_request_id/plan target, missing camera TF, duplicate command publisher, arm-status/workspace rejection, missing camera clock/joints/worker heartbeat, no IK, collision, unqualified model, hash mismatch, approval mismatch, pre-settle GroundingDINO frame, semantic timeout, missing/stale/invalid correlated scene before a later look, target more than 0.30 m from hint, MoveJ waypoint timeout or no progress, camera health loss, no measured target after bounded sweep]
    manual_smoke_checks: [exact duplicate PrepareAcquisition request is idempotent, same session ID with altered target is rejected, delayed plan from an older session is ignored, five acquisition positions are distinct at the bounded effective radius, center preserves the live camera pose when already within 0.45 m, every look vector targets hint, exact all-zero target coordinates 0.33/-0.14/0.0 return at least one fully validated plan, first proposal succeeds without a preexisting obstacle callback and contains schema-v5 bootstrap_static plus an empty obstacle list, first exact path ignores stale DINO/SAM boxes but retains robot/floor/feedback/controller-limit gates, handoff stops after 10 seconds if acceptance is impossible, pre-settle frame is rejected, unrelated or late status after cancellation is ignored, target_mask_missing with zero obstacles constructs an exact-stamp clear scene and advances even when the duplicate relay is missed, obstacle-only result uses IDs 2+ and a depth-projected scene before advancing, stale or invalid correlated scene holds, worker error holds, 60-second job timeout holds, measured target outside 0.30 m is rejected, exact ACQUIRED starts workflow once, workflow diagnostic reports measured_lock_ready from the same TrackedTarget/TrackingHealth/LOCKED tuple, no normal request occurs automatically, terminal acquisition plus fresh measured lock enables explicit adoption only, adoption restarts workflow and waits for SCAN_READY, explicit current-lock request accepts only its correlated exact 13-view result]
    current_validation: On 2026-07-24 rough acquisition and the subsequent five-view scan completed at 5 percent. On 2026-07-30 the J2 lower limit was aligned to exact enabled compact-pose feedback -0.044796192 rad after OMPL demonstrably clamped the live start to the previous -0.040522412 rad bound. The remaining compact-start rejection was resolved by hash-verified overlapping 30 mm link1/link2/link5 collision pieces and the acquisition-only recovery contract. The 2026-07-27 exact recorded-start regression for [0.33,-0.14,0.0] produced J3 -0.05 rad recovery through point 55 and a 352-point smooth plan; 5608 validation samples passed. Core and compact qualification both report hardware-qualified true. After the stale root overlay repair, a clean live proposal-only request for the same target returned valid hardware-qualified plan 4f8fc210be5b17a9 with three camera-facing viewpoints, 443 points, and real_arm_motion false. The executor reached PROPOSAL_READY, capture stayed live, and the command topic had zero publishers. No approval or motion occurred.
  gui_acquire_and_scan:
    sequence:
      - Operator starts driver and camera/perception separately; the GUI never takes ownership of them.
      - Start Tesseract Scan Stack first loads source_piper_foxy_environment.sh, which clears inherited overlays and verifies canonical package prefixes, scan_capture import, PrepareAcquisition, TesseractReadiness, source_request_id, and schema-v5 recovery/timing fields. It validates speed from 1 through 100 percent, removes the GUI manual command publisher, refuses existing automation nodes or any command publisher, and launches exactly one locked worker and one mandatory-Tesseract scan stack. Step 1 remains pending until both owned parents are alive, all critical scan nodes and services exist, a fresh worker heartbeat makes acquisition_ready true, and the executor is the sole /joint_ctrl_single publisher. Blockers are shown for up to 25 seconds.
      - Every critical scan child is launch-supervised. If the acquisition, bridge, reachability, workflow, planner, executor, or capture child exits, the scan launch parent shuts down; the GUI observes either owned parent exit, disables all automation actions, terminates the other exact owned group, and restores manual ownership only after the command topic is empty.
      - Prepare Acquisition Plan remains disabled until fresh acquisition readiness and all required services persist. It validates XYZ and publisher ownership, generates one acq-* session ID, and freezes it with the PointStamped. The GUI uses a re-entrant two-thread executor and a fresh PrepareAcquisition client endpoint for each bounded call; the first 8-second response timeout retires that endpoint and retries the exact payload once. A second timeout re-enables Step 2 while preserving the session/payload for an operator retry. A matching plan must arrive during the active attempt within 185 seconds; late callbacks, old generations, other source_request_id values, and changed targets cannot enable Step 3.
      - The first dialog displays XYZ, exact acquisition plan ID/execution hash, pose count, and selected 1-100 percent speed. Confirmation submits only that exact acquisition plan and authorizes no scan.
      - After a freshly received settled nonprediction TrackingHealth sample, Prepare Scan from Current Lock becomes available without cached workflow state. Its generation-bound phases start the stack if needed, call the workflow diagnostic service, start/restart terminal workflow state, and require a new measured_lock_ready SCAN_READY diagnostic within 15 seconds. PLAN_READY reports movable clutter and asks the operator to clear the workspace; ABORTED, missing diagnostics, incompatible states, process exit, or timeout enter retryable FAILED. After SCAN_READY, multiview_ready and its verbatim blockers replace acquisition readiness; the GUI queues one correlated request within 12 seconds and waits at most 185 seconds for exactly 13 views. No coordinator or passive GUI status callback auto-requests or auto-approves it.
      - The GUI correlates the result to the exact normal request and accepts only 13 collision-qualified views. A second dialog displays the target, exact plan ID/execution hash, 13-view count, and selected speed; only this separate confirmation submits the scan approval.
      - Automatic Scan invalidates every manual automation generation, pending recovery timer, and cached plan/status before submitting its mission. After ACQUIRED and SCAN_READY it requires one second of stable multiview_ready evidence within 30 seconds before the single exact request. Manual-tab plan/status callbacks are ignored while the mission is active.
      - At approved multiview endpoints a temporary tracker reacquisition is diagnostic; stationary joint feedback and a healthy synchronized camera clock authorize the RGB-D save. All thirteen saves remain required. Finish or non-safety abort proves the saved home for one second within 30 seconds, disables, and stops owned processes.
      - Completion ends the session. Cancel, process exit, approval failure, abort, acquisition failure, retry, replan, or another plan requests hold and requires new exact confirmations. There is no reusable 15-minute authorization.
      - Stop Scan Stack cancels first, sends SIGINT to GUI-owned process groups, and restores the manual publisher only if no command publisher remains.
    manual_smoke_checks: [contaminated shell paths are cleared and exact package prefixes/import/new interfaces resolve from piper_ros_foxy/install, Step 2 is disabled until fresh acquisition readiness and services are present, stale/malformed/not-ready worker heartbeat exposes a blocker and prevents planning, killing any critical scan child causes the launch parent to exit and disables automation, no scan or reachability subscription is destroyed/recreated during stale input, exact duplicate acquisition request is idempotent while changed data under the same session is rejected, a late old-session plan is ignored, service unavailable/service disappeared/first timeout/second timeout are distinct failures, speed below 1 or above 100 is rejected while 1/5/10/100 are accepted, selected speed is frozen into each displayed execution hash while the executor never exceeds the SDK 100-percent maximum, GUI-started Bubblewrap worker remains alive after the startup thread returns, driver/camera/perception survive GUI stack stop, duplicate worker is refused, transient _UNKNOWN_ executor identity resolves or is proven by zero-publisher prelaunch plus the live owned stack/exactly-one-endpoint/executor-node chain, missing ownership evidence or any additional publisher still fails closed, manual Send and Live Send are disabled during automation, target mismatch cannot be confirmed, acquisition confirmation cannot authorize the scan, Prepare Scan is disabled without fresh settled nonprediction tracking health, stopped-stack Step 4 can only bootstrap the owned stack and cannot request until the restarted workflow validates the full authoritative lock, terminal acquisition may be explicitly adopted but remains terminal in its own phase, adoption starts workflow and waits for SCAN_READY before requesting, no scan request occurs automatically, a stale or uncorrelated normal plan is ignored, exactly one correlated 13-view plan can receive the separate approval, GUI close cancels and stops owned children]
    current_regression_checks: [real GUI PrepareAcquisition acknowledgement returns within 8 seconds, first timeout uses a fresh endpoint and exact duplicate payload, second timeout re-enables Step 2 with the same immutable session, matching acquisition plan arrives within 185 seconds and enables Step 3, acquisition readiness cannot substitute for multiview readiness, workflow assessment has a 15-second deadline, plan queue/result deadlines are 12/185 seconds, PLAN_READY shows the clear-workspace instruction, all multiview blockers are shown verbatim, old-generation service/workflow/plan callbacks are ignored]
  supervised_viewpoint_execution:
    sequence:
      - Executor consumes only base_link, dry-run, reachable-and-safe viewpoint proposals after fresh healthy arm/tracking/obstacle inputs exist.
      - The former fixed-J6 J1-J5 numerical IK backend and helper were removed on 2026-07-24. Tesseract is mandatory; no scan-planning code path may hold J6.
      - J6 was operator-confirmed fully safe on 2026-07-17. The command-free bridge freezes a healthy scene and all-six-joint start state into a canonical hashed spool request. Valid unsafe/non-movable instances are included as collision boxes; invalid geometry blocks the snapshot. The isolated CPU worker treats J1-J6 equally; no J6 lock or special cost is permitted.
      - The current workstation geometry emits 21 candidates spanning seven azimuths over 55 degrees (120 through 175 degrees) and three camera pitches (-45, -55, and -65 degrees). Tesseract must select exactly thirteen collision-valid viewpoints; any collision/IK loss that leaves fewer than thirteen is a retryable plan failure.
      - Explicit multi-seed IK/roll filtering feeds RRTConnect OMPL. The worker applies canonical request seed 42 before any planner is constructed and rejects a mismatched request seed. ISP times the raw path, which is densified and discretely revalidated. The removed high-level OMPL/TrajOpt/ISP route is not the current implementation.
      - The bridge revalidates the bound worker response and publishes exact typed trajectories with reliable transient-local depth-1 QoS. Executor approval binds plan_id plus trajectory_sha256 and rejects Tesseract motion unless collision_model_qualified is true. The checked-in model was initially qualified on 2026-07-23, requalified with identical seed-42 output on 2026-07-24, requalified for exact all-zero acquisition egress with named positive compact-pair margins on 2026-07-25, and completed supervised five-view hardware acceptance on 2026-07-24.
      - Proposal-only mode publishes typed ScanExecutionPlan/Status and has no /joint_ctrl_single publisher.
      - Motion requires enable_real_arm_motion=true at launch plus the exact fresh plan ID and confirmation phrase through ApproveScanExecution; the executor never enables motors.
      - The bridge chooses a camera-space-diverse thirteen-view subset from the 21-candidate dome, then orders that subset with a nearest-neighbour route starting at the calibrated current camera position. This retains horizontal and vertical baselines without the former left/right endpoint pendulum.
      - Each workflow start creates a scan session ID. After every saved and accepted capture the executor publishes session-scoped camera/joint history. If Step 5 stops, Step 4 requests exactly the remaining 13-minus-accepted poses; the planner excludes accepted near-duplicates and the bridge reselects a diverse smooth remainder. A new session and capture-session completion delete the memory.
      - The driver publishes fresh hash-bound controller velocity/acceleration limits. Schema-v5 planning freezes those values plus effective aggregate SDK speed, sdk_movej_targets_v1, and the saved six-joint home pose. The isolated worker uses OMPL/ISP to establish all-six-joint goals, emits one final SDK target per viewpoint plus one final return-home target for MULTIVIEW_SCAN, sets qdot/qddot placeholders to exact zero, adaptively validates each direct SDK-interpolated segment, and hashes the complete result. A folded-start acquisition may add one proven bootstrap target. Foxy rejects any mismatch and never turns validation samples into commands.
      - >-
        During motion the executor publishes one six-position arm-only MoveJ
        endpoint exactly once per viewpoint and waits for measured feedback to
        reach 0.025 rad before capture or advancing; repeated publication is
        forbidden because it can restart PiPER interpolation. After all
        thirteen session records exist, it follows the same approved
        trajectory to `[0.0,0.0,-0.026,-0.039,0.346,0.107]`, holds there,
        calls the workflow finish service, clears session memory, and reports
        COMPLETE; that return never triggers a capture. If return-only
        telemetry or settling fails, it holds the current feedback pose and
        reports the captures COMPLETE with a return warning rather than
        scheduling Step-4/5 recovery. A non-safety abort at a reached endpoint
        may reverse only the already executed, separately approved
        acquisition/scan targets to the original loaded pose after fresh
        settled joint, arm, motion-limit, camera-clock, obstacle, and collision
        validation. Safety, stale-telemetry, hardware, progress, emergency-stop,
        ownership, and operator-cancel faults hold instead. This is the nearest
        one-joint collision-qualified adjustment from the operator feedback
        pose: J3 is 0.050 rad lower because the exact folded pose violates the
        link1/link5 and link2/link5 model. A 90-second absolute target deadline
        or 20-second total-joint no-progress interval aborts or, after all
        captures, completes with the held-pose return warning. TrackingHealth
        reductions below the frozen approved speed or a persistent confirmed
        controller-limit change also stop motion.
      - piper_ctrl_single_node sends every JointCtrl position while caching unchanged MotionCtrl_2 MoveJ mode/speed. Six-position automation commands cannot issue a GripperCtrl; explicit seven-position commands retain cached gripper behavior. Enable/disable invalidates those caches so control state is reasserted.
      - At each target, the executor first requires joint position convergence, then accepts the qualified held-feedback velocity threshold of 0.20 rad/s plus settled TRACKING. It calls the workflow capture service for quality/cloud acceptance, calls /scan_capture/capture_view to persist the fresh synchronized raw RGB/depth/mask record, and only then waits for both accepted_views and modeled_views to advance before the next viewpoint.
      - Cancel clears an idle proposal or requests a current-position hold during execution; completion leaves the arm at the final approved view.
    tesseract_sequence: [Fresh atomic worker heartbeat and acquisition/multiview readiness, healthy Foxy snapshot, fresh typed controller motion limits, session-bound acquisition or 21 normal workspace dome candidates, diverse thirteen-view subset plus smooth calibrated-start route ordering, valid obstacle boxes, explicit RequestTesseractPlan, canonical schema-v5 request hash with pipeline OMPL_ISP/sdk_movej_targets_v1/effective aggregate speed/100 Hz target-order ceiling/deterministic seed 42/return-home pose, atomic request rename, ROS-free CPU worker, seed-before-planner initialization, fresh per-request planning scene, explicit six-joint roll/IK filtering, OMPL and ISP goal establishment, one final SDK target per capture plus one multiview return-home target or optional acquisition bootstrap target, adaptive direct-segment checks, bound response/source-request/trajectory hashes, Foxy exact position/zero-derivative/home-endpoint validation, durable typed proposal, separate exact approval, collision and controller-limit freshness gates, sole executor publisher.]
    implemented_validation: The Foxy messages and affected packages build. On 2026-07-24 rough acquisition and five physical all-six-joint viewpoints completed at 5 percent using the former stop-per-sample executor. On 2026-07-29 the repaired GUI Step 2 returned promptly and exact acquisition approval reached measured lock. timed_movej_v2 had emitted 7281 targets; a later feedback-gated position-waypoint attempt reduced this to 70 but still looked segmented. One ordinary GUI SDK target then returned smoothly to compact in about two seconds. sdk_movej_targets_v1 now binds one direct target per viewpoint with an optional folded-start bootstrap target. The target-only adapter and six-position no-gripper boundary build, pass 184 focused tests, and pass both rootless collision qualifications with real_arm_motion=false, including rejection of a direct segment blocked by a thin obstacle; new physical acceptance remains to be completed.
    remaining_tesseract_validation: The sdk_movej_targets_v1 direct-target path passes both rootless collision qualifications, including explicit rejection of a path that needs an OMPL detour. The 2026-07-30 GUI run saved thirteen records and exposed the old endpoint-pendulum appearance plus a return-only telemetry timeout; the three-elevation replacement then passed the real ROS-free backend with thirteen selected views and one return segment in 29.9 seconds. Repeat the new dome physically at 5 percent, then characterize measured position progress and endpoint velocity at 1/5/10/100 percent before qualifying higher speeds; per-joint qdot/qddot tracking is not claimable through the PiPER MoveJ interface. Worker replay/fuzz/soak and cross-engine/adversarial collision work remain useful.
    state_values: [IDLE, INVALID, PROPOSAL_READY, MOVING, SETTLING, SETTLING_HOME, WAITING_FOR_FRESH_FRAME, WAITING_FOR_GROUNDING_DINO, WAITING_FOR_TRACKING_LOCK, WAITING_FOR_OBSTACLE_SCENE, ACQUIRED, ACQUISITION_FAILED, CAPTURING, CAPTURING_RGBD, WAIT_CAPTURE, FINISHING_WORKFLOW, COMPLETE, ABORTED]
    current_validation: >-
      Offline kinematics/approval tests and isolated proposal-only ROS launch passed. A live
      proposal-only run on 2026-07-14 correctly produced no executable route from the compact
      post-zero pose: J2 feedback was about -0.017 rad versus the URDF 0 rad lower limit, the
      conservative model flagged wrist/base self-clearance at the starting configuration, and the
      configured -10-degree orbit pitch placed viewpoints below minimum camera height for the
      observed target. On 2026-07-17 the live proposal path found 12 workspace-safe candidates but
      correctly rejected all of them because the nearest initial camera step was 0.380 m versus the
      configured 0.250 m maximum. The typed invalid plan now preserves the 12-candidate count and
      reports that exact limit. The workflow start service stayed responsive after avoiding unused
      full-cloud decoding and retaining all Foxy subscription objects, but SCAN_READY remained
      blocked because the upstream SAM2 target-mask publisher was absent and no fresh LOCKED
      landmark could be produced. That historical run did not verify automatic execution and its
      safety thresholds were not relaxed. A separate supervised manual driver test on 2026-07-20
      successfully moved J6 from 0.006018 rad to 0.026306 rad at 5 percent and returned it to
      0.008111 rad with err_code zero and motion_status zero. The first command normalized the
      slightly negative J2 start to 0.0, so limit/model reconciliation remains required. This
      validates free physical J6 and the driver command path. A later 2026-07-24 run completed
      five automatic collision-qualified viewpoints at 5 percent with five accepted and modeled
      captures after fixing Target3D post-motion re-anchoring, tracking freshness, workflow
      diagnostics, target-cloud QoS, and capture/status ordering.
  real_joint_move:
    sequence: [Operator starts driver, operator explicitly enables arm, either the GUI or separately opted-in approved scan executor publishes bounded JointState targets, driver clips bounds and sends SDK joint commands, feedback updates /joint_states_single and TF.]
    warning: This is a hardware flow. Never run GUI and automatic executor command publishers together; the dry-run coordinator itself remains command-free.
  gui_3d_joint_preview_move:
    sequence:
      - Graphical tab launches piper_description/joint_preview.launch.py, creating a preview_-prefixed TF tree and STL RobotModel separate from live TF.
      - Load Live Arm publishes current feedback to /piper_gui/preview_set without a hardware command.
      - Operator drags six large orange RViz rotation rings rendered outside the STL bodywork; piper_joint_preview_node projects each marker pose onto its URDF local Z axis, clamps the joint limit, and publishes /piper_gui/preview_joint_states.
      - The preview robot_state_publisher moves only the 3D digital twin; /joint_ctrl_single remains untouched.
      - Confirm Mirror rechecks feedback freshness and arm err_code, validates the interpolated robot/floor path, asks for final confirmation, preserves the gripper, and publishes the previewed six angles once at no more than 10 percent speed.
    failure_modes: [editor launch failure, missing preview state, stale feedback, missing/error arm status, joint limit, conservative floor/self-clearance rejection]
    warning: No live obstacle geometry is consumed by this manual mirror path; keep the physical workspace clear and never run it with the motion-enabled automatic executor.
  save_export:
    scan_capture: scan_capture_node writes per-view RGB PNG, raw depth NPY, 16-bit millimetre depth PNG, mask PNG, and YAML camera/joint/plan metadata under dataset_root, default datasets/active_scan. In supervised service mode, a failed/stale/unsynchronized write aborts and holds instead of silently skipping a view.
    target_cloud: Supervisor sends "save" on /piper/target_cloud_request; target_cloud_node owns point-cloud persistence/status.
    validation_reports: obstacle_repeatability_validator writes JSON reports under /tmp/piper_obstacle_validation.
manual_smoke_checks:
  gpu_pipeline_shutdown: [With motors disabled confirm process_groups.txt lists all owned groups, press Ctrl+C and verify all stop and the manifest disappears; simulate wrapper loss in a process-only test and verify the stop script removes only validated groups.]
  environment: [All terminals report ROS_DOMAIN_ID=42 and ros2 node list has no duplicate core nodes. Driver/camera/perception normally report ROS_LOCALHOST_ONLY=1; the GUI and supervised scan process tree intentionally report 0 while FASTRTPS_DEFAULT_PROFILES_FILE points at fastdds_gui_udp_only.xml, whose 127.0.0.1 allowlist preserves local-only communication and whose disabled builtin transport prevents Fast DDS shared-memory replay.]
  gui_scan_stack_startup: [With no external scan stack, launch start_gui.sh under domain 42 and confirm idle RSS remains near tens of MiB rather than growing without bound; press Step 1 only, verify GUI RSS remains bounded, all GUI-owned scan nodes and the Tesseract worker start, GroundingDINO/SAM2 PIDs do not change, the kernel records no new OOM, no approval or arm motion occurs, and closing the GUI removes every owned scan/worker process. test_gui_transport_profile.py must pass and a profile probe must show no /dev/shm descriptors.]
  arm_read_only: [start_piper logs auto_enable false, can0 stays ERROR-ACTIVE, sustained 0x2A1 and 0x2A5-0x2A7 feedback arrives, /joint_states_single contains real current positions, /arm_status has no error, exact-QoS subscribers receive both topics after graph/process churn, the monotonic feedback loop remains capped near 200 Hz, no command publisher is started unintentionally.]
  arm_enable_disable: [With the arm supported, workspace clear, emergency stop ready, and no joint-command publisher, call GUI enable and require all motor feedback to confirm within enable_timeout; verify retries use the 10 ms SDK handshake and no gripper command is interleaved; before disable select GUI Cancel / Hold, then select GUI Disable and verify it commands fresh current feedback through the sole owner, observes no more than 0.025 rad target error and 0.005 rad sample motion for one full second, and only then calls the service; require all motor feedback false. A failed eight-second settle proof must leave motors enabled. Do not command a different zero/home pose immediately before disable.]
  gui_3d_joint_preview: [With motors disabled open the editor, verify STL meshes and six rotation rings, load live feedback, drag each ring slightly, verify preview_ TF and /piper_gui/preview_joint_states change while /joint_ctrl_single has no new publisher/message from the preview node, and verify limits snap correctly.]
  gui_3d_joint_mirror: [Complete arm_read_only and TF checks first, stop the automatic executor, clear the workspace, keep emergency stop ready, preview one small single-joint change at 5 percent, confirm once, verify driver-bound clipping and feedback convergence, reset preview to live, then disable the arm.]
  tf: [display_live_robot publishes world through base_link through link1..link6 from /joint_states_single, tf2_echo base_link link6 agrees with mode-0 FK, tf2_echo base_link camera_link updates with arm joints, tf2_echo base_link camera_color_optical_frame resolves after camera startup, fixed-board validation passes at three or more representative stationary poses after the J6 zero change, no visualization node publishes /joint_ctrl_single.]
  perception_static: [/piper/camera_timestamp_health is HEALTHY with offset magnitude at most 0.5 seconds and 15 or more consecutive valid frames, /piper/sam2_target_mask nonempty, /piper/target_3d valid, target_tracker continues receiving base_link TF while Target3D arrives at 5 Hz, /piper/tracked_target valid and stable, /piper/tracking_health TRACKING, tracked_object_frame visible in RViz.]
  camera_timestamp_recovery: [With motors disabled and fresh stationary joint feedback, inject a simulated large/backwards timestamp in tests and verify CAMERA_CLOCK_INVALID plus no proposal; live-test by confirming healthy status, never by changing the host clock. Verify the retained reliable depth-1 joint subscription remains present in ros2 topic info and continuously receives current positions under the 200 Hz stream and after a pipeline restart; if callbacks are stale verify the read-only endpoint is recreated no faster than joint_subscription_retry_sec and recovery stays blocked until fresh stable positions arrive; noisy at-rest reported velocity with stable positions still permits recovery, actual position change suppresses it, a stationary fault creates one recovery request, full-stack restart backoff is capped, motion/unknown feedback creates no request, and /joint_ctrl_single publisher count is unchanged.]
  low_confidence_recovery: [Feed valid tracked confidence below 0.60 for less than one second and verify no request; sustain it beyond one second while settled and verify exactly one direct heavy request; verify motion defers it, single-flight/cooldown remain active, and confidence must exceed 0.70 before it can rearm.]
  stationary_cube_small_motion: [Keep cube centered and stationary, move J1 then J2 only by small supervised increments, verify cube remains in view, base_link target drift stays about 10-15 mm or less, and after the two-attempt burst any ABSENT refresh occurs no faster than the configured periodic interval.]
  dry_run_invariant: [/piper/supervised_workflow_status says dry_run true and real_arm_motion false, no /joint_ctrl_single publisher originates from workflow.]
  scan_executor_proposal_only: [Launch without motion opt-in, confirm /piper/scan_execution_plan is typed and dry_run, confirm /joint_ctrl_single has no publisher from the executor or Tesseract bridge, verify wrong plan ID/trajectory hash/confirmation and expired plan are rejected, verify collision_model_qualified=false rejects execution.]
  rough_target_acquisition: [With motion disabled call /scan_target_acquisition/prepare with a unique session and fresh base_link PointStamped, retry the exact request and verify idempotent acceptance, reject the same ID with altered target, verify centered bounded looks and matching source_request_id through schema-v5 bootstrap_static proposal, ignore a delayed plan from another session, replay the exact compact start and require recovery endpoint 55/J3/-0.05 plus 352 points and 5608 samples, reject recovery metadata on later segments or MULTIVIEW_SCAN, reject unknown/excessive/worsening contacts, verify Foxy proxy clearance reaches 60 mm at the boundary, verify planning without a preexisting obstacle callback, reject stale/future/wrong-frame targets, confirm normal scan remains tracking/scene gated, then under supervised 5-percent acceptance approve the exact acquisition hash, verify measured-lock handoff, no-lock hold, and cancel-to-hold.]
  proposal_feedback_delivery: [With driver and perception already publishing, launch the proposal stack in its staggered order; verify the worker heartbeat remains fresh and readiness blockers clear, verify the filter receives fresh typed /arm_status and reports nonzero reachable/safe candidates, verify bridge/reachability subscriptions remain stable without runtime destruction/recreation, request a plan, observe the same request ID transition PLANNING to PROPOSAL_READY or a structured worker rejection, kill one critical child and verify the scan parent exits and the GUI disables automation, and confirm /joint_ctrl_single still has zero proposal-stack publishers.]
  tesseract_worker_offline: [Run qualify_rootless_worker.sh and retain its PASS output, record the rootfs/wheel/complete environment lock and SBOM, extend FK comparison to recorded/random/boundary poses, exercise a blocking-box detour, replay canonical hashes, reject stale/malformed/oversize/symlink inputs, run teardown/crash soak and thin-obstacle/rotating-link/self-collision regressions, verify worker has no ROS/CAN/GPU/network access.]
  scan_executor_real_motion: [Complete environment, arm_read_only, tf, perception_static, stationary_cube_small_motion, and proposal-only checks first; ensure GUI/reset publishers are stopped; keep emergency stop ready; use 5 percent for the first sdk_movej_targets_v1 physical regression and treat every higher speed as dynamically unqualified until measured; verify fresh valid /piper/motion_limits and matching plan hash; approve the exact acquisition trajectory hash separately; verify each arm-only target is one of the exact Tesseract-qualified waypoints, no GripperCtrl is produced, feedback convergence advances it once, and J6 remains unrestricted; induce only a safe bounded cancel to verify hold; after measured ACQUIRED and SCAN_READY explicitly request and separately approve one fresh exact 13-view trajectory hash; verify the selected set spans all three elevation bands, ordinary limits and collision clearance across all six freely planned joints including J6, waypoint/no-progress aborts, driver mode caching, endpoint position/velocity settle, capture at each view, no target drift over 15 mm, and exactly one complete fresh RGB/depth/mask/metadata record for every accepted viewpoint; after terminal capture select GUI Cancel / Hold, wait for settled feedback at the exact current pose, then GUI Disable and stop the camera/perception stack.]
  robot_visualization: [Start display_live_robot.launch.py for feedback-only live TF/RViz or joint_preview.launch.py for private preview_-prefixed editing. No current launch combines fake joint states, RViz, and the real driver; the removed command-coupled launch must not be recreated.]
autonomous_target_scan_flow:
  - Tracked robot sends one fresh SCAN_3D goal in odom and keeps localization/TF alive while the base remains stationary and braked.
  - Gateway snapshots odom to piper_base_link, hashes the immutable task, and supplies a 2 Hz heartbeat.
  - Local listener starts the disabled driver, then requires its service plus two seconds of fresh, coherent, settled feedback stamped after that driver generation before camera startup.
  - Camera/watchdog/perception must produce healthy timestamp frames and current-run GroundingDINO/SAM2 CUDA ready markers before hand-eye starts; hand-eye must publish a transform stamped after its start before a new Tesseract worker generation is accepted; only then may the sole scan executor start.
  - Typed acquisition readiness and another two-second current-generation joint-feedback stability window are required before task-bound authorization, feedback-confirmed enable, and settled current-pose hold. Every boot barrier is bounded and process exit, stale generation, or timeout prevents dependent startup.
  - Rough acquisition runs the bounded look sweep and correlated post-settle GroundingDINO/SAM2 refresh.
  - Workflow requires fresh measured SCAN_READY; beneficial contact remains blocked until manipulation_ready is physically qualified.
  - Exactly one normal request is correlated by full request ID, approved under the task hash, and captures exactly 13 diverse views.
  - After approved home, the listener proves current hold, disables, revokes authority, and stops every owned process group.
  - Only safe_shutdown=true permits tracked-robot power-down; NEEDS_OPERATOR leaves it paused.
  - Offline TSDF reconstruction is separate and cannot change arm-task success.
