  gui_3d_joint_preview_move:
    sequence:
      - Graphical tab launches piper_description/joint_preview.launch.py, creating a preview_-prefixed TF tree and STL RobotModel separate from live TF.
      - Load Live Arm publishes current feedback to /piper_gui/preview_set without a hardware command.
      - Operator drags six large orange RViz rotation rings rendered outside the STL bodywork; piper_joint_preview_node projects each marker pose onto its URDF local Z axis, clamps the joint limit, and publishes /piper_gui/preview_joint_states.
