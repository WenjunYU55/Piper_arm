  result: The final physical run locked on look 1 and failed retryably because one unknown depth foreground obstacle was unsafe and non-movable. safe_shutdown=true; capture_count=0; every mission child stopped; coordinator, GUI and RViz remained; direct CAN reported all six enable flags false.
