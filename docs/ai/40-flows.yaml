  failure_modes: [capture shape cropped or malformed -> capture rejection before persistence, transform missing malformed wrong child or outside synchronization window -> capture rejection, success response missing or digest-invalid seed -> executor abort before workflow acceptance, accepted history shape/seed mismatch -> history rejection, qualified planner receives seed -> no live TF dependency]
  manual_smoke_checks: [compare model seed shape stamp to view_000 mask_topic_timestamp, compare seed transform stamp and matrix to view_000 camera_transform, require delta <=0.100 seconds, corrupt one matrix element and require digest rejection, return legacy plain saved response on capture one and require abort, delay planner beyond TF cache lifetime and require the recorded-matrix path still builds the same envelope, require no qualified population before accepted capture]
