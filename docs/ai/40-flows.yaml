  behavior:
    exterior_depth_halo: discard as not target-relevant
    explicit_hand_or_person: publish UNSAFE and block manipulation
    qualified_pen_marker_or_stick: publish MOVABLE subject to unchanged geometry and contact-policy gates
    unknown_or_unqualified: publish BLOCKED rather than UNSAFE; do not authorize contact
    missing_metadata: remain invalid and BLOCKED
  manual_smoke_checks: [Replay heavy job 1787496414_574036992_request_sam2_event_1787496415100 and require zero retained target-local depth obstacle pixels, run a real or synthetic target-crossing occluder and require it remains retained, verify a hand result populates unsafe mask, verify unknown metadata never populates unsafe mask and never becomes MOVABLE]
