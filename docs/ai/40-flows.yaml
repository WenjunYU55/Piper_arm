startup_j6_wrong_direction_incident_2026_08_11:
  task: gui-sim-ef30b4cc466f488ba1331d08b6432d34
  preflight: Separate no-command smoke proved 583 consecutive all-six-enabled fault-free samples, then feedback disable. The GUI mission passed driver/camera/perception/planner startup and began STARTUP_WRIST at five percent.
  physical_sequence: Measured J6 began near -3.196745 rad. The old -3.139536232 storage profile selected increasing motion toward zero, observed physically as anticlockwise. Near -3.105395 rad J6 asserted collision_status and driver_error_status.
  containment: Continuous motor authority revoked immediately. No hold, home, storage or disable command was attempted after the fault. The driver watchdog proved six false flags, mission children stopped, camera ownership cleared and the durable result reported NEEDS_OPERATOR/CONTROL_UNTRUSTWORTHY, zero captures and safe_shutdown=false. Five direct read-only samples then showed six false flags, no faults and err_code zero.
  repair: The operator corrected the earlier direction interpretation. Schema-v3 now binds negative storage, increasing startup and decreasing inverse storage. Pre-enable measured-branch validation refuses a positive non-ready branch. Schema-v2 remains diagnostic-only. The superseded positive/decreasing repair must not be restored.
  physical_gate: Inspect the cable/wrist after the collision flag, complete software/rootless requalification, then obtain explicit authorization for another five-percent startup-only test from the current negative branch. Require monotonically increasing J6 feedback toward zero and immediate motor-fault containment.
  deployed_pre_enable_proof: Rebuilt GUI task gui-sim-a19ebc603a124a12b37e73ee8527a8c9 started only disabled process groups, reached the schema-v3 branch gate, emitted no enable request, rejected measured negative J6 with CONTROL_UNTRUSTWORTHY, stopped every child and returned safe_shutdown=true/zero captures. Final direct read-only feedback was six disabled flags, no faults and J6 -3.126426 rad. Coordinator, GUI and RViz remain idle.
  live_attempt_and_fix: >-
    The first GUI attempt stopped before enable on stale calibration revalidation
    metadata; the corrected-scale five-pose authority was then linked and all
    offline gates passed. The second attempt enabled and physically moved J6
    from storage approximately -3.08 rad to ready approximately -0.02 rad at
    five percent, then stopped before rough home because array('d') joint
    feedback was rejected as not list/tuple and STORAGE_WRIST was compared with
    the rough-home endpoint. The parser now accepts generic six-value sequences
    and direct-home evidence binds each exact stage goal; 162 defect-focused,
    387 package and 282 focused integration tests plus both rootless suites
    pass. At operator request no further motion occurred: mission children and
    camera ownership were stopped, all six motors were feedback-disabled, CAN
    remained NORMAL/no-fault, and coordinator/GUI/RViz remained resident.
    Physical testing is paused until explicit reauthorization.
  authorized_retest_result: >-
    GUI mission gui-sim-db30606e55a54e0a9711d9758a175342 loaded the fixed
    coordinator and proved STARTUP_WRIST, ROUGH_HOME, first acquisition motion,
    controllable-failure direct ROUGH_HOME, STORAGE_WRIST and feedback disable
    at five percent. Final read-only joints were
    [-0.001676,-0.044349,0.018535,0,0.380761,-3.110840], all six enable flags
    were false, CAN was NORMAL/target-reached/error-zero, every mission child
    stopped and coordinator/GUI/RViz remained. Acquisition then returned
    retryable NO_REACHABLE_PLAN because a transient stale motion-limit hold
    reset runtime_refresh_allow_missing_obstacles and waited ten seconds for an
    obstacle stream that bootstrap_static look zero intentionally lacks.
  runtime_refresh_fix: >-
    begin_runtime_recovery now derives missing-obstacle authority from the exact
    interrupted plan kind, viewpoint and state. First-look bootstrap_static can
    recover a transient motion-limit sample and resume the same approved target;
    moving MULTIVIEW_SCAN remains obstacle-gated. One hundred four executor
    tests and 284 focused cross-stack tests pass, both packages rebuild, and
    both rootless suites return PASS with real_arm_motion=false.
  target_only_obstacle_retry_result: >-
    GUI mission gui-sim-345df21ee3d14d959b15a006f38a758c then reached a
    measured green-cube lock, passed a fresh request-correlated CLEAR workflow
    probe and persisted three GOOD/CLEAR synchronized captures in
    scan_20260810_212646. During the fourth moving multiview segment, SAM2
    target masks, target 3D and scan quality remained live but
    /piper/obstacle_instances_3d expired, so the strict motion gate held and the
    mission returned retryable NO_REACHABLE_PLAN. Direct ROUGH_HOME,
    STORAGE_WRIST, stable hold, six disabled flags and child cleanup succeeded.
    An initial contributor was a blocking exact-time TF lookup performed even for
    target-only ID images with no obstacle geometry. Those frames now publish
    their timestamped empty clear scene before TF; IDs 2+ retain the full
    projection path. A subsequent retry proved this was incomplete: target loss
    under motion blur placed SAM2 in WAITING_FOR_SEED, stopping all ID-frame
    output. The exact fresh pre-motion scene is now allowed to age only during
    its one collision-qualified MULTIVIEW_SCAN MOVING segment; new blocked or
    invalid scene data still stops, and a next segment still needs a fresh
