stable_target_candidate_refresh_2026_08_06:
  trigger: A measured cube remains stationary while the post-acquisition workflow and correlated semantic occlusion probe settle.
  sequence:
    - Every fresh valid TrackedTarget callback evaluates material target/history change and a separate 0.5-second liveness deadline.
    - Material change rebuilds candidate geometry immediately subject to the 0.5-second anti-churn period; otherwise the liveness deadline rebuilds the same deterministic flexible-distance candidates.
    - The reachability filter revalidates and republishes the safe candidates, keeping the bridge's 1.0-second multiview input fresh.
    - SCAN_READY may then request exactly one Tesseract-qualified view; freshness never authorizes motion by itself.
  failure_mode: Missing fresh tracking still lets candidate data expire and blocks multiview readiness. A stationary target is no longer itself a reason for expiry.
  manual_smoke_checks:
    - With a locked stationary cube, observe /piper/scan_viewpoints and /piper/reachable_scan_viewpoints update at least once per second throughout the occlusion-readiness wait.
    - Confirm /piper/tesseract_readiness remains multiview_ready after one continuous second before the first plan request.
    - Stop fresh target tracking and confirm readiness becomes stale rather than replaying cached authority.
capture_rejection_replacement_2026_08_06:
  sequence:
    - At a settled approved view, the capture service requires a fresh synchronized RGB-D bundle plus fresh GOOD quality and CLEAR occlusion.
    - Missing/stale quality or occlusion, or a future-TF publication lag, keeps the arm held and retries the identical capture for at most ten attempts.
    - Fresh visual rejection records that proposal in session history and publishes VIEW_REJECTED without starting terminal abort or return-home retrace.
    - The coordinator requests one replacement after stable multiview readiness; transient tracking/camera approval blockers may clear for up to five seconds before the unchanged exact plan is rejected.
  failure_modes:
    - Exhausted evidence retries abort because visual authority was never obtained; the pose is not falsely marked visually bad.
    - Exhausted eight-view replacement budget fails the mission and runs guarded home/hold/disable cleanup.
  manual_smoke_checks:
    - Delay occlusion publication at a settled pose and verify no extra joint command is emitted while same-pose capture retries occur.
    - Inject fresh non-CLEAR evidence and verify VIEW_REJECTED, excluded history, one replacement request, and no return-home motion.
    - Inject collision/hash/control rejection and verify it is never retried as a visual replacement.
multi_target_queue_2026_08_11:
  sequence:
    - The gateway validates and immediately snapshots each fresh odom target into the local base frame, then writes one immutable hashed spool goal per task.
    - The local coordinator holds a one-second coalescing window, orders pending targets by Euclidean base-frame distance with arrival-order ties, and dispatches exactly one.
    - The active target performs its complete acquisition, occlusion, adaptive GOOD/CLEAR capture, direct-home, disable, child-stop and durable-result transaction without pre-emption.
    - Runtime caches and process generation are reset only after that terminal boundary, then the closest remaining target starts.
  failure_modes: [more than eight gateway admissions, conflicting duplicate task ID, queued cancellation, stale/corrupt spool hash, active mission without safe terminal cleanup]
  manual_smoke_checks: [With real motion disabled submit two base-frame goals inside one second in far-then-near order and verify QUEUED feedback plus near-first dispatch, verify only one process generation exists, cancel the remaining queued goal and verify no arm resource starts for it, inject one fresh bad capture in a separate dry run and verify accepted count is unchanged and a different view is requested]
  current_evidence: An isolated ROS-domain local-action smoke with manage_processes=false submitted 0.80 m then 0.30 m goals inside the batching window. Both published QUEUED, only the 0.30 m goal entered STARTING, queued and active client cancellations both returned CANCELLED with safe_shutdown=true, no hardware service/command existed, and the coordinator exited cleanly. A second two-domain smoke proved the complete external odom action through static TF snapshot, gateway heartbeat, hashed spool, local near-first dispatch and both durable results. The first run exposed and the rerun fixed missing action QUEUED feedback plus an invalid Foxy CANCELED transition on coordinator SIGINT; normal gateway Ctrl+C now exits without propagating KeyboardInterrupt.
target_drift_refresh_2026_08_06:
  trigger: The latest measured target center differs from the plan-bound center by more than 0.015 m before approval.
