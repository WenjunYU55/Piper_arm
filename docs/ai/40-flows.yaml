    plus nearest-current-camera fallbacks in the bounded shortlist. Automatic completion
    uses an eight-view model seed and at most twenty-four achieved-FK views, two per Y side, 120-degree azimuth and 25-degree
    elevation. Any rejected proposal remains
    non-motion evidence and cannot suppress a separately collision-validated current-state
    home transaction.
