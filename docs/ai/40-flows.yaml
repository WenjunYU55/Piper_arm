  geometry_root_cause: Exact transformed CAD triangles give a link6-fixed installed holder/L515 envelope center [-0.029750002,0,0.0375] m and size [0.1395,0.10572671,0.053] m. At the incident pose its floor clearance is 0.001245441 m; the required margin is 0.005 m. The former small centerline proxy falsely appeared clear.
