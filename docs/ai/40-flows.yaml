  manual_smoke_checks: [prove no crop classification or revolution occurs at rough ACQUIRED, prove first motion uses only bootstrap rays and no target envelope, prove rejected capture discards the seed and creates no final population, prove accepted capture one creates one envelope with bootstrap_anchor_m equal the surface lock and planning_anchor_m equal axis_origin_m, prove the next generation emits population_reset and all rays aim at planning_anchor_m, prove bootstrap culls fail qualified identity matching, prove later target noise cannot move the qualified centre, retain all crop retry aim Tesseract capture home disable and cleanup checks]
