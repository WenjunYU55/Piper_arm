  save_export:
    scan_capture: After the executor reaches CAPTURING_RGBD, scan_capture_node records the request time and collects exactly 20 new synchronized native L515 depth/camera-info/confidence frames while the achieved pose is held. Image callbacks continue in a separate callback group; the service does not reuse a historical trailing window. Collection uses the executor's existing 20-second capture_timeout_sec with two seconds reserved for the Trigger response. The recorder exact-correlates one SAM mask to one representative RGB frame, fuses nonzero grade-qualified burst depth with a per-pixel median and 0.50 temporal-support floor, projects target support through the timestamped depth-to-colour transform, and transactionally writes schema-2 artifacts. Missing frames or correlation gaps reject rather than fabricating data; ambiguous or low-confidence depth rejects the view; malformed provenance or persistence failure aborts. Per-frame motion provenance still comes from CAPTURING_RGBD and the recorder remains command-free.
    target_cloud: Supervisor sends "save" on /piper/target_cloud_request; target_cloud_node owns point-cloud persistence/status.
    validation_reports: obstacle_repeatability_validator writes JSON reports under /tmp/piper_obstacle_validation.
