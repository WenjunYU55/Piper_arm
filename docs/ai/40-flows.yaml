  tf: [display_live_robot publishes world through base_link through link1..link6 from /joint_states_single plus the fixed gripper/camera visual subtree; tf2_echo base_link link6 agrees with mode-0 FK; tf2_echo link6 gripper_base reports zero translation and yaw pi; tf2_echo gripper_base camera_holder reports translation x=-0.036 m y=0 m z=0.044 m with zero rotation; tf2_echo camera_holder l515_visual reports translation x=0.1 m y=0 m z=0 m with rpy (-pi,pi,pi/2). The deployed link6-to-camera_color_optical transform must report translation x=-0.0781312284 m y=-0.0002000813 m z=0.0399998398 m and quaternion x=0.0098874361 y=-0.0059508568 z=-0.7071211962 w=0.7069981894. In l515_visual, depth optical must be (0,0,-0.008224997) m with straight axes and colour optical must be (-0.0002000813,0.0141312284,-0.0040001602) m with the factory skew, while base_link-to-camera_link continues updating from joint feedback and the RealSense internal static edge. Before powered mission motion, require a read-only visual overlay, at least five new stationary-board poses within the configured limits, and stationary target base-frame repeatability; the old 5.45 mm/0.97-degree report is pre-registration evidence only. No visualization node publishes /joint_ctrl_single.]
  perception_static: [/piper/camera_timestamp_health is HEALTHY with offset magnitude at most 0.5 seconds and 15 or more consecutive valid frames, /piper/sam2_target_mask nonempty, /piper/target_3d valid, target_tracker continues receiving base_link TF while Target3D arrives at 5 Hz, /piper/tracked_target valid and stable, /piper/tracking_health TRACKING, tracked_object_frame visible in RViz.]
  camera_timestamp_recovery: [With motors disabled and fresh stationary joint feedback, inject a simulated large/backwards timestamp in tests and verify CAMERA_CLOCK_INVALID plus no proposal; live-test by confirming healthy status, never by changing the host clock. Verify the retained reliable depth-1 joint subscription remains present in ros2 topic info and continuously receives current positions under the 200 Hz stream and after a pipeline restart; if callbacks are stale verify the read-only endpoint is recreated no faster than joint_subscription_retry_sec and recovery stays blocked until fresh stable positions arrive; noisy at-rest reported velocity with stable positions still permits recovery, actual position change suppresses it, a stationary fault creates one recovery request, full-stack restart backoff is capped, motion/unknown feedback creates no request, and /joint_ctrl_single publisher count is unchanged.]
  low_confidence_recovery: [Feed valid tracked confidence below 0.60 for less than one second and verify no request; sustain it beyond one second while settled and verify exactly one direct heavy request; verify motion defers it, single-flight/cooldown remain active, and confidence must exceed 0.70 before it can rearm.]
  stationary_cube_small_motion: [Keep cube centered and stationary, move J1 then J2 only by small supervised increments, verify cube remains in view, base_link target drift stays about 10-15 mm or less, and after the two-attempt burst any ABSENT refresh occurs no faster than the configured periodic interval.]
  dry_run_invariant: [/piper/supervised_workflow_status says dry_run true and real_arm_motion false, no /joint_ctrl_single publisher originates from workflow.]
  scan_executor_proposal_only: [Launch without motion opt-in, confirm /piper/scan_execution_plan is typed and dry_run, confirm /joint_ctrl_single has no publisher from the executor or Tesseract bridge, verify wrong plan ID/trajectory hash/confirmation and expired plan are rejected, verify collision_model_qualified=false rejects execution.]
  rough_target_acquisition: [With motion disabled call /scan_target_acquisition/prepare with a unique session and fresh base_link PointStamped, retry the exact request and verify idempotent acceptance, reject the same ID with altered target, verify centered bounded looks and matching source_request_id through schema-v5 bootstrap_static proposal, ignore a delayed plan from another session, replay the exact compact start and require recovery endpoint 55/J3/-0.05 plus 352 points and 5608 samples, reject recovery metadata on later segments or MULTIVIEW_SCAN, reject unknown/excessive/worsening contacts, verify Foxy proxy clearance reaches 60 mm at the boundary, verify planning without a preexisting obstacle callback, reject stale/future/wrong-frame targets, confirm normal scan remains tracking/scene gated, then under supervised 5-percent acceptance approve the exact acquisition hash, verify measured-lock handoff, no-lock hold, and cancel-to-hold.]
  proposal_feedback_delivery: [With driver and perception already publishing, launch the proposal stack in its staggered order; verify the worker heartbeat remains fresh and readiness blockers clear, verify the filter receives fresh typed /arm_status and reports nonzero reachable/safe candidates, verify bridge/reachability subscriptions remain stable without runtime destruction/recreation, request a plan, observe the same request ID transition PLANNING to PROPOSAL_READY or a structured worker rejection, kill one critical child and verify the scan parent exits and the GUI disables automation, and confirm /joint_ctrl_single still has zero proposal-stack publishers.]
  tesseract_worker_offline: [Run qualify_rootless_worker.sh and retain its PASS output, record the rootfs/wheel/complete environment lock and SBOM, extend FK comparison to recorded/random/boundary poses, exercise a blocking-box detour, replay canonical hashes, reject stale/malformed/oversize/symlink inputs, run teardown/crash soak and thin-obstacle/rotating-link/self-collision regressions, verify worker has no ROS/CAN/GPU/network access.]
  scan_executor_real_motion: [Complete command-free and read-only gates first; keep emergency stop ready; the current v3 20-percent timing behavior is physically accepted but staged 1/5/10-percent and deliberate cancel-to-hold remain; verify fresh matching motion-limit and trajectory hashes; confirm 20 Hz arm-only targets retain every source vertex without GripperCtrl, intermediate stop-and-go waits, burst catch-up or path shortcuts; inspect planned/actual duration, achieved rate, maximum interval, dropped samples and following error after each segment; verify measured following error stays below 0.30 rad and the final point alone receives convergence/settle proof; deliberately exercise a safe cancel-to-hold; confirm configured startup/home/storage remain exact direct two-point stages; then validate acquisition, adaptive multiview captures and terminal cleanup. Treat settings above 20 percent as capped and unqualified until separately measured.]
  robot_visualization: [Start display_live_robot.launch.py for feedback-only live TF/RViz or joint_preview.launch.py for private preview_-prefixed editing. No current launch combines fake joint states, RViz, and the real driver; the removed command-coupled launch must not be recreated.]
autonomous_target_scan_flow:
  - Tracked robot sends one fresh SCAN_3D goal in odom and keeps localization/TF alive while the base remains stationary and braked.
  - Gateway snapshots odom to piper_base_link, hashes the immutable task, and supplies a 2 Hz heartbeat.
  - Local listener starts the disabled driver, then requires its service plus two seconds of fresh, coherent, settled feedback stamped after that driver generation before camera startup.
  - Camera/watchdog/perception must produce healthy timestamp frames and current-run GroundingDINO/SAM2 CUDA ready markers before hand-eye starts. The GroundingDINO marker is printed only after local-cache-only model preload completes; no mission motion may overlap first-use Hugging Face resolution or model construction. Hand-eye must publish a transform stamped after its start before a new Tesseract worker generation is accepted; only then may the sole scan executor start.
  - Typed acquisition readiness and another two-second current-generation joint-feedback stability window are required before task-bound authorization and feedback-confirmed enable. Startup then publishes and acknowledges the exact measured current-position hold without imposing a second 0.005-rad settle proof. Plan approval occurs before a command endpoint exists, so its position window is anchored to current measured joints; ordinary scan endpoint execution and capture retain target-bounded settling. Every boot barrier is bounded and process exit, stale generation, or timeout prevents dependent startup.
  - Rough acquisition submits one look transaction at a time from fresh measured camera TF/joints: current/center first, then distinct compact 15-degree neighborhoods, maximum five. Each settled look runs correlated GroundingDINO/SAM2 and a measured lock stops immediately.
  - Workflow requires fresh measured SCAN_READY. If leaf/branch clutter exists it publishes either a support-verified pick/place proposal or an outward-push proposal; beneficial contact remains blocked until manipulation_ready is physically qualified.
  - Automatic normal planning uses one view per exact request. Candidates span six distance bands and seven elevation bands over face/axis-like azimuth directions; accepted history records achieved FK camera pose/look and ranks the next safe reachable view by new coverage. GOOD/CLEAR persistence remains mandatory. Rejected poses are excluded and replanned from current hold. Eight records are only the measured-model seed floor; completion remains adaptive through at most twenty-four and requires two achieved views on each Y side, 120 degrees of azimuth, 25 degrees of elevation and three consecutive masked-surface novel gains at or below 0.02.
  - If target_status briefly becomes LOW_CONFIDENCE, LOST or SEARCHING after a one-view proposal but before approval, the arm remains held and no frame is saved. Existing SAM2/GroundingDINO recovery gets at most 30 seconds to restore a fresh measured lock. The exact proposal is then fully revalidated; changed target center forces a new one-view plan, while collision/path/scene/control/hash/worker rejection remains terminal fail-closed.
  - If fresh obstacle/runtime liveness drops while one endpoint is in flight, the executor commands and proves a current-feedback hold while retaining the interrupted endpoint as inert resume state. It may reissue that exact endpoint only after fresh obstacle, joint, arm, camera and limit authority all recover inside the bounded timeout; the hold is never tested against the interrupted goal.
  - Automatic completion/failure/cancel stops current work, requires fresh finite measured joints, then requests PRE_HOME, ROUGH_HOME and STORAGE_WRIST directly through ExecuteHomeStage/native MoveJ; the Tesseract worker is not consulted. Camera and semantic-scene freshness plus robot self-collision evaluation are absent only for these configured stages; installed-holder external clearance remains mandatory. A disabled/storage start may be at most 0.3 rad outside a coordinate boundary only as the exact first point, each stage goal remains strictly in-limit, and each goal is accepted when J1-J6 independently remain within the operator-authorized 0.3-rad target/sample bands for one second. The controller retains the final proved target without a redundant hold-service call, then MissionEngine requests feedback-confirmed disable, revoke and owned-process stop.
  - Only safe_shutdown=true permits tracked-robot power-down; NEEDS_OPERATOR leaves it paused.
  - Offline TSDF reconstruction is separate and cannot change arm-task success.
startup_failure_and_cancel_e2e_2026_08_04:
  missing_camera: A mission submitted through the real Tk GUI started the disabled driver, proved coherent feedback, started the owned vision tree, exercised bounded watchdog recovery, then returned FAILED/SENSOR_UNAVAILABLE, retryable=true, capture_count=0 and safe_shutdown=true when no RealSense device or video node existed.
  startup_cancel: A second real GUI submission was cancelled with the visible Cancel and Home button while the same camera boot barrier was active. The guarded wait surfaced cancellation immediately and cleanup completed in about eight seconds with CANCELLED, retryable=true, capture_count=0 and safe_shutdown=true.
  cleanup: Managed driver and vision groups returned zero and no camera, GPU worker, perception, acquisition, scan or capture child remained. The coordinator and RViz stayed running. Because enable occurs only after all boot barriers, the arm was never enabled or commanded in either run.
  camera_recovery: After the L515 was unplugged and replugged it enumerated as Intel L515 serial f1120648 with firmware 01.05.08.01, exposed /dev/video0 through /dev/video7 over USB 3.2, and passed the librealsense preflight.
