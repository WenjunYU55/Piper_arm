  repaired_startup: [read coherent feedback, enable, accept only explicitly tagged STARTUP_WRIST, re-arm from latest finite nonpositive J6 if the first sample was ambiguous, preserve measured J1-J5, command only increasing J6, prove ready zero, execute rough startup home]
  repaired_terminal: [if startup wrist and rough startup home are both unproved then retry the same bounded J6-only STARTUP_WRIST prerequisite, on proof continue PRE_HOME then ROUGH_HOME then STORAGE_WRIST then disable and cleanup, on failure issue no PRE_HOME and retain command ownership, on motor loss issue no automatic motion]
  manual_smoke_checks: [build and software tests first, motors-disabled inspect the startup branch diagnostic, supervised startup from configured storage at five percent, confirm STARTUP_WRIST precedes every PRE_HOME, abort before PRE_HOME if STARTUP_WRIST is rejected, inspect camera clearance, then perform normal staged shutdown]
