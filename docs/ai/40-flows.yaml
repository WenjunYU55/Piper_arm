  manual_smoke_checks: [perturb only the measured target during planning and confirm no arm command, observe a new plan ID and center, confirm the replacement alone can enter MOVING]
current_state_terminal_home_2026_08_06:
  trigger: Mission failure, cancellation, or terminal coordinator shutdown while control remains trustworthy.
  sequence:
    - /scan_viewpoint_executor/cancel stops active execution and publishes the measured current-position hold; it does not start reverse-path motion.
    - After stable joint feedback, the mission requests a fresh zero-capture direct RETURN_HOME target from the current measured joints without camera, scene or collision gates.
    - Tesseract and the executor validate the direct current-to-configured-home SDK path; only the exact approved hash may command it.
    - Configured-home feedback, final hold, six false motor flags, and owned-child shutdown are proved in order.
  failure_mode: If the direct qualified route or control/scene evidence is unavailable, the arm remains enabled in current-position hold for operator intervention; no blind straight-home command is allowed. The exact transient invalid-obstacle-geometry runtime abort may reach this sequence only by obtaining a new valid scene snapshot; the original invalid sample never authorizes motion.
