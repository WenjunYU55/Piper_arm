bounded_current_look_scan_aim_2026_08_06:
  status: historical_aim_flow_superseded_by_exact_first_five_degree_fallback_2026_08_20
  trigger: GUI scan scan_20260806_220358 accepted seven GOOD/CLEAR records and safely homed/disabled, but all achieved views remained before the strict -Y face threshold and all 36 next exact target-centred poses failed finite bounded IK at link2/link5.
  sequence:
