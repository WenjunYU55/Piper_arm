  physical_observation: Task codex-e2e-first-ray-20260826-1824 proved startup and acquisition, found the target on look two, produced 39 capability-qualified rays and never classified at ACQUIRED. It exposed that live rough-shape traffic was incorrectly coupled to generation-zero model construction. Zero captures, PRE_HOME, ROUGH_HOME, STORAGE_WRIST, all-six disable, child cleanup and coordinator Ctrl-C all completed safely. Software order is repaired; a separately authorized low-speed repeat is pending.
