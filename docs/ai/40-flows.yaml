autonomous_target_scan_flow:
  - Tracked robot sends one fresh SCAN_3D goal in odom and keeps localization/TF alive while the base remains stationary and braked.
  - Gateway snapshots odom to piper_base_link, hashes the immutable task, and supplies a 2 Hz heartbeat.
  - Local listener starts the disabled driver, then requires its service plus two seconds of fresh, coherent, settled feedback stamped after that driver generation before camera startup.
  - Camera/watchdog/perception must produce healthy timestamp frames and current-run GroundingDINO/SAM2 CUDA ready markers before hand-eye starts. The GroundingDINO marker is printed only after local-cache-only model preload completes; no mission motion may overlap first-use Hugging Face resolution or model construction. Hand-eye must publish a transform stamped after its start before a new Tesseract worker generation is accepted; only then may the sole scan executor start.
  - Typed acquisition readiness and another two-second current-generation joint-feedback stability window are required before task-bound authorization and feedback-confirmed enable. Startup then publishes and acknowledges the exact measured current-position hold without imposing a second 0.005-rad settle proof. Plan approval occurs before a command endpoint exists, so its position window is anchored to current measured joints; ordinary scan endpoint execution and capture retain target-bounded settling. Every boot barrier is bounded and process exit, stale generation, or timeout prevents dependent startup.
  - Rough acquisition submits one look transaction at a time from fresh measured camera TF/joints: current/center first, then distinct compact 15-degree neighborhoods, maximum five. Each settled look runs correlated GroundingDINO/SAM2 and a measured lock stops immediately.
  - Workflow requires fresh measured SCAN_READY. If leaf/branch clutter exists it publishes either a support-verified pick/place proposal or an outward-push proposal; beneficial contact remains blocked until manipulation_ready is physically qualified.
  - Automatic normal planning uses one view per exact request. ray_nbv freezes 175 configured directions once, scores their cumulative marginal information, removes predicted fractions below 0.02, shortlists six directions, and only then lets the bridge sample bounded 0.28-to-target-range standoff positions with a preferred band through 0.50 m. voxel_nbv remains an exact-point lattice with a twelve-point handoff. Accepted history records achieved FK camera pose/look and ranks the next direction by new coverage. GOOD/CLEAR persistence remains mandatory. Rejected rays are retired and replanned from current hold without modifying coverage. Eight records are only the measured-model seed floor; completion remains adaptive through at most twenty-four and requires two achieved views on each Y side, 25 degrees of elevation and three consecutive masked-surface novel gains at or below 0.02. Achieved azimuth span remains diagnostic and cannot block completion.
  - If target_status briefly becomes LOW_CONFIDENCE, LOST or SEARCHING after a one-view proposal but before approval, the arm remains held and no frame is saved. Existing SAM2/GroundingDINO recovery gets at most 30 seconds to restore a fresh measured lock. The exact proposal is then fully revalidated; changed target center forces a new one-view plan, while collision/path/scene/control/hash/worker rejection remains terminal fail-closed.
  - If fresh obstacle/runtime liveness drops while one endpoint is in flight, the executor commands and proves a current-feedback hold while retaining the interrupted endpoint as inert resume state. It may reissue that exact endpoint only after fresh obstacle, joint, arm, camera and limit authority all recover inside the bounded timeout; the hold is never tested against the interrupted goal.
  - Automatic completion/failure/cancel stops current work, requires fresh finite measured joints, then requests PRE_HOME, ROUGH_HOME and STORAGE_WRIST directly through ExecuteHomeStage/native MoveJ; the Tesseract worker is not consulted. Camera and semantic-scene freshness plus robot self-collision evaluation are absent only for these configured stages; installed-holder external clearance remains mandatory. A disabled/storage start may be at most 0.3 rad outside a coordinate boundary only as the exact first point, each stage goal remains strictly in-limit, and each goal is accepted when J1-J6 independently remain within the operator-authorized 0.3-rad target/sample bands for one second. The controller retains the final proved target without a redundant hold-service call, then MissionEngine requests feedback-confirmed disable, revoke and owned-process stop.
  - Only safe_shutdown=true permits tracked-robot power-down; NEEDS_OPERATOR leaves it paused.
  - Offline TSDF reconstruction is separate and cannot change arm-task success.
startup_failure_and_cancel_e2e_2026_08_04:
  missing_camera: A mission submitted through the real Tk GUI started the disabled driver, proved coherent feedback, started the owned vision tree, exercised bounded watchdog recovery, then returned FAILED/SENSOR_UNAVAILABLE, retryable=true, capture_count=0 and safe_shutdown=true when no RealSense device or video node existed.
  startup_cancel: A second real GUI submission was cancelled with the visible Cancel and Home button while the same camera boot barrier was active. The guarded wait surfaced cancellation immediately and cleanup completed in about eight seconds with CANCELLED, retryable=true, capture_count=0 and safe_shutdown=true.
  cleanup: Managed driver and vision groups returned zero and no camera, GPU worker, perception, acquisition, scan or capture child remained. The coordinator and RViz stayed running. Because enable occurs only after all boot barriers, the arm was never enabled or commanded in either run.
  camera_recovery: After the L515 was unplugged and replugged it enumerated as Intel L515 serial f1120648 with firmware 01.05.08.01, exposed /dev/video0 through /dev/video7 over USB 3.2, and passed the librealsense preflight.
  wrong_hint_motion_run: A later GUI mission used the stale hint [0.25, -0.25, 0.0] while the operator subsequently identified the cube at [0.4, 0.0, 0.0]. It passed preflight, enabled at 5 percent, executed three qualified rough looks, settled and ran GroundingDINO at each, and correctly exhausted acquisition without a measured lock.
  homing_defect: The acquisition failure retraced to its powered mission-start joint state, but the executor labelled that state configured home. Mission-level comparison against the configured home detected material J4/J6 mismatch, refused disable, returned NEEDS_OPERATOR/CONTROL_UNTRUSTWORTHY and retained the current-pose hold. Operator recovery proved a stable measured hold, feedback-confirmed disable, and only then stopped every mission-owned group. The coordinator was stopped pending correction; RViz may remain.
  software_correction: Automatic cancellation/failure holds, snapshots settled joints, requests the distinct zero-capture direct RETURN_HOME kind independent of perception state, approves its exact stage/hash/bypass evidence and verifies configured joint feedback. Core and compact rootless suites pass the saved profile. Reverse-to-plan-start is never invoked by cancel/abort authority.
  return_home_acceptance: A corrected-hint mission later held on stale obstacle telemetry. Its distinct exact RETURN_HOME plan reached measured joints [-0.010135,0.0,-0.039092,0.056641,0.433815,0.011077], maximum configured-home error 0.022172 rad, then all six motor feedback flags confirmed disabled. This physically closes the earlier reverse-to-plan-start homing defect for this recovery run.
  scan_failure_evidence: The corrected [0.4,0,0] run locked the green cube on look one. Red sticks visibly occluded it, yet the acquisition result reported zero obstacles and workflow reused that evidence as clear. The first coverage-ranked scan move rotated the cube out of frame before stale obstacle telemetry safely held motion; no capture was accepted.
  software_followup: At this stage automatic next-view requests used a 20-degree target-centred frontier from achieved camera FK; the later distinctive-feature revision temporarily widened planning to 45 degrees, and the dense-region close-target revision settled at 30 degrees with compact-first entry. The executor independently continues to validate every dense scan interpolation against a 20-degree boresight cone and 0.22 m minimum target distance. Workflow startup discards cached acquisition obstacle authority and requires a new request/stamp-correlated semantic and 3D occlusion result before SCAN_READY.
  remaining_acceptance: Physical testing is currently operator-authorized at five percent. Contact removal remains blocked until its manipulation model/executor are physically qualified. With a manually clear target, validate adaptive one-view progression from the eight-view seed until measured feature/surface completion or the twenty-four-view limit, then repeat end-to-end acceptance three times.
  manual_smoke_checks: [Submit from the GUI rather than calling the action directly, confirm live phase/capture feedback, cancel once during each dependency wait, require a prompt typed result, verify safe_shutdown and exact failure code, verify all mission-owned process groups are gone, verify coordinator and RViz remain, verify no motor enable or joint command occurred before preflight completed]
close_range_scan_guard_2026_08_04:
  sequence:
    - Freeze the latest measured cube position and achieved camera FK for one automatic request.
    - Keep only candidate target-to-camera directions within 45 degrees of the achieved direction; rank new coverage inside that frontier while retaining the independent 20-degree dense optical-cone path gate.
    - Before approval/motion, densely evaluate the SDK-interpolated capture segment with calibrated optical-axis FK; reject off-axis or closer-than-0.22-m paths.
    - After one accepted capture, persist achieved camera position/look direction and replan once from fresh measured state.
  failure_modes: [no candidate in compact frontier, target-center drift before approval, any dense path sample outside optical cone, camera too close, no fresh request-correlated occlusion scene]
  manual_smoke_checks: [with motion disabled inject a high-score 35-degree candidate and a lower-score 10-degree candidate and require only the compact candidate, inject an intermediate 25-degree wrist shortcut and require pre-command rejection, mismatch the workflow heavy request ID or scene image stamp and require INITIALIZING rather than SCAN_READY]
runtime_reachability_flow_2026_08_04:
  behavior: The command-free viewpoint filter no longer rejects candidates against a fixed base-radius, height-change, or rectangular workspace. It still rejects stale/faulted arm state, invalid vectors, bad target state, and unsafe camera-object standoff. Tesseract then owns actual six-joint IK, joint bounds, floor/self/environment collision, exact start matching and route validation; the executor repeats the live gates before motion.
  mounted_robot_gate: Until chassis collision geometry, arm-to-chassis TF and a trustworthy stationary/brake signal are integrated, acceptance is bench-only and the tracked base must remain stationary and externally clear.
  manual_smoke_checks: [Submit a far finite proposal with motion disabled and verify the filter does not emit a static workspace rejection, verify Tesseract returns either a real IK/collision plan or a structured no-plan result, verify no command publisher exists in proposal-only mode, never interpret filter acceptance as reachability proof]
quality_replacement_flow_2026_08_04:
  behavior: Executor settles, publishes CAPTURING_RGBD authority, and calls scan_capture. Capture validates synchronized data plus GOOD/CLEAR diagnostics. On acceptance it persists, records achieved FK pose/look, and in automatic mode always holds for the coordinator's coverage decision, including capture 24. From the eight-view model seed through capture 23, the coordinator stops only after achieved Y-side/elevation floors and three consecutive measured novel-surface gains at or below 0.02 pass; achieved azimuth span is diagnostic only. At 24 it succeeds or fails from those same remaining floors, then always uses dedicated direct RETURN_HOME shutdown. A correlated zero-view result may finish only after the same seed and floors. QUALITY/OCCLUSION rejection records the pose and holds for a one-view replacement. No reverse-to-plan-start is labelled home.
  failure_modes: [malformed or nonfinite quality payload, stale quality or occlusion, target_valid not boolean true, non-GOOD score, non-CLEAR occlusion, more than eight rejections, fewer unused qualified candidates, unsafe return-home gate]
  manual_smoke_checks: [Inject one POOR or occluded settled diagnostic with motion disabled and verify no frame is added, verify rejected_entries contains its pose and accepted_views is unchanged, restore GOOD/CLEAR and verify the replacement excludes both accepted and rejected poses, verify an ordinary failure or zero-view result before the eight-view seed cannot complete, verify strict all-remaining-IK exhaustion completes only after every feature and convergence floor passes]
powered_start_and_occlusion_failure_e2e_2026_08_04:
