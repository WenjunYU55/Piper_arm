schema_version: 1
document: runtime_flows
mission_failure_shutdown_flow_2026_08_17:
  entry: Every failure or cancellation after the mission owns its process generation enters MissionEngine.shutdown exactly once.
  normal_control_sequence: [revoke scan authority as needed, request PRE_HOME from current feedback when not already complete, prove PRE_HOME, request and prove ROUGH_HOME, request and prove STORAGE_WRIST, retain the final position-controller target, request all-six disable and prove service result, revoke mission authorization, stop owned process groups]
  evidence_ownership: The failure that ended scanning explains the result but cannot reject a later direct-home transaction. Each home stage independently evaluates current joints, all-six motor authority, configured target/stage rules and holder/L515 external clearance.
  motor_loss_sequence: [detect current motor-control authority loss, issue no further arm command, wait read-only for fresh all-six-disabled feedback, revoke authorization, stop owned processes, return NEEDS_OPERATOR with safe_shutdown false because home was not proved]
  hold_rule: Autonomous startup and terminal shutdown do not call the hold service. PiPER position control retains its current/final commanded target; each direct-home stage re-reads current joints and motor authority, and STORAGE_WRIST proof proceeds immediately to feedback-confirmed disable. Executor-local runtime recovery holds remain separately owned and unchanged.
  manual_smoke_checks: [software-only tests first, then supervised direct PRE_HOME to ROUGH_HOME to STORAGE_WRIST and disable, verify no autonomous hold-service request occurs, inject a non-motor scan failure and confirm it cannot veto home, separately verify motor-loss simulation sends no command, repeat mission cleanup]
gripper_diagnostic_flow_2026_08_16:
  read_only: [stop every PiPER command owner, verify ROS graph and processes, run status or monitor with SDK initialization disabled, observe fresh 0x2A8 position/effort/enable/homing/fault state, disconnect cleanly]
  command_correlation: [run receive-only candump for 0x159 and 0x2A8, correlate one operator-triggered existing ROS enable while the driver is sole writer, verify transmitted bytes, verify fresh feedback state change, reject any later overriding 0x159 command, use direct clear-enable or motion-test only after homing status is separately established true]
  current_result: PASS for production motion and holding. Direct J7 commands while J1-J6 were disabled set the J7 enable bit but produced no torque, so that setup is not a valid stiffness test. Through the sole production driver, all six arm motors enabled first; a tagged measured arm hold plus 10 mm/0.5 N m command opened J7 from 0.28 to 9.66 mm. Re-enable then issued the normal 0 mm/1.0 N m command and held a compliant object at 4.48--4.76 mm with about 1.04 N m for five seconds, no faults and live 200 Hz feedback. Disable returned every arm flag false and J7 to disabled/zero effort. Homing remained false; no zero/reset was sent.
  manual_smoke_checks: [do not force jaws while enabled, do not run two SDK writers, do not set zero or reset the arm automatically, require clear supervised workspace, refuse direct clear-enable and motion-test while homing status is false]
supervised_physical_requalification_flow_2026_08_15:
  source: docs/refactor/physical_requalification_checklist.md
  sequence: [build and tests only, ROS graph without hardware, recorded data, live sensors with motors disabled, arm enabled without autonomous trajectory, single low-speed supervised motion, single viewpoint, return-home test, short scan, complete scan, repeated complete missions]
  progression_rule: Each stage requires an explicit operator PASS; a failed or ambiguous stage blocks every later stage until diagnosis and affected-stage repetition.
  prohibited: [automatic execution by an audit agent, skipped stages, contact or occlusion manipulation, unsupervised motion, concurrent joint command publishers]
  manual_smoke_checks: [record revision and parameters including the operator-authorized 0.3-rad home tolerance, preserve one command owner, monitor emergency stop, verify J5 J6 gripper-to-J1 and holder-floor clearance, prove PRE_HOME then ROUGH_HOME then STORAGE_WRIST direct native MoveJ, retain the final target without a redundant hold service, disable and cleanup]
phase10_cleanup_validation_flow_2026_08_15:
  sequence: [read architecture ownership and debt gates, prove candidate has no repository reference, retain candidates with compatibility or safety evidence, remove only inert internal code, run characterization tests, run lint and syntax checks, build five Foxy packages, run colcon test, run command-free Tesseract qualifications]
  prohibited: [physical arm motion, camera startup, GPU perception startup, safety authority switch, public interface change, threshold change, vendor relocation]
  manual_smoke_checks: [none; Phase 10 validation is software-only and command-free]
phase9_configuration_flow_2026_08_14:
  startup_sequence: [construct ROS node, declare unchanged parameter names/defaults, resolve existing YAML/launch/CLI overrides, read each parameter once, validate types/ranges/relationships, freeze typed groups, inject application configuration, create ROS entities]
  runtime_sequence: [ROS adapter reads immutable groups or frozen parameter mapping, MissionEngine uses explicit motion/capture/workflow groups, telemetry and mission input remain separate]
  failure_modes: [nonfinite numeric, nonpositive timeout/rate, invalid capture bounds, malformed home or holder vector, executor tick rate below twice command rate, empty required interface name]
  manual_smoke_checks: [none; run test_configuration default-equivalence/override/validation/immutability tests, full mobile-manipulation suite, public contract characterization and normal Foxy build without hardware]
phase7_viewpoint_executor_flow_2026_08_14:
  authorization: [ROS approve request converted to frozen PlanAuthorizationRequest, PlanAuthorizer checks exact mission and plan ownership and age, unchanged legacy runtime safety and collision authority run, target drift and capture dependency evidence are checked, fresh path is geometrically revalidated, node alone starts runtime refresh]
  trajectory: [node freezes the already-authorized segment through TrajectoryRunner, runner selects wait or exactly one due sample or typed failure, node alone publishes the unchanged JointState command, final endpoint and settle proof remain feedback-gated]
  capture: [node publishes settled CAPTURING_RGBD status, CaptureCoordinator enforces the unchanged propagation interval, node sends one service request, legacy string-only response is adapted once to Failure, coordinator chooses accept or bounded same-view retry or replacement-view replan or abort]
  recovery: [typed runtime freshness gaps retry through current-position hold and bounded refresh, visual acquisition failures reacquire, target drift and fresh visual capture rejection replan, cancellation and non-recoverable control/path failures abort]
  manual_smoke_checks: [none in Phase 7; run pure component tests, Phase 1 executor characterization, full scan_motion and mobile-manipulation suites, public interface characterization and normal Foxy build without starting hardware]
phase6_mission_engine_flow_2026_08_14:
  sequence: [ROS goal admission and closest-first dispatch, create per-task CancellationToken, begin exact owned process generation, resolve rough target once to base_link, MissionEngine dispatches current MissionPhase handlers, injected adapter publishes unchanged feedback and invokes unchanged subsystem operations, engine runs established terminal policy, node maps MissionResult to existing ROS and durable result]
  cancellation: [queued token cancellation creates the existing command-free CANCELLED result, active token cancellation is observed by existing guards, committed terminal return-home and hold and disable and cleanup ignore later cancellation and complete]
  equivalence: [pure successful trace equals the frozen Phase 1 trace, major failures and cancellations retain existing terminal policy, repeated engine invocations own no retry or capture state]
  manual_smoke_checks: [none in Phase 6; run pure MissionEngine tests, Phase 1 characterization, full mobile-manipulation tests, public contract hashes and normal Foxy build without starting hardware]
safety_shadow_flow_2026_08_14_historical_superseded:
  historical_sequence: Phase 5 compared a duplicate pure evaluator with legacy executor decisions.
  superseded_2026_08_17: SafetyComparisonLogger and SAFETY_SHADOW_DISAGREEMENT were removed after live logs produced 15881 identical non-authoritative RETURN_HOME disagreements and no consumer used the result. RuntimeGatePolicy now selects one authoritative executor path.
  current_sequence: [select one named SafetyMode and ObstacleAuthority, derive immutable RuntimeGatePolicy, take one telemetry snapshot, evaluate only policy-owned evidence in runtime_reasons, preserve geometry/path/service checks at their existing owners, command only through the executor]
  manual_smoke_checks: [run runtime policy unit tests, executor characterization, scan motion tests, full mobile-manipulation suite and command-free Tesseract qualification]
process_supervision_flow_2026_08_14:
  startup_sequence: [mission constructs unchanged overrides through ProcessSupervisor environment inheritance, supervisor opens generation log, supervisor starts exact argv with start_new_session, supervisor records handle/group/log ownership, mission performs its unchanged dependency readiness gate]
  runtime_sequence: [mission queries supervisor failed/health/log APIs, unexpected exit enters the existing MissionFailure guard, no executable-name discovery or process adoption occurs]
  cleanup_sequence: [mission completes the applicable home/hold/disable safety policy, supervisor snapshots owned handles in reverse start order, SIGINT all live groups, wait 5 seconds, SIGTERM survivors, wait 3 seconds, close stopped logs, report survivors without SIGKILL]
  failure_modes: [Popen startup exception, immediate child exit, later crash, partial startup, stale live generation, graceful timeout, TERM survivor]
  manual_smoke_checks: [none in Phase 4; pure injected fake-process tests prove signal order/timeouts/ownership and full software suites/build run without starting the robot stack]
telemetry_decision_flow_2026_08_14:
  callback_sequence: [receive existing ROS message with unchanged QoS, record one monotonic receipt instant, preserve optional header stamp and frame, update the node-local TelemetryStore atomically, update the temporary compatibility mirror]
  decision_sequence: [capture one frozen defensive TelemetrySnapshot under lock, calculate every related freshness/value decision from that snapshot, apply the original caller-owned threshold and failure policy]
  migrated_critical_decisions: [mission readiness/joints/camera/plan/execution/capture/motor guard/home/hold/shutdown, executor plan-limit binding/runtime gate/target lock/obstacle correlation/settling/workflow/hold/current joints/command speed]
  manual_smoke_checks: [none in Phase 3; run pure TelemetryStore concurrency/equivalence tests, all Phase 1 characterization tests, full mobile-manipulation tests, public interface hashes, and normal Foxy build without starting hardware]
powered_motor_dropout_flow_2026_08_11:
  trigger: Any one of the six typed motor driver-enable flags becomes false during powered motion, motor feedback becomes invalid/stale, or a per-motor fault appears.
  sequence: [driver watchdog caches the exact low-speed state, driver calls all-axis DisableArm and clears command state, /arm_status publishes the six flags/faults/watchdog reason, executor and mission revoke authorization, mission sends no hold/home/storage/disable command, mission waits read-only for six false flags, owned children stop, durable result reports NEEDS_OPERATOR and safe_shutdown=false]
  incident_evidence: J5 dropped first at 1786456440.439 in gui-sim-be1e6cd0d5e1419e9b4397261a530fd7; the planner timeout occurred about 93 seconds later, so it was not causal. Old code attempted home only after all axes were already disabled and made no progress. The operator manually homed the arm. Mission-owned processes were then stopped without an arm command; a direct piper_init=false read-only CAN sample proved six false motor flags, no per-motor faults, err_code zero and live feedback. The stale idle coordinator was replaced by the rebuilt process; coordinator and RViz are resident with no hardware/perception/planning child.
  mandatory_smoke: [Pure tests prove all-six enabled is required for motion, six-disabled is allowed only for command-free preflight, J5-only dropout reaches mission guard, motor-loss shutdown emits no home command and waits for six-disabled feedback, driver watchdog cache is published, affected packages build, both rootless qualifications pass. Do not physically inject a motor dropout; inspect the hardware cause before another supervised mission.]
flows:
  startup:
    sequence:
      - Start PiPER driver with auto_enable=false; verify /joint_states_single and /arm_status deliver actual samples, not merely graph-visible endpoints. The driver uses an executor-owned 200 Hz timer; the former unmanaged publication loop was removed after live delivery stalls.
      - Start piper_description/display_live_robot.launch.py when the arm link chain is needed in TF or RViz; it consumes feedback only and includes the fixed yaw-pi gripper installation plus visual-only camera_holder and l515_visual branches.
      - Start hand-eye publisher after the camera static TF is live; it freezes camera_link to camera_color_optical_frame, then publishes base_link to camera_link from reliable depth-1 joint feedback. Missing static TF fails startup.
      - Start GPU pipeline in its defined process order; bridge requests initial semantic seed after subscribers exist.
      - Camera timestamp watchdog requires 15 consecutive image stamps within 0.5 seconds of ROS time before health becomes HEALTHY; SAM2 tracking and scan execution remain fail-closed before then.
      - Start optional dry-run scan or supervised workflow only after perception topics are healthy.
      - Start supervised viewpoint execution in proposal-only mode, validate its typed plan, and only then consider a separate motion-enabled restart.
    failure_modes: [mixed ROS_DOMAIN_ID or ROS_LOCALHOST_ONLY, stale processes, unsourced overlay, CAN owner conflict, camera USB bandwidth]
  camera_timestamp_recovery:
    sequence:
      - Camera startup waits for the live L515 sensor controls, sets and verifies librealsense global time for RGB and depth, and fails if either remains disabled; launch arguments alone are insufficient because the device initializes these late-declared controls false. Hardware timestamps are then continuously corrected into the host clock instead of relying on a one-time anchor.
      - Pipeline startup starts the timestamp watchdog next, requires both /camera_timestamp_watchdog and one /piper/camera_timestamp_health publisher before launching downstream perception, retries the isolated watchdog process up to three times, and otherwise tears down the owned stack fail-closed.
      - Watchdog compares each per-frame color CameraInfo stamp with current ROS time and the previous stamp, avoiding full RGB deserialization, and publishes /piper/camera_timestamp_health at 5 Hz.
      - Missing, invalid, backwards, future, or more-than-0.5-second-stale stamps force unhealthy typed status; SAM2 publishes CAMERA_CLOCK_INVALID with zero speed and the scan executor invalidates or aborts.
      - Watchdog services lightweight CameraInfo, reliable depth-1 latest-joint, and timer callbacks on Foxy's standard single-thread executor, avoiding the observed custom callback-group delivery failure while retaining current 200 Hz feedback. It then waits for fresh six-joint positions to remain within 0.001 rad for 0.75 seconds. This rejects real motion without camera-payload starvation, PiPER's noisy at-rest velocity telemetry, or an old reliable queue; velocity-only messages retain a fail-closed fallback.
      - With a pipeline-owned camera, an atomic /tmp/piper_vision_recovery/request.yaml makes the wrapper stop camera and every perception child, clear live queues, back off 2/5/10/30 seconds, and restart the complete stack.
      - After restart the gate remains closed until consecutive healthy frames and fresh tracking/3D target/obstacle inputs return. With a reused external camera, status stays blocked and the operator must restart that camera owner.
    failure_modes: [missing camera frames, large positive or negative offset, backwards timestamp, missing or moving joint feedback, external camera not owned by wrapper, repeated restart with capped backoff]
  gpu_pipeline_shutdown:
    sequence:
      - run_gpu_vision_pipeline atomically records every owned camera, watchdog, bridge, isolated worker, cloud, and geometry process-group leader.
      - Normal Ctrl+C runs in-process INT/TERM cleanup and removes the manifest.
      - If the wrapper dies before its trap completes, stop_gpu_vision_pipeline.sh validates the surviving manifest and stops only its owned groups.
      - Verify all vision processes are absent while driver, GUI, TF, and proposal executor remain untouched.
    failure_modes: [wrapper killed before trap, stale manifest, PID reuse, non-group-leader PID, unrelated command path]
  semantic_to_live_tracking:
    sequence:
      - sam2_live_bridge requests a heavy refresh for initialization, a two-attempt loss-recovery burst, a slow periodic ABSENT retry, or one sustained-low-confidence episode after valid TrackedTarget confidence stays below 0.60 for one second.
      - heavy_refresh_bridge snapshots a timestamped RGB/depth frame into heavy requests.
      - heavy_model_worker runs GroundingDINO plus SAM2 refinement and writes a response.
      - heavy_refresh_bridge publishes masks/status and writes a multi-object SAM2 seed.
      - sam2_live_worker consumes a labelled objects manifest with object_NNN masks and subsequent
        frame directories, maintaining object identities; an objectless mask.png seed is rejected.
      - sam2_live_bridge republishes target/obstacle/object-ID masks with camera timestamps.
    sync_behavior: Only one heavy refresh is in flight; additional reasons are deferred/coalesced; atomic READY directories prevent partial reads. Low-confidence refresh rearms only after confidence reaches 0.70 and remains motion-gated.
  mask_to_base_tracking:
    sequence:
      - mask_to_detection computes target 2D bounds.
      - depth_to_3d synchronizes detection, aligned depth, camera info, and recent mask; robust depth yields Target3D.
      - Isolated depth jumps are rejected, while three mutually consistent post-motion samples within 0.03 m re-anchor the projector and clear stale camera-frame smoothing. A nonpositive max_depth_jump_m disables this gate.
      - target_tracker transforms the timestamped measurement to base_link, applies gates, and updates a constant-velocity Kalman filter.
      - TrackedTarget publishes position, velocity, prediction horizon, confidence, validity, and stability.
      - object_frame_broadcaster publishes tracked_object_frame and predicted_object_frame.
    failure_behavior: Invalid/stale/out-of-order measurements do not update the filter; prediction is bounded by missed-frame/lost timers.
  camera_motion_recovery:
    sequence:
      - /joint_states_single updates arm moving/settled state in sam2_live_bridge.
      - hand-eye TF updates base_link to camera_link from reliable depth-1 latest-sample feedback after freezing the RealSense static camera-frame edge; its FK work must not replay stale high-rate joint samples.
      - motion_compensated_prompt reprojects the known base-frame target mask into the current camera view.
      - On a loss episode, a fresh nonempty motion prompt is tried once before heavy semantic refresh.
      - If two heavy attempts do not recover the target, lifecycle becomes ABSENT and one serialized retry is allowed every 30 seconds by default, only while the camera is settled.
      - TrackingHealth limits downstream speed and reports prediction-only/reacquisition state.
    pass_condition: A stationary cube remains stable in base_link while its pixels move due to small arm motion.
    current_calibration_state: The session_20260808_straight_mount file preserves the PARK solve made after the L515 was remounted straight from 12 fitting and three held-out poses, but the operator's 2026-08-10 measurement established that the physical board has 0.017 m squares and 0.012 m markers while those samples encode 0.018 m/0.013 m. The PARK solve and all prior board-derived metrics are therefore wrong-scale provenance only. On 2026-08-10 the deployed transform was re-registered from the operator-confirmed CAD housing using Intel Rev 003's 4.5 mm depth start point and device f1120648's factory colour-to-depth extrinsic; this transform does not depend on board scale. l515_visual depth optical is [0,0,-0.008224997] m with straight housing-normal axes; colour optical is [-0.0002000813,0.0141312284,-0.0040001602] m with 1.322466-degree factory skew. The superseded [0,0.014,-0.008694998] m anchor mixed RGB X-Y with depth Z and placed both live optical frames too far behind the glass. The read-only live overlay and corrected-scale five-pose board validation passed on 2026-08-10; the latter had mean/worst drift of 5.73/12.22 mm and 0.87/1.25 degrees. Because that fixed board is the stationary metric target and its base_link pose passed at five stable arm poses, physical_revalidation is passed. Semantic cube repeatability remains an acquisition acceptance. The executor continues to reject enable_real_arm_motion whenever that status is not passed. session_20260701_local is retained only for rollback provenance; the failed analytical J6 compensation remains rejected.
  fixed_board_tf_validation:
    sequence:
      - Configure the measured 5x5 ChArUco board exactly as square_length_m 0.017 and marker_length_m 0.012; capture and validation must use the same values.
      - Keep the board physically fixed and move only the disabled arm between substantially different views.
      - Before an image may count, require fresh six-joint feedback to span no more than 0.001 rad over one complete 0.75-second window. Do not use instantaneous reported velocity as stationary authority.
      - Require all 12 markers and all 16 ChArUco corners, then average ten post-trigger stationary frames and report the immediate acceptance or exact rejection reason.
      - Collect at least five distinct poses and require every pose to remain within 15 mm and 1.5 degrees of the fixed-board reference.
    current_evidence: Every saved August 8 fitting/held-out sample and every fixed-board report made through fixed_board_validation_registered_20260810_retry.yaml used the wrong 0.018 m square and 0.013 m marker model. Those reports are provenance only even where their thresholds passed; the first registered run additionally admitted 0.02587 rad of disabled-arm J5 motion. Capture and validation now share and persist 0.017 m/0.012 m dimensions and use the same complete 0.75-second/0.001-rad position gate, with six focused regressions passing. fixed_board_validation_registered_20260810_corrected_board.yaml passed all five poses with mean/worst translation 5.73/12.22 mm, mean/worst rotation 0.87/1.25 degrees, and mean/worst reprojection 0.133/0.195 px. Repeated future pose-dependent drift requires measured recalibration, never wider limits.
    failure_modes: [wrong physical board dimensions, capture/validator dimension mismatch, incomplete board, glare or blur, stale feedback, incomplete stability window, disabled-arm sag, missing camera TF, translation drift, rotation drift]
  target_metric_tracking:
    sequence:
      - depth_to_3d publishes timestamped Target3D measurements in the camera optical frame.
      - target_tracker receives TF on a re-entrant callback group using a two-thread executor, so a bounded timestamped transform wait cannot starve the TF subscriptions.
      - Valid measurements are transformed into base_link, filtered, and published as TrackedTarget.
      - object_frame_broadcaster publishes tracked_object_frame for RViz only while TrackedTarget is valid.
    failure_modes: [missing base-to-camera TF, TF callback starvation, invalid depth, low confidence, out-of-order measurement, tracker gate rejection]
  supervised_dry_run:
    sequence:
      - start waits for locked landmark and fresh obstacle instances.
      - Clear scene enters SCAN_READY; whitelisted movable obstacle produces a conservative plan; unsafe/invalid geometry aborts.
      - approve_plan enters WAIT_OPERATOR_ACTION without publishing motion.
      - Human moves obstacle; confirm_action_complete verifies displacement and scene safety.
      - capture_view accepts only fresh GOOD/ACCEPTABLE quality and requests a full-resolution target cloud. The cloud subscription uses best-effort sensor QoS, and the coordinator retains the cloud/status pair across either arrival order before incrementing modeled_views.
      - After 5-8 accepted views and center convergence, finish_scan requests save and publishes the target model.
    state_values: [IDLE, INITIALIZING, PLAN_READY, WAIT_OPERATOR_ACTION, VERIFY_ACTION, SCAN_READY, WAIT_CAPTURE, COMPLETE, ABORTED]
  active_scan_capture:
    behavior: Planner emits pitched circular camera viewpoints around target; the command-free filter performs typed arm-status, target-state, finite-vector and camera-object-view checks without a fixed radial/height workspace gate. The standalone debug launch may capture synchronized color/depth/mask records on an interval. The supervised launch instead uses service mode, and the executor requires fresh GOOD/CLEAR diagnostics plus one fresh synchronized RGB/depth/camera-info and mask record before workflow acceptance at every settled MULTIVIEW_SCAN viewpoint.
    limitation: The filter's reachable/safe flags are prechecks only; Tesseract is the mandatory IK/collision-aware planning authority, and the Foxy executor independently rechecks each exact path with its conservative proxy. The Tesseract model was initially qualified on 2026-07-23, requalified with identical seed-42 output on 2026-07-24, requalified for exact all-zero acquisition egress with named positive compact-pair margins on 2026-07-25, and completed supervised five-view physical acceptance on 2026-07-24. After deployment of the 2026-08-08 hand-eye result, the calibration-bound core and compact rootless suites again returned PASS with hardware-qualified collision geometry and real_arm_motion=false; this is not functional-safety certification.
  rough_target_acquisition:
    sequence:
      - An external source or the native GUI calls /scan_target_acquisition/prepare with one unique session_id and one fresh finite PointStamped in base_link. This typed request atomically binds identity and target; an exact duplicate is idempotent, while reusing an ID with changed target data is rejected. Receipt never approves or commands motion.
      - PrepareAcquisition includes look_index 0..4. It obtains fresh camera TF and publishes one compact transaction with at most five exact IK alternatives. Look zero prefers the measured camera position and centered/compact-radius alternatives; later transactions use distinct 15-degree left/right/up/down neighborhoods. Every camera position remains in the original target-facing half-space and no farther from the hint than the measured radius.
      - Dedicated reachability output preserves ROUGH_ACQUISITION provenance and may ignore target_status LOST only; arm-status and view-geometry checks remain mandatory while static reach bounds are disabled and Tesseract owns actual feasibility.
      - The coordinator republishes the command-free candidates and retries only rejected non-queued bridge calls for at most 10 seconds, with no more than one call in flight. Scan subscriptions remain stable for node lifetime; stale or missing callbacks block without DDS endpoint recreation. Once accepted, exactly one spool request exists. Schema-v5 hashes bind plan kind, source_request_id, base_link provenance, target stamp, candidates, scene observation mode, model, calibration, limits, and exact trajectory.
      - source_request_id is preserved through candidate JSON, the canonical spool, TesseractPlan, ScanExecutionPlan, and GUI. A plan or terminal status from another session cannot satisfy the current request.
      - Tesseract aligns camera optical +Z with each look vector, samples roll, solves all six joints, and returns one to five collision-validated looks. A valid all-zero start may egress through the reviewed positive base_link/link2 and link2/link4 compact-design pair margins while the 0.005 m global margin, penetration rejection, conservative pair motion bounds, and exact-path validation remain active. Proposal-only mode still has no command publisher.
      - Only for first-segment bootstrap_static acquisition, the worker may add a maximum-0.15-rad single-joint recovery. Every sample may contain only named bounded folded-start model contacts, must improve monotonically, and must reach ordinary clearance at the declared endpoint. Prefix, boundary, joint, delta, and evidence are inside the trajectory hash.
      - Foxy accepts that metadata only on ROUGH_ACQUISITION segment zero, independently checks monotonically improving capsule-proxy clearance, and requires the normal 60 mm proxy threshold at the boundary. Joint, floor, feedback, camera-clock, exact approval, and hold gates remain active.
      - Exact approval in motion-enabled mode executes at the GUI-selected finite 1-100 percent SDK speed. The first segment alone uses the hash-bound bootstrap_static scene and ignores DINO/SAM obstacle output, breaking the unseen-target startup cycle. Qualified robot/camera/cable self-collision geometry, floor proxy, limits, feedback, arm status, camera-clock health, exact approval, and hold-on-abort remain active.
      - At each settled pose the executor creates a unique request ID and a minimum camera stamp after settling. The heavy bridge waits up to 10 seconds for a matching new frame or idle worker, and the executor accepts only correlated status/image stamps.
      - The exact GroundingDINO job may run for up to 60 seconds. target_mask_missing does not move immediately: the executor waits up to 15 seconds for a typed scene stamped at or after that result. Zero obstacles emits an exact clear scene; obstacle-only detections reserve target ID 1, propagate IDs 2+ through SAM2, and use normal depth projection. Only then is the next exact Tesseract segment rechecked against fresh boxes. Infrastructure, malformed, stale-image, scene, or correlation failures abort and hold.
      - After a matching detection, the executor waits up to 10 seconds for callbacks newer than the result: target_status LOCKED, measured nonprediction TRACKING with a settled camera, and a valid stable base_link TrackedTarget stamped after the processed image and within 0.30 m of the hint.
      - Success causes a current-position hold, ACQUIRED, and cancellation of remaining poses. The acquisition coordinator starts the supervised workflow once and waits for SCAN_READY plus normal tracked-target viewpoints, but deliberately does not request the normal scan.
      - If acquisition terminates but perception subsequently has a fresh authoritative measured TRACKING/LOCKED target, explicit Prepare Scan from Current Lock may adopt that lock as a new scan phase, start/restart workflow assessment, and wait for SCAN_READY. It does not relabel the terminal acquisition or reuse its approval.
      - After the adopted/current measured lock and SCAN_READY, the GUI issues one /tesseract_plan_bridge/request_plan call, correlates the returned short plan ID to that exact request, and accepts only a collision-qualified plan containing exactly 13 views.
      - If all accepted looks fail to produce measured tracking, the executor holds and reports ACQUISITION_FAILED; a new hint or explicit retry is required.
    failure_modes: [invalid or reused-with-different-data session ID, stale/future/non-base-link target, stale or mismatched source_request_id/plan target, missing camera TF, duplicate command publisher, arm-status/workspace rejection, missing camera clock/joints/worker heartbeat, no IK, collision, unqualified model, hash mismatch, approval mismatch, pre-settle GroundingDINO frame, semantic timeout, missing/stale/invalid correlated scene before a later look, target more than 0.30 m from hint, MoveJ waypoint timeout or no progress, camera health loss, no measured target after bounded sweep]
    manual_smoke_checks: [look_index outside 0..4 rejects, exact duplicate session/look/target is idempotent, rebound data rejects, each automatic proposal contains exactly one selected look, an absent correlated semantic result produces ACQUISITION_LOOK_COMPLETE and fresh measured-state replan, all five primary neighborhoods are distinct, every candidate remains same-side and within live radius, exact all-zero 0.33/-0.14/0.0 and centreline 0.25/0/0 return one qualified compact look, bootstrap_static has no obstacles, later look waits for correlated scene, measured lock stops immediately, five-look exhaustion returns TARGET_NOT_FOUND]
    current_validation: On 2026-07-24 rough acquisition and the subsequent five-view scan completed at 5 percent. On 2026-07-30 the J2 lower limit was aligned to exact enabled compact-pose feedback -0.044796192 rad after OMPL demonstrably clamped the live start to the previous -0.040522412 rad bound. The remaining compact-start rejection was resolved by hash-verified overlapping 30 mm link1/link2/link5 collision pieces and the acquisition-only recovery contract. The 2026-07-27 exact recorded-start regression for [0.33,-0.14,0.0] produced J3 -0.05 rad recovery through point 55 and a 352-point smooth plan; 5608 validation samples passed. Core and compact qualification both report hardware-qualified true. After the stale root overlay repair, a clean live proposal-only request for the same target returned valid hardware-qualified plan 4f8fc210be5b17a9 with three camera-facing viewpoints, 443 points, and real_arm_motion false. The executor reached PROPOSAL_READY, capture stayed live, and the command topic had zero publishers. No approval or motion occurred.
  gui_production_action_client:
    sequence:
      - Operator enters a base_link rough XYZ and target label in Automatic Scan.
      - MissionViewModel validates only finite input/presentation lifecycle; PiperGuiRos maps the unchanged SCAN_3D goal to /piper/run_target_scan.
      - The production mission action owns startup, readiness, enable, acquisition, occlusion, planning, capture, retry/replan, terminal home, hold, disable and child cleanup.
      - GUI feedback and durable result fields are displayed without parsing their human-readable text for decisions.
      - Cancel requests action cancellation only and awaits the production terminal result. GUI close also requests cancellation but owns no mission process group.
      - A SUCCEEDED result with safe_shutdown=true and mesh_job_id enables the existing tracked-robot-homed reconstruction handshake.
      - Manual command publishing, home-profile recording, explicit Commissioning Disable (No Home), and 3D preview/mirroring are separately labelled commissioning. Motion and enable require sole command-topic ownership; the no-motion disable remains available when no local action is active.
      - Heavy refresh, tracking, workflow, capture and Tesseract readiness remain read-only diagnostic displays and never authorize GUI motion.
    failure_modes: [action server unavailable, goal rejected, action transport/result failure, production failure result, production cancellation result, commissioning command publisher still present after terminal result]
    manual_smoke_checks: [GUI import and fake-root bootstrap, submit one command-free unavailable-server request, verify no PrepareAcquisition/RequestTesseractPlan/workflow/approval/cancel service clients exist, verify no worker or scan-stack child starts, verify feedback/result fields display unchanged, verify cancel uses the action handle, verify commissioning controls lock until terminal result, verify Diagnostics updates without state transition, verify preview-only child remains independently closable]
  supervised_viewpoint_execution:
    sequence:
      - Executor consumes only base_link, dry-run, reachable-and-safe viewpoint proposals after fresh healthy arm/tracking/obstacle inputs exist.
      - The viewpoint planner consumes only a target whose header frame exactly equals planning_frame_id=base_link. If measured tracking pauses, it holds the last valid candidate generation and waits for a new base_link TrackedTarget; it never interprets raw camera_color_optical_frame /piper/target_3d coordinates as base_link.
      - The former fixed-J6 J1-J5 numerical IK backend and helper were removed on 2026-07-24. Tesseract is mandatory; no scan-planning code path may hold J6.
      - J6 was operator-confirmed fully safe on 2026-07-17. The command-free bridge freezes a healthy scene and all-six-joint start state into a canonical hashed spool request. Valid unsafe/non-movable instances are included as collision boxes; invalid geometry blocks the snapshot. The isolated CPU worker treats J1-J6 equally; no J6 lock or special cost is permitted.
      - Current geometry emits up to 1050 candidates across twenty-five 7.5-degree azimuth samples over the target-facing 90-270-degree hemisphere, seven camera pitches from -15 through -75 degrees in ten-degree steps, and six distance samples from 0.30 through 0.45 m in 0.03 m steps. Manual batch planning must select exactly thirteen collision-valid viewpoints. Automatic closed-loop planning requests one from a 6-to-30-degree meaningful current-view frontier and supplies at most 36 exact alternatives. Its first transaction tries compact progressing geometry before the ambitious leader; after one accepted view the shortlist returns to coverage-first interleaving. The denser azimuth grid supplies a roughly 6-8-degree continuity successor when achieved FK falls between samples; the six-degree meaningful floor and duplicate pose/look rejection remain separate. Achieved accepted FK is classified around one frozen first-measured session center, finishes two views on the already approached Y side, crosses once to finish two on the opposite side, extends azimuth/elevation span, then seeks residual diversity. Fresh measured tracking still places every new candidate. Before compact/ambitious interleaving, the bridge rejects candidates whose latest-pose side margin regresses by more than 0.02 normalized exposure or whose projected span gain is negative. Useful radius/elevation configuration changes and the deliberate one-way side switch remain eligible without permitting an accidental reversal within either stage. A lower-count zero-view result is completion only after achieved FK proves at least nine views, two per Y side, 120-degree azimuth span and 25-degree elevation span; otherwise it is insufficient feature coverage.
      - Explicit multi-seed IK/roll filtering feeds RRTConnect OMPL. The worker applies canonical request seed 42 before any planner is constructed and rejects a mismatched request seed. ISP times the raw path, which is densified and discretely revalidated. The removed high-level OMPL/TrajOpt/ISP route is not the current implementation.
      - The bridge revalidates the bound worker response and publishes exact typed trajectories with reliable transient-local depth-1 QoS. Executor approval binds plan_id plus trajectory_sha256 and rejects Tesseract motion unless collision_model_qualified is true. The checked-in model was initially qualified on 2026-07-23, requalified with identical seed-42 output on 2026-07-24, requalified for exact all-zero acquisition egress with named positive compact-pair margins on 2026-07-25, and completed supervised five-view hardware acceptance on 2026-07-24.
      - Proposal-only mode publishes typed ScanExecutionPlan/Status and has no /joint_ctrl_single publisher.
      - Motion requires enable_real_arm_motion=true at launch plus the exact fresh plan ID and confirmation phrase through ApproveScanExecution; the executor never enables motors.
      - Candidate geometry spans twenty-five azimuths and a densely sampled 7-by-6 elevation/distance region. Manual batch mode selects the remaining diverse set and smooth route. Automatic closed_loop_one_view ranks coverage only from achieved accepted history, uses rejected history only for exclusion, preserves balanced coverage/compact shortlist membership, and attempts material-progress members before near-zero-progress fallbacks for the same missing face/axis.
      - Each workflow start creates a scan session ID. After every saved and accepted capture the executor publishes session-scoped camera/joint history. Automatic mode requests one of the remaining 24-minus-accepted bounded poses at a time; manual exact-13 mode retains its separately confirmed remaining-count behavior. The planner excludes accepted near-duplicates. A new session and capture-session completion delete the memory.
      - Schema-v5 freezes controller limits, speed, tesseract_stream_v3 and include_return_home. Automatic one-view MULTIVIEW_SCAN binds include_return_home=false and the worker emits exactly one hash-bound scheduled capture segment; manual batch emits one scheduled segment per selected view plus a planned contingency-home segment. Every normal segment retains all collision-checked source vertices and exact on-segment 20 Hz position targets with zero derivative placeholders. Dedicated RETURN_HOME remains one exact two-point direct zero-capture segment.
      - >-
        During normal acquisition/scan motion the executor publishes the exact
        hash-bound Tesseract position samples at 20 Hz without waiting at each
        intermediate sample. Feedback must remain within 0.30 rad of the latest
        scheduled target; only the final target waits for 0.025 rad convergence
        and the 0.005 rad settle window. If executor timing misses more than one
        sample it holds/aborts instead of bursting commands or shortcutting a
        collision-qualified corner. Dedicated configured-home stages keep their
        direct two-point feedback-gated behavior. After all
        thirteen session records exist, it follows the same approved
        trajectory to `[0.0,0.0,-0.026,-0.039,0.346,0.107]`, holds there,
        calls the workflow finish service, clears session memory, and reports
        COMPLETE; that return never triggers a capture. If return-only
        telemetry or settling fails, it holds the current feedback pose and
        reports the captures COMPLETE with a return warning rather than
        scheduling Step-4/5 recovery. A non-safety abort at a reached endpoint
        may reverse only the already executed, separately approved
        acquisition/scan targets to the original loaded pose after fresh
        settled joint, arm, motion-limit, camera-clock, obstacle, and collision
        validation. Safety, stale-telemetry, hardware, progress, emergency-stop,
        ownership, and operator-cancel faults hold instead. This is the nearest
        one-joint collision-qualified adjustment from the operator feedback
        pose: J3 is 0.050 rad lower because the exact folded pose violates the
        link1/link5 and link2/link5 model. A 90-second absolute target deadline
        or 20-second total-joint no-progress interval aborts or, after all
        captures, completes with the held-pose return warning. TrackingHealth
        reductions below the frozen approved speed or a persistent confirmed
        controller-limit change also stop motion.
      - piper_ctrl_single_node sends every JointCtrl position while caching unchanged MotionCtrl_2 MoveJ mode/speed. Six-position automation commands cannot issue a GripperCtrl; explicit seven-position commands retain cached gripper behavior. Enable/disable invalidates those caches so control state is reasserted. When a hash-bound command-free plan and its queued 1 Hz limit refresh arrive in the opposite callback order, the executor may hold that plan for at most the normal three-second limit timeout with approval unavailable; only a new valid matching sample resumes proposal validation.
      - At each target, the executor first requires joint position convergence, then accepts the qualified held-feedback velocity threshold of 0.20 rad/s plus settled TRACKING. It calls the workflow capture service for quality/cloud acceptance, calls /scan_capture/capture_view to persist the fresh synchronized raw RGB/depth/mask record, and only then waits for both accepted_views and modeled_views to advance before the next viewpoint.
      - A correlated GroundingDINO acquisition result is a one-shot event. If it arrives while an unrelated motion-limit/camera/joint freshness gap has placed the executor in WAITING_FOR_RUNTIME_REFRESH, the exact request-bound payload is cached without changing motion state and replayed only after runtime gates recover. Wrong request IDs, old image stamps and malformed statuses remain ignored.
      - Cancel clears an idle proposal or requests a current-position hold during execution; completion leaves the arm at the final approved view.
    tesseract_sequence: [Fresh atomic worker heartbeat and readiness, healthy Foxy snapshot, fresh typed controller limits, bounded candidates and obstacle boxes, schema-v5 OMPL_ISP/tesseract_stream_v3/effective-speed/20-Hz/seed-42 request, isolated ROS-free worker, six-joint IK and OMPL geometry, every exact source vertex retained, per-segment integer-tick sampling from the J1-J5 5 rad/s and J6 3 rad/s MoveJ model times selected percentage, 0.05 rad sample ceiling, adaptive Bullet validation of source geometry independent of transport density, bound hashes, Foxy exact schedule/zero-derivative validation, durable proposal and exact approval, sole executor publisher, clock-followed arm-only samples plus aligned aggregate MoveJ speed, 0.30 rad following guard, final feedback convergence and settle. Dedicated RETURN_HOME instead binds measured start plus one configured target and stage-bound bypass evidence.]
    implemented_validation: >-
      On 2026-08-11 tesseract_stream_v3 superseded v2. It schedules each exact collision-checked source segment at 20 Hz from J1-J5 5 rad/s and J6 3 rad/s multiplied once by selected speed, retains every source vertex, bounds each adjacent target to 0.05 rad, and keeps queried controller limits as mandatory health/hash evidence rather than a second timing multiplier. Controller acceleration remains internal. Core and compact rootless qualification pass; the five-percent regression emits J6 at 0.15 rad/s. Historical v2 task gui-sim-b945943e849f4e68ba587401b94e1c58 delivered acquisition at 99.9 Hz with 0.0079 rad maximum following error, acquired the target and proved clear occlusion, then exhausted the one-view 45-second budget while validating transport-density-derived samples. It failed NO_REACHABLE_PLAN but completed direct home, disable and cleanup with safe_shutdown=true. V3 validates source geometry independently of speed-derived sample count. Executor diagnostics and completion logs retain planned/actual duration, point count, achieved rate, maximum interval, dropped samples and following error. Current v3 task gui-sim-e9629c41e1224425b5adb0454b61ee3f physically ran at 20 percent: acquisition used 50 samples in 2.501 seconds at 19.6 Hz, scan segments remained approximately 18.0-19.6 Hz with aligned planned/actual duration, and the operator judged speed consistent. It persisted 15 GOOD/CLEAR captures and safely homed/disabled/cleaned up after an independent adaptive-frontier NO_REACHABLE_PLAN result.
    remaining_tesseract_validation: Deliberately validate safe cancel-to-hold and characterize 1/5/10 percent from the persisted timing/following telemetry. The 20-percent timing behavior is physically accepted, with measured following error below the existing 0.30-rad guard in the recorded segments. Higher percentages are capped by the 0.05-rad step ceiling and remain unqualified until the envelope is deliberately extended. Per-joint qdot/qddot tracking is not claimable through PiPER MoveJ. Worker replay/fuzz/soak and cross-engine/adversarial collision work remain useful.
    state_values: [IDLE, INVALID, PROPOSAL_READY, MOVING, SETTLING, SETTLING_HOME, WAITING_FOR_FRESH_FRAME, WAITING_FOR_GROUNDING_DINO, WAITING_FOR_TRACKING_LOCK, WAITING_FOR_OBSTACLE_SCENE, ACQUIRED, ACQUISITION_FAILED, CAPTURING, CAPTURING_RGBD, WAIT_CAPTURE, FINISHING_WORKFLOW, COMPLETE, ABORTED]
    current_validation: >-
      Offline kinematics/approval tests and isolated proposal-only ROS launch passed. A live
      proposal-only run on 2026-07-14 correctly produced no executable route from the compact
      post-zero pose: J2 feedback was about -0.017 rad versus the URDF 0 rad lower limit, the
      conservative model flagged wrist/base self-clearance at the starting configuration, and the
      configured -10-degree orbit pitch placed viewpoints below minimum camera height for the
      observed target. On 2026-07-17 the live proposal path found 12 workspace-safe candidates but
      correctly rejected all of them because the nearest initial camera step was 0.380 m versus the
      configured 0.250 m maximum. The typed invalid plan now preserves the 12-candidate count and
      reports that exact limit. The workflow start service stayed responsive after avoiding unused
      full-cloud decoding and retaining all Foxy subscription objects, but SCAN_READY remained
      blocked because the upstream SAM2 target-mask publisher was absent and no fresh LOCKED
      landmark could be produced. That historical run did not verify automatic execution and its
      safety thresholds were not relaxed. A separate supervised manual driver test on 2026-07-20
      successfully moved J6 from 0.006018 rad to 0.026306 rad at 5 percent and returned it to
      0.008111 rad with err_code zero and motion_status zero. The first command normalized the
      slightly negative J2 start to 0.0, so limit/model reconciliation remains required. This
      validates free physical J6 and the driver command path. A later 2026-07-24 run completed
      five automatic collision-qualified viewpoints at 5 percent with five accepted and modeled
      captures after fixing Target3D post-motion re-anchoring, tracking freshness, workflow
      diagnostics, target-cloud QoS, and capture/status ordering.
  real_joint_move:
    sequence: [Operator starts driver, operator explicitly enables arm, either the GUI or separately opted-in approved scan executor publishes bounded JointState targets, driver clips bounds and sends SDK joint commands, feedback updates /joint_states_single and TF.]
