capture_one_model_seed_or_zero_qualified_rays_2026_08_26:
  inspect: [scan_capture_node.py capture_model_seed_from_qualified capture_view_cb frame_metadata, target_envelope.py build_capture_model_seed validate_capture_model_seed, scan_viewpoint_executor_node.py capture_model_seed_from_response capturing_rgbd_tick record_accepted_view publish_scan_history, scan_session_memory.py validate_history_payload, scan_viewpoint_planner_node.py target_envelope_for]
  ownership: The recorder owns exact persisted capture-one mask/depth/CameraInfo plus the synchronized base-from-camera matrix. Target envelope helpers own seed normalization and digest validation. The executor owns fail-closed private Trigger-result admission and accepted-only promotion. Scan session memory owns transport validation. The planner owns revolution and permanent ray freeze from the immutable matrix.
  rule: Never promote latest_target_shape as model geometry, never reconstruct capture one from a rough or merely pre-capture framing mask, and never defer a new session's capture model transform to live TF. The framing silhouette remains an endpoint gate only. Capture service success without a valid capture_result_schema_version 1 qualified_target_model_seed must abort before workflow acceptance.
  required_retests: [test_scan_capture.py exact persisted model seed, test_target_envelope.py seed digest synchronization and envelope, test_phase1_executor_characterization.py missing-seed fail closed, test_scan_motion.py accepted-only promotion, test_scan_session_memory.py seed/shape correlation, test_scan_viewpoint_angles.py no-live-TF envelope path, complete mobile and Tesseract suites, changed-file lint, mobile package build, archived failed-capture replay]
  latest_physical_evidence: Task codex-e2e-model-seed-20260827-0123 persisted model_seed_sha256 b97bdd2d5b530d3bc83085d3d9226cc5635618608e6268c229c46f1b510dc4f0 with 0.032565248 second synchronization delta, generated 353 qualified rays, accepted three captures and completed operator-requested home disable cleanup with safe_shutdown true.
  follow_up: Automatic completion remains untested. The callback-isolated five-percent acquisition repeat delivered 90 points at 19.8 Hz with zero late ticks, so the next timing gate is a multiview segment under post-capture planning traffic. Its independent occlusion-probe re-detection failure must be diagnosed before that mission can reach capture one.
object_sized_coverage_or_ray_resurrection_2026_08_26:
  inspect: [target_envelope.py coverage_sphere_from_envelope, nbv_coverage.py ObjectCoverageModel explicit model geometry, scan_viewpoint_planner_node.py refresh_coverage_model retired_view_history and hard-cull ledger, ray_hard_culls.py canonical_ray_universe, bridge_node.py permanent_ray_ids_from_response, scan_planning_params.yaml minimum_useful_direction_separation_deg, tools/simulate_size_aware_ray_review.py source-report replay mode]
  ownership: Target envelope owns the qualified object centre size and bootstrap-anchor provenance. The planner owns the explicit bootstrap-to-qualified population replacement, qualified direction-universe identity, accepted-neighbour retirement and survivor reranking. The executor persists the one qualified centre upgrade after receiving the first envelope-bound plan. NBV coverage owns the centred grey voxel volume. The bridge owns typed endpoint-static response classification.
  rule: Bootstrap and qualified rays are different population identities. Never carry centre-dependent bootstrap workspace capability or endpoint culls into the qualified population. After the qualified population is created, never include envelope-varying representative positions or standoff bounds in its identity and preserve matching permanent ledgers across later generations. The journal must record population_reset at the upgrade, retain past culls visibly, and mark a ray newly culled only on an actual active-to-culled transition.
  required_retests: [test_target_envelope.py, test_nbv_coverage.py, test_scan_session_memory.py, test_scan_viewpoint_angles.py, tests/planning/test_ray_hard_culls.py, test_ray_mission_diagnostics.py, test_bridge_feedback_freshness.py, test_capability_map.py, complete mobile and Tesseract suites, changed-file lint, affected package build, command-free lifecycle replay with viewer model load, YAML parse]
model_seed_or_first_ray_order_regression_2026_08_26:
  inspect: [scan_viewpoint_executor_node.py settling_tick settled_first_capture_framing_result first_capture_model_seed and publish_scan_history, scan_session_memory.py qualified_target_shape validation, scan_viewpoint_planner_node.py provisional_first_ray_allowed target_envelope_for target_cb and frozen_ray_pool, target_envelope.py build_revolution_envelope]
  ownership: The planner owns a session-frozen provisional generation-zero pool without shape geometry. The executor alone holds a complete source-stamped silhouette after the first endpoint is settled and aimed and promotes it after capture acceptance. The planner may build the revolution only from that validated history field.
  rule: Rough acquisition may localize but never seed or crop-classify. Hold the settled aimed complete shape as pending during capture, promote it only with accepted capture one, and discard it on any rejection. A qualified seed is immutable for the session and its transform uses its own source stamp and the frozen history target centre.
  required_retests: [test_scan_viewpoint_angles.py, test_phase7_viewpoint_components.py, test_scan_session_memory.py, framing-focused tests, complete mobile and Tesseract suites, affected package build, YAML parse, separately authorized physical repeat]
target_shape_qos_handoff_2026_08_26:
  inspect: [depth_to_3d_node.py shape_pub QoS, scan_viewpoint_executor_node.py TARGET_SHAPE_QOS and target_shape_cb, scan_session_memory.py qualified_target_shape, test_phase7_viewpoint_components.py source-stamp regression]
  ownership: depth_to_3d_node publishes repeated private shape evidence and only the executor consumes that topic for the settled first-capture gate. The planner consumes the executor-qualified copy inside scan history. The live topic uses BEST_EFFORT/VOLATILE sensor-data QoS.
  rule: Never request RELIABLE on a consumer while the publisher offers BEST_EFFORT. Missing or malformed shape evidence remains fail closed.
  required_retests: [target-shape DDS delivery smoke, test_mission_core.py, framing-focused tests, complete mobile and Tesseract suites, affected package build, separately authorized physical repeat]
first_scan_ray_framing_gate_2026_08_26:
  inspect: [mission_engine.py first_capture_framing_action and _handle_scan, scan_viewpoint_executor_node.py settled_first_capture_framing_result and final_capture_aim_rejection, scan_viewpoint_planner_node.py provisional_first_ray_allowed and restrict_to_framing_retry, scan_session_memory.py framing retry metadata validation, target_envelope.py classify_centered_silhouette]
  ownership: The executor owns settled pre-capture evidence and final aim; the planner owns preserving one ray ID and raising its minimum standoff; MissionEngine owns retry sequencing and public too-close or too-large results; Tesseract retains exact IK collision path aim and visibility authority.
  rule: ACQUIRED is tracking-only. Select and reach the first scan ray before crop classification. Require a fresh post-settle shape and <=5-degree achieved aim before classification. A middle-band crop rejects without capture and retries only the same ray farther out; the path need not remain on the ray, but its endpoint must aim at the frozen target centre. At or below 0.250 m or when no farther aimed endpoint is feasible report too close; at 3.000 m report too large. Never revolve a cropped mask or bypass clearance.
  required_retests: [test_target_envelope.py, test_scan_viewpoint_angles.py, test_mission_engine.py, test_phase7_viewpoint_components.py, test_scan_session_memory.py, Phase 1 mission and executor characterization, complete mobile and Tesseract suites, changed-file flake8 and pep257, affected package build, YAML parse, separately authorized physical smoke]
clipped_target_shape_failure_2026_08_26:
  inspect: [depth_to_3d_node.py clipped-shape publication, target_envelope.py border validation rejection record and centered classification, scan_viewpoint_executor_node.py aim and source-stamp proof, mission_engine.py framing order, scan_viewpoint_planner_node.py qualified history seed and retry restriction, failure_model.py typed framing tags]
