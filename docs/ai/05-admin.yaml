research_maintenance_routing_2026_08_26:
  per_ray_framing_or_unknown_size_scanning:
    inspect: [docs/ai/65-research-context.yaml, target_envelope.py, scan_viewpoint_planner_node.py, viewpoint_rays.py, piper_tesseract_foxy/bridge_node.py, piper_tesseract_foxy/worker.py]
