constrained_superposition_and_aim_routing_2026_08_29:
  reconstruction_inspect: [reconstruction/tsdf_reconstruct.py constrained_superposition_camera_poses solve_constrained_translations solve_constrained_rigid_corrections robust_cross_capture_consensus, reconstruction/texture_baking.py consensus support projection visibility atlas and OBJ writer, reconstruction quality JSON multiway_registration correction_objective cross_capture_consensus texture_baking and auto candidate_reports, constrained measured_points and consensus_points PLY plus textured OBJ MTL PNG files, reconstruction/gui_support.py constrained_output_paths, piper_gui/native_app.py Open Superposition Overlay Open Consensus Points and Open Textured Model]
  aim_inspect: [piper_gui/scan_aim.py, scan_execution_params.yaml final_capture_aim_tolerance_deg, supervised_viewpoint_execution.launch.py final_aim_tolerance, piper_tesseract_foxy bridge candidate construction, worker dense visibility, scan_viewpoint_executor_node.py final_capture_aim_rejection]
  rule: constrained_superposition admits a nonempty capture set. With one capture it fixes capture zero exactly at the nominal pose and performs no alignment; with two or more it permits unbounded later-view translation and caps each camera-origin-centred rotation at 3 degrees while a one-degree prior selects the minimum rotation supported by connected mutual normal-consistent overlaps. Do not require every later surface to overlap capture zero directly; indirect overlap must remain connected to its fixed gauge. Cross-capture consensus remains unavailable until two captures exist. Nonempty undersized meshes are retained as diagnostic FAIL outputs, not accepted quality. This permissive offline alignment is not calibration evidence. The independent scan-view aim selector accepts 1.0-90.0 degrees for later views, but rough acquisition and accepted_views zero remain capped at 5 degrees; never let an idle GUI edit mutate a running mission.
  required_retests: [reconstruction unit and immutable one-view two-view and multi-view replay including one-vote-per-view and consensus support/spread, GUI consensus path and scan-aim tests, typed configuration tests, executor achieved-FK characterization, Tesseract worker validation, capability-map source-hash and array-identity validation, launch generation, package build, no hardware command]
  texture_rule: Texture baking is offline and additive. Start from every corrected measured depth pixel in the constrained superposition, retain consensus-supported points, triangulate only adjacent source pixels, then fine-voxel fuse them into a separate dense surface without changing the existing cleaned TSDF artifact. Each textured triangle selects one depth-consistent target-masked source capture; do not average independent RGB views or treat texture coverage as geometry quality. One-view output is explicitly unverified geometry. The viewer must load textured OBJ with post-processing so Open3D removes its empty default material and binds the actual RGB texture.

removed_surface_completion_trial_routing_2026_08_30:
