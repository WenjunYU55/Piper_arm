  inspect: [mission_engine.py _handle_enable_and_hold, target_scan_mission_node.py wait_for_post_enable_stability, startup_gates.py post_enable_sample_rejection, /arm_status, /joint_states_single, driver.log, scan_stack.log]
  rule: Prove new post-enable feedback continuously stable, fault-free and all-six-enabled for two seconds. Do not widen buffers, suppress controller faults, or start ROUGH_HOME before wrist completion.
  retest: [startup-gate tests, mission-engine tests, mission characterization, full mobile suite, package build, explicitly authorized five-percent startup-only smoke]

