  focused_ros_build: "cd piper_ros_foxy && colcon build --packages-select piper_mobile_manipulation piper_tesseract_foxy --symlink-install"
  focused_ros_tests: "source /opt/ros/foxy/setup.bash && source piper_ros_foxy/install/setup.bash && python3 -m pytest -q test_piper_gui_phase8.py test_piper_gui_automation.py test_piper_gui_acquisition_service.py test_gui_transport_profile.py piper_ros_foxy/src/piper/test/test_enable_handshake.py piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_motion.py piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_target_acquisition.py piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_capture.py piper_ros_foxy/src/piper_mobile_manipulation/test/test_supervised_workflow.py piper_ros_foxy/src/piper_tesseract_foxy/test"
  tesseract_rootless_qualification: "./motion_planning/tesseract/qualify_rootless_worker.sh"
  scan_motion_tests: "python3 -m pytest -q piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_motion.py"
  safety_shadow_tests: "python3 -m pytest -q piper_ros_foxy/src/piper_mobile_manipulation/test/test_safety_evaluator.py piper_ros_foxy/src/piper_mobile_manipulation/test/test_phase1_executor_characterization.py piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_motion.py"
