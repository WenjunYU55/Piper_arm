symptom_routing:
  motor_fault_or_partial_enable:
    inspect: [all six motor low-speed FOC driver_enable_status flags, per-motor voltage/temperature/current/collision/driver/stall flags, /arm_status, can0 error state, exact process ownership]
    note: Stop command owners, use the physical emergency stop as required, and issue the explicit all-axis DisableArm(7) path. A high-level arm err_code of zero does not clear a per-motor FOC fault. Never reset, re-enable or command home after contact until the mechanism and affected joint are inspected. The driver must roll failed partial enable back to six false flags; any motor fault while another axis is powered triggers all-axis disable.
  camera_holder_near_support_plane:
    inspect: [scan_execution_params.yaml camera_holder_envelope_*, scan_motion.py attached-box external clearance, collision_model.yaml external_floor_clearance, worker.py dense direct-home validation]
    note: Direct configured home bypasses only intentional folded robot self-collision. The full CAD-derived installed holder/L515 link6 envelope must retain at least 0.005 m floor/external clearance at the measured start and every dense path sample. A start already below that margin is NEEDS_OPERATOR, never an automatic home authorization.
  no_ros_topics:
    inspect: [ROS_DOMAIN_ID, ROS_LOCALHOST_ONLY, source_piper_foxy_environment.sh, L515_camera/source_l515_environment.sh, ros2 pkg prefix piper_mobile_manipulation, ros2 pkg prefix piper_tesseract_foxy]
    note: If CAN counters and piper_ctrl_single_node remain active but /joint_states_single and /arm_status deliver no samples to an exact-QoS probe, verify the installed driver contains the monotonic wall-clock feedback loop and restart the disabled-arm driver. Do not bypass downstream freshness gates.
  camera_missing_or_slow:
    inspect: [L515_camera/check_l515_ros.sh, L515_camera/diagnose_l515_usb.sh, L515_camera/start_l515_camera.sh, L515_camera/start_l515_camera_low_bandwidth.sh]
    note: The normal and low-bandwidth launchers externally bound each direct Foxy parameter CLI transaction to two seconds. If the camera node is late or absent, preserve that bound and let the startup loop retry/fail closed; an unbounded pre-node direct-discovery command can consume system memory.
  camera_clock_stale_or_nonmonotonic:
    inspect: [/piper/camera_timestamp_health, /joint_states_single position stability, camera_timestamp_watchdog_node.py, camera_timestamp_watchdog_params.yaml, /tmp/piper_vision_recovery/request.yaml, L515_camera/run_gpu_vision_pipeline.sh]
  gpu_pipeline_ctrl_c_leaves_workers:
    inspect: [L515_camera/stop_gpu_vision_pipeline.sh, /tmp/piper_vision_recovery/process_groups.txt, L515_camera/run_gpu_vision_pipeline.sh]
  mask_never_appears:
    inspect: [L515_camera/run_gpu_vision_pipeline.sh, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/heavy_refresh_bridge_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/sam2_live_bridge_node.py, /tmp/piper_heavy_refresh, /tmp/piper_sam2_live]
  tracking_lost_during_arm_motion:
    inspect: [L515_camera/publish_hand_eye_tf.py, motion_compensated_prompt_node.py, sam2_live_bridge_node.py, target_tracker_node.py, tracking_params.yaml]
  tracking_confidence_below_60_percent:
    inspect: [/piper/tracked_target, /piper/tracking_health, /piper/heavy_refresh_status, sam2_live_bridge_node.py, PIPER_LOW_CONFIDENCE_REFRESH_THRESHOLD, PIPER_LOW_CONFIDENCE_REFRESH_DURATION_SEC]
  target3d_rejected:
    inspect: [depth_to_3d_node.py, target_tracker_node.py, camera_params.yaml, tracking_params.yaml, /piper/target_3d]
    note: A real post-motion depth step must not latch permanently to the old view. The projector rejects isolated jumps but re-anchors after the configured number of mutually consistent samples; max_depth_jump_m less than or equal to zero disables the jump gate.
  cube_visible_but_workflow_not_ready:
    inspect: [/piper/sam2_detection_2d, /piper/tracked_target, /piper/tracking_health, /piper/target_status, /supervised_cube_workflow/diagnostic_state, /piper/target_landmark_status, /piper/obstacle_instances_3d]
    note: Require the diagnostic measured_lock_ready=true from a fresh valid stable base_link TrackedTarget, TrackingHealth TRACKING/camera_settled/nonprediction, exact LOCKED status, a fresh obstacle array, and SCAN_READY. target_landmark is diagnostic and must not independently block Step 4.
  accepted_capture_not_modeled:
    inspect: [/piper/target_cloud, /piper/target_cloud_status, /supervised_cube_workflow/diagnostic_state, supervised_cube_workflow_node.py, target_cloud_node.py]
    note: /piper/target_cloud is best-effort sensor QoS and the workflow subscription must match it. The workflow caches a capture cloud while WAIT_CAPTURE and processes it after the matching accumulating/full_resolution_refinement acceptance, regardless of message order.
  accepted_view_missing_rgbd_record:
    inspect: [/scan_capture/capture_view, /piper/scan_capture_status, datasets/active_scan, scan_capture_node.py, scan_capture.py, scan_capture_params.yaml, scan_viewpoint_executor_node.py]
    note: In supervised service mode the executor must enter CAPTURING_RGBD and receive one exact-stamp mask/RGB identity plus synchronized aligned RGB-D, native depth/camera-info, L515 confidence, TF and GOOD/CLEAR evidence. Schema 2 writes all artifacts transactionally. Catch-up/stale synchronization gaps retry at the held pose; fresh depth-quality rejection excludes the view; malformed provenance or failed persistence aborts and holds.
  target_depth_layer_jitter:
    inspect: [utils/target_depth.py, depth_to_3d_node.py, target_landmark_node.py, occlusion_checker_node.py, scan_capture.py, camera_params.yaml, test_depth_to_3d.py]
    note: All target-depth consumers must use the shared ambiguity-aware component selector. A close score tie fails closed; do not restore whole-mask median depth or seed-pixel flood filling independently in one consumer.
  false_occlusion:
    inspect: [occlusion_checker_node.py, occlusion_checker_params.yaml, /piper/occlusion_status]
  heavy_refresh_storm:
    inspect: [sam2_live_bridge_node.py, target_landmark_node.py, heavy_refresh_bridge_node.py, /piper/heavy_refresh_status, PIPER_MAX_REACQUISITION_ATTEMPTS, PIPER_ABSENT_RETRY_SEC]
  stale_or_wrong_tf:
    inspect: [piper_ros_foxy/src/piper_description/urdf/piper_description.xacro, piper_ros_foxy/src/piper_description/launch/display_live_robot.launch.py, /home/prl/Downloads/Intel_RealSense_LiDAR_L515_Datasheet_Rev003.pdf, rs-enumerate-devices -c, L515_camera/run_hand_eye_tf.sh, L515_camera/publish_hand_eye_tf.py, L515_camera/calibration/hand_eye/session_20260808_straight_mount/calibration_result.yaml, L515_camera/calibration/hand_eye/session_20260808_straight_mount/fixed_board_validation_registered_20260810_corrected_board.yaml, /joint_states_single, joint6 reference adjustment metadata]
    note: The operator measured the physical 5x5 ChArUco board on 2026-08-10 as 17 mm squares and 12 mm markers. All saved August 8 fitting/held-out samples and the three earlier fixed-board reports encode the former 18 mm/13 mm model, so their PARK transform and translation/rotation metrics are wrong-scale provenance only and must not be restored or deployed. Reprojection error does not validate metric scale. The active transform instead uses the scale-independent operator-confirmed CAD housing placement, Intel Rev 003's 4.5 mm depth offset, and device f1120648's factory colour-to-depth extrinsic. l515_visual depth optical is [0,0,-0.008224997] m with straight housing-normal axes; colour optical is [-0.0002000813,0.0141312284,-0.0040001602] m with the legitimate 1.322466-degree factory skew. The superseded [0,0.014,-0.008694998] m anchor incorrectly mixed RGB X-Y with depth Z. The 2026-08-10 read-only live overlay reproduced every deployed transform exactly. Capture and fixed-board validation now share and persist exact 0.017 m/0.012 m dimensions and use the same 0.75-second/0.001-rad position-stability gate. The corrected-scale five-pose report passed all poses with mean/worst translation 5.73/12.22 mm and rotation 0.87/1.25 degrees against 15 mm and 1.5 degrees. Because the board is itself the stationary metric target and its base_link pose passed at five distinct stable arm poses, deployment physical_revalidation is passed. Semantic cube tracking repeatability remains an acquisition acceptance test. The 2026-07-01 result is rollback history only; never restore the rejected analytical J6 compensation.
  arm_will_not_move:
    inspect: [check_piper_can.sh, can0 state and error counters, passive candump, arm power and CAN wiring/termination, PiPER motion-output/slave role 0xFC with zero offsets, start_piper.sh, /joint_states_single, /arm_status ctrl_mode, /enable_srv, /joint_ctrl_single]
  unsafe_or_clipped_joint_command:
    inspect: [piper_joint_bounds.json, piper_gui_native.py, piper_ctrl_single_node.py]
  j6_planning_or_execution:
    inspect: [piper_joint_bounds.json, calibration_result.yaml, scan_motion.py, scan_viewpoint_executor_node.py, piper_tesseract_foxy, docs/ai/30-contracts.yaml, docs/ai/60-debt.yaml]
    note: J6 was operator-confirmed fully safe on 2026-07-17. On 2026-08-10 the operator corrected its controller-coordinate range to [-pi,+pi]; every software fallback/model/qualification fixture now agrees, but the expanded range has only command-free qualification. The approximately 0.04 rad persistent controller-zero error was corrected at physical neutral at 18:18, then an independent three-second diagnostic reported exactly 0.00000 rad throughout, disabled, with no faults. Never reproduce that correction in TF or asymmetric command/feedback offsets. The legacy fixed-J6 executor and IK helper were removed on 2026-07-24. Tesseract is mandatory and uses all six joints equally with normal limits and collision checks and no J6-specific cost.
  tesseract_worker_unavailable:
    inspect: [bubblewrap, micromamba, motion_planning/tesseract/setup_rootless_worker.sh, motion_planning/tesseract/qualify_rootless_worker.sh, motion_planning/tesseract/run_worker.sh, /piper/tesseract_plan_status, spool_root]
    note: Direct 0.35 wheels do not target Focal glibc. The verified workstation route is the pinned rootless Ubuntu 24.04 userspace; Podman remains an optional packaging route. In the Bubblewrap route run_worker.sh must remain the direct parent while --die-with-parent is active, including when the GUI's short-lived startup thread returns. Never install the old 0.4 wheel as production fallback.
  tesseract_plan_rejected_for_motion:
    inspect: [piper_tesseract_foxy/model/collision_model.yaml, piper_description/meshes/planning_30mm/collision_mesh_manifest.json, piper_tesseract_foxy/collision_meshes.py, piper_tesseract_foxy/bridge_node.py closed_loop_max_aim_offset_deg, /piper/tesseract_plan, /piper/scan_execution_status, trajectory_sha256]
    note: >-
      qualified_for_hardware became true on 2026-07-23 for supervised guarded
      execution after the augmented camera/mount/local-cable model and bounded
      exact-path Bullet validation passed. On 2026-07-24 the worker was corrected
      to apply request-bound OMPL seed 42 before constructing planners, and the
      detour qualification returned identical PASS output twice. For automatic
      close-range views, distinguish an unusable exact target-centred wrist pose
      from an unusable camera position: the bridge may preserve the measured
      optical direction only inside the configured 12-degree target cone before
      the exact request is hashed. Tesseract and the executor must still validate
      that exact relaxed pose/path. Approval still fails closed for false or
      mismatched qualification, seed mismatch, or any stale/hash/health error.
  tesseract_snapshot_or_reachability_stale:
    inspect: [/arm_status, /joint_states_single, /piper/reachable_scan_viewpoints, /piper/tesseract_readiness, /piper/tesseract_plan_status, worker_health.json, viewpoint_reachability_filter_node.py, piper_tesseract_foxy/bridge_node.py, supervised_viewpoint_execution.launch.py, ROS_DOMAIN_ID, ROS_LOCALHOST_ONLY]
    note: The proposal wrapper sources only Foxy plus the PiPER overlay and starts participants in a validated staggered order. Scan bridge and reachability subscriptions are created once and retained; missing/stale callbacks block planning without runtime endpoint recreation. Inspect readiness blockers and the worker heartbeat before graph surgery. The driver uses an executor-owned 200 Hz timer. Verify actual samples with an application-level subscriber because Foxy CLI echo/hz can be misleading.
  gui_or_scan_transport_crashes:
    inspect: [kernel OOM log, GUI RSS, fastdds_gui_udp_only.xml, FASTRTPS_DEFAULT_PROFILES_FILE, RMW_FASTRTPS_USE_QOS_FROM_XML, effective ROS_LOCALHOST_ONLY, /dev/shm/fastrtps_port*, test_gui_transport_profile.py]
    note: GDB proved the 2026-07-27 runaway was Foxy graph ParticipantEntitiesInfo deserialization through stale Fast DDS shared-memory state. The GUI transport remains loopback-only UDP and must set RMW_FASTRTPS_USE_QOS_FROM_XML=0 and ROS_LOCALHOST_ONLY=0. Phase 8 does not let the GUI start/restart perception or the scan stack; inspect the production mission-owned process generation separately.
  tesseract_plan_missing_after_worker_success:
    inspect: [/scan_viewpoint_executor/diagnostic_state, /piper/tesseract_plan, TesseractPlan QoS, piper_tesseract_foxy/bridge_node.py, scan_viewpoint_executor_node.py]
    note: The validated plan handoff is reliable transient-local depth 1. Keep publisher and subscriber QoS aligned; expiry, hashes, camera health, and collision qualification are still revalidated after delivery.
  obstacle_tf_or_scene_blocked:
    inspect: [/piper/obstacle_instances_3d, obstacle_instance_3d_node.py, obstacle_instance_3d_params.yaml, base_link to camera_color_optical_frame TF, SAM2 result metadata]
    note: The obstacle node recreates its read-only TF listener only after three continuous seconds without a successful exact-stamp transform; an isolated lookup miss must not clear its buffer. Transform-unavailable, stale-transform and stale-source invalid instances are bounded missing/stale telemetry holds before motion, while semantic/unqualified or otherwise invalid geometry remains an immediate planning blocker. Valid unsafe objects are forwarded by the Tesseract bridge as collision boxes.
  gpu_geometry_child_exits_or_obstacles_become_stale:
    inspect: [gpu_geometry.launch.py, obstacle_instance_3d_node.py, vision parent process status, test_gpu_geometry_launch.py, test_tracking_recovery.py archived-mask projection]
    note: Every gpu_geometry child is critical and must emit launch Shutdown on exit. The 2026-08-10 eleven-view run found a missing cv2 import in the archived heavy-mask path; that import and a real mask-file regression are now mandatory. If any geometry child exits, diagnose its first exception and restart the exact owned vision generation; do not keep a partial launch alive or increase stale-topic timeouts.
  tesseract_start_state_outside_limits:
    inspect: [/joint_states_single, /piper/tesseract_plan_status, piper_description.xacro, piper_joint_bounds.json, piper_tesseract_foxy/contract.py]
    note: Historical requests correctly failed against the then-stale 0.0 rad J2 lower limit. On 2026-07-30 the production model was aligned to the exact enabled compact-pose feedback -0.044796192 rad after the previous -0.040522412 rad record caused OMPL to clamp the live start. Continue to reject any state outside the current bound and never clip or fake a snapshot.
  gui_3d_preview_missing_or_wrong:
    inspect: [piper_gui_native.py, joint_preview.launch.py, piper_joint_preview_node.py, joint_preview.rviz, piper_description.xacro, /piper_gui/preview_set, /piper_gui/preview_joint_states, /piper_gui_joint_editor/update]
  camera_holder_missing_or_misaligned:
    inspect: [piper_ros_foxy/src/piper_description/meshes/camera_holder.STL, piper_ros_foxy/src/piper_description/meshes/Intel_RealSense_L515_CAD_external.STL, piper_ros_foxy/src/piper_description/urdf/piper_description.xacro, piper_ros_foxy/src/piper_description/launch/display_live_robot.launch.py, L515_camera/calibration/hand_eye/session_20260808_straight_mount/calibration_result.yaml]
    note: The physical gripper reversal is the fixed link6-to-gripper_base yaw of pi; do not add pi to joint6 feedback or commands. The holder STL is millimetre-authored and retains scale 0.001. Its visual origin [0.1765,-0.0565314679146,0.0612789535522] and ordered X-then-Z orientation are user-locked and must not move; the nominal close 12 mm arm datum therefore retains an intentional -4 mm holder-frame Z trim. The L515 datum is the 40 mm screw pair through the raw lower circular cradle, which becomes the installed upper ring after the fixed rotations; the 87.763214 mm lateral tab pair is not the camera datum. l515_visual is fixed at [0.1,0,0] m with rpy [-pi,pi,pi/2], mesh offset [-0.030503129,-0.030503409,-0.029628554] m and an operator-confirmed +2.5 mm axial seating trim. It uses scale 0.001 and a contrasting silver material and has no collision authority. The CAD housing placement, datasheet depth datum, and serial-bound factory extrinsic constrain the deployed optical transform; changes still require the complete TF/calibration validation group.
  no_scan_execution_proposal:
    inspect: [/piper/reachable_scan_viewpoints, /piper/tesseract_plan_status, /piper/tesseract_plan, /piper/scan_execution_plan, scan_execution_params.yaml, piper_tesseract_foxy, scan_motion.py, scan_viewpoint_executor_node.py]
  rough_acquisition_will_not_plan:
    inspect: [/scan_target_acquisition/prepare, /piper/tesseract_readiness, worker_health.json, /piper/acquisition_viewpoints, /piper/reachable_acquisition_viewpoints, /tesseract_plan_bridge/request_acquisition_plan, /piper/tesseract_plan_status, /scan_viewpoint_executor/diagnostic_state, piper_tesseract_foxy/model/collision_model.yaml, motion_planning/tesseract/diagnose_request_ik.py]
    note: PrepareAcquisition must contain one valid unique session ID plus finite fresh base_link PointStamped data. An exact duplicate is idempotent; changed data under the same ID is rejected. Check fresh worker heartbeat/readiness and verify the same source_request_id through candidate, TesseractPlan, and ScanExecutionPlan. The 2026-07-25 compact-start fix may prepend one bounded monotonic hash-bound recovery only to the first bootstrap_static ROUGH_ACQUISITION segment. Do not disable pairs or extend it to MULTIVIEW_SCAN.
  rough_acquisition_did_not_find_target:
    inspect: [/piper/scan_execution_status, /piper/heavy_refresh_request, /piper/heavy_refresh_status, /piper/tracked_target, /piper/tracking_health, /piper/target_status, heavy_refresh_contract.py, AI_perception_tests/heavy_model_worker.py, AI_perception_tests/temporal_heavy_refresh.py, L515_camera/run_heavy_model_worker.sh, /tmp/piper_heavy_refresh]
    note: Each settled pose waits up to 10 seconds for a post-settle image/idle worker, 60 seconds for its exact GroundingDINO request, and 10 seconds for a fresh measured LOCKED target within 0.30 m of the hint. The current-run Heavy-model worker ready marker must appear only after local-cache-only GroundingDINO preload; Hugging Face network retries indicate a broken launch contract. target_mask_missing advances; correlation, worker, clock, scene, or health failures abort and hold.
  acquired_but_13_view_plan_not_available:
    inspect: [/piper/scan_execution_status, /piper/supervised_workflow_status, /supervised_cube_workflow/diagnostic_state, /piper/tracked_target, /piper/tracking_health, /piper/target_status, /tesseract_plan_bridge/request_plan, mission_engine.py, target_scan_mission_node.py]
    note: ACQUIRED-to-SCAN_READY and the one-view closed-loop request are production MissionEngine responsibilities. Inspect the action feedback, workflow authority and mission-owned process health. The Phase-8 GUI is display-only and cannot adopt a lock, start a stack, request a plan or approve execution.
  scan_motion_is_jerky:
    inspect: [/piper/motion_limits, TesseractPlan timing_policy/execution_speed_percent/command_rate_hz/motion_limits_sha256, scan_trajectory.py, worker.py, scan_viewpoint_executor_node.py, scan_execution_params.yaml, piper_ctrl_single_node.py, /piper/scan_execution_status, /joint_states_single]
    note: >-
      tesseract_stream_v3 binds fresh controller limits and selected aggregate
      SDK speed, preserves every collision-checked OMPL/ISP source vertex, and
      schedules exact on-segment arm-only positions at 20 Hz. The adapter uses
      J1-J5 5 rad/s and J6 3 rad/s multiplied once by selected speed, plus a
      0.05-rad hard step ceiling. Fresh queried limits remain health/hash
      evidence and are not a second timing multiplier. ISP derivatives are
      never treated as PiPER commands. Intermediate samples do not
      wait for convergence; feedback supplies a 0.30 rad following guard and
      final endpoint/settle proof. Any multi-sample schedule overrun aborts to
      hold rather than bursting or shortcutting a planned corner. Dedicated
      zero-capture RETURN_HOME remains the explicit exact two-point direct
      exception with its existing stage-bound collision-bypass evidence and
      feedback-gated endpoint. PiPER MoveJ does not consume per-joint qdot/qddot,
      so those response fields remain exact-zero placeholders. Software tests,
      both affected builds and both command-free rootless suites pass. Task
      gui-sim-e9629c41e1224425b5adb0454b61ee3f physically exercised the current
      stream at 20 percent; planned/actual timing aligned at approximately
      18.0-19.6 Hz and the operator judged speed consistent. The remaining
      1/5/10-percent stages and deliberate cancel-to-hold are still pending;
      settings above 20 percent remain capped and unqualified. Inspect
      the diagnostic-state planned/actual duration, achieved rate, maximum
      interval, dropped samples and following-error fields after each segment.
  arm_reaches_pose_but_never_settles:
    inspect: [/joint_states_single, /piper/scan_execution_status, scan_viewpoint_executor_node.py, target_scan_mission_node.py, scan_execution_params.yaml]
    note: Use an application-level subscriber to compare measured position deltas with SDK velocity. PiPER instantaneous velocity can spike while positions remain stationary and is diagnostic only. Normal endpoint proof requires target error at most 0.025 rad plus a continuous 0.005 rad position-anchor window; configured home uses 0.030 rad plus the same 0.005 rad stability. Do not raise timeouts or weaken target/position bounds to mask missing or moving feedback.
  gui_automatic_scan_will_not_start:
    inspect: [piper_gui_native.py, piper_gui/ros_client.py, piper_gui/view_model.py, /piper/run_target_scan, run_target_scan_mission.sh, target_scan_mission_node.py]
    note: Phase 8 submits only the production action. Verify the singleton mission listener/action server, goal acceptance and typed result. Do not start a worker/scan stack from the GUI or restore the retired Step 1-5 service clients.
  acquisition_failure_does_not_reach_configured_home:
    inspect: [target_scan_mission_node.py, scan_viewpoint_executor_node.py, home_pose.py, /scan_viewpoint_executor/execute_home_stage, /piper/scan_execution_status, /joint_states_single]
    note: A reverse of ROUGH_ACQUISITION proves only plan start and is never used by automatic recovery. The current path uses /scan_viewpoint_executor/hold to stop at measured feedback, then executes PRE_HOME, ROUGH_HOME and STORAGE_WRIST through the mission-authorized direct service, verifies each configured endpoint, holds, disables and cleans up. Tesseract is not part of configured-home planning.
  retired_gui_step2_historical_failure:
    inspect: [source_piper_foxy_environment.sh, ros2 pkg prefix piper_mobile_manipulation, ros2 pkg prefix piper_tesseract_foxy, piper_mobile_manipulation.scan_capture, TesseractPlan bootstrap_recovery_* fields, scan_capture_node, tesseract_plan_bridge]
    note: Historical only after Phase 8; the production GUI has no Step 2. The 2026-07-25 stale-overlay cause remains useful mission-stack diagnostic history. Do not reconnect the archived GUI workflow or modify limits, collision margins, or J6 to mask an interface mismatch.
  scan_execution_will_not_start:
    inspect: [/piper/scan_execution_status, /piper/camera_timestamp_health, /piper/tracking_health, /piper/supervised_workflow_status, /piper/obstacle_instances_3d, enable_real_arm_motion, plan_id, trajectory_sha256, collision_model_qualified, approval confirmation]
  scan_execution_aborted:
    inspect: [/arm_status, /joint_states_single, /piper/tracking_health, /piper/scan_execution_status, executor terminal log]
  ros_type_support_error:
    action: Clean only build/install artifacts for piper_mobile_manipulation, rebuild it, and source a fresh overlay; see OPERATOR_COMMANDS.md.
