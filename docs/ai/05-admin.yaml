post_view_tracking_lost_2026_08_20:
  inspect: [mission_engine.py VIEW_COMPLETE VIEW_REJECTED and target-drift branches, target_scan_mission_node.py request_multiview_plan and approve_plan, /piper/tracking_health, /piper/tesseract_view_generation]
  rule: Initial scan admission still requires stable multiview readiness. Between views, do not add a second generic readiness owner; re-enter the command-free request path, which owns bounded visual reacquisition, then require the unchanged full plan approval before motion.
capture_refresh_waits_then_times_out_2026_08_20:
  inspect: [/piper/heavy_refresh_status request_id and state, heavy_refresh_bridge_node.py pending_request, scan_viewpoint_executor WAITING_FOR_CAPTURE_REFRESH, heavy worker request processing and response directories]
  rule: A correlated request arriving while the single-flight worker is busy is retained by the bridge and reported as waiting_for_worker, then queued once when idle and a qualifying fresh frame exists. Do not add another executor retry loop or start a second worker.
global_nbv_or_final_aim_failure_2026_08_20:
  inspect: [/piper/scan_session_history latest_achieved_camera, /piper/scan_coverage stage-local candidate counts and selection_failure_code, /piper/reachable_scan_viewpoints prequalified fields, /piper/tesseract_plan_status, /piper/tesseract_plan_provenance worker attempt diagnostics, frame metadata view_selection and camera_transform, tools/replay_nbv_coverage.py]
  rule: Generated and prequalified are not Tesseract-reachable. Distinguish NO_POSITIVE_INFORMATION_CANDIDATE from TESSERACT_EXHAUSTED. For authoritative voxel_nbv, rank the complete configured region and shortlist twelve; keep six broad-sector global information leaders, five mid-elevation alternatives in those sectors, and one nearest positive-information continuity view from achieved FK. Final attempt order remains NBV rank. Try exact target aim first and allow only one hash-bound fallback within the effective first-lock-five-degree or frozen later-view tolerance. A rejected capture updates latest achieved physical FK but never coverage.
  ownership_note: Capture status reports acceptance and its human-readable reason. The capture coordinator and executor alone decide one-refresh retry versus view rejection; capture status does not prescribe recovery policy.
  replay: "python3 tools/replay_nbv_coverage.py datasets/active_scan/scan_20260820_142919 --json"
target_estimate_moves_with_stationary_object_2026_08_20:
  inspect: [depth_to_3d_node.py qualified component support, target_tracker_node.py timestamped base_link transform and Kalman state, Target3D measurement_confidence, tracking_params.yaml camera-space gate setting, capture-time synchronized_target_3d]
  rule: Never smooth eye-in-hand coordinates in the moving camera frame. Require a fresh correlated target mask, use only finite confidence/depth-qualified component measurements, transform at their source timestamp, reject statistically implausible innovations and filter in base_link. Missing or rejected measurements are prediction-only and never use ROI background depth. Do not use a Kalman filter to conceal repeatable view-dependent geometric bias.
post_startup_positive_j6_no_progress_2026_08_20:
  symptom: Acquisition or scan plan starts after successful STARTUP_WRIST, J1-J5 reach the waypoint, J6 remains near logical zero, and SDK MoveJ reports no measurable progress by approximately the requested positive J6 delta.
  inspect: [mission result current and target joint arrays, driver retained controller-turn offset, queried J6 positive controller limit, piper_ctrl_single_node.py normal J6 mapping]
  known_incident: gui-sim-a09aa6ae47f44c88a458d142a80c2289 mapped logical 2.483482 rad through a retained +2pi turn to raw 502.293 degrees while the controller limit was only 365 degrees.
  rule: Preserve logical [-pi,+pi], positive-only startup and decreasing storage. Qualify raw +540 degrees or greater before enable, reject any mapped target beyond the proved controller bound, and never work around this in Tesseract or NBV.
rough_acquisition_bridge_exit_2026_08_20:
  symptom: Rough acquisition produces reachable candidates and PROPOSAL_READY, then mission approval times out and the result becomes CONTROL_UNTRUSTWORTHY because the home service is unavailable.
  inspect: [scan_stack.log critical-child traceback, tesseract_plan_bridge process return code, /piper/tesseract_plan_status, /scan_viewpoint_executor/approve availability, bridge_node.py debug parameter access]
  known_incident: gui-sim-6e0cbcd372594740a38c824a6301f43e crashed bridge_node.py on undefined param_bool after publishing a valid rough-acquisition plan.
  rule: Do not remove the critical-child shutdown or weaken control-authority classification. Repair the initiating bridge exception and require the full bridge/mobile suites, five-package build and both command-free rootless qualifications before supervised E2E.
previous_generation_ownership_2026_08_20:
  symptom: GUI reports that the previous mission still owns live process groups.
  inspect: [process health in the durable action result, ProcessSupervisor exact live names, whether driver is among survivors, fresh PiperStatusMsg motor_feedback_valid, all six driver_enable_status flags, prior terminal home and disable proof]
  route: [mission_engine.py operator-recovery cleanup policy, target_scan_mission_node.py admission reconciliation, process_supervisor.py exact-handle signalling mechanics]
  rule: Never use pkill or adopt a process by name. Processing-only exact handles may be stopped. An exact prior driver handle may be stopped before a new mission only after fresh all-six-disabled feedback; otherwise retain it and require operator recovery.
voxel_nbv_generation_diagnostics_2026_08_17:
  inspect: [/piper/scan_session_history, /piper/reachable_scan_viewpoints, /piper/tesseract_view_generation, /piper/tesseract_plan_provenance, /piper/tesseract_plan_status, scan_viewpoint_planner_node.py, viewpoint_reachability_filter_node.py, piper_tesseract_foxy/bridge_node.py, target_scan_mission_node.py, scan_capture_node.py]
  expected: Before every MULTIVIEW_SCAN request, tesseract_view_generation must be newer than the mission plan barrier and must match the current scan session plus accepted-view count. Generation zero under requested voxel_nbv is explicitly voxel_nbv_seed; generations one and later must be voxel_nbv and model-ready.
  capture_audit: Read frames/*_metadata.yaml view_selection. available=true must bind plan_id, view_selection_session_id, view_selection_generation, view_selection_policy, nbv_rank and gain fields for a voxel-NBV capture. candidate_diagnostics records shortlisted failures and the selected pose so an information-ranking problem can be distinguished from Tesseract feasibility exhaustion.
  never_do: Do not widen data_timeout_sec, add sleeps, reuse a previous-session receipt, or treat preliminary reachability-filter acceptance as IK/collision proof to hide generation races.
