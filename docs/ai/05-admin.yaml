  rule: Run only frozen schema-v5 requests through private ROS-free workers, retain identical backend-neutral scene state limits and timing, separate blocked and direct-home policy controls from positive success, and exact-revalidate every successful positive path before reporting it. Never convert offline cuRobo evidence into hardware qualification.
