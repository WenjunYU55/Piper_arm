generated_or_external:
  do_not_edit: [piper_ros_foxy/build, piper_ros_foxy/install, piper_ros_foxy/log, L515_camera/realsense_ws/install, AI_perception_tests/groundingdino_test/envs, downloaded checkpoints]
post_live_scan_routing_2026_08_04:
  target_leaves_frame_during_scan_move:
    inspect: [tesseract_plan_bridge closed_loop_min_view_step_deg, closed_loop_max_view_step_deg and closed_loop_max_aim_offset_deg, scan_session_memory.py feature_coverage_priority, scan_motion.py camera_target_path_reasons, scan_viewpoint_executor_node.py prepare_current_view, achieved /piper/scan_session_history, calibrated camera FK]
    rule: Coverage ranking is subordinate to the 6-to-30-degree local target-centred position frontier. The 7.5-degree azimuth grid provides a compact continuity successor when achieved FK falls between samples, while the six-degree floor and separate pose/look duplicate gate reject near-repeats. The first transaction tries the closest non-regressing candidate before its ambitious leader, then later transactions restore coverage-first interleaving. The achieved-pose scorer finishes whichever missing Y side the latest accepted FK is already approaching, crosses once to finish the opposite side, then completes azimuth-span and elevation-span goals. Each candidate carries an objective-specific margin against the latest accepted pose for side traversal and accepted history for span goals. For a side goal, normalized lateral exposure may regress by at most 0.02 for measurement tolerance; for span goals, achieved span may not shrink. This permits radius/elevation configuration changes near the same side while excluding genuine orbit reversal. Before request hashing, the bridge may keep the achieved optical direction or spherically move toward it only while the resulting exact look remains within 12 degrees of the target-centred nominal. The dense SDK interpolation must independently retain positive-optical-Z boresight within 20 degrees and at least 0.22 m target distance before any command. Neither frontier nor aim relaxation widens that safety limit.
  target_status_dips_between_scan_views:
    inspect: [/piper/tracked_target, /piper/target_status, /piper/tracking_health, /piper/heavy_refresh_status, /piper/scan_execution_status, target_scan_mission_node.py request_multiview_plan and approve_plan]
    rule: Before spooling a plan, a snapshot rejected only because tracking is unsettled, prediction-only or stale remains command-free and may retry fresh snapshots for up to 30 seconds. After a proposal exists, LOW_CONFIDENCE, LOST, or SEARCHING may use the same bounded automatic visual-reacquisition window while approval repeats every live gate. Changed target center triggers a fresh-plan rejection. Never classify collision, path visibility, scene, control, hash, camera, controller, or worker failures as visual reacquisition.
  workflow_reports_clear_from_acquisition_frame:
    inspect: [/piper/heavy_refresh_request, /piper/heavy_refresh_status, /piper/obstacle_instances_3d, supervised_cube_workflow_node.py occlusion_probe_request_id]
    rule: SCAN_READY requires a new workflow_occlusion_probe state=published result and exact matching obstacle-scene image stamp. Acquisition request IDs and target_mask_missing results are not workflow-clear authority.
  return_home_recovery_regression:
    evidence: Exact RETURN_HOME reached configured pose within 0.022172 rad and all six feedback enable flags became false on 2026-08-04.
    inspect_if_regressed: [RETURN_HOME bridge snapshot, configured speed policy, approved obstacle snapshot reuse, RETURN_HOME allow_untracked runtime gates, configured joint feedback proof, enable service feedback]
  transient_invalid_scene_shutdown:
    inspect: [target_scan_mission_node.py planning_rejection_allows_current_state_home, normal RETURN_HOME bridge snapshot, executor runtime scene validation]
    rule: Any controllable failure, including collision/perception-scene rejection, first stops and holds, then may request one direct configured RETURN_HOME target. Camera, tracking and obstacle-scene state are deliberately not home prerequisites. Its exact first measured point may use only the 0.3-rad post-disable relaxation band; emergency-stop, nonfinite feedback, feedback beyond that band, an out-of-limit goal, controller/arm faults, unavailable command publication, waypoint failure and no-progress remain blockers because endpoint/disable proof would be untrustworthy.
  first_acquisition_runtime_refresh_waits_for_obstacles:
    inspect: [scan_viewpoint_executor_node.py begin_runtime_recovery and waiting_for_runtime_refresh_tick, scan_execution_modes.py uses_bootstrap_static_scene, /piper/scan_execution_status, driver motion-limit publication]
    rule: ROUGH_ACQUISITION look zero is approved against bootstrap_static and intentionally has no perception obstacle stream. If a transient fresh-telemetry gap commands a current-position hold, preserve that exact missing-obstacle authority through WAITING_FOR_RUNTIME_REFRESH and the resumed state. Do not generalize it to later acquisition looks or moving MULTIVIEW_SCAN segments.
  target_only_scan_obstacle_stream_expires:
    inspect: [sam2_live_bridge_node.py object_ids publication, obstacle_instance_3d_node.py process, /piper/sam2_object_ids, /piper/obstacle_instances_3d, /piper/scan_execution_status]
    rule: A live SAM2 ID frame containing only target ID 1 is a complete empty-obstacle observation and must publish a timestamped clear ObstacleInstance3DArray immediately. It must not wait for base-frame TF because no geometry requires projection. Frames containing any obstacle ID 2+ still require exact-time TF, aligned depth, metadata and fail-closed classification; never use the target-only fast path for missing/malformed ID images or detected obstacles.
  sam2_waiting_for_seed_during_exact_scan_motion:
    inspect: [/piper/tracking_health, /piper/sam2_tracking_status, /piper/obstacle_instances_3d, /piper/scan_execution_status, scan_viewpoint_executor_node.py approved_multiview_motion_obstacle_snapshot]
    rule: The live eye-in-hand tracker may stop instance-ID output after motion-blur target loss. One exact collision-qualified MULTIVIEW_SCAN segment may finish using the fresh valid obstacle snapshot checked immediately before its command. This authority exists only in MOVING with a present qualified snapshot; any new blocked/invalid scene still stops, and a next command cannot start until fresh settled scene authority returns. Do not generalize this to a missing approval scene, another plan, acquisition look, or contact motion.
  camera_clock_fault_at_settled_capture:
    inspect: [/piper/camera_timestamp_health, /tmp/piper_vision_recovery/request.yaml, run_gpu_vision_pipeline.sh, scan_viewpoint_executor_node.py runtime_gate_action, runtime_recovery_timeout_sec]
    rule: CLOCK_OFFSET, NON_MONOTONIC, NO_FRAMES and STARTING are never capture authority. They command a current-feedback hold and may wait up to 30 seconds for the watchdog-authorized full vision restart and 15 consecutive healthy frames. Resume only the unchanged phase after every runtime gate recovers; timeout still aborts to direct home.
maintenance_routing_2026_08_04:
  arbitrary_target_not_found:
    inspect: [RunTargetScan target_label/target_profile, mission_core.py target_prompt, mission_context.yaml, heavy_model_worker.py, temporal_heavy_refresh.py, run_groundingdino_on_capture.py, /piper/heavy_refresh_status]
    note: Blank profile selects strict green_cube only for the exact normalized green cube label; every other label selects generic_open_vocab. Confirm the sanitized prompt and mission SHA agree across the action, worker capture and scan metadata. Do not relax green-cube appearance validation to fix a generic-label routing fault.
  startup_home_rejected_or_waits_for_obstacles:
    inspect: [/scan_viewpoint_executor/execute_home_stage, piper_ctrl_single_node.py startup gate, home_pose.py, scan_viewpoint_executor_node.py]
    note: Startup normalization is a mission-authorized direct configured-home transaction. It must not require acquisition_scan, camera health or target-obstacle freshness. STARTUP_WRIST is J6-only and positive-only, may use the qualified raw wrap bridge, and is followed by direct ROUGH_HOME. Stage identity, endpoint, fresh motor/limit/feedback evidence and attached-holder external clearance remain mandatory.
  one_button_cancel_is_slow_during_startup:
    inspect: [piper_gui_native.py, target_scan_mission_node.py, driver service wait, stable joint wait, vision boot wait, hand-eye boot wait, worker boot wait, durable mission result]
    note: Every bounded startup loop must call the mission guard so action cancellation, deadline expiry, gateway loss and managed-child exit are observed while the dependency is still unavailable. The 2026-08-04 GUI cancellation during missing-camera startup completed in about eight seconds with CANCELLED, safe_shutdown=true and no managed child left behind.
  settled_view_not_saved:
    inspect: [/piper/scan_quality, /piper/occlusion_status, /piper/scan_capture_status, /piper/scan_execution_status, /piper/scan_session_history, scan_capture_node.py, scan_capture.py]
    note: Service capture requires GOOD score at least 0.65, target_valid exactly true and CLEAR occlusion. Rejection saves no frame, appends rejected_entries, holds at measured current pose, and in automatic closed-loop mode requests one coverage-ranked replacement. Missing target_3d or mask may retry only at the same held pose under the ten-attempt readiness bound. A present fresh target_3d valid=false is equivalent to ScanQuality target_valid=false and must become VIEW_REJECTED rather than ABORTED. Malformed/nonfinite diagnostics, I/O, TF, service and safety faults fail closed.
  replacement_plan_has_wrong_count_or_reuses_pose:
    inspect: [/piper/scan_session_history, scan_session_memory.py, scan_viewpoint_executor_node.py, target_scan_mission_node.py, scan_viewpoint_planner_node.py, /piper/tesseract_plan_status]
    note: accepted_views counts only persisted records; accepted/rejected entries both exclude duplicates. Automatic mission requests contain exactly one view and rank by new coverage from achieved FK pose/look; manual batch requests still contain every remaining view. The mission permits at most eight visual replacements. Automatic mode uses eight views only as a model-seed floor and may continue to 24 until achieved side/span floors and three-view measured surface convergence pass. A correlated zero-view result may complete only at eight or more after every feature and convergence floor is already proved and every remaining distinct candidate explicitly lacks finite bounded collision-free IK; all other planning failures remain failures and still enter fresh current-state home cleanup.
  automatic_feature_budget_exhausted:
    inspect: [target_scan_mission_node.py, mission_core.py, scan_session_memory.py, bridge_node.py, /piper/scan_session_history, /piper/scan_capture_status]
    note: At 8-23 captures the coordinator stops only when achieved history in the frozen measured coverage frame proves two views per Y side, 120-degree azimuth, 25-degree elevation and three consecutive measured novel-surface gains at or below 0.02. Otherwise it requests one more view. At 24, missing floors are INSUFFICIENT_CAPTURE_QUALITY. For later feature goals, construct the bounded 36-candidate membership by interleaving coverage leaders with nearest-current compact alternatives, then stable-partition that same membership so candidates with at least 0.03 normalized side advance after tolerance or 2 degrees of span gain are attempted before near-zero-progress nonregressing fallbacks. Never replace the compact members merely to fill a progress quota. Manual batch mode remains separately confirmed exact-13.
  adaptive_frontier_exhausted_before_feature_completion:
    inspect: [/piper/scan_session_history, /piper/tesseract_plan_status, target_scan_mission_node.py, scan_session_memory.py, piper_tesseract_foxy/bridge_node.py, persisted capture camera poses and measured surface-gain sequence]
    note: Task gui-sim-e9629c41e1224425b5adb0454b61ee3f persisted 15 GOOD/CLEAR captures and two views on each Y side, then returned NO_REACHABLE_PLAN because no distinct safe candidate remained inside the 6-30-degree closed-loop frontier while azimuth was only 65.30/120 degrees and measured surface had not converged. Preserve the safety frontier and completion thresholds. Audit why candidate membership/ranking exhausted locally instead of treating speed or shutdown as the cause; the same run physically accepted v3 timing at 20 percent and completed safe staged shutdown.
  nbv_target_center_jumps_to_camera_coordinates:
    inspect: [scan_viewpoint_planner_node.py target_frame_rejection_reason, scan_planning_params.yaml planning_frame_id, /piper/tracked_target, /piper/target_3d, /piper/scan_viewpoints, target_tracker_node.py]
    note: /piper/target_3d is normally camera_color_optical_frame while multiview candidates are base_link. The planner must accept a centre only when header.frame_id exactly equals planning_frame_id=base_link. During a tracker gap it waits for transformed measured tracking and must not use the raw optical point as a coordinate fallback. Reproduce with alternating base_link tracked-target and camera-optical raw-target callbacks and verify every emitted scan header/centre remains base_link.
  terminal_feature_summary_lags_persisted_capture:
    inspect: [surface_coverage.py persisted_achieved_history, scan manifest capture_count, frame metadata camera_transform/target_3d, /piper/scan_session_history, target_scan_mission_node.py current_scan_feature_coverage]
    note: Immutable accepted-frame metadata is the fallback authority when its validated manifest count is newer than transient scan history. Derive achieved camera position and optical-Z from each capture-time base-to-camera transform and transform the first target observation into base_link. Never discard a durable accepted frame merely because the final transient-local callback arrived late.
  multiview_readiness_reports_session_maximum_mismatch:
    inspect: [supervised_viewpoint_execution.launch.py, scan_viewpoint_planner_node.py session_max_views, bridge_node.py max_execution_viewpoints, scan_viewpoint_executor_node.py max_execution_viewpoints, /piper/scan_viewpoints, /piper/scan_session_history]
    note: One LaunchConfiguration(max_execution_viewpoints) must feed planner session_max_views, bridge/executor max_execution_viewpoints, workflow max_views and capture max_frames_per_scan. A default-13 planner paired with a max-24 bridge correctly blocks before scan motion. Do not suppress the readiness blocker or accept a mismatched history.
  static_workspace_rejection:
    inspect: [viewpoint_reachability_filter_node.py, scan_planning_params.yaml, supervised_workflow.py, supervised_cube_workflow_params.yaml, /piper/reachable_scan_viewpoints]
    note: enforce_static_reach_bounds and enforce_static_workspace default false. The filter must not reject finite poses for base radius, height change or a rectangular box. Tesseract IK/joint/collision planning and executor runtime checks still reject physically infeasible targets; never bypass those authorities.
  removal_plan_missing_drop_support:
    inspect: [/piper/scene_cloud, target_cloud_node.py, supervised_cube_workflow_node.py, supervised_workflow.py, supervised_cube_workflow_params.yaml, base_link camera TF]
    note: Pick/place requires a fresh base_link coarse scene cloud with a dense flat four-sided support patch, no overhead footprint occupancy and target/obstacle clearance. A push may be proposed when grasp/placement is unavailable. Both remain command-free while manipulation_model_qualified=false.
  autonomous_contact_unavailable:
    inspect: [/piper/tesseract_readiness, manipulation_blockers, tesseract_bridge_params.yaml, /piper/removal_plan, target_scan_mission_node.py]
    note: This is an intentional safety boundary, not a readiness string to suppress. Complete gripper TCP/open/closed, attached-object, allowed-contact, pick/push/place collision and supervised low-speed hardware qualification before adding a separately owned executor or setting manipulation_model_qualified=true.
  physical_e2e_preflight:
    inspect: [lsusb, /dev/video*, /piper/camera_timestamp_health, base_link to camera_color_optical_frame TF, worker ready markers, can0, /joint_states_single, /arm_status]
    note: The L515 initially failed enumeration, then passed USB 3.2/librealsense preflight after an unplug/replug. Configured-home return is now physically proved, including the 2026-08-06 duplicate-generation recovery and measured-state recovery after the seven-view planning dead end. Before every retry require one coordinator lock holder, one action server, no mission child, CAN ERROR-ACTIVE, six false motor flags, camera timestamp, TF, CUDA readiness and measured lock. Final acceptance still requires three consecutive GUI-submitted safe successes; each must have 8-24 GOOD/CLEAR records plus two views per Y side, 120-degree azimuth, 25-degree elevation, three-view measured convergence, safe_shutdown and exact cleanup.
maintenance_routing_2026_08_06:
  powered_single_motor_dropout:
    inspect: [/arm_status motor_feedback_valid, /arm_status motor_1_driver_enabled through motor_6_driver_enabled, /arm_status motor_faults, /arm_status motor_watchdog_reason, piper_ctrl_single_node.py feedback timer, target_scan_mission_node.py guard_motor_control, mission durable result]
    rule: A powered partial-enable state or any per-motor fault revokes command authority immediately. Never attempt automatic hold, rough home, storage or service disable after that revocation. Let the driver watchdog disable all axes, require fresh typed six-false feedback before process cleanup, report NEEDS_OPERATOR with safe_shutdown=false, and preserve the first motor/watchdog reason. Aggregate err_code zero is not proof of motor health. Inspect the affected joint and hardware before another powered mission.
  duplicate_goal_acceptance_or_process_generation:
    inspect: [run_target_scan_mission.sh, /tmp/piper_target_scan_mission.lock, /piper/run_target_scan action-server count, target_scan_mission.launch.py, target_scan_mission_node.py, mission child process groups]
    rule: The supported launcher must hold the nonblocking OS lock for its full exec lifetime and exit 73 before ROS startup when already held. Never proceed when the action endpoint reports more than one server.
  coordinator_terminal_interrupt:
    inspect: [target_scan_mission_node.py request_process_shutdown, mission guard, target_scan_mission.launch.py sigterm_timeout, durable result, configured-home feedback, motor flags, owned process groups]
    rule: SIGINT means bounded mission cancellation, not immediate node destruction. Keep the executor spinning through home, hold, feedback disable and child cleanup; launch permits 180 seconds before SIGTERM. A second/emergency stop remains the physical emergency procedure, not process killing.
  controller_reports_teaching_mode:
    inspect: [/arm_status ctrl_mode, PiPER motion-output/slave role 0xFC with zero offsets, /enable_srv, /joint_ctrl_single, passive CAN 0x150/0x151/0x155-0x157]
    rule: Do not infer motor-disable state from a newly connected SDK object's zero-initialized low-speed cache. Allow fresh low-speed feedback before reading flags. Configure the documented 0xFC role only while all motors are proved disabled.
  startup_home_runtime_limit_abort:
    inspect: [scan_execution_params.yaml joint_feedback_limit_tolerance_rad and configured_home_feedback_limit_tolerance_rad, scan_motion.py feedback validators, Tesseract contract/worker configured-home start policy, scan_viewpoint_executor_node.py runtime_reasons, target_scan_mission_node.py prove_return_home_for_shutdown, /piper/scan_execution_status]
    rule: Ordinary feedback-only boundary tolerance is hard-capped at 0.005 rad after powered J3 was observed at +0.002460 rad. A separate operator-qualified 0.3-rad allowance applies only to the exact first measured point of a dedicated hash-bound direct RETURN_HOME stage, covering disabled storage relaxation such as J6 -3.173270 rad. It cannot enter acquisition, multiview, manipulation, a goal point or a normal feedback check; all Tesseract targets and driver commands remain inside exact limits. Capture execution_started before approval, handle every ABORTED result immediately, poll the action guard during startup-home waits, and treat driver/scan_stack/tesseract_worker exits by their real managed names.
  startup_home_transient_settle_or_missing_scene:
    inspect: [target_scan_mission_node.py retryable_plan_approval_rejection, shutdown_uses_startup_home, MissionSession.startup_home_completed, /tesseract_plan_bridge/request_startup_home_plan, /tesseract_plan_bridge/request_return_home_plan]
    rule: A named unsettled-joint approval sample is transient for the unchanged exact plan/hash and may retry only within the existing five-second approval window. Every controllable failure uses a perception-independent direct home target; startup_home_static is retained only as provenance and is not separate collision/scene authority.
  proposal_stationary_pose:
    inspect: [scan_viewpoint_executor_node.py joints_settled, command_target, settle_position_anchor, /scan_viewpoint_executor/approve]
    rule: PROPOSAL_READY intentionally has no active command_target. Its joint-settle gate must anchor fresh measured current joints and prove the 0.005-rad stationary window there. After the first endpoint is published, settling must instead remain bound to that endpoint within the 0.025-rad goal tolerance; never require a nonexistent endpoint to approve a plan and never let current-pose anchoring excuse stopping short during execution.
  runtime_refresh_holds_but_never_settles:
    inspect: [scan_viewpoint_executor_node.py begin_runtime_recovery, waiting_for_runtime_refresh_tick, joints_settled, runtime_refresh_resume_state, command_target]
    rule: An in-flight freshness gap publishes a current-feedback hold but retains the interrupted command_target for exact resumption. Reset settle evidence and prove stationarity against the current hold during recovery; do not demand convergence to the interrupted endpoint while holding. Reissue that retained endpoint only after all fresh runtime gates, including obstacle geometry, recover within the bounded timeout.
  scan_keeps_revisiting_one_y_side:
    inspect: [/piper/scan_session_history coverage_target_center, scan_viewpoint_executor_node.py scan_coverage_target_center, scan_session_memory.py history_coverage_target_center, scan_viewpoint_planner_node.py target_cb, piper_tesseract_foxy/bridge_node.py bounded_current_look_direction, target_scan_mission_node.py current_scan_feature_coverage, scan_planning_params.yaml camera_pitch_offsets_deg]
    rule: >-
      Freeze the first valid measured MULTIVIEW_SCAN target center once per
      session and publish it with every history update. Use fresh measured
      tracking to place each new candidate, but score all achieved/candidate
      face exposure and final feature floors in the frozen measured frame.
      Never replace the coverage frame during closed-loop replans. A new
      workflow session or finalized session resets it. Seven -15:-10:-75-degree
      elevations and six 0.30:0.03:0.45 m distances are deterministic samples
      of a flexible camera region. After bounded shortlist selection, each
      exact request look may preserve the achieved safe optical direction by
      no more than 12 degrees from its target-centred nominal. This changes
      neither camera-position coverage nor collision authority: the exact
      relaxed pose remains hash-bound, Tesseract-qualified and executor
      visibility-checked, and the worker shortlist remains bounded at 36.
  multiview_scan_data_stale_while_target_is_stable:
    inspect: [scan_viewpoint_planner_node.py viewpoint_refresh_required, scan_planning_params.yaml target_plan_refresh_period_sec, /piper/scan_viewpoints, /piper/reachable_scan_viewpoints, viewpoint_reachability_filter_node.py, piper_tesseract_foxy/bridge_node.py data_timeout_sec, /piper/tesseract_readiness]
    rule: A stable measured cube must not suppress liveness publication. Rebuild and republish deterministic candidates from a fresh valid TrackedTarget at 0.5-second intervals, below the bridge's 1.0-second freshness limit. Do not make stale data authoritative by widening the bridge timeout independently.
  capture_rejection_causes_home_instead_of_replacement:
    inspect: [scan_capture.py capture_diagnostic_rejection, scan_viewpoint_executor_node.py retryable_rgbd_capture_rejection, visual_capture_rejection, VIEW_REJECTED, target_scan_mission_node.py retryable_plan_approval_rejection, /piper/scan_execution_status, /piper/scan_capture_status]
    rule: Missing/stale quality or occlusion is a bounded liveness retry while holding, not evidence that the pose is visually bad. Only fresh quality/occlusion failures exclude a pose and publish nonterminal VIEW_REJECTED. Retry the unchanged exact approval only for named transient tracking/camera gates; every collision, hash, plan, control, or other rejection remains terminal.
  target_moved_after_planning:
    inspect: [target_scan_mission_node.py target_drift_requires_replan, scan_viewpoint_executor_node.py target_drift_before_approval_rejection, max_target_drift_before_approval_m, /piper/tracked_target, /piper/scan_execution_plan]
    rule: Preserve the 0.015 m approval drift gate. Its explicit no-motion refresh rejection requests one new plan from the fresh measured target, bounded to eight consecutive refreshes. Do not approve stale target geometry or widen the threshold merely to finish a mission.
  terminal_home_replays_scan_path:
    inspect: [scan_viewpoint_executor_node.py cancel_cb, target_scan_mission_node.py prove_return_home_for_shutdown, /scan_viewpoint_executor/execute_home_stage, configured home pose, /piper/scan_execution_status]
    rule: Automatic cancel/failure first stops at a measured current-position hold, then requests PRE_HOME, ROUGH_HOME and STORAGE_WRIST directly from each newly measured state. It must not call approved-path retrace or Tesseract. Exact stage/endpoint/identity, joint/feedback/control/external-clearance/hold/disable gates remain mandatory.
  staged_home_profile_or_mesh_job_issue:
    inspect: [piper_home_pose.json, home_pose.py, piper_gui_native.py, target_scan_mission_node.py, target_scan_gateway_node.py, reconstruction_jobs.py, reconstruction/tsdf_reconstruct.py, mission spool mesh_jobs and base_home queues]
    rule: Record the operator-qualified Rough / Ready Home, terminal-only PRE_HOME and Storage Wrist values. Schema-v4 requires positive-only startup toward ready zero, decreasing terminal storage and a configured pre-home pose. A positive non-ready measured branch blocks before enable. Do not bypass staged_home_configured, hard-limit validation, profile hash or exact stage endpoint validation. ROS JointState.position is a generic six-value sequence. For a missing mesh, verify the mission result is SUCCEEDED with safe_shutdown=true, mesh_job_id and immutable manifest hash; reconstruction never starts merely because arm shutdown completed.
  heavy_occlusion_geometry_issue:
    inspect: [heavy_refresh_bridge_node.py synchronized RGB-D callback and request manifest, obstacle_instance_3d_node.py heavy_job_paths and target_occlusion_evidence, supervised_cube_workflow_node.py two-observation loop, manipulation readiness]
    rule: Never pair a heavy result with latest live depth. Require archived depth_encoding/camera_matrix, exact masks, capture-time TF, stable track association and two observations. Only pen/marker/stick are first-stage movable labels. Unknown/human/unprojectable geometry blocks, and manipulation_model_qualified=false remains expected until physical contact-model qualification.
  archived_mask_shape_failure_after_valid_heavy_result:
    inspect: [heavy_refresh_bridge_node.py response publication and consume move, obstacle_instance_3d_node.py heavy_response_mask, heavy spool responses and consumed directories, archived RGB-D dimensions]
    rule: The bridge may move responses/job to consumed/job immediately after publishing status. Validate the relative mask path and retry both roots at read time; never retain one pre-move path or label this rename race as a mask/depth shape mismatch.
  dedicated_home_stops_on_transient_motion_limits:
    inspect: [scan_viewpoint_executor_node.py execution_tick, runtime_gate_action, WAITING_FOR_RUNTIME_REFRESH, /piper/motion_limits]
    rule: A missing or stale motion-limit sample during direct home commands current-position hold and enters bounded refresh before resuming the unchanged endpoint. Emergency stop, invalid limits, controller faults and command failures remain terminal.
  multiple_targets_run_in_arrival_order_or_overlap:
    inspect: [target_scan_gateway_node.py admitted_tasks, target_scan_mission_node.py poll_mission_queue, mission spool goals/status/results/heartbeat, max_pending_missions, mission_queue_coalesce_sec]
    rule: The gateway must snapshot every target at admission and accept at most eight outstanding actions. The local owner waits one second for near-simultaneous arrivals, selects nearest base-frame distance with arrival ties, and permits one active process generation only. Never reorder an already executing mission, reuse its transient capture/coverage state, or start a successor before its safe terminal result. A queued cancel ends only that queued task without touching the active arm mission.
