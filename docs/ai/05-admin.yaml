document: maintenance_routing
curobo_fixed_rate_transport_maintenance_2026_09_02:
  inspect: [motion_planning/curobo/adapter.py normalize_trajectory, tests/curobo/test_curobo_adapter.py fixed-rate and vertex-retention cases, tests/curobo/test_curobo_gpu_integration.py schedule assertion, piper_tesseract_foxy/worker.py sdk_movej_waypoint_trajectory as parity reference]
  rule: Allocate whole 20 Hz ticks independently per cuRobo native segment; retain every source endpoint and interpolate only on that segment. Use the existing speed percentage exactly once against J1-J5 5 rad/s and J6 3 rad/s, retain the 0.05 rad ceiling and 60000-point fail-closed bound, and never repair smoothness in the driver or by weakening common validation.
  required_retests: [test_curobo_adapter.py, complete ordinary mobile Tesseract cuRobo and GUI suites, pinned real-GPU cuRobo suite, generic response validation, package builds, YAML parse, separately authorized physical E2E]
curobo_runtime_parity_maintenance_2026_09_02:
  inspect: [motion_planning/curobo/adapter.py target_ray_standoff_samples and planning_budgets_for_request, motion_planning/curobo/worker.py fixed goal-set target-ray direct-home and failure paths, motion_planning/curobo/generate_robot_config.py link6 FK retention, viewpoint_reachability_filter_node.py batch admission snapshot, piper_tesseract_foxy/bridge_node.py generic planner exhaustion cache, corresponding cuRobo reachability and bridge tests]
  rule: Preserve one fixed 54-pose cuRobo goal-set tensor for every camera-pose request in a persistent worker; semantic target-ray candidates come only from validated capability intervals and exact aim precedes bounded fallback aim. Apply freshness once when a reachability batch is admitted, but keep every downstream planner executor and runtime freshness gate. Generic PLANNER_EXHAUSTED carries attempted ray IDs; TESSERACT_EXHAUSTED remains a compatibility input only. Legacy planner RETURN_HOME may bypass robot self-collision only through the manifest-authorized exact two-point direct-home contract with dense link6 holder/L515 support-plane proof.
  required_retests: [test_curobo_adapter.py, test_curobo_model_generation.py, complete ordinary mobile Tesseract cuRobo and GUI suites, pinned real-GPU suite including persistent acquisition-to-target-ray sequence, command-free two-backend runtime qualification, AI YAML parse, Python compile, git diff check, separately authorized physical E2E]
curobo_target_visibility_maintenance_2026_09_01:
  inspect: [motion_planning/curobo/worker.py camera_path_visibility_rejection and _target_visibility_rejection, piper_tesseract_foxy/worker.py camera_transform_path_rejection, execution/motion.py camera_target_path_reasons, test_curobo_adapter.py, test_curobo_gpu_integration.py]
  rule: A cuRobo MULTIVIEW_SCAN success is only a feasible candidate after dense camera FK proves target distance and visibility. Reject locally and continue through the bounded configured roll, fallback-look and candidate order. Keep the common executor check independent; do not weaken its 0.22 m minimum, first-alignment transition, ordinary cone, endpoint aim or achieved-FK capture gate. Do not apply target visibility to rough acquisition or direct home, and do not introduce backend fallback.
  required_retests: [complete ROS-free cuRobo suite, pinned real-GPU multiview test, first-alignment command-free GPU replay, test_scan_motion.py, test_phase1_executor_characterization.py, complete mobile suite, complete Tesseract suite, Python compile, AI YAML parse, separately authorized physical E2E]
rough_acquisition_observation_floor_maintenance_2026_09_01:
  inspect: [perception/acquisition.py, scan_target_acquisition_node.py, scan_planning_params.yaml, test_scan_target_acquisition.py, rough acquisition flow and contract]
  rule: Keep the 0.35 m rough camera-to-hint minimum, but do not add an acquisition-specific maximum or pull a farther live camera inward. A close camera may move only radially away from the hint; compact alternatives remain at the same protected radius. Every endpoint still requires normal capability, finite perception admission, selected-planner collision, authorization and executor gates. Do not weaken measured-lock or continuous-readiness rules to hide near-range depth loss, and do not apply this rough-hint floor to qualified size-aware rays.
  required_retests: [test_scan_target_acquisition.py, test_mission_core.py, test_mission_engine.py, test_phase1_mission_characterization.py, complete mobile suite, package build, AI YAML parse, command-free planner request, separately authorized physical E2E]
