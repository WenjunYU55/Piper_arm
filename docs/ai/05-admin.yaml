generated_or_external:
  do_not_edit: [piper_ros_foxy/build, piper_ros_foxy/install, piper_ros_foxy/log, L515_camera/realsense_ws/install, AI_perception_tests/groundingdino_test/envs, downloaded checkpoints]
post_live_scan_routing_2026_08_04:
  target_leaves_frame_during_scan_move:
    inspect: [tesseract_plan_bridge closed_loop_min_view_step_deg, closed_loop_max_view_step_deg and closed_loop_max_aim_offset_deg, scan_session_memory.py feature_coverage_priority, scan_motion.py camera_target_path_reasons, scan_viewpoint_executor_node.py prepare_current_view, achieved /piper/scan_session_history, calibrated camera FK]
    rule: Authoritative voxel_nbv scores all candidates in the configured target-centric region against cumulative accepted voxel coverage. Six degrees is only accepted-view redundancy, not a maximum movement. The bridge shortlists twelve in information order with direction diversity; Tesseract exhausts exact target aim before one optional fallback. Accepted_views zero remains at most five degrees. Later fallback, dense positive-optical-Z path cone and settled achieved aim use the frozen 1-90-degree next-mission value, while 0.22 m target distance remains unchanged. Use latest achieved FK, including a rejected view, as the next physical start while accepted history alone owns coverage.
  target_status_dips_between_scan_views:
    inspect: [/piper/tracked_target, /piper/target_status, /piper/tracking_health, /piper/heavy_refresh_status, /piper/scan_execution_status, target_scan_mission_node.py request_multiview_plan and approve_plan]
