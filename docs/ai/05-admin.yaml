executor_capture_integration_maintenance_2026_08_27:
  inspect: [scan_viewpoint_executor_node.py callback groups and serialized_control_callback, configuration.py CaptureConfig, scan_execution_params.yaml, scan_capture.py capture_diagnostic_rejection, scan_capture_node.py capture_prerequisites_ready, scan_capture_params.yaml, supervised_cube_workflow_node.py]
  scheduler_rule: Keep timer services state subscriptions telemetry and service-client responses in their documented separate callback groups. Every timer or state-mutating control callback must enter the shared control_state_lock; telemetry crosses through TelemetryStore. Never put the 200 Hz timer back in the service group or let cancel approval and motion tick mutate state concurrently.
  capture_rule: Every service record requires fresh GOOD target-valid evidence. CLEAR accepts immediately; fresh classified PARTIALLY_OCCLUDED or HEAVILY_OCCLUDED persists pending and must pass the exact request-and-image-stamp semantic scene before counting. UNKNOWN LOST missing stale malformed unsafe or unqualified evidence fails closed.
  timeout_rule: first_capture_acceptance_timeout_sec is the semantic-probe acceptance bound for any pending capture and must exceed workflow occlusion_probe_timeout_sec by a bounded status-propagation reserve. Ordinary CLEAR acceptance retains capture_timeout_sec.
  required_retests: [test_configuration.py, test_scan_capture.py, test_supervised_workflow.py, test_phase1_executor_characterization.py, complete mobile suite, proposal-only control-load service smoke, package build, AI YAML parse, separately authorized E2E]
