  inspect: [AI_perception_tests/heavy_model_worker.py, AI_perception_tests/temporal_heavy_refresh.py, AI_perception_tests/groundingdino_test/run_groundingdino_on_capture.py, AI_perception_tests/test_groundingdino_target_selection.py, AI_perception_tests/test_heavy_model_worker.py]
  rule: Propagate the exact private request reason through each heavy-worker job. Only rough_acquisition_viewpoint may disable green-cube box-aspect validation; do not disable semantic confidence green appearance mask or aligned-depth qualification and do not relax ordinary refresh or capture policy.
  required_retests: [exact saved clipped-target replay, test_groundingdino_target_selection.py, test_heavy_model_worker.py, Python compile, separately authorized physical E2E]
capture_one_occlusion_barrier_maintenance_2026_08_27:
  inspect: [supervised_cube_workflow_node.py, scan_viewpoint_executor_node.py, mission/engine.py, test_supervised_workflow.py, test_phase1_executor_characterization.py]
  ownership: supervised_cube_workflow_node.py owns the correlated semantic decision and pending first-view acceptance. scan_viewpoint_executor_node.py owns the pending capture model seed and may publish accepted history only after workflow accepted_views advances.
  ordering_rule: Never restore the heavy occlusion probe before the first target-facing endpoint, and never publish any pending occluded capture into accepted history before its correlated probe returns qualified evidence.
  occlusion_rule: Qualified meaningful occlusion reports semantic labels and continues through collision-aware planning. Do not create automatic contact motion, trust occluded pixels as target surface, or treat missing malformed uncorrelated unsafe or unqualified evidence as clear.
  first_alignment_rule: Only capture one's MULTIVIEW_SCAN path may begin outside 20 degrees. It cannot worsen beyond its acquired start angle, cannot leave the 20-degree cone after entering, and must end within 5 degrees. Later paths remain strict 20-degree paths.
  required_retests: [test_supervised_workflow.py, test_phase1_executor_characterization.py, test_mission_engine.py, test_mission_core.py, complete mobile suite, package build, AI YAML parse, separately authorized physical E2E]
