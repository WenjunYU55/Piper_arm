    inspect: [target_envelope.py visible_silhouette_points_m, ray_mission_diagnostics.py target_envelope evidence, piper_gui/ray_review_model.py revolved_envelope_mesh, piper_gui/ray_review_viewer.py MissionScene and Inspector, test_target_envelope.py, tests/gui/test_piper_gui_ray_review.py]
    rule: The revolved mesh is an estimated presentation surface, the source outline is recorded evidence, and only collision_boxes is planning geometry. Keep every layer command-free and independently selectable.
  ray_review_camera_navigation:
    inspect: [piper_gui/ray_review_viewer.py CameraNavigator CameraViewDialog MissionScene MissionTab and CapabilityTab, tests/gui/test_piper_gui_ray_review.py, docs/ai/40-flows.yaml ray_review_camera_navigation_flow_2026_08_27, docs/ai/50-guardrails.yaml ray_review_camera_navigation_guardrails_2026_08_27]
    rule: Treat base_link positive Z as viewer world-up, retain the Mission Process ground bound, preserve focal point and zoom across standard views, and keep every camera control command-free and presentation-only.
