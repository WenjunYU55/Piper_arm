  ownership: target_scan_mission_node.py is the sole automatic-mission client of /supervised_cube_workflow/start. scan_target_acquisition_node.py must not subscribe to workflow/execution terminal state or start mission progression.
  diagnostic_rule: SCAN_READY with measured_lock_ready=false is a bounded transient wait, not success and not an immediate incompatible-state failure. The existing workflow deadline remains authoritative.
  required_retests: [test_scan_target_acquisition.py, test_mission_core.py, test_mission_engine.py, test_phase1_mission_characterization.py, complete mobile suite, package build, separately authorized physical E2E]
