startup_home_ownership_2026_08_04:
  mission_owner: target_scan_mission_node.py selects nonterminal hold versus terminal cancel and requests STARTUP_WRIST then ROUGH_HOME at startup, and PRE_HOME then ROUGH_HOME then STORAGE_WRIST at terminal shutdown.
