modules:
  arm_driver:
    owner_module: piper_ros_foxy/src/piper/piper/piper_ctrl_single_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper, piper_ros_foxy/src/piper_msgs, start_piper.sh, enable_piper.sh, disable_piper.sh]
    owns: CAN connection, an all-six-FOC-feedback-proved enable/disable service, serialized bounded enable transitions, failed-partial-enable rollback to six disabled flags, a 200 Hz fail-closed per-motor FOC/partial-enable watchdog, executor-owned 200 Hz telemetry timer, typed read-only /piper/motion_limits publication from fresh SDK controller feedback with canonical hash, joint/end-pose command translation, hard joint-bound enforcement, cached MoveJ MotionCtrl_2 mode/speed, explicit six-position arm-only command handling with no GripperCtrl side effect, unchanged-gripper suppression for explicit seven-position commands, and a current launch surface with auto_enable false by default and no RViz compatibility scaling.
    must_not_move_without: [piper_gui_native.py, piper_joint_bounds.json, piper_ros_foxy/src/piper/launch]
  robot_description:
    owner_module: piper_ros_foxy/src/piper_description
    allowed_edit_paths: [piper_ros_foxy/src/piper_description]
    owns: base_link, mode-0 joint origins, link geometry, meshes, the permanent 180-degree fixed link6-to-gripper_base installation offset, the fixed visual-only gripper_base-to-camera_holder branch with its user-locked -4 mm visual Z trim relative to the nominal close 12 mm arm datum, and the operator-confirmed fixed camera_holder-to-l515_visual branch at [0.1,0,0] with rpy [-pi,pi,pi/2], centred mesh offset and +2.5 mm axial seating trim. meshes/camera_holder.STL and meshes/Intel_RealSense_L515_CAD_external.STL are the owned millimetre runtime visuals; their original source CAD files are not retained in the current CAD directory. The module also owns the production-only robot_state_publisher model, feedback-only live TF/RViz launch, planning joint limits including the enabled compact-pose J2 controller-coordinate lower bound -0.044796192 rad, and preview_-prefixed draggable STL joint editor. It contains no fake joint-state publisher, command-coupled RViz launch, Gazebo plugin/transmission stubs, or simulation controller configs. Both detailed mount meshes own visualization only for collision/inertia; qualified L515/mount/cable envelopes remain collision authority. The confirmed L515 housing/front-glass datum is a mechanical input to the hand-eye-owned operational camera TF.
    must_not_move_without: [L515_camera/publish_hand_eye_tf.py, hand-eye calibration, piper_gui_native.py]
  hand_eye:
    owner_module: L515_camera/publish_hand_eye_tf.py
    allowed_edit_paths: [L515_camera/publish_hand_eye_tf.py, L515_camera/run_hand_eye_tf.sh, L515_camera/capture_hand_eye_sample.py, L515_camera/solve_hand_eye.py, L515_camera/validate_fixed_board.py, L515_camera/test_validate_fixed_board.py, L515_camera/run_fixed_board_validation.sh, L515_camera/calibration/hand_eye]
    owns: Fail-closed startup loading of the RealSense static camera_link-to-calibration-frame transform, reliable depth-1 PiPER feedback consumption, FK plus the session_20260808_straight_mount deployed link6-to-camera transform, dynamic base_link-to-camera_link TF, sample capture, and strict fixed-board revalidation. The physical board authority is a 5x5 ChArUco board with 0.017 m squares and 0.012 m markers; capture and validation must share those exact defaults and persist them in every record. Both require a complete 0.75-second six-joint position window within 0.001 rad before any image may count; intermittent low SDK velocity cannot authorize a disabled arm that is sagging. The deployed transform is mechanically registered from the operator-confirmed CAD housing, Intel Rev 003's 4.5 mm depth datum, and device f1120648's factory colour-to-depth extrinsic. The raw PARK solution and every August 8 board-derived metric used 0.018 m/0.013 m and remain wrong-scale provenance only. The corrected-scale five-pose board validation passed on 2026-08-10 and recovers the stationary board target in base_link at all five distinct stable poses, so deployment physical_revalidation is passed. Semantic cube tracking repeatability remains an acquisition acceptance test.
    must_not_move_without: [piper_description URDF, /joint_states_single, RealSense optical TF]
