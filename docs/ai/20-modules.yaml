schema_version: 1
document: module_ownership
modules:
  arm_driver:
    owner_module: piper_ros_foxy/src/piper/piper/piper_ctrl_single_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper, piper_ros_foxy/src/piper_msgs, start_piper.sh, enable_piper.sh, disable_piper.sh]
    owns: CAN connection, enable service, executor-owned 200 Hz telemetry timer, typed read-only /piper/motion_limits publication from fresh SDK controller feedback with canonical hash, joint/end-pose command translation, hard joint-bound enforcement, cached MoveJ MotionCtrl_2 mode/speed, explicit six-position arm-only command handling with no GripperCtrl side effect, unchanged-gripper suppression for explicit seven-position commands, and a current launch surface with auto_enable false by default and no RViz compatibility scaling.
    must_not_move_without: [piper_gui_native.py, piper_joint_bounds.json, piper_ros_foxy/src/piper/launch]
  robot_description:
    owner_module: piper_ros_foxy/src/piper_description
    allowed_edit_paths: [piper_ros_foxy/src/piper_description]
    owns: base_link, mode-0 joint origins, link geometry, meshes, production-only robot_state_publisher model, feedback-only live TF/RViz launch, planning joint limits including the enabled compact-pose J2 controller-coordinate lower bound -0.044796192 rad, and preview_-prefixed draggable STL joint editor. It contains no fake joint-state publisher, command-coupled RViz launch, Gazebo plugin/transmission stubs, or simulation controller configs.
    must_not_move_without: [L515_camera/publish_hand_eye_tf.py, hand-eye calibration, piper_gui_native.py]
  hand_eye:
    owner_module: L515_camera/publish_hand_eye_tf.py
    allowed_edit_paths: [L515_camera/publish_hand_eye_tf.py, L515_camera/run_hand_eye_tf.sh, L515_camera/solve_hand_eye.py, L515_camera/calibration/hand_eye]
    owns: Fail-closed startup loading of the RealSense static camera_link-to-calibration-frame transform, reliable depth-1 PiPER feedback consumption, FK plus accepted link6-to-camera calibration, and dynamic base_link-to-camera_link TF.
    must_not_move_without: [piper_description URDF, /joint_states_single, RealSense optical TF]
  semantic_perception:
    owner_module: AI_perception_tests/heavy_model_worker.py
    allowed_edit_paths: [AI_perception_tests/heavy_model_worker.py, AI_perception_tests/groundingdino_test, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/heavy_refresh_bridge_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/heavy_refresh_contract.py]
    owns: GroundingDINO target/obstacle selection, full semantic reseeding, and request-correlated post-settle image selection.
    must_not_move_without: [heavy spool contract, sam2 seed manifest]
  live_segmentation:
    owner_module: AI_perception_tests/sam2_live_worker.py
    allowed_edit_paths: [AI_perception_tests/sam2_live_worker.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/sam2_live_bridge_node.py, L515_camera/run_sam2_live_bridge.sh]
    owns: temporal SAM2 session, mandatory labelled-object seed consumption, per-object masks,
      obstacle-only sessions with target ID 1 reserved and obstacle IDs 2+, and live result
      manifests; objectless mask.png seed fallback is intentionally unsupported.
    must_not_move_without: [sam2 spool contract, TrackingHealth, heavy refresh lifecycle]
  camera_timestamp_safety:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/camera_timestamp_watchdog_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/camera_timestamp_watchdog_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/camera_timestamp_health.py, piper_ros_foxy/src/piper_mobile_manipulation/config/camera_timestamp_watchdog_params.yaml, piper_ros_foxy/src/piper_mobile_manipulation/msg/CameraTimestampHealth.msg, L515_camera/run_camera_timestamp_watchdog.sh, L515_camera/run_gpu_vision_pipeline.sh]
    owns: Camera clock offset/monotonicity validation, startup healthy-frame gate, latest-sample joint feedback, explicit stationarity diagnostics, position-stability-based stationary-only recovery request, and full-perception-stack restart backoff.
    must_not_move_without: [live_segmentation, supervised_scan_execution, /joint_states_single, RealSense camera owner]
  target_geometry_tracking:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/target_tracker_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/depth_to_3d_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/target_tracker_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/utils, piper_ros_foxy/src/piper_mobile_manipulation/config/camera_params.yaml, piper_ros_foxy/src/piper_mobile_manipulation/config/tracking_params.yaml]
    owns: mask/depth 3D measurement, isolated-jump rejection plus consistent post-motion depth re-anchoring, timestamped TF transform, Kalman estimate, prediction, gating, stability.
    must_not_move_without: [custom Target3D and TrackedTarget messages, hand-eye TF, scan planner]
  motion_recovery:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/sam2_live_bridge_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/sam2_live_bridge_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/motion_compensated_prompt_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/utils/mask_reprojection.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/target_landmark_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/occlusion_checker_node.py]
    owns: TRACKING/DEGRADED/WAITING_TO_REACQUIRE/ABSENT lifecycle, configurable measured-result freshness aligned with live inference cadence, in-flight refresh serialization, two-attempt recovery burst plus slow periodic ABSENT retries, sustained-low-confidence heavy refresh with hysteresis, arm-motion health, prompt reprojection recovery, and non-starving fixed-landmark TF lookup.
    must_not_move_without: [TrackingHealth.msg, heavy_refresh_bridge_node.py, tracking_params.yaml]
  scan_and_obstacles:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_viewpoint_planner_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_*, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/target_acquisition.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/occlusion_checker_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/obstacle_*, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/viewpoint_reachability_filter_node.py, piper_ros_foxy/src/piper_mobile_manipulation/config/scan_*.yaml, piper_ros_foxy/src/piper_mobile_manipulation/config/obstacle_instance_3d_params.yaml]
    owns: pitched circular tracked-target viewpoints, rough-coordinate live-radius/minimum-translation center plus bounded five-look acquisition candidates, atomic typed PrepareAcquisition session binding with idempotent exact retry and source_request_id propagation, first-look static bootstrap versus correlated later-look semantic gating, lifetime-stable reachability subscriptions, conservative workspace filtering, quality, occlusion, capture, and 3D obstacle instances with bounded read-only TF-listener recovery plus exact empty-result scene publication.
    safe_refactor_zone: Pure geometry helpers and JSON construction can be extracted while topic names and dry-run flags remain stable.
  supervised_workflow:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/supervised_cube_workflow_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/supervised_cube_workflow_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/supervised_workflow.py, piper_ros_foxy/src/piper_mobile_manipulation/config/supervised_cube_workflow_params.yaml, piper_ros_foxy/src/piper_mobile_manipulation/launch/supervised_cube_workflow.launch.py]
    owns: Operator-gated dry-run obstacle plan and multi-view target model state machine, authoritative measured TrackedTarget/TrackingHealth/LOCKED handoff for SCAN_READY with target_landmark retained only as diagnostics, idle measured-lock availability status for explicit GUI adoption, target-cloud best-effort QoS compatibility, capture cloud/status ordering, accepted-versus-modeled counters, and read-only diagnostic state.
    boundary: Must not publish real arm commands unless a separately reviewed hardware executor is explicitly introduced.
  supervised_scan_execution:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_viewpoint_executor_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_viewpoint_executor_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_execution_modes.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_motion.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_trajectory.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_capture.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_capture_node.py, piper_ros_foxy/src/piper_mobile_manipulation/config/scan_execution_params.yaml, piper_ros_foxy/src/piper_mobile_manipulation/config/scan_capture_params.yaml, piper_ros_foxy/src/piper_mobile_manipulation/launch/supervised_viewpoint_execution.launch.py, piper_ros_foxy/src/piper_mobile_manipulation/msg/ScanExecutionPlan.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/ScanExecutionStatus.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractPlan.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractPlanStatus.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractReadiness.msg, piper_ros_foxy/src/piper_mobile_manipulation/srv/PrepareAcquisition.srv, piper_ros_foxy/src/piper_mobile_manipulation/srv/ApproveScanExecution.srv, piper_ros_foxy/src/piper_mobile_manipulation/srv/RequestTesseractPlan.srv, piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_motion.py, piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_capture.py, piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_target_acquisition.py, L515_camera/run_supervised_viewpoint_execution.sh]
    owns: The sole optional /joint_ctrl_single publisher, mandatory Tesseract proposal/status normalization, source_request_id propagation, critical-child launch supervision, exact trajectory-hash/controller-limit-hash approval, and independent Foxy path defense. It validates the worker's schema-v5 sdk_movej_targets_v1 start/target path with zero derivative placeholders, publishes one six-position arm-only SDK MoveJ target per viewpoint, and advances only after measured feedback reaches the target. Only folded-start ROUGH_ACQUISITION segment zero may contain one separately declared bootstrap target. Dense 0.025 rad runtime collision samples are validation-only. Per-target and no-progress deadlines abort to hold. It also owns GUI-selected finite 1-100 percent aggregate SDK speed, cancellation hold, endpoint position/velocity settle and capture gating, and session-correlated acquisition states.
    boundary: Must remain proposal-only by default, must not enable motors, and must not merge command publication into the dry-run workflow or planner.
    must_not_move_without: [arm_driver, robot_description, hand_eye, target_geometry_tracking, motion_recovery, scan_and_obstacles, supervised_workflow, operator_tools, piper_joint_bounds.json]
  tesseract_planning:
    owner_module: piper_ros_foxy/src/piper_tesseract_foxy/piper_tesseract_foxy/worker.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_tesseract_foxy, motion_planning/tesseract, piper_ros_foxy/src/piper_description/meshes/planning_30mm, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractPlan.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractPlanStatus.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractReadiness.msg, piper_ros_foxy/src/piper_mobile_manipulation/srv/PrepareAcquisition.srv, piper_ros_foxy/src/piper_mobile_manipulation/srv/RequestTesseractPlan.srv]
    owns: Schema-v5 canonical atomic request/response spool with immutable acquisition source_request_id, atomic worker heartbeat generation/freshness, command-free Foxy bridge and readiness publisher, lifetime-stable bridge subscriptions, fresh typed controller-limit binding, selected aggregate SDK speed and target-order contract, mode-0 model generation, hash-verified 30 mm link1/link2/link5 collision decomposition, augmented L515/mount/local-cable envelopes, ordinary collision policy, acquisition-only bounded monotonic folded-start recovery, explicit free six-joint look-at planning, OMPL plus ISP goal establishment, one direct SDK MoveJ target per viewpoint with zero derivative placeholders, adaptive exact-segment Bullet validation, direct-path obstacle rejection plus core/zero/compact-start qualification regressions, response hashes, and proposal-only status.
    boundary: The bridge and worker must have no arm command publisher, enable client, CAN device, GPU, DDS link from the worker, or network access. Hardware execution must remain blocked unless the exact model manifest is hardware-qualified and every executor freshness/hash/health gate passes.
    must_not_move_without: [supervised_scan_execution, robot_description, hand_eye, scan_and_obstacles, camera_timestamp_safety, piper_joint_bounds.json]
  operator_tools:
    owner_module: OPERATOR_COMMANDS.md
    allowed_edit_paths: [OPERATOR_COMMANDS.md, L515_camera/*.sh, '*.sh', '*.xml', source_piper_foxy_environment.sh, fastdds_gui_udp_only.xml, piper_gui_native.py, piper_gui_automation.py, test_piper_gui_automation.py, test_gui_transport_profile.py]
    owns: Canonical Foxy/PiPER environment loading and preflight, loopback-only UDP Fast DDS isolation for the GUI and supervised scan process tree, readiness/service-gated startup, worker and scan parent supervision, atomic acquisition-session binding and idempotent timeout retry, operator startup, explicit enable/disable procedures, GPU process-group shutdown, GUI controls, emergency-boundary documentation, separate exact acquisition and 13-view approval state, direct-health-gated Step 4 bootstrap of a stopped GUI-owned worker/scan stack, explicit adoption of a fresh authoritative current lock into a new workflow/scan phase after terminal acquisition, explicit current-lock scan-plan requests, and GUI-owned Tesseract/scan process lifecycle.
    owns_runtime: Supported startup order, rejection of stale generated root overlays, exact package/import/interface/schema preflight, reset procedures, viewers, manual joint UI, Graphical preview mirroring, Acquire & Scan publisher exclusivity including bounded Foxy endpoint-identity resolution, critical-child failure cleanup, and human safety instructions.
    must_not_move_without: [arm_driver, robot_description, supervised_scan_execution, piper_joint_bounds.json]
