schema_version: 1
document: module_ownership
documentation_problem_history:
  owner_module: docs/ai/80-problem-log.yaml
  allowed_edit_paths: [docs/ai/00-index.yaml, docs/ai/05-admin.yaml, docs/ai/20-modules.yaml, docs/ai/30-contracts.yaml, docs/ai/40-flows.yaml, docs/ai/50-guardrails.yaml, docs/ai/60-debt.yaml, docs/ai/70-roadmap.yaml, docs/ai/80-problem-log.yaml, docs/ai/project-structure.txt, SYSTEM_HANDOFF.md, OPERATOR_COMMANDS.md]
