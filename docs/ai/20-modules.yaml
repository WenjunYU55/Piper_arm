  must_not_move_without: [MULTIVIEW_SCAN one-view transaction, scan history generation barrier, frozen ray population and IDs, target-shape QoS, final capture aim gate, Tesseract target-ray contract, terminal shutdown]
  invariant: Rough ACQUIRED never classifies border contact or seeds the revolution. Generation zero uses one same-session un-enveloped provisional ray pool around the tracked centre and is independent of live shape timestamp ordering. The executor uses a source-stamped post-settle silhouette only for achieved-aim and border admission. Scan capture rebuilds the authoritative shape from the exact persisted mask/depth and binds the recorded transform; the executor promotes that seed only after capture-one acceptance and discards it on rejection. Scan history is the planner's only model-seed input. A farther retry preserves the ray ID and direction, increases only its minimum standoff, recomputes the endpoint look vector toward the frozen target, and passes ordinary Tesseract and executor gates.
