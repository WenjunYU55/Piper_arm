    allowed_edit_paths: [piper_ros_foxy/src/piper_tesseract_foxy, motion_planning/tesseract, piper_ros_foxy/src/piper_description/meshes/planning_30mm, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractPlan.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractPlanStatus.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractReadiness.msg, piper_ros_foxy/src/piper_mobile_manipulation/srv/PrepareAcquisition.srv, piper_ros_foxy/src/piper_mobile_manipulation/srv/RequestTesseractPlan.srv]
    owns: Schema-v5 atomic request/response spool with ROUGH_ACQUISITION, MULTIVIEW_SCAN and zero-capture RETURN_HOME kinds; hash-bound include_return_home policy that omits the unused home from automatic one-view plans but retains it for manual batch; optional one-view transaction mode with a bounded achieved-objective-nonregression position shortlist whose membership interleaves coverage leaders with nearest-current compact radius/elevation IK fallbacks and whose later-feature attempt order stable-partitions that same membership to place materially side/span-progressing alternatives first; deterministic pre-hash spherical aim relaxation that preserves the achieved camera optical direction only inside a 12-degree target-centred cone; worker heartbeat/readiness; fresh controller-limit/speed binding; mode-0 geometry; free six-joint look-at planning; retry of alternate roll/IK branches when dense calibrated scan-camera FK would lose the measured target; exact-zero derivatives; adaptive exact-segment Bullet validation for non-home motion; dense CAD-derived attached-holder support-plane validation for normal and direct-home paths; a manifest-authorized two-point direct configured-home generator with explicit robot-self-collision-exemption evidence and stage binding; qualification regressions including the exact 2026-08-11 J5 contact pose; response hashes; and proposal-only status.
    boundary: The bridge and worker must have no arm command publisher, enable client, CAN device, GPU, DDS link from the worker, or network access. Hardware execution must remain blocked unless the exact model manifest is hardware-qualified and every executor freshness/hash/health gate passes.
    must_not_move_without: [supervised_scan_execution, robot_description, hand_eye, scan_and_obstacles, camera_timestamp_safety, piper_joint_bounds.json]
  operator_tools:
    owner_module: OPERATOR_COMMANDS.md
    allowed_edit_paths: [OPERATOR_COMMANDS.md, L515_camera/*.sh, '*.sh', '*.xml', source_piper_foxy_environment.sh, fastdds_gui_udp_only.xml, piper_gui_native.py, piper_gui_automation.py, test_piper_gui_automation.py, test_gui_transport_profile.py]
    owns: Canonical Foxy/PiPER environment loading and preflight, loopback-only UDP Fast DDS isolation for the GUI and supervised scan process tree, readiness/service-gated startup, worker and scan parent supervision, atomic acquisition-session binding and idempotent timeout retry, operator startup, explicit enable/disable procedures, GPU process-group shutdown, GUI controls, emergency-boundary documentation, separate exact acquisition and 13-view approval state, direct-health-gated Step 4 bootstrap of a stopped GUI-owned worker/scan stack, explicit adoption of a fresh authoritative current lock into a new workflow/scan phase after terminal acquisition, explicit current-lock scan-plan requests, and GUI-owned Tesseract/scan process lifecycle.
    owns_runtime: Supported startup order, rejection of stale generated root overlays, exact package/import/interface/schema preflight, reset procedures, viewers, manual joint UI, Graphical preview mirroring, Acquire & Scan publisher exclusivity including bounded Foxy endpoint-identity resolution, critical-child failure cleanup, and human safety instructions.
    must_not_move_without: [arm_driver, robot_description, supervised_scan_execution, piper_joint_bounds.json]
  autonomous_target_scan:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/target_scan_mission_node.py
    allowed_edit_paths: [run_target_scan_mission.sh, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/target_scan_mission_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/target_scan_gateway_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/mission_core.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/mission_spool.py, piper_ros_foxy/src/piper_mobile_manipulation/action/RunTargetScan.action, piper_ros_foxy/src/piper_mobile_manipulation/launch/target_scan_mission.launch.py, piper_ros_foxy/src/piper_mobile_manipulation/launch/target_scan_gateway.launch.py, piper_gui_native.py]
    owns: One lifetime coordinator lock and action server, an eight-entry closest-first pending queue with a one-second coalescing window, exactly one active immutable physical task/process generation, immediate gateway odom-to-local snapshotting, stable arrival-order ties, queued cancellation without resource startup, target context hashing, safe process-generation admission, mission authorization, feedback-confirmed enable/position-window hold/home/disable, SIGINT-to-cancel completion, at-most-five one-look acquisition transactions, one-capture measured-coverage scan transactions, a command-free 30-second between-view visual-reacquisition approval hold with full exact-plan revalidation and target-drift replanning, direct stage-bound RETURN_HOME request/approval/proof for every controllable completion/cancel/failure independent of perception-scene health, automatic 8-view model-seed/24-view maximum achieved-feature and three-view surface-convergence completion with strict post-capture exhaustion allowed only after the same floors, per-mission cache isolation, durable results, and tracked-robot completion/failure reporting.
    boundary: It may authorize only already qualified scan execution. PLAN_READY contact remains NEEDS_OPERATOR while manipulation readiness is false; it must not synthesize a gripper/contact trajectory or set manipulation_model_qualified.
    must_not_move_without: [arm_driver, semantic_perception, scan_and_obstacles, supervised_workflow, supervised_scan_execution, tesseract_planning, operator_tools]
  reconstruction_export:
    owner_module: reconstruction/tsdf_reconstruct.py
    allowed_edit_paths: [reconstruction/tsdf_reconstruct.py, reconstruction/test_tsdf_reconstruct.py, reconstruction/requirements.txt]
    owns: Offline masked RGB-D TSDF integration for immutable successful automatic scan datasets, including the adaptive bounded 8-to-24 capture-count contract, exact manifest-to-frame-metadata count agreement, timestamped camera-transform validation, and mesh quality report.
    must_not_move_without: [autonomous_target_scan, supervised_scan_execution, scan_and_obstacles]
startup_home_ownership_2026_08_04:
