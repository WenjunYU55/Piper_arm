passive_results_campaign_ownership_2026_09_02:
  owner_module: results_campaign
  responsibilities:
  - immutable per-position alternating matched-run schedule, with historical blocked and alternating resume
    compatibility
  - task correlation
  - atomic campaign-wide result bookmarks
  - read-only artifact collection
  - source and configuration hash manifest
  - metric derivation
  - CSV/XLSX serialization
  - poster figure generation
  - optional offline reconstruction replay
  - durable operator skip receipts and separate skipped-trial progress
  - schema-2 frozen parameter/object condition schedules
  - cube-reference metric eligibility and per-condition sweep charts
  allowed_edit_paths:
  - results_campaign/**
  - piper_gui/results_campaign.py
  - tools/record_results_campaign.py
  - tools/build_results_campaign_report.py
  - tests/results_campaign/**
  - docs/experiments/results_campaign.md
  - OPERATOR_COMMANDS.md
  - docs/ai/**
  must_not_move_without:
  - piper_gui/native_app.py optional observer hook
  - scan_capture schema-2 filesystem contract
  - mission result spool contract
  - ray diagnostic artifact contract
  - reconstruction quality JSON contract
  forbidden_ownership:
  - mission progression
  - planner selection enforcement
  - NBV
  - reachability
  - motion planning
  - authorization
  - safety
  - execution
  - capture admission
  - robot command
  - raw dataset persistence
  gui_boundary: piper_gui/results_campaign.py owns only generated-file and subprocess presentation; piper_gui/native_app.py
    invokes it after production submission and result events and catches every observer failure.
  order_update_2026_09_08: New campaign IDs use adjacent planner pairs with alternating first planner.
    Existing campaign.json trial order and attempts are never migrated.
  skip_update_2026_09_08: Skip Trial persists a schema-1 trials/<trial>/skip.json receipt and prepares
    the next pending trial without applying settings or starting a mission. Resume excludes explicitly
    skipped trials; completed and skipped counts remain separate.
  campaign_modes_2026_09_08:
    owner_module: results_campaign/modes.py
    gui: Results Campaign mode selector; new IDs per mode, existing IDs resume their frozen design
    camera_profiles: cuRobo only; eight admitted RGB profiles, four resolutions each at 15 then 30 FPS;
      XYZ (0.70,0,0.30) m for new campaigns; aim 5 degrees; depth profile unchanged; legacy campaigns retain frozen distance
    aim_tolerance: cuRobo only; at each X 0.30/0.50/0.70/0.90/1.10 m, sweep 1/5/10/15/20/25 degrees; Y
      0, Z 0.30 m; freeze saved RGB profile at creation
    objects: cuRobo only; cube, cup, stick, flower at XYZ (0.70,0,0) m for new campaigns; legacy campaigns retain frozen distance; aim 5 degrees; freeze saved RGB
      profile at creation
    coordinate_basis: base_link Z convention; no table offset inferred from calibration
    preparation: Populate target label, RGB/FPS and aim controls; normal explicit Apply controls are still
      required. No runtime write or mission start from Prepare.
    evidence: PHYSICAL_PARAMETER_SWEEP, one attempt per condition; requested RGB FPS is not measured FPS.
      Non-cube reference coverage and dimensional errors remain unavailable.
