nt may retain that snapshot while eye-in-hand SAM2 pauses under motion blur; any newly received blocked/invalid scene remains active and every next segment requires fresh authority. A runtime hold preserves the interrupted scene authority and freezes the scheduled clock. Automatic closed_loop_one_view requires exactly one capture trajectory and no embedded home, then holds after each absent acquisition look or accepted capture while the coordinator replans or requests dedicated direct home. Missing/stale capture evidence receives bounded same-pose retries while held; fresh visual failures record the excluded pose and enter nonterminal VIEW_REJECTED for a replacement. Accepted history stores achieved FK camera position/look direction, proposal, and measured joints. Cancellation or any controllable failure enters the MissionEngine terminal path and requests direct PRE_HOME, ROUGH_HOME and STORAGE_WRIST stages from fresh live control evidence. Direct home retains exact configured stage/target, fresh finite feedback, all-six motor authority, stage direction/change rules, holder/L515 external clearance, progress and endpoint/settle proof; it deliberately ignores camera/tracking/workflow/obstacle-topic freshness and the Tesseract motion-limit hash. After STORAGE_WRIST settles, the controller retains that target until immediate feedback-confirmed disable; autonomous shutdown does not call the redundant hold service.
