    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/sam2_live_bridge_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/sam2_live_bridge_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/motion_compensated_prompt_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/utils/mask_reprojection.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/target_landmark_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/occlusion_checker_node.py]
    owns: TRACKING/DEGRADED/WAITING_TO_REACQUIRE/ABSENT lifecycle, configurable measured-result freshness aligned with live inference cadence, in-flight refresh serialization, two-attempt recovery burst plus slow periodic ABSENT retries, sustained-low-confidence heavy refresh with hysteresis, arm-motion health, prompt reprojection recovery, and non-starving fixed-landmark TF lookup.
    must_not_move_without: [TrackingHealth.msg, heavy_refresh_bridge_node.py, tracking_params.yaml]
  scan_and_obstacles:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_viewpoint_planner_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_*, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/target_acquisition.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/occlusion_checker_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/obstacle_*, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/viewpoint_reachability_filter_node.py, piper_ros_foxy/src/piper_mobile_manipulation/config/scan_*.yaml, piper_ros_foxy/src/piper_mobile_manipulation/config/obstacle_instance_3d_params.yaml, piper_ros_foxy/src/piper_mobile_manipulation/launch/gpu_geometry.launch.py, piper_ros_foxy/src/piper_mobile_manipulation/test/test_gpu_geometry_launch.py]
    owns: pitched circular tracked-target viewpoints over the target-facing 90-270-degree hemisphere with 25 azimuth samples at 7.5-degree spacing, seven -15-through--75-degree elevation samples and six 0.30-through-0.45 m distance samples, rough-coordinate centered-first live-radius candidates with a 15-degree cardinal cone plus diagonal/compact reserves, automatic one-view candidate filtering to a 6-to-30-degree meaningful target-centred frontier from achieved camera FK with compact-first initial motion and coverage-first later replans, one immutable first-measured session coverage_target_center for cross-view geometry while fresh tracking still places each candidate, staged achieved-pose scoring that finishes the currently approached Y side then crosses once to the opposite side before azimuth/elevation deficits and residual diversity, fresh candidate liveness refresh every 0.5 seconds from valid tracked-target observations while material geometry replans remain displacement/history gated, atomic typed PrepareAcquisition session binding with idempotent exact retry and source_request_id propagation, first-look static bootstrap versus correlated later-look semantic gating, lifetime-stable health/geometry filtering with static reach boxes disabled, quality, occlusion, quality-gated capture, accepted/rejected achieved-FK session memory and Y-side/azimuth/elevation feature coverage, and 3D obstacle instances with isolated-miss-preserving, continuous-outage-only read-only TF-listener recovery plus exact empty-result scene publication. Every gpu_geometry child is launch-critical so callback failure terminates its parent rather than leaving a partial stale geometry graph. Target-only live ID frames publish clear obstacle arrays before TF because they contain no geometry to project; frames with IDs 2+ keep the full aligned-depth/exact-time-TF path.
    safe_refactor_zone: Pure geometry helpers and JSON construction can be extracted while topic names and dry-run flags remain stable.
  supervised_workflow:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/supervised_cube_workflow_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/supervised_cube_workflow_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/supervised_workflow.py, piper_ros_foxy/src/piper_mobile_manipulation/config/supervised_cube_workflow_params.yaml, piper_ros_foxy/src/piper_mobile_manipulation/launch/supervised_cube_workflow.launch.py]
    owns: Operator-gated command-free leaf/branch pick-place or outward-push proposal, observed base_link scene-cloud support validation for placement, a dedicated post-lock semantic occlusion request with exact request-ID/image-stamp 3D-scene correlation before SCAN_READY, multi-view target model state machine, authoritative measured TrackedTarget/TrackingHealth/LOCKED handoff with target_landmark retained only as diagnostics, idle measured-lock availability status for explicit GUI adoption, target/scene-cloud best-effort QoS compatibility, accepted-versus-modeled counters, and read-only diagnostic state. Fixed rectangular workspace enforcement defaults off.
    boundary: Must not publish real arm commands unless a separately reviewed hardware executor is explicitly introduced.
  supervised_scan_execution:
    owner_module: piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_viewpoint_executor_node.py
    allowed_edit_paths: [piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_viewpoint_executor_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_execution_modes.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_motion.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_trajectory.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_capture.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_capture_node.py, piper_ros_foxy/src/piper_mobile_manipulation/config/scan_execution_params.yaml, piper_ros_foxy/src/piper_mobile_manipulation/config/scan_capture_params.yaml, piper_ros_foxy/src/piper_mobile_manipulation/launch/supervised_viewpoint_execution.launch.py, piper_ros_foxy/src/piper_mobile_manipulation/msg/ScanExecutionPlan.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/ScanExecutionStatus.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractPlan.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractPlanStatus.msg, piper_ros_foxy/src/piper_mobile_manipulation/msg/TesseractReadiness.msg, piper_ros_foxy/src/piper_mobile_manipulation/srv/PrepareAcquisition.srv, piper_ros_foxy/src/piper_mobile_manipulation/srv/ApproveScanExecution.srv, piper_ros_foxy/src/piper_mobile_manipulation/srv/RequestTesseractPlan.srv, piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_motion.py, piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_capture.py, piper_ros_foxy/src/piper_mobile_manipulation/test/test_scan_target_acquisition.py, L515_camera/run_supervised_viewpoint_execution.sh]
    owns: The sole optional /joint_ctrl_single publisher, mandatory Tesseract normalization, source_request_id propagation, critical-child supervision, exact hash approval, Foxy path defense, stale-feedback command/hold refusal, and one launch-bound automatic session maximum shared by planner, workflow, bridge, executor and capture. For ordinary acquisition/scan it publishes every exact source vertex and on-segment sample from the hash-bound collision-qualified Tesseract path at 20 Hz without stopping at intermediate samples; J1-J5 use 5 rad/s and J6 3 rad/s multiplied once by selected speed, with a 0.05 rad step ceiling. Measured feedback supplies a 0.30 rad following guard and final endpoint/settle proof. It records planned/actual duration, sample count, achieved rate, maximum command interval, dropped samples and following error. It never bursts overdue samples or shortcuts path corners. Every scan capture segment is densely FK-checked to retain the measured target inside the optical cone and outside the minimum camera distance before any command. The exact CAD-derived installed camera-holder/L515 link6 envelope is independently checked against the support plane and external obstacle AABBs for every motion mode. A hash-matching command-free plan may wait without approval authority for one queued fresh controller-limit sample, bounded by the unchanged freshness timeout; invalid, mismatched or missing refresh still rejects. Exact obstacle transform/stale-source invalidities enter the same bounded missing/stale telemetry hold instead of becoming a physical-geometry abort; semantic/unqualified and mixed invalid scenes still abort immediate scan motion. After a fresh valid pre-motion scene check, only the resulting exact collision-qualified MULTIVIEW_SCAN MOVING segment may retain that snapshot while eye-in-hand SAM2 pauses under motion blur; any newly received blocked/invalid scene remains active and every next segment requires fresh authority. A runtime hold preserves the interrupted scene authority and freezes the scheduled clock. Automatic closed_loop_one_view requires exactly one capture trajectory and no embedded home, then holds after each absent acquisition look or accepted capture while the coordinator replans or requests dedicated direct home. Missing/stale capture evidence receives bounded same-pose retries while held; fresh visual failures record the excluded pose and enter nonterminal VIEW_REJECTED for a replacement. Accepted history stores achieved FK camera position/look direction, proposal, and measured joints. Cancellation or any controllable failure stops at a measured hold for a new direct current-to-configured-home RETURN_HOME target. That home remains the exact two-point, stage-bound aggregate-speed exception; its evidence exempts only robot self-collision, while camera-holder external clearance, feedback, limits, controller health, endpoint settle, hold and disable remain mandatory.
    runtime_recovery: Typed camera-clock faults hold current feedback and permit at most 30 seconds for watchdog-owned full-vision recovery; no unhealthy capture or new target is allowed. Ordinary inclusive-boundary feedback has a 0.005-rad readback-only allowance. A separate 0.3-rad allowance is valid only for the first measured point of an exact direct RETURN_HOME stage after disabled mechanical relaxation; the isolated contract/worker and executor bind that scope and all goals remain strictly in-limit.
    boundary: Must remain proposal-only by default, must not enable motors, and must not merge command publication into the dry-run workflow or planner.
    must_not_move_without: [arm_driver, robot_description, hand_eye, target_geometry_tracking, motion_recovery, scan_and_obstacles, supervised_workflow, operator_tools, piper_joint_bounds.json]
  tesseract_planning:
