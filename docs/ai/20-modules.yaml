    owner_module: AI_perception_tests/heavy_model_worker.py
    allowed_edit_paths: [AI_perception_tests/heavy_model_worker.py, AI_perception_tests/temporal_heavy_refresh.py, AI_perception_tests/groundingdino_test, L515_camera/run_heavy_model_worker.sh, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/heavy_refresh_bridge_node.py, piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/heavy_refresh_contract.py]
