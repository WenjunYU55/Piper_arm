schema_version: 1
date: '2026-09-07'
title: Movement-window RGB-D sequence to temporal masks and BundleSDF through the GUI
owner_module: reconstruction_recording
reference: docs/architecture/dense_offline_video.md
evidence: docs/experiments/dense_offline_video_validation.md
previous_behavior: GUI recovery reused mission-recorder callbacks, MOVING admission, live mask timestamps and 8 Hz sampling; 141 frames reached BundleSDF from the retained archive.
reason: The creators' RGB-D video workflow needs a temporally segmented sequence, not only frames paired with the slower live mask publisher.
allowed_edit_paths: [tools/bundlesdf/, tests/reconstruction/, piper_gui/bundlesdf_results.py, piper_gui/native_app.py, tests/gui/test_bundlesdf_results.py, docs/]
must_not_move_without: [AI_perception_tests/sam2_live_worker.py, reconstruction_recording/core.py, mission archive and capture owners]
architecture:
  - extract_video.py reads SQLite through Foxy deserialization and a local TF buffer; it creates no ROS node, publishers or subscribers.
  - An accepted-history stamp authorizes the exact raw initial pin and frozen target; earlier images cannot establish a competing target.
  - Recover synchronized RGB-D after that seed within movement plus one-second pre/post-roll windows, retaining accepted pins. Legacy archives without execution events retain the full sequence. Exact timestamp pairs are required for legacy recovery; depth is never reused. See 92-aligned-depth-framesets.yaml. Camera calibration must stay fixed.
  - Retain image-time TF and explicit missing-TF markers; unavailable TF prevents reconstruction admission but does not prevent temporal image propagation.
  - python_sam2.sh invokes the existing isolated perception environment; segment_video.py uses its SAM2 temporal predictor and existing memory compactor, without starting the live worker.
  - Infer every extracted frame, even when its depth or TF is unsuitable for reconstruction. The accepted seed remains conditioning authority and is not replaced by predicted masks.
  - Preserve angle, edge, depth, blur and perspective-normalized mask expansion gates using recorded configuration. Extraction applies movement windows; segmentation adds no further MOVING predicate or 8 Hz cap.
  - Native output remains raw RGB/depth with generated exact-frame masks and model provenance; dataset.py performs calibrated pinhole conversion.
  - reconstruct_job.py owns extraction, segmentation, validation and isolated upstream tracking/global refinement; GUI polls small atomic progress records and can cancel its owned process group.
  - output_validation.py exposes explicit upstream FAIL frame IDs separately from saved pose count and structural mesh success. Accuracy remains unqualified.
upstream:
  bundlesdf_commit: ffa67d425240b5b76d2e387a7dd3d3735a7cf1a1
  existing_sam2_repository_commit: b7a9c29f196edff0eb54dbe14588d7ae5e3dde28
  model: SAM2.1 tiny; config/checkpoint paths reuse existing sam2_live_worker defaults. Persist checkpoint and predictor/compactor hashes in each prepared manifest.
parameters:
  ros_parameters_added: none
  frame_stride: 1, applied after temporal segmentation, selectable in GUI or wrapper
  allow_incomplete: CLI false; GUI Allow partial scan defaults true; incomplete missions remain labelled incomplete
  limit_frames: Optional diagnostic segmentation prefix, never marks a truncated scan complete
  temporal_memory_limit: 16 retained images, preserving the conditioning frame
  segmentation_device: CUDA in existing Grounded-SAM2 environment
  quality_and_geometry: Inherit saved RecorderConfig, including central visibility angle, synchronization slop, pixel margin, blur, depth and mask-expansion settings. Saved sample_rate_hz describes live policy; acquisition_policy explicitly declares no offline rate gate.
lifecycle:
  - New unique job/output directories only; input archive and original captures are never written.
  - Extraction inprogress/ready/failed state is explicit. Only ready extraction enters segmentation.
  - Native preparation uses an inprogress directory and atomic final rename; exceptions or interruption retain a manifest and completed frames in an incomplete directory.
  - Multiple jobs use independent model state; bounded SAM2 memory retains at most 16 images in normal single-seed use.
  - Missing terminal workflow evidence stays UNKNOWN/incomplete, never inferred successful from a closed archive.
  - The legacy import_bag.py callback recovery remains available for diagnostic comparison; it is no longer the GUI archive reconstruction path.
manual_smoke_checks: [deserialize a serialized bag without later masks or MOVING events, GPU temporal mask propagation on saved real frames, native dataset validation and pinned reader, actual GUI Reconstruct action through all stages, inspect mesh and tracking failure report, cancel and inspect partial output]
must_retest_if_changed: [dense timestamp matching and quality unit tests, serialized bag extraction, interruption and multi-job tests, GUI tests, isolated SAM2 inference, complete recording/converter suite, pinned BundleSDF reader and actual GPU reconstruction]
invariants: [no robot or mission commands, unchanged captures and NBV, no stale-mask fallback, no latest TF fallback, raw data immutable during extraction; explicit offline compaction is separate, no weights or data in Git, no pose-count accuracy claim]

executed_evidence:
  automated: 271 reconstruction/GUI tests and 7 existing SAM2 worker tests passed; package build passed; pre-existing package lint failures remain documented.
  real_archive: 2041 synchronized frames accepted after actual GPU SAM2; 41 unmatched RGB timestamps; zero offline quality rejections or backpressure drops; mission capture count 3.
  bundlesdf: Actual GUI-to-GPU run including global refinement completed and exported 12107 vertices and 16125 faces; 15 explicit tracking failures and 24 recovery messages.
  quality: Visual inspection FAIL, with warped sheets, holes and black regions. Dense preparation is implemented; accurate geometry on this recording remains unresolved.
  limitations: Official milk download quota blocked; no new physical motion, camera calibration or ground-truth accuracy qualification.

input_validity_correction: The earlier 2041-frame evidence passed old checks but included 408 ambiguous aligned-depth pairs. It is historical failed-input evidence, not qualified aligned RGB-D.

reconstruction_base_frame_orientation_2026_09_08:
  reference: docs/ai/93-reconstruction-coordinate-frames.yaml
  owner_module: reconstruction/coordinate_frames.py
  behavior: All capture reconstruction variants retain base_link geometry with explicit frame/hash sidecars; BundleSDF adds a separate same-image-anchored base_link export. Both viewers open Z-up from the robot side with labelled axes and robot-direction arrows. Unknown orientation remains explicit.
  boundary: Offline export/display only; original geometry, tracking, capture poses, quality gates and evidence ZIPs are preserved.

movement_window_recording_2026_09_09:
  owner_module: piper_mobile_manipulation/movement_bag_recorder.py
  helpers: piper_mobile_manipulation/movement_recording.py
  allowed_edit_paths: [movement_bag_recorder.py, movement_recording.py, mission_archive.py, tools/bundlesdf/extract_video.py, tests/reconstruction, docs/ai]
  live: A separate command-free recorder buffers at most one second and 128 MiB of idle RGB/depth/mask messages. MOVING flushes pre-roll once; the first following non-MOVING status starts one second of post-roll. Repeated or overlapping moves do not duplicate messages. All calibration, transforms, mission events and accepted keyframe pins remain recorded.
  storage: Native Foxy-compatible SQLite/CDR bag with version-4 metadata; isolated single-thread subscribers write bounded 0.2-second transactions. Parent retains disk reserve, SIGINT closure, row-count verification and incomplete marking. No extra rosbag2_py dependency.
  offline: Extraction is read-only; explicitly requested destructive offline compaction uses tools/bundlesdf/compact_recordings.py. BundleSDF extraction selects the same one-second pre/post movement intervals using recorded message times and retains accepted pins. Legacy bags without execution status use explicitly labelled full-sequence fallback.
  bundle_input: One monotonically ordered frame sequence beginning at the existing accepted mask seed; original RGB/depth timestamps, exact frameset matching, camera calibration, TF and distortion correction remain unchanged. Idle gaps are omitted without fabricating new source timestamps.
  scope: Saved RGB-D only; capture counts, NBV, motion, safety and planner budgets are unchanged. Pre-roll overflow is reported; transport drops remain unknown, not zero.
  required_retests: [window overlap and buffer limits, archive lifecycle, serialized ROS recording and playback, dense extraction and conversion, reconstruction and GUI suites, package build]

offline_movement_compaction_2026_09_09:
  owner_module: tools/bundlesdf/compact_recordings.py
  allowed_edit_paths: [tools/bundlesdf/compact_recordings.py, tools/bundlesdf/extract_video.py, tests/reconstruction/test_compact_recordings.py, docs/ai, docs/architecture]
  authority: Explicit user-requested deletion of idle footage; CLI is plan-only unless --apply is supplied.
  selection: Recorded MOVING intervals with one-second shoulders; global exact RGB/depth header-stamp intersection across splits. A partner arriving outside the shoulder is retained. Unpaired selected images are counted and omitted, never approximately paired. Accepted keyframe tuples and every non-image topic remain byte-identical.
  mutation: Only closed or incomplete archives with metadata and MOVING evidence; refuse live/open databases and nonempty pending journals. Copy smallest retained segment first, verify every retained row with SHA256 and SQLite quick_check, fsync then atomically replace original. Idle payloads are actually deleted without a second full archive copy.
  recovery: Durable movement_compaction.json retains selected row IDs, original metadata and progress. Resume the same --apply invocation after interruption. Dense extraction refuses an unfinished compaction. Completion rebuilds bag metadata and manifest counts, preserving original closure and mission outcome.
  must_retest_if_changed: [serialized split-bag compaction, cross-boundary exact pairing, evidence preservation, interruption resume, metadata counts, dense extraction, native bag readability]
  limitations: Archives without movement evidence remain untouched. Missing recorded partners cannot be recovered. Compaction preserves original timestamps and geometry; no fabricated continuous capture clock.

executed_offline_compaction_2026_09_09:
  report: docs/experiments/movement_recording_compaction_20260909.md
  result: 27 archives compacted; 207.69 GiB permanently reclaimed; all retained payloads verified before replacement and all resulting timestamp sets/counts verified afterward.
  untouched: Five archives without execution events and one unfinished archive without metadata.
  validation: Nine focused tests passed; native bag metadata readable; real dense extraction produced 330 ordered exact RGB-D pairs. No physical execution or new GPU geometry qualification.
