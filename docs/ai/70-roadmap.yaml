    - Exact-scene lifetime is bounded to one already-approved moving segment and requalified offline. Authorization is per physical run after read-only preflight; documentation must not infer continuing permission from a prior mission.
    - GUI task gui-sim-c0bec4ab3ddd4550b666bb0d6889f3c2 physically proved relaxed disabled storage startup, STARTUP_WRIST, ROUGH_HOME, a look-two measured cube lock near [0.410,-0.026,0.004], exact CLEAR evidence, direct terminal rough/storage home, six disabled flags and exact child cleanup. Before capture, its automatic worker unnecessarily planned an unused embedded contingency home and rejected that storage corridor against the conservative cable envelope. Automatic one-view requests now omit that segment without weakening capture collision, visibility or joint checks; another physical retry is required.
    - GUI task gui-sim-cbb777414fc446298157bcc5a54b35e5 then persisted eleven GOOD/CLEAR observations and physically crossed from positive to negative camera Y before obstacle_instance_3d_node crashed on a missing cv2 import. The mission again proved terminal rough/storage home, six disabled flags and exact child cleanup. The import, archived-mask regression and critical gpu_geometry child-exit supervision are repaired; a rebuilt adaptive retry remains required.
    - GUI task gui-sim-f8ebc6a06e554d80be66f29756337945 persisted five GOOD/CLEAR views before the archived mask reader raced the responses-to-consumed rename. Rough home completed, but old code aborted STORAGE_WRIST on a transient motion-limit freshness gap near J6 -1.139 rad, so safe_shutdown was false. Explicit recovery disabled the arm and stopped every hardware/mission child without further motion. Both fixes pass 143 focused, 518 broad and 11 isolated AI tests plus rebuild; coordinator, driver, camera, perception, planner and executor remain off.
  not_yet_accepted:
    - Three consecutive contact-free repetitions of current direct STARTUP_WRIST, ROUGH_HOME and STORAGE_WRIST behavior at an explicitly authorized speed; one current 50-percent full mission has passed.
    - Current 7.5-degree flexible-region/current-look NBV strategy reaching both Y sides and measured convergence in a full physical mission.
    - Current exact heavy occlusion evidence in a complete physical mission.
    - Any autonomous push or pick/place execution; manipulation_model_qualified remains false.
    - A physical tracked-base-home-triggered mesh job and inspected reconstructed PLY.
    - Mounted tracked-robot odometry transform, chassis collision model and stationary/brake authority.
    - Three consecutive current-version end-to-end successes.

milestones:
  - id: M0
    name: Durable architecture and mission contract
    status: complete
    outcome: Goal, ownership, interfaces, flows, guardrails, debt and roadmap are durable and mutually linked under docs/ai.
    evidence: All docs/ai YAML parses and project-structure routing names this roadmap.
  - id: M1
    name: Safe staged startup and terminal recovery
    status: physical_acceptance_partial
    depends_on: [M0]
    remaining: Three consecutive current-version contact-free startup/home/disable repetitions and a deliberate cancel during motion are still required; prior J5/J6 incidents remain retained safety evidence.
    evidence: The no-command motor smoke produced 583 consecutive all-six-enabled fault-free samples. During the earlier J6 fault the typed guard revoked authority at the first fault, sent no later command, proved six disabled flags and stopped every child. Schema-v4 binds shutdown-only pre-home, negative storage, increasing startup and decreasing storage. A later incomplete startup proved a stale direction-high-water defect could defeat Commissioning Enable after disable; software now resets that transaction after proved disable or direction trip. Focused tests and the affected build pass; supervised physical requalification remains required.
    work:
      - Inspect J6 wrist/cable after the collision flag and preserve the earlier J5 inspection evidence.
      - Retain the recorded negative J6 storage branch; require schema-v4 and pre-enable rejection of a positive non-ready branch.
      - Prove software-only all-six enable rollback/watchdog and exact CAD-holder incident-pose rejection, builds and rootless qualifications.
      - Run the exact saved profile at five-percent speed with emergency stop ready.
      - Prove STARTUP_WRIST changes only J6, ROUGH_HOME reaches all six configured joints, Cancel/Home uses a fresh direct route, STORAGE_WRIST reaches the configured J6, no redundant autonomous hold-service request is sent, and all six motors disable.
      - Test cancellation during real motion and one controllable perception/planning failure.
    exit_criteria: Every case ends with exact stage evidence, configured-joint convergence, six disabled flags, zero mission-owned children and coordinator/RViz still resident.
  - id: M2
    name: Rough-coordinate target acquisition
    status: software_complete_physical_pending
    depends_on: [M1]
    work:
      - Validate centered-first one-look/replan behavior at close and farther reachable distances.
      - Test hints offset by representative directions up to 0.10 m and require lock within five distinct looks.
      - Test no-target and lost-target cases and verify safe terminal behavior.
    exit_criteria: Fresh measured lock is obtained without unnecessary motion when visible; bounded misses return a retryable result and satisfy M1 shutdown evidence.
  - id: M3
    name: Exact occlusion assessment and iterative reobservation
    status: software_complete_physical_pending
    depends_on: [M2]
    work:
      - Validate clear, harmful rigid, unknown and human/hand scenes using synchronized archived RGB-D and exact capture-time TF.
      - Require two associated heavy observations before contact authorization.
      - Verify every proposed/confirmed action forces a new heavy observation and assessment.
    exit_criteria: Clear scenes proceed; harmful qualified objects produce bounded proposals; unsafe or uncertain scenes return NEEDS_OPERATOR and still satisfy M1 shutdown evidence.
  - id: M4
    name: Qualified push and pick/place occlusion removal
    status: blocked
    depends_on: [M3]
    blocker: Gripper TCP, open/closed finger geometry, attached-object lifecycle, allowed-contact policy, grasp closure, push contact and supported placement are not physically qualified; manipulation_model_qualified=false is mandatory.
    work:
      - Calibrate and validate gripper/TCP and collision states.
      - Qualify a low-speed marker/stick outward push, then heavy reobservation.
      - Qualify grasp, lift, observed-support placement, release and attached-object cleanup, then heavy reobservation.
      - Add or enable a separately owned contact executor only after proposal-only and physical safety evidence passes.
    exit_criteria: Both push and pick/place clear a harmful rigid occlusion without target disturbance or unsafe contact, and every failure returns through M1.
  - id: M5
    name: Feature-diverse measured NBV capture
    status: physical_execution_passed_completion_open
    depends_on: [M2, M3]
    work:
      - Preserve the accepted 24-view execution and safe shutdown from scan_20260811_190342; inspect why it stopped 6.49 degrees short of the azimuth floor and failed measured convergence.
      - Run the current one-view closed loop on close and farther reachable targets.
      - Audit actual camera position/look, both Y sides, azimuth/elevation spans, visible distinctive features and per-view novel masked surface.
      - Inspect all persisted RGB-D/mask/TF metadata and tune ranking only from measured failures without weakening collision, visibility, standoff or GOOD/CLEAR gates.
