engineering_agent_obligations:
  before_work:
    - Read docs/ai in the index order and use ownership, contracts, flows, guardrails and debt as the navigation map.
    - Check this roadmap and identify the active milestone, its dependencies, mandatory retests and whether physical authorization exists.
    - Inspect current process/hardware state read-only before any live action; never infer safety from an old run.
  during_work:
    - Trace failures across the entire relevant flow and fix the owning cause rather than suppressing symptoms or weakening gates.
    - Keep changes within owner_module and allowed_edit_paths unless coordinated dependencies are reviewed.
    - Preserve coordinator/RViz lifetime, exclusive command ownership, Cancel/Home availability and safe terminal behavior.
    - Use one observation/action/view and replan from measured state rather than committing a rigid open-loop sequence.
    - Never run physical motion, camera or live-node tests unless the operator explicitly authorizes that test phase.
    - Stop immediately on emergency stop, untrusted feedback/control, unexpected contact, strain or unsafe physical behavior and report NEEDS_OPERATOR.
  after_each_change:
    - Run the flow-specific tests required by 40-flows.yaml and 50-guardrails.yaml, then proportionate wider regressions, builds and command-free qualifications.
    - Update every stale docs/ai YAML, this roadmap status/evidence, operator documentation and project-structure when layout changes.
    - Distinguish software-complete, command-free qualified and physically accepted; never promote one into another.
  after_each_physical_run:
    - Record task/session IDs, exact configuration hashes, observed behavior, capture/coverage metrics, home error, motor flags, child cleanup and failure cause.
    - If the run fails, preserve evidence, diagnose, implement the smallest owning fix, rerun offline checks and repeat only after explicit authorization remains clear.
    - Do not stop at the first successful run when the milestone requires repetition or a matrix of conditions.

operator_dependencies:
  - Gripper command transport, powered 0--10 mm motion and five-second compliant-object holding at approximately 1.04 N m are proved through the sole production driver with exact 0x159/0x2A8 evidence. Final feedback is disabled, zero-effort and not-homed; zero/configuration remains a separate manufacturer-procedure decision, but holding-force qualification is no longer a blocker.
  - Explicitly authorize each physical test phase and keep emergency stop access and a supervised clear bench.
  - Place/remove targets or occluders and confirm unexpected physical contact/strain when a test requires it.
  - Keep the tracked base stationary until brake authority and mounted collision/TF integration are accepted.
  - Provide the real tracked-robot endpoint/network and its odometry/base-home behavior for M7.
  - Approve manipulation calibration/contact fixtures before M4; software must not infer that authority.

roadmap_update_protocol:
  - Update last_reviewed, milestone status, evidence and next_execution_order whenever accepted evidence or a blocker changes.
  - Put detailed defect histories and deferred cleanup in 60-debt.yaml; keep this file concise enough to answer what the goal is, what remains and what happens next.
  - A milestone may move to complete only when its exit criteria are met on the current implementation and configuration.
  - If code and roadmap disagree, code plus current test evidence describe behavior, but the task is not finished until this roadmap and every affected architecture document are corrected.

