authority:
  purpose: >-
    This is the durable source of truth for the product goal, milestone order,
    completion gates, current status and the work the engineering agent must do.
    Architecture remains authoritative in 10-system-map.yaml, interfaces in
    30-contracts.yaml, runtime evidence in 40-flows.yaml, safety in
    50-guardrails.yaml and detailed unresolved work in 60-debt.yaml.
  status_vocabulary:
    complete: Implemented and accepted with the evidence required by this roadmap.
    software_complete_physical_pending: Implemented and offline-tested, but the current configuration has not passed its required supervised physical acceptance.
    partial: Some production path exists, but required functionality or evidence is missing.
    blocked: Work must not advance until the named safety or external dependency is satisfied.
    pending: Not yet implemented or not yet exercised as an integrated milestone.

mission_goal: >-
  Build a dependable eye-in-hand PiPER subsystem for a tracked robot. The
  tracked robot supplies a task identifier, open-vocabulary target text and a
  rough target pose in its odometry frame. The always-resident coordinator
  transforms and accepts that job, starts only the mission-owned arm,
  perception and planning stack, safely normalizes the arm, visually acquires
  the target near the rough coordinate, assesses and when qualified removes
  harmful occlusions, captures diverse target-only RGB-D observations, safely
  homes and disables the arm on every terminal path, stops only the children it
  started, and returns a durable success/failure result to the tracked robot.
  After the tracked robot reports that its base is home, the system reconstructs
  and exposes a validated target mesh from the accepted observations.

current_integration_status_2026_08_17:
  status: software_complete_physical_pending
  completed: [MissionEngine sole mission/shutdown authority, fresh direct-home qualification on every owned controllable failure, motor-loss-only no-command exception, named immutable executor runtime gates, redundant autonomous startup and terminal hold-service calls removed, obsolete frozen mission and duplicate shadow evaluator removed]
  unchanged: [scan trajectory paths/timing/speed, Tesseract and perception algorithms, public ROS contracts, numeric limits and thresholds, TF/calibration, configured home targets]
  next: Run full software/build/rootless qualifications, push the reviewed branch, then perform the supervised physical checklist beginning with staged direct home and one injected non-motor failure-to-home case.

system_behavior_required:
  input:
    - One or more independently identified tasks, each with task_id, target label/prompt, confidence and rough pose with frame and timestamp; admit a bounded queue and scan the closest pending target first.
    - The current GUI may emulate the tracked robot, but must use the same mission action contract.
  startup:
    - Coordinator and RViz remain resident between jobs.
    - Exactly one coordinator owns a mission; duplicate owners or goals fail closed.
    - Start driver, camera, TF, GPU perception, tracking, planning, capture and execution children with bounded health gates.
    - Enable only after feedback and dependency preflight succeeds.
    - Move J6 directly from storage to ready, then move directly to the configured rough home before task motion.
    - Never overlap or pre-empt physical missions; finish validated capture state, home, disable, child cleanup and durable result before dispatching the closest remaining queued target.
  acquisition:
    - Transform the rough pose into piper_base_link when the mobile-base TF is available.
    - Begin from the measured camera/arm pose and request the smallest practical camera-facing move.
    - Observe and replan one look at a time: centered first, then approximately 15-degree up, down, left and right looks.
    - Stop immediately on a fresh measured target lock and fail safely after at most five distinct looks.
    - No fixed rectangular, radial or height workspace may reject a pose; finite joints, IK, collision, visibility, sensor range and runtime state remain authoritative.
  occlusion_handling:
    - Run a dedicated settled heavy RGB-D observation after target lock; acquisition evidence cannot declare the scene clear.
    - Decide whether foreground geometry materially harms target capture quality.
    - If clear, proceed without touching the scene.
    - If harmful and qualified, choose the least invasive safe push or pick/place action using exact observed geometry and an observed supported placement region.
    - Reobserve after every physical action and repeat only within the bounded action budget until clear.
    - Unknown objects, people, missing geometry or unqualified manipulation return NEEDS_OPERATOR; they never authorize contact.
  scanning:
    - Use the measured target, never the rough hint, after lock.
    - Plan one reachable collision-free next view at a time from measured achieved FK and measured masked RGB-D surface coverage.
    - Prefer views that expose missing target faces and distinctive features, including both Y sides, while retaining compact IK alternatives for close targets.
    - Persist synchronized RGB, raw/aligned depth, mask, intrinsics, capture-time TF, joints, target pose, plan identity and quality evidence for every accepted capture.
    - Require GOOD and CLEAR evidence; reject stale or bad views without counting them and replan from the measured held pose.
    - Treat eight accepted captures only as a measured-model seed; continue adaptively through at most twenty-four until side/span floors and three consecutive measured novel-surface gains at or below 0.02 pass, or fail safely when no meaningful safe view remains.
  terminal_behavior:
    - Success, controllable failure and manual Cancel/Home first stop and hold the measured current pose.
    - Request a fresh direct ROUGH_HOME target and then a direct J6-only STORAGE_WRIST target.
    - Dedicated PRE_HOME, ROUGH_HOME and STORAGE_WRIST stages never retrace an old path and bypass the Tesseract worker plus robot self-collision, camera/tracking/obstacle freshness and Tesseract motion-limit telemetry. The CAD-derived installed holder/L515 envelope must retain at least 0.005 m support-plane/external clearance; hard limits, fresh trusted feedback/control, motor health, independent stage proof, the operator-authorized 0.2-rad per-joint configured-home endpoint acceptance and disable proof remain mandatory. The controller retains each proved target; autonomous startup and shutdown do not request a second hold acknowledgement.
    - Stop all mission-owned nodes after disable while keeping coordinator and RViz ready.
    - Return outcome, stable failure code, retryable flag, safe_shutdown, capture result and mesh job identity to the tracked robot or GUI emulator.
  reconstruction:
    - A successful arm mission creates a durable WAITING_FOR_BASE_HOME mesh job; it does not reconstruct immediately.
    - Accept only an exact task/job/manifest-correlated tracked-robot-homed report.
    - Run target-only registration and reconstruction in isolation, reject corrupt/inconsistent inputs, and publish durable mesh status plus the validated output hash/path.

definition_of_done:
  functional:
    - The same production mission path works from the GUI emulator and the tracked-robot gateway.
    - Close and farther reachable targets can be acquired from rough hints with error up to 0.10 m without a fixed software workspace box.
    - Clear scenes produce feature-diverse, measured-converged RGB-D datasets and a usable mesh.
    - Qualified rigid occlusions can be cleared by both push and pick/place, with heavy reobservation after each action.
    - Every success, failure and cancellation reaches the configured staged storage posture, retains the final position-controller target, disables all six motors and removes all mission-owned children unless control feedback is untrustworthy.
    - The tracked robot receives a durable success/failure/retry result and can trigger reconstruction only after reporting base home.
  acceptance:
    - All affected offline tests, ROS builds, YAML checks and rootless Tesseract qualifications pass.
    - All flow-specific mandatory smoke checks in 40-flows.yaml and 50-guardrails.yaml pass on the current hardware/configuration.
    - Three consecutive supervised five-percent end-to-end missions pass without manual software intervention, with 8-24 GOOD/CLEAR records, required feature/three-view surface convergence, safe shutdown and exact child cleanup.
    - Separate supervised cases pass for no-lock, bad capture replacement, cancel during motion, controllable component failure, clear scene, push occlusion, pick/place occlusion, tracked-base-home correlation and mesh reconstruction.
    - Mounted deployment additionally proves odom-to-piper_base_link transformation, stationary/brake authority and chassis collision integration.
  claim_rule: >-
    Do not call the whole system complete because unit tests pass or because one
    historical physical run succeeded. Completion requires current-version
    evidence for every acceptance item above. Record failures as evidence,
    repair their real cause, rerun affected offline checks, and repeat the
    supervised case until it passes without weakening a safety or quality gate.

current_baseline_2026_08_11:
  working_or_implemented:
