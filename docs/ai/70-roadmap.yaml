    - Always-resident singleton coordinator with bounded child ownership and GUI mission emulation.
    - Open-vocabulary prompt propagation, centered-first five-look acquisition and measured tracking lock.
    - Synchronized heavy RGB-D occlusion evidence and two-observation rigid-object proposal policy.
    - One-view-at-a-time adaptive 8-to-24 feature-driven planning with achieved-FK diversity and three-view measured surface convergence.
    - GOOD/CLEAR synchronized RGB-D/mask capture persistence and rejected-view replacement.
    - Direct two-stage configured homing on terminal paths with robot self-collision exemption but mandatory CAD-holder external clearance, feedback-confirmed disable and owned-child cleanup.
    - Durable delayed reconstruction job and exact tracked-base-home correlation interfaces.
    - Bounded eight-admission multi-target queue with immediate gateway TF snapshot, one-second closest-first batching, stable arrival ties, exactly one active physical mission, queued cancellation and per-mission cache/process isolation.
  proven_offline:
    - The 2026-08-11 containment passes 29 driver package tests with one intentional skip, 319 mobile-manipulation tests, 92 Tesseract tests, affected package builds, and both command-free rootless qualifications. Core rejects the exact incident pose at 0.001245 m against the 0.005 m holder margin and validates the normal folded home across 3541 external-floor samples; compact also returns PASS.
    - 162 defect-focused home/contract/worker/executor tests, 387 full mobile-manipulation/Tesseract tests and 282 focused ROS/GUI/driver/Tesseract tests pass.
    - piper_mobile_manipulation and piper_tesseract_foxy build successfully.
    - Exact saved-profile core and compact rootless qualifications pass with real_arm_motion=false.
    - The target-only empty-scene plus exact-moving-segment snapshot fixes pass 144 focused tests and the complete 392-test ROS/Tesseract suite; piper_mobile_manipulation rebuilds and both rootless qualifications pass.
    - Camera-clock hold/recovery and the ordinary 0.005-rad feedback-only boundary cap pass offline validation. A disabled preflight then measured J6 0.031677 rad beyond -pi after storage relaxation; the separate operator-qualified 0.3-rad allowance is now exact-first-point direct-RETURN_HOME-only. Automatic one-view plans now omit their unused embedded contingency home while manual batch retains it. The combined current tree passes 194 focused and 441 complete tests, rebuild and both rootless qualifications.
  current_physical_state:
    - GUI task gui-sim-a130d7ad58a54815ab36341ed324be82 physically exercised historical tesseract_stream_v1 at 50 percent through acquisition and 24 GOOD/CLEAR captures. It achieved nine +Y and three -Y views, 113.51-degree azimuth and 37.46-degree elevation, then correctly failed INSUFFICIENT_CAPTURE_QUALITY because azimuth remained below 120 degrees and measured surface did not converge. No scheduled-stream overrun was logged; direct staged home, storage proof, six-axis disable and exact child cleanup completed with safe_shutdown=true. This does not qualify tesseract_stream_v3, settings above its 20-percent exact-speed envelope or feature completion.
    - The next GUI task gui-sim-79f9f909f91148dda1f74b4292a4b5b5 physically proved the base_link-only frame repair, persisted three GOOD/CLEAR captures, rejected one fresh invalid view and planned a distinct replacement. The replacement reached and settled, but lower-level target_3d invalid was misclassified as ABORTED instead of VIEW_REJECTED. Safe shutdown again proved rough home, storage J6, hold, all six disabled and exact child cleanup without contact. The equivalence repair passes 114 focused, 327 full mobile and 92 Tesseract tests plus both command-free rootless qualifications; physical retry remains.
    - GUI task gui-sim-e9629c41e1224425b5adb0454b61ee3f physically exercised current tesseract_stream_v3 at 20 percent. Acquisition ran for 2.501 seconds over 50 samples at 19.6 Hz; scan segments remained approximately 18.0-19.6 Hz with aligned planned/actual duration, and the operator judged speed consistent. Fifteen GOOD/CLEAR captures persisted with two views on each Y side and 40.64-degree elevation, but the local 6-30-degree candidate frontier exhausted at only 65.30/120 degrees azimuth without measured-surface convergence. It correctly returned NO_REACHABLE_PLAN and proved direct rough/storage home, all-six disable and exact child cleanup with safe_shutdown=true. The 20-percent v3 timing behavior is accepted; 1/5/10-percent stages, deliberate cancel, NBV completion and settings above 20 percent remain pending.
    - Current idle state after the operator-requested shutdown is arm disabled with coordinator, GUI, RViz, ROS discovery daemon and every mission-owned driver/camera/perception/planning child stopped. No process owns any /dev/video device. Every new physical run requires explicit operator authorization and the read-only gate.
    - On 2026-08-11 GUI task gui-sim-0d67e6fce8404547b93b68c11d900d1a completed acquisition and CLEAR occlusion assessment, persisted ten GOOD/CLEAR observations, exercised same-pose evidence retry plus fresh-quality rejection/replacement, and completed external-floor-guarded ROUGH_HOME, STORAGE_WRIST, hold, six disabled axes and exact child cleanup without contact. It failed feature completion at +Y 3, -Y 0, 59.7-degree azimuth and 22.2-degree elevation because raw camera-frame /piper/target_3d briefly replaced the base_link NBV centre after tracking paused. The frame contract and misleading CONTROL_UNTRUSTWORTHY classification are repaired; the package rebuild, 327 mobile tests, 92 Tesseract tests and both command-free rootless qualifications pass. A new physical GUI validation is next.
    - On 2026-08-11 GUI task gui-sim-d30410e05b9c405cb48e969fa818c173 persisted ten GOOD/CLEAR diverse views in scan_20260811_124232. The planner is accepted. During terminal direct home, the camera-holder/L515 contacted the table/floor and J5 disabled with multiple per-motor FOC faults. Exact geometry showed only 0.001245441 m holder clearance at the start versus the required 0.005 m.
    - Immediately after that incident all six motor flags were false and hardware/mission processes were stopped. Mechanical inspection, fault-clear read-only feedback and operator reauthorization have since completed; the newer ten-capture mission above is the first contact-free post-incident full shutdown proof.
    - The latest five-percent mission acquired the measured cube, passed the exact CLEAR workflow probe and persisted three GOOD/CLEAR captures before the fourth moving view held on a target-only obstacle-heartbeat gap.
