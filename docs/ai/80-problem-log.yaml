multiview_cube_surface_duplicated_and_oversized_2026_08_21:
  state: bounded_registration_improved_recalibration_evidence_required
  symptom: The latest seven-view scan produced individually clean face planes but a sparse duplicated fused cube with a robot-pose OBB about 73 x 58 x 47 mm for a measured 35 mm cube.
  root_cause: Capture density and the 20-frame median were not the primary failure. Cross-view residual alignment dominates; the exact share attributable to hand-eye calibration, robot FK repeatability and partial or symmetric surface registration remains unresolved.
  correction: Add connected bounded multi-view GICP as an offline residual candidate, retain 20 mm and 5 degree bounds, and require evidence-based auto selection. Correct fixed-board validation to use exact image-time TF.
  evidence: Robot baseline 39.5 percent dominant component and 3.97 mm p90 residual; multiway candidate 90.5 percent and 2.25 mm, but 58.8 x 52.9 x 48.3 mm OBB still fails. No threshold was weakened.
  next_action: New operator-driven corrected-scale calibration dataset and held-out validation; do not deploy automatically.
generation_seven_table_contact_2026_08_21:
  state: contained_virtual_floor_raised_physical_requalification_blocked
  symptom: Task gui-sim-d77550972be14f9ca55b27e206ccbfd0 accepted seven burst captures, selected ray-NBV view 1000400 and began motion, but the installed assembly contacted the table and continued downward until the runtime guard stopped on J5 feedback 1.225615 rad.
  root_cause: The exact physical geometry discrepancy is not yet proven. The shared nominal floor_z_m 0.000 plus 0.005 m CAD-envelope margin was demonstrably insufficient for the installed table boundary; this is not a burst-capture or NBV information-gain failure.
  correction: Raise floor_z_m to 0.005 in both executor and Tesseract while retaining the 0.005 m holder margin for 0.010 m total nominal protection. Offline FK confirms the recorded staged-home route still passes. No physical retest is authorized by this correction alone.
  evidence: [/run/user/1000/piper_target_scan_logs/scan_stack.log, /tmp/piper_target_scan_missions/results/gui-sim-d77550972be14f9ca55b27e206ccbfd0.json, datasets/active_scan/scan_20260821_220003, scan_execution_params.yaml, collision_model.yaml]
partial_scan_could_not_enter_reconstruction_2026_08_21:
  state: integration_fixed_current_mesh_quality_failed
  symptom: The successful three-capture safe-frontier mission queued a job that the old worker would reject at its hard eight-view count gate; the gateway also searched a different virtual-environment path than the installer/GUI and system Python had no Open3D. Every historical capture lacked calibration_sha256, so the automatic path would also fail certification.
  correction: Keep standalone 8-24 by default, explicitly admit 1-7 from the safely completed deferred gateway or command-free manual GUI diagnostic route, classify them PARTIAL_VIEW_SET and cap overall quality below PASS, share reconstruction/.venv, allow missing historical identity only as DIAGNOSTIC_ONLY, hash the exact deployed calibration for future captures, and map quality FAIL to durable job FAILED with diagnostics retained. The GUI now reads target_mesh.ply.quality.json instead of the obsolete quality_report.json path.
  evidence: [30 isolated reconstruction tests pass, 47 mission/reconstruction-job tests pass, 726 complete mobile tests pass, mobile package builds, gateway-equivalent replay integrates all three frames, actual GUI Build and Validate plus Open 3D Viewer route passes]
  replay_result: scan_20260821_185143 produced 615 vertices and 719 triangles but failed quality at 70.4-percent dominant component and non-watertight geometry. No quality threshold was weakened.
final_ray_e2e_integration_2026_08_21:
  state: fixed_and_supervised_e2e_verified
  task_id: codex-e2e-20260821-185113-adaptive
  dataset: datasets/active_scan/scan_20260821_185143
  result: Three accepted captures, true exhaustion of the remaining 151 prequalified rays, SUCCEEDED, safe_shutdown true, all configured home/storage stages proved, feedback disable proved, and no mission-owned child remained.
  repaired_causes: [final semantic mask previously reused a biased pre-refinement target depth, low-rate capture diagnostics could starve behind RGB-D callbacks, exclusion occurred after six-ray bounding, an attempted-ray budget timeout remained generic PLANNING_FAILED, full safe-frontier completion incorrectly required the hard eight-view feature floor]
  containment: No ROS interface, motion speed, capture quality threshold, Tesseract safety check, home sequence, disable sequence, or process ownership rule changed.
single_failed_ray_shortlist_ended_complete_scan_2026_08_21:
  state: fixed_and_supervised_e2e_verified
  symptom: Tasks codex-e2e-20260821-174623-26afd7 and codex-e2e-20260821-175620-rayfix accepted four and three captures respectively, then one six-ray Tesseract batch failed IK and the mission incorrectly declared the complete roughly 160-ray frontier exhausted.
  root_cause: The worker correctly reported attempted_ray_ids, but the bridge discarded that provenance and the mission classified any TESSERACT_EXHAUSTED batch as terminal.
  correction: The bridge now retains attempted infeasible ray IDs only for the current session and accepted-count generation, excludes them from the next shortlist, and emits typed RAY_SHORTLIST_EXHAUSTED. MissionEngine retries that exact condition; genuine RAY_FRONTIER_EXHAUSTED remains coverage-aware and terminal.
  evidence: [722 complete mobile tests pass, 131 complete Tesseract tests pass, affected packages build, codex-e2e-20260821-185113-adaptive advanced across successive failed batches and exhausted the true pool before successful staged shutdown]
all_rays_removed_by_workspace_filter_2026_08_21:
  state: fixed_and_live_verified
  symptom: Task codex-e2e-20260821-174226-75933d reported zero of 175 workspace-prequalified rays.
  root_cause: The live planner serialized ray_direction as a mapping with x y z fields while the new cull iterated it as a numeric sequence, so every ray failed local parsing. The configured workspace did not remove the rays.
  correction: The filter accepts the authoritative mapping and retains backward-compatible sequence input. Offline replay retained 160 of 175 and later live tasks also retained 160 of 175.
out_of_workspace_rays_reach_expensive_planner_2026_08_21:
  state: software_fixed_physical_retest_pending
  symptom: Information-ranked full-sphere rays could consume the bounded Tesseract direction budget even when no point on their permitted standoff interval lay inside the configured coarse camera workspace.
  correction: The existing reachability-filter owner now tests continuous bounded-ray/workspace intersection and marks empty rays unsafe before bridge shortlisting. It retains rays when any permitted point intersects, even if their representative scoring point does not.
  boundary: This is ray-only cheap culling, not an IK or collision approximation. Tesseract/executor feasibility and exact-point policies are unchanged.
ray_policy_attempt_cost_and_low_value_candidates_2026_08_21:
  state: software_fixed_physical_retest_pending
  symptom: Frozen ray_nbv still handed a broad twelve-direction batch to Tesseract and allowed arbitrarily small positive predicted information, so expensive exact standoff attempts could be spent on low-value or later-ranked directions.
  root_cause: Exact-point voxel and target-ray policies shared one candidate limit, and ray expansion ordered probe phases globally rather than exhausting one ranked direction before moving to the next.
  correction: Bind policy to candidate geometry, require 0.02 normalized predicted marginal information for both authoritative NBV policies, retain twelve exact points for voxel_nbv, cap ray_nbv at six directions and keep each direction's preferred then reserve probes contiguous. Private request validation fails closed on mixed policies, interleaved rays or bound mismatches.
  boundary: [NBV gain formula unchanged, ranking unchanged, accepted-only coverage unchanged, Tesseract remains feasibility owner, no ROS interface motion speed safety capture home or shutdown change]
tesseract_detour_controller_lead_2026_08_21:
  state: software_fixed_physical_retest_pending
  task_id: gui-sim-b1806846b4cf401faaecd01bb8913828
  symptom: The repaired clear-scene handoff reached the first ray-NBV seed motion, but a TESSERACT_STREAM detour accumulated 0.310360564 rad measured lag against the unchanged 0.30-rad corridor and aborted before capture.
  root_cause: Direct straight-chord plans use one native MoveJ and had already succeeded at 15 percent. A collision/visibility detour must retain multiple setpoints; its wall-clock sender continued advancing those setpoints while the endpoint-style controller lagged, leaving no flow-control headroom before the hard following guard.
  correction: Before issuing another detour setpoint, compare it and the last sent setpoint with fresh measured joints. When the existing 0.30-rad corridor is exhausted, stop advancing the schedule and retain the last collision-qualified setpoint. Resume the unchanged path when feedback catches up; if it does not recover within the existing one-second grace, abort and home. Never burst, skip, change speed, alter the path or weaken the numeric guard.
  evidence: [150 focused executor and trajectory tests pass, 703 complete mobile tests pass]
  containment: PRE_HOME ROUGH_HOME STORAGE_WRIST all-six disable empty-dataset removal and exact child cleanup all passed with safe_shutdown true.
adjacent_table_false_depth_occluder_2026_08_21:
  state: fixed_and_supervised_e2e_verified
  task_id: gui-sim-465e116c2f4d4dfca5fba46776ea2543
  symptom: Startup and first-look cube acquisition passed, but the settled workflow probe reported one unsafe unknown depth foreground object and aborted before the seed capture.
  root_cause: The target-local depth fallback treated any closer-depth component touching a six-pixel target-mask dilation as relevant. A 1533-pixel table/shadow crescent below the resting cube had zero direct target overlap and zero intrusion into the target mask envelope, but 81 dilated-neighborhood pixels incorrectly made it an occluder.
  correction: A synthetic target-local depth component must now contain at least the existing 20-pixel support minimum inside the observed target-mask bounding envelope. The complete connected component is retained when it crosses that envelope; adjacent support surfaces are rejected. GroundingDINO semantic obstacles and all downstream fail-closed handling are unchanged.
  evidence: [recorded failed frame replays to no depth occluder, adjacent-support regression passes, crossing-foreground regression passes, 33 isolated GroundingDINO/SAM2 tests pass, later supervised E2Es passed clear-scene probing and accepted captures]
  containment: The failed mission made zero captures, removed its empty dataset, completed PRE_HOME ROUGH_HOME STORAGE_WRIST all-six disable and owned-child cleanup.
gui_camera_profile_controls_missing_2026_08_21:
  state: software_fixed_no_physical_test
  symptom: The current Automatic Scan tab no longer exposed the previously qualified L515 RGB resolution and frame-rate choices.
  root_cause: The old implementation carried camera fields in RunTargetScan; the behavior-preserving refactor restored the baseline public action schema but did not retain a private next-start configuration boundary for the GUI controls.
  correction: Restore the controls through a validated atomic L515_camera/rgb_profile.conf setting read by both camera launchers at process startup. Do not restore public action fields or mutate a running camera.
  evidence: [camera profile unit tests, GUI Phase-8 source tests, shell syntax checks]
terminal_pre_home_proof_suppressed_rough_home_2026_08_21:
  state: software_fixed_physical_retest_pending
  task_id: gui-sim-eee579370cae41cd96601541eacc7d40
  symptom: Cancellation during VIEW_PLANNING emitted only one STORAGE_WRIST shutdown motion; no distinct PRE_HOME or ROUGH_HOME command appeared in the executor log even though the result payload claimed both stages.
  root_cause: Fresh joints were inside the former 0.30-rad PRE_HOME shortcut band, and prove_return_home_for_shutdown incorrectly wrote that PRE_HOME proof into the shared return_home_proved field. MissionEngine consequently skipped the distinct ROUGH_HOME stage and STORAGE_WRIST moved J1-J5 and J6 together.
  correction: Tighten only configured-home endpoint and successive-sample acceptance to 0.20 rad, keep the distinct 0.30-rad exact-first-point post-disable limit allowance unchanged, and record PRE_HOME, ROUGH_HOME and STORAGE_WRIST proof only in their corresponding MissionSession fields.
  software_evidence: [114 focused mission/configuration tests pass, PRE_HOME regression proves return_home_proved remains false]
  physical_gate: Restart the idle coordinator so it loads current source, then require one supervised cancel after acquisition to show separate PRE_HOME, ROUGH_HOME and STORAGE_WRIST transactions before disable.
voxel_radial_lattice_recomputation_2026_08_21:
  state: software_fixed_physical_retest_pending
  symptom: Authoritative voxel_nbv regenerated and rescored six exact radial layers for every angular direction even though information gain is directional and Tesseract ultimately owns exact reachable standoff.
  correction: Freeze one angular ray pool per static-target mission, score configured representative directions, discard normalized predicted gain below 0.02, shortlist at most six rays, then exhaust each ray's preferred and reserve exact positions before the next direction. This path is named ray_nbv; voxel_nbv retains the former exact-point lattice and twelve-point bound so timing and mission behavior can be compared.
  followup: GUI now selects legacy, voxel_nbv or ray_nbv, a target sector/upper hemisphere/full sphere, and 1 through 1000 rays. Default is 175 full-sphere rays. Software regression is complete; physical comparison is pending.
  boundary: No NBV gain, coverage, motion, speed, collision, capture threshold, public interface, home or shutdown policy changed.
  remaining: Confirm the first supervised ray mission produces materially different accepted directions and that preferred/backup standoff probing does not increase capture duplication.
raw_unknown_pixel_nbv_diversity_bias_2026_08_20:
  state: software_fixed_physical_retest_pending
  task_id: codex-e2e-nbv15-20260820-230803
  dataset: datasets/active_scan/scan_20260820_230845
  symptom: Six accepted captures appeared orbit-like. Every post-seed accepted candidate used 65 degrees elevation, accepted directions covered only 53.6 degrees azimuth, neither Y side met its threshold, and later measured novel fractions fell near 0.09 to 0.13.
  cause: rank_next_best_views compared raw predicted unknown pixels before surface and angular novelty. The six-capture replay ranked the full 75-degree elevation band ahead of every lower band; Tesseract rejected many 75-degree candidates and selected neighboring reachable 65-degree candidates.
  correction: Rank normalized marginal information fraction first, accepted-view angular novelty second, absolute marginal pixels next and travel last. Carry both new marginal fields through existing private provenance only.
  unchanged: [candidate region, accepted-only coverage, shortlist size and sector logic, Tesseract feasibility, exact aim, capture acceptance, tracking, speed, home, disable, shutdown, public ROS interfaces]
  evidence: [118 focused tests pass, 685 complete mobile tests pass, 117 complete Tesseract tests pass, five-package build passes, rootless core and compact suites pass, changed-file lint passes, software replay top twelve contains ten 15-degree and two 25-degree candidates across both azimuth extremes]
steep_band_nbv_shortlist_2026_08_20:
  state: software_fixed_physical_retest_pending
  task_id: codex-e2e-clear-20260820-223207
  symptom: Three captures were committed but accepted azimuth span was only 15.9 degrees; most motion-planning attempts remained in the 75/65-degree elevation bands and the mission later failed TARGET_NOT_FOUND.
  evidence: Candidate metadata showed top information views across Y sectors, but nearly every failed pose reported no finite bounded IK. Command-free raw-IK diagnosis proved a representative steep rank-one pose had zero raw IK across ninety roll/seed attempts while the selected continuity pose had fifty-six raw in-limit collision-free solutions. Mapping the configured dome found exact feasible poses around 35-55 degrees elevation and approximately -150 through +142.5 degrees of the reachable arc.
  cause: The twelve-view bridge handoff preferred the achieved elevation for sector alternatives. After a rejected move reached 65 degrees, the shortlist preserved 75/65-degree variants instead of retaining mid-elevation IK escapes already present in the ranked NBV pool.
  correction: Keep six global leaders from broad 30-degree direction sectors, retain five alternatives near the median configured elevation inside those informative sectors, keep one nearest informative continuity candidate, and restore final attempt order to authoritative NBV rank.
  unchanged: [NBV candidate generation and information gain, twelve-view bound, Tesseract IK collision path authority, exact-first five-degree-fallback aim, speeds, capture, home, disable, public ROS interfaces]
  software_evidence: [focused bridge tests, live-shaped shortlist replay retains exact-feasible continuity and both-side mid-elevation alternatives, rootless exact-aim IK validates four feasible shortlist choices]
generation_one_shortlist_exhaustion_2026_08_20:
  state: software_fixed_physical_rerun_pending
  task_id: codex-e2e-tracking-20260820-2106
  symptom: Mission safely started, locked the cube and committed one exact-aim GOOD/CLEAR capture, then returned TESSERACT_EXHAUSTED because all twelve shortlisted generation-one candidates failed exact and at-most-five-degree-fallback IK.
  evidence: Voxel NBV generated 1050 candidates and retained 1044 positive nonduplicates. The bridge selected eight information leaders and four sector fallbacks, leaving no nearby continuity option. Offline replay found positive-information candidate 585 about 0.045 m from achieved FK, and rootless exact-aim Tesseract found thirteen collision-qualified IK goals for it.
  contributing_tracking_issue: Live valid GPU measurements had gaps up to 3.8868 seconds, exceeding the former one-second LOST timeout; confidence-scaled noise also made low-confidence innovations easier to accept.
  correction: Preserve global leaders, reserve one of the existing fallback slots for nearest positive-information continuity, return the final list in NBV rank order, extend bounded stationary prediction to five seconds, reduce process noise to 0.01 and use base measurement noise 0.02 for innovation gating.
  containment: The mission performed pre-home, rough home, storage wrist, all-six disable and exact child cleanup. The single-capture dataset is retained as useful replay evidence.
  software_evidence: [100 focused tests pass, 400 wider functional tests pass, five-package build passes, functional colcon tests pass, replay includes continuity candidate, rootless exact-aim IK finds thirteen goals]
unsafe_hand_probe_stop_2026_08_20:
  state: expected_safety_behavior_no_code_change
  task_id: codex-e2e-rerun-20260820-2245
  evidence: The persisted full frame and target-crop debug image show an operator arm and hand beside the cube. GroundingDINO reported cube 0.806 and hand 0.336; the local unsafe threshold is 0.30. The heavy result classified one unknown depth foreground as unsafe and the workflow returned OCCLUSION_NOT_CLEARED before NBV.
  containment: Positive-only startup completed correctly. Terminal pre-home, rough home, storage, all-six disable, exact process cleanup and zero-capture dataset removal all passed.
  decision: Do not lower the hand threshold or bypass unsafe objects. Clear people from the complete camera view and repeat the supervised E2E to qualify the tracking/shortlist changes.
target_jump_from_unmasked_roi_depth_2026_08_20:
  state: software_fixed_no_physical_test
  recorded_evidence: vision.log repeatedly alternated valid mask depth near 0.363-0.366 m with source=roi depth near 0.412-0.418 m. The ROI samples had 441 of 441 valid pixels, low standard deviation and approximately 0.77-0.81 confidence, and they pulled the base_link track by centimetres.
  root_cause: depth_to_3d_node treated a missing or stale mask as permission to use rectangular detection-ROI depth; flat background therefore appeared more confident than the semantic target. The tracker then used confidence-scaled noise plus a loose Euclidean jump allowance and had no prediction-only correction path.
  correction: Target3D now requires a fresh correlated nonempty mask; the existing base_link tracker predicts without correction on invalid input and applies a Mahalanobis gate to valid measurements under a near-static model.
  software_evidence: [60 focused depth/tracker tests pass, 680 mobile functional tests pass, 115 Tesseract tests pass unchanged, 120 repository tests pass with one hardware-dependent skip, 11 isolated AI worker tests pass, five-package Foxy build passes, changed tracking files pass flake8 and pep257, AI YAML parsing passes]
  deferred: Later fresh SAM2 masks in the same log drift from about 0.365 m toward 0.478 m. Gradual semantic drift is not fully separable by a Kalman gate and remains a SAM2/reseed follow-up.
  physical_action_during_fix: none
stale_target_aim_and_local_nbv_frontier_2026_08_20:
  state: software_fixed_physical_validation_pending
  dataset: datasets/active_scan/scan_20260820_142919
  symptoms: [camera completed an old requested orientation but was not aimed at the cube, local movement frontier made voxel NBV resemble legacy orbiting, rejected view could leave planner travel anchored at the previous accepted camera, transient visual rejection had no single correlated heavy-refresh handoff]
  evidence: The capture transform optical axis differs from the selected look by only 0.037 degrees but differs from the synchronized qualified target direction by 13.424 degrees. Therefore Tesseract did not miss the old requested orientation; the target geometry supplied to planning was stale or biased.
  code_causes: [depth_to_3d averaged coordinates in the moving camera frame before timestamped base-frame transform, bridge limited selection to 6-to-30 degrees then 30-to-45 recovery and eagerly biased aim up to 12 degrees, accepted history was overloaded as physical current pose, capture layers did not own one explicit refresh-before-reject transition]
  correction: [same qualified component supplies X/Y/Z, no camera-frame temporal average, existing base_link Kalman remains sole estimator, global cumulative voxel gain over configured region, twelve-candidate Tesseract shortlist, exact aim first and one fallback at most five degrees, settled FK recorded independently of capture acceptance, one correlated heavy refresh then replan]
  software_evidence: [660 mobile functional tests pass with 622 registered colcon targets, 110 Tesseract tests pass, 101 repository regressions pass with one hardware skip, five-package build passes, rootless core PASS, rootless compact PASS, changed-file lint passes]
