  root_cause: ACQUIRED proves stable measured tracking within the acquisition association bound, not capture-ready optical centering on the measured target. The rough plan aimed at the rough hint [0.4, 0.0, 0.0], while the measured target was near [0.387, -0.033, 0.145] in base_link and [-0.120, 0.082, 0.250] in the camera frame. The new no-motion achieved-lock check therefore encountered a genuine off-axis border crop, and target_framing_result rejected aim before MissionEngine could enter the outward ladder.
  correction: ACQUIRED is tracking-only and no acquisition shape may seed the revolution. Generation-zero bounded rays use the tracked centre alone; classification waits until the first selected scan-ray endpoint is reached settled and aimed, and complete-shape promotion additionally waits for accepted capture one. Middle-band crops persist the same ray ID with a larger minimum standoff and capture nothing; Tesseract owns any safe path and the executor rechecks endpoint aim.
