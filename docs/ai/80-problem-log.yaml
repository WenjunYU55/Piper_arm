rough_shape_was_integrated_before_settled_aim_2026_08_26:
  state: software_fixed_physical_retest_pending
  task: codex-e2e-first-ray-20260826-1824
  symptom: Target acquisition succeeded and capability prequalification retained 39 of 360 rays, but planner and bridge candidate counts oscillated through 360 39 and zero before a scan ray reached the arm.
  root_cause: The planner subscribed directly to live shape evidence and allowed rough-acquisition exact-stamp shapes to control generation-zero model availability. Cross-topic Target3D and shape arrival order could therefore build geometry before aim or erase the pool. Shape freshness used callback receipt rather than source time, and an envelope upgrade could use the live tracker point instead of the frozen session centre.
  correction: Generation zero now creates un-enveloped bootstrap rays from tracking only. The executor alone holds a complete silhouette after settle and achieved aim, requires its source stamp to follow settle start, promotes it after capture-one acceptance and discards it on rejection; validated scan history is the planner's only shape input. Envelope construction uses the shape source transform, retains the frozen surface lock as bootstrap provenance and makes its axis origin the permanent planning centre. Superseded coordinator/acquisition framing paths were removed.
  evidence: [physical zero-capture safe shutdown, 189 focused border and order tests pass, 835 complete mobile tests pass, 161 complete Tesseract tests pass, affected lint and mobile package build pass]
  remaining: [separately authorized five-percent physical repeat]
