  remaining: Supervised low-speed one-view then three-view then full-E2E qualification.
post_startup_positive_j6_limit_incident_2026_08_20:
  state: software_fixed_physical_validation_pending
  task_id: gui-sim-a09aa6ae47f44c88a458d142a80c2289
  symptom: The mission passed startup, rough acquisition and multiview planning, then the first scan MoveJ timed out with J1-J5 at target and J6 2.400392 rad away. The public result classified the downstream execution failure as NO_REACHABLE_PLAN and made zero captures.
  root_cause: The driver retained the necessary +2pi controller turn after positive-only startup but qualified only a 365-degree positive raw limit. Logical J6 2.483482 rad mapped to raw 8.766667 rad or 502.293 degrees and therefore made no progress from the approximately 364.761-degree current raw coordinate.
  correction: Require and prove 540-degree raw coverage, configure 545 degrees for margin, retain logical [-pi,+pi], and add a pre-transmission overflow rejection plus positive-target regression.
  containment: Shutdown completed PRE_HOME, STORAGE_WRIST, all-six disable and owned-child cleanup; the guarded zero-capture directory was removed.
  remaining: Run a supervised low-speed positive-J6 physical smoke before full E2E.
  software_evidence: [60 focused J6 tests pass, 62 full piper tests pass with one skip, 643 mobile functional tests pass, 106 Tesseract tests pass, five-package build passes, rootless core PASS, rootless compact PASS]
nbv_bridge_debug_crash_2026_08_20:
  state: physical_validation_pending
  task_id: gui-sim-6e0cbcd372594740a38c824a6301f43e
  symptom: Startup wrist and rough-acquisition planning succeeded, but approval timed out; shutdown then lacked the direct-home executor and returned NEEDS_OPERATOR with CONTROL_UNTRUSTWORTHY and zero captures.
  root_cause: Two new NBV receipt/provenance debug branches called TesseractPlanBridge.param_bool although that bridge did not define the adapter. Debug was enabled, so the first valid acquisition plan caused AttributeError, the critical-child launch policy stopped the whole scan stack, and command/home authority was genuinely unavailable.
  correction: Add the bridge-local shared boolean parameter adapter and a regression that caches and logs a valid voxel-NBV generation with debug enabled. Do not change acquisition, planning, safety, motion or shutdown thresholds.
  evidence: [34 focused bridge tests, 106 full Tesseract tests, 643 full mobile tests, 23 GUI tests, five-package build, command-free rootless core PASS, command-free rootless compact PASS]
  remaining: Run a supervised E2E from the physical requalification checklist; software tests cannot prove the live ROS critical-child sequence.
previous_generation_ownership_incident_2026_08_20:
  state: software_fixed_retest_pending
  symptom: GUI reported lost ownership because a previous mission generation still had live process groups.
  evidence_limit: Runtime directories and processes were absent during inspection, so the exact survivor names from that physical run could not be recovered; the failure string can only originate from ProcessSupervisor.begin_generation returning its own still-live handles.
  code_cause: MissionEngine could return early on unproved terminal home or disable without releasing non-command processing groups, and admission had no safe reconciliation branch.
  fix: Revoke authorization and release exact non-command groups on operator-recovery; on later admission clean exact prior handles only if driver is absent or fresh all-six-disabled feedback is proved.
  physical_action_during_fix: none
voxel_nbv_generation_race_2026_08_17:
  category: integration_and_view_selection
  symptom: GUI mission gui-sim-25a675652af94bada5674f130c967d4a captured two nearby views and then failed with planning blocked scan data is missing or stale.
  root_cause: The planner synchronously rebuilt/scored generation two for about 12 seconds. MissionEngine requested the next plan immediately after VIEW_COMPLETE, while bridge_node correctly rejected its greater-than-one-second generation-one snapshot. Candidate attempts were not durably labelled, and the bounded rank-prefix shortlist could omit other directional leaders when high-rank poses were infeasible.
  correction: Add session/count generation identity, post-barrier bridge receipt, no-motion bounded wait, explicit voxel_nbv_seed, direction-bin leader reservation, worker metadata propagation, plan provenance topic and exact frame-metadata correlation.
  status: Software tests/build pass; supervised physical retest pending. Do not describe the incident run as proof that voxel ranking itself matched legacy.
purpose: >-
  Durable, concise index of the material hardware, software, integration and
  operational problems encountered while building the PiPER target-scanning
  system. This ledger records the current disposition and routes maintainers
  to detailed evidence; it does not replace contracts, guardrails, runtime
  mission results or the technical-debt descriptions.
authority:
  architecture_and_history: docs/ai/00-index.yaml
  symptom_routing: docs/ai/05-admin.yaml
  runtime_contracts: docs/ai/30-contracts.yaml
  flow_and_smoke_evidence: docs/ai/40-flows.yaml
  safety_invariants: docs/ai/50-guardrails.yaml
  detailed_open_work: docs/ai/60-debt.yaml
  delivery_milestones: docs/ai/70-roadmap.yaml
  operator_procedure: OPERATOR_COMMANDS.md
  physical_evidence:
    durable_dataset_manifest: datasets/active_scan/<scan_id>/manifest.yaml
    ephemeral_runtime_result: /tmp/piper_target_scan_missions/results/<task_id>.json
status_definitions:
  resolved: Root cause corrected and relevant regression evidence exists.
  contained: Fail-closed handling exists, but the initiating physical or external cause remains open.
  physical_validation_pending: Software is implemented and command-free tests pass, but required physical acceptance is incomplete.
  open: Root cause or production solution remains incomplete.
  superseded: Historical attempt retained as evidence and forbidden as a rollback target.
recording_rule: >-
  Add or update an entry whenever a material bug, incident, unsafe behavior,
  integration failure or misleading diagnosis is found. Preserve the first
  observed symptom, root cause when known, corrective action, current status,
  evidence location and required retest. Never erase an incident because a
  later fix passed.

