latest_nbv_incidents_2026_08_17:
  - id: clean_second_scene_rebuild_consumed_candidate_budget
    symptom: Task gui-sim-a0e116ab38c146f1adcf3393a63ec482 accepted its ray-NBV seed capture, then generation one expired after 45 seconds before attempting candidate one.
    root_cause: The first request consumed the preloaded clean Robot quickly. The second request unconditionally rebuilt the native Robot inside the automatic candidate-planning clock even though the preceding request had added no obstacles; model setup consumed the complete budget.
    correction: Track whether a request successfully adds scene obstacles, reuse only demonstrably clean scenes, rebuild dirty scenes before reuse, and start the unchanged 45-second candidate budget after scene setup. The unchanged 180-second bridge timeout still bounds the complete transaction.
    evidence: [task gui-sim-a0e116ab38c146f1adcf3393a63ec482, scan_20260821_152812 seed capture accepted, generation one ray_nbv 174 directions, candidate_attempts zero, safe PRE_HOME ROUGH_HOME STORAGE_WRIST all-six disable and exact process cleanup]
  - id: tesseract_ready_before_first_robot_scene
    symptom: The 2026-08-20 scan_20260820_204529 locked the target but its seed request exhausted the 45-second automatic plan budget before starting candidate one.
    root_cause: Worker readiness proved Python/backend import only. The first Robot.from_files call occurred in reset_scene after the request deadline started, so native model initialization consumed the candidate budget.
    correction: Construct one clean unused Robot scene in TesseractBackend initialization before worker-ready is published. Reuse a scene only while it has received no request-local obstacles; rebuild every obstacle-dirty scene before reuse.
    evidence: [task gui-sim-7d34364727c9405eb5d16e9b32f48db4 pre-fix, scan_20260820_204529 removed as zero capture, candidate_attempts zero, task gui-sim-3eb814caa9204bfd884343f02a94323e post-fix seed view 412 and capture one, safe pre-home rough-home storage disable cleanup]
  - id: rejected_nbv_bypassed_existing_reacquisition_owner
    symptom: The 2026-08-20 scan_20260820_203704 committed a seed capture and executed true voxel_nbv generation one, but after strict final-aim rejection it failed with tracking LOST instead of requesting a replacement view.
    root_cause: MissionEngine inserted a generic 30-second stable-readiness wait before the next command-free plan request. That duplicated the request/approval adapter's bounded visual-reacquisition ownership and expired as autonomous heavy recovery became eligible.
    correction: Re-enter command-free view generation/request directly after accepted, rejected and target-drift outcomes. The request/approval adapter handles typed visual reacquisition, and unchanged approval gates remain mandatory before motion.
    evidence: [task gui-sim-96d1a39dff6e4603af626e043d392e06 pre-fix, scan_20260820_203704, seed capture committed with 58 voxels, generation-one selected view 164 predicted_unknown 898 novel_surface 50, strict rejection at 5.037 degrees, task gui-sim-3eb814caa9204bfd884343f02a94323e post-fix entered bounded command-free reacquisition and failed TARGET_NOT_FOUND only after its authority expired, safe pre-home rough-home storage disable cleanup]
  - id: endpoint_settle_window_below_powered_feedback_step
    symptom: Multiple runs, including the 2026-08-20 scan_20260820_185457 attempt, reached the first rough-acquisition endpoint inside 0.0011 rad of its command but timed out after 15 seconds without a continuous settle proof.
    root_cause: Powered J4 feedback alternated between two values 0.006227508 rad apart near zero. Both were inside the unchanged 0.025-rad endpoint tolerance, but the 0.005-rad anchor reset 395 times and its longest window was only 0.484 seconds.
    correction: Set only endpoint_position_settled_rad to 0.007 rad, narrowly above the measured discrete feedback step, and retain the 0.025-rad endpoint, all motion, home, collision and safety-authority checks. Add a regression that rejects motion at 0.0071 rad.
    evidence: [scan_20260820_185457 empty folder removed after safe shutdown, settle max_target_error 0.001067109 rad, anchor step 0.006227508 rad, resets 395, earlier same failure scans 20260820_175832 and 20260820_181130]
  - id: diagnostic_landmark_changed_semantic_scene_during_scan_motion
    symptom: The supervised scan beginning at scan_20260820_184910 acquired a stable target and started its first scan trajectory, then aborted at zero captures with invalid obstacle geometry.
    root_cause: During the already authorized moving segment, diagnostic target_landmark crossed its twelve-degree update threshold and sent a new_viewpoint heavy request. That non-settled image produced one unsafe unknown depth foreground object; live obstacle projection later became invalid and the runtime gate correctly stopped motion. The node documented as diagnostic was therefore changing production semantic and obstacle authority.
    correction: Keep the existing obstacle abort gate unchanged. In production gpu_geometry launch, set the target_landmark node's existing new-view and mask-disagreement refresh switches false; motion-gated SAM2 recovery and settled acquisition/workflow/capture requests remain authoritative.
    evidence: [task gui-sim-3fc3c4e3d3f04948bb45d9879afa7f0e, executor MOVING at 1787248219.666, heavy request landmark_1787248223038 reason new_viewpoint image stamp 1787248222.950, heavy result obstacle_count 1 label unknown depth foreground, runtime abort at 1787248226.690, zero-capture dataset removed, safe staged home and disable proved]
  - id: capture_refresh_busy_misclassified_as_worker_failure
    symptom: The supervised scan_20260820_183948 reached and settled at its first voxel-NBV view, but transient visual capture recovery aborted immediately with heavy worker is busy.
    root_cause: The heavy-refresh bridge enforced one worker job at a time but discarded a correlated request received while busy. Executor-side idle/republish handling did not reliably observe the brief idle transition after an autonomous SAM2 job, so the held capture timed out without its requested refresh.
    correction: Retain the one correlated pending request in heavy_refresh_bridge_node.py, report waiting_for_worker, and enqueue it exactly once when the worker is idle and a qualifying fresh frame exists. Keep the executor stationary and bounded by the unchanged capture timeout; do not add a second perception job or retry layer.
    evidence: [scan_20260820_183948, first seed capture accepted, first voxel-NBV id 162 reached and settled, safe PRE_HOME to ROUGH_HOME to STORAGE_WRIST shutdown completed]
  - id: physical_nbv_collapsed_to_same_azimuth_after_ik_failures
    symptom: The 2026-08-20 supervised scan accepted three voxel_nbv captures but achieved only 2.63 degrees azimuth span while changing elevation by 29.71 degrees; the fourth settled capture refresh then aborted on transient invalid obstacle geometry.
    root_cause: Replay proved the highest-ranked candidates were 30-52 degrees from accepted coverage, but most were steep elevations that Tesseract rejected. The shortlist reserved its remaining slots for globally nearest-camera fallbacks, so feasibility collapsed to the current azimuth. During the stationary one-refresh hold, the global runtime gate also treated the refresh's transient obstacle rebuild as if a new motion were being commanded.
    correction: Keep the information-ranked direction leaders but use reserved fallback slots for comfortable elevation/radius alternatives in those same lateral sectors. Persist typed per-candidate Tesseract failure evidence. Treat WAITING_FOR_CAPTURE_REFRESH as a stationary capture hold using its approval-time scene, while preserving fresh valid obstacle gating before every later plan approval or motion.
    evidence: [scan_20260820_181639, accepted views 3, azimuth span 2.6279 degrees, elevation span 29.7106 degrees, software replay shows generation-one top candidates up to 51.8 degrees novel direction, 663 mobile tests pass, 114 Tesseract tests pass]
  - id: heuristic_selector_repeated_same_sector
    symptom: Accepted captures could cluster around one orbit sector even though the system was described as NBV.
    root_cause: Measured surface evidence was used mainly for completion while staged geometric feature scores and local fallback ordering selected the next view.
    correction: Added a schema-2 voxel evidence model and information-first unique-direction ranking. The operator selected authoritative voxel_nbv on 2026-08-17 for the next supervised E2E; physical qualification remains pending.
  - id: settled_capture_status_delivery_race
    symptom: A safely reached and settling/settled view could receive executor-is-not-at-an-accepted-settled-capture and abort as insufficient quality.
    root_cause: The capture service observed its asynchronous execution-status cache before the accepted settled update and the legacy adapter did not classify that exact state rejection as readiness.
    correction: Missing, wrong-mode and not-yet-accepted-settled status now take the existing bounded same-view readiness retry while preserving the existing Trigger response wording.
  - id: occlusion_status_callback_starved_by_rgbd_load
    symptom: The 2026-08-21 supervised mission accepted its first view, reached the second NBV, then exhausted ten same-pose retries with occlusion evidence is stale.
    root_cause: The occlusion checker continued publishing fresh CLEAR evidence roughly every 0.4 seconds, but scan_capture's single-threaded executor serviced high-rate RGB-D entities ahead of its final low-rate occlusion subscription. Scan quality arrived while the local occlusion receipt timestamp stopped advancing.
    correction: Give scan-quality and occlusion subscriptions one dedicated mutually-exclusive callback group and spin the command-free recorder with a two-thread executor. Preserve the one-second freshness threshold and all capture rules.
    evidence: [task codex-e2e-20260821-1811-shortlistfix, scan_20260821_181024, vision.log CLEAR publications 1787332296.529 through 1787332300.137, scan_stack capture rejection at 1787332300.369, safe staged home disable and owned-child cleanup]
