missing_complete_ray_decision_audit_2026_08_25:
  state: open
  software_disposition: Behavior is implemented and functional suites pass, but changed-file lint and the first current physical mission artifact remain pending.
  symptom: Existing per-capture metadata could explain the chosen plan, but it did not preserve one complete event-time record of every generated frozen ray, planner/history/information elimination, workspace/capability result, bridge shortlist, worker attempt, selected endpoint, accepted capture, target-model update and terminal result. Operators therefore could not reliably answer why a ray disappeared or distinguish a deferred ray from an eliminated one across the complete mission.
  root_cause: Evidence was distributed across transient private ROS JSON, bridge/worker logs and accepted-frame metadata. There was no mission-grouped source of truth, exact coverage-generation artifact or event-time viewer model.
  correction: ray_mission_diagnostics.py now atomically merges a schema-v2 append-only event journal under the mission task identity, retains schema-v1 loading without invented history, persists exact compressed CoverageSnapshot generations, renders compatibility HTML and feeds one reusable ROS-free PyQt5/VTK Ray Review process. Planner, filter, bridge, capture and terminal adapters add only evidence and catch diagnostic failures without changing runtime output.
