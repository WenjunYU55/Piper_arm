  root_cause: depth_to_3d_node treated a missing or stale mask as permission to use rectangular detection-ROI depth; flat background therefore appeared more confident than the semantic target. The tracker then used confidence-scaled noise plus a loose Euclidean jump allowance and had no prediction-only correction path.
  correction: Target3D now requires a fresh correlated nonempty mask; the existing base_link tracker predicts without correction on invalid input and applies a Mahalanobis gate to valid measurements under a near-static model.
