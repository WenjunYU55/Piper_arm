  symptom: A final-state-only viewer could leak later ranks or culls while scrubbing earlier events, label unshortlisted rays as rejected, silently resurrect a previously culled ray after source reevaluation, or make schema-v1 historical data appear complete.
  root_cause: Snapshot state, event-time state, deferred shortlist membership, source-revision reevaluation and incomplete historical provenance are distinct concepts; collapsing them into one current ray record creates false explanations.
  correction: The reviewer reconstructs state only through the selected append-only event, uses deferred_shortlist for unattempted rays, records returned rays as reevaluated with their prior reason, leaves unranked rays visible, preserves terminal event ordering and marks schema-v1 or incomplete historical populations partial.
  evidence: [test_event_scrubbing_never_leaks_a_later_rank, test_unranked_generation_rays_remain_visible_without_rank_filter, test_cycle_blocks_preserve_late_terminal_journal_order, test_historical_cull_return_is_labelled_as_reevaluated, test_unshortlisted_rays_are_deferred_not_falsely_culled, test_v1_loading_is_truthfully_partial]
  remaining: Retain these regressions whenever the journal schema, viewer filters, shortlist terminology or historical replay changes.
