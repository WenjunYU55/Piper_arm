static_ray_eliminations_reentered_upstream_ranking_2026_08_25:
  state: software_fixed_validation_in_progress
  software_disposition: Static ledgers now survive the generation-zero envelope upgrade because identity contains only stable directions; endpoint-static exhaustive ray IK is bridge-classified while path-dependent failures remain retryable.
  symptom: The bridge already prevented reattempt of worker-proven session-static endpoint failures, but the planner still regenerated and ranked those rays after accepted captures. Workspace and capability-map rejections were also recalculated downstream for each generation, so permanently eliminated rays repeatedly consumed upstream scoring and remained difficult to distinguish from generation-contextual failures.
  root_cause: Permanent evidence lived only inside its downstream owner. The planner had no population-bound, revision-bound feedback contract that could safely remove static failures before accepted-history filtering and NBV ranking.
  correction: ray_hard_culls.py defines one canonical stable-direction-universe SHA-256 identity and complete snapshots from exactly two sources. The reachability filter publishes cumulative workspace/capability rejections; the bridge publishes worker permanent IDs plus typed exhaustive RAY_IK_FAILURE intersected with the exact request. The planner accepts matching reliable transient-local snapshots, keeps one revision-bound ledger per source and prunes matching IDs before accepted-neighbour retirement and later ranking.
  evidence: [tests/planning/test_ray_hard_culls.py, test_viewpoint_feedback_freshness.py, test_bridge_feedback_freshness.py, test_scan_session_memory.py, 51 current focused ray capability diagnostic hard-cull and GUI tests pass, 782 complete mobile tests pass, 158 complete Tesseract tests pass, two-package build passes]
  remaining: Clean changed-file lint, rerun registered mobile colcon tests and inspect a command-free live-shaped two-publisher trace before any physical claim.
  rollback_warning: Never promote collision path visibility timeout transport error generic TESSERACT_EXHAUSTED partial solve or human-readable reason matching into a permanent upstream cull. Typed RAY_IK_FAILURE is allowed only after complete configured endpoint-search exhaustion. Accepted captures alone update coverage and retire their 15-degree neighbourhood; survivors retain ordinary NBV ordering.
target_range_clipped_ray_and_unbounded_capability_search_2026_08_25:
  state: open
  software_disposition: The correction is implemented and current focused, complete functional, build and registered functional tests pass. Changed-file lint, one command-free live-shaped trace and later physical qualification remain pending.
  symptom: A target at 0.20 or 0.40 m from base_link caused its target-to-camera ray maximum to collapse to 0.28 or 0.40 m even though the configured request allowed 0.80 m. Separately, capability prequalification answered only whether any sampled standoff was supported, so one occupied region allowed the broader surviving interval to reach continuous IK without preserving which standoffs the atlas actually supported.
  root_cause: bounded_ray_interval conflated the target center's base_link radius with target-to-camera standoff. CapabilityMap._query_indices flattened the source-point axis and returned one aggregate boolean, discarding per-standoff support before the filter and bridge handoff.
  correction: bounded_ray_interval now validates the target but always returns the configured target-relative request. CapabilityQuery retains sample_support and supported_intervals_m; intersects_ray derives ordered contiguous runs; enforce-mode capability_bound_ray preserves requested bounds, narrows active min/max to the outer supported envelope, moves the representative point into a supported run and carries run evidence through diagnostics and the bridge. bind_shortlisted_ray_intervals selects its seed from a supported run. The existing coarse workspace owner and exact Tesseract/executor gates remain authoritative.
  evidence: [test_ray_interval_is_target_relative_and_uses_configured_scan_cap, test_pose_and_ray_lookup_use_sparse_occupied_cells_not_solid_volume, test_ray_lookup_preserves_disjoint_supported_standoff_runs, test_capability_bounds_replace_active_interval_and_preserve_request, test_prequalification_scrub_preserves_requested_and_supported_bounds, 51 focused tests pass, 782 complete mobile tests pass, 158 complete Tesseract tests pass, 80 complete GUI tests pass, two-package build passes, all 33 registered mobile functional targets pass, Tesseract registered suite passes]
  remaining: [clean seven changed-file flake8 and eight changed-file pep257 findings, rerun registered tests, inspect one command-free live-shaped payload and report proving requested bounds supported runs active envelope seed and selected endpoint, require separate explicit authorization for physical qualification]
  rollback_warning: Never restore target-base-range clipping, collapse requested and active bounds into one meaning, claim support inside a gap between recorded runs or treat a capability bin/envelope as exact IK, collision, path, aim or visibility proof.
ray_review_temporal_truthfulness_edge_cases_2026_08_25:
