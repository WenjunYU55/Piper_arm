tesseract_stream_timer_starved_by_single_executor_queue_2026_08_27:
  state: physical_acquisition_stream_passed_multiview_timing_pending
  task: gui-sim-d23434471b1c4640bac2829abe39390d
  symptom: The ordered collision-qualified stream retained low following error but accumulated 777 late timer events. Planned 12.0, 22.5 and 4.5 second segments consumed about 58.0, 89.7 and 17.4 wall seconds, only 4.1 to 5.2 Hz. Completion logs incorrectly reported near-plan time because schedule pauses were subtracted.
  root_cause: scan_viewpoint_executor used the normal single-threaded rclpy executor for its 200 Hz state-machine timer and every feedback, tracking, target, obstacle, workflow and plan callback. Post-lock traffic starved the timer, and one synchronous warning per late point amplified queue pressure. This was host callback scheduling, not invalid Tesseract timestamps, PiPER following or general CPU exhaustion.
  correction: The initial three-worker timer-plus-control grouping fixed stream timing but later starved approval and hold under the full graph. The integrated correction uses four scheduler groups for timer state-control telemetry and client responses, plus one explicit timer/control lock and TelemetryStore. Preserve next-unsent stretch behavior, bounded aggregate warnings and true wall duration.
  evidence: [new regressions failed before and pass after, 244 focused tests, 869 mobile tests, 163 Tesseract tests, mobile symlink build and clean proposal-only SIGINT, proposal-only 7480-message stress retained 200.6 Hz control ticks and no command publisher]
  physical_retest: Task gui-sim-9a5b86a861c44103aa8086b9f7092949 delivered 90 acquisition points in 4.505 seconds at 19.8 Hz with zero late ticks, 0.0580-second maximum interval and 0.1471-rad maximum following error. A later independent OCCLUSION_NOT_CLEARED ended the zero-capture mission; staged home, all-six disable and cleanup passed with safe_shutdown true.
  remaining: [inspect the reordered capture-one occlusion barrier and callback-isolated multiview timing under post-capture traffic, retain 1/10-percent and deliberate cancel-to-hold qualification]
  rollback_warning: Never repair timing by dropping or bursting points, weakening freshness or following gates, increasing limits, bypassing authorization, or enabling motion by default.
capture_one_model_seed_expired_before_qualified_generation_2026_08_26:
  state: fixed_and_physical_generation_one_retest_passed
  task: codex-e2e-qualified-rays-20260826-2331
  symptom: Startup wrist rough acquisition first-ray Tesseract motion and capture one succeeded, but the qualified planner repeatedly published ready false candidates zero and timed out after 185 seconds with retryable NO_REACHABLE_PLAN.
  root_cause: The executor promoted the post-settle framing silhouette stamped 1787783660.558 as model geometry before the recorder completed capture one. The planner later queried TF at that old camera stamp. At terminal diagnosis the earliest retained transform was 1787783844.354. The accepted frame instead contained a newer exact mask at 1787783668.446 and recorded base-from-camera at 1787783668.413, but neither was the model-seed authority.
  correction: Reconstruct the qualified shape from capture one's exact persisted mask and confidence-qualified target depth, hash-bind it to the synchronized recorded matrix, return it from scan capture, validate it before workflow acceptance, promote it atomically in history and build the envelope from that matrix without live TF.
  evidence: [safe pre-home rough-home storage-wrist all-axis disable exact child cleanup and coordinator exit, 264 focused tests, 848 mobile tests, 162 Tesseract tests, clean changed-file lint, archived capture replay creates thirteen valid collision boxes without TF, five-percent task codex-e2e-model-seed-20260827-0123 persisted a synchronized model seed generated 353 qualified generation-one rays accepted three captures and safely cancelled]
  remaining: [automatic full-mission completion was not claimed because the operator cancelled after three captures, investigate repeated motion stream tick-lateness warnings]
revolution_update_reset_ray_frontier_and_oversized_nbv_volume_2026_08_26:
  state: superseded_by_explicit_bootstrap_to_qualified_population_boundary
  symptom: A roughly 4 cm target rendered a roughly 33.75 cm grey NBV sphere. After accepted capture one qualified the revolution, envelope-adjusted standoff fields changed the population SHA, reset 313 permanent prequalification culls and allowed previously eliminated directions to re-enter. A strict 10-degree comparison on a 360-direction Fibonacci sphere usually retired only the exact selected ray.
  root_cause: The grey volume used twice the 95th-percentile distance from accepted depth points to a different frozen planning centre plus padding. Population identity incorrectly included mutable representative positions and standoff bounds. Direction retirement mixed accepted and rejected history and used a threshold smaller than typical sample spacing.
  correction: Use the revolution axis origin and largest raw visible span for grey sphere centre and diameter. Hash stable ray ID order and normalized direction plus centre and frame. The later centre-split repair made the envelope update an explicit bootstrap-to-qualified population replacement. Discard bootstrap culls, then preserve qualified source ledgers, prune them before ranking, retire only accepted directions at an inclusive configured 15 degrees and bridge-classify typed exhaustive RAY_IK failure as endpoint-static.
  evidence: [latest artifact replays to 0.03988083 m grey diameter instead of 0.3375 m, offline-cube-qualified-centre-replay-20260826 records distinct bootstrap and qualified population SHA values and one stable SHA after qualification, qualified ray and grey centres match, repeated-new-cull count is zero, same-population culled-to-active count is zero]
  remaining: [separately authorized physical repeat]
  rollback_warning: Never hash envelope-varying standoff geometry into ray identity, never use rejected history for accepted-neighbour retirement and never infer endpoint permanence from text.
