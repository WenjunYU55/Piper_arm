sam2_prediction_feedback_drift_2026_08_23:
  state: software_fixed_physical_replay_pending
  symptom: A propagated target mask could gradually expand from roughly 5000 to 17000 pixels and move masked depth toward a background layer while the stationary cube appeared to move in base_link.
  root_cause: The live worker reset every eight frames by turning its latest propagated prediction into a new conditioning mask. Motion-compensated projected masks could also become conditioning seeds, and otherwise valid target measurements could correct the base_link filter while the eye-in-hand camera was moving.
  correction: The heavy semantic seed remains the conditioning authority; predictor state is compacted to the trusted conditioning frame plus recent non-conditioning memory; projected masks have no seed authority; fresh moving or unsettled camera health forces prediction-only correction; moving masks cannot complete recovery; and heavy target reseeding requires the existing successful semantic result plus its permissive correlated aligned-depth check.
  permissive_boundary: No hard area, IoU, colour, known-size or appearance check was added. Existing depth support remains 25 pixels and 5 percent, existing settle is 0.5 seconds, existing innovation threshold is 5.0 and existing prediction timeout is five seconds.
  software_evidence: [7 isolated SAM2 worker tests pass, 73 focused ROS tracking and heavy-refresh tests pass, 745 piper_mobile_manipulation tests pass, piper_msgs and piper_mobile_manipulation build pass, 80-frame real CUDA replay retained eight frames with zero prediction promotion across old reset boundaries]
