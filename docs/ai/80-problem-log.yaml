off_axis_rough_lock_false_crop_failure_2026_08_26:
  state: software_fixed_physical_retest_pending
  symptom: A small target produced a roughly 109-by-73-pixel mask at about 0.263 m but touched the lower-left/bottom image border. Rough acquisition declared ACQUIRED as soon as measured tracking locked, and multiview readiness treated the crop as too-large-or-close before the optical axis had been re-aimed from the rough floor-level hint to the measured elevated target.
  root_cause: Tracking lock, target-facing framing and silhouette-size qualification were collapsed into one handoff. ACQUIRED correctly proved the tracker but did not prove the mask was centered, while the planner's exact-stamp crop rejection had no mission-phase evidence distinguishing the rough off-axis view.
  correction: MissionEngine no longer classifies at ACQUIRED. The first selected scan ray is reached before the executor requires fresh shape and <=5-degree aim. Middle-band crops reject without capture and retry the same ray farther; no farther aimed endpoint is too close and cropped-at-0.800 m is too large.
  evidence: [163 focused tests pass, 835 complete mobile tests pass, 161 complete Tesseract tests pass, mobile package build passes, prior physical run safely exposed the off-axis phase error]
  remaining: [command-free live-camera classification cases, separately authorized five-percent physical E2E repeat]
  rollback_warning: Never make a crop result authoritative from rough ACQUIRED alone, never revolve a clipped contour, and never bypass collision or 0.250 m clearance to obtain a better view.
