schema_version: 1
date: '2026-09-07'
title: Movement-window evidence recording by default, offline reconstruction later
owner_module: piper_mobile_manipulation/mission_archive.py
reference: docs/architecture/reconstruction_recording.md
previous_behavior: Quality-filtered reconstruction recorder was opt-in and began only after accepted capture zero; no whole-scan archive started automatically.
reason: Retain every scan's available sensor evidence alongside unchanged stationary mission captures so filtering and reconstruction can be repeated offline.
allowed_edit_paths:
- piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/mission_archive.py
- piper_ros_foxy/src/piper_mobile_manipulation/config/reconstruction_recording_params.yaml
- piper_ros_foxy/src/piper_mobile_manipulation/launch/supervised_viewpoint_execution.launch.py
- piper_ros_foxy/src/piper_mobile_manipulation/CMakeLists.txt
- piper_ros_foxy/src/piper_mobile_manipulation/package.xml
- tools/bundlesdf/replay_bag.sh
- tests/reconstruction/test_mission_archive.py
must_not_move_without: [scan_capture_node.py, reconstruction_recorder_node.py, mission lifecycle owner]
architecture:
  - Non-critical ExecuteProcess starts the separate rosbag supervisor at scan-stack startup.
  - Camera RGB aligned depth CameraInfo SAM2 masks TF raw accepted-view tuples and mission history/status are allowlisted.
  - Sensor subscriptions are best-effort depth 8; tf_static is reliable transient-local depth 100.
  - Disk writes occur only in the external recorder process, using native Foxy-compatible SQLite; legacy archives have 1 GiB splits.
  - Foxy write cache is zero because its eight-message cache lost an unflushed final partial batch in actual testing.
  - Preserve config snapshots, task ID and actual frozen angle; replay inherits them unless explicitly overridden.
  - Existing native quality-filtered recorder stays at 8 Hz after accepted capture zero; capture pins remain enabled for archive-only mode.
  - Native and bag output failures never become launch-critical or change robot command authority.
parameters:
  reconstruction_recording_enabled: true
  mission_archive_enabled: true
  mission_archive_minimum_free_bytes: 2147483648
  mission_archive_output_root: PIPER_ARM_ROOT/datasets/mission_recordings
lifecycle:
  - UUID inprogress directory is never reused or overwritten.
  - SIGINT/SIGTERM is forwarded to the owned rosbag group, with eight-second graceful wait.
  - Foxy ros2cli handles KeyboardInterrupt with exit code 2; this is accepted only for requested shutdown and existing metadata.
  - SQLite row counts must equal declared metadata counts before the archive is labelled closed.
  - Closed means archive closure only, never mission success; cancelled/failed outcomes remain in recorded events.
  - Low disk or recorder error retains incomplete data. SIGKILL may leave an inspectable inprogress directory.
  - Transport drop count is explicitly unknown on Foxy; never report invented zero drops.
manual_smoke_checks:
  - Launch-description checks for all four archive/native flag combinations; raw pins on if either is enabled.
  - Record actual synthetic public ROS topics and close via SIGINT; compare SQLite rows with metadata.
  - Replay archive on isolated domain, requiring recorder startup and at least one accepted frame.
  - Confirm final accepted capture and terminal event survive playback; validate and convert resulting session.
  - Confirm zero motion/enable/command topics in archive allowlist.
must_retest_if_changed: [archive lifecycle and SQLite mismatch tests, recorder and GUI tests, package build and tests, actual rosbag capture/playback, native validation/conversion]
remaining:
  - Real camera throughput, disk contention and physical arm/camera timing remain unqualified.
  - Best-effort recording can lose frames; retained data does not guarantee every scan is reconstructable.
  - GUI archive Reconstruct now uses dense temporal segmentation; see 91-dense-offline-video.yaml. Legacy callback import remains diagnostic.
evidence:
  report: docs/experiments/automatic_scan_recording_validation.md
  tests: 238 passed; package build passed; 48 of 50 CTest checks passed with unchanged 99 flake8 and 10 pep257 findings.
  nominal: 29 recorded messages equal 29 SQLite rows; replay yields one complete six-frame two-mission-capture session with zero native rejects or writer drops.
  converter: All six converted frames loaded by pinned upstream reader; no new GPU mesh run for this recording-only change.
  hardware: Synthetic ROS publishers only; no physical qualification claimed.
saved_camera_recovery_followup:
  reference: docs/experiments/saved_camera_bundlesdf_recovery.md
  archive: datasets/mission_recordings/scan_recording_f62ed65bbeb4459cb35a9b36e64869f9.closed
  task_id: gui-sim-f5956c842de64128b5f97592c3c179c6
  recorded_messages: 97547
  mission: Three accepted captures followed by recorded operator cancellation; do not label the recovered session complete.
  replay_failure: Foxy recorded empty offered QoS for late mission-history publisher; volatile playback could not reach transient-local history subscriber. Explicit playback QoS restores history, but a best-effort large first keyframe was still lost in observed DDS playback.
  recovery: tools/bundlesdf/import_bag.py reads SQLite in recorded order and invokes real recorder callbacks, synchronizer, TF listener, admission gates and writer. Offline feeder waits for bounded queue capacity. It publishes no command topics and does not require replay DDS transport.
  acceptance: One incomplete session, 141 accepted raw frames including all three stationary captures, zero writer/backpressure drops in the retained recovery.
  rejected_by_reason: {rgb_depth_unsynchronised: 3, sample_rate_throttled: 39, stale_mask: 32, unmatched_sensor_frame: 2335}
  distinction: The bag came from the existing camera mission. Callback import and GPU reconstruction are offline tests, not a new physical-system validation. Best-effort live native keyframe delivery is not guaranteed; use archive recovery when needed.
  gui_origin: A saved result with this importer's recovery.json is labelled Recorded ROS RGB-D session - offline reconstruction. Synthetic evidence takes precedence; absent provenance remains unverified. No claim of physical accuracy is inferred.
  completed_gpu_evidence:
    reference: docs/experiments/saved_camera_bundlesdf_recovery.md
    output: /home/prl/.local/share/piper-bundlesdf/evidence/2026-09-07-real-scan-142623-headless
    result: Exit zero; 14730 vertices, 19475 faces, 141 rigid estimated poses, 43211 nonzero texture pixels. Actual viewer opened through GUI helper.
    quality: Structural success only. Visual quality fails due to spurious surrounding surfaces and dark/untextured regions; accuracy unqualified. Retain the original mesh and previews without cosmetic removal.
    checks: 248 focused recorder/replay/converter/GUI tests passed; package build passed; 48 of 50 package checks passed with unchanged 99 flake8 and 10 pep257 findings.

offline_distortion_followup_2026_09_07:
  reference: docs/ai/89-offline-distortion.yaml
  summary: Offline-only shared calibrated remap, post-remap depth support check, explicit calibration provenance and read-only pixel/plane diagnostics; motion and capture policy unchanged.

bundlesdf_full_video_workflow_audit_2026_09_07:
  reference: docs/experiments/bundlesdf_upstream_workflow_audit.md
  historical_finding: At audit time offline mask propagation was missing. The dense path is now implemented in 91-dense-offline-video.yaml; saved pose count still is not successful-track count.

dense_offline_video_2026_09_07:
  reference: docs/ai/91-dense-offline-video.yaml
  routing: Default GUI archive reconstruction recovers synchronized movement-window RGB-D plus accepted pins and propagates SAM2 masks offline before quality admission; live mission and capture policy is unchanged.

aligned_depth_admission_correction:
  reference: docs/ai/92-aligned-depth-framesets.yaml
  behavior: Exact frameset stamps are required by reconstruction admission, native validation and legacy archive extraction. Approximate synchronizer candidates can still be delivered to count rejection; they cannot be saved. Recorded synchronization_slop_sec remains compatibility/provenance, not permission to bypass the exact frameset gate.

movement_window_recording_2026_09_09:
  owner_module: piper_mobile_manipulation/movement_bag_recorder.py
  helpers: piper_mobile_manipulation/movement_recording.py
  allowed_edit_paths: [movement_bag_recorder.py, movement_recording.py, mission_archive.py, tools/bundlesdf/extract_video.py, tests/reconstruction, docs/ai]
  live: A separate command-free recorder buffers at most one second and 128 MiB of idle RGB/depth/mask messages. MOVING flushes pre-roll once; the first following non-MOVING status starts one second of post-roll. Repeated or overlapping moves do not duplicate messages. All calibration, transforms, mission events and accepted keyframe pins remain recorded.
  storage: Native Foxy-compatible SQLite/CDR bag with version-4 metadata; isolated single-thread subscribers write bounded 0.2-second transactions. Parent retains disk reserve, SIGINT closure, row-count verification and incomplete marking. No extra rosbag2_py dependency.
  offline: Extraction is read-only; explicitly requested destructive offline compaction uses tools/bundlesdf/compact_recordings.py. BundleSDF extraction selects the same one-second pre/post movement intervals using recorded message times and retains accepted pins. Legacy bags without execution status use explicitly labelled full-sequence fallback.
  bundle_input: One monotonically ordered frame sequence beginning at the existing accepted mask seed; original RGB/depth timestamps, exact frameset matching, camera calibration, TF and distortion correction remain unchanged. Idle gaps are omitted without fabricating new source timestamps.
  scope: Saved RGB-D only; capture counts, NBV, motion, safety and planner budgets are unchanged. Pre-roll overflow is reported; transport drops remain unknown, not zero.
  required_retests: [window overlap and buffer limits, archive lifecycle, serialized ROS recording and playback, dense extraction and conversion, reconstruction and GUI suites, package build]
  validation_result: 1321 reconstruction/mobile/GUI tests passed with one skip; three focused serialized-extraction/window tests passed after the final regression addition. Actual isolated-domain recorder retained 79 frames spanning seconds 2 through 6 for movement at seconds 3 through 5; native ros2 bag playback delivered all 79 frames. Package built; no physical motion or new GPU mesh claimed.

offline_movement_compaction_2026_09_09:
  owner_module: tools/bundlesdf/compact_recordings.py
  allowed_edit_paths: [tools/bundlesdf/compact_recordings.py, tools/bundlesdf/extract_video.py, tests/reconstruction/test_compact_recordings.py, docs/ai, docs/architecture]
  authority: Explicit user-requested deletion of idle footage; CLI is plan-only unless --apply is supplied.
  selection: Recorded MOVING intervals with one-second shoulders; global exact RGB/depth header-stamp intersection across splits. A partner arriving outside the shoulder is retained. Unpaired selected images are counted and omitted, never approximately paired. Accepted keyframe tuples and every non-image topic remain byte-identical.
  mutation: Only closed or incomplete archives with metadata and MOVING evidence; refuse live/open databases and nonempty pending journals. Copy smallest retained segment first, verify every retained row with SHA256 and SQLite quick_check, fsync then atomically replace original. Idle payloads are actually deleted without a second full archive copy.
  recovery: Durable movement_compaction.json retains selected row IDs, original metadata and progress. Resume the same --apply invocation after interruption. Dense extraction refuses an unfinished compaction. Completion rebuilds bag metadata and manifest counts, preserving original closure and mission outcome.
  must_retest_if_changed: [serialized split-bag compaction, cross-boundary exact pairing, evidence preservation, interruption resume, metadata counts, dense extraction, native bag readability]
  limitations: Archives without movement evidence remain untouched. Missing recorded partners cannot be recovered. Compaction preserves original timestamps and geometry; no fabricated continuous capture clock.

executed_offline_compaction_2026_09_09:
  report: docs/experiments/movement_recording_compaction_20260909.md
  result: 27 archives compacted; 207.69 GiB permanently reclaimed; all retained payloads verified before replacement and all resulting timestamp sets/counts verified afterward.
  untouched: Five archives without execution events and one unfinished archive without metadata.
  validation: Nine focused tests passed; native bag metadata readable; real dense extraction produced 330 ordered exact RGB-D pairs. No physical execution or new GPU geometry qualification.
