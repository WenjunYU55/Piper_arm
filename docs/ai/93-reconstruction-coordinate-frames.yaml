schema_version: 1
date: '2026-09-08'
title: Explicit robot-base orientation for all offline reconstruction outputs
owner_module: reconstruction/coordinate_frames.py
allowed_edit_paths:
  - reconstruction/coordinate_frames.py
  - reconstruction/tsdf_reconstruct.py
  - reconstruction/view_reconstruction.py
  - reconstruction/view_bundlesdf.py
  - reconstruction/gui_support.py
  - tools/bundlesdf/dataset.py
  - tools/bundlesdf/run.py
  - piper_gui/bundlesdf_results.py
  - tests/reconstruction/test_coordinate_frames.py
must_not_move_without: [immutable capture provenance, native BundleSDF object-frame outputs, matching image IDs and pose direction, texture sibling references, reconstruction quality classification]
load_order_contracts:
  - Shared coordinate helpers require NumPy only for normal use; legacy capture-report resolution imports YAML lazily. No ROS or GPU imports.
  - Each standalone viewer imports the sibling helper in its existing isolated interpreter.
  - BundleSDF wrapper invokes the helper in system Python after native result validation; no reconstruction is run by the helper.
contracts:
  geometry_frame: base_link, right handed, metres; +Z is robot-base up, not independently measured gravity.
  capture_outputs: Existing raw/cleaned TSDF, registration/input/measured clouds, constrained superposition/consensus and textured geometry already share the recorded base frame. Geometry is not rotated or refitted.
  capture_export: Quality reports now carry coordinate_frame and frame_inputs.base_frame; every geometry variant gets a sibling <filename>.frame.json containing geometry SHA-256, units and axes. Missing or non-base parent identity is explicitly unverified, without promoting quality or changing fusion.
  bundlesdf_input: Converted robot_camera_poses.json retains base_frame as well as exact converted filename, native index, image stamp and T_base_camera. These poses are still not fed to upstream tracking.
  bundlesdf_export: Native result/textured_mesh.obj and estimated poses remain unchanged. A separate base_link directory receives a rigidly transformed OBJ and original referenced materials/textures after success. Failure to establish orientation writes orientation_unavailable.json and retains the native result.
  bundlesdf_transform: T_base_object = T_base_camera[00000000.png] @ T_camera_object[00000000.txt]. Requires the supported pinned upstream gauge, unique same-image correspondence, explicit base_link identity and finite right-handed rigid transforms. No later-pose averaging, PCA, object-face fitting, scaling or reflection.
  legacy_bundle: If the converted sidecar lacks base_frame, resolve its validation input or retained native-session.incomplete and require matching first-image stamp/transform and explicit base_link parent; otherwise orientation is unverified.
  legacy_capture: Reports without coordinate_frame resolve the original capture metadata parent frame; absent evidence cannot be guessed from shape.
  portability: OBJ/PLY do not enforce a third-party viewer's up convention. Export frame sidecars and README travel with assets; configure external viewers for Z-up. Original material filenames are retained.
viewer_behavior:
  - Known base-frame results open from the robot side with +Z up in both viewers and every mesh/cloud mode.
  - Red/green/blue arrows show parallel base X/Y/Z near the model, offset for visibility; their display origin is not the physical base origin.
  - Magenta points toward base origin in XY; directly above the base axis that direction is undefined and no arrow is drawn.
  - Titles explain axes and robot direction. Unresolvable native results open with ORIENTATION UNVERIFIED and no base-frame cues.
  - Saved base-link OBJ sidecars are hash-checked and never transformed twice. GUI prefers the separate oriented export when available.
manual_smoke_checks:
  - Export retained corrected BundleSDF to a fresh directory; verify source hashes, face/UV/texture preservation and rigid distance invariance.
  - Open original and base-link exported OBJ through native viewer; verify +Z-up camera, coloured axes and magenta robot direction; close and reopen.
  - Open retained capture report as cleaned, measured, superposition, consensus and textured; all share base axes and robot-side opening view.
  - Export retained capture report to a new directory; verify byte-identical geometry/materials and per-file frame sidecars.
  - Missing poses, wrong frame IDs, unsupported upstream revision or mismatched sidecar must not claim base_link orientation.
must_retest_if_changed:
  - coordinate-frame unit tests with noncommuting transforms, reflections, missing/duplicate correspondence and source preservation
  - complete reconstruction and GUI tests
  - actual isolated native and Open3D viewer launch/close and native mesh loading
  - conversion regression and pinned upstream input loader
  - changed-file lint, Python compile, YAML parsing and whitespace checks
scope: Offline export and display only. No camera, robot, planner, pose-refinement, depth-calibration, quality-gate or source-capture changes; no existing evidence ZIP rewrite.
