      J6-only progress/settle and command-boundary refresh semantics are now
      cleanly restored in the current branch after the August 16 E2E regression.
    authority: [piper_ctrl_single_node.py, scan_viewpoint_executor_node.py]

  - id: guarded_zero_capture_dataset_deletion
    status: [ACTIVE, SOFTWARE_REQUALIFIED]
    summary: >-
      Failed missions with zero accepted captures removed only their exact
      identity-bound incomplete dataset after the writer stopped; historical
