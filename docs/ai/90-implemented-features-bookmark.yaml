  software_evidence: [669 mobile functional tests pass, 115 Tesseract tests pass, affected ROS packages build, rootless Tesseract core and compact qualifications pass, AI YAML parsing passes]
  physical_evidence: [seed capture committed, true voxel_nbv generation one selected view 164 with predicted_unknown 898 and novel_surface 50, strict 5.037-degree final-aim rejection preserved safety, command-free post-view reacquisition route exercised, every terminal run proved staged home storage disable and exact child cleanup]
  remaining: Complete diverse scan is not yet qualified because the live target lock becomes unstable between views; estimator and tracking repair is explicitly deferred.
