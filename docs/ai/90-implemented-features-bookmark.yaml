      Complete pre-rewrite integration snapshot containing later features and
      fixes that are not all present in the active rollback.

status_terms:
  ACTIVE: Present in the active rollback source.
  ARCHIVED_LATER: Present only, or materially improved, in the preserved later version.
  PHYSICALLY_DEMONSTRATED: At least one bounded physical run exercised the stated behavior.
  SOFTWARE_QUALIFIED: Tests/builds or command-free qualification passed, but full physical acceptance is incomplete.
  PARTIAL: Interfaces or policy exist, but the intended real-world behavior is not complete.

