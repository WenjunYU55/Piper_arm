global_nbv_target_aim_capture_recovery_2026_08_20:
  status: implemented_partial_physical_loop_verified_complete_scan_pending
  capabilities:
    - Cumulative accepted voxel coverage ranks the complete configured scan region; the retired 6-to-30 and 30-to-45 degree movement frontiers have no production authority.
    - Information gain outranks motion cost, a six-degree accepted-view threshold rejects redundancy, and only twelve information-ranked direction-diverse candidates reach Tesseract.
    - Exact current-target aim is tried first through roll and IK alternatives. At most one canonical fallback within five degrees is allowed and provenance is validated.
    - Every settled commanded viewpoint stores actual FK independently of capture acceptance. Rejected views change next motion start but not accepted coverage or reconstruction.
    - One request-correlated heavy refresh handles transient fresh visual capture rejection before a persistent rejection requests a new NBV.
    - Qualified component depth produces coherent camera X/Y/Z, temporal filtering happens only after timestamped transformation into base_link, and immutable accepted reconstruction remains separate from current target estimation.
  replay: scan_20260820_142919 old 13.424-degree final target error is detected and rejected by the five-degree gate; selected-to-achieved error was only 0.037 degrees.
