  reference: docs/ai/89-offline-distortion.yaml
  summary: Offline-only shared calibrated remap, post-remap depth support check, explicit calibration provenance and read-only pixel/plane diagnostics; motion and capture policy unchanged.

upstream_workflow_audit_2026_09_07:
