  confirmed: Pinned custom reader format and run_video invocation match; global refinement is called automatically by run_one_video.
  historical_missing: Full-recording offline mask propagation was absent at audit time; see 91-dense-offline-video.yaml for the implemented follow-up. Legacy import_bag.py retains mission filtering.
  quality: Previous real log contains explicit failures for frames 4, 47, 99 and 137; 141 saved poses do not mean 141 successful tracks.
  official_example: Retried download exits 1 due Google Drive quota; supplied-example reconstruction remains unexecuted.
  scope: Audit only; no runtime or capture policy changes and no new GPU mesh.

dense_offline_video_2026_09_07:
