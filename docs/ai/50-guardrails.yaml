schema_version: 1
document: guardrails
final_equivalence_and_requalification_guardrail_2026_08_15:
  invariants:
    - The software audit verdict is READY FOR SUPERVISED PHYSICAL REQUALIFICATION, not physically requalified and not an authorization for autonomous motion.
    - Any UNEXPLAINED or SAFETY-RELEVANT observed difference immediately changes the operational verdict to NOT READY.
    - Execute the eleven checklist stages in order with explicit operator authorization and evidence; never skip an earlier gate.
    - Contact manipulation, outdoor/mobile-base operation, changed TF/calibration, changed payload, or changed speed requires separate qualification.
    - Keep SafetyEvaluator shadow-only and retain the frozen legacy mission evidence until the supervised-trace removal gate is reviewed.
  blast_radius: [all autonomous motion, J6 startup and storage direction, return home, motor disable, command ownership, target acquisition, viewpoint execution, capture, repeated mission cleanup]
  must_retest_if_changed: [docs/refactor/final_equivalence_report.md evidence matrix, full functional tests, five-package build, colcon test, rootless Tesseract qualifications, every completed physical checklist stage affected by the change]
phase10_cleanup_guardrail_2026_08_15:
  invariants:
    - Delete only code proved unreferenced by repository search and characterization tests; retain uncertain or externally contracted surfaces.
    - Do not remove frozen mission bodies before the supervised-trace gate, telemetry mirrors before consumer migration, or legacy safety authority while the evaluator is shadow-only.
    - Keep tf2_geometry_msgs registration imports even when static lint reports no symbol use.
    - Do not consolidate equal-looking node helpers across distinct callback, parameter, synchronization, or safety owners.
    - No cleanup may change a ROS contract, numerical setting, motion path, process policy, TF/calibration meaning, perception algorithm, or Tesseract behavior.
  must_retest_if_changed: [all Phase 1-9 characterization tests, full piper_mobile_manipulation tests, root GUI and reconstruction tests, AI worker tests, formatting and lint, Python byte compilation, normal five-package Foxy build, colcon test, command-free Tesseract qualifications]
phase9_configuration_guardrail_2026_08_14:
  invariants:
    - Preserve every existing coordinator/executor ROS parameter name, default, override path and unit.
    - Load static configuration once at node construction; do not mix mission goals, telemetry observations or derived plan/session state into configuration.
    - Do not consolidate equal literals across nodes unless their semantics and owner are proved identical.
    - configured_value may fall back to get_parameter only for legacy unconstructed test doubles; production nodes must always own typed configuration.
    - SafetyEvaluator remains shadow-only and all motion/home/capture thresholds retain their exact values.
  must_retest_if_changed: [test_configuration.py, test_mission_engine.py, Phase 1 mission and executor characterization, test_scan_motion.py, test_safety_evaluator.py, full piper_mobile_manipulation tests, public parameter/interface characterization, normal five-package Foxy build]
phase7_viewpoint_executor_guardrail_2026_08_14:
  invariants:
    - PlanAuthorizer, TrajectoryRunner, CaptureCoordinator and RecoveryPolicy must remain ROS-free and must never publish commands, enable motors, alter telemetry or call services.
    - scan_viewpoint_executor_node remains the sole optional /joint_ctrl_single publisher and retains every public ROS entity and QoS profile.
    - Preserve exact plan IDs, source_request_id, trajectory hashes, mission authorization, first-rejection wording and proposal age semantics.
    - Preserve the exact Tesseract path points, 20 Hz timing, speed values, following/step/settle thresholds, no-burst behavior and final feedback convergence.
    - Adapt string-only ROS capture/status failures once at the Phase 2 compatibility boundary; application recovery must inspect only typed codes/tags, never Failure.detail.
    - Phase 5 SafetyEvaluator remains shadow-only and legacy geometry/runtime/hold decisions remain authoritative.
  blast_radius: [proposal acceptance, autonomous authorization, target drift replanning, trajectory streaming, capture persistence and retry, acquisition recovery, direct return-home execution, cancellation and hold]
  must_retest_if_changed: [test_phase7_viewpoint_components.py, test_phase1_executor_characterization.py, test_scan_motion.py, test_safety_evaluator.py, test_failure_model.py, full piper_mobile_manipulation tests, public ROS interface characterization, normal five-package Foxy build]
phase6_mission_engine_guardrail_2026_08_14:
  invariants:
    - MissionEngine owns orchestration only and must not import rclpy, ROS messages, services, actions, QoS or TF types.
    - Preserve exact current phase order, retries, reacquisition, capture completion, terminal classification and motor-loss no-command policy.
    - target_scan_mission_node retains public action admission, queue, cache and result semantics, ROS conversion, durable writes and node lifecycle.
    - Cancellation must enter through a per-task application CancellationToken. Terminal home, storage, hold, disable and cleanup remain non-interrupting once committed.
    - Phase 5 SafetyEvaluator stays shadow-only; extracting orchestration does not make it authoritative or add a coordinator safety mode.
    - Frozen _legacy_run_pipeline and _legacy_safe_shutdown are non-authoritative compatibility evidence and must not be called by execute_cb.
  blast_radius: [mission startup, preflight, enable and hold, staged startup home, acquisition and target lock, occlusion probe, adaptive capture retries, direct terminal home, storage wrist, disable, process cleanup, public action results]
  must_retest_if_changed: [test_mission_engine.py, test_phase1_mission_characterization.py, test_mission_core.py, test_failure_model.py, test_process_supervisor.py, full piper_mobile_manipulation tests, public ROS interface characterization, normal five-package Foxy build]
phase5_safety_shadow_guardrail_2026_08_14:
  invariants:
    - SafetyEvaluator and SafetyComparisonLogger are observational only until a separately reviewed phase proves equivalence and explicitly changes authority.
    - Legacy proposal validation, runtime_reasons, path checks, hold publication, recovery, home, disable, cleanup and action results remain authoritative.
    - SafetyProfile copies the existing executor thresholds once; do not centralize, widen, narrow or dynamically reread them in the pure evaluator.
    - A disagreement must be logged structurally and must never become a command, state transition, retry, reacquisition, home, disable or result input.
    - Do not invent PREFLIGHT, OCCLUSION_MANIPULATION or DISABLE_ONLY as executor authority; those responsibilities remain coordinator-owned or unqualified.
  must_retest_if_changed: [test_safety_evaluator.py, test_phase1_executor_characterization.py, test_scan_motion.py, test_telemetry_store.py, test_failure_model.py, full piper_mobile_manipulation tests, normal five-package Foxy build]
process_supervision_guardrail_2026_08_14:
  invariants:
    - Signal only exact process-group leaders returned by mission-owned start_new_session Popen calls. Never discover, adopt or kill by executable/node name, broad pattern or unrelated PID.
    - Preserve autonomous startup order driver, vision, hand_eye, tesseract_worker, scan_stack and every established environment override/readiness wait.
    - Preserve reverse SIGINT then shared five-second wait, SIGTERM then shared three-second wait. Forced kill remains disabled for the coordinator.
    - A live survivor keeps its log open, makes cleanup incomplete and must propagate to NEEDS_OPERATOR rather than safe_shutdown true.
    - ProcessSupervisor owns mechanics only. Home, hold, disable, motor-loss no-command behavior, mission cancellation and result classification remain with the coordinator.
    - Nested vision manifest ownership, the GUI preview-only RViz child, reconstruction jobs, worker locking, coordinator/RViz lifetime and launch-level SIGINT escalation remain separate policies. The GUI owns no production mission process group after Phase 8.
  blast_radius: [sole arm-command publisher ownership, mission generation isolation, driver/camera/perception/planning startup, cancellation, home/hold/disable terminal proof, result delivery]
  must_retest_if_changed: [test_process_supervisor.py, test_phase1_mission_characterization.py, test_mission_core.py, full piper_mobile_manipulation tests, normal five-package Foxy build, command-free rootless qualification]
telemetry_snapshot_guardrail_2026_08_14:
  invariants:
    - TelemetryStore owns observations only and must never absorb mission phases, executor plans/paths/commands, service futures, retry counters, process ownership, or home/disable proofs.
    - Each callback observation atomically binds its value to the existing monotonic receipt time and preserves optional ROS source stamp/frame provenance. A decision must not mix values and receipt times from different callback generations.
    - TelemetrySnapshot and its domain/observation envelopes remain frozen and defensively copied. Mutation of an input or returned nested ROS/dictionary value must not affect the store or a later snapshot.
    - No freshness value belongs in TelemetryStore. Preserve every existing caller-owned timeout and the exact age greater-than maximum stale boundary.
    - ROS subscriptions, QoS, public interfaces, numerical safety values, motion/perception/Tesseract policy, and terminal home/hold/disable behavior remain unchanged.
    - latest_* and updated compatibility mirrors may remain only during incremental migration; they cannot become a second authority at a migrated safety decision.
  blast_radius: [joint and motor authority, camera health, target lock, obstacle scene, controller-limit hash, plan approval, capture acceptance, runtime recovery, configured home, hold, disable, mission terminal result]
  must_retest_if_changed: [test_telemetry_store.py, all Phase 1 characterization tests, test_failure_model.py, test_mission_core.py, full test_scan_motion.py, full piper_mobile_manipulation tests, public ROS interface hash test, normal five-package Foxy build]
hard_invariants:
  - Real-arm motion is opt-in; start_piper defaults auto_enable=false and perception/workflow defaults enable_real_arm_motion=false.
  - Never run the ROS PiPER driver and a direct piper_sdk calibration/reset process against CAN simultaneously.
  - The physical gripper's wrong-way-round installation is exactly the fixed link6-to-gripper_base yaw-pi transform. Never add that offset to joint6 feedback, controller commands, mode-0 link6 FK, or camera calibration. The detailed camera-holder and converted L515 STLs remain visual-only for general robot self/environment collision and inertia, but their exact transformed union establishes the mandatory conservative link6 external-support envelope center [-0.029750002,0,0.0375] m and size [0.1395,0.10572671,0.053] m. The camera-holder visual origin [0.1765,-0.0565314679146,0.0612789535522] and ordered X-then-Z orientation are user-locked and must not move; its nominal close-hole datum retains the intentional -4 mm visual Z trim. The operator-confirmed l515_visual remains fixed at camera_holder [0.1,0,0] m with rpy [-pi,pi,pi/2], mesh offset [-0.030503129,-0.030503409,-0.029628554] m, transverse 40 mm screw-axis alignment and +2.5 mm installed axial seating trim; the 87.763214 mm lateral tab pair is explicitly not the camera datum. Intel Rev 003's 4.5 mm depth offset constrains depth optical to l515_visual [0,0,-0.008224997] m, and the factory extrinsic from device f1120648 constrains colour optical to [-0.0002000813,0.0141312284,-0.0040001602] m with a 1.322466-degree relative skew. Never restore the superseded [0,0.014,-0.008694998] m mixed RGB-X/Y/depth-Z anchor. Preserve the raw PARK solve as provenance, keep the qualified conservative L515 housing/mount/cable envelopes, require at least 0.005 m external support-plane clearance for every motion including direct home, and require complete offline plus stationary physical revalidation after any visual or optical change.
  - Physical emergency stop/power procedure is authoritative; disable_piper.sh is not an emergency stop.
  - Motor enable/disable must serialize through the installed SDK handshake, return success only after all six low-speed FOC driver_enable_status flags match, and never trust an aggregate return or arm err_code as proof. Any per-motor FOC fault aborts enable. A failed partial enable must remain transition-lock-held until explicit all-axis DisableArm(7) proves six false flags. Outside a fault-free bounded enable transition, any powered fault or persistent partial enable must make the 200 Hz watchdog disable every axis. Do not interleave gripper commands with motor-enable retries.
  - Fresh typed all-six-enabled motor proof is continuous powered-motion authority, not only an enable-service postcondition. If any axis drops, a fault appears, or motor status becomes invalid/stale, executor and mission must revoke authorization immediately. The motor-loss terminal path must send no hold, home, storage or disable command; it may only wait read-only for the driver watchdog's six-false proof, stop owned children and report NEEDS_OPERATOR with safe_shutdown=false. Never infer safe automatic home from aggregate err_code zero or from manual recovery.
  - STARTUP_WRIST must use the operator-confirmed increasing controller direction from negative storage to ready zero. Schema-v3 must bind a negative storage J6 below ready, startup_wrist_direction=increasing and storage_wrist_direction=decreasing. Validate the measured signed branch before motor enable. A positive non-ready start must remain disabled; never wrap through a joint limit or treat +/-pi as interchangeable without winding authority. Schema-v2 staged profiles cannot authorize powered motion.
  - GPU workers must remain ROS-free and unable to publish arm commands.
  - Orphan cleanup may signal only GPU process groups recorded by the wrapper whose names, live group leadership, and command paths pass validation; never use broad pkill patterns that could stop the driver or unrelated ROS nodes.
  - Current supervised_cube_workflow is dry-run and must retain no arm-command publisher.
  - The active mission has no fixed rectangular, radial, or height-qualified workspace. Command-free candidate filtering is not proof of reachability; finite physical feasibility remains mandatory through Tesseract IK, joint limits, floor/self/environment collision, exact start-state binding and executor runtime validation. Mounted use remains blocked until chassis geometry/TF and brake authority exist.
  - A service-mode scan record is accepted only from fresh finite GOOD quality at least 0.65 with target_valid exactly boolean true and fresh CLEAR occlusion. Malformed, stale, nonfinite, lower-quality, partially occluded or heavily occluded evidence fails closed. Rejected poses never increment the accepted count and must be excluded from replacements.
  - Pick placement may be proposed only on fresh base_link scene evidence that proves dense flat support around all footprint edges and no observed overhead occupancy. The scene cloud is proposal evidence, not collision or contact authorization.
  - The supervised workflow must retain every rclpy subscription for the node lifetime and must not decode full target clouds unless a newly accepted capture needs modeling; /piper/target_cloud uses best-effort sensor QoS and its subscriber must remain compatible. Cache the capture message while WAIT_CAPTURE so either cloud/status order can advance accepted_views and modeled_views together. Landmark/status loss or cloud callback starvation must fail closed before SCAN_READY.
  - Scan viewpoint execution is a separate module: proposal-only is the default and must not create a joint-command publisher; real motion requires launch opt-in plus exact fresh-plan approval.
  - The scan executor must never enable motors, must preserve the gripper with arm-only six-position commands, and must validate the exact schema-v5 tesseract_stream_v3 schedule, zero derivative placeholders, selected aggregate speed, 20 Hz rate, 0.05 rad adjacent-step ceiling, speed-scaled MoveJ-model finite-difference bounds and fresh controller-limit hash. J1-J5 use 5 rad/s and J6 3 rad/s multiplied once by selected speed; fresh queried controller limits are mandatory health/hash evidence but are not another schedule multiplier. Every collision-checked source vertex must remain in order, and on-segment samples must not shortcut corners. ISP qdot/qddot are not PiPER commands, and acceleration must not be inferred from piecewise MoveJ setpoints. Normal acquisition/scan must publish scheduled samples without feedback stops between them, keep measured lag within 0.30 rad after one-second grace, and feedback-gate only the final endpoint plus settle window. It must never burst multiple overdue goals or jump across skipped collision-qualified samples; schedule overrun aborts to current-position hold. Runtime recovery freezes the schedule clock. A dedicated zero-capture RETURN_HOME remains the sole robot-self-collision exception and must contain exactly measured start plus one configured stage target with exact goal/stage/bypass evidence. Holder/L515 floor/external clearance, fresh feedback, hard limits, final convergence, stable hold and disable proof remain mandatory. Never restore fixed-J6 planning or add a J6 lock/special cost.
  - Rough targets never imply tracking and never cause motion on receipt. Only one atomic /scan_target_acquisition/prepare request containing a valid unique session_id and fresh finite base_link PointStamped may create a command-free ROUGH_ACQUISITION proposal. Exact duplicate ID/payload retries are idempotent; the same ID with changed target data is rejected. source_request_id must survive through candidate, spool, typed plans, and GUI acceptance; exact plan/hash approval is still required.
  - The retired GUI Step-2 service retry is historical characterization only and must not be restored. Production acquisition session/payload retry authority belongs to MissionEngine and the acquisition service adapter under the existing typed failure and deadline contracts.
  - ROUGH_ACQUISITION is the only execution mode allowed without measured target tracking. Its first segment must remain schema-v5 bootstrap_static, collision-qualified, limited to the exact approved path, capture-free, and gated by fresh joints, arm status, controller motion limits, camera clock, robot/camera/cable/floor collision checks, feedback convergence, and hold-on-abort. Only this first segment may omit perception obstacles. Every later segment requires a fresh semantic result correlated to settled GroundingDINO; an exact zero-obstacle result constructs the timestamped typed empty scene directly, while any detected obstacle still requires depth-projected typed geometry and exact-path obstacle validation.
  - The acquisition compact fallback radius is 0.28 m. This retains margin above the L515 minimum sensing range and preserves the mechanically registered centreline zero-start IK qualification; do not restore the exact 0.30 m singular boundary without rerunning both rootless suites. The close-target current-distance cap, one-look/replan behavior and all collision, joint, boresight and minimum-distance gates remain unchanged.
  - Every accepted settled MULTIVIEW_SCAN viewpoint must complete one service-triggered synchronized raw RGB/depth/camera-info/mask persistence operation before it is counted and execution advances. Workflow quality, occlusion, and optional cloud refinement remain diagnostic and must not precede or substitute for the primary saved-record contract. Missing, stale, unsynchronized, non-finite, or failed image output must abort to hold.
  - Full-resolution cloud refinement must pin the exact RGB-D cache entry selected by the matching heavy-refresh request ID and image stamp. Worker latency must not turn rolling-cache eviction into a false synchronization failure, and the existing 0.08-second RGB-D/mask tolerance must not be widened.
  - A transient missing/stale obstacle sample may be tolerated while a MULTIVIEW_SCAN arm is stationary in SETTLING, CAPTURING, CAPTURING_RGBD, or WAIT_CAPTURE. It may also age during exactly one MOVING segment only when a present fresh valid snapshot passed the immediately preceding runtime refresh and the segment is collision-qualified. Any newly received blocked/invalid scene still stops immediately. Before every next target, WAITING_FOR_RUNTIME_REFRESH must receive fresh valid obstacle geometry within its bounded deadline.
  - An obstacle instance invalid only because of transform_unavailable, stale_transform, or stale_source_data is transport freshness, not evidence of a physical blocker. It must command an immediate current-feedback hold and use the bounded pre-motion runtime-refresh path. The TF buffer survives isolated misses and may be recreated only after three continuous seconds without success. Every semantic/unqualified, mixed, malformed, or valid unsafe obstacle scene remains fail-closed.
  - A decoded SAM2 instance-ID frame with reserved target ID 1 and no IDs 2+ is a complete empty-obstacle observation. Publish its clear 3D array before TF so an unnecessary transform wait cannot starve moving-scan liveness. This exception applies only after successful ID/depth shape decoding and metadata filtering; any actual obstacle ID, malformed input, uncertain classification or failed projection remains fail-closed.
  - Acquisition success requires post-refresh measured TRACKING/LOCKED rather than prediction. The supervised workflow and production mission use the same fresh valid stable base_link TrackedTarget plus TrackingHealth TRACKING/camera_settled/nonprediction plus exact LOCKED status as authority; /piper/target_landmark and GUI Diagnostics are display-only. ACQUIRED must hold, clear remaining acquisition correlation, ignore late heavy-worker statuses, start the workflow once, and wait for SCAN_READY under MissionEngine authority.
  - A command-free MULTIVIEW_SCAN snapshot rejected only for unsettled, prediction-only, or stale tracking may retry fresh snapshots for at most 30 seconds while visual recovery restores measured authority. Do not retain or approve a rejected snapshot. Collision, path, obstacle scene, camera timestamp, controller, hash, worker, timeout and every unnamed blocker remain immediate failures. Proposal-stage LOW_CONFIDENCE/LOST/SEARCHING uses the separately correlated unchanged-plan approval wait and never broadens this snapshot exception.
  - Every acquisition GroundingDINO request must use a unique request ID and post-settle minimum image stamp. Ignore unrelated status, reject pre-settle images, allow 60 seconds only for the matching semantic job, and accept success only from a newer stable measured LOCKED target in base_link within 0.30 m of the rough hint.
  - Never turn target_mask_missing into an uncorrelated clear scene. Empty-scene publication is allowed only for the exact rough_acquisition_viewpoint result with obstacle_count=0 and its original image stamp. Obstacle-bearing target-missing results reserve ID 1 for the target, use IDs 2+ for obstacles, and require SAM2/depth projection before another move.
  - Workflow occlusion assessment must not reuse acquisition evidence. Each workflow start clears cached obstacle authority, issues a unique post-start workflow_occlusion_probe, and requires state=published plus exact request identity/image-stamp agreement with typed 3D obstacle geometry before SCAN_READY. target_mask_missing is never clear authority for this probe.
  - Automatic one-view scan candidates must remain within the configured 6-to-30-degree target-centred frontier from achieved camera FK. Coverage cannot outrank this one-replan limit and a direction change below six degrees cannot consume a capture. Twenty-five 7.5-degree azimuth samples must cover the 90-270-degree hemisphere so an achieved off-grid pose retains an approximately 6-8-degree continuity successor; independent pose/look duplicate rejection still prevents repeats. The first transaction tries the closest non-regressing candidate before the ambitious leader. On later feature objectives, preserve the bounded 36-member coverage-leader/nearest-current interleaved membership, then stable-partition that exact set so material-progress candidates are attempted before near-zero-progress compact nonregressing IK fallbacks. Do not replace compact members with unreachable ambitious poses merely to fill a progress quota. The first measured MULTIVIEW_SCAN target center must be frozen once per session and used for every achieved/candidate face-axis comparison and final feature gate; fresh measured target data still owns every candidate position, look direction, drift check and safety validation. Never update the frozen coverage frame during a replan or use the rough coordinate for it. Accepted achieved FK must finish the Y side it is already approaching, cross once to finish the opposite side, then finish azimuth/elevation deficits before residual diversity; rejected proposals exclude retries but do not satisfy a feature goal. Side material progress means at least 0.03 normalized lateral advance after the 0.02 measurement tolerance; azimuth/elevation material progress adds at least two degrees. Never truncate away all locally reachable nonregressing candidates before IK. Seven -15-through--75-degree elevation samples and six 0.30-through-0.45 m range samples are exact IK alternatives only and do not weaken collision or visibility gates. The isolated worker must try alternate roll/IK branches or compact candidates when dense camera_optical_frame FK over an SDK path violates visibility. Independently, the executor repeats dense calibrated FK and must keep the measured target within the stricter 20-degree positive-optical-Z cone and at least 0.22 m away; reject before any command on violation.
  - Invalid, missing, stale, blocked or collision-bearing perception geometry remains an immediate stop-and-hold fault for scan/acquisition/manipulation motion, but camera/tracking freshness alone does not suppress a separately requested direct configured home. Dedicated RETURN_HOME ignores camera/tracking/obstacle freshness and robot self-collision by operator authority, while the CAD-derived attached holder/L515 support-plane/external clearance remains mandatory. Its exact first fresh measured point alone may use the operator-qualified 0.3-rad post-disable relaxation band; every endpoint remains strictly in-limit. Emergency-stop, stale/nonfinite feedback, feedback beyond that band, controller/arm/motor fault, attached-holder external-clearance failure, unavailable command publication, waypoint failure and no-progress still block because endpoint/disable proof is untrustworthy.
  - The exact obstacle-free bootstrap_static authority for ROUGH_ACQUISITION viewpoint zero survives a transient runtime telemetry hold and resume; it is not revoked merely because motion limits refresh after the initial command. Never extend this exception to later acquisition looks or a moving MULTIVIEW_SCAN segment, and never use it to suppress valid unsafe/blocked obstacle geometry.
  - The GUI owns no production worker, scan stack, readiness gate, plan confirmation or executor service client. It removes its commissioning command publisher before RunTargetScan submission and must not restore it while any command publisher remains. MissionEngine and ProcessSupervisor own every autonomous generation and authorization.
  - GUI mission feedback, diagnostic strings and action reason text are presentation only. They cannot select retry, replan, occlusion action, capture acceptance, home, hold, disable or child cleanup.
  - The isolated worker must check its request-specific internal budget before every OMPL attempt and throughout adaptive collision validation. Automatic one-view MULTIVIEW_SCAN uses 45 seconds total and three seconds per OMPL attempt; manual batch and other requests retain 150 seconds and five seconds. It must reserve bounded response time and return a correlated success or rejection before the bridge and GUI deadlines.
  - The GUI launcher and production supervised-scan launcher must use source_piper_foxy_environment.sh. Only the production mission/scan launch path may start children and must pass exact package-prefix, interface and schema checks. Never source or recreate a repository-root install overlay; generated colcon output belongs only under piper_ros_foxy.
  - GUI and supervised-scan ROS participants must load fastdds_gui_udp_only.xml with RMW_FASTRTPS_USE_QOS_FROM_XML=0 and effective ROS_LOCALHOST_ONLY=0. Foxy's native rmw endpoint QoS must retain reallocating histories for variable-size topics and services; the XML may govern only the participant transport, allowing UDPv4 on 127.0.0.1 and disabling builtin/shared-memory transports. Do not set ROS_LOCALHOST_ONLY=1 in this process tree because Foxy overrides the XML and silently restores the corrupt graph-discovery SHM path. This does not change the ROS_DOMAIN_ID=42 contract or the ROS-free Tesseract worker.
  - The Tesseract Foxy bridge and isolated worker must never publish /joint_ctrl_single, call /enable_srv, access CAN, or share DDS. The worker remains CPU-only, networkless, GPU-free, read-only except for its private bounded request/processing/response spool queues and atomic worker_health.json, and recreates the planning scene for every request. The bridge must require a fresh ready heartbeat with matching schema/backend and expose separate acquisition and multiview readiness blockers.
  - The rootless Tesseract setup may use network access only while fetching hash-verified/pinned dependencies. run_worker.sh and every qualification/planning process must use a fresh network namespace and minimal synthetic /dev; never expose host CAN, camera, or GPU devices.
  - run_worker.sh must remain Bubblewrap's direct parent while --die-with-parent is active. Phase 8 forbids GUI ownership of this wrapper; production process/launch ownership retains the worker cleanup contract.
  - Tesseract normal motion must fail closed unless hashes/binding validate, deterministic_seed is 42, the plan is fresh, the exact trajectory hash is approved, and collision_model_qualified is true. Keep the global 0.005 m clearance. The first bootstrap_static ROUGH_ACQUISITION prefix may use only named bounded start-model contacts, maximum 0.15 rad on one or two declared joints, dense monotonic improvement, and a normal-clearance endpoint. Separately, an exact zero-capture RETURN_HOME may bypass robot self-collision evaluation only with the manifest-authorized direct-home/stage evidence; it must contain no intermediate target, cannot enter any other plan kind, and must densely prove the CAD-derived holder/L515 envelope remains at least 0.005 m above the support plane. Both exceptions remain hash-bound and independently checked by Foxy; no collision pair is globally disabled.
  - Completion, cancellation and every controllable failure must first hold, then create a fresh zero-capture RETURN_HOME request from fresh settled measured joints with exact hash/home-stage approval, explicit robot-self-collision-exemption evidence and mandatory CAD-holder external-clearance proof. Reverse-to-plan-start is not configured home and must never be reported as such. Configured rough home, storage J6, one stable second of position-window proof, final hold, feedback-confirmed disable and owned-process stop remain mandatory. Untrusted command/control/feedback authority, motor faults or an externally unqualified attached-holder path must suppress home motion and return NEEDS_OPERATOR.
  - Multiple target requests may be pending but exactly one mission may own hardware, command authority or a child-process generation. Queue order is closest rough target in the already snapshotted local base frame after the bounded one-second coalescing window, with stable arrival ties. Never pre-empt an active scan for a newly closer target. Do not start the next target until the predecessor has a durable result after direct home, feedback disable and exact child cleanup. Clear all capture/tracking/coverage caches between missions. Queued cancellation must not disturb the active mission and must not claim that arm resources were started.
  - A bounded in-flight runtime recovery must keep the interrupted endpoint immutable for possible resumption but command a current-feedback hold immediately. Its settle proof is against that current hold, not the interrupted endpoint. It may reissue the endpoint only after fresh obstacle geometry and every other runtime gate recover; timeout remains terminal and routes through the normal safety classification.
  - The Automatic Scan tab creates no manual Step-2/4/5 generation, plan/status cache or delayed recovery callback. It submits/cancels only RunTargetScan; the production mission enforces ACQUIRED/SCAN_READY and multiview readiness timing.
  - Automatic mission mode approves only one multiview capture per transaction; its request must bind include_return_home=false and its response must contain exactly that capture segment, never an unused embedded home. Target/scene/achieved coverage are refreshed before the next. Eight accepted views are only the measured-model seed floor and twenty-four is the safety maximum. From 8-23 it stops immediately only after two achieved views per Y side, 120 degrees of azimuth, 25 degrees of elevation and three consecutive measured novel-surface gains at or below 0.02; otherwise it requests another view. At 24, any missing floor is failure. Strict all-remaining-IK exhaustion is success only after the same seed and floors. Manual batch mode binds include_return_home=true and retains its explicit exact-thirteen whole-route confirmation plus collision-checked contingency home. Every capture still requires stationary joints, synchronized camera clock, persistence, and GOOD/CLEAR gates.
  - GUI Disable is never a direct service call. It must command the fresh current feedback pose through the sole current command owner, require maximum target error 0.025 rad and sample motion 0.005 rad for one continuous second, and only then call the feedback-confirmed disable service. Failure to prove the hold within eight seconds leaves motors enabled.
  - The qualified final validator is bounded adaptive dense-discrete Bullet over the exact post-ISP path, with at most 0.001 rad total joint change per interval and pair clearance inflated by a conservative relative-motion bound. Do not describe it as BulletCast, FCL, or exact continuous collision checking; the nanobind continuous-manager path is disabled after a repeatable segfault.
  - Proposal reachability and Tesseract snapshots require fresh arm-status and joint callbacks, not merely graph-visible endpoints. Scan bridge and reachability subscriptions must be created once, retained for node lifetime, and never destroyed/recreated in response to stale input; preserve reliable depth-1 latest-sample QoS and the validated staggered launch order. Missing/stale feedback remains fail-closed without DDS graph churn. Camera-timestamp-watchdog retry is a separate bounded recovery contract.
  - Preserve camera image timestamps through GPU spools and TF lookup; wall-clock result arrival is not measurement time.
  - Keep RealSense RGB and depth global_time_enabled so L515 hardware-clock drift is corrected at the source; set and verify both live sensor options after device open and fail startup if either remains false. Externally bound every direct Foxy parameter CLI transaction so discovery before /camera/camera exists cannot allocate indefinitely; timeout must retry or fail closed, never skip verification. Never trust launch overrides alone, hide drift by rewriting downstream image stamps, or widen the watchdog limit.
  - Camera timestamp health is fail-closed: large/future/backwards/missing stamps must force CAMERA_CLOCK_INVALID, speed scale zero, and scan proposal/execution rejection. Never repair this by silently rewriting measurement timestamps.
  - The GPU wrapper must not report successful perception startup until the watchdog node and exactly one health publisher are visible; bounded watchdog-only startup retries may precede downstream perception, but exhausted retries must tear down the owned stack.
  - Automatic vision restart requires reliable depth-1 latest-sample fresh joint positions stable within a conservative tolerance for the full settle duration; do not use noisy instantaneous PiPER velocity as the sole stationary test or allow a 200 Hz backlog to become the motion authority. While moving or when stationarity is unknown, abort/hold first and leave recovery pending. Restart camera plus all dependent perception state, not an isolated tracker session.
  - Retain watchdog image and joint rclpy Subscription objects for the full node lifetime; a discovered-then-garbage-collected joint endpoint makes stationary recovery permanently unavailable.
  - A stale watchdog joint endpoint may be recreated only as a read-only subscription on a bounded interval; never infer stationarity from the retry itself or request recovery until fresh stable positions satisfy the full settle gate.
  - Sample the per-frame color CameraInfo header rather than deserializing full RGB payloads in the watchdog; keep its lightweight callbacks on Foxy's standard single-thread executor so endpoint recreation is serialized with the joint callback. Do not restore the custom multi-thread callback groups that exposed endpoints but failed to deliver live joint feedback/health.
  - Do not update Kalman velocity from out-of-order measurements.
  - Keep target estimates in base_link for eye-in-hand motion; camera-space gates must not reject legitimate camera motion by default.
  - Multiview candidate generation must reject any target centre whose header.frame_id is not exactly the configured base_link planning frame. A tracker publication gap may make raw /piper/target_3d visible, but camera-optical coordinates must never be treated as base-link coordinates or replace the active NBV dome.
  - At a settled RGB-D capture, missing target or mask is transport/readiness and may retry only at the same held pose under the existing ten-attempt bound. A present fresh Target3D with valid=false is a visual pose rejection, not a mission-wide control abort: persist no frame, append rejected history, hold, emit VIEW_REJECTED and spend the bounded different-view replacement budget. Never downgrade file, transform, service, hardware or safety errors to visual rejection.
  - A target callback waiting for timestamped TF must not starve the tracker's TF subscriptions; retain concurrent executor capacity or replace the blocking lookup with an equivalent non-starving design.
  - Target3D depth-jump rejection must not permanently latch to a pre-motion depth. Reject isolated jumps, re-anchor only after the configured mutually consistent sample count/tolerance, clear stale camera-frame smoothing on re-anchor, and treat a nonpositive maximum jump as an explicitly disabled gate.
  - Tracking measurement freshness must cover the qualified live SAM2 inference interval and remain aligned with the executor's maximum tracking measurement age. The current value is 0.75 seconds; do not restore the former hard-coded 0.25-second health cutoff that forced speed scale zero during valid motion.
  - Serialize heavy refresh: never start a second semantic job while the current job is unacknowledged or running.
  - Low-confidence heavy refresh requires a valid TrackedTarget below 0.60 for one second, a settled camera, single-flight serialization, and 0.10 hysteresis before rearming; transient confidence dips must not create a refresh storm.
  - After the bounded recovery burst, an ABSENT target may be retried only at the configured slow interval and only while the camera is settled; periodic recovery must not become a refresh storm.
  - Never publish a zero-confidence stale mask as a valid heavy refresh seed.
  - Every SAM2 live seed must use the labelled objects manifest and object_NNN.png files. The removed objectless mask.png compatibility format must remain rejected.
  - Joint commands must pass both GUI and driver hard bounds; invalid saved bounds fall back to SDK-safe defaults.
  - piper_ctrl_single_node must send every JointCtrl target but not resend unchanged MotionCtrl_2 mode/speed. Six-position JointState commands are arm-only and must never send, zero, clip, warn about, or otherwise modify the gripper; only an explicit seventh position may produce a cached GripperCtrl. It must publish only fresh finite positive SDK controller velocity/acceleration feedback on /piper/motion_limits, reject values above the 3 rad/s and 5 rad/s2 protocol caps, and canonical-hash the exact values. Enable/disable must invalidate both command caches. Do not cache position targets or suppress the current-position hold.
  - PiPER telemetry uses the executor-owned 200 Hz timer; do not restore the unmanaged publication thread or Node.create_rate loop. Graph-visible endpoints and active CAN do not prove feedback delivery; downstream planning stays blocked until actual fresh samples arrive, and restart acceptance must use an application-level subscriber when Foxy CLI echo/hz is unreliable.
  - The production planning/Xacro J2 lower limit is the exact enabled compact-pose feedback -0.044796192 rad measured on 2026-07-30. Do not generalize it into invented bounds. Never clip a compact snapshot or disable a nonadjacent pair. Any folded-start exception must remain exactly the qualified hash-bound acquisition-only monotonic recovery policy.
  - Hand-eye startup must first resolve the RealSense static camera_link-to-camera_color_optical_frame edge, then consume reliable depth-1 joint feedback. Missing static TF fails closed; after a camera restart, confirm the full base_link-to-camera_color_optical_frame chain before planning.
  - The draggable STL editor must use only preview_-prefixed TF plus /piper_gui/preview_set and /piper_gui/preview_joint_states; its node and launch must never name or publish /joint_ctrl_single.
  - Mirroring a 3D preview onto hardware requires fresh feedback, zero arm error, conservative path acceptance, explicit confirmation, preserved gripper position, and a speed cap of 10 percent.
  - Manual preview mirroring does not consume live obstacle boxes; it must reject conservative robot/floor path failures and requires a physically clear supervised workspace.
  - Real-arm TF/RViz visualization must use display_live_robot.launch.py and consume /joint_states_single. The joint_state_publisher_gui dependency and command-coupled RViz launch were removed; do not reintroduce fake joint-state publication or publish/remap /joint_ctrl_single from visualization.
  - The real-driver launch must default auto_enable=false. Do not restore girpper_exist, rviz_ctrl_flag, RViz-specific gripper scaling, or any other compatibility input that changes current command units.
  - The piper_description joint origins must match the controller's modified-DH mode-0 convention; do not reintroduce the optional two-degree J2/J3 mode-1 correction.
  - After an approximately 0.04 rad persistent neutral error was reported, J6 controller zero was recalibrated at true supported physical neutral at 18:18 on 2026-08-10. Independent three-second read-only feedback stayed exactly 0.00000 rad with J6 disabled and no faults. The operator corrected the J6 range to exactly [-pi,+pi]; all software authorities agree and command-free planning qualification passes, but the expanded physical range remains unqualified. Tesseract planning treats J1-J6 equally using available controller/URDF limits and normal collision checks; camera-cable clearance belongs in scene geometry, not a J6-specific rule.
  - Preserve J6 and hand-eye history accurately: the old measured bounds remain invalid historical data and the proposed analytical hand-eye compensation failed physical testing and must not be reinstated. Never disguise controller-zero error in camera TF, URDF origins, mode-0 FK, or asymmetric command/feedback offsets. session_20260808_straight_mount preserves the independently solved PARK transform and its validation only as wrong-scale provenance because its samples encode 0.018 m squares and 0.013 m markers instead of the measured 0.017 m/0.012 m board; never restore or deploy that PARK result. Its deployed transform is the board-scale-independent operator-confirmed CAD mechanical registration. scan_viewpoint_executor startup must reject enable_real_arm_motion until mechanical_registration.physical_revalidation.status is passed; proposal-only planning and read-only TF remain available for completing that validation. The passed status is backed only by the exact corrected-scale five-pose report, whose stationary board target passed in base_link at every pose. Semantic target tracking cannot rewrite calibration authority. session_20260701_local is rollback history only.
  - Fixed-board TF validation must reject a pose until actual six-joint positions remain within 0.001 rad for a complete 0.75-second window. PiPER instantaneous velocity is noisy at rest and can briefly read low during disabled-arm sag; it is diagnostic only and must never admit a calibration frame. Clear the pre-trigger cached frame, then require ten new strict full-board observations.
  - The physical calibration-board authority is a 5x5 ChArUco board with 0.017 m squares and 0.012 m markers. Sample capture and fixed-board validation must share those exact defaults and persist them in every new record. Never reuse the former 0.018 m/0.013 m values or treat reprojection error as proof of metric scale. The valid corrected-scale board baseline is fixed_board_validation_registered_20260810_corrected_board.yaml; all five poses passed 15 mm and 1.5 degree limits.
