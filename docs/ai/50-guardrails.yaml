schema_version: 1
document: guardrails
hard_invariants:
  - Real-arm motion is opt-in; start_piper defaults auto_enable=false and perception/workflow defaults enable_real_arm_motion=false.
  - Never run the ROS PiPER driver and a direct piper_sdk calibration/reset process against CAN simultaneously.
  - Physical emergency stop/power procedure is authoritative; disable_piper.sh is not an emergency stop.
  - Motor enable/disable must use the installed SDK's feedback-confirmed EnablePiper/DisablePiper handshake at the required retry cadence, return success only after target feedback, and never bypass feedback confirmation. Do not interleave gripper commands with motor-enable retries.
  - GPU workers must remain ROS-free and unable to publish arm commands.
  - Orphan cleanup may signal only GPU process groups recorded by the wrapper whose names, live group leadership, and command paths pass validation; never use broad pkill patterns that could stop the driver or unrelated ROS nodes.
  - Current supervised_cube_workflow is dry-run and must retain no arm-command publisher.
  - The supervised workflow must retain every rclpy subscription for the node lifetime and must not decode full target clouds unless a newly accepted capture needs modeling; /piper/target_cloud uses best-effort sensor QoS and its subscriber must remain compatible. Cache the capture message while WAIT_CAPTURE so either cloud/status order can advance accepted_views and modeled_views together. Landmark/status loss or cloud callback starvation must fail closed before SCAN_READY.
  - Scan viewpoint execution is a separate module: proposal-only is the default and must not create a joint-command publisher; real motion requires launch opt-in plus exact fresh-plan approval.
  - The scan executor must never enable motors, must accept only finite speed values from 1 through 100 percent, preserve the gripper by publishing arm-only six-position commands, and abort to a current-position hold on failed safety gates. It must validate the worker's exact schema-v5 sdk_movej_targets_v1 start/target path, exact-zero derivative placeholders, selected aggregate SDK speed, target-order rate, and fresh controller-limit hash. It issues each target exactly once per viewpoint; MULTIVIEW_SCAN adds exactly one hash-bound collision-validated return target to `[0.0,-0.032,-0.026,-0.039,0.346,0.107]` after the final persisted capture, and only folded-start rough acquisition may add one proven bootstrap target. This is the nearest single-joint-qualified form of the requested feedback pose; do not restore its collision-rejected J3 value of +0.024 rad or weaken the link1/link5 and link2/link5 policy. The return is not counted or saved as a viewpoint. Dense collision samples are never commands. Fresh measured feedback must enter 0.025 rad; a 90-second target timeout or 20-second total-joint no-progress timeout aborts to hold. A return-only failure after all captures must keep the captures terminal, hold the exact current feedback pose, and report a warning without Step-4/5 recovery. Endpoint position plus velocity convergence remains mandatory. Never restore fixed-J6 planning or add a J6 lock or special cost.
  - Rough targets never imply tracking and never cause motion on receipt. Only one atomic /scan_target_acquisition/prepare request containing a valid unique session_id and fresh finite base_link PointStamped may create a command-free ROUGH_ACQUISITION proposal. Exact duplicate ID/payload retries are idempotent; the same ID with changed target data is rejected. source_request_id must survive through candidate, spool, typed plans, and GUI acceptance; exact plan/hash approval is still required.
  - Step 2 service-response recovery must preserve one immutable session/payload. Each 8-second attempt uses a fresh GUI client endpoint on a re-entrant two-thread executor; the first timeout permits one exact duplicate and the second returns to retryable FAILED without generating a new session. Definite rejection, cancel, or managed-stack generation change clears it. Late acknowledgements and plans from inactive attempts cannot enable Step 3, and the active correlated acquisition plan has a 185-second result deadline.
  - ROUGH_ACQUISITION is the only execution mode allowed without measured target tracking. Its first segment must remain schema-v5 bootstrap_static, collision-qualified, limited to the exact approved path, capture-free, and gated by fresh joints, arm status, controller motion limits, camera clock, robot/camera/cable/floor collision checks, feedback convergence, and hold-on-abort. Only this first segment may omit perception obstacles. Every later segment requires a fresh semantic result correlated to settled GroundingDINO; an exact zero-obstacle result constructs the timestamped typed empty scene directly, while any detected obstacle still requires depth-projected typed geometry and exact-path obstacle validation.
  - Every accepted settled MULTIVIEW_SCAN viewpoint must complete one service-triggered synchronized raw RGB/depth/camera-info/mask persistence operation before it is counted and execution advances. Workflow quality, occlusion, and optional cloud refinement remain diagnostic and must not precede or substitute for the primary saved-record contract. Missing, stale, unsynchronized, non-finite, or failed image output must abort to hold.
  - Full-resolution cloud refinement must pin the exact RGB-D cache entry selected by the matching heavy-refresh request ID and image stamp. Worker latency must not turn rolling-cache eviction into a false synchronization failure, and the existing 0.08-second RGB-D/mask tolerance must not be widened.
  - A transient missing/stale obstacle sample may be tolerated only while a MULTIVIEW_SCAN arm is already stationary in SETTLING, CAPTURING, CAPTURING_RGBD, or WAIT_CAPTURE. Before the next target, WAITING_FOR_RUNTIME_REFRESH must still receive fresh valid obstacle geometry within its bounded deadline; MOVING never receives this exception.
  - Acquisition success requires post-refresh measured TRACKING/LOCKED rather than prediction. The supervised workflow and GUI Step 4 must use the same fresh valid stable base_link TrackedTarget plus TrackingHealth TRACKING/camera_settled/nonprediction plus exact LOCKED status as their authoritative lock; /piper/target_landmark is diagnostic and must not independently block the handoff. ACQUIRED must hold, clear/cancel all remaining acquisition correlation state, ignore late heavy-worker statuses, start the workflow once, and wait for SCAN_READY without requesting a normal proposal; exhaustion must hold in ACQUISITION_FAILED. If the GUI-owned worker/scan stack is stopped, fresh settled nonprediction TrackingHealth may enable explicit Step 4 only to restart it; no adoption or plan request is allowed until the restarted workflow validates the full authoritative tuple. If acquisition is terminal but that tuple later becomes freshly valid, only explicit Step 4 may adopt the current lock as a new scan phase, start/restart workflow assessment, and wait for SCAN_READY. It must not change the acquisition result or reuse its approval. Only that explicit action may issue the later normal request.
  - Every acquisition GroundingDINO request must use a unique request ID and post-settle minimum image stamp. Ignore unrelated status, reject pre-settle images, allow 60 seconds only for the matching semantic job, and accept success only from a newer stable measured LOCKED target in base_link within 0.30 m of the rough hint.
  - Never turn target_mask_missing into an uncorrelated clear scene. Empty-scene publication is allowed only for the exact rough_acquisition_viewpoint result with obstacle_count=0 and its original image stamp. Obstacle-bearing target-missing results reserve ID 1 for the target, use IDs 2+ for obstacles, and require SAM2/depth projection before another move.
  - GUI automation may own only its Tesseract worker and scan stack. Driver/camera/perception remain external. Remove the GUI manual command publisher and prove zero publishers before launch. Step 1 must not report success and Step 2 must remain disabled until both owned parents remain alive, every required critical node/service exists, the worker heartbeat and TesseractReadiness sample are fresh with acquisition_ready=true, and command-publisher ownership is exact. After a bounded Foxy identity wait, require either the exact sole /scan_viewpoint_executor endpoint or one still-UNKNOWN endpoint jointly proven by the live GUI-owned stack and graph-present executor node. Never accept missing ownership evidence or more than one endpoint, auto-enable motors, or restore manual commands while another publisher remains.
  - GUI acquisition and scan confirmations are separate and are not general autonomy. The first binds only the displayed target-matching, session-matching acquisition execution hash; a late plan from another source_request_id is ignored. Explicit Prepare Scan from Current Lock requires a fresh authoritative measured lock; it may begin a new scan phase after a terminal acquisition, but cannot reuse or reinterpret that acquisition approval. It starts/restarts workflow assessment, waits for SCAN_READY, then creates one fresh correlated request; a second confirmation binds only its exact qualified 13-view execution hash. There is no reusable 15-minute authorization. Failure, cancel, retry, replan, changed plan, or process exit remains terminal for the phase that produced it.
  - Step 4 enablement depends on a freshly received settled measured TrackingHealth sample, never cached workflow status. Its stack/attempt generation owns all callbacks and its only phases are IDLE, STARTING_STACK, CHECKING_WORKFLOW, WAITING_SCAN_READY, REQUESTING_PLAN, WAITING_PLAN, PLAN_READY, and FAILED. Authoritative diagnostic assessment is bounded to 15 seconds; request queueing and result wait are bounded to 12 and 185 seconds. Step 4 must require multiview_ready and display multiview_blockers verbatim. Workflow PLAN_READY means clutter must be cleared manually; the GUI must not expose or approve the removal workflow.
  - The isolated worker must check its 150-second internal budget before every OMPL attempt and throughout adaptive collision validation, reserve five seconds for response serialization, and return a correlated success or rejection before the bridge's 180-second timeout and the GUI's 185-second deadline.
  - GUI and supervised-scan launchers must use source_piper_foxy_environment.sh and pass its exact package-prefix, scan_capture-import, PrepareAcquisition, TesseractReadiness, source_request_id, and schema-v5 recovery/timing checks before starting children. Never source or recreate a repository-root install overlay; generated colcon output belongs only under piper_ros_foxy.
  - GUI and supervised-scan ROS participants must load fastdds_gui_udp_only.xml with RMW_FASTRTPS_USE_QOS_FROM_XML=0 and effective ROS_LOCALHOST_ONLY=0. Foxy's native rmw endpoint QoS must retain reallocating histories for variable-size topics and services; the XML may govern only the participant transport, allowing UDPv4 on 127.0.0.1 and disabling builtin/shared-memory transports. Do not set ROS_LOCALHOST_ONLY=1 in this process tree because Foxy overrides the XML and silently restores the corrupt graph-discovery SHM path. This does not change the ROS_DOMAIN_ID=42 contract or the ROS-free Tesseract worker.
  - The Tesseract Foxy bridge and isolated worker must never publish /joint_ctrl_single, call /enable_srv, access CAN, or share DDS. The worker remains CPU-only, networkless, GPU-free, read-only except for its private bounded request/processing/response spool queues and atomic worker_health.json, and recreates the planning scene for every request. The bridge must require a fresh ready heartbeat with matching schema/backend and expose separate acquisition and multiview readiness blockers.
  - The rootless Tesseract setup may use network access only while fetching hash-verified/pinned dependencies. run_worker.sh and every qualification/planning process must use a fresh network namespace and minimal synthetic /dev; never expose host CAN, camera, or GPU devices.
  - When run_worker.sh is GUI-owned, its shell must remain Bubblewrap's direct parent while --die-with-parent is active; do not exec Bubblewrap from the GUI's short-lived startup thread. GUI process-group cancellation must still terminate both the supervising wrapper and isolated worker.
  - Tesseract motion must fail closed unless hashes/binding validate, deterministic_seed is 42, the plan is fresh, the exact trajectory hash is approved, and collision_model_qualified is true. Keep the global 0.005 m clearance. The sole exception is the first bootstrap_static ROUGH_ACQUISITION prefix under bootstrap_start_recovery: only named bounded start-model contacts, maximum 0.15 rad on one joint, dense monotonic improvement, and a normal-clearance endpoint. The exception and evidence must be hash-bound and independently checked by Foxy; it never authorizes physical collision or a globally disabled pair.
  - Normal scan completion uses the exact hash-bound return-home segment after all synchronized captures. A non-safety abort may retrace only already executed approved endpoints when fresh settled joint, arm, motion-limit, camera-clock, obstacle, and collision gates pass. Obstacle/collision/geometry, stale telemetry, hardware, joint-limit, progress, emergency-stop, command-ownership, and operator-cancel faults must hold rather than start return motion.
  - GUI Disable is never a direct service call. It must command the fresh current feedback pose through the sole current command owner, require maximum target error 0.025 rad and sample motion 0.005 rad for one continuous second, and only then call the feedback-confirmed disable service. Failure to prove the hold within eight seconds leaves motors enabled.
  - The qualified final validator is bounded adaptive dense-discrete Bullet over the exact post-ISP path, with at most 0.001 rad total joint change per interval and pair clearance inflated by a conservative relative-motion bound. Do not describe it as BulletCast, FCL, or exact continuous collision checking; the nanobind continuous-manager path is disabled after a repeatable segfault.
  - Proposal reachability and Tesseract snapshots require fresh arm-status and joint callbacks, not merely graph-visible endpoints. Scan bridge and reachability subscriptions must be created once, retained for node lifetime, and never destroyed/recreated in response to stale input; preserve reliable depth-1 latest-sample QoS and the validated staggered launch order. Missing/stale feedback remains fail-closed without DDS graph churn. Camera-timestamp-watchdog retry is a separate bounded recovery contract.
  - Preserve camera image timestamps through GPU spools and TF lookup; wall-clock result arrival is not measurement time.
  - Keep RealSense RGB and depth global_time_enabled so L515 hardware-clock drift is corrected at the source; set and verify both live sensor options after device open and fail startup if either remains false. Never trust launch overrides alone, hide drift by rewriting downstream image stamps, or widen the watchdog limit.
  - Camera timestamp health is fail-closed: large/future/backwards/missing stamps must force CAMERA_CLOCK_INVALID, speed scale zero, and scan proposal/execution rejection. Never repair this by silently rewriting measurement timestamps.
  - The GPU wrapper must not report successful perception startup until the watchdog node and exactly one health publisher are visible; bounded watchdog-only startup retries may precede downstream perception, but exhausted retries must tear down the owned stack.
  - Automatic vision restart requires reliable depth-1 latest-sample fresh joint positions stable within a conservative tolerance for the full settle duration; do not use noisy instantaneous PiPER velocity as the sole stationary test or allow a 200 Hz backlog to become the motion authority. While moving or when stationarity is unknown, abort/hold first and leave recovery pending. Restart camera plus all dependent perception state, not an isolated tracker session.
  - Retain watchdog image and joint rclpy Subscription objects for the full node lifetime; a discovered-then-garbage-collected joint endpoint makes stationary recovery permanently unavailable.
  - A stale watchdog joint endpoint may be recreated only as a read-only subscription on a bounded interval; never infer stationarity from the retry itself or request recovery until fresh stable positions satisfy the full settle gate.
  - Sample the per-frame color CameraInfo header rather than deserializing full RGB payloads in the watchdog; keep its lightweight callbacks on Foxy's standard single-thread executor so endpoint recreation is serialized with the joint callback. Do not restore the custom multi-thread callback groups that exposed endpoints but failed to deliver live joint feedback/health.
  - Do not update Kalman velocity from out-of-order measurements.
  - Keep target estimates in base_link for eye-in-hand motion; camera-space gates must not reject legitimate camera motion by default.
  - A target callback waiting for timestamped TF must not starve the tracker's TF subscriptions; retain concurrent executor capacity or replace the blocking lookup with an equivalent non-starving design.
  - Target3D depth-jump rejection must not permanently latch to a pre-motion depth. Reject isolated jumps, re-anchor only after the configured mutually consistent sample count/tolerance, clear stale camera-frame smoothing on re-anchor, and treat a nonpositive maximum jump as an explicitly disabled gate.
  - Tracking measurement freshness must cover the qualified live SAM2 inference interval and remain aligned with the executor's maximum tracking measurement age. The current value is 0.75 seconds; do not restore the former hard-coded 0.25-second health cutoff that forced speed scale zero during valid motion.
  - Serialize heavy refresh: never start a second semantic job while the current job is unacknowledged or running.
  - Low-confidence heavy refresh requires a valid TrackedTarget below 0.60 for one second, a settled camera, single-flight serialization, and 0.10 hysteresis before rearming; transient confidence dips must not create a refresh storm.
  - After the bounded recovery burst, an ABSENT target may be retried only at the configured slow interval and only while the camera is settled; periodic recovery must not become a refresh storm.
  - Never publish a zero-confidence stale mask as a valid heavy refresh seed.
  - Every SAM2 live seed must use the labelled objects manifest and object_NNN.png files. The removed objectless mask.png compatibility format must remain rejected.
  - Joint commands must pass both GUI and driver hard bounds; invalid saved bounds fall back to SDK-safe defaults.
  - piper_ctrl_single_node must send every JointCtrl target but not resend unchanged MotionCtrl_2 mode/speed. Six-position JointState commands are arm-only and must never send, zero, clip, warn about, or otherwise modify the gripper; only an explicit seventh position may produce a cached GripperCtrl. It must publish only fresh finite positive SDK controller velocity/acceleration feedback on /piper/motion_limits, reject values above the 3 rad/s and 5 rad/s2 protocol caps, and canonical-hash the exact values. Enable/disable must invalidate both command caches. Do not cache position targets or suppress the current-position hold.
  - PiPER telemetry uses the executor-owned 200 Hz timer; do not restore the unmanaged publication thread or Node.create_rate loop. Graph-visible endpoints and active CAN do not prove feedback delivery; downstream planning stays blocked until actual fresh samples arrive, and restart acceptance must use an application-level subscriber when Foxy CLI echo/hz is unreliable.
  - The production planning/Xacro J2 lower limit is the exact enabled compact-pose feedback -0.044796192 rad measured on 2026-07-30. Do not generalize it into invented bounds. Never clip a compact snapshot or disable a nonadjacent pair. Any folded-start exception must remain exactly the qualified hash-bound acquisition-only monotonic recovery policy.
  - Hand-eye startup must first resolve the RealSense static camera_link-to-camera_color_optical_frame edge, then consume reliable depth-1 joint feedback. Missing static TF fails closed; after a camera restart, confirm the full base_link-to-camera_color_optical_frame chain before planning.
  - The draggable STL editor must use only preview_-prefixed TF plus /piper_gui/preview_set and /piper_gui/preview_joint_states; its node and launch must never name or publish /joint_ctrl_single.
  - Mirroring a 3D preview onto hardware requires fresh feedback, zero arm error, conservative path acceptance, explicit confirmation, preserved gripper position, and a speed cap of 10 percent.
  - Manual preview mirroring does not consume live obstacle boxes; it must reject conservative robot/floor path failures and requires a physically clear supervised workspace.
  - Real-arm TF/RViz visualization must use display_live_robot.launch.py and consume /joint_states_single. The joint_state_publisher_gui dependency and command-coupled RViz launch were removed; do not reintroduce fake joint-state publication or publish/remap /joint_ctrl_single from visualization.
  - The real-driver launch must default auto_enable=false. Do not restore girpper_exist, rviz_ctrl_flag, RViz-specific gripper scaling, or any other compatibility input that changes current command units.
  - The piper_description joint origins must match the controller's modified-DH mode-0 convention; do not reintroduce the optional two-degree J2/J3 mode-1 correction.
  - J6 controller zero was recalibrated at physical neutral and verified at 0.000 rad on 2026-07-14, and the operator confirmed J6 fully safe on 2026-07-17. Tesseract planning treats J1-J6 equally using available controller/URDF limits and normal collision checks; camera-cable clearance belongs in scene geometry, not a J6-specific rule.
  - Preserve J6 history accurately: the old measured bounds remain invalid historical data, the proposed analytical hand-eye compensation failed physical testing and was removed, and the restored unadjusted transform remains deployed. Operational confirmation does not invent replacement bounds or a new calibration result, and the failed compensation must not be reinstated.
blast_radius:
  piper_ctrl_single_node.py: Real motion, motor enable, command units, bounds, feedback, every hardware test.
  piper_description_or_hand_eye: All base-frame geometry, tracking, obstacles, reachability, and scan plans.
  custom_msg_or_CMakeLists: Generated type support and every dependent node; clean focused rebuild required.
  sam2_spool_or_manifest: Both Python environments, live mask publication, recovery, object IDs, obstacles.
  target_tracker_or_tracking_params: Kalman stability, loss behavior, scan center, motion safety.
  launch_or_environment_scripts: Overlay/type identity, process duplication, DDS visibility and callback delivery, Foxy internal graph-deserialization memory behavior, GUI/scan loopback-only UDP profile enforcement, readiness-gated startup, critical-child process supervision, safety-node startup order, device ownership, cleanup behavior.
  camera_timestamp_watchdog_or_recovery: Tracking availability, TF measurement-time validity, all scan proposals/motion, and full GPU process ownership/restart behavior.
  scan_motion_or_executor: Real joint motion, camera pose IK, atomic rough-coordinate session binding including live-radius center ownership, no nominal-standoff overshoot through the base, bounded one-in-flight handoff retry, terminal cancellation against late statuses, one accepted spool request, source_request_id propagation, fresh-frame semantic correlation, shared authoritative measured target association, joint/floor/self/obstacle/camera-cable clearance, mandatory Tesseract all-six-joint planning, durable proposal QoS, schema-v5 controller-limit and trajectory hashes, exact SDK MoveJ position targets, feedback-gated advancement, target/no-progress aborts, arm-only no-gripper publication, approval/cancel behavior, selected 1-100 percent aggregate speed behavior, synchronized RGB-D capture sequencing, and tracking-health gating.
  gui_automation: Manual/automatic command ownership, worker/stack process ownership, readiness and service gating, critical-child exit handling, finite 1-100 percent speed validation, acquisition target/session binding, explicit current-lock request correlation, separate acquisition/scan approval scope, cancellation, and motor-enable separation.
  tesseract_planning_boundary: Untrusted worker parsing, schema-v5 plan-kind/provenance/source_request_id/observation-mode/OMPL_ISP/sdk_movej_targets_v1/effective-aggregate-speed/order-stamp-rate contract identity, worker heartbeat generation/freshness/readiness, controller velocity/acceleration values and hash validation, bounded seed-42 validation plus seed-before-planner initialization, spool ownership/atomicity, perception_snapshot versus bootstrap_static enforcement, valid-obstacle forwarding, model/calibration/limit binding, planning-scene reset, six-joint position-only target output with zero derivative placeholders and adaptive exact-direct-segment collision validation, collision qualification, and absence of command/enable/CAN/DDS/GPU/network capabilities.
must_retest_if_changed:
  arm_driver: [driver unit/static checks including monotonic feedback-loop regression and enable-handshake success/disable/timeout, repeated MotionCtrl_2 and GripperCtrl cache suppression plus cache reset on enable/disable, every JointCtrl target still emitted, auto_enable false startup, sustained exact-QoS /joint_states_single and /arm_status delivery after graph/process churn, approximately 200 Hz cap, enable/disable service with workspace clear and emergency stop ready, bound clipping without exceeding physical limits]
  tf_or_calibration: [URDF versus mode-0 FK regression test, read-only live robot_state_publisher launch, world-to-link6 TF chain lookup, fixed-board validation, camera TF chain lookup, stationary target base-frame repeatability over representative joint poses]
  tracking: [test_tracking_recovery.py including low-confidence persistence/hysteresis, test_depth_to_3d.py including isolated-jump rejection/consistent reacquisition/disabled gate, test_mask_reprojection.py, target-landmark concurrent TF lookup, static cube, small supervised arm-motion test, live confidence-triggered single-flight heavy refresh]
  camera_timestamp_safety: [test_camera_timestamp_health.py, clean interface build, typed health echo, missing/stale/future/backwards stamp rejection, 15-frame startup gate, latest-sample joint QoS under 200 Hz feedback, stable-position acceptance despite noisy velocity, real position-motion suppression, explicit missing-versus-settling reason, stationary-only request, moving/unknown suppression, capped supervisor backoff, fresh post-restart target/TF validation, no new /joint_ctrl_single publisher]
  semantic_or_live_workers: [AI worker suite, spool atomicity, one initial refresh, target ID 1 reservation, obstacle IDs 2+ with and without a detected target, obstacle-only SAM2 propagation, two-attempt recovery burst, periodic ABSENT retry timing, motion suppression, single-flight recovery]
  gpu_pipeline_process_ownership: [bash syntax, atomic manifest creation/update/removal, normal Ctrl+C cleanup, wrapper-loss orphan cleanup, stale/PID-reuse rejection, driver/GUI/TF/executor survival]
  ros_messages: [clean piper_mobile_manipulation build, colcon tests, fresh sourced terminals, topic echo deserialization]
  scan_or_workflow: [test_supervised_workflow.py including cloud-before-status and status-before-cloud ordering, /piper/target_cloud publisher/subscriber QoS compatibility, obstacle geometry tests including TF-listener recovery, valid unsafe obstacle forwarding and invalid-geometry rejection, start/approve/confirm/capture/finish/abort/diagnostic_state service smoke, dry-run invariant, accepted_views and modeled_views advance together]
  scan_motion_or_executor: [test_scan_motion.py including exact start/final target/optional-bootstrap shape, zero derivatives, order stamps, one command per normal viewpoint, validation-only 0.025 rad sampling, feedback-gated advancement, target/no-progress aborts, free J6, and no fixed J6; measured-lock helper and GUI Step 4 tests including terminal-acquisition current-lock adoption; test_scan_capture.py; test_scan_target_acquisition.py including atomic prepare idempotency, session non-rebinding, source_request_id propagation, and late-status cancellation terminality; driver command-cache, arm-only no-GripperCtrl, and PiperMotionLimits freshness/hash/cap tests; clean focused build; focused ROS tests; both rootless qualification suites including direct-path obstacle rejection; isolated proposal-only launch with mandatory bridge; no proposal-mode joint publisher; typed plan/status target_center/source_request_id/plan_kind/speed/rate/policy/limit-hash echo; wrong/expired/trajectory-hash/limit-hash/session mismatch approval rejection; stale/future/wrong-frame rough-target rejection; five distinct centered acquisition poses; acquisition-only no-tracking gate; first-segment bootstrap-static exception only; correlated scene required before every later acquisition move; explicit zero-obstacle clear scene; obstacle-only IDs 2+ path; stale/invalid scene hold; exact request/image-stamp correlation; 10/60/10/15 timeout paths; post-result measured LOCKED target within 0.30 m; five-look acquisition exhaustion; ACQUIRED starts workflow but no scan request; explicit adoption requires authoritative measured lock, starts workflow, waits for SCAN_READY, and never changes the prior terminal result; explicit normal request and exact plan correlation; separate scan confirmation; all-six-joint limit/collision/camera-cable tests; tracking-speed-drop replan; endpoint position/velocity settle; synchronized RGB-D capture sequencing; new one-view 5-percent sdk_movej_targets_v1 acceptance; cancel-hold test; then complete exact 13-view accepted-and-modeled capture test; characterize measured motion before accepting higher speeds]
  tesseract_planning_boundary: [test_contract.py schema/hash/source_request_id binding, atomic and bounded worker heartbeat tests, stale/malformed/wrong-generation heartbeat bridge rejection, test_model_builder.py, test_collision_meshes.py deterministic containment/hash checks, test_worker_validation.py unknown/excessive/worsening/uncleared recovery rejection, test_scan_motion.py Foxy monotonic proxy checks, bridge freshness and stable-subscription tests, mode-0 FK, free six-joint/J6 timing, all-zero and exact compact-start acquisition, blocking-box detour, bounded exact-path Bullet validation, stale/hash/fuzz rejection, proposal-only ROS graph, then supervised one-view 5-percent acquisition and cancel-to-hold]
  gui_or_3d_joint_preview: [test_piper_gui_automation.py including finite 1-100 percent automation speed validation, exact publisher-identity rejection, startup readiness/service gates, worker/scan parent exit handling, session-mismatched plan rejection, separate acquisition and scan approvals, acquisition cannot authorize scan, current measured-lock adoption after terminal acquisition, workflow-start/SCAN_READY wait, request/plan correlation, and one-use scan approval; bounded live Foxy _UNKNOWN_ endpoint-resolution check; preview quaternion/limit tests; GUI import/start; preview-only launch; six interactive markers; preview_-prefixed TF lookup; external publisher and duplicate-stack refusal; manual publisher removal/restoration; exact rough target binding; selected speed shown in each exact approval; no reusable time-window approval; cancel/process-exit hold; driver/camera/perception survival; private preview set/state round trip; stale/error/path rejection; one small 5-percent supervised single-joint mirror; driver bounds; live TF convergence]
  launch_or_environment_scripts: [bash syntax, deliberately contaminated-shell preflight, exact canonical package prefixes, scan_capture import, PrepareAcquisition/TesseractReadiness/source_request_id and all bootstrap_recovery TesseractPlan fields, critical-child OnProcessExit shutdown static test, test_gui_transport_profile.py, XML parse, no-/dev/shm unused-domain probe, bounded domain-42 idle GUI RSS, bounded Step-1 GUI/child RSS, unchanged GroundingDINO/SAM2 PIDs, no new kernel OOM, GUI-owned child cleanup, clean canonical focused rebuild, GUI/scan child process startup, killed-critical-child parent shutdown, no repository-root install path in child environment]
risky_change_areas:
  - Unit conversions between SDK integer telemetry, radians, metres, degrees, and millimetres.
  - TF direction and calibration-frame composition in publish_hand_eye_tf.py.
  - QoS changes on camera/mask topics; sensor-data publishers and subscribers must remain compatible.
  - Queue cleanup; restrict deletion to validated /tmp/piper_heavy_refresh*, /tmp/piper_sam2_live*, and /tmp/piper_vision_recovery roots.
  - JSON String payload changes, which have no compile-time schema.
  - Raising reach limits to make a viewpoint pass; current reachability is not IK or collision proof.
  - Treating the executor's conservative link capsules and obstacle AABBs as equivalent to full mesh/world collision checking; physical supervision remains mandatory.
  - Treating the 2026-07-23 qualification as permanent after changing the camera/mount/cable envelopes, collision geometry, ACM, margins, planner, timing, or validator; such changes require the complete qualification suite again.
  - Reusing bootstrap recovery outside ROUGH_ACQUISITION segment zero, expanding its pair/depth/delta policy, accepting inconsistent metadata, or validating only the suffix. Such changes require review, tests, core qualification, compact qualification, and supervised acceptance.
  - Installing legacy tesseract-robotics 0.4 on Focal as a production shortcut or claiming the unexecuted 0.35 container API is already qualified.
  - Running the GUI, reset scripts, or another /joint_ctrl_single publisher with the motion-enabled scan executor.
  - Treating either exact GUI confirmation as permission for the other phase, retries, replans, more than one normal scan, more than five scan views, motor enable, or process ownership outside its worker/scan children.
  - Changing waypoint spacing, feedback tolerance, progress/timeout behavior, driver MoveJ mode, aggregate-speed encoding, arm-only gripper behavior, or command caching without regenerating the execution hash contract, rerunning both Tesseract qualifications, and repeating supervised low-speed motion acceptance.
  - Treating the draggable STL display or conservative capsule checks as a full 3D mesh/world collision planner.
  - Restoring the deleted Gazebo/transmission/config stubs inside the production URDF instead of creating a separately owned simulation model and qualification path.
refactor_rules:
  - Extract pure helpers before rewiring nodes; retain topic names, stamps, frames, and dry-run fields during the first patch.
  - Add typed ROS messages for stable JSON contracts before broad consumers multiply.
  - Keep source, launch/config, tests, and docs aligned; generated build/install output is never the edit target.
  - Keep hardware execution as a separate explicit module with approval, IK, joint limits, collision checks, cancellation, and health gating; never hide it inside the dry-run coordinator.
  - Preserve unrelated dirty-worktree changes and inspect diffs before modifying overlapping files.
