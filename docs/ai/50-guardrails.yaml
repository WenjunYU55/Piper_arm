risky_change_areas:
  - Unit conversions between SDK integer telemetry, radians, metres, degrees, and millimetres.
  - Treating mechanical CAD dimensions as a calibrated camera optical transform; mesh scale and nominal fit do not measure assembly, print, screw, sensor-frame, or optical tolerances.
  - TF direction and calibration-frame composition in publish_hand_eye_tf.py.
  - QoS changes on camera/mask topics; sensor-data publishers and subscribers must remain compatible.
  - Queue cleanup; restrict deletion to validated /tmp/piper_heavy_refresh*, /tmp/piper_sam2_live*, and /tmp/piper_vision_recovery roots.
  - JSON String payload changes, which have no compile-time schema.
  - Reintroducing or tuning static reach/workspace limits to make a viewpoint pass; command-free filter acceptance is not IK or collision proof and Tesseract must remain the authority.
  - Treating the executor's conservative link capsules and obstacle AABBs as equivalent to full mesh/world collision checking; physical supervision remains mandatory.
  - Treating the 2026-07-23 qualification as permanent after changing the camera/mount/cable envelopes, collision geometry, ACM, margins, planner, timing, or validator; such changes require the complete qualification suite again.
  - Reusing bootstrap recovery outside ROUGH_ACQUISITION segment zero, expanding its pair/depth/delta policy, accepting inconsistent metadata, or validating only the suffix. Such changes require review, tests, core qualification, compact qualification, and supervised acceptance.
  - Installing legacy tesseract-robotics 0.4 on Focal as a production shortcut or claiming the unexecuted 0.35 container API is already qualified.
  - Running the GUI, reset scripts, or another /joint_ctrl_single publisher with the motion-enabled scan executor.
  - Treating either exact GUI confirmation as permission for the other phase, retries, replans, more than one normal scan, more than five scan views, motor enable, or process ownership outside its worker/scan children.
  - Changing waypoint spacing, feedback tolerance, progress/timeout behavior, driver MoveJ mode, aggregate-speed encoding, arm-only gripper behavior, or command caching without regenerating the execution hash contract, rerunning both Tesseract qualifications, and repeating supervised low-speed motion acceptance.
  - Treating the draggable STL display or conservative capsule checks as a full 3D mesh/world collision planner.
  - Restoring the deleted Gazebo/transmission/config stubs inside the production URDF instead of creating a separately owned simulation model and qualification path.
refactor_rules:
  - Extract pure helpers before rewiring nodes; retain topic names, stamps, frames, and dry-run fields during the first patch.
  - Add typed ROS messages for stable JSON contracts before broad consumers multiply.
  - Keep source, launch/config, tests, and docs aligned; generated build/install output is never the edit target.
  - Keep hardware execution as a separate explicit module with approval, IK, joint limits, collision checks, cancellation, and health gating; never hide it inside the dry-run coordinator.
  - Preserve unrelated dirty-worktree changes and inspect diffs before modifying overlapping files.
autonomous_mission_guardrails:
  - Acquire the supported launcher singleton lock before creating any ROS participant. More than one /piper/run_target_scan server or coordinator process is a stop condition; never submit a GUI goal into that graph.
  - Keep driver auto_enable=false; only the bounded mission owner calls enable after preflight and authorization.
  - Automatic startup is dependency-ordered and readiness-driven: never replace current-generation joint, healthy camera/CUDA, new hand-eye TF, new Tesseract heartbeat generation, typed acquisition readiness, or the repeated pre-enable settled-feedback barrier with fixed sleeps or graph endpoint visibility.
  - Every loop inside a bounded startup barrier must invoke the mission guard. Cancellation, deadline expiry, heartbeat loss and child exit must interrupt driver, joint, camera, hand-eye and worker waits without waiting for the dependency timeout.
  - Never disable an enabled arm until the exact fresh feedback pose is held and one second of settled feedback is proved.
  - Ordinary joint feedback may use only the 0.005-rad hard-capped encoder boundary tolerance, after powered J3 was observed at +0.002460 rad. The separate operator-qualified 0.3-rad band may apply only to the exact first measured point of a dedicated configured-home direct request after disable relaxation; never apply either allowance to a command goal, acquisition, multiview, manipulation, or normal collision validation.
  - Never stop or SIGKILL a live command owner when hold/disable is unproved; return NEEDS_OPERATOR and keep the tracked robot paused.
  - Mission process generations may clear only fully stopped historical entries. If any prior group is still live, the new mission is not its owner: reject admission with NEEDS_OPERATOR and do not run that new session's shutdown against the prior command owner.
  - Network loss, cancellation, deadline, child exit, service timeout, stale generation, and wrong request ID trigger bounded safe shutdown, not retry loops.
  - Coordinator SIGINT is cancellation authority, not permission to destroy DDS or owned child groups immediately. Keep callbacks alive through home, hold, disable, and process cleanup; preserve the 180-second launch escalation window.
  - The tracked base remains stationary and braked throughout arm work; TF does not prove the brake.
  - External frames use piper_* prefixes; qualified local motion frames remain behind the spool gateway.
  - MISSION_POLICY is task/hash/deadline-bound and disabled in manual GUI launches.
  - Hands/persons are terminal; leaf/branch contact requires two-view depth ordering, at least five-percent occlusion, predicted benefit, bounded uncertainty, and manipulation_ready=true.
  - Keep manipulation_model_qualified=false until gripper TCP/open/closed, attached-object, allowed-contact, pick, push, and placement physical qualification completes.
  - Automatic success requires 8-24 persisted views, two on each Y side of the frozen measured target, 120 degrees of azimuth, 25 degrees of elevation and three consecutive measured novel-surface gains at or below 0.02. Eight is a model-seed floor, not a fixed target. The first count satisfying all floors completes; strict no-safe-view proof never waives the seed or floors. Ordinary no-plan, timeout, malformed response, low-diversity maximum, or worker failure cannot become success. Completion still requires approved current-state home, current hold, feedback-confirmed disable, and all owned children stopped. Manual batch confirmation retains its exact 13-view contract.
  - Arbitrary target text must be sanitized before it becomes a model prompt; bind target_label, resolved profile and target_prompt into the mission hash, GPU capture context, every scan record and the result summary. Keep the calibrated green_cube appearance policy strict; generic targets still require semantic confidence and nontrivial mask support.
  - Cancellation and every controllable failure stop at current feedback and request a fresh direct current-to-home target; they never replay scan history. Collision/perception evidence is deliberately not consulted for dedicated home. Its exact measured start may use at most the 0.3-rad post-disable relaxation allowance, but goals cannot. Emergency stop, missing/nonfinite feedback, feedback beyond that allowance, untrustworthy CAN/control/command authority, waypoint/no-progress failure or missing hold proof forbids the command and leaves the arm enabled in current-position hold with NEEDS_OPERATOR.
