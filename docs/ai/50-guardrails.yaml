single_capture_transaction_guardrail_2026_09_03:
  invariants: [one Trigger request owns one non-resettable absolute deadline, stale or missing diagnostics are never admitted, exactly one prospective 20-frame burst is used, a mask is frozen only with its exact fresh RGB-D partner and native-burst overlap, an unmatched newer mask cannot hide an older valid pair, only future-TF preparation may wait after pair selection, final quality and occlusion are copied atomically and bound to commit metadata and response, every malformed geometry confidence and persistence error remains fail closed]
  prohibited: [resetting the capture deadline on evidence updates, recollecting a new burst for every diagnostic pulse, freezing the latest mask before proving its RGB-D partner, accepting nearest rather than exact mask/RGB identity, swapping the frozen pair mid-preparation, widening one-second freshness or synchronization thresholds, externally retrying CAPTURE_EVIDENCE_TIMEOUT ten times, weakening capture or execution safety]
  blast_radius: [settled capture latency, capture failure routing, schema-2 evidence provenance, executor WAIT_CAPTURE diagnostics]
  must_retest_if_changed: [test_scan_capture.py delayed evidence transaction preparation and atomic admission, test_failure_model.py terminal timeout classification, test_phase1_executor_characterization.py, complete mobile suite, package build, separately authorized physical E2E]
population_scoped_visual_ray_guardrail_2026_09_03:
  invariant: A post-settle visual rejection excludes only its exact ray for the lifetime of the current bootstrap or qualified population. Accepted-count changes must not revive it. It must not cross an explicit population replacement, become a permanent hard cull, retire an angular neighbourhood, or remove reserve rays. The first-capture cropped-view path must retain the same ray and move only its minimum standoff outward.
  planning_load_invariant: Generic MotionPlanStatus PLANNING may pause only multiview candidate generation and reachability prequalification. Tracking, planner health and responses, collision checks, authorization, execution monitoring, capture evidence and cancellation must remain live. Independent planner and executor pause flags cannot clear each other.
  must_retest_if_changed: [scan_viewpoint_executor_node.py record_rejected_view, scan_session_memory.py rejection validation, scan_viewpoint_planner_node.py quarantine or planner status, viewpoint_reachability_filter_node.py planner status, planning/generation.py blocking states, scan_planning_params.yaml status topics, bridge reserve or exhaustion ownership]
  required_checks: [same-population exclusion after accepted-count advance, next-reserve availability, bootstrap-to-qualified reset with reused numeric ID, historical missing-field compatibility, malformed population-phase rejection, framing-retry exception, permanent-cull monotonicity, planner and execution quiescence overlap, complete mobile and Tesseract suites, command-free replay]
