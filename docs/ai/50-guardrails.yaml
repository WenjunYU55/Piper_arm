capture_one_occlusion_barrier_guardrail_2026_08_27:
  invariants:
    - Rough ACQUIRED and initial workflow SCAN_READY prove measured target lock only. They do not prove semantic clearance and must not dispatch the dedicated workflow probe.
    - Run the probe only after the first scan endpoint has passed target-facing aim and framing and its synchronized RGB-D files plus capture-bound model seed exist.
    - Capture one remains pending and accepted_views remains zero during the probe. Its model seed cannot enter scan history, revolution, coverage or qualified ray generation until correlated evidence is classified as clear or qualified labelled occlusion.
    - Persistence still requires fresh GOOD target-valid and confidence-qualified depth evidence. CLEAR accepts directly. Any capture may admit fresh classified PARTIALLY_OCCLUDED or HEAVILY_OCCLUDED evidence only into the pending semantic barrier; UNKNOWN LOST missing stale and malformed evidence fail closed.
    - The executor's 75-second semantic-capture acceptance bound must cover the workflow's 70-second probe plus propagation reserve for any pending classified-occlusion capture. Do not extend the ordinary 20-second RGB-D or CLEAR-acceptance deadline to hide a semantic timeout.
    - A qualified meaningful occluder reports every selected semantic label and continues the collision-aware scan. No automatic pick push place or contact plan is authorized from this path, and occluded pixels cannot become trusted measured target surface.
    - Only the first MULTIVIEW_SCAN alignment may start outside the normal 20-degree visibility cone. It cannot exceed its acquired start angle, cannot leave the normal cone after entering, and must terminate within 5 degrees. The executor independently checks achieved FK within 5 degrees before capture and every later scan path remains inside 20 degrees throughout.
    - Missing target, worker failure, timeout, stale or mismatched correlation, unsafe blocked invalid geometry and unqualified occluder evidence remain fail-closed.
    - Schema-2 measured coverage and reconstruction consume confidence-qualified target depth/support. Raw aligned depth under a broad SAM mask may never promote an occluder into target truth.
  blast_radius: [post-acquisition alignment, bootstrap first-ray admission, every capture transaction, semantic obstacle scene, label persistence, model-seed promotion, measured coverage, revolution timing, qualified ray population, executor failure propagation, terminal shutdown]
  must_retest_if_changed: [test_supervised_workflow.py, test_phase1_executor_characterization.py, test_scan_motion.py, test_scan_capture.py, test_surface_coverage.py, reconstruction tests, complete mobile and Tesseract suites, affected package build, AI YAML parse, separately authorized low-speed physical E2E]
