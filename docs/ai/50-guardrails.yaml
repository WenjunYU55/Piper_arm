rough_acquisition_partial_target_guardrail_2026_08_27:
  invariants:
    - Box aspect is not reliable for a partly clipped cube and cannot veto an otherwise qualified rough_acquisition_viewpoint target.
    - The exception is bound to the exact private request reason and strict box-aspect validation remains the default for every other request.
    - Semantic confidence requested-label matching green appearance nonempty SAM2 target support and qualified aligned depth remain mandatory before measured tracking LOCKED.
    - Rough lock does not authorize capture model promotion; settled achieved-FK aim framing capture quality and all planning execution and safety gates remain independent.
  blast_radius: [rough target discovery, heavy-worker request provenance, GroundingDINO target role, SAM2 seed creation, measured tracking lock]
