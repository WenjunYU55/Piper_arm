    - Telemetry callbacks may run concurrently only by atomically updating TelemetryStore and compatibility mirrors; control logic consumes immutable snapshots.
    - Approval cancel hold diagnostic and capture response handling must remain serviceable while the 200 Hz timer and planner/workflow topics are active.
    - No scheduler change may add a joint-command publisher weaken exact plan hashes drop or burst trajectory samples alter following limits or enable real motion by default.
