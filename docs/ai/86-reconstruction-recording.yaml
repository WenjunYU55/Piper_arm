schema_version: 1
native_runtime_followup: docs/ai/87-bundlesdf-native-runtime.yaml
reconstruction_active_planner: curobo  # Preserved saved mission selection; Tesseract checks are compatibility only.
title: Passive synchronized RGB-D recording and optional offline BundleSDF
date: '2026-09-06'
owner_module: reconstruction_recording
runtime_dependency: python3-scipy declared for optical transform quaternion conversion; BundleSDF remains external.
reference: docs/architecture/reconstruction_recording.md
previous_behavior: Stationary accepted viewpoints save one RGB and median of approximately 20 depth frames; no synchronized
  raw moving reconstruction sequence. Movement optical checks duplicated a 20 degree default.
reason: Offline object reconstruction needs timestamped aligned RGB/depth/mask/intrinsics and poses without changing
  mission captures or safety.
architecture:
  reference: docs/ai/86-reconstruction-recording.yaml
  flow:
  - existing stationary median capture persists
  - raw tuple pin and executor accepted history rendezvous
  - existing frozen coverage target and image-stamped TF
  - passive bounded admission worker
  - bounded PNG/NPY writer
  - native manifest
  - offline validator and pinned BundleSDF adapter
  load_order_contracts:
  - visibility.py stays ROS-free and is importable in both external worker environments
  - ReconstructionKeyframe and additive MotionPlan field require rebuilding all ROS interfaces before launch
  - optional passive recorder starts at 3.25 seconds after stationary capture at 3.0; existing motion roles and
    critical exit handling unchanged
  - BundleSDF Python CUDA and weights stay outside Foxy workspace
ownership:
  owner_module: reconstruction_recording
  allowed_edit_paths:
  - piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/visibility.py
  - piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/reconstruction_recorder_node.py
  - piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/reconstruction_recording/
  - piper_ros_foxy/src/piper_mobile_manipulation/config/reconstruction_recording_params.yaml
  - piper_ros_foxy/src/piper_mobile_manipulation/msg/ReconstructionKeyframe.msg
  - tools/bundlesdf/
  - tests/reconstruction/
  must_not_move_without:
  - piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_capture_node.py
  - piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/scan_viewpoint_executor_node.py
  - piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/execution/motion.py
  - piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/configuration.py
  - piper_ros_foxy/src/piper_mobile_manipulation/launch/supervised_viewpoint_execution.launch.py
  - piper_ros_foxy/src/piper_tesseract_foxy/piper_tesseract_foxy/bridge_node.py
  - piper_ros_foxy/src/piper_tesseract_foxy/piper_tesseract_foxy/protocol/contract.py
  - piper_ros_foxy/src/piper_tesseract_foxy/piper_tesseract_foxy/worker.py
  - motion_planning/curobo/worker.py
  authority: Mission engine retains transitions; executor retains accepted count and frozen coverage target; recorder
    owns no command authority. visibility.py owns movement default and optical geometry.
  reference: docs/ai/86-reconstruction-recording.yaml
contracts:
  reference: docs/ai/86-reconstruction-recording.yaml
  public_interfaces:
    ReconstructionKeyframe: task_id, raw sensor_msgs RGB/depth/mask and CameraInfo; best-effort producer and subscriber
    MotionPlan: additive float64 target_visibility_angle_tolerance_deg; zero legacy field means shared default;
      mismatch rejects
    scan_session_history: additive central angle and per-entry reconstruction_stamp_ns; existing accepted count
      remains authoritative
    reconstruction_recording_status: passive JSON counters and session state
  visibility: Shared default 20 degrees, finite (0,90), inclusive microdegree allowance; startup frozen. Legacy
    max(movement, final aim) motion exception remains; recorder inherits central movement setting without that exception.
  native_pose: T_base_camera maps optical-camera coordinates to base_link; never an object pose. Exact nanosecond
    image and lookup stamps; no latest fallback.
  output: Lossless RGB/mask PNG and original depth NPY; complete or explicitly incomplete atomic session rename;
    separate converter writes upstream uint16 millimetre PNG.
parameters_source:
- piper_ros_foxy/src/piper_mobile_manipulation/config/reconstruction_recording_params.yaml
- piper_ros_foxy/src/piper_mobile_manipulation/config/scan_execution_params.yaml
- piper_ros_foxy/src/piper_mobile_manipulation/config/scan_quality_params.yaml
- piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/visibility.py
edge_cases:
  reference: docs/ai/86-reconstruction-recording.yaml
  manual_smoke_checks:
  - Run tests/reconstruction including actual DDS replay at 20, 10 and 5 degrees; verify two mission captures versus
    six reconstruction frames per completed scan
  - Replay compatible allowlisted bag in isolated unused domain; verify SIGINT journal and two consecutive missions
  - Verify first tuple is raw synchronized data and invalid frame zero prevents later moving admission
  - Validate and convert session; exercise pinned upstream reader; separately run official GPU sample and check
    actual mesh
  - On real arm/camera retest existing capture, target visibility, mask freshness, collision and following-error
    guards before physical qualification
  failure_modes:
  - Missing or rejected initial raw tuple prevents reconstruction; mission continues
  - Queue saturation drops reconstruction work only
  - Missing TF, stale mask, clipping, invalid calibration/depth and blur are counted rejects
  - Final completion waits bounded time for pending accepted keyframes; missing keyframes reported; abort and shutdown
    stay incomplete
guardrails:
  reference: docs/ai/86-reconstruction-recording.yaml
  invariants:
  - Never count reconstruction frames as mission captures or alter NBV/state transitions
  - Never use median depth, latest TF or rectangular fallback for reconstruction
  - No image encoding/disk I/O in motion callbacks; passive recorder failures do not stop motion
  - All consumers bind the same startup angle; reject live partial updates
  - Do not install BundleSDF dependencies or commit weights/datasets/meshes in ROS
  - Retain static capability map arrays; worker provenance update requires static sampler/collision audit
  must_retest_if_changed:
    piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/visibility.py:
    - three consumer boundary tests
    - request/response binding tests
    - rootless core and compact
    - GPU consumer checks
    piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/reconstruction_recorder_node.py:
    - actual DDS nominal/failure replay
    - bag replay and SIGINT
    - bounded queues and multiple missions
    piper_ros_foxy/src/piper_mobile_manipulation/piper_mobile_manipulation/reconstruction_recording/core.py:
    - all gate tests
    - atomic writer interruption and disk failure
    - native dataset validation/conversion
    piper_ros_foxy/src/piper_mobile_manipulation/msg/ReconstructionKeyframe.msg:
    - colcon build all
    - capture raw tuple fixture
    - sensor QoS replay
    piper_ros_foxy/src/piper_mobile_manipulation/msg/MotionPlan.msg:
    - colcon build all
    - wire characterization
    - planner/executor mismatch rejection
    tools/bundlesdf/:
    - native conversion and corrupt input tests
    - pinned upstream reader
    - official GPU mesh smoke
  blast_radius: Additive wire rebuild affects launch participants; recording default false. Planner selection, median
    capture and safety policies stay with their existing owners.
evidence:
  report: docs/experiments/reconstruction_recording_validation.md
  full_pytest: 1550 passed, 22 skipped, one proven baseline ray-ranking failure
  ros_replay: Three completed six-frame/two-capture scans at 20/10/5 degrees plus three one-frame aborted sessions;
    21 accepted, 12 gate rejects, zero backpressure drops
  rootless: Compact PASS; core thin-obstacle detour failure exactly reproduced at baseline
  bundlesdf: Pinned reader loaded six converted frames; actual reconstruction failed missing torch, isolated setup
    initial checkpoint blocked by missing Docker and official sample quota; superseded for native synthetic GPU execution by 87-bundlesdf-native-runtime.yaml
  hardware: No physical arm or camera validation performed
remaining:
- Run official supplied BundleSDF sample when download quota clears; later native GPU installation and synthetic smoke are recorded in 87-bundlesdf-native-runtime.yaml
- Calibrate blur and mask-area-growth gates against real tracked objects and camera exposure
- Physical arm/camera load, TF timing, tight-cone feasibility and slow-storage qualification
- Resolve pre-existing ray hard-cull ranking regression and rootless thin-obstacle clearance qualification separately
- Live multi-node atomic parameter updates are deliberately unsupported; relaunch between missions
