<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="986" viewBox="0 0 900 986" role="img">
<title>Robot Hardware and Integration Boundaries</title>
<desc>The physical platform, current PiPER/L515 scan hardware and optional enclosure-mounted sensors. Tracked-base drive, brake authority and repositioning are outside the current PiPER_arm command boundary.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5b6470"/>
  </marker>
  <marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2a7f76"/>
  </marker>
  <style>
    .title{font:600 28px Arial,Helvetica,sans-serif;fill:#1f2937}
    .subtitle{font:14px Arial,Helvetica,sans-serif;fill:#5b6470}
    .stage{font:600 16px Arial,Helvetica,sans-serif;fill:#1f2937}
    .detail{font:13px Arial,Helvetica,sans-serif;fill:#374151}
    .index{font:600 13px Arial,Helvetica,sans-serif;fill:#ffffff}
    .edge-label{font:12px Arial,Helvetica,sans-serif;fill:#2a7f76}
    .legend{font:12px Arial,Helvetica,sans-serif;fill:#4b5563}
    .note{font:12px Arial,Helvetica,sans-serif;fill:#6b7280}
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450.0" y="42" class="title" text-anchor="middle">Robot Hardware and Integration Boundaries</text>
<text x="450.0" y="69" class="subtitle" text-anchor="middle">The physical platform, current PiPER/L515 scan hardware and optional enclosure-mounted sensors.</text>
<path d="M 450.0 209 L 450.0 238" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 331 L 450.0 360" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 453 L 450.0 482" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 575 L 450.0 604" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 697 L 450.0 726" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="135" y="126" width="630" height="78" rx="12" fill="#eceff1" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="98" cy="165.0" r="17" fill="#4b5563"/>
<text x="98" y="170.0" class="index" text-anchor="middle">1</text>
<text x="450.0" y="157" class="stage" text-anchor="middle">Bunker Pro 2 tracked platform</text>
<text x="450.0" y="181" class="detail" text-anchor="middle">Carries the enclosure, sensor station and arm mounting structure</text>
<rect x="135" y="248" width="630" height="78" rx="12" fill="#e8f1fb" stroke="#2f6b9a" stroke-width="1.6"/>
<circle cx="98" cy="287.0" r="17" fill="#2f6b9a"/>
<text x="98" y="292.0" class="index" text-anchor="middle">2</text>
<text x="450.0" y="279" class="stage" text-anchor="middle">Enclosure v4</text>
<text x="450.0" y="303" class="detail" text-anchor="middle">Protects compute and power hardware; CAD includes panels, frame, battery and sensor mounts</text>
<rect x="135" y="370" width="630" height="78" rx="12" fill="#eceff1" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="98" cy="409.0" r="17" fill="#4b5563"/>
<text x="98" y="414.0" class="index" text-anchor="middle">3</text>
<text x="450.0" y="401" class="stage" text-anchor="middle">PiPER arm mounting tree</text>
<text x="450.0" y="425" class="detail" text-anchor="middle">base_link to arm_base_link mount with the piper_base_link gateway identity frame</text>
<rect x="135" y="492" width="630" height="78" rx="12" fill="#eceff1" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="98" cy="531.0" r="17" fill="#4b5563"/>
<text x="98" y="536.0" class="index" text-anchor="middle">4</text>
<text x="450.0" y="523" class="stage" text-anchor="middle">PiPER 6-DOF arm</text>
<text x="450.0" y="547" class="detail" text-anchor="middle">USB-CAN / SocketCAN connects the ROS driver to six-axis motor hardware</text>
<rect x="135" y="614" width="630" height="78" rx="12" fill="#e8f1fb" stroke="#2f6b9a" stroke-width="1.6"/>
<circle cx="98" cy="653.0" r="17" fill="#2f6b9a"/>
<text x="98" y="658.0" class="index" text-anchor="middle">5</text>
<text x="450.0" y="645" class="stage" text-anchor="middle">Eye-in-hand L515 assembly</text>
<text x="450.0" y="669" class="detail" text-anchor="middle">The qualified holder and Intel RealSense L515 provide current RGB-D sensing</text>
<rect x="135" y="736" width="630" height="78" rx="12" fill="#f7f7f7" stroke="#9ca3af" stroke-width="1.6"/>
<circle cx="98" cy="775.0" r="17" fill="#9ca3af"/>
<text x="98" y="780.0" class="index" text-anchor="middle">6</text>
<text x="450.0" y="767" class="stage" text-anchor="middle">Optional ZED and LiDAR mounts</text>
<text x="450.0" y="791" class="detail" text-anchor="middle">CAD provides mechanical provision; their data is not used by this scan runtime</text>
<circle cx="92" cy="868" r="6" fill="#2f6b9a"/>
<text x="104" y="872" class="legend" text-anchor="start">hardware / input</text>
<circle cx="216" cy="868" r="6" fill="#6f4c9b"/>
<text x="228" y="872" class="legend" text-anchor="start">perception</text>
<circle cx="340" cy="868" r="6" fill="#2a7f76"/>
<text x="352" y="872" class="legend" text-anchor="start">state / data</text>
<circle cx="464" cy="868" r="6" fill="#b57900"/>
<text x="476" y="872" class="legend" text-anchor="start">planning</text>
<circle cx="588" cy="868" r="6" fill="#b83a3a"/>
<text x="600" y="872" class="legend" text-anchor="start">safety</text>
<circle cx="712" cy="868" r="6" fill="#4b5563"/>
<text x="724" y="872" class="legend" text-anchor="start">actuation</text>
<text x="450.0" y="908" class="note" text-anchor="middle">Tracked-base drive, brake authority and repositioning are outside the current PiPER_arm command boundary.</text>
</svg>
