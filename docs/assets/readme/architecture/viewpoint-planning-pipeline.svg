<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1740" viewBox="0 0 1100 1740" role="img">
<title>Closed-Loop Next-Best-View Planning</title>
<desc>One accepted observation changes coverage; rejection changes achieved state but never manufactures evidence</desc>
<defs>
<marker id="data-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#52606D"/>
</marker>
<marker id="control-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#2563A6"/>
</marker>
<marker id="feedback-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#147D70"/>
</marker>
<marker id="command-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#B33A3A"/>
</marker>
<marker id="optional-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#929AA5"/>
</marker>
<style>
.title{font:700 34px Arial,Helvetica,sans-serif;fill:#17212B}
.subtitle{font:15px Arial,Helvetica,sans-serif;fill:#52606D}
.lane-title{font:700 18px Arial,Helvetica,sans-serif;fill:#24303C}
.lane-subtitle{font:12px Arial,Helvetica,sans-serif;fill:#687684}
.node-title{font:700 16px Arial,Helvetica,sans-serif;fill:#17212B}
.detail{font:12.5px Arial,Helvetica,sans-serif;fill:#344250}
.edge-label{font:700 11.5px Arial,Helvetica,sans-serif;fill:#344250;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.badge{font:700 10px Arial,Helvetica,sans-serif;fill:#fff;letter-spacing:.3px}
.legend{font:12px Arial,Helvetica,sans-serif;fill:#46515E}
.note{font:12.5px Arial,Helvetica,sans-serif;fill:#52606D}
</style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="550.0" y="49" class="title" text-anchor="middle">Closed-Loop Next-Best-View Planning</text>
<text x="550.0" y="78" class="subtitle" text-anchor="middle">One accepted observation changes coverage; rejection changes achieved state but never manufactures evidence</text>
<line x1="65" y1="108" x2="103" y2="108" stroke="#52606D" stroke-width="3" marker-end="url(#data-arrow)"/>
<text x="113" y="112" class="legend" text-anchor="start">data / evidence</text>
<line x1="270" y1="108" x2="308" y2="108" stroke="#2563A6" stroke-width="3" marker-end="url(#control-arrow)"/>
<text x="318" y="112" class="legend" text-anchor="start">mission control</text>
<line x1="475" y1="108" x2="513" y2="108" stroke="#147D70" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="523" y="112" class="legend" text-anchor="start">feedback / retry</text>
<line x1="680" y1="108" x2="718" y2="108" stroke="#B33A3A" stroke-width="3" marker-end="url(#command-arrow)"/>
<text x="728" y="112" class="legend" text-anchor="start">motor command</text>
<line x1="885" y1="108" x2="923" y2="108" stroke="#929AA5" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#optional-arrow)"/>
<text x="933" y="112" class="legend" text-anchor="start">branch-only / optional</text>
<polyline points="550.0,300 550.0,365" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="325.5" class="edge-label" text-anchor="middle">commit generation</text>
<polyline points="550.0,525 550.0,595" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="553.0" class="edge-label" text-anchor="middle">measured evidence</text>
<polyline points="720,445.0 760,445.0" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="740.0" y="438.0" class="edge-label" text-anchor="middle">coverage metrics</text>
<polyline points="900.0,525 900,560 740,560 740,685 720,685.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="840" y="553" class="edge-label" text-anchor="middle">more surface required</text>
<polyline points="550.0,775 550.0,845" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<polyline points="550.0,1005 550.0,1075" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="1033.0" class="edge-label" text-anchor="middle">bounded shortlist</text>
<polyline points="550.0,1225 550.0,1295" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="1253.0" class="edge-label" text-anchor="middle">qualified proposal</text>
<polyline points="550.0,1455 550.0,1525" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="1483.0" class="edge-label" text-anchor="middle">settled evidence</text>
<polyline points="720,1600.0 1060,1600 1060,225 720,225 720,225.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="1052" y="900" class="edge-label" text-anchor="middle">ACCEPT: update coverage</text>
<polyline points="380,1600.0 20,1600 20,685 380,685 380,685.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="170" y="1593" class="edge-label" text-anchor="middle">REJECT: achieved FK, no coverage</text>
<polyline points="720,1150.0 750,1150 750,685 720,685 720,685.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="742" y="920" class="edge-label" text-anchor="middle">retire hard-infeasible ray</text>
<polyline points="380,1150.0 320,1150.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="350.0" y="1143.0" class="edge-label" text-anchor="middle">stale / lost target</text>
<polyline points="180.0,1075 180,1035 340,1035 340,685 380,685 380,685.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="250" y="1028" class="edge-label" text-anchor="middle">fresh measurement</text>
<rect x="380" y="150" width="340" height="150" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="550.0" y="181" class="node-title" text-anchor="middle">Accepted schema-2 capture</text>
<text x="550.0" y="208" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">manifest-verified target depth/support</tspan><tspan x="550.0" dy="18">capture-time camera transform + achieved FK</tspan><tspan x="550.0" dy="18">rejected observations are excluded</tspan></text>
<rect x="380" y="365" width="340" height="160" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="550.0" y="396" class="node-title" text-anchor="middle">Measured surface coverage</text>
<text x="550.0" y="423" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">rebuild at exact accepted generation</tspan><tspan x="550.0" dy="18">unknown / observed / visible voxels</tspan><tspan x="550.0" dy="18">completion and novelty evidence</tspan></text>
<rect x="380" y="595" width="340" height="180" rx="13" fill="#FFF3D9" stroke="#B77900" stroke-width="1.8"/>
<text x="550.0" y="626" class="node-title" text-anchor="middle">Candidate policy</text>
<text x="550.0" y="653" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">legacy points | voxel_nbv | frozen ray_nbv</tspan><tspan x="550.0" dy="18">seed from current FK when no model exists</tspan><tspan x="550.0" dy="18">marginal information before travel</tspan><tspan x="550.0" dy="18">duplicate directions and hard culls removed</tspan></text>
<rect x="380" y="845" width="340" height="160" rx="13" fill="#FFF3D9" stroke="#B77900" stroke-width="1.8"/>
<text x="550.0" y="876" class="node-title" text-anchor="middle">Prequalification and shortlist</text>
<text x="550.0" y="903" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">workspace / capability evidence</tspan><tspan x="550.0" dy="18">safe target-facing aim + bounded fallback</tspan><tspan x="550.0" dy="18">12 voxel points or 6 ray directions max</tspan></text>
<rect x="380" y="1075" width="340" height="150" rx="13" fill="#FFF3D9" stroke="#B77900" stroke-width="1.8"/>
<text x="550.0" y="1106" class="node-title" text-anchor="middle">Exact planner backend</text>
<text x="550.0" y="1133" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">fresh scene, joints, limits and hashes</tspan><tspan x="550.0" dy="18">first feasible complete collision-qualified path</tspan><tspan x="550.0" dy="18">structured rejection remains correlated</tspan></text>
<rect x="380" y="1295" width="340" height="160" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="550.0" y="1326" class="node-title" text-anchor="middle">Authorize, execute and settle</text>
<text x="550.0" y="1353" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">common safety path; one view</tspan><tspan x="550.0" dy="18">record actual FK even if capture is rejected</tspan><tspan x="550.0" dy="18">final aim, target drift and framing checks</tspan></text>
<rect x="380" y="1525" width="340" height="150" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="550.0" y="1556" class="node-title" text-anchor="middle">Observation decision</text>
<text x="550.0" y="1583" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">ACCEPT -&gt; immutable commit</tspan><tspan x="550.0" dy="18">RETRY -&gt; one same-pose refresh</tspan><tspan x="550.0" dy="18">REJECT -&gt; exclude and replan</tspan></text>
<rect x="760" y="365" width="280" height="160" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="900.0" y="396" class="node-title" text-anchor="middle">Completion decision</text>
<text x="900.0" y="423" class="detail" text-anchor="middle"><tspan x="900.0" dy="0">bounded 8-24 view policy</tspan><tspan x="900.0" dy="18">useful-face / convergence evidence</tspan><tspan x="900.0" dy="18">or safe-frontier exhaustion</tspan></text>
<rect x="40" y="1075" width="280" height="150" rx="13" fill="#F2EAFF" stroke="#7851A9" stroke-width="1.8"/>
<text x="180.0" y="1106" class="node-title" text-anchor="middle">Visual reacquisition</text>
<text x="180.0" y="1133" class="detail" text-anchor="middle"><tspan x="180.0" dy="0">hold current pose; no command</tspan><tspan x="180.0" dy="18">recover fresh measured target</tspan><tspan x="180.0" dy="18">new plan must be re-approved</tspan></text>
<text x="550.0" y="1716" class="note" text-anchor="middle">The planner proves feasibility; NBV chooses what to try next; capture acceptance alone changes measured coverage.</text>
</svg>
