<polyline points="1025.0,525 1025.0,560 849.0000000000001,560 849.0000000000001,685 827.0000000000001,685.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
