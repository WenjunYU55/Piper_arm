<polyline points="233.0,1075 233.00000000000003,1035 409.00000000000006,1035 409.00000000000006,685 453.00000000000006,685 453.00000000000006,685.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<rect x="453.00000000000006" y="150" width="374.00000000000006" height="150" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="453.00000000000006" y="150" width="7" height="150" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="477.00000000000006" y="185" class="node-title" text-anchor="start">Accepted schema-2 capture</text>
<text x="477.00000000000006" y="216" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">manifest-verified target depth/support</tspan><tspan x="477.00000000000006" dy="23">capture-time camera transform + achieved FK</tspan><tspan x="477.00000000000006" dy="23">rejected observations are excluded</tspan></text>
<rect x="453.00000000000006" y="365" width="374.00000000000006" height="160" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="453.00000000000006" y="365" width="7" height="160" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="477.00000000000006" y="400" class="node-title" text-anchor="start">Measured surface coverage</text>
<text x="477.00000000000006" y="431" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">rebuild at exact accepted generation</tspan><tspan x="477.00000000000006" dy="23">unknown / observed / visible voxels</tspan><tspan x="477.00000000000006" dy="23">completion and novelty evidence</tspan></text>
<rect x="453.00000000000006" y="595" width="374.00000000000006" height="180" rx="14" fill="#FFF3D9" stroke="#B77900" stroke-width="1.6"/>
<rect x="453.00000000000006" y="595" width="7" height="180" rx="3.5" fill="#B77900" opacity="0.9"/>
<text x="477.00000000000006" y="630" class="node-title" text-anchor="start">Candidate policy</text>
<text x="477.00000000000006" y="661" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">legacy points | voxel_nbv | frozen ray_nbv</tspan><tspan x="477.00000000000006" dy="23">seed from current FK when no model exists</tspan><tspan x="477.00000000000006" dy="23">marginal information before travel</tspan><tspan x="477.00000000000006" dy="23">duplicate directions and hard culls removed</tspan></text>
<rect x="453.00000000000006" y="845" width="374.00000000000006" height="160" rx="14" fill="#FFF3D9" stroke="#B77900" stroke-width="1.6"/>
<rect x="453.00000000000006" y="845" width="7" height="160" rx="3.5" fill="#B77900" opacity="0.9"/>
<text x="477.00000000000006" y="880" class="node-title" text-anchor="start">Prequalification and shortlist</text>
<text x="477.00000000000006" y="911" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">workspace / capability evidence</tspan><tspan x="477.00000000000006" dy="23">safe target-facing aim + bounded fallback</tspan><tspan x="477.00000000000006" dy="23">12 voxel points or 6 ray directions max</tspan></text>
<rect x="453.00000000000006" y="1075" width="374.00000000000006" height="150" rx="14" fill="#FFF3D9" stroke="#B77900" stroke-width="1.6"/>
<rect x="453.00000000000006" y="1075" width="7" height="150" rx="3.5" fill="#B77900" opacity="0.9"/>
<text x="477.00000000000006" y="1110" class="node-title" text-anchor="start">Exact planner backend</text>
<text x="477.00000000000006" y="1141" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">fresh scene, joints, limits and hashes</tspan><tspan x="477.00000000000006" dy="23">first feasible complete collision-qualified path</tspan><tspan x="477.00000000000006" dy="23">structured rejection remains correlated</tspan></text>
<rect x="453.00000000000006" y="1295" width="374.00000000000006" height="160" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="453.00000000000006" y="1295" width="7" height="160" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="477.00000000000006" y="1330" class="node-title" text-anchor="start">Authorize, execute and settle</text>
<text x="477.00000000000006" y="1361" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">common safety path; one view</tspan><tspan x="477.00000000000006" dy="23">record actual FK even if capture is rejected</tspan><tspan x="477.00000000000006" dy="23">final aim, target drift and framing checks</tspan></text>
<rect x="453.00000000000006" y="1525" width="374.00000000000006" height="150" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="453.00000000000006" y="1525" width="7" height="150" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="477.00000000000006" y="1560" class="node-title" text-anchor="start">Observation decision</text>
<text x="477.00000000000006" y="1591" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">ACCEPT -&gt; immutable commit</tspan><tspan x="477.00000000000006" dy="23">RETRY -&gt; one same-pose refresh</tspan><tspan x="477.00000000000006" dy="23">REJECT -&gt; exclude and replan</tspan></text>
<rect x="871.0000000000001" y="365" width="308.0" height="160" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="871.0000000000001" y="365" width="7" height="160" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="895.0000000000001" y="400" class="node-title" text-anchor="start">Completion decision</text>
<text x="895.0000000000001" y="431" class="detail" text-anchor="start"><tspan x="895.0000000000001" dy="0">bounded 8-24 view policy</tspan><tspan x="895.0000000000001" dy="23">useful-face / convergence evidence</tspan><tspan x="895.0000000000001" dy="23">or safe-frontier exhaustion</tspan></text>
<rect x="79.0" y="1075" width="308.0" height="150" rx="14" fill="#F2EAFF" stroke="#7851A9" stroke-width="1.6"/>
<rect x="79.0" y="1075" width="7" height="150" rx="3.5" fill="#7851A9" opacity="0.9"/>
<text x="103.0" y="1110" class="node-title" text-anchor="start">Visual reacquisition</text>
<text x="103.0" y="1141" class="detail" text-anchor="start"><tspan x="103.0" dy="0">hold current pose; no command</tspan><tspan x="103.0" dy="23">recover fresh measured target</tspan><tspan x="103.0" dy="23">new plan must be re-approved</tspan></text>
<rect x="566.4000000000001" y="308.5" width="147.2" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="325.5" class="edge-label" text-anchor="middle">commit generation</text>
<rect x="566.4000000000001" y="536.0" width="147.2" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="553.0" class="edge-label" text-anchor="middle">measured evidence</text>
<rect x="870.2000000000002" y="536" width="177.6" height="23" rx="5" class="edge-label-bg"/>
<text x="959.0000000000001" y="553" class="edge-label" text-anchor="middle">more surface required</text>
<rect x="566.4000000000001" y="1016.0" width="147.2" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="1033.0" class="edge-label" text-anchor="middle">bounded shortlist</text>
<rect x="562.6000000000001" y="1236.0" width="154.79999999999998" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="1253.0" class="edge-label" text-anchor="middle">qualified proposal</text>
<rect x="570.2000000000002" y="1466.0" width="139.6" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="1483.0" class="edge-label" text-anchor="middle">settled evidence</text>
<rect x="1006.4000000000001" y="883" width="192.79999999999998" height="23" rx="5" class="edge-label-bg"/>
<text x="1192.2" y="900" class="edge-label" text-anchor="end">ACCEPT: update coverage</text>
<rect x="91.40000000000003" y="1576" width="261.2" height="23" rx="5" class="edge-label-bg"/>
<text x="222.00000000000003" y="1593" class="edge-label" text-anchor="middle">REJECT: achieved FK, no coverage</text>
<rect x="1050.6" y="1013" width="124.39999999999999" height="23" rx="5" class="edge-label-bg"/>
<text x="1168.0" y="1030" class="edge-label" text-anchor="end">infeasible ray</text>
<rect x="369.20000000000005" y="1023" width="101.6" height="23" rx="5" class="edge-label-bg"/>
<text x="420.00000000000006" y="1040" class="edge-label" text-anchor="middle">target lost</text>
<rect x="236.4" y="1011" width="147.2" height="23" rx="5" class="edge-label-bg"/>
<text x="310.0" y="1028" class="edge-label" text-anchor="middle">fresh measurement</text>
<text x="640.0" y="1716" class="note" text-anchor="middle">The planner proves feasibility; NBV chooses what to try next; capture acceptance alone changes measured coverage.</text>
</svg>

