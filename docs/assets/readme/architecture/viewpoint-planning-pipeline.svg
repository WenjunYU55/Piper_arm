<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1108" viewBox="0 0 900 1108" role="img">
<title>Active Viewpoint and Motion Planning</title>
<desc>How measured geometry becomes a reachable, collision-qualified camera motion. Predicted geometry guides planning but never becomes measured reconstruction evidence.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5b6470"/>
  </marker>
  <marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2a7f76"/>
  </marker>
  <style>
    .title{font:600 28px Arial,Helvetica,sans-serif;fill:#1f2937}
    .subtitle{font:14px Arial,Helvetica,sans-serif;fill:#5b6470}
    .stage{font:600 16px Arial,Helvetica,sans-serif;fill:#1f2937}
    .detail{font:13px Arial,Helvetica,sans-serif;fill:#374151}
    .index{font:600 13px Arial,Helvetica,sans-serif;fill:#ffffff}
    .edge-label{font:12px Arial,Helvetica,sans-serif;fill:#2a7f76}
    .legend{font:12px Arial,Helvetica,sans-serif;fill:#4b5563}
    .note{font:12px Arial,Helvetica,sans-serif;fill:#6b7280}
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450.0" y="42" class="title" text-anchor="middle">Active Viewpoint and Motion Planning</text>
<text x="450.0" y="69" class="subtitle" text-anchor="middle">How measured geometry becomes a reachable, collision-qualified camera motion.</text>
<path d="M 450.0 209 L 450.0 238" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 331 L 450.0 360" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 453 L 450.0 482" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 575 L 450.0 604" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 697 L 450.0 726" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 819 L 450.0 848" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="135" y="126" width="630" height="78" rx="12" fill="#e4f4f1" stroke="#2a7f76" stroke-width="1.6"/>
<circle cx="98" cy="165.0" r="17" fill="#2a7f76"/>
<text x="98" y="170.0" class="index" text-anchor="middle">1</text>
<text x="450.0" y="157" class="stage" text-anchor="middle">Accepted observation history</text>
<text x="450.0" y="181" class="detail" text-anchor="middle">Only validated RGB-D, masks and capture poses contribute scan evidence</text>
<rect x="135" y="248" width="630" height="78" rx="12" fill="#e4f4f1" stroke="#2a7f76" stroke-width="1.6"/>
<circle cx="98" cy="287.0" r="17" fill="#2a7f76"/>
<text x="98" y="292.0" class="index" text-anchor="middle">2</text>
<text x="450.0" y="279" class="stage" text-anchor="middle">Target envelope and measured surface</text>
<text x="450.0" y="303" class="detail" text-anchor="middle">Capture-bound geometry defines object scale, centre and visible coverage</text>
<rect x="135" y="370" width="630" height="78" rx="12" fill="#fff2d8" stroke="#b57900" stroke-width="1.6"/>
<circle cx="98" cy="409.0" r="17" fill="#b57900"/>
<text x="98" y="414.0" class="index" text-anchor="middle">3</text>
<text x="450.0" y="401" class="stage" text-anchor="middle">Candidate camera rays</text>
<text x="450.0" y="425" class="detail" text-anchor="middle">Configurable target-centred sector, hemisphere or sphere populations are generated</text>
<rect x="135" y="492" width="630" height="78" rx="12" fill="#fff2d8" stroke="#b57900" stroke-width="1.6"/>
<circle cx="98" cy="531.0" r="17" fill="#b57900"/>
<text x="98" y="536.0" class="index" text-anchor="middle">4</text>
<text x="450.0" y="523" class="stage" text-anchor="middle">Next-best-view ranking</text>
<text x="450.0" y="547" class="detail" text-anchor="middle">Marginal measured coverage, angular novelty and travel rank surviving candidates</text>
<rect x="135" y="614" width="630" height="78" rx="12" fill="#fff2d8" stroke="#b57900" stroke-width="1.6"/>
<circle cx="98" cy="653.0" r="17" fill="#b57900"/>
<text x="98" y="658.0" class="index" text-anchor="middle">5</text>
<text x="450.0" y="645" class="stage" text-anchor="middle">Reachability shortlist</text>
<text x="450.0" y="669" class="detail" text-anchor="middle">Capability-map evidence removes obviously unreachable camera candidates</text>
<rect x="135" y="736" width="630" height="78" rx="12" fill="#fff2d8" stroke="#b57900" stroke-width="1.6"/>
<circle cx="98" cy="775.0" r="17" fill="#b57900"/>
<text x="98" y="780.0" class="index" text-anchor="middle">6</text>
<text x="450.0" y="767" class="stage" text-anchor="middle">Tesseract exact qualification</text>
<text x="450.0" y="791" class="detail" text-anchor="middle">Fresh joints, limits, scene and hashes bind exact IK, collision and path checks</text>
<rect x="135" y="858" width="630" height="78" rx="12" fill="#fce8e6" stroke="#b83a3a" stroke-width="1.6"/>
<circle cx="98" cy="897.0" r="17" fill="#b83a3a"/>
<text x="98" y="902.0" class="index" text-anchor="middle">7</text>
<text x="450.0" y="889" class="stage" text-anchor="middle">Hash-bound execution plan</text>
<text x="450.0" y="913" class="detail" text-anchor="middle">The bridge returns a plan whose identity can be independently authorized</text>
<path d="M 765 897.0 C 842 897.0, 842 409.0, 765 409.0" fill="none" stroke="#2a7f76" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#feedback)"/>
<text x="836" y="645.0" class="edge-label" text-anchor="end">replan after rejection</text>
<circle cx="92" cy="990" r="6" fill="#2f6b9a"/>
<text x="104" y="994" class="legend" text-anchor="start">hardware / input</text>
<circle cx="216" cy="990" r="6" fill="#6f4c9b"/>
<text x="228" y="994" class="legend" text-anchor="start">perception</text>
<circle cx="340" cy="990" r="6" fill="#2a7f76"/>
<text x="352" y="994" class="legend" text-anchor="start">state / data</text>
<circle cx="464" cy="990" r="6" fill="#b57900"/>
<text x="476" y="994" class="legend" text-anchor="start">planning</text>
<circle cx="588" cy="990" r="6" fill="#b83a3a"/>
<text x="600" y="994" class="legend" text-anchor="start">safety</text>
<circle cx="712" cy="990" r="6" fill="#4b5563"/>
<text x="724" y="994" class="legend" text-anchor="start">actuation</text>
<text x="450.0" y="1030" class="note" text-anchor="middle">Predicted geometry guides planning but never becomes measured reconstruction evidence.</text>
</svg>
