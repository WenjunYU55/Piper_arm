<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1740" viewBox="0 0 1280 1740" role="img">
<title>Closed-Loop Next-Best-View Planning</title>
<desc>One accepted observation changes coverage; rejection changes achieved state but never manufactures evidence</desc>
<defs>
