<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1474" viewBox="0 0 900 1474" role="img">
<title>PiPER Active RGB-D Scanning Architecture</title>
<desc>A vertical view of mission admission, perception, planning, guarded arm execution and reconstruction. The tracked base provides the mount, request and pose snapshot; this repository does not command chassis motion.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5b6470"/>
  </marker>
  <marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2a7f76"/>
  </marker>
  <style>
    .title{font:600 28px Arial,Helvetica,sans-serif;fill:#1f2937}
    .subtitle{font:14px Arial,Helvetica,sans-serif;fill:#5b6470}
    .stage{font:600 16px Arial,Helvetica,sans-serif;fill:#1f2937}
    .detail{font:13px Arial,Helvetica,sans-serif;fill:#374151}
    .index{font:600 13px Arial,Helvetica,sans-serif;fill:#ffffff}
    .edge-label{font:12px Arial,Helvetica,sans-serif;fill:#2a7f76}
    .legend{font:12px Arial,Helvetica,sans-serif;fill:#4b5563}
    .note{font:12px Arial,Helvetica,sans-serif;fill:#6b7280}
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450.0" y="42" class="title" text-anchor="middle">PiPER Active RGB-D Scanning Architecture</text>
<text x="450.0" y="69" class="subtitle" text-anchor="middle">A vertical view of mission admission, perception, planning, guarded arm execution and reconstruction.</text>
<path d="M 450.0 209 L 450.0 238" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 331 L 450.0 360" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 453 L 450.0 482" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 575 L 450.0 604" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 697 L 450.0 726" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 819 L 450.0 848" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 941 L 450.0 970" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 1063 L 450.0 1092" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 1185 L 450.0 1214" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="135" y="126" width="630" height="78" rx="12" fill="#e8f1fb" stroke="#2f6b9a" stroke-width="1.6"/>
<circle cx="98" cy="165.0" r="17" fill="#2f6b9a"/>
<text x="98" y="170.0" class="index" text-anchor="middle">1</text>
<text x="450.0" y="157" class="stage" text-anchor="middle">Mission request</text>
<text x="450.0" y="181" class="detail" text-anchor="middle">Local GUI or tracked-robot gateway supplies a label and rough target pose</text>
<rect x="135" y="248" width="630" height="78" rx="12" fill="#e4f4f1" stroke="#2a7f76" stroke-width="1.6"/>
<circle cx="98" cy="287.0" r="17" fill="#2a7f76"/>
<text x="98" y="292.0" class="index" text-anchor="middle">2</text>
<text x="450.0" y="279" class="stage" text-anchor="middle">MissionEngine</text>
<text x="450.0" y="303" class="detail" text-anchor="middle">Owns admission, readiness barriers, phase progression, recovery and shutdown</text>
<rect x="135" y="370" width="630" height="78" rx="12" fill="#e8f1fb" stroke="#2f6b9a" stroke-width="1.6"/>
<circle cx="98" cy="409.0" r="17" fill="#2f6b9a"/>
<text x="98" y="414.0" class="index" text-anchor="middle">3</text>
<text x="450.0" y="401" class="stage" text-anchor="middle">Eye-in-hand sensing</text>
<text x="450.0" y="425" class="detail" text-anchor="middle">Intel RealSense L515 publishes RGB, aligned depth, confidence, intrinsics and TF</text>
<rect x="135" y="492" width="630" height="78" rx="12" fill="#f0eaf8" stroke="#6f4c9b" stroke-width="1.6"/>
<circle cx="98" cy="531.0" r="17" fill="#6f4c9b"/>
<text x="98" y="536.0" class="index" text-anchor="middle">4</text>
<text x="450.0" y="523" class="stage" text-anchor="middle">Target and scene perception</text>
<text x="450.0" y="547" class="detail" text-anchor="middle">GroundingDINO, SAM2, target geometry, obstacles, quality and occlusion evidence</text>
<rect x="135" y="614" width="630" height="78" rx="12" fill="#e4f4f1" stroke="#2a7f76" stroke-width="1.6"/>
<circle cx="98" cy="653.0" r="17" fill="#2a7f76"/>
<text x="98" y="658.0" class="index" text-anchor="middle">5</text>
<text x="450.0" y="645" class="stage" text-anchor="middle">Measured target state</text>
<text x="450.0" y="669" class="detail" text-anchor="middle">A stable base-frame target and accepted RGB-D evidence define the scan model</text>
<rect x="135" y="736" width="630" height="78" rx="12" fill="#fff2d8" stroke="#b57900" stroke-width="1.6"/>
<circle cx="98" cy="775.0" r="17" fill="#b57900"/>
<text x="98" y="780.0" class="index" text-anchor="middle">6</text>
<text x="450.0" y="767" class="stage" text-anchor="middle">Next-best-view planning</text>
<text x="450.0" y="791" class="detail" text-anchor="middle">Candidate rays are ranked by measured coverage, novelty and reachability</text>
<rect x="135" y="858" width="630" height="78" rx="12" fill="#fff2d8" stroke="#b57900" stroke-width="1.6"/>
<circle cx="98" cy="897.0" r="17" fill="#b57900"/>
<text x="98" y="902.0" class="index" text-anchor="middle">7</text>
<text x="450.0" y="889" class="stage" text-anchor="middle">Exact motion qualification</text>
<text x="450.0" y="913" class="detail" text-anchor="middle">The isolated Tesseract worker checks IK, collision and complete paths</text>
<rect x="135" y="980" width="630" height="78" rx="12" fill="#fce8e6" stroke="#b83a3a" stroke-width="1.6"/>
<circle cx="98" cy="1019.0" r="17" fill="#b83a3a"/>
<text x="98" y="1024.0" class="index" text-anchor="middle">8</text>
<text x="450.0" y="1011" class="stage" text-anchor="middle">Guarded execution</text>
<text x="450.0" y="1035" class="detail" text-anchor="middle">The executor validates freshness and safety before publishing autonomous joints</text>
<rect x="135" y="1102" width="630" height="78" rx="12" fill="#eceff1" stroke="#4b5563" stroke-width="1.6"/>
<circle cx="98" cy="1141.0" r="17" fill="#4b5563"/>
<text x="98" y="1146.0" class="index" text-anchor="middle">9</text>
<text x="450.0" y="1133" class="stage" text-anchor="middle">PiPER actuation and feedback</text>
<text x="450.0" y="1157" class="detail" text-anchor="middle">The driver owns CAN, motor enable/disable, MoveJ timing and six-axis health</text>
<rect x="135" y="1224" width="630" height="78" rx="12" fill="#e4f4f1" stroke="#2a7f76" stroke-width="1.6"/>
<circle cx="98" cy="1263.0" r="17" fill="#2a7f76"/>
<text x="98" y="1268.0" class="index" text-anchor="middle">10</text>
<text x="450.0" y="1255" class="stage" text-anchor="middle">Settled capture and reconstruction</text>
<text x="450.0" y="1279" class="detail" text-anchor="middle">Validated observations update coverage and feed offline TSDF / bounded GICP</text>
<path d="M 765 1263.0 C 842 1263.0, 842 775.0, 765 775.0" fill="none" stroke="#2a7f76" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#feedback)"/>
<text x="836" y="1011.0" class="edge-label" text-anchor="end">accepted evidence updates NBV</text>
<circle cx="92" cy="1356" r="6" fill="#2f6b9a"/>
<text x="104" y="1360" class="legend" text-anchor="start">hardware / input</text>
<circle cx="216" cy="1356" r="6" fill="#6f4c9b"/>
<text x="228" y="1360" class="legend" text-anchor="start">perception</text>
<circle cx="340" cy="1356" r="6" fill="#2a7f76"/>
<text x="352" y="1360" class="legend" text-anchor="start">state / data</text>
<circle cx="464" cy="1356" r="6" fill="#b57900"/>
<text x="476" y="1360" class="legend" text-anchor="start">planning</text>
<circle cx="588" cy="1356" r="6" fill="#b83a3a"/>
<text x="600" y="1360" class="legend" text-anchor="start">safety</text>
<circle cx="712" cy="1356" r="6" fill="#4b5563"/>
<text x="724" y="1360" class="legend" text-anchor="start">actuation</text>
<text x="450.0" y="1396" class="note" text-anchor="middle">The tracked base provides the mount, request and pose snapshot; this repository does not command chassis motion.</text>
</svg>
