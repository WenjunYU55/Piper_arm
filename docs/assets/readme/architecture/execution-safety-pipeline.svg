<rect x="893.0000000000001" y="1140" width="7" height="190" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="917.0000000000001" y="1175" class="node-title" text-anchor="start">Settled capture</text>
<text x="917.0000000000001" y="1206" class="detail" text-anchor="start"><tspan x="917.0000000000001" dy="0">actual FK and target-facing aim</tspan><tspan x="917.0000000000001" dy="23">stationary feedback + healthy clock</tspan><tspan x="917.0000000000001" dy="23">CAPTURING_RGBD service gate</tspan></text>
<rect x="79.0" y="870" width="308.0" height="200" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="79.0" y="870" width="7" height="200" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="103.0" y="905" class="node-title" text-anchor="start">Transient recovery</text>
<text x="103.0" y="936" class="detail" text-anchor="start"><tspan x="103.0" dy="0">publish current-position hold</tspan><tspan x="103.0" dy="23">wait for exact fresh evidence</tspan><tspan x="103.0" dy="23">resume unchanged stage only</tspan><tspan x="103.0" dy="23">or replan after target drift</tspan></text>
<rect x="79.0" y="1400" width="308.0" height="175" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="79.0" y="1400" width="7" height="175" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="103.0" y="1435" class="node-title" text-anchor="start">Terminal recovery</text>
<text x="103.0" y="1466" class="detail" text-anchor="start"><tspan x="103.0" dy="0">PRE_HOME -&gt; ROUGH_HOME</tspan><tspan x="103.0" dy="23">-&gt; STORAGE_WRIST -&gt; disable all six</tspan><tspan x="103.0" dy="23">motor authority loss: no new command</tspan><tspan x="103.0" dy="23">revoke mission and clean children</tspan></text>
