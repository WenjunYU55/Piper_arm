<text x="398.00000000000006" y="1375" class="edge-label" text-anchor="end">fresh all-six health</text>
<rect x="209.8" y="811" width="200.39999999999998" height="23" rx="5" class="edge-label-bg"/>
<text x="310.0" y="828" class="edge-label" text-anchor="middle">fresh evidence -&gt; resume</text>
<rect x="77.5" y="683" width="185.2" height="23" rx="5" class="edge-label-bg"/>
<text x="84.5" y="700" class="edge-label" text-anchor="start">target drift -&gt; replan</text>
<rect x="107.8" y="1113" width="162.4" height="23" rx="5" class="edge-label-bg"/>
<text x="189.0" y="1130" class="edge-label" text-anchor="middle">hard fault / cancel</text>
<rect x="192.9" y="1211" width="223.2" height="23" rx="5" class="edge-label-bg"/>
<text x="304.5" y="1228" class="edge-label" text-anchor="middle">timeout / following failure</text>
<text x="640.0" y="1616" class="note" text-anchor="middle">Planner output is necessary but never sufficient: authorization and live feedback remain independent authorities.</text>
