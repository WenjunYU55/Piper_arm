<text x="477.00000000000006" y="180" class="node-title" text-anchor="start">Planner proposal</text>
<text x="477.00000000000006" y="211" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">plan/backend/request/trajectory hashes</tspan><tspan x="477.00000000000006" dy="23">collision qualification + timed path</tspan><tspan x="477.00000000000006" dy="23">command-free until independently approved</tspan></text>
<rect x="453.00000000000006" y="370" width="374.00000000000006" height="180" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="453.00000000000006" y="370" width="7" height="180" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="477.00000000000006" y="405" class="node-title" text-anchor="start">Normalize and validate</text>
<text x="477.00000000000006" y="436" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">six finite joints + increasing timestamps</tspan><tspan x="477.00000000000006" dy="23">20 Hz / 0.05 rad step / speed policy</tspan><tspan x="477.00000000000006" dy="23">fresh matching controller limits</tspan><tspan x="477.00000000000006" dy="23">fresh start and complete path semantics</tspan></text>
<rect x="453.00000000000006" y="620" width="374.00000000000006" height="180" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="453.00000000000006" y="620" width="7" height="180" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="477.00000000000006" y="655" class="node-title" text-anchor="start">PlanAuthorizer</text>
<text x="477.00000000000006" y="686" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">live task/hash/backend authorization</tspan><tspan x="477.00000000000006" dy="23">exact plan + trajectory confirmation</tspan><tspan x="477.00000000000006" dy="23">TTL, target drift, dependencies</tspan><tspan x="477.00000000000006" dy="23">path and collision evidence</tspan></text>
<rect x="453.00000000000006" y="870" width="374.00000000000006" height="200" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="453.00000000000006" y="870" width="7" height="200" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="477.00000000000006" y="905" class="node-title" text-anchor="start">Runtime safety profile</text>
<text x="477.00000000000006" y="936" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">fresh joints, arm, limits and camera clock</tspan><tspan x="477.00000000000006" dy="23">tracking and approved obstacle authority</tspan><tspan x="477.00000000000006" dy="23">external holder/floor clearance</tspan><tspan x="477.00000000000006" dy="23">motor faults, following error and timeout</tspan><tspan x="477.00000000000006" dy="23">cancel token and mission deadline</tspan></text>
<rect x="453.00000000000006" y="1140" width="374.00000000000006" height="190" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="453.00000000000006" y="1140" width="7" height="190" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="477.00000000000006" y="1197" class="node-title" text-anchor="start">TrajectoryRunner + executor</text>
<text x="477.00000000000006" y="1228" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">sole autonomous /joint_ctrl_single publisher</tspan><tspan x="477.00000000000006" dy="23">never burst or skip overdue samples</tspan><tspan x="477.00000000000006" dy="23">monitor endpoint, progress and settling</tspan><tspan x="477.00000000000006" dy="23">publish execution state after every change</tspan></text>
<rect x="477.00000000000006" y="1153" width="128.6" height="23" rx="11.5" fill="#B33A3A"/>
<text x="541.3000000000001" y="1169" class="badge" text-anchor="middle">COMMAND OWNER</text>
<rect x="453.00000000000006" y="1400" width="374.00000000000006" height="175" rx="14" fill="#EEF1F4" stroke="#46515E" stroke-width="1.6"/>
<rect x="453.00000000000006" y="1400" width="7" height="175" rx="3.5" fill="#46515E" opacity="0.9"/>
<text x="477.00000000000006" y="1457" class="node-title" text-anchor="start">PiPER driver / SocketCAN</text>
<text x="477.00000000000006" y="1488" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">MoveJ targets + aggregate speed</tspan><tspan x="477.00000000000006" dy="23">enable/disable and motor watchdogs</tspan><tspan x="477.00000000000006" dy="23">joint, arm and motion-limit feedback</tspan><tspan x="477.00000000000006" dy="23">all-six feedback proof</tspan></text>
<rect x="477.00000000000006" y="1413" width="96" height="23" rx="11.5" fill="#46515E"/>
<text x="525.0" y="1429" class="badge" text-anchor="middle">CAN OWNER</text>
