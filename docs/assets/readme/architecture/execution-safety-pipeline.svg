<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1640" viewBox="0 0 1100 1640" role="img">
<title>Guarded Execution, Feedback and Recovery</title>
<desc>The sole command path, its live feedback, and the split between recoverable evidence loss and terminal faults</desc>
<defs>
<marker id="data-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#52606D"/>
</marker>
<marker id="control-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#2563A6"/>
</marker>
<marker id="feedback-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#147D70"/>
</marker>
<marker id="command-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#B33A3A"/>
</marker>
<marker id="optional-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#929AA5"/>
</marker>
<style>
.title{font:700 34px Arial,Helvetica,sans-serif;fill:#17212B}
.subtitle{font:15px Arial,Helvetica,sans-serif;fill:#52606D}
.lane-title{font:700 18px Arial,Helvetica,sans-serif;fill:#24303C}
.lane-subtitle{font:12px Arial,Helvetica,sans-serif;fill:#687684}
.node-title{font:700 16px Arial,Helvetica,sans-serif;fill:#17212B}
.detail{font:12.5px Arial,Helvetica,sans-serif;fill:#344250}
.edge-label{font:700 11.5px Arial,Helvetica,sans-serif;fill:#344250;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.badge{font:700 10px Arial,Helvetica,sans-serif;fill:#fff;letter-spacing:.3px}
.legend{font:12px Arial,Helvetica,sans-serif;fill:#46515E}
.note{font:12.5px Arial,Helvetica,sans-serif;fill:#52606D}
</style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="550.0" y="49" class="title" text-anchor="middle">Guarded Execution, Feedback and Recovery</text>
<text x="550.0" y="78" class="subtitle" text-anchor="middle">The sole command path, its live feedback, and the split between recoverable evidence loss and terminal faults</text>
<line x1="65" y1="108" x2="103" y2="108" stroke="#52606D" stroke-width="3" marker-end="url(#data-arrow)"/>
<text x="113" y="112" class="legend" text-anchor="start">data / evidence</text>
<line x1="270" y1="108" x2="308" y2="108" stroke="#2563A6" stroke-width="3" marker-end="url(#control-arrow)"/>
<text x="318" y="112" class="legend" text-anchor="start">mission control</text>
<line x1="475" y1="108" x2="513" y2="108" stroke="#147D70" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="523" y="112" class="legend" text-anchor="start">feedback / retry</text>
<line x1="680" y1="108" x2="718" y2="108" stroke="#B33A3A" stroke-width="3" marker-end="url(#command-arrow)"/>
<text x="728" y="112" class="legend" text-anchor="start">motor command</text>
<line x1="885" y1="108" x2="923" y2="108" stroke="#929AA5" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#optional-arrow)"/>
<text x="933" y="112" class="legend" text-anchor="start">branch-only / optional</text>
<polyline points="550.0,300 550.0,370" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<polyline points="550.0,550 550.0,620" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="578.0" class="edge-label" text-anchor="middle">ScanExecutionPlan</text>
<polyline points="550.0,800 550.0,870" fill="none" stroke="#2563A6" stroke-width="2.2" marker-end="url(#control-arrow)"/>
<text x="550.0" y="828.0" class="edge-label" text-anchor="middle">exact approval</text>
<polyline points="550.0,1070 550.0,1140" fill="none" stroke="#2563A6" stroke-width="2.2" marker-end="url(#control-arrow)"/>
<text x="550.0" y="1098.0" class="edge-label" text-anchor="middle">dispatch allowed</text>
<polyline points="550.0,1330 550.0,1400" fill="none" stroke="#B33A3A" stroke-width="2.2" marker-end="url(#command-arrow)"/>
<text x="550.0" y="1358.0" class="edge-label" text-anchor="middle">MoveJ samples</text>
<polyline points="720,1487.5 750,1487 750,1235 720,1235 720,1235.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="742" y="1360" class="edge-label" text-anchor="middle">joint + motor feedback</text>
<polyline points="720,1487.5 1080,1487 1080,460 720,460 720,460.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="1072" y="980" class="edge-label" text-anchor="middle">controller-limit generation</text>
<polyline points="380,1487.5 345,1487 345,970 380,970 380,970.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="270" y="1480" class="edge-label" text-anchor="middle">fresh all-six health</text>
<polyline points="720,1235.0 780,1235.0" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="750.0" y="1228.0" class="edge-label" text-anchor="middle">settled status</text>
<polyline points="380,970.0 320,970.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="350.0" y="963.0" class="edge-label" text-anchor="middle">stale but recoverable</text>
<polyline points="180.0,870 180,835 345,835 345,970 380,970 380,970.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="250" y="828" class="edge-label" text-anchor="middle">fresh evidence -&gt; resume</text>
<polyline points="40,970.0 20,970 20,222 380,222 380,222.5" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="155" y="963" class="edge-label" text-anchor="middle">target drift -&gt; replan</text>
<polyline points="380,970.0 25,970 25,1487 40,1487 320,1487.5" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="140" y="1130" class="edge-label" text-anchor="middle">hard fault / cancel</text>
<polyline points="380,1235.0 330,1235 330,1487 320,1487 320,1487.5" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="245" y="1228" class="edge-label" text-anchor="middle">timeout / following failure</text>
<rect x="380" y="145" width="340" height="155" rx="13" fill="#FFF3D9" stroke="#B77900" stroke-width="1.8"/>
<text x="550.0" y="176" class="node-title" text-anchor="middle">Planner proposal</text>
<text x="550.0" y="203" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">plan/backend/request/trajectory hashes</tspan><tspan x="550.0" dy="18">collision qualification + timed path</tspan><tspan x="550.0" dy="18">command-free until independently approved</tspan></text>
<rect x="380" y="370" width="340" height="180" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="550.0" y="401" class="node-title" text-anchor="middle">Normalize and validate</text>
<text x="550.0" y="428" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">six finite joints + increasing timestamps</tspan><tspan x="550.0" dy="18">20 Hz / 0.05 rad step / speed policy</tspan><tspan x="550.0" dy="18">fresh matching controller limits</tspan><tspan x="550.0" dy="18">fresh start and complete path semantics</tspan></text>
<rect x="380" y="620" width="340" height="180" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="550.0" y="651" class="node-title" text-anchor="middle">PlanAuthorizer</text>
<text x="550.0" y="678" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">live task/hash/backend authorization</tspan><tspan x="550.0" dy="18">exact plan + trajectory confirmation</tspan><tspan x="550.0" dy="18">TTL, target drift, dependencies</tspan><tspan x="550.0" dy="18">path and collision evidence</tspan></text>
<rect x="380" y="870" width="340" height="200" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="550.0" y="901" class="node-title" text-anchor="middle">Runtime safety profile</text>
<text x="550.0" y="928" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">fresh joints, arm, limits and camera clock</tspan><tspan x="550.0" dy="18">tracking and approved obstacle authority</tspan><tspan x="550.0" dy="18">external holder/floor clearance</tspan><tspan x="550.0" dy="18">motor faults, following error and timeout</tspan><tspan x="550.0" dy="18">cancel token and mission deadline</tspan></text>
<rect x="380" y="1140" width="340" height="190" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="550.0" y="1171" class="node-title" text-anchor="middle">TrajectoryRunner + executor</text>
<text x="550.0" y="1198" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">sole autonomous /joint_ctrl_single publisher</tspan><tspan x="550.0" dy="18">never burst or skip overdue samples</tspan><tspan x="550.0" dy="18">monitor endpoint, progress and settling</tspan><tspan x="550.0" dy="18">publish execution state after every change</tspan></text>
<rect x="588" y="1149" width="122" height="21" rx="10" fill="#B33A3A"/>
<text x="649.0" y="1164" class="badge" text-anchor="middle">COMMAND OWNER</text>
<rect x="380" y="1400" width="340" height="175" rx="13" fill="#EEF1F4" stroke="#46515E" stroke-width="1.8"/>
<text x="550.0" y="1431" class="node-title" text-anchor="middle">PiPER driver / SocketCAN</text>
<text x="550.0" y="1458" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">MoveJ targets + aggregate speed</tspan><tspan x="550.0" dy="18">enable/disable and motor watchdogs</tspan><tspan x="550.0" dy="18">joint, arm and motion-limit feedback</tspan><tspan x="550.0" dy="18">all-six feedback proof</tspan></text>
<rect x="620" y="1409" width="90" height="21" rx="10" fill="#46515E"/>
<text x="665.0" y="1424" class="badge" text-anchor="middle">CAN OWNER</text>
<rect x="780" y="1140" width="280" height="190" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="920.0" y="1171" class="node-title" text-anchor="middle">Settled capture</text>
<text x="920.0" y="1198" class="detail" text-anchor="middle"><tspan x="920.0" dy="0">actual FK and target-facing aim</tspan><tspan x="920.0" dy="18">stationary feedback + healthy clock</tspan><tspan x="920.0" dy="18">CAPTURING_RGBD service gate</tspan></text>
<rect x="40" y="870" width="280" height="200" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="180.0" y="901" class="node-title" text-anchor="middle">Transient recovery</text>
<text x="180.0" y="928" class="detail" text-anchor="middle"><tspan x="180.0" dy="0">publish current-position hold</tspan><tspan x="180.0" dy="18">wait for exact fresh evidence</tspan><tspan x="180.0" dy="18">resume unchanged stage only</tspan><tspan x="180.0" dy="18">or replan after target drift</tspan></text>
<rect x="40" y="1400" width="280" height="175" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="180.0" y="1431" class="node-title" text-anchor="middle">Terminal recovery</text>
<text x="180.0" y="1458" class="detail" text-anchor="middle"><tspan x="180.0" dy="0">PRE_HOME -&gt; ROUGH_HOME</tspan><tspan x="180.0" dy="18">-&gt; STORAGE_WRIST -&gt; disable all six</tspan><tspan x="180.0" dy="18">motor authority loss: no new command</tspan><tspan x="180.0" dy="18">revoke mission and clean children</tspan></text>
<text x="550.0" y="1616" class="note" text-anchor="middle">Planner output is necessary but never sufficient: authorization and live feedback remain independent authorities.</text>
</svg>

