<text x="477.00000000000006" y="180" class="node-title" text-anchor="start">Executor-settled viewpoint</text>
<text x="477.00000000000006" y="211" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">achieved FK + final aim/drift checks</tspan><tspan x="477.00000000000006" dy="23">fresh target/scene + healthy clock</tspan><tspan x="477.00000000000006" dy="23">CAPTURING_RGBD request identity</tspan></text>
<rect x="453.00000000000006" y="370" width="374.00000000000006" height="190" rx="14" fill="#EAF3FF" stroke="#2563A6" stroke-width="1.6"/>
<rect x="453.00000000000006" y="370" width="7" height="190" rx="3.5" fill="#2563A6" opacity="0.9"/>
<text x="477.00000000000006" y="405" class="node-title" text-anchor="start">Synchronized observation</text>
<text x="477.00000000000006" y="436" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">exact mask/RGB stamp</tspan><tspan x="477.00000000000006" dy="23">20 new native depth/confidence frames</tspan><tspan x="477.00000000000006" dy="23">per-pixel median with &gt;=0.50 support</tspan><tspan x="477.00000000000006" dy="23">intrinsics + capture-time transforms</tspan><tspan x="477.00000000000006" dy="23">joints + plan provenance</tspan></text>
<rect x="453.00000000000006" y="630" width="374.00000000000006" height="190" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="453.00000000000006" y="630" width="7" height="190" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="477.00000000000006" y="665" class="node-title" text-anchor="start">Semantic and quality gate</text>
<text x="477.00000000000006" y="696" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">unambiguous target depth component</tspan><tspan x="477.00000000000006" dy="23">GOOD target / fresh diagnostics</tspan><tspan x="477.00000000000006" dy="23">CLEAR or exact correlated occlusion proof</tspan><tspan x="477.00000000000006" dy="23">atomic write must finish completely</tspan></text>
<rect x="453.00000000000006" y="890" width="374.00000000000006" height="175" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="453.00000000000006" y="890" width="7" height="175" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="477.00000000000006" y="925" class="node-title" text-anchor="start">Immutable schema-2 commit</text>
<text x="477.00000000000006" y="956" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">target-only support/depth + RGB/mask</tspan><tspan x="477.00000000000006" dy="23">manifest and per-artifact SHA-256</tspan><tspan x="477.00000000000006" dy="23">achieved pose + view selection metadata</tspan><tspan x="477.00000000000006" dy="23">partial files never increment count</tspan></text>
<rect x="871.0000000000001" y="890" width="319.0" height="175" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="871.0000000000001" y="890" width="7" height="175" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="895.0000000000001" y="925" class="node-title" text-anchor="start">Accepted feedback</text>
<text x="895.0000000000001" y="956" class="detail" text-anchor="start"><tspan x="895.0000000000001" dy="0">history generation advances</tspan><tspan x="895.0000000000001" dy="23">measured coverage rebuilds</tspan><tspan x="895.0000000000001" dy="23">NBV replans or completes</tspan></text>
<rect x="79.0" y="630" width="308.0" height="190" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="79.0" y="630" width="7" height="190" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="103.0" y="665" class="node-title" text-anchor="start">Rejected / stale feedback</text>
<text x="103.0" y="696" class="detail" text-anchor="start"><tspan x="103.0" dy="0">hold the achieved pose</tspan><tspan x="103.0" dy="23">one correlated heavy refresh</tspan><tspan x="103.0" dy="23">retry same observation once</tspan><tspan x="103.0" dy="23">then exclude and replan</tspan></text>
<rect x="453.00000000000006" y="1140" width="374.00000000000006" height="165" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="453.00000000000006" y="1140" width="7" height="165" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="477.00000000000006" y="1175" class="node-title" text-anchor="start">Safe mission terminal</text>
<text x="477.00000000000006" y="1206" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">home stages + all-six disable</tspan><tspan x="477.00000000000006" dy="23">mission result and dataset become durable</tspan><tspan x="477.00000000000006" dy="23">optionally WAITING_FOR_BASE_HOME</tspan></text>
<rect x="453.00000000000006" y="1375" width="374.00000000000006" height="155" rx="14" fill="#EFF6FF" stroke="#3B6EA5" stroke-width="1.6"/>
<rect x="453.00000000000006" y="1375" width="7" height="155" rx="3.5" fill="#3B6EA5" opacity="0.9"/>
<text x="477.00000000000006" y="1410" class="node-title" text-anchor="start">Exact tracked-base-home report</text>
<text x="477.00000000000006" y="1441" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">task + job + manifest correlation</tspan><tspan x="477.00000000000006" dy="23">wrong or repeated identities fail/idempotent</tspan><tspan x="477.00000000000006" dy="23">gateway launches isolated reconstruction</tspan></text>
<rect x="453.00000000000006" y="1600" width="374.00000000000006" height="165" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="453.00000000000006" y="1600" width="7" height="165" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="477.00000000000006" y="1635" class="node-title" text-anchor="start">Immutable input admission</text>
<text x="477.00000000000006" y="1666" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">manifest and every frame hash</tspan><tspan x="477.00000000000006" dy="23">capture-time TF/calibration/confidence</tspan><tspan x="477.00000000000006" dy="23">reject tamper, escape or incomplete data</tspan></text>
<rect x="123.0" y="1840" width="330.0" height="180" rx="14" fill="#FFF3D9" stroke="#B77900" stroke-width="1.6"/>
<rect x="123.0" y="1840" width="7" height="180" rx="3.5" fill="#B77900" opacity="0.9"/>
<text x="147.0" y="1875" class="node-title" text-anchor="start">Registration candidates</text>
<text x="147.0" y="1906" class="detail" text-anchor="start"><tspan x="147.0" dy="0">robot_pose baseline</tspan><tspan x="147.0" dy="23">optional bounded target GICP</tspan><tspan x="147.0" dy="23">optional target-excluded scene pose graph</tspan><tspan x="147.0" dy="23">every correction remains bounded</tspan></text>
<rect x="486.00000000000006" y="1840" width="308.0" height="180" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="486.00000000000006" y="1840" width="7" height="180" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="510.00000000000006" y="1875" class="node-title" text-anchor="start">Target-only TSDF</text>
<text x="510.00000000000006" y="1906" class="detail" text-anchor="start"><tspan x="510.00000000000006" dy="0">3 mm voxel / 15 mm truncation default</tspan><tspan x="510.00000000000006" dy="23">qualified masked depth only</tspan><tspan x="510.00000000000006" dy="23">predicted geometry never fused</tspan></text>
<rect x="827.0000000000001" y="1840" width="330.0" height="180" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="827.0000000000001" y="1840" width="7" height="180" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="851.0000000000001" y="1875" class="node-title" text-anchor="start">Validated products</text>
<text x="851.0000000000001" y="1906" class="detail" text-anchor="start"><tspan x="851.0000000000001" dy="0">raw + cleaned PLY meshes</tspan><tspan x="851.0000000000001" dy="23">coloured measured clouds</tspan><tspan x="851.0000000000001" dy="23">quality metrics + visual preview</tspan><tspan x="851.0000000000001" dy="23">complete provenance report</tspan></text>
<rect x="574.0000000000001" y="311.0" width="132.0" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="328.0" class="edge-label" text-anchor="middle">capture service</text>
<rect x="608.2000000000002" y="831.0" width="63.599999999999994" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="848.0" class="edge-label" text-anchor="middle">ACCEPT</text>
<rect x="213.60000000000002" y="571" width="192.79999999999998" height="23" rx="5" class="edge-label-bg"/>
<text x="310.0" y="588" class="edge-label" text-anchor="middle">one fresh re-evaluation</text>
<rect x="77.5" y="483" width="147.2" height="23" rx="5" class="edge-label-bg"/>
<text x="84.5" y="500" class="edge-label" text-anchor="start">exclude + new NBV</text>
<rect x="1047.8" y="583" width="162.4" height="23" rx="5" class="edge-label-bg"/>
<text x="1203.2" y="600" class="edge-label" text-anchor="end">next qualified view</text>
<rect x="558.8000000000001" y="1078.5" width="162.4" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="1095.5" class="edge-label" text-anchor="middle">complete / terminal</text>
<rect x="570.2" y="1778.5" width="139.6" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0" y="1795.5" class="edge-label" text-anchor="middle">validated frames</text>
<text x="640.0" y="2051" class="note" text-anchor="middle">Reconstruction is asynchronous and command-free; its failure cannot retroactively change a safely completed arm mission.</text>
