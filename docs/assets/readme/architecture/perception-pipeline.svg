<text x="477.00000000000006" y="190" class="node-title" text-anchor="start">L515 synchronized evidence</text>
<text x="477.00000000000006" y="221" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">RGB + aligned/native depth + confidence</tspan><tspan x="477.00000000000006" dy="23">CameraInfo, timestamps and camera-frame TF</tspan><tspan x="477.00000000000006" dy="23">timestamp watchdog must remain healthy</tspan></text>
<rect x="123.0" y="365" width="330.0" height="165" rx="14" fill="#F2EAFF" stroke="#7851A9" stroke-width="1.6"/>
<rect x="123.0" y="365" width="7" height="165" rx="3.5" fill="#7851A9" opacity="0.9"/>
<text x="147.0" y="400" class="node-title" text-anchor="start">GroundingDINO heavy worker</text>
<text x="147.0" y="431" class="detail" text-anchor="start"><tspan x="147.0" dy="0">open-label acquisition / correlated refresh</tspan><tspan x="147.0" dy="23">local-cache model readiness</tspan><tspan x="147.0" dy="23">permission-bounded request/result spool</tspan></text>
<rect x="486.00000000000006" y="365" width="308.0" height="165" rx="14" fill="#F2EAFF" stroke="#7851A9" stroke-width="1.6"/>
<rect x="486.00000000000006" y="365" width="7" height="165" rx="3.5" fill="#7851A9" opacity="0.9"/>
<text x="510.00000000000006" y="400" class="node-title" text-anchor="start">SAM 2 live worker</text>
<text x="510.00000000000006" y="431" class="detail" text-anchor="start"><tspan x="510.00000000000006" dy="0">seed from grounded target</tspan><tspan x="510.00000000000006" dy="23">propagate dense target mask</tspan><tspan x="510.00000000000006" dy="23">publish confidence and identity</tspan></text>
<rect x="827.0000000000001" y="365" width="330.0" height="165" rx="14" fill="#F2EAFF" stroke="#7851A9" stroke-width="1.6"/>
<rect x="827.0000000000001" y="365" width="7" height="165" rx="3.5" fill="#7851A9" opacity="0.9"/>
<text x="851.0000000000001" y="400" class="node-title" text-anchor="start">Ambiguity-aware depth</text>
<text x="851.0000000000001" y="431" class="detail" text-anchor="start"><tspan x="851.0000000000001" dy="0">mask is support, not depth proof</tspan><tspan x="851.0000000000001" dy="23">qualified component / confidence gate</tspan><tspan x="851.0000000000001" dy="23">invalid or tied layers fail closed</tspan></text>
<rect x="453.00000000000006" y="610" width="374.00000000000006" height="150" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="453.00000000000006" y="610" width="7" height="150" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="477.00000000000006" y="645" class="node-title" text-anchor="start">Measured Target3D</text>
<text x="477.00000000000006" y="676" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">finite camera-frame point from fresh mask/depth</tspan><tspan x="477.00000000000006" dy="23">source-stamped transform to base_link</tspan><tspan x="477.00000000000006" dy="23">invalid evidence publishes an explicit reason</tspan></text>
<rect x="453.00000000000006" y="835" width="374.00000000000006" height="175" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="453.00000000000006" y="835" width="7" height="175" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="477.00000000000006" y="870" class="node-title" text-anchor="start">Timestamped Kalman tracker</text>
<text x="477.00000000000006" y="901" class="detail" text-anchor="start"><tspan x="477.00000000000006" dy="0">innovation-gated measurement correction</tspan><tspan x="477.00000000000006" dy="23">short outage: LOW_CONFIDENCE prediction</tspan><tspan x="477.00000000000006" dy="23">long outage: LOST and reset</tspan><tspan x="477.00000000000006" dy="23">settled measured lock required for planning</tspan></text>
<rect x="123.0" y="1085" width="330.0" height="175" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="123.0" y="1085" width="7" height="175" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="147.0" y="1120" class="node-title" text-anchor="start">Target geometry</text>
<text x="147.0" y="1151" class="detail" text-anchor="start"><tspan x="147.0" dy="0">landmark, cloud and envelope</tspan><tspan x="147.0" dy="23">1 mm refined target cloud</tspan><tspan x="147.0" dy="23">5 mm NBV evidence grid</tspan><tspan x="147.0" dy="23">prediction is planning-only</tspan></text>
<rect x="486.00000000000006" y="1085" width="308.0" height="175" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="486.00000000000006" y="1085" width="7" height="175" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="510.00000000000006" y="1120" class="node-title" text-anchor="start">Scene evidence</text>
<text x="510.00000000000006" y="1151" class="detail" text-anchor="start"><tspan x="510.00000000000006" dy="0">obstacle instance boxes</tspan><tspan x="510.00000000000006" dy="23">camera timestamp and tracking health</tspan><tspan x="510.00000000000006" dy="23">freshness + correlation metadata</tspan></text>
<rect x="827.0000000000001" y="1085" width="330.0" height="175" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="827.0000000000001" y="1085" width="7" height="175" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="851.0000000000001" y="1120" class="node-title" text-anchor="start">Quality and occlusion</text>
<text x="851.0000000000001" y="1151" class="detail" text-anchor="start"><tspan x="851.0000000000001" dy="0">framing, silhouette and target quality</tspan><tspan x="851.0000000000001" dy="23">CLEAR or labelled occlusion</tspan><tspan x="851.0000000000001" dy="23">person/hand remains a terminal blocker</tspan></text>
<rect x="365.0" y="1355" width="550.0" height="170" rx="14" fill="#FFF3D9" stroke="#B77900" stroke-width="1.6"/>
<rect x="365.0" y="1355" width="7" height="170" rx="3.5" fill="#B77900" opacity="0.9"/>
<text x="389.0" y="1390" class="node-title" text-anchor="start">Consumers with independent gates</text>
<text x="389.0" y="1421" class="detail" text-anchor="start"><tspan x="389.0" dy="0">NBV + planner snapshot | executor runtime safety</tspan><tspan x="389.0" dy="23">settled capture admission | GUI diagnostics</tspan><tspan x="389.0" dy="23">none of these perception paths owns a motor publisher</tspan></text>
