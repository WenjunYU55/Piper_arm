<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1580" viewBox="0 0 1100 1580" role="img">
<title>Target Perception, Tracking and Reacquisition</title>
<desc>The measurement path and the explicit feedback loops used when masks, depth or tracking degrade</desc>
<defs>
<marker id="data-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#52606D"/>
</marker>
<marker id="control-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#2563A6"/>
</marker>
<marker id="feedback-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#147D70"/>
</marker>
<marker id="command-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#B33A3A"/>
</marker>
<marker id="optional-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#929AA5"/>
</marker>
<style>
.title{font:700 34px Arial,Helvetica,sans-serif;fill:#17212B}
.subtitle{font:15px Arial,Helvetica,sans-serif;fill:#52606D}
.lane-title{font:700 18px Arial,Helvetica,sans-serif;fill:#24303C}
.lane-subtitle{font:12px Arial,Helvetica,sans-serif;fill:#687684}
.node-title{font:700 16px Arial,Helvetica,sans-serif;fill:#17212B}
.detail{font:12.5px Arial,Helvetica,sans-serif;fill:#344250}
.edge-label{font:700 11.5px Arial,Helvetica,sans-serif;fill:#344250;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.badge{font:700 10px Arial,Helvetica,sans-serif;fill:#fff;letter-spacing:.3px}
.legend{font:12px Arial,Helvetica,sans-serif;fill:#46515E}
.note{font:12.5px Arial,Helvetica,sans-serif;fill:#52606D}
</style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="550.0" y="49" class="title" text-anchor="middle">Target Perception, Tracking and Reacquisition</text>
<text x="550.0" y="78" class="subtitle" text-anchor="middle">The measurement path and the explicit feedback loops used when masks, depth or tracking degrade</text>
<line x1="65" y1="108" x2="103" y2="108" stroke="#52606D" stroke-width="3" marker-end="url(#data-arrow)"/>
<text x="113" y="112" class="legend" text-anchor="start">data / evidence</text>
<line x1="270" y1="108" x2="308" y2="108" stroke="#2563A6" stroke-width="3" marker-end="url(#control-arrow)"/>
<text x="318" y="112" class="legend" text-anchor="start">mission control</text>
<line x1="475" y1="108" x2="513" y2="108" stroke="#147D70" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="523" y="112" class="legend" text-anchor="start">feedback / retry</text>
<line x1="680" y1="108" x2="718" y2="108" stroke="#B33A3A" stroke-width="3" marker-end="url(#command-arrow)"/>
<text x="728" y="112" class="legend" text-anchor="start">motor command</text>
<line x1="885" y1="108" x2="923" y2="108" stroke="#929AA5" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#optional-arrow)"/>
<text x="933" y="112" class="legend" text-anchor="start">branch-only / optional</text>
<polyline points="550.0,300 230.0,365" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="390.0" y="325.5" class="edge-label" text-anchor="middle">settled RGB</text>
<polyline points="550.0,300 550.0,365" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="325.5" class="edge-label" text-anchor="middle">live frames</text>
<polyline points="550.0,300 870.0,365" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="710.0" y="325.5" class="edge-label" text-anchor="middle">depth + confidence</text>
<polyline points="380,447.5 410,447.5" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="395.0" y="440.5" class="edge-label" text-anchor="middle">target seed</text>
<polyline points="690,447.5 720,447.5" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="705.0" y="440.5" class="edge-label" text-anchor="middle">dense mask</text>
<polyline points="870.0,530 870,575 740,575 740,685 720,685.0" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="795.0" y="600.5" class="edge-label" text-anchor="middle">qualified point</text>
<polyline points="550.0,760 550.0,835" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="790.5" class="edge-label" text-anchor="middle">measurement</text>
<polyline points="550.0,1010 230.0,1085" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="390.0" y="1040.5" class="edge-label" text-anchor="middle">stable target</text>
<polyline points="550.0,1010 550.0,1085" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="1040.5" class="edge-label" text-anchor="middle">health + covariance</text>
<polyline points="1020,447.5 1050,447 1050,1172 1020,1172 1020,1172.5" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="1042" y="810" class="edge-label" text-anchor="middle">support / ambiguity</text>
<polyline points="690,447.5 705,550 705,1172 720,1172 720,1172.5" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="712" y="820" class="edge-label" text-anchor="middle">mask / detection</text>
<polyline points="230.0,1260 550.0,1355" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<polyline points="550.0,1260 550.0,1355" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<polyline points="870.0,1260 550.0,1355" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<polyline points="380,922.5 45,922 45,447 80,447 80,447.5" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="165" y="915" class="edge-label" text-anchor="middle">LOST / bounded reacquisition</text>
<polyline points="1020,1172.5 1060,1172 1060,330 230,330 230,365 380,447.5" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="720" y="323" class="edge-label" text-anchor="middle">one correlated settled refresh</text>
<polyline points="380,685.0 355,685 355,447 410,447 410,447.5" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="240" y="677" class="edge-label" text-anchor="middle">measurement disagreement</text>
<rect x="380" y="155" width="340" height="145" rx="13" fill="#EAF3FF" stroke="#2563A6" stroke-width="1.8"/>
<text x="550.0" y="186" class="node-title" text-anchor="middle">L515 synchronized evidence</text>
<text x="550.0" y="213" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">RGB + aligned/native depth + confidence</tspan><tspan x="550.0" dy="18">CameraInfo, timestamps and camera-frame TF</tspan><tspan x="550.0" dy="18">timestamp watchdog must remain healthy</tspan></text>
<rect x="80" y="365" width="300" height="165" rx="13" fill="#F2EAFF" stroke="#7851A9" stroke-width="1.8"/>
<text x="230.0" y="396" class="node-title" text-anchor="middle">GroundingDINO heavy worker</text>
<text x="230.0" y="423" class="detail" text-anchor="middle"><tspan x="230.0" dy="0">open-label acquisition / correlated refresh</tspan><tspan x="230.0" dy="18">local-cache model readiness</tspan><tspan x="230.0" dy="18">permission-bounded request/result spool</tspan></text>
<rect x="410" y="365" width="280" height="165" rx="13" fill="#F2EAFF" stroke="#7851A9" stroke-width="1.8"/>
<text x="550.0" y="396" class="node-title" text-anchor="middle">SAM 2 live worker</text>
<text x="550.0" y="423" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">seed from grounded target</tspan><tspan x="550.0" dy="18">propagate dense target mask</tspan><tspan x="550.0" dy="18">publish confidence and identity</tspan></text>
<rect x="720" y="365" width="300" height="165" rx="13" fill="#F2EAFF" stroke="#7851A9" stroke-width="1.8"/>
<text x="870.0" y="396" class="node-title" text-anchor="middle">Ambiguity-aware depth</text>
<text x="870.0" y="423" class="detail" text-anchor="middle"><tspan x="870.0" dy="0">mask is support, not depth proof</tspan><tspan x="870.0" dy="18">qualified component / confidence gate</tspan><tspan x="870.0" dy="18">invalid or tied layers fail closed</tspan></text>
<rect x="380" y="610" width="340" height="150" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="550.0" y="641" class="node-title" text-anchor="middle">Measured Target3D</text>
<text x="550.0" y="668" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">finite camera-frame point from fresh mask/depth</tspan><tspan x="550.0" dy="18">source-stamped transform to base_link</tspan><tspan x="550.0" dy="18">invalid evidence publishes an explicit reason</tspan></text>
<rect x="380" y="835" width="340" height="175" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="550.0" y="866" class="node-title" text-anchor="middle">Timestamped Kalman tracker</text>
<text x="550.0" y="893" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">innovation-gated measurement correction</tspan><tspan x="550.0" dy="18">short outage: LOW_CONFIDENCE prediction</tspan><tspan x="550.0" dy="18">long outage: LOST and reset</tspan><tspan x="550.0" dy="18">settled measured lock required for planning</tspan></text>
<rect x="80" y="1085" width="300" height="175" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="230.0" y="1116" class="node-title" text-anchor="middle">Target geometry</text>
<text x="230.0" y="1143" class="detail" text-anchor="middle"><tspan x="230.0" dy="0">landmark, cloud and envelope</tspan><tspan x="230.0" dy="18">1 mm refined target cloud</tspan><tspan x="230.0" dy="18">5 mm NBV evidence grid</tspan><tspan x="230.0" dy="18">prediction is planning-only</tspan></text>
<rect x="410" y="1085" width="280" height="175" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="550.0" y="1116" class="node-title" text-anchor="middle">Scene evidence</text>
<text x="550.0" y="1143" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">obstacle instance boxes</tspan><tspan x="550.0" dy="18">camera timestamp and tracking health</tspan><tspan x="550.0" dy="18">freshness + correlation metadata</tspan></text>
<rect x="720" y="1085" width="300" height="175" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="870.0" y="1116" class="node-title" text-anchor="middle">Quality and occlusion</text>
<text x="870.0" y="1143" class="detail" text-anchor="middle"><tspan x="870.0" dy="0">framing, silhouette and target quality</tspan><tspan x="870.0" dy="18">CLEAR or labelled occlusion</tspan><tspan x="870.0" dy="18">person/hand remains a terminal blocker</tspan></text>
<rect x="300" y="1355" width="500" height="170" rx="13" fill="#FFF3D9" stroke="#B77900" stroke-width="1.8"/>
<text x="550.0" y="1386" class="node-title" text-anchor="middle">Consumers with independent gates</text>
<text x="550.0" y="1413" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">NBV + planner snapshot | executor runtime safety</tspan><tspan x="550.0" dy="18">settled capture admission | GUI diagnostics</tspan><tspan x="550.0" dy="18">none of these perception paths owns a motor publisher</tspan></text>
<text x="550.0" y="1556" class="note" text-anchor="middle">Short prediction gaps never become measured coverage; a recovered fresh measurement must pass the same gates again.</text>
</svg>

