<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="986" viewBox="0 0 900 986" role="img">
<title>Target Perception and Geometric State</title>
<desc>How an open-label target becomes validated target, obstacle and occlusion evidence. Heavy AI workers remain isolated from the ROS 2 Foxy Python environment and have no motion-command authority.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5b6470"/>
  </marker>
  <marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2a7f76"/>
  </marker>
  <style>
    .title{font:600 28px Arial,Helvetica,sans-serif;fill:#1f2937}
    .subtitle{font:14px Arial,Helvetica,sans-serif;fill:#5b6470}
    .stage{font:600 16px Arial,Helvetica,sans-serif;fill:#1f2937}
    .detail{font:13px Arial,Helvetica,sans-serif;fill:#374151}
    .index{font:600 13px Arial,Helvetica,sans-serif;fill:#ffffff}
    .edge-label{font:12px Arial,Helvetica,sans-serif;fill:#2a7f76}
    .legend{font:12px Arial,Helvetica,sans-serif;fill:#4b5563}
    .note{font:12px Arial,Helvetica,sans-serif;fill:#6b7280}
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450.0" y="42" class="title" text-anchor="middle">Target Perception and Geometric State</text>
<text x="450.0" y="69" class="subtitle" text-anchor="middle">How an open-label target becomes validated target, obstacle and occlusion evidence.</text>
<path d="M 450.0 209 L 450.0 238" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 331 L 450.0 360" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 453 L 450.0 482" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 575 L 450.0 604" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 450.0 697 L 450.0 726" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="135" y="126" width="630" height="78" rx="12" fill="#e8f1fb" stroke="#2f6b9a" stroke-width="1.6"/>
<circle cx="98" cy="165.0" r="17" fill="#2f6b9a"/>
<text x="98" y="170.0" class="index" text-anchor="middle">1</text>
<text x="450.0" y="157" class="stage" text-anchor="middle">Synchronized L515 streams</text>
<text x="450.0" y="181" class="detail" text-anchor="middle">RGB, aligned depth, confidence, CameraInfo and camera-frame timing</text>
<rect x="135" y="248" width="630" height="78" rx="12" fill="#f0eaf8" stroke="#6f4c9b" stroke-width="1.6"/>
<circle cx="98" cy="287.0" r="17" fill="#6f4c9b"/>
<text x="98" y="292.0" class="index" text-anchor="middle">2</text>
<text x="450.0" y="279" class="stage" text-anchor="middle">Open-label acquisition</text>
<text x="450.0" y="303" class="detail" text-anchor="middle">GroundingDINO grounds the requested object in a fresh settled frame</text>
<rect x="135" y="370" width="630" height="78" rx="12" fill="#f0eaf8" stroke="#6f4c9b" stroke-width="1.6"/>
<circle cx="98" cy="409.0" r="17" fill="#6f4c9b"/>
<text x="98" y="414.0" class="index" text-anchor="middle">3</text>
<text x="450.0" y="401" class="stage" text-anchor="middle">Dense target persistence</text>
<text x="450.0" y="425" class="detail" text-anchor="middle">SAM2 refines and propagates the selected target mask over time</text>
<rect x="135" y="492" width="630" height="78" rx="12" fill="#f0eaf8" stroke="#6f4c9b" stroke-width="1.6"/>
<circle cx="98" cy="531.0" r="17" fill="#6f4c9b"/>
<text x="98" y="536.0" class="index" text-anchor="middle">4</text>
<text x="450.0" y="523" class="stage" text-anchor="middle">Depth qualification</text>
<text x="450.0" y="547" class="detail" text-anchor="middle">Mask-aware depth selection rejects unreliable, clipped or unsupported geometry</text>
<rect x="135" y="614" width="630" height="78" rx="12" fill="#e4f4f1" stroke="#2a7f76" stroke-width="1.6"/>
<circle cx="98" cy="653.0" r="17" fill="#2a7f76"/>
<text x="98" y="658.0" class="index" text-anchor="middle">5</text>
<text x="450.0" y="645" class="stage" text-anchor="middle">Robot-frame target state</text>
<text x="450.0" y="669" class="detail" text-anchor="middle">Hand-eye calibration and TF express the measured target in base_link</text>
<rect x="135" y="736" width="630" height="78" rx="12" fill="#e4f4f1" stroke="#2a7f76" stroke-width="1.6"/>
<circle cx="98" cy="775.0" r="17" fill="#2a7f76"/>
<text x="98" y="780.0" class="index" text-anchor="middle">6</text>
<text x="450.0" y="767" class="stage" text-anchor="middle">Scene and occlusion evidence</text>
<text x="450.0" y="791" class="detail" text-anchor="middle">Obstacle instances, quality, tracking health and occlusion state are published</text>
<circle cx="92" cy="868" r="6" fill="#2f6b9a"/>
<text x="104" y="872" class="legend" text-anchor="start">hardware / input</text>
<circle cx="216" cy="868" r="6" fill="#6f4c9b"/>
<text x="228" y="872" class="legend" text-anchor="start">perception</text>
<circle cx="340" cy="868" r="6" fill="#2a7f76"/>
<text x="352" y="872" class="legend" text-anchor="start">state / data</text>
<circle cx="464" cy="868" r="6" fill="#b57900"/>
<text x="476" y="872" class="legend" text-anchor="start">planning</text>
<circle cx="588" cy="868" r="6" fill="#b83a3a"/>
<text x="600" y="872" class="legend" text-anchor="start">safety</text>
<circle cx="712" cy="868" r="6" fill="#4b5563"/>
<text x="724" y="872" class="legend" text-anchor="start">actuation</text>
<text x="450.0" y="908" class="note" text-anchor="middle">Heavy AI workers remain isolated from the ROS 2 Foxy Python environment and have no motion-command authority.</text>
</svg>
