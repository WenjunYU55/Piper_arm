<text x="466.00000000000006" y="180" class="node-title" text-anchor="start">Next-mission backend selection</text>
<text x="466.00000000000006" y="211" class="detail" text-anchor="start"><tspan x="466.00000000000006" dy="0">GUI/config: tesseract or curobo</tspan><tspan x="466.00000000000006" dy="23">validated before goal admission</tspan><tspan x="466.00000000000006" dy="23">frozen into RunTargetScan + mission hash</tspan></text>
<rect x="442.00000000000006" y="365" width="396.00000000000006" height="155" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="442.00000000000006" y="365" width="7" height="155" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="466.00000000000006" y="400" class="node-title" text-anchor="start">ProcessSupervisor</text>
<text x="466.00000000000006" y="431" class="detail" text-anchor="start"><tspan x="466.00000000000006" dy="0">starts exactly one selected worker</tspan><tspan x="466.00000000000006" dy="23">owns process group + generation</tspan><tspan x="466.00000000000006" dy="23">bounded stop also owns CUDA work</tspan></text>
<rect x="442.00000000000006" y="590" width="396.00000000000006" height="190" rx="14" fill="#FFF3D9" stroke="#B77900" stroke-width="1.6"/>
<rect x="442.00000000000006" y="590" width="7" height="190" rx="3.5" fill="#B77900" opacity="0.9"/>
<text x="466.00000000000006" y="625" class="node-title" text-anchor="start">Generic Foxy planner bridge</text>
<text x="466.00000000000006" y="656" class="detail" text-anchor="start"><tspan x="466.00000000000006" dy="0">fresh joints, limits, target, camera + scene</tspan><tspan x="466.00000000000006" dy="23">worker generation/heartbeat/readiness</tspan><tspan x="466.00000000000006" dy="23">request ID + model/calibration hashes</tspan><tspan x="466.00000000000006" dy="23">command-free schema-v5 spool request</tspan></text>
<rect x="95.5" y="860" width="440.00000000000006" height="180" rx="14" fill="#FFF3D9" stroke="#B77900" stroke-width="1.6"/>
<rect x="95.5" y="860" width="7" height="180" rx="3.5" fill="#B77900" opacity="0.9"/>
<text x="119.5" y="917" class="node-title" text-anchor="start">Tesseract worker</text>
<text x="119.5" y="948" class="detail" text-anchor="start"><tspan x="119.5" dy="0">exact configured moving/fixed geometry</tspan><tspan x="119.5" dy="23">IK + collision + complete path</tspan><tspan x="119.5" dy="23">baseline + qualified startup recovery</tspan><tspan x="119.5" dy="23">main and integration branch</tspan></text>
<rect x="119.5" y="873" width="96" height="23" rx="11.5" fill="#B77900"/>
<text x="167.5" y="889" class="badge" text-anchor="middle">DEFAULT</text>
<rect x="744.5000000000001" y="850" width="440.00000000000006" height="200" rx="14" fill="#F7F7F8" stroke="#929AA5" stroke-width="1.6"/>
<rect x="744.5000000000001" y="850" width="7" height="200" rx="3.5" fill="#929AA5" opacity="0.9"/>
<text x="768.5000000000001" y="907" class="node-title" text-anchor="start">cuRobo 0.7.8 worker</text>
<text x="768.5000000000001" y="938" class="detail" text-anchor="start"><tspan x="768.5000000000001" dy="0">MotionGen plan_single / plan_single_js</tspan><tspan x="768.5000000000001" dy="23">exact fixed meshes + moving spheres</tspan><tspan x="768.5000000000001" dy="23">CUDA/Python 3.10 isolated</tspan><tspan x="768.5000000000001" dy="23">hardware_qualified=false</tspan><tspan x="768.5000000000001" dy="23">integration branch only</tspan></text>
<rect x="768.5000000000001" y="863" width="128.6" height="23" rx="11.5" fill="#929AA5"/>
<text x="832.8000000000001" y="879" class="badge" text-anchor="middle">NO ARM MOTION</text>
<rect x="442.00000000000006" y="1125" width="396.00000000000006" height="175" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="442.00000000000006" y="1125" width="7" height="175" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="466.00000000000006" y="1160" class="node-title" text-anchor="start">Validated planner response</text>
<text x="466.00000000000006" y="1191" class="detail" text-anchor="start"><tspan x="466.00000000000006" dy="0">backend/version + request identity</tspan><tspan x="466.00000000000006" dy="23">collision qualification + rejection codes</tspan><tspan x="466.00000000000006" dy="23">timed six-joint trajectories + metrics</tspan><tspan x="466.00000000000006" dy="23">atomic response consumed once</tspan></text>
<rect x="442.00000000000006" y="1370" width="396.00000000000006" height="175" rx="14" fill="#E5F7F3" stroke="#147D70" stroke-width="1.6"/>
<rect x="442.00000000000006" y="1370" width="7" height="175" rx="3.5" fill="#147D70" opacity="0.9"/>
<text x="466.00000000000006" y="1405" class="node-title" text-anchor="start">ROS planner transport</text>
<text x="466.00000000000006" y="1436" class="detail" text-anchor="start"><tspan x="466.00000000000006" dy="0">main: TesseractPlan</tspan><tspan x="466.00000000000006" dy="23">integration branch: generic MotionPlan</tspan><tspan x="466.00000000000006" dy="23">Tesseract aliases only in Tesseract mode</tspan><tspan x="466.00000000000006" dy="23">status, readiness and provenance topics</tspan></text>
<rect x="442.00000000000006" y="1615" width="396.00000000000006" height="180" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="442.00000000000006" y="1615" width="7" height="180" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="466.00000000000006" y="1650" class="node-title" text-anchor="start">Unchanged common execution path</text>
<text x="466.00000000000006" y="1681" class="detail" text-anchor="start"><tspan x="466.00000000000006" dy="0">schedule normalization + validation</tspan><tspan x="466.00000000000006" dy="23">ScanExecutionPlan + PlanAuthorizer</tspan><tspan x="466.00000000000006" dy="23">runtime gates + TrajectoryRunner</tspan><tspan x="466.00000000000006" dy="23">executor alone may publish joints</tspan></text>
<rect x="79.0" y="1370" width="297.0" height="175" rx="14" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.6"/>
<rect x="79.0" y="1370" width="7" height="175" rx="3.5" fill="#B33A3A" opacity="0.9"/>
<text x="103.0" y="1405" class="node-title" text-anchor="start">Structured failure</text>
<text x="103.0" y="1436" class="detail" text-anchor="start"><tspan x="103.0" dy="0">stale/malformed/unsupported/unready</tspan><tspan x="103.0" dy="23">publish correlated rejection</tspan><tspan x="103.0" dy="23">mission/NBV decides bounded next action</tspan><tspan x="103.0" dy="23">never switch backend automatically</tspan></text>
<rect x="577.8000000000001" y="308.5" width="124.39999999999999" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="325.5" class="edge-label" text-anchor="middle">frozen backend</text>
<rect x="558.8000000000001" y="531.0" width="162.4" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="548.0" class="edge-label" text-anchor="middle">matching generation</text>
<rect x="419.3500000000001" y="796.0" width="116.8" height="23" rx="5" class="edge-label-bg"/>
<text x="477.75000000000006" y="813.0" class="edge-label" text-anchor="middle">private spool</text>
<rect x="717.2500000000001" y="791.0" width="170.0" height="23" rx="5" class="edge-label-bg"/>
<text x="802.2500000000001" y="808.0" class="edge-label" text-anchor="middle">hardware-unqualified</text>
<rect x="283.8" y="1066" width="162.4" height="23" rx="5" class="edge-label-bg"/>
<text x="365.0" y="1083" class="edge-label" text-anchor="middle">success / rejection</text>
<rect x="833.8000000000001" y="1066" width="162.4" height="23" rx="5" class="edge-label-bg"/>
<text x="915.0000000000001" y="1083" class="edge-label" text-anchor="middle">success / rejection</text>
<rect x="570.2000000000002" y="1556.0" width="139.6" height="23" rx="5" class="edge-label-bg"/>
<text x="640.0000000000001" y="1573.0" class="edge-label" text-anchor="middle">planner proposal</text>
<rect x="339.2" y="1311.0" width="139.6" height="23" rx="5" class="edge-label-bg"/>
<text x="409.0" y="1328.0" class="edge-label" text-anchor="middle">invalid / failed</text>
<rect x="99.80000000000001" y="1311" width="200.39999999999998" height="23" rx="5" class="edge-label-bg"/>
<text x="200.0" y="1328" class="edge-label" text-anchor="middle">new bounded request only</text>
<rect x="137.00000000000003" y="808" width="170.0" height="23" rx="5" class="edge-label-bg"/>
<text x="222.00000000000003" y="825" class="edge-label" text-anchor="middle">heartbeat + blockers</text>
<rect x="1045.6" y="808" width="162.4" height="23" rx="5" class="edge-label-bg"/>
<text x="1201.0" y="825" class="edge-label" text-anchor="end">model qualification</text>
<text x="640.0" y="1826" class="note" text-anchor="middle">Selecting cuRobo never grants motor authority; its current collision model intentionally blocks physical execution.</text>
