<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1850" viewBox="0 0 1100 1850" role="img">
<title>Frozen Planner Backend and Generic Motion Contract</title>
<desc>What is common, what is branch-only, and how readiness and rejection return to the mission</desc>
<defs>
<marker id="data-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#52606D"/>
</marker>
<marker id="control-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#2563A6"/>
</marker>
<marker id="feedback-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#147D70"/>
</marker>
<marker id="command-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#B33A3A"/>
</marker>
<marker id="optional-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#929AA5"/>
</marker>
<style>
.title{font:700 34px Arial,Helvetica,sans-serif;fill:#17212B}
.subtitle{font:15px Arial,Helvetica,sans-serif;fill:#52606D}
.lane-title{font:700 18px Arial,Helvetica,sans-serif;fill:#24303C}
.lane-subtitle{font:12px Arial,Helvetica,sans-serif;fill:#687684}
.node-title{font:700 16px Arial,Helvetica,sans-serif;fill:#17212B}
.detail{font:12.5px Arial,Helvetica,sans-serif;fill:#344250}
.edge-label{font:700 11.5px Arial,Helvetica,sans-serif;fill:#344250;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.badge{font:700 10px Arial,Helvetica,sans-serif;fill:#fff;letter-spacing:.3px}
.legend{font:12px Arial,Helvetica,sans-serif;fill:#46515E}
.note{font:12.5px Arial,Helvetica,sans-serif;fill:#52606D}
</style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="550.0" y="49" class="title" text-anchor="middle">Frozen Planner Backend and Generic Motion Contract</text>
<text x="550.0" y="78" class="subtitle" text-anchor="middle">What is common, what is branch-only, and how readiness and rejection return to the mission</text>
<line x1="65" y1="108" x2="103" y2="108" stroke="#52606D" stroke-width="3" marker-end="url(#data-arrow)"/>
<text x="113" y="112" class="legend" text-anchor="start">data / evidence</text>
<line x1="270" y1="108" x2="308" y2="108" stroke="#2563A6" stroke-width="3" marker-end="url(#control-arrow)"/>
<text x="318" y="112" class="legend" text-anchor="start">mission control</text>
<line x1="475" y1="108" x2="513" y2="108" stroke="#147D70" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="523" y="112" class="legend" text-anchor="start">feedback / retry</text>
<line x1="680" y1="108" x2="718" y2="108" stroke="#B33A3A" stroke-width="3" marker-end="url(#command-arrow)"/>
<text x="728" y="112" class="legend" text-anchor="start">motor command</text>
<line x1="885" y1="108" x2="923" y2="108" stroke="#929AA5" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#optional-arrow)"/>
<text x="933" y="112" class="legend" text-anchor="start">branch-only / optional</text>
<polyline points="550.0,300 550.0,365" fill="none" stroke="#2563A6" stroke-width="2.2" marker-end="url(#control-arrow)"/>
<text x="550.0" y="325.5" class="edge-label" text-anchor="middle">frozen backend</text>
<polyline points="550.0,520 550.0,590" fill="none" stroke="#2563A6" stroke-width="2.2" marker-end="url(#control-arrow)"/>
<text x="550.0" y="548.0" class="edge-label" text-anchor="middle">matching generation</text>
<polyline points="550.0,780 255.0,860" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="402.5" y="813.0" class="edge-label" text-anchor="middle">private spool</text>
<polyline points="550.0,780 845.0,850" fill="none" stroke="#929AA5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#optional-arrow)"/>
<text x="697.5" y="808.0" class="edge-label" text-anchor="middle">branch-only spool</text>
<polyline points="255.0,1040 255,1090 350,1090 350,1212 370,1212.5" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="300" y="1083" class="edge-label" text-anchor="middle">success / rejection</text>
<polyline points="845.0,1050 845,1090 750,1090 750,1212 730,1212.5" fill="none" stroke="#929AA5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#optional-arrow)"/>
<text x="800" y="1083" class="edge-label" text-anchor="middle">success / rejection</text>
<polyline points="550.0,1300 550.0,1370" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<polyline points="550.0,1545 550.0,1615" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#data-arrow)"/>
<text x="550.0" y="1573.0" class="edge-label" text-anchor="middle">planner proposal</text>
<polyline points="370,1212.5 310,1457.5" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="340.0" y="1328.0" class="edge-label" text-anchor="middle">invalid / failed</text>
<polyline points="175.0,1370 175,1335 25,1335 25,685 370,685 370,685.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="150" y="1328" class="edge-label" text-anchor="middle">new bounded request only</text>
<polyline points="55,950.0 25,950 25,685 370,685 370,685.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="170" y="943" class="edge-label" text-anchor="middle">0.5 s heartbeat + blockers</text>
<polyline points="1045,950.0 1070,950 1070,685 730,685 730,685.0" fill="none" stroke="#147D70" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#feedback-arrow)"/>
<text x="920" y="943" class="edge-label" text-anchor="middle">heartbeat + model qualification</text>
<rect x="370" y="145" width="360" height="155" rx="13" fill="#EFF6FF" stroke="#3B6EA5" stroke-width="1.8"/>
<text x="550.0" y="176" class="node-title" text-anchor="middle">Next-mission backend selection</text>
<text x="550.0" y="203" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">GUI/config: tesseract or curobo</tspan><tspan x="550.0" dy="18">validated before goal admission</tspan><tspan x="550.0" dy="18">frozen into RunTargetScan + mission hash</tspan></text>
<rect x="370" y="365" width="360" height="155" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="550.0" y="396" class="node-title" text-anchor="middle">ProcessSupervisor</text>
<text x="550.0" y="423" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">starts exactly one selected worker</tspan><tspan x="550.0" dy="18">owns process group + generation</tspan><tspan x="550.0" dy="18">bounded stop also owns CUDA work</tspan></text>
<rect x="370" y="590" width="360" height="190" rx="13" fill="#FFF3D9" stroke="#B77900" stroke-width="1.8"/>
<text x="550.0" y="621" class="node-title" text-anchor="middle">Generic Foxy planner bridge</text>
<text x="550.0" y="648" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">fresh joints, limits, target, camera + scene</tspan><tspan x="550.0" dy="18">worker generation/heartbeat/readiness</tspan><tspan x="550.0" dy="18">request ID + model/calibration hashes</tspan><tspan x="550.0" dy="18">command-free schema-v5 spool request</tspan></text>
<rect x="55" y="860" width="400" height="180" rx="13" fill="#FFF3D9" stroke="#B77900" stroke-width="1.8"/>
<text x="255.0" y="891" class="node-title" text-anchor="middle">Tesseract worker</text>
<text x="255.0" y="918" class="detail" text-anchor="middle"><tspan x="255.0" dy="0">exact configured moving/fixed geometry</tspan><tspan x="255.0" dy="18">IK + collision + complete path</tspan><tspan x="255.0" dy="18">baseline + qualified startup recovery</tspan><tspan x="255.0" dy="18">main and integration branch</tspan></text>
<rect x="357" y="869" width="88" height="21" rx="10" fill="#B77900"/>
<text x="401.0" y="884" class="badge" text-anchor="middle">DEFAULT</text>
<rect x="645" y="850" width="400" height="200" rx="13" fill="#F7F7F8" stroke="#929AA5" stroke-width="1.8"/>
<text x="845.0" y="881" class="node-title" text-anchor="middle">cuRobo 0.7.8 worker</text>
<text x="845.0" y="908" class="detail" text-anchor="middle"><tspan x="845.0" dy="0">MotionGen plan_single / plan_single_js</tspan><tspan x="845.0" dy="18">exact fixed meshes + moving spheres</tspan><tspan x="845.0" dy="18">CUDA/Python 3.10 isolated</tspan><tspan x="845.0" dy="18">hardware_qualified=false</tspan><tspan x="845.0" dy="18">integration branch only</tspan></text>
<rect x="913" y="859" width="122" height="21" rx="10" fill="#929AA5"/>
<text x="974.0" y="874" class="badge" text-anchor="middle">NO ARM MOTION</text>
<rect x="370" y="1125" width="360" height="175" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="550.0" y="1156" class="node-title" text-anchor="middle">Validated planner response</text>
<text x="550.0" y="1183" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">backend/version + request identity</tspan><tspan x="550.0" dy="18">collision qualification + rejection codes</tspan><tspan x="550.0" dy="18">timed six-joint trajectories + metrics</tspan><tspan x="550.0" dy="18">atomic response consumed once</tspan></text>
<rect x="370" y="1370" width="360" height="175" rx="13" fill="#E5F7F3" stroke="#147D70" stroke-width="1.8"/>
<text x="550.0" y="1401" class="node-title" text-anchor="middle">ROS planner transport</text>
<text x="550.0" y="1428" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">main: TesseractPlan</tspan><tspan x="550.0" dy="18">integration branch: generic MotionPlan</tspan><tspan x="550.0" dy="18">Tesseract aliases only in Tesseract mode</tspan><tspan x="550.0" dy="18">status, readiness and provenance topics</tspan></text>
<rect x="370" y="1615" width="360" height="180" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="550.0" y="1646" class="node-title" text-anchor="middle">Unchanged common execution path</text>
<text x="550.0" y="1673" class="detail" text-anchor="middle"><tspan x="550.0" dy="0">schedule normalization + validation</tspan><tspan x="550.0" dy="18">ScanExecutionPlan + PlanAuthorizer</tspan><tspan x="550.0" dy="18">runtime gates + TrajectoryRunner</tspan><tspan x="550.0" dy="18">executor alone may publish joints</tspan></text>
<rect x="40" y="1370" width="270" height="175" rx="13" fill="#FDE9E7" stroke="#B33A3A" stroke-width="1.8"/>
<text x="175.0" y="1401" class="node-title" text-anchor="middle">Structured failure</text>
<text x="175.0" y="1428" class="detail" text-anchor="middle"><tspan x="175.0" dy="0">stale/malformed/unsupported/unready</tspan><tspan x="175.0" dy="18">publish correlated rejection</tspan><tspan x="175.0" dy="18">mission/NBV decides bounded next action</tspan><tspan x="175.0" dy="18">never switch backend automatically</tspan></text>
<text x="550.0" y="1826" class="note" text-anchor="middle">Selecting cuRobo never grants motor authority; its current collision model intentionally blocks physical execution.</text>
</svg>
