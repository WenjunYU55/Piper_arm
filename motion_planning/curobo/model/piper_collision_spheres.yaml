qualification_notes:
- Planning-URDF provenance was rebound after correcting only the Joint 1 limit
  from the erroneous asymmetric range to the official symmetric SDK-safe
  range; link transforms, meshes and sphere geometry are unchanged.
- Exact operator-authored moving-link sphere geometry extracted from the saved Isaac
  USD.
- The rigidly mounted base uses its exact hash-bound STL as fixed world geometry so
  it does not collide with the overlapping Bunker mount.
- Canonical cable and mount boxes use circumscribed regular-cell spheres so their
  complete volumes are protected.
- No self-collision ignore pair was added or widened.
- A deterministic 2,004-pose articulated self-collision comparison against Tesseract
  found zero state-level false negatives and 18 conservative false positives after
  the measured Link 1 buffer; the sparse Link 5 surface coverage remains documented.
- Command-free GPU checks passed the known neutral/scan path in both directions, deliberate
  world-obstacle rejection, and the known folded self-collision.
- Hardware qualification remains false pending low-speed physical validation and frozen
  mission-request GPU fixtures.
