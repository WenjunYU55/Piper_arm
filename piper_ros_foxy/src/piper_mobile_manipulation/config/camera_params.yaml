/**:
  ros__parameters:
    detection_topic: "/piper/sam2_detection_2d"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    mask_topic: "/piper/sam2_target_mask"
    target_topic: "/piper/target_3d"
    # Private timestamped metric silhouette consumed only by target-aware
    # viewpoint generation. Public target messages remain unchanged.
    target_shape_topic: "/piper/target_shape_measurement"
    # The L515 physical minimum is 0.25 m. A small software tolerance avoids
    # rejecting valid boundary pixels because the node uses a strict comparison.
    depth_min_m: 0.24
    depth_max_m: 1.20
    min_depth_m: 0.24
    max_depth_m: 1.20
    use_median_depth: true
    min_valid_depth_ratio: 0.0
    min_valid_depth_pixels: 20
    crop_half_size_px: 10
    roi_half_size_px: 10
    use_detection_bbox: false
    bbox_scale: 0.6
    depth_percentile: 50.0
    max_depth_stddev_m: 0.20
    confidence_depth_stddev_m: 0.15
    max_depth_jump_m: 0.20
    # A real post-motion depth step is accepted after three mutually
    # consistent samples instead of permanently latching to the old view.
    depth_jump_reacquire_samples: 3
    depth_jump_reacquire_tolerance_m: 0.03
    smoothing_alpha: 0.2
    use_mask_depth: true
    mask_max_age_s: 0.20
    mask_erode_px: 2
    # Select one coherent target surface rather than any background depth
    # pixels included by the semantic mask.
    primary_depth_band_m: 0.03
    primary_depth_neighbour_jump_m: 0.015
    primary_depth_minimum_fraction: 0.15
    primary_depth_ambiguity_margin: 0.08
    debug: true
    sync_queue_size: 10
    sync_slop_sec: 0.08
