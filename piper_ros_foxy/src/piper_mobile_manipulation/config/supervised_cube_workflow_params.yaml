/**:
  ros__parameters:
    movable_whitelist: ["pen", "marker", "stick"]
    min_views: 13
    max_views: 13
    min_quality_score: 0.40
    center_convergence_m: 0.005
    target_motion_abort_m: 0.020
    # A moving tracked target may change base_link position during an active
    # scan. Keep the initial measured-lock gate, but do not abort SCAN_READY
    # or WAIT_CAPTURE solely because the target moved.
    allow_target_motion_during_scan: true
    # A cube's visible-surface centroid shifts with view angle even while its
    # physical center is stationary. This uncertainty is subtracted before the
    # unchanged 20 mm physical-motion abort threshold is evaluated.
    target_surface_measurement_uncertainty_m: 0.015
    obstacle_displacement_m: 0.050
    # SCAN_READY requires a new request-correlated GroundingDINO/SAM result
    # and a 3D obstacle scene carrying that exact image stamp.
    occlusion_probe_timeout_sec: 70.0
    target_clearance_m: 0.040
    drop_target_clearance_m: 0.120
    drop_obstacle_clearance_m: 0.080
    drop_search_radius_m: 0.180
    max_grasp_width_m: 0.070
    approach_height_m: 0.100
    pre_push_offset_m: 0.080
    push_distance_m: 0.060
    # Bench missions have no hard-coded rectangular environment boundary.
    # Actual reach remains owned by current-state IK/collision planning.
    enforce_static_workspace: false
    require_observed_drop_support: true
    drop_support_radius_m: 0.055
    drop_support_min_points: 16
    drop_support_max_stddev_m: 0.008
    workspace_x_min: 0.10
    workspace_x_max: 0.70
    workspace_y_min: -0.40
    workspace_y_max: 0.40
    workspace_z_min: 0.02
    workspace_z_max: 0.60
