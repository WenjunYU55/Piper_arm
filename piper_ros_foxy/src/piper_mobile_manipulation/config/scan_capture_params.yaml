/**:
  ros__parameters:
    color_image_topic: "/camera/color/image_raw"
    depth_image_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    native_depth_image_topic: "/camera/depth/image_rect_raw"
    native_depth_camera_info_topic: "/camera/depth/camera_info"
    confidence_image_topic: "/camera/confidence/image_rect_raw"
    mask_topic: "/piper/sam2_target_mask"
    target_3d_topic: "/piper/target_3d"
    scan_viewpoints_topic: "/piper/scan_viewpoints"
    reachable_scan_viewpoints_topic: "/piper/reachable_scan_viewpoints"
    scan_coverage_topic: "/piper/scan_coverage"
    scan_capture_status_topic: "/piper/scan_capture_status"
    scan_summary_topic: "/piper/scan_summary"
    plan_provenance_topic: "/piper/tesseract_plan_provenance"
    base_frame: "base_link"
    camera_optical_frame: "camera_color_optical_frame"
    require_camera_transform: true
    camera_transform_timeout_sec: 0.25
    task_id: ""
    target_profile: "green_cube"
    calibration_sha256: ""

    # active_scan_capture_debug uses interval mode. The supervised scan launch
    # overrides this to service so exactly one synchronized record is written
    # after each accepted, settled viewpoint.
    capture_mode: "interval"
    capture_interval_sec: 2.0
    max_frames_per_scan: 30
    max_bundle_age_sec: 1.0
    synchronization_slop_sec: 0.08
    native_depth_confidence_slop_sec: 0.005
    capture_cache_size: 240
    minimum_depth_confidence: 8
    minimum_confident_target_points: 50
    minimum_confident_target_fraction: 0.50
    minimum_primary_component_fraction: 0.15
    depth_component_ambiguity_margin: 0.08
    require_valid_target: true
    require_mask: true
    require_depth: true
    require_good_quality_for_service: true
    require_clear_occlusion_for_service: true
    diagnostic_timeout_sec: 1.0
    minimum_accepted_quality_score: 0.65
    dataset_root: "/home/prl/Piper_arm/datasets/active_scan"
    dry_run: true
    enable_real_arm_motion: false
    debug: true
