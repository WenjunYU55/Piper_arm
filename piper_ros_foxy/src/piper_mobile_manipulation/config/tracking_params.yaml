/**:
  ros__parameters:
    filter_type: "kalman"
    min_depth_m: 0.25
    max_depth_m: 1.20
    roi_half_size_px: 10
    min_valid_depth_pixels: 20
    depth_gate_m: 0.15
    max_pixel_jump: 80
    max_3d_jump_m: 0.10
    min_area_ratio: 0.5
    max_area_ratio: 2.0
    # Eye-in-hand camera motion legitimately changes pixels, apparent area and
    # camera-relative depth.  Gate the timestamped base-frame observation.
    use_camera_space_gates: false
    max_target_speed_mps: 1.0
    # GPU results may arrive late; never update velocity with an older image stamp.
    reject_out_of_order_measurements: true
    min_confidence: 0.20
    lost_timeout_s: 1.0
    low_confidence_timeout_s: 0.5
    smoothing_alpha: 0.2
    debug: true
    prediction_horizon_s: 0.15
    max_missed_frames: 10
    min_track_frames: 5
    stable_speed_threshold_mps: 0.03
    stable_time_s: 0.4
    process_noise: 0.05
    measurement_noise: 0.03
    use_tf_transform: true
    piper_base_frame: "base_link"
    camera_frame: "camera_color_optical_frame"
    transform_timeout_s: 0.2
    min_measurement_confidence: 0.03
    confidence_noise_scale: 4.0
