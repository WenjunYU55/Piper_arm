/**:
  ros__parameters:
    filter_type: "kalman"
    min_depth_m: 0.25
    max_depth_m: 1.20
    roi_half_size_px: 10
    min_valid_depth_pixels: 20
    depth_gate_m: 0.15
    max_pixel_jump: 80
    max_3d_jump_m: 0.10
    min_area_ratio: 0.5
    max_area_ratio: 2.0
    # Eye-in-hand camera motion legitimately changes pixels, apparent area and
    # camera-relative depth.  Gate the timestamped base-frame observation.
    use_camera_space_gates: false
    max_target_speed_mps: 1.0
    # Normalized 3-D innovation gate for the near-static base_link target.
    innovation_gate_threshold: 5.0
    # GPU results may arrive late; never update velocity with an older image stamp.
    reject_out_of_order_measurements: true
    min_confidence: 0.20
    # Live SAM2/GPU output is bursty: the 2026-08-20 E2E observed qualified
    # measurement gaps up to 3.89 s. LOW_CONFIDENCE still begins after 0.5 s;
    # five seconds only bounds how long the stationary prediction may survive.
    lost_timeout_s: 5.0
    low_confidence_timeout_s: 0.5
    smoothing_alpha: 0.2
    debug: true
    prediction_horizon_s: 0.15
    max_missed_frames: 10
    min_track_frames: 5
    stable_speed_threshold_mps: 0.03
    stable_time_s: 0.4
    # The target is stationary in base_link. Keep prediction covariance small
    # enough that a bad semantic depth layer cannot make a 50-100 mm jump look
    # statistically ordinary after a short perception gap.
    process_noise: 0.01
    measurement_noise: 0.02
    tracking_health_topic: "/piper/tracking_health"
    # Fresh explicit motion health suppresses visual correction. A stale health
    # sample leaves the legacy estimator path unchanged; mission safety still
    # rejects stale TrackingHealth independently.
    motion_health_timeout_s: 1.0
    use_tf_transform: true
    piper_base_frame: "base_link"
    camera_frame: "camera_color_optical_frame"
    transform_timeout_s: 0.2
    min_measurement_confidence: 0.03
    confidence_noise_scale: 4.0
