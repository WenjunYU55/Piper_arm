/**:
  ros__parameters:
    # Cover the target-facing hemisphere from both Y sides. Reachability is
    # not pre-qualified by this generator: Tesseract IK/joint/collision checks
    # and the executor's dense target-visibility check remain authoritative.
    desired_scan_angle_deg: 180
    viewpoint_center_angle_deg: 180
    # Thirteen azimuths from +Y side through the base-facing front to -Y side.
    # A 15-degree grid left no continuous IK step after achieved FK landed at
    # 195.6 degrees: the next exact 210-degree look self-collided.  Half-step
    # sampling provides an approximately 6-8-degree measured-state successor
    # without lowering the meaningful-capture threshold.
    viewpoint_step_deg: 7.5
    scan_radius_m: 0.30
    # Closed-loop requests sample one exact Tesseract-qualified pose from this
    # bounded distance region instead of demanding a single fixed radius.
    scan_radius_offsets_m: [0.0, 0.03, 0.06, 0.09, 0.12, 0.15]
    # The ray-NBV policy freezes one mission-scoped direction pool. The point
    # policies still use the exact radii above. Full-sphere and upper-hemisphere
    # sampling are equal-area; target_sector retains the configured 180-degree
    # azimuth and pitch region for reproducible comparison with earlier runs.
    min_scan_radius_m: 0.30
    max_scan_radius_m: 0.80
    ray_min_standoff_m: 0.28
    preferred_scan_radius_m: 0.50
    ray_sampling_region: "full_sphere"
    ray_count: 175
    # Deterministic samples of a flexible vertical camera region. Ten-degree
    # pitch spacing gives Tesseract intermediate J2/J3 configurations instead
    # of forcing one of a few exact wrist-down elevations near a close target.
    camera_pitch_deg: -50
    camera_pitch_offsets_deg: [35.0, 25.0, 15.0, 5.0, -5.0, -15.0, -25.0]
    keep_object_centered: true
    max_viewpoints: 25
    session_max_views: 13
    scan_session_history_topic: "/piper/scan_session_history"
    # Multiview candidates are generated only from coordinates already in this
    # frame. Raw camera-optical /piper/target_3d observations must first pass
    # through the base-frame tracker; they are never a coordinate fallback.
    planning_frame_id: "base_link"
    # A retried scan excludes only a camera pose that is close in both
    # translation and viewing direction to an achieved accepted capture.
    # The next view persistently targets missing -Y/+Y face observations,
    # azimuth span, then elevation span before residual pose diversity.
    duplicate_position_tolerance_m: 0.012
    duplicate_look_tolerance_deg: 2.0
    # This is accepted-view redundancy only. It is not a maximum transition
    # angle and cannot prevent a globally informative 60/80-degree NBV.
    minimum_useful_direction_separation_deg: 6.0

    min_reach_m: 0.20
    max_reach_m: 0.75
    min_camera_object_distance_m: 0.25
    max_camera_object_distance_m: 0.80
    max_height_change_m: 0.40
    # Exact-point policies use these bounds only with the legacy opt-in below.
    # Target rays always require some bounded standoff to intersect this coarse
    # camera workspace before Tesseract performs authoritative feasibility.
    enforce_static_reach_bounds: false
    arm_status_timeout_sec: 1.0

    min_good_scan_quality: 0.65
    min_acceptable_scan_quality: 0.40
    max_depth_stddev_good_m: 0.03
    min_valid_depth_ratio: 0.40
    min_mask_area_px: 100
    edge_margin_px: 40

    occlusion_depth_margin_m: 0.03
    occlusion_persistence_frames: 3
    min_occluder_area_px: 80

    enable_real_arm_motion: false
    enable_real_push: false
    dry_run: true
    debug: true
    tracked_target_topic: "/piper/tracked_target"
    # Stationary-cube plans freeze the latest qualified measured position.
    use_predicted_target_for_scan: false
    # Tracker measurements arrive near camera rate. Rebuild candidates only
    # after a material target shift or an accepted-view history change.
    target_replan_translation_m: 0.01
    target_replan_min_period_sec: 0.50
    # Bridge freshness is 1.0 s. Re-emit the deterministic candidate snapshot
    # from each still-valid tracked-target observation before it can expire,
    # even when target displacement is below the meaningful-replan threshold.
    target_plan_refresh_period_sec: 0.50

    # Genuine information-gain NBV owns candidate ordering. This is awaiting
    # its first operator-supervised physical E2E qualification; Tesseract and
    # every existing execution/runtime safety gate remain authoritative.
    view_selection_policy: "ray_nbv"
    scan_capture_status_topic: "/piper/scan_capture_status"
    nbv_voxel_size_m: 0.005
    nbv_minimum_radius_m: 0.030
    nbv_maximum_radius_m: 0.250
    nbv_radius_scale: 2.0
    nbv_padding_voxels: 2
    nbv_surface_tolerance_m: 0.007
    nbv_render_width: 64
    nbv_render_height: 48
    # Full voxel evidence is retained; candidate raycasts use this bounded,
    # deterministic planning sample so a noisy large mask cannot stall ROS.
    nbv_maximum_scoring_voxels: 20000

    # A typed /scan_target_acquisition/prepare call atomically binds the session
    # ID and rough base_link coordinate. The guarded executor still requires
    # exact approval before any real motion.
    acquisition_viewpoints_topic: "/piper/acquisition_viewpoints"
    reachable_acquisition_viewpoints_topic: "/piper/reachable_acquisition_viewpoints"
    hint_max_age_sec: 5.0
    # Maximum search radius. If the live camera is already closer to the hint,
    # acquisition preserves that current radius and aims at the hint instead
    # of overshooting through/behind the robot base.
    standoff_m: 0.45
    # Extra compact candidates cover centreline hints whose five
    # minimum-translation look-at orientations have no bounded IK.
    fallback_standoff_m: 0.28
    # Retained for configuration compatibility; live camera-to-hint pitch owns
    # the centered minimum-translation acquisition look.
    acquisition_camera_pitch_deg: -10.0
    # Search left/right/up/down by 15 degrees after the centered look.
    # Diagonals and compact-radius poses remain bounded reserve candidates.
    sweep_angle_deg: 15.0
    # Continue refreshing the same correlated proposal through a transient
    # post-start camera-health flap, then stop cleanly instead of retrying a
    # stale payload forever.
    handoff_retry_sec: 0.50
    handoff_timeout_sec: 30.0

    first_push_distance_m: 0.01
    max_push_distance_m: 0.03
