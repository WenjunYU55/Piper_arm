/**:
  ros__parameters:
    reachable_viewpoints_topic: "/piper/reachable_scan_viewpoints"
    joint_states_topic: "/joint_states_single"
    arm_status_topic: "/arm_status"
    motion_limits_topic: "/piper/motion_limits"
    tracking_health_topic: "/piper/tracking_health"
    tracked_target_topic: "/piper/tracked_target"
    camera_timestamp_health_topic: "/piper/camera_timestamp_health"
    target_status_topic: "/piper/target_status"
    obstacle_topic: "/piper/obstacle_instances_3d"
    workflow_status_topic: "/piper/supervised_workflow_status"
    scan_session_history_topic: "/piper/scan_session_history"
    joint_command_topic: "/joint_ctrl_single"
    plan_topic: "/piper/scan_execution_plan"
    status_topic: "/piper/scan_execution_status"
    capture_service: "/supervised_cube_workflow/capture_view"
    finish_scan_service: "/supervised_cube_workflow/finish_scan"
    rgbd_capture_service: "/scan_capture/capture_view"
    heavy_refresh_request_topic: "/piper/heavy_refresh_request"
    heavy_refresh_status_topic: "/piper/heavy_refresh_status"
    tesseract_plan_topic: "/piper/tesseract_plan"

    enable_real_arm_motion: false
    auto_capture: true
    speed_percent: 5.0
    max_execution_viewpoints: 13
    min_execution_viewpoints: 13
    # Hard ceiling for adjacent streamed position targets.
    # At 20 Hz this permits the qualified 20% MoveJ rate for J1-J5
    # (5 rad/s * 0.20 / 20 Hz = 0.05 rad per target).
    trajectory_joint_step_rad: 0.05
    # Time-followed Tesseract position stream. The executor publishes only the
    # newest due sample, never bursts stale samples, and feedback-gates the
    # final endpoint rather than stopping at every intermediate point.
    trajectory_command_rate_hz: 20.0
    # Poll feedback and safety state independently of command issuance.
    executor_tick_rate_hz: 200.0
    trajectory_following_error_rad: 0.30
    trajectory_following_error_grace_sec: 1.0
    plan_start_tolerance_rad: 0.025
    joint_goal_tolerance_rad: 0.025
    waypoint_reached_tolerance_rad: 0.025
    waypoint_progress_epsilon_rad: 0.001
    waypoint_timeout_sec: 90.0
    # At 5% SDK speed, judge progress across all moving joints and allow a
    # full twenty seconds between measurable improvements.
    waypoint_progress_timeout_sec: 20.0
    # Retained for configuration compatibility and diagnostics only. PiPER's
    # reported velocity can spike while measured positions remain stationary.
    joint_velocity_settled: 0.20
    # Acquisition and capture endpoints must remain inside this position
    # window for settle_duration_sec after reaching joint_goal_tolerance_rad.
    # Live PiPER J4 feedback near zero alternates between two powered encoder
    # states 0.006227508 rad apart.  Keep this just above that measured step so
    # a stationary endpoint can settle; the independent 0.025 rad commanded
    # endpoint tolerance remains unchanged.
    endpoint_position_settled_rad: 0.007
    # Final home proof mirrors the GUI safe-disable transaction: the approved
    # target must be met and successive fresh positions must remain still.
    # This avoids false failures from PiPER's noisy instantaneous speed field.
    # Operator-authorized configured-home acceptance, independently per joint.
    # Direct home uses ExecuteHomeStage/native MoveJ, not Tesseract.
    home_goal_tolerance_rad: 0.30
    home_motion_tolerance_rad: 0.30
    # The driver rejects CAN joint sets whose six frame stamps are too skewed.
    # One dropped set must not reset an otherwise stationary home proof.
    home_joint_feedback_timeout_sec: 1.0
    home_settle_duration_sec: 1.0
    home_settle_timeout_sec: 30.0
    # Readback-only allowance for one encoder quantum at an inclusive URDF
    # boundary. Planned/commanded targets remain inside the exact limits.
    # PiPER powered feedback can sit just over the controller-coordinate
    # J2/J3 boundary by one encoder quantization/noise band.  This is the hard
    # capped feedback-only tolerance; commanded/planned joints remain inside.
    joint_feedback_limit_tolerance_rad: 0.005
    # Operator-qualified allowance for measured post-disable relaxation only.
    # This is consulted exclusively by an exact direct RETURN_HOME stage;
    # normal feedback stays capped at 0.005 and all command goals stay in-limit.
    configured_home_feedback_limit_tolerance_rad: 0.3
    motion_limits_timeout_sec: 3.0
    # PiPER refreshes 12 CAN limit replies asynchronously. A distinct valid
    # hash must persist beyond one five-second query cycle before promotion.
    motion_limits_change_confirmation_sec: 7.0
    motion_limits_change_minimum_samples: 3
    # Path validation is synchronous in Foxy. Process freshly queued safety
    # telemetry before the first command instead of using cache aged by it.
    runtime_refresh_timeout_sec: 3.0
    # A watchdog-authorized full L515 restart includes a 2 s first backoff,
    # 7 s camera startup and downstream readiness. Keep the arm held long
    # enough for that bounded recovery instead of turning a transient clock
    # remap into a terminal mission failure.
    runtime_recovery_timeout_sec: 30.0
    settle_duration_sec: 1.5
    settle_timeout_sec: 15.0
    capture_timeout_sec: 20.0
    finish_scan_timeout_sec: 10.0
    # scan_capture_node independently gates service saves using the executor
    # status topic. Republish CAPTURING_RGBD briefly before the service call
    # so DDS scheduling cannot expose the previous WAIT_CAPTURE state.
    capture_status_propagation_sec: 0.25
    acquisition_fresh_frame_timeout_sec: 10.0
    acquisition_grounding_timeout_sec: 60.0
    acquisition_tracking_lock_timeout_sec: 10.0
    acquisition_scene_timeout_sec: 15.0
    acquisition_target_tolerance_m: 0.30
    acquisition_max_viewpoints: 5
    # A collision-free joint interpolation is still rejected if it would turn
    # the eye-in-hand camera off the measured target or pass through it.
    scan_target_max_boresight_deg: 20.0
    scan_target_min_distance_m: 0.22
    data_timeout_sec: 2.0
    max_tracking_measurement_age_sec: 0.75
    min_tracking_speed_scale: 0.10
    # The timer starts when the executor receives the completed proposal.
    # Runtime safety and exact-path validation are repeated at approval, so
    # this is an operator inspection window rather than a cached-safety waiver.
    plan_max_age_sec: 300.0
    max_target_drift_before_approval_m: 0.015
    # The exact approval remains bound to the collision-checked arm targets.
    # Target motion is handled by live tracking/capture and is not itself an
    # arm-safety reason to reject those already-planned camera poses.
    allow_target_motion_during_scan: false
    # Nearest one-joint collision-qualified low-drop home adjustment from GUI
    # feedback. J3 is 0.050 rad lower than the collision-rejected folded pose.
    # Exact approval covers this final return and all capture segments.
    # Canonical value is loaded from the hash-verified repository home file.
    return_home_positions_rad: [-0.010187296, 0.0, -0.01692068, 0.068485144, 0.441280868, 0.012594568]
    floor_z_m: 0.0
    link_radius_m: 0.025
    self_clearance_m: 0.060
    # Exact link6-frame AABB derived from the locked cameraHolder.STL visual
    # transform. It also contains the installed L515 CAD body. The full box is
    # used only for external floor/scene clearance; compact-wrist self-
    # proximity remains governed by the qualified Tesseract model.
    camera_holder_envelope_center_link6_m: [-0.029750002, 0.0, 0.0375]
    camera_holder_envelope_size_m: [0.1395, 0.10572671, 0.053]
    camera_holder_external_clearance_m: 0.005
    approval_confirmation: "EXECUTE APPROVED SCAN"
    # Manual commissioning keeps this false. The autonomous mission launch
    # explicitly enables it and binds each approval to a task hash/deadline.
    allow_mission_policy: false
    debug: true
