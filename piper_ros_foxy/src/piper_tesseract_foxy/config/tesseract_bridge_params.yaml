/**:
  ros__parameters:
    reachable_viewpoints_topic: "/piper/reachable_scan_viewpoints"
    reachable_acquisition_viewpoints_topic: "/piper/reachable_acquisition_viewpoints"
    joint_states_topic: "/joint_states_single"
    motion_limits_topic: "/piper/motion_limits"
    tracking_health_topic: "/piper/tracking_health"
    camera_timestamp_health_topic: "/piper/camera_timestamp_health"
    obstacle_topic: "/piper/obstacle_instances_3d"
    plan_topic: "/piper/tesseract_plan"
    motion_plan_topic: "/piper/motion_plan"
    view_generation_receipt_topic: "/piper/view_generation"
    legacy_view_generation_receipt_topic: "/piper/tesseract_view_generation"
    ray_hard_culls_topic: "/piper/ray_hard_culls"
    plan_provenance_topic: "/piper/motion_plan_provenance"
    legacy_plan_provenance_topic: "/piper/tesseract_plan_provenance"
    status_topic: "/piper/tesseract_plan_status"
    motion_plan_status_topic: "/piper/motion_plan_status"
    readiness_topic: "/piper/tesseract_readiness"
    planner_readiness_topic: "/piper/planner_readiness"
    data_timeout_sec: 1.0
    motion_limits_timeout_sec: 3.0
    motion_limits_change_confirmation_sec: 7.0
    motion_limits_change_minimum_samples: 3
    worker_heartbeat_timeout_sec: 1.5
    request_ttl_sec: 180.0
    response_timeout_sec: 180.0
    max_tracking_measurement_age_sec: 0.75
    max_execution_viewpoints: 13
    joint_limit_margin_rad: 0.03
    # Hard per-command ceiling for the 20 Hz MoveJ-model position
    # stream. Normal plans retain every collision-qualified OMPL corner;
    # configured home alone remains a direct two-point exception.
    # Qualified through 20% at 20 Hz for the 5 rad/s J1-J5 MoveJ model.
    trajectory_joint_step_rad: 0.05
    trajectory_command_rate_hz: 20.0
    speed_percent: 5.0
    roll_samples_rad: [-2.094395102, -1.047197551, 0.0, 1.047197551, 2.094395102, 3.141592654]
    deterministic_seed: 42
    # Nearest one-joint collision-qualified adjustment of the operator's
    # feedback pose; J3 is 0.050 rad lower than the folded original.
    # Launchers override this from the hash-verified repository home file.
    # Keep the packaged fallback aligned so a proposal can never qualify a
    # different terminal pose.
    return_home_positions_rad: [-0.010187296, 0.0, -0.01692068, 0.068485144, 0.441280868, 0.012594568]
    # Must remain false until gripper TCP/open/closed/attached-object/contact
    # collision qualification has been completed on the installed hardware.
    manipulation_model_qualified: false
    # Retained parameter names for launch/override compatibility. They no
    # longer bound automatic NBV motion; accepted-view redundancy is owned by
    # the scan planner and Tesseract sees a global information-first shortlist.
    closed_loop_min_view_step_deg: 6.0
    closed_loop_max_view_step_deg: 30.0
    # The bounded shortlist alternates highest-new-coverage candidates with
    # compact fallbacks that advance toward that same missing-feature goal,
    # so diversity cannot prune every reachable stepping stone or reverse it.
    # Only the highest-ranked global NBVs reach expensive IK/path planning.
    closed_loop_candidate_limit: 12
    # Exact target-facing orientation is attempted first across roll/IK
    # alternatives. One hash-bound fallback may deviate by at most five
    # degrees. The independent dense 20-degree path-visibility cone remains.
    closed_loop_max_aim_offset_deg: 5.0
    debug: true
