status: accepted
model: eye_in_hand
method: OpenCV CALIB_HAND_EYE_PARK with datasheet- and factory-extrinsic mechanical registration
deployment_basis: >-
  The 2026-08-08 hand-eye solve remains the measured source solution. On
  2026-08-09 the operator confirmed that the installed camera-holder and L515
  rendering matches the physical assembly. On 2026-08-10 the supplied Intel
  L515 Rev 003 datasheet and the factory calibration from device f1120648
  exposed that the earlier CAD registration mixed the RGB X-Y centre with the
  4.5 mm-recessed depth Z plane. The deployed transform now places the depth
  origin 4.5 mm behind the outer front-cover glass, keeps the depth axis normal
  to the straight-mounted housing, and composes the device's measured
  colour-to-depth extrinsic. The RGB origin is therefore 14.131 mm above and
  4.225 mm forward of the depth origin with the factory 1.322 degree relative
  rotation; it is not forced onto the depth plane or made artificially parallel.
validation_scope: >-
  fitting_residuals, held_out_validation, target_to_base, and
  fixed_board_validation.yaml describe the source hand-eye solution before the
  mechanical registration. The registered deployment transform was revalidated
  with the corrected 0.017 m/0.012 m stationary board on 2026-08-10 before
  powered mission motion; the named report below is the deployment authority.
